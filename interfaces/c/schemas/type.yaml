$schema: https://json-schema.org/draft/2020-12/schema
$id: bedrock://interfaces/c/schemas/type
type: object
additionalProperties: false
required: [id, owner, kind]
properties:
  id:
    type: string
    pattern: ^[a-z][a-z0-9_]*$
  owner:
    type: string
    pattern: ^(?:base|[A-Z][A-Z0-9_]*)$
  kind:
    enum: [enum, struct, scalable-vector, scalable-predicate, compound-scalable]
  summary:
    type: string
    minLength: 1
  values:
    type: object
  fields:
    type: array
    items:
      type: object
  layout:
    type: object
  binding:
    type: object

$schema: https://json-schema.org/draft/2020-12/schema
$id: bedrock://interfaces/c/schemas/utility
type: object
additionalProperties: false
required: [owner, body]
properties:
  owner:
    type: string
    pattern: ^(?:base|[A-Z][A-Z0-9_]*)$
  parameters:
    type: array
    items:
      type: string
      pattern: ^[a-z][a-z0-9_]*$
  body:
    type: string
    minLength: 1

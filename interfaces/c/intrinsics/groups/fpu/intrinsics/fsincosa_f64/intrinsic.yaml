id: fsincosa_f64
owner: FPTRANSA
description: >-
  FP and FPTRANSA required; writes sine through the first result pointer and cosine through the second; ISA accuracy, special-value, and floating-point event contracts apply to both results.
signature:
  result: void
  parameters:
  - id: value
    type: f64
  - id: sin_result
    type: f64_pointer
  - id: cos_result
    type: f64_pointer
lowering:
  operation: isa:FPTRANSA.instructions.FSINCOSA
  operands:
    size: D

owner: base
description: >-
  Supervisor; wrapper returns value and operation-defined \texttt{FLAGS} captured atomically; page walk without access to the translated C object.
signature:
  result: base.types.mmu.query_result
  parameters:
  - {id: address, type: u64}
lowering:
  operation: isa:base.instructions.VTOP
wrapper:
  kind: aggregate-result
  output-arguments:
  - value
  - flags

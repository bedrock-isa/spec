id: flush_dcache
owner: base
description: >-
  Supervisor; applies FLSHDCACHE to every CPUID maintenance block intersecting the range and fully clobbers memory.
summary: Flush each maintenance block intersecting an address range.
signature:
  result: void
  parameters:
  - {id: address, type: void_pointer}
  - {id: length, type: size}
lowering:
  operation: isa:base.instructions.FLSHDCACHE
  kind: cache-range
effects:
  c-memory: read-write
  scope: all

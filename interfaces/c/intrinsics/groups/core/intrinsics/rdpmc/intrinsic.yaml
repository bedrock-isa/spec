id: rdpmc
owner: base
description: >-
  Unprivileged; ID is a constant in 0 through 65535; zero and unavailable IDs fault with \texttt{INVALID\_SELECTOR}.
summary: Read an architectural performance counter.
signature:
  result: u64
  parameters:
  - id: counter
    type: base.types.core.performance_counter
    constant: true
lowering:
  operation: isa:base.instructions.RDPMC
  kind: direct
effects:
  c-memory: none
  side-effect: true
wrapper:
  kind: macro

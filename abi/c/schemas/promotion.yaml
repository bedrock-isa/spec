$schema: https://json-schema.org/draft/2020-12/schema
$id: bedrock://schemas/c-promotion
title: Bedrock C default argument promotion
type: object
additionalProperties: false
required: [id, source_kinds, target_kind]
properties:
  id: {type: string, pattern: '^[A-Z][A-Z0-9_]*$'}
  source_kinds:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
  target_kind: {type: string, pattern: '^[a-z][a-z0-9_]*$'}

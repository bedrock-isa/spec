$schema: https://json-schema.org/draft/2020-12/schema
$id: bedrock://schemas/c-calling-convention
title: Bedrock C calling convention
type: object
additionalProperties: false
required: [stack, preservation]
properties:
  stack:
    type: object
    additionalProperties: false
    required: [pointer, growth, entry_alignment_bytes, first_argument_offset_bytes, argument_slot_bytes, sret_register]
    properties:
      pointer: {$ref: '#/$defs/qualified-reference'}
      growth: {enum: [descending, ascending]}
      entry_alignment_bytes: {type: integer, minimum: 1}
      first_argument_offset_bytes: {type: integer, minimum: 0}
      argument_slot_bytes: {type: integer, minimum: 1}
      sret_register: {$ref: '#/$defs/qualified-reference'}
      red_zone_bytes: {type: integer, minimum: 0}
  preservation:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [registers, disposition]
      properties:
        registers:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/$defs/qualified-reference'}
        disposition: {enum: [caller_saved, callee_saved, special]}
$defs:
  qualified-reference:
    type: string
    pattern: '^[a-z][a-z0-9]*(?:\.[a-z][a-z0-9]*)*:(?:base|[A-Z][A-Z0-9_]*)(?:\.[A-Za-z][A-Za-z0-9_-]*)+$'

$schema: https://json-schema.org/draft/2020-12/schema
$id: bedrock://schemas/c-document-topic
title: Bedrock C ABI document topic
type: object
additionalProperties: false
required: [id, title, document, label, objects]
properties:
  id: {type: string, pattern: '^[A-Z][A-Z0-9_]*$'}
  title: {type: string, minLength: 1}
  document: {type: string, pattern: '^[A-Za-z0-9_-]+\.tex$'}
  label: {type: string, pattern: '^page:[a-z][a-z0-9-]*$'}
  objects:
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: '^[a-z][a-z0-9]*(?:\.[a-z][a-z0-9]*)*:(?:base|[A-Z][A-Z0-9_]*)(?:\.[A-Za-z][A-Za-z0-9_-]*)+$'

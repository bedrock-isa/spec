placement: Code, GOT, and PLT occupy one signed 32-bit relative window; data spans the 64-bit address space.
strategy: Direct code transfers and GOT-resolved 64-bit data addresses.
default_relocations:
- base.relocations.R_BEDROCK_BRDISP32S
- base.relocations.R_BEDROCK_CALL32S
- base.relocations.R_BEDROCK_GOTPCREL32S
- base.relocations.R_BEDROCK_GOT64
- base.relocations.R_BEDROCK_PLT32S
- base.relocations.R_BEDROCK_TLSDESC_GOTPCREL32S

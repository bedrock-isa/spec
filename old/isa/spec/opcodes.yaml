version: draft-v1

word_size: 16
max_instruction_words: 8

word0:
  prefix_present:
    bit: 15
    name: P
    description: Prefix-present bit. If set, word 1 is interpreted as the prefix word.
  length_minus_one:
    bits: [14, 12]
    name: L
    description: Total instruction length encoded as length minus one.
  payload:
    bits: [11, 0]
    name: primary opcode/fields
    description: Primary payload for compact operand fields or an extended opcode root.

opcode_spaces:
  primary:
    id: PRIMARY_PAYLOAD
    source: word0.payload
    reserved_unallocated_headroom_slots: 64
    extension_root_region:
      name: high_primary_payload
      start_fraction: [7, 8]
  extended:
    id: EXTENDED_OPCODE_WORD
    bits: 16

canonical_rules:
  - id: MOV_DREG_TO_DREG_CANONICAL
    canonical: MOV_EA_TO_D
    noncanonical: MOV_D_TO_EA
    when:
      source: DREG
      destination: DREG
    action: reject noncanonical form when strict canonical encoding is requested

reserved: []

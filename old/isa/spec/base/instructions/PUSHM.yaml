mnemonic: PUSHM
doc:
  title: Push Multiple
  summary: Push selected D0-D7 then A0-A7 registers according to bitmap order.
  instruction_family: data_movement
  instruction_class: data_movement
behavior:
  group: stack
  inputs:
  - regs
  output: none
  operation:
  - arch_pushm(regs_v);
  operation_text: >
    For each set bit in the bitmap, PUSHM pushes the corresponding 64-bit register value onto the stack. Registers are
    processed in increasing bitmap order, D0 through D7 followed by A0 through A7. Each selected register decrements SP by
    8 before storing the register value at the new SP.
attributes:
  privilege: unprivileged
allocation:
  catalog_section: compact_primary
  layout_group: PUSHM_POPM
  encoding:
  - id: PUSHM.BITMAP
    kind: compact
    start_payload: '0xf32'
    end_payload: '0xf32'
    slots: 1
    primary_bits: 0
    field_layout: none
    fields: []
forms:
  operands:
  - name: regs
    type: bitmap16
  bitmap:
    bits_0_7: D0-D7
    bits_8_15: A0-A7
  size_per_register: Q

mnemonic: MSUB
doc:
  title: Multiply Subtract
  summary: Subtracts the low-half product of a source operand and D register from a D accumulator.
  description: Subtracts the low-half product of the source operand and multiplier D register from the accumulator D 
    register. The source operand may use any effective-address form, including direct D-register EA forms. The 
    accumulator is always a D register and condition codes are unchanged.
  instruction_family: integer_mul_div
  instruction_class: integer
behavior:
  group: multiply_divide
  inputs:
  - multiplier
  - src
  input_output: acc
  operation:
  - acc_v = acc_v - (src_v * multiplier_v);
attributes:
  privilege: unprivileged
  flags: unchanged
allocation:
  catalog_section: integer
  layout_group: MULTIPLY_ACCUMULATE
  encoding:
  - id: MSUB.EA_TO_D_TO_D
    extension_root: EXT.integer_mac
    extension_root_payload: '0xf45'
    extension_family: integer_mac
    extended_opcode: 0x4000..0x7fff
    extended_opcode_start: '0x4000'
    extended_opcode_end: '0x7fff'
    extended_opcode_slots: 16384
    extended_opcode_bits: 14
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0], d:DREG[8:6], D:DREG[11:9], s:BWLQ[13:12]
    fields:
    - name: s
      kind: BWLQ
      source: size
      storage: descriptor
      width: 2
    - name: e
      kind: EA
      source: src
      storage: descriptor
      width: 6
    - name: d
      kind: DREG
      source: multiplier
      storage: descriptor
      width: 3
    - name: d
      kind: DREG
      source: acc
      storage: descriptor
      width: 3
    kind: extended
forms:
  extension_family: integer_mac
  operands:
  - name: src
    type: EA
  - name: multiplier
    type: DREG
  - name: acc
    type: DREG
  size: BWLQ
  compact: false
  result: accumulator receives the low half of the product

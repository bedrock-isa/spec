mnemonic: WRFSTATUS
doc:
  title: Write Floating-Point Status
  summary: Write the FPU status/control register from a D register.
  description: WRFSTATUS writes the architectural 16-bit FSTATUS register from the low 16 bits of the source D register.
    Reserved FSTATUS bits must be zero. FFLAGS is a separate accrued floating-point exception flag register and is not 
    written by WRFSTATUS. WRFSTATUS requires the floating-point extension.
  instruction_family: system_registers
  instruction_class: system
behavior:
  group: system_registers
  inputs:
  - src
  output: none
  operation:
  - FSTATUS = src_v;
attributes:
  privilege: unprivileged
  flags: writes FSTATUS from source bits
  cpuid_feature: OPTIONAL_EXTENSION_FEATURES.FP
allocation:
  catalog_section: system
  layout_group: FSTATUS_ACCESS
  encoding:
  - id: WRFSTATUS.D
    extension_root: EXT.system_core
    extension_root_payload: '0xf63'
    extension_family: system_core
    extended_opcode: 0x0148..0x014f
    extended_opcode_start: '0x0148'
    extended_opcode_end: '0x014f'
    extended_opcode_slots: 8
    extended_opcode_bits: 3
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: d:DREG[2:0]
    fields:
    - name: d
      kind: DREG
      source: src
      storage: descriptor
      width: 3
    kind: extended
forms:
  operands:
  - name: src
    type: DREG
  size: W

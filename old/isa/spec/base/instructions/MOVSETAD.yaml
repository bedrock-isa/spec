mnemonic: MOVSETAD
doc:
  title: Move D Registers To A Registers
  summary: Copies selected D registers from a data-register bank to matching A registers.
  description: Copies selected D registers to matching A registers. The one-operand form uses the current DBANK 
    selector. The banked form names an explicit source DBANK and does not change the current selector.
  instruction_family: data_movement
  instruction_class: data_movement
behavior:
  group: register_set_transfer
  inputs:
  - regs
  output: none
  operation_by_form:
  - operands: [BITMAP16]
    operation:
    - arch_movsetad(regs_v);
  - operands: [DBANK, BITMAP16]
    operation:
    - arch_movsetad_bank(src_bank_v, regs_v);
  operation_text: >
    MOVSETAD copies each selected D register to the matching A register. The one-operand form reads D[i] from the current
    data-register bank; the banked form reads D[i] from the explicitly named source DBANK. Bits 0 through 7 select register
    numbers 0 through 7.
  banked_forms: Current-bank forms and forms that name DBn explicitly are part of the base register-set transfer group. 
    Implementations report the number of available data-register banks through CPUID implementation properties.
attributes:
  privilege: unprivileged
allocation:
  catalog_section: compact_primary
  encoding:
  - id: MOVSETAD.BITMAP
    kind: compact
    start_payload: '0xf34'
    end_payload: '0xf34'
    slots: 1
    primary_bits: 0
    field_layout: none
    fields: []
  - id: MOVSETAD.DB_TO_BITMAP
    extension_root: EXT.data_register_banking
    extension_root_payload: '0xf4b'
    extension_family: data_register_banking
    extended_opcode: 0x0010..0x001f
    extended_opcode_start: '0x0010'
    extended_opcode_end: '0x001f'
    extended_opcode_slots: 16
    extended_opcode_bits: 4
    operand_payload_bits: 16
    operand_descriptor_words: 1
    operand_descriptor_spilled: false
    descriptor_layout: k:DBANK[3:0], b:bitmap16/16@payload
    fields:
    - name: k
      kind: DBANK
      source: src_bank
      storage: descriptor
      width: 4
    - name: b
      kind: bitmap16
      source: regs
      storage: payload
      width: 16
    kind: extended
forms:
  operands:
  - name: regs
    type: bitmap16
  extended_forms:
  - operands:
    - name: src_bank
      type: DBANK
    - name: regs
      type: bitmap16
    compact: false
    extension_family: data_register_banking
  valid_bits: 0..7

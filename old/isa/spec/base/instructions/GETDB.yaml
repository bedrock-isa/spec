mnemonic: GETDB
doc:
  title: Get Data Register Bank
  summary: Reads the current data-register bank selector into a D register.
  description: Reads the current DBANK selector into the destination D register. The result is zero-extended.
  instruction_family: data_register_banking
  instruction_class: data_movement
behavior:
  group: data_register_banking
  output: dst
  operation:
  - dst_v = DBANK & 0xf;
attributes:
  privilege: user allowed
allocation:
  catalog_section: integer
  layout_group: DATA_BANK_READ
  encoding:
  - id: GETDB.D
    extension_root: EXT.data_register_banking
    extension_root_payload: '0xf4b'
    extension_family: data_register_banking
    extended_opcode: 0x0000..0x0007
    extended_opcode_start: '0x0000'
    extended_opcode_end: '0x0007'
    extended_opcode_slots: 8
    extended_opcode_bits: 3
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: d:DREG[2:0]
    fields:
    - name: d
      kind: DREG
      source: dst
      storage: descriptor
      width: 3
    kind: extended
forms:
  operands:
  - name: dst
    type: DREG
  compact: false
  extension_family: data_register_banking

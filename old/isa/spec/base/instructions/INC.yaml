mnemonic: INC
doc:
  title: Increment
  summary: Performs the increment operation.
  instruction_family: integer_unary
  instruction_class: integer
behavior:
  group: integer_unary
  input_output: dst
  operation:
  - result_v = dst_v + 1;
  - dst_v = result_v;
  - ZF = result_v == 0;
  - NF = result_v s< 0;
  - CF = carry(dst_old_v, 1:8);
  - VF = scarry(dst_old_v, 1:8);
attributes:
  privilege: unprivileged
  prefix_availability:
  - SATURATE
  flags:
    Z: result == 0
    N: most_significant_bit(result)
    C: unsigned carry out
    V: signed overflow
allocation:
  catalog_section: compact_primary
  layout_group: INC_DEC
  encoding:
  - id: INC.D
    kind: compact
    start_payload: '0x1c0'
    end_payload: '0x1df'
    slots: 32
    primary_bits: 5
    field_layout: d[2:0] s[4:3] op[11:5]
    fields:
    - name: d
      kind: DREG
      source: dst
      storage: primary
      width: 3
      low_bit: 0
      high_bit: 2
      range: '[2:0]'
    - name: s
      kind: BWLQ
      source: size
      storage: primary
      width: 2
      low_bit: 3
      high_bit: 4
      range: '[4:3]'
  - id: INC.EA
    extension_root: EXT.integer_alu
    extension_root_payload: '0xf3c'
    extension_family: integer_alu
    extended_opcode: 0x4400..0x44ff
    extended_opcode_start: '0x4400'
    extended_opcode_end: '0x44ff'
    extended_opcode_slots: 256
    extended_opcode_bits: 8
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0], s:BWLQ[7:6]
    fields:
    - name: s
      kind: BWLQ
      source: size
      storage: descriptor
      width: 2
    - name: e
      kind: EA
      source: dst
      storage: descriptor
      width: 6
    kind: extended
forms:
  compact_forms:
  - operands:
    - name: dst
      type: DREG
  extended_forms:
  - operands:
    - name: dst
      type: EA
    compact: false
  size: BWLQ

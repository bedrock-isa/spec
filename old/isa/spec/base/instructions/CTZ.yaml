mnemonic: CTZ
doc:
  title: Count Trailing Zeros
  summary: Performs the count trailing zeros operation.
  description: Counts the trailing zero bits within the selected operand size and writes the count to the destination
    register. A zero operand returns the operand width in bits.
  instruction_family: integer_bitfield
  instruction_class: integer
behavior:
  group: bit_counts
  inputs:
  - src
  input_output: dst
  operation:
  - dst_v = arch_count_trailing_zeros(src_v, size_v);
attributes:
  privilege: unprivileged
  flags: unchanged
allocation:
  catalog_section: integer
  layout_group: BIT_COUNTS
  encoding:
  - id: CTZ.EA_TO_D
    extension_root: EXT.integer_bitfield
    extension_root_payload: '0xf46'
    extension_family: integer_bitfield
    extended_opcode: 0x4000..0x47ff
    extended_opcode_start: '0x4000'
    extended_opcode_end: '0x47ff'
    extended_opcode_slots: 2048
    extended_opcode_bits: 11
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0], d:DREG[8:6], s:BWLQ[10:9]
    fields:
    - name: s
      kind: BWLQ
      source: size
      storage: descriptor
      width: 2
    - name: e
      kind: EA
      source: src
      storage: descriptor
      width: 6
    - name: d
      kind: DREG
      source: dst
      storage: descriptor
      width: 3
    kind: extended
forms:
  operands:
  - name: src
    type: EA
  - name: dst
    type: DREG
  size: BWLQ
  zero_input: returns operand width

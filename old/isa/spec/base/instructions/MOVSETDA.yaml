mnemonic: MOVSETDA
doc:
  title: Move A Registers To D Registers
  summary: Copies selected A registers to matching D registers in a data-register bank.
  description: Copies selected A registers to matching D registers. The one-operand form uses the current DBANK 
    selector. The banked form names an explicit destination DBANK and does not change the current selector.
  instruction_family: data_movement
  instruction_class: data_movement
behavior:
  group: register_set_transfer
  inputs:
  - regs
  output: none
  operation_by_form:
  - operands: [BITMAP16]
    operation:
    - arch_movsetda(regs_v);
  - operands: [DBANK, BITMAP16]
    operation:
    - arch_movsetda_bank(dst_bank_v, regs_v);
  operation_text: >
    MOVSETDA copies each selected A register to the matching D register. The one-operand form writes D[i] in the current
    data-register bank; the banked form writes D[i] in the explicitly named destination DBANK. Bits 0 through 7 select
    register numbers 0 through 7.
  banked_forms: Current-bank forms and forms that name DBn explicitly are part of the base register-set transfer group. 
    Implementations report the number of available data-register banks through CPUID implementation properties.
attributes:
  privilege: unprivileged
allocation:
  catalog_section: compact_primary
  encoding:
  - id: MOVSETDA.BITMAP
    kind: compact
    start_payload: '0xf35'
    end_payload: '0xf35'
    slots: 1
    primary_bits: 0
    field_layout: none
    fields: []
  - id: MOVSETDA.DB_TO_BITMAP
    extension_root: EXT.data_register_banking
    extension_root_payload: '0xf4b'
    extension_family: data_register_banking
    extended_opcode: 0x0020..0x002f
    extended_opcode_start: '0x0020'
    extended_opcode_end: '0x002f'
    extended_opcode_slots: 16
    extended_opcode_bits: 4
    operand_payload_bits: 16
    operand_descriptor_words: 1
    operand_descriptor_spilled: false
    descriptor_layout: k:DBANK[3:0], b:bitmap16/16@payload
    fields:
    - name: k
      kind: DBANK
      source: dst_bank
      storage: descriptor
      width: 4
    - name: b
      kind: bitmap16
      source: regs
      storage: payload
      width: 16
    kind: extended
forms:
  operands:
  - name: regs
    type: bitmap16
  extended_forms:
  - operands:
    - name: dst_bank
      type: DBANK
    - name: regs
      type: bitmap16
    compact: false
    extension_family: data_register_banking
  valid_bits: 0..7

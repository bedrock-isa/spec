mnemonic: NEG
doc:
  title: Negate
  summary: Performs the negate operation.
  instruction_family: integer_unary
  instruction_class: integer
behavior:
  group: integer_unary
  input_output: dst
  operation:
  - result_v = 0 - dst_v;
  - dst_v = result_v;
  - ZF = result_v == 0;
  - NF = result_v s< 0;
  - CF = dst_old_v != 0;
  - VF = sborrow(0:8, dst_old_v);
attributes:
  privilege: unprivileged
  prefix_availability:
  - SATURATE
  flags:
    Z: result == 0
    N: most_significant_bit(result)
    C: unsigned borrow
    V: signed overflow
allocation:
  catalog_section: compact_primary
  layout_group: NEG_ABS
  encoding:
  - id: NEG.D
    kind: compact
    start_payload: '0xe80'
    end_payload: '0xe9f'
    slots: 32
    primary_bits: 5
    field_layout: d[2:0] s[4:3] op[11:5]
    fields:
    - name: d
      kind: DREG
      source: dst
      storage: primary
      width: 3
      low_bit: 0
      high_bit: 2
      range: '[2:0]'
    - name: s
      kind: BWLQ
      source: size
      storage: primary
      width: 2
      low_bit: 3
      high_bit: 4
      range: '[4:3]'
  - id: NEG.EA
    extension_root: EXT.integer_alu
    extension_root_payload: '0xf3c'
    extension_family: integer_alu
    extended_opcode: 0x4600..0x46ff
    extended_opcode_start: '0x4600'
    extended_opcode_end: '0x46ff'
    extended_opcode_slots: 256
    extended_opcode_bits: 8
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0], s:BWLQ[7:6]
    fields:
    - name: s
      kind: BWLQ
      source: size
      storage: descriptor
      width: 2
    - name: e
      kind: EA
      source: dst
      storage: descriptor
      width: 6
    kind: extended
forms:
  compact_forms:
  - operands:
    - name: dst
      type: DREG
  extended_forms:
  - operands:
    - name: dst
      type: EA
    compact: false
  size: BWLQ

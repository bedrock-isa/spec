mnemonic: XCHGSETDD
doc:
  title: Exchange D Register Sets Between Banks
  summary: Swaps selected D registers between two data-register banks.
  description: Swaps selected D registers between two explicitly named DBANK values according to the bitmap operand. The
    current DBANK selector is not changed.
  instruction_family: data_register_banking
  instruction_class: data_movement
behavior:
  group: data_register_banking
  inputs:
  - bank_a
  - bank_b
  - regs
  output: none
  operation:
  - arch_xchgsetdd(bank_a_v, bank_b_v, regs_v);
  operation_text: >
    XCHGSETDD swaps each selected D register between the two explicitly named data-register banks. Bits 0 through 7
    select D0 through D7 respectively. The current DBANK selector is not changed.
attributes:
  privilege: unprivileged
allocation:
  catalog_section: integer
  layout_group: DATA_BANK_SET_EXCHANGE
  encoding:
  - id: XCHGSETDD.DB_TO_DB_TO_BITMAP
    extension_root: EXT.data_register_banking
    extension_root_payload: '0xf4b'
    extension_family: data_register_banking
    extended_opcode: 0x0200..0x02ff
    extended_opcode_start: '0x0200'
    extended_opcode_end: '0x02ff'
    extended_opcode_slots: 256
    extended_opcode_bits: 8
    operand_payload_bits: 16
    operand_descriptor_words: 1
    operand_descriptor_spilled: false
    descriptor_layout: k:DBANK[3:0], K:DBANK[7:4], b:bitmap16/16@payload
    fields:
    - name: k
      kind: DBANK
      source: bank_a
      storage: descriptor
      width: 4
    - name: k
      kind: DBANK
      source: bank_b
      storage: descriptor
      width: 4
    - name: b
      kind: bitmap16
      source: regs
      storage: payload
      width: 16
    kind: extended
forms:
  operands:
  - name: bank_a
    type: DBANK
  - name: bank_b
    type: DBANK
  - name: regs
    type: bitmap16
  compact: false
  extension_family: data_register_banking
  valid_bits: 0..7

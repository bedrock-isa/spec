mnemonic: RDCR
doc:
  title: Read Control Register
  summary: Read a privileged control register.
  description: Read a privileged control register. RDCR is always a supervisor-only instruction; user-visible control 
    state must use dedicated instructions gated by control-register policy bits.
  instruction_family: system_registers
  instruction_class: system
behavior:
  group: system_registers
  inputs:
  - cr
  output: dst
  control_register_access:
    selector: cr
    read: dst
attributes:
  privilege: supervisor
  flags: unchanged
allocation:
  catalog_section: system
  layout_group: CONTROL_REGISTER_ACCESS
  encoding:
  - id: RDCR.D
    extension_root: EXT.system_core
    extension_root_payload: '0xf63'
    extension_family: system_core
    extended_opcode: 0x0000..0x0007
    extended_opcode_start: '0x0000'
    extended_opcode_end: '0x0007'
    extended_opcode_slots: 8
    extended_opcode_bits: 3
    operand_payload_bits: 16
    operand_descriptor_words: 1
    operand_descriptor_spilled: false
    descriptor_layout: d:DREG[2:0], i:CR/16@payload
    fields:
    - name: i
      kind: CR
      source: cr
      storage: payload
      width: 16
    - name: d
      kind: DREG
      source: dst
      storage: descriptor
      width: 3
    kind: extended
forms:
  operands:
  - name: cr
    type: CR
  - name: dst
    type: DREG

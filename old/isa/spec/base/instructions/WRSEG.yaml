mnemonic: WRSEG
doc:
  title: Write Segment Register
  summary: Write a segment register image from a D register.
  description: WRSEG writes a 64-bit segment register image from the source D register to an S-class segment register. 
    The S operand selector encoding is defined by the SREG selector table. General writes to CS are illegal; use LJMP, 
    LCALL, LRET, SYSRET, or IRET for CS-changing control transfer.
  instruction_family: system_registers
  instruction_class: system
behavior:
  group: system_registers
  inputs:
  - src
  output: seg
  operation:
  - seg_v = src_v;
attributes:
  privilege: policy controlled
  flags: unchanged
allocation:
  catalog_section: system
  layout_group: SEGMENT_REGISTER_ACCESS
  encoding:
  - id: WRSEG.D_TO_S
    extension_root: EXT.system_core
    extension_root_payload: '0xf63'
    extension_family: system_core
    extended_opcode: 0x0080..0x00bf
    extended_opcode_start: '0x0080'
    extended_opcode_end: '0x00bf'
    extended_opcode_slots: 64
    extended_opcode_bits: 6
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: d:DREG[2:0], g:SREG[5:3]
    fields:
    - name: d
      kind: DREG
      source: src
      storage: descriptor
      width: 3
    - name: g
      kind: SREG
      source: seg
      storage: descriptor
      width: 3
    kind: extended
forms:
  operands:
  - name: src
    type: DREG
  - name: seg
    type: SREG
  size: Q
  note: general writes to CS are illegal; use CS-changing control transfer instructions

version: draft-v1

# Instruction semantic catalogs. Concrete opcode bit patterns are generated by
# isa/tools/alloc_z3.py from this declarative catalog, ea.yaml, and opcodes.yaml.
# This file intentionally does not contain hand-authored instruction patterns.
operand_schema:
  role_name_pattern: ^[a-z][a-z0-9_]*$
  types:
  - AREG
  - DBANK
  - DREG
  - DREG_OR_AREG
  - EA
  - EA_or_range
  - FREG
  - fbitmap16
  - CR
  - SPREG
  - SREG
  - bitmap16
  - condition
  - imm
  - imm6
  - imm16
  - imm32
  - imm64
  - linear_or_EA
  - memory_order
  - outputs
  - relative_imm
  - selector
  - selector_imm6
  immediate_operands:
    imm6:
      width: 6
      signed: false
      range: [0, 63]
      operation_size_extension: zero_extend
      applies_when: integer forms with an explicit B/W/L/Q operation size
      description: Inline 6-bit immediate literals are unsigned values. When the instruction operation size is wider than 6 bits, the immediate value is zero-extended to the operation size before use.
  condition_role: cc
  selector_roles:
  - count
  - bit_index
  - offset
  - width
  size_codes:
    B:
      suffix: .B
      bytes: 1
      label: Byte
    W:
      suffix: .W
      bytes: 2
      label: Word
    L:
      suffix: .L
      bytes: 4
      label: Long
    Q:
      suffix: .Q
      bytes: 8
      label: Quad
    S:
      suffix: .S
      bytes: 4
      label: Single
    D:
      suffix: .D
      bytes: 8
      label: Double
  size_kinds:
    BWLQ:
      field: s
      values:
      - {value: 0, code: B}
      - {value: 1, code: W}
      - {value: 2, code: L}
      - {value: 3, code: Q}
    LQ:
      field: z
      values:
      - {value: 0, code: L}
      - {value: 1, code: Q}
    WL:
      field: z
      values:
      - {value: 0, code: W}
      - {value: 1, code: L}
    BW:
      field: s
      values:
      - {value: 0, code: B}
      - {value: 1, code: W}
    BWL:
      field: s
      values:
      - {value: 0, code: B}
      - {value: 1, code: W}
      - {value: 2, code: L}
      reserved_values:
      - {value: 3, name: invalid}
    BWLX:
      field: s
      values:
      - {value: 0, code: B}
      - {value: 1, code: W}
      - {value: 2, code: L}
      reserved_values:
      - {value: 3, name: invalid}
    S_D:
      field: z
      values:
      - {value: 0, code: S}
      - {value: 1, code: D}
  named_values:
    memory_order:
      width: 3
      values:
      - value: 0
        name: RELAXED
        description: Atomicity only. No ordering is imposed on unrelated memory operations.
      - value: 1
        name: ACQUIRE
        description: Later memory operations by the same hardware thread are ordered after the atomic operation.
      - value: 2
        name: RELEASE
        description: Earlier memory operations by the same hardware thread are ordered before the atomic operation.
      - value: 3
        name: ACQREL
        description: Applies both acquire and release ordering.
      - value: 4
        name: SEQCST
        description: Applies acquire-release ordering and participates in the global sequentially consistent order for atomic operations.
      reserved_values:
      - value: 5
        name: RESERVED5
        description: Reserved selector encoding; using it is invalid for the atomic form.
      - value: 6
        name: RESERVED6
        description: Reserved selector encoding; using it is invalid for the atomic form.
      - value: 7
        name: RESERVED7
        description: Reserved selector encoding; using it is invalid for the atomic form.
  bitmap_operands:
    bitmap16:
      width: 16
      ranges:
      - {bits: [0, 7], register_class: D}
      - {bits: [8, 15], register_class: A}
    fbitmap16:
      width: 16
      ranges:
      - {bits: [0, 15], register_class: F}

allocation:
  semantic_sections:
  - path: integer_instructions
    category: integer
    default_weight: 70
  - path: atomic_system_cache_instructions
    category: system
    default_weight: 55
  - path: fpu.instructions
    category: fpu
    default_weight: 45
  compactness_policy:
    exclude:
    - FPU
    - cache_management
    - tlb_management
    - system_core_except_core_control
    - transcendental_fpu
    prefer:
    - D_D_integer_alu
    - MOV_LQ_EA_D
    - MOV_LQ_D_EA
    - INC_DEC_D
    - PUSH_POP
    - Jcc
    - CALL
    - RET
    - NOP
    - SYSCALL
    - BKPT
    - WAIT
    - YIELD
    - fences
  extension_family_order:
  - integer_alu
  - integer_alu_reg_ea_wide
  - integer_alu_imm_ea_arith_wide
  - integer_alu_imm_ea_logic_wide
  - integer_alu_cmp_ea_wide
  - integer_extend_ea_wide
  - integer_bounds
  - integer_bounds_signed
  - integer_bounds_unsigned
  - integer_mul_div
  - integer_mac
  - integer_bitfield
  - integer_bitfield_bit_imm
  - integer_bitfield_rotate_imm
  - integer_bitfield_shift_imm
  - data_movement
  - data_register_banking
  - ea_utility
  - control_flow
  - conditional_control
  - atomic_memory
  - cache_hint
  - tlb_cache
  - system_core
  - virtualization_acceleration
  - fpu_move_compare
  - fpu_arithmetic_ea_wide
  - fpu_arithmetic
  - fpu_transcendental
  - misc
  extension_profile_order:
    integer_alu:
    - EA_TO_D
    - EA_TO_A
    - D_TO_EA
  extension_member_order:
    conditional_control:
    - DJcc.D_TO_EA
    - FMOVcc.F_TO_F
    - Jcc.EA.WL
    - TRAPcc
    - SETcc.EA
    - MOVcc.A_TO_EA
    - MOVcc.D_TO_EA
    - IJcc.D_TO_D_TO_EA
    - MOVcc.EA_TO_A
    - MOVcc.EA_TO_D
    - FMOVcc.EA_TO_F
    - FMOVcc.F_TO_EA
  family_locality:
    integer_alu:
      prefer_contiguous_roots: true
      roots: [EA_TO_D, EA_TO_A, D_TO_EA]
  decode_cost_policy:
    priority_order:
    - aligned_large_ranges
    - shared_field_layout
    - family_locality
    - fewer_singletons
    - compact_hot_path
    - visual_symmetry
  extension_root_policy:
    preferred_region: high_primary_payload
    prefer_contiguous_family_roots: true
    allow_low_payload_roots: false
  mnemonic_policy:
    core_control_compact_mnemonics: [HALT, ILLEGAL, RESET, SYSRET, IRET, NOP, SYSCALL, BKPT, WAIT, YIELD, RFENCE, WFENCE, AFENCE]
    cache_management_mnemonics: [PREFETCH, INVDCACHE, INVICACHE, FLSHDCACHE, WRBKDCACHE, SYNCCACHE]
    tlb_management_mnemonics: [SWPT, SWPTA, VTOP, PTATTR, PTQUERY, INVTLB, INVPAGE, INVASID]
    fence_mnemonics: [RFENCE, WFENCE, AFENCE]
    integer_minmax_order: [MINU, MINS, MAXU, MAXS]
    integer_mul_div_compact_order: [MULU, MULS, DIVU, DIVS, MODU, MODS]
  frequency_model:
    description: Estimated relative dynamic frequency and code-density value used by the opcode allocator.
      Weights are relative tuning parameters, not cycle-accurate measurements.
    default_weight_by_category:
      data_movement: 2200
      integer: 900
      control_flow: 1800
      system: 80
      fpu: 120
      misc: 60
    rules:
    - id: MOV_LQ_EA_TO_D
      match:
        mnemonic: MOV
        profile: EA_TO_D
        size: LQ
      weight: 120000
      compact: required
      reason: hot load/register-move fast path
    - id: MOV_LQ_D_TO_EA
      match:
        mnemonic: MOV
        profile: D_TO_EA
        size: LQ
      weight: 120000
      compact: required
      reason: hot store/register-move fast path
    - id: MOV_Q_IMM_TO_A
      match:
        mnemonic: MOV
        profile: IMM_TO_A
      weight: 30000
      reason: direct address-constant materialization is cheap in primary space
    - id: INTEGER_ALU_D_TO_D
      match:
        category: integer
        profile: D_TO_D
      weight: 18000
      reason: hot register-register ALU path
    - id: INTEGER_LOGIC_IMM_TO_D
      match:
        mnemonic:
        - AND
        - OR
        - XOR
        profile: IMM_TO_D
        size: WL
      weight: 40000
      compact: required
      reason: compact logical immediates avoid EA-immediate descriptor overhead in mask-heavy code
    - id: INTEGER_COMPARE_ARITH_IMM_TO_D
      match:
        mnemonic:
        - ADD
        - SUB
        - TEST
        - CMP
        profile: IMM_TO_D
        size: WL
      weight: 40000
      compact: required
      reason: reclaimed MOV register-destination primary space is used for compact W/L arithmetic and compare immediates
    - id: EXTZQ_D_TO_D_FAST_PATH
      match:
        mnemonic:
        - EXTSQ
        - EXTZQ
        profile: D_TO_D
        size: BWL
      weight: 26000
      compact: required
      reason: full-register sign/zero extension is a common fast-path conversion
    - id: CLR_AREG
      match:
        mnemonic: CLR
        profile: A
      weight: 20000
      compact: required
      reason: zero-base address registers are useful for LEA-based address arithmetic
    - id: COMPACT_CONTROL_FLOW
      match:
        category: control_flow
      weight: 14000
      reason: branch/call density
    - id: LONG_CONTROL_FLOW
      match:
        mnemonic:
        - LJMP
        - LCALL
        - LRET
      weight: 500
      compact: never
      reason: CS-changing far transfers are important but not compact hot-path instructions
    - id: STACK_REGISTER
      match:
        semantic_family: PUSH_POP
        profile:
        - D
        - A
      weight: 9000
      compact: required
      reason: push/pop register density
    - id: BITMAP_REGISTER_SET
      match:
        mnemonic:
        - PUSHM
        - POPM
        - MOVSETAD
        - MOVSETDA
        - XCHGSETAD
        - XCHGSETDA
        profile: BITMAP
      weight: 9000
      compact: required
      reason: register-set bitmap forms are one-slot primary-cluster operations
    - id: EA_UTILITY
      match:
        semantic_family: ea_utility
      weight: 1200
      reason: useful but lower frequency than MOV/ALU/control fast paths
    - id: BOUNDS_RRR
      match:
        semantic_family:
        - bounds_unsigned
        - bounds_signed
        profile: D_TO_EA_TO_D
      weight: 300
      reason: bounds checks should not evict core data movement
    - id: FPU
      match:
        category: fpu
      weight: 100
      compact: never
      reason: FPU forms live behind extension roots
    - id: SYSTEM_AND_CACHE
      match:
        category: system
      weight: 80
      compact: never
      reason: rare system/cache/TLB operations should not consume primary payload
    - id: CORE_CONTROL_COMPACT
      match:
        semantic_family: core_control
      weight: 120
      compact: required
      reason: core-control no-operand operations are compact primary operations
  extension_roots:
    group_by: semantic_family
    condition_field_in_primary: true
    preferred_region: high_primary_payload
    allow_low_payload_roots: false
  extension_family_rules:
  - match:
      mnemonic:
      - ADC
      - ADD
      profile:
      - D_TO_EA
      - EA_TO_D
    extension_family: integer_alu_reg_ea_wide
  - match:
      mnemonic: AND
      profile: D_TO_EA
    extension_family: integer_alu_reg_ea_wide
  - match:
      mnemonic:
      - ADC
      - ADD
      - SBB
      - SUB
      profile: IMM_TO_EA
    extension_family: integer_alu_imm_ea_arith_wide
  - match:
      mnemonic:
      - AND
      - OR
      - TEST
      - XOR
      profile: IMM_TO_EA
    extension_family: integer_alu_imm_ea_logic_wide
  - match:
      mnemonic: CMP
      profile:
      - EA_TO_EA
      - IMM_TO_EA
    extension_family: integer_alu_cmp_ea_wide
  - match:
      mnemonic:
      - EXTSL
      - EXTSQ
      - EXTSW
      - EXTZL
      - EXTZQ
      - EXTZW
      profile: EA_TO_EA
    extension_family: integer_extend_ea_wide
  - match:
      group: BIT_OPS
      profile: I6_TO_EA
    extension_family: integer_bitfield_bit_imm
  - match:
      group: ROTATES
      profile: I6_TO_EA
    extension_family: integer_bitfield_rotate_imm
  - match:
      group: SHIFTS
      profile: I6_TO_EA
    extension_family: integer_bitfield_shift_imm
  - match:
      mnemonic:
      - FABS
      - FADD
      profile:
      - EA_TO_F
      - F_TO_EA
    extension_family: fpu_arithmetic_ea_wide
  primary_clusters:
    order:
    - bitmap_ops
    - direct_call
    - stack_ops
    - core_control
  condition_field:
    reclaim_never_taken:
      mnemonics:
      - Jcc
      condition_value: 1
      reason: JF is semantically equivalent to falling through and can be reclaimed
  field_reclaim:
    invalid_values:
    - match:
        mnemonic:
        - EXTSQ
        - EXTZQ
        profile: D_TO_D
        size: BWL
      field_source: size
      values:
      - 3
      reason: Q-to-Q extension has no architectural effect and its size-field encoding is reclaimed
    - match:
        mnemonic: MOV
        profile: D_TO_EA
        size: LQ
      field_source: dst
      values:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      reason: MOV DREG to DREG is canonicalized through MOV.EA_TO_D, so the DREG destination subrange is reclaimed
  field_layout:
    overrides:
    - match:
        mnemonic:
        - ADD
        - SUB
        - TEST
        - CMP
        profile: IMM_TO_D
        size: WL
      field_positions:
      - signature: REG3
        low_bit: 6
        reason: align destination register with the reclaimed MOV.D_TO_EA source-register lane
      - signature: SIZE1
        low_bit: 9
        reason: align W/L size with the reclaimed MOV.D_TO_EA size lane
      reason: place compact W/L immediate-to-D forms into MOV.D_TO_EA DREG-destination reclaimed primary lanes
    anchor_strategy:
      format_order: largest_variable_payload_first
      placement: first_fit_with_existing_lanes
      fixed_signatures:
      - EA6
    explicit_signature_order:
    - COND4
    - EA6
    - REG3
    - REG3#2
    - EA6#2
    - FREG:4
    - FREG:4#2
    - FREG:4#3
    - SEL6
    - SEL4
    - DBANK:4
    - SIZE2
    - IMM6:6
    - SIZE1
    field_score:
      formula: candidate_weight_times_field_width
      default_multiplier: 1
      signature_multipliers:
        default: 1
        COND4: 8
    subfield_affinities:
    - name: EA_low_register_bits
      container_signature: EA6
      subfield_signature: REG3
      offset: 0
      width: 3
      score_multiplier: 1
      reason: compact EA register-addressing forms carry the register number in the low 3 bits

include:
  - base/save_restore_area.yaml
  - base/instructions.yaml
  - extensions/fpu/instructions.yaml
  - extensions/fpu_transcendental/instructions.yaml
  - extensions/virtualization_acceleration/instructions.yaml

mnemonic: FPOPM
doc:
  title: Floating-Point Pop Multiple
  summary: Pop selected F15-F0 registers in inverse bitmap order.
  description: Pop selected F15-F0 registers in inverse bitmap order. Bit n names Fn.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_stack
  inputs:
  - regs
  output: none
  operation:
  - arch_fpopm(regs_v);
  operation_text: >
    For each set bit in the bitmap, FPOPM pops one 64-bit stack slot into the corresponding F register. F registers are
    processed in inverse order from F15 through F0. Each selected register is loaded from SP before SP is incremented by 8.
attributes:
  privilege: unprivileged
allocation:
  catalog_section: fpu
  layout_group: FPUSHM_FPOPM
  encoding:
  - id: FPOPM.BITMAP
    extension_root: EXT.fpu_arithmetic
    extension_root_payload: '0xf67'
    extension_family: fpu_arithmetic
    extended_opcode: '0x0425'
    extended_opcode_start: '0x0425'
    extended_opcode_end: '0x0425'
    extended_opcode_slots: 1
    extended_opcode_bits: 0
    operand_payload_bits: 16
    operand_descriptor_words: 1
    operand_descriptor_spilled: false
    descriptor_layout: b:fbitmap16/16@payload
    fields:
    - name: b
      kind: fbitmap16
      source: regs
      storage: payload
      width: 16
    kind: extended
forms:
  operands:
  - name: regs
    type: fbitmap16
  bitmap:
    bits_0_15: F0-F15
  size_per_register: Q

mnemonic: FCOPYSIGN
doc:
  title: Floating-Point Copy Sign
  summary: Performs the floating-point copy sign operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs:
  - sign_src
  - magnitude_src
  output: dst
  operation:
  - if (size_v != 4) goto <fcopysign_double>;
  - dst_v = (magnitude_src_v & 0x7fffffff) | (sign_src_v & 0x80000000);
  - goto <fcopysign_done>;
  - <fcopysign_double>
  - dst_v = (magnitude_src_v & 0x7fffffffffffffff) | (sign_src_v & 0x8000000000000000);
  - <fcopysign_done>
attributes:
  privilege: unprivileged
  fp_flags: unchanged
allocation:
  catalog_section: fpu
  encoding:
  - id: FCOPYSIGN.F_TO_F_TO_F
    extension_root: EXT.fpu_arithmetic
    extension_root_payload: '0xf67'
    extension_family: fpu_arithmetic
    extended_opcode: '0x0408'
    extended_opcode_start: '0x0408'
    extended_opcode_end: '0x0408'
    extended_opcode_slots: 1
    extended_opcode_bits: 0
    operand_payload_bits: 13
    operand_descriptor_words: 1
    operand_descriptor_spilled: true
    descriptor_layout: f:FREG/4@payload, F:FREG/4@payload, f3:FREG/4@payload, z:S_D/1@payload
    fields:
    - name: z
      kind: S_D
      source: size
      storage: descriptor
      width: 1
    - name: f
      kind: FREG
      source: sign_src
      storage: descriptor
      width: 4
    - name: f
      kind: FREG
      source: magnitude_src
      storage: descriptor
      width: 4
    - name: f
      kind: FREG
      source: dst
      storage: descriptor
      width: 4
    kind: extended
forms:
  operands:
  - name: sign_src
    type: FREG
  - name: magnitude_src
    type: FREG
  - name: dst
    type: FREG
  size: S_D

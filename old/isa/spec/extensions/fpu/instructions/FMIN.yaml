mnemonic: FMIN
doc:
  title: Floating-Point Minimum
  summary: Performs the floating-point minimum operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs:
  - src
  input_output: dst
  operation:
  - if (dst_v f< src_v) goto <fmin_done>;
  - dst_v = src_v;
  - <fmin_done>
attributes:
  privilege: unprivileged
  streaming_candidate: true
  fp_flags:
    update_when_required:
    - NV
allocation:
  catalog_section: fpu
  layout_group: FMIN_FMAX
  encoding:
  - id: FMIN.EA_TO_F
    extension_root: EXT.fpu_arithmetic
    extension_root_payload: '0xf67'
    extension_family: fpu_arithmetic
    extended_opcode: 0x7800..0x7fff
    extended_opcode_start: '0x7800'
    extended_opcode_end: '0x7fff'
    extended_opcode_slots: 2048
    extended_opcode_bits: 11
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0], f:FREG[9:6], z:S_D[10]
    fields:
    - name: z
      kind: S_D
      source: size
      storage: descriptor
      width: 1
    - name: e
      kind: EA
      source: src
      storage: descriptor
      width: 6
    - name: f
      kind: FREG
      source: dst
      storage: descriptor
      width: 4
    kind: extended
  - id: FMIN.F_TO_F
    extension_root: EXT.fpu_arithmetic
    extension_root_payload: '0xf67'
    extension_family: fpu_arithmetic
    extended_opcode: 0x5e00..0x5fff
    extended_opcode_start: '0x5e00'
    extended_opcode_end: '0x5fff'
    extended_opcode_slots: 512
    extended_opcode_bits: 9
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: f:FREG[3:0], F:FREG[7:4], z:S_D[8]
    fields:
    - name: z
      kind: S_D
      source: size
      storage: descriptor
      width: 1
    - name: f
      kind: FREG
      source: src
      storage: descriptor
      width: 4
    - name: f
      kind: FREG
      source: dst
      storage: descriptor
      width: 4
    kind: extended
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  size: S_D
  nan_policy: defined by the floating-point model

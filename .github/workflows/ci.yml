name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate ISA spec
        run: make validate

      - name: Generate allocation
        run: make allocation

      - name: Build QBE Bedrock backend
        run: make qbe-bedrock

      - name: Run assembler/disassembler smoke tests
        run: make asm-disasm-smoke bedrock-as-smoke

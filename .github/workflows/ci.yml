name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate reference documents
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.8"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-extra-utils

      - name: Compile and validate the complete document set
        run: make docs-site

      - name: Upload Programmer's Reference Manual
        uses: actions/upload-artifact@v7
        with:
          path: output/pdf/isa-reference.pdf
          archive: false
          if-no-files-found: error

      - name: Upload Bedrock ELF ABI
        uses: actions/upload-artifact@v7
        with:
          path: output/pdf/bedrock-elf-abi.pdf
          archive: false
          if-no-files-found: error

      - name: Upload Bedrock C ABI
        uses: actions/upload-artifact@v7
        with:
          path: output/pdf/bedrock-c-abi.pdf
          archive: false
          if-no-files-found: error

      - name: Upload target intrinsics
        uses: actions/upload-artifact@v7
        with:
          path: output/pdf/bedrock-target-intrinsics.pdf
          archive: false
          if-no-files-found: error

      - name: Upload reference site
        uses: actions/upload-artifact@v7
        with:
          name: reference-site
          path: output/site
          if-no-files-found: error
          include-hidden-files: true

  test:
    name: Run PR regression and decoder checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out Bedrock LLVM
        uses: actions/checkout@v6
        with:
          repository: bedrock-isa/llvm-project
          ref: 6f3a8ee88b70553e22e6d77c0cad57d23ca9fa77
          path: llvm-project

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up current stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt --toolchain stable

      - name: Install Sail
        env:
          SAIL_VERSION: "0.20.1"
          SAIL_SHA256: aae38b01b582c0df8810d4fd5b2abb19c20bb91b5592deb42a5af443a1085855
        run: |
          set -euo pipefail

          archive="${RUNNER_TEMP}/sail-${SAIL_VERSION}.tar.gz"
          install_dir="${RUNNER_TEMP}/sail"
          curl --fail --location --silent --show-error \
            "https://github.com/rems-project/sail/releases/download/${SAIL_VERSION}/sail-Linux-x86_64.tar.gz" \
            --output "${archive}"
          echo "${SAIL_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          chmod +x "${install_dir}/bin/sail" "${install_dir}/bin/z3"
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"
          env PATH="${install_dir}/bin:${PATH}" sail --version

      - name: Install emulator and hardware test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache cmake libgmp-dev ninja-build verilator

      - name: Synchronize generated Bedrock LLVM inputs
        run: python tools/sync_llvm_artifacts.py llvm-project

      - name: Restore Bedrock LLVM compiler cache
        id: llvm-ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/bedrock-ccache
          key: bedrock-llvm-ccache-${{ runner.os }}-${{ runner.arch }}-6f3a8ee88b70553e22e6d77c0cad57d23ca9fa77-${{ hashFiles('llvm-project/llvm/lib/Target/Bedrock/BedrockGenISACatalog.td', 'llvm-project/llvm/include/llvm/BinaryFormat/ELFRelocs/Bedrock.def', 'llvm-project/llvm/include/llvm/BinaryFormat/BedrockGenELFABI.inc', 'llvm-project/llvm/include/llvm/TargetParser/BedrockGenCallingConv.td', 'llvm-project/llvm/include/llvm/TargetParser/BedrockGenCABI.inc') }}
          restore-keys: |
            bedrock-llvm-ccache-${{ runner.os }}-${{ runner.arch }}-6f3a8ee88b70553e22e6d77c0cad57d23ca9fa77-

      - name: Build Bedrock LLVM tools
        env:
          CCACHE_DIR: ${{ runner.temp }}/bedrock-ccache
        run: |
          ccache --max-size=2G
          ccache --zero-stats
          cmake -S llvm-project/llvm \
            -B "${RUNNER_TEMP}/bedrock-llvm" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_EXPERIMENTAL_TARGETS_TO_BUILD=Bedrock \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_TARGETS_TO_BUILD=""
          cmake --build "${RUNNER_TEMP}/bedrock-llvm" \
            --target clang lld llvm-mc llvm-objcopy llvm-objdump llvm-readelf
          ccache --show-stats

      - name: Save Bedrock LLVM compiler cache
        if: steps.llvm-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/bedrock-ccache
          key: ${{ steps.llvm-ccache.outputs.cache-primary-key }}

      - name: Run canonical PR test gate
        env:
          BEDROCK_LLVM_BIN: ${{ runner.temp }}/bedrock-llvm/bin
          LLVM_PROJECT_ROOT: ${{ github.workspace }}/llvm-project
          OUTPUT_ROOT: ${{ runner.temp }}/bedrock-output
          EMULATOR_TARGET_DIR: ${{ runner.temp }}/bedrock-emulator-target
          TMPDIR: ${{ runner.temp }}
        run: make test-pr

  publish:
    name: Update gh-pages publication branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          repository: bedrock-isa/spec
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download validated reference site
        uses: actions/download-artifact@v8
        with:
          name: reference-site
          path: output/site

      - name: Publish to gh-pages
        env:
          PUBLISH_BRANCH: gh-pages
        run: |
          set -euo pipefail

          test -f output/site/index.html
          test -f output/site/.nojekyll

          test -n "${RUNNER_TEMP:-}"
          publish_dir="$(mktemp -d "${RUNNER_TEMP}/bedrock-pages.XXXXXX")"
          case "${publish_dir}" in
            "${RUNNER_TEMP}"/bedrock-pages.*) ;;
            *) echo "Unsafe publication worktree: ${publish_dir}" >&2; exit 1 ;;
          esac

          cleanup() {
            git worktree remove --force "${publish_dir}" >/dev/null 2>&1 || true
            rmdir "${publish_dir}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          if git ls-remote --exit-code --heads origin \
            "refs/heads/${PUBLISH_BRANCH}" >/dev/null 2>&1; then
            git fetch --quiet --no-tags origin \
              "refs/heads/${PUBLISH_BRANCH}:refs/remotes/origin/${PUBLISH_BRANCH}"
            git worktree add --quiet -B "${PUBLISH_BRANCH}" "${publish_dir}" \
              "origin/${PUBLISH_BRANCH}"
          else
            git worktree add --quiet --detach "${publish_dir}" HEAD
            git -C "${publish_dir}" switch --quiet --orphan "${PUBLISH_BRANCH}"
            git -C "${publish_dir}" rm -rf --ignore-unmatch .
          fi

          rsync -a --delete --exclude=.git output/site/ "${publish_dir}/"
          git -C "${publish_dir}" config user.name "github-actions[bot]"
          git -C "${publish_dir}" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${publish_dir}" add --all

          if git -C "${publish_dir}" diff --cached --quiet; then
            echo "gh-pages already matches ${GITHUB_SHA}"
            exit 0
          fi

          git -C "${publish_dir}" commit --quiet -m "docs: publish ${GITHUB_SHA}"
          git -C "${publish_dir}" push --quiet origin "${PUBLISH_BRANCH}"

  deploy:
    name: Deploy reference site to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download validated reference site
        uses: actions/download-artifact@v8
        with:
          name: reference-site
          path: output/site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output/site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

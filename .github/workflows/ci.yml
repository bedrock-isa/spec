name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            pandoc \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-extra-utils

      - name: Compile and validate the complete document set
        run: make docs

      - name: Upload Programmer's Reference Manual
        uses: actions/upload-artifact@v7
        with:
          path: build/isa_reference.pdf
          archive: false
          if-no-files-found: error

      - name: Upload Bedrock ELF ABI
        uses: actions/upload-artifact@v7
        with:
          path: build/latex/bedrock-elf-abi/bedrock-elf-abi.pdf
          archive: false
          if-no-files-found: error

      - name: Upload Bedrock C ABI
        uses: actions/upload-artifact@v7
        with:
          path: build/latex/bedrock-c-abi/bedrock-c-abi.pdf
          archive: false
          if-no-files-found: error

      - name: Upload C far-pointer extensions
        uses: actions/upload-artifact@v7
        with:
          path: build/latex/bedrock-c-far-extensions/bedrock-c-far-extensions.pdf
          archive: false
          if-no-files-found: error

      - name: Upload target intrinsics
        uses: actions/upload-artifact@v7
        with:
          path: build/latex/bedrock-target-intrinsics/bedrock-target-intrinsics.pdf
          archive: false
          if-no-files-found: error

version: 1

local_instruction:
  forms_required:
    - doc.instruction_family
    - doc.instruction_class
    - allocation.catalog_section

required:
  mappings:
    - path: interrupts
    - path: registers.translation_control.page_table_entry
    - path: registers.translation_control.page_table_entry.low_attribute_bits
    - path: registers.translation_control.page_table_entry.walk_level_rules
    - path: registers.translation_control.page_table_entry.non_leaf_attributes
    - path: registers.translation_control.page_table_entry.leaf_attributes
    - path: interrupts.interrupt_vector_table.entry_layout
    - path: interrupts.interrupt_vector_table.entry_layout.control_byte.fields
    - path: interrupts.reset_state
    - path: registers.floating_point_register_model.registers
    - path: registers.floating_point_register_model.fflags
    - path: registers.floating_point_register_model.fstatus
    - path: ea.extended_ea_descriptor.segment_values
  lists:
    - path: registers.control_register_classes.CR.selector_groups
    - path: registers.translation_control.page_table_entry.permission_rules

item_required:
  - path: instructions.operand_schema.size_codes.*
    fields: [suffix, bytes, label]
  - path: instructions.operand_schema.size_kinds.*
    fields: [field, values]
  - path: instructions.operand_schema.named_values.*
    fields: [width, values]
  - path: instructions.operand_schema.bitmap_operands.*
    fields: [width, ranges]
  - path: instructions.operation_semantics.instructions.*.pcode_by_form[]
    fields: [operands, operation]
  - path: instructions.instruction_docs.*
    fields: [title, summary, description]
  - path: cpuid.classes[].leaves[].results[]
    fields: [description]
  - path: prefixes.prefixes[]
    when:
      group: ea_update
    fields: [description]

contains:
  - path: registers.special_registers[].name
    values: [FLAGS, STATUS]

mapping_keys:
  - path: instructions.operand_schema.named_values
    keys: [memory_order]
  - path: instructions.operand_schema.bitmap_operands
    keys: [bitmap16]

coverage:
  - target: instructions.instruction_docs
    sources:
      - instructions.families.*.*.*.mnemonics[]
  - target: ea.manual_text.form_descriptions
    sources:
      - ea.ea_forms.compact[].name
      - ea.extended_ea_forms[].name
  - target: ea.manual_text.payload_descriptions
    sources:
      - ea.ea_forms.compact[].name
      - ea.extended_ea_forms[].name

version: draft-v1

common_fields:
  size_bwlq: [B, W, L, Q]
  size_lq: [L, Q]
  size_wl: [W, L]
  cc: condition_code
  ea: effective_address
  dreg: D0-D7
  areg: A0-A7
  sreg: CS,DS,SS,GS0,GS1,GS2,GS3,GS4
  imm: immediate
  memory_order: relaxed,acquire,release,acqrel,seqcst
  bitmap16: D0-D7,A0-A7

common_constraints:
  overlong_encoding: allowed; extra trailing words are padding payload
  undersized_encoding: illegal
  memory_memory:
    allowed_only_for: [MOV, CMP, EXTSW, EXTZW, EXTSL, EXTZL, EXTSQ, EXTZQ]
  address_update_prefix:
    applies_to:
      - plain indirect A
      - segment-qualified plain indirect A
    disallowed_for:
      - A_plus_disp
      - PC_relative
      - SP_relative
      - absolute
      - immediate
      - indexed_ea
  repeat_prefixes:
    authoritative_source: instructions.yaml:operation_semantics.repeat_prefixes
    members: [REPcc, REPG]
  MOV_D_to_D:
    canonical_form: MOV <ea=Dsrc>, Ddst
    noncanonical_store_form: extended opcode entry
  long_control_transfer:
    rationale: CS and PC must be changed as one architectural commit point
    disallow_general_CS_write: true
    segment_operand: DREG
    target_operand: EA
    segment_immediate_plus_offset_immediate:
      allowed: false
      reason: 64-bit CS immediate plus 64-bit PC immediate would exceed the 8-word instruction limit

compatibility_rules:
  reserved_fields:
    architected_register_bits:
      read: zero
      write: must_be_zero
    control_register_bits:
      read: zero
      write: must_be_zero
      write_exception: INVALID_CONTROL_STATE
    selector_values:
      exception: INVALID_CONTROL_STATE
    page_table_bits:
      consumed_exception: PAGE_FAULT
    interrupt_vector_table_bits:
      write: must_be_zero
    supervisor_frame_bits:
      write: must_be_zero
    software_defined_bits:
      hardware_use: ignored
      software_use: allowed
  reserved_encodings:
    instruction_opcode:
      exception: ILLEGAL_INSTRUCTION
    extension_suboperation:
      exception: ILLEGAL_INSTRUCTION
    prefix_value:
      exception: ILLEGAL_INSTRUCTION
    effective_address_form:
      exception: ILLEGAL_INSTRUCTION
    unsupported_optional_instruction_group:
      exception: ILLEGAL_INSTRUCTION
    extension_unavailable_exception:
      defined: false
  canonical_encoding:
    assembler_default: canonical
    disassembler_default: canonical
    noncanonical_default:
      exception: ILLEGAL_INSTRUCTION
    explicit_alias_or_priority:
      allowed: true
  cpuid:
    unknown_class:
      result: zero
    unknown_leaf:
      result: zero
    unknown_index:
      result: zero
    reserved_result_bits:
      software_action: ignore
    privilege: unprivileged
    serialization: none
    runtime_mutability:
      stable_after_reset: true

    description: 'Transfers control when the encoded condition is true. The operation field gives
      the architectural effect as a compact expression or control action. Operand sizes, addressing
      modes, instruction length, and field placement are defined by the generated forms below. Condition-code
      behavior: unchanged.'
  LJMP:
    title: Long Jump
    summary: Atomically transfers control to a new CS:PC pair.
    description: >
      Long jump is the CS-changing jump instruction. It commits the new CS and PC as a single
      architectural control-transfer step, so software does not need to write CS directly while
      execution is still using the old PC. The two-operand form takes the new CS image from Dn
      and the target offset/address from the target EA. A segment-immediate plus offset-immediate
      form is not encoded because two 64-bit immediates would exceed the 8-word instruction
      limit.
  LEA:
    title: Load Effective Address
    summary: Performs the load effective address operation.
    description: 'Performs the load effective address operation. The operation field gives the architectural
      effect as a compact expression or control action. Operand sizes, addressing modes, instruction
      length, and field placement are defined by the generated forms below. Condition-code behavior:
      unchanged.'
  RDFLAGS:
    title: Read Flags
    summary: Read the integer condition-code flags into a D register.
    description: >
      RDFLAGS reads the architectural 16-bit FLAGS register, zero-extends it to 64 bits, and writes the
      result to the destination D register. FLAGS is not part of the S segment-register operand
      class. Condition-code behavior: unchanged.
  RDFSTATUS:
    title: Read Floating-Point Status
    summary: Read the FPU status/control register into a D register.
    description: >
      RDFSTATUS reads the architectural 16-bit FSTATUS register, zero-extends it to 64 bits,
      and writes the result to the destination D register. FSTATUS contains floating-point exception trap enables, rounding
      mode, and non-default mode bits. Accrued floating-point exception flags are kept in the
      separate FFLAGS register. RDFSTATUS requires the floating-point extension. Condition-code
      behavior: unchanged.
  RDSEG:
    title: Read Segment Register
    summary: Read a segment register image into a D register.
    description: >
      RDSEG reads one of the S-class segment registers and writes the 64-bit segment register image
      to the destination D register. The S operand selector maps 000=CS, 001=DS, 010=SS,
      011=GS0, 100=GS1, 101=GS2, 110=GS3, and 111=GS4. Condition-code behavior:
      unchanged.
  RDSTATUS:
    title: Read Status
    summary: Read the processor STATUS register into a D register.
    description: >
      RDSTATUS reads the architectural 16-bit STATUS register, zero-extends it to 64 bits, and writes the
      result to the destination D register. STATUS is not part of the S segment-register operand
      class. Condition-code behavior: unchanged.

allocation:
  frequency_model:
    description: >
      Estimated relative dynamic frequency and code-density value used by the
      opcode allocator. Weights are relative tuning parameters, not
      cycle-accurate measurements.
    default_weight_by_category:
      sentinel: 10000
      data_movement: 2200
      integer: 900
      control_flow: 1800
      system: 80
      fpu: 120
      misc: 60
    rules:
      - id: MOV_LQ_EA_TO_D
        match: {mnemonic: MOV, profile: EA_TO_D, size: LQ}
        weight: 120000
        compact: required
        reason: hot load/register-move fast path
      - id: MOV_LQ_D_TO_EA
        match: {mnemonic: MOV, profile: D_TO_EA, size: LQ}
        weight: 120000
        compact: required
        reason: hot store/register-move fast path
      - id: MOV_Q_IMM_TO_A
        match: {mnemonic: MOV, profile: IMM_TO_A}
        weight: 30000
        reason: direct address-constant materialization is cheap in primary space
      - id: INTEGER_ALU_D_TO_D
        match: {category: integer, profile: D_TO_D}
        weight: 18000
        reason: hot register-register ALU path
      - id: INTEGER_LOGIC_IMM_TO_D
        match: {mnemonic: [AND, OR, XOR], profile: IMM_TO_D, size: WL}
        weight: 40000
        compact: required
        reason: compact logical immediates avoid EA-immediate descriptor overhead in mask-heavy code
      - id: EXTZQ_D_TO_D_FAST_PATH
        match: {mnemonic: [EXTSQ, EXTZQ], profile: D_TO_D, size: BWL}
        weight: 26000
        compact: required
        reason: full-register sign/zero extension is a common fast-path conversion
      - id: CLR_AREG
        match: {mnemonic: CLR, profile: A}
        weight: 20000
        compact: required
        reason: zero-base address registers are useful for LEA-based address arithmetic
      - id: COMPACT_CONTROL_FLOW
        match: {category: control_flow}
        weight: 14000
        reason: branch/call density
      - id: LONG_CONTROL_FLOW
        match: {mnemonic: [LJMP, LCALL, LRET]}
        weight: 500
        compact: never
        reason: CS-changing far transfers are important but not compact hot-path instructions
      - id: STACK_REGISTER
        match: {semantic_family: PUSH_POP, profile: [D, A]}
        weight: 9000
        compact: required
        reason: push/pop register density
      - id: EA_UTILITY
        match: {semantic_family: ea_utility}
        weight: 1200
        reason: useful but lower frequency than MOV/ALU/control fast paths
      - id: BOUNDS_RRR
        match: {semantic_family: [bounds_unsigned, bounds_signed], profile: D_TO_EA_TO_D}
        weight: 300
        reason: bounds checks should not evict core data movement
      - id: FPU
        match: {category: fpu}
        weight: 100
        compact: never
        reason: FPU forms live behind extension roots
      - id: SYSTEM_AND_CACHE
        match: {category: system}
        weight: 80
        compact: never
        reason: rare system/cache/TLB operations should not consume primary payload

  extension_roots:
    group_by: semantic_family
    condition_field_in_primary: true
    preferred_region: high_primary_payload
    allow_low_payload_roots: false

  extension_family_rules:
    - match: {group: BIT_OPS, profile: I6_TO_EA}
      extension_family: integer_bitfield_bit_imm
    - match: {group: ROTATES, profile: I6_TO_EA}
      extension_family: integer_bitfield_rotate_imm
    - match: {group: SHIFTS, profile: I6_TO_EA}
      extension_family: integer_bitfield_shift_imm

  primary_clusters:
    order: [bitmap_ops, direct_call, stack_ops, core_control]

  condition_field:
    reclaim_never_taken:
      mnemonics: [Jcc]
      condition_value: 0x1
      reason: JF is semantically equivalent to falling through and can be reclaimed

  field_reclaim:
    invalid_values:
      - match: {mnemonic: [EXTSQ, EXTZQ], profile: D_TO_D, size: BWL}
        field_source: size
        values: [0x3]
        reason: Q-to-Q extension has no architectural effect and its size-field encoding is reclaimed

  field_layout:
    explicit_signature_order:
      - COND4
      - EA6
      - REG3
      - REG3#2
      - EA6#2
      - FREG:5
      - FREG:5#2
      - FREG:5#3
      - SEL6
      - SEL4
      - DBANK:4
      - SIZE2
      - SIZE1
    field_score:
      formula: candidate_weight_times_field_width
      default_multiplier: 1
      signature_multipliers:
        default: 1
        COND4: 8
    subfield_affinities:
      - name: EA_low_register_bits
        container_signature: EA6
        subfield_signature: REG3
        offset: 0
        width: 3
        score_multiplier: 1
        reason: compact EA register-addressing forms carry the register number in the low 3 bits

families:
  core_control:
    category: system
    compact_primary:
      HALT:
        operands: []
        privilege: supervisor
        effects: halt until event
        flags: unchanged
      RESET:
        operands: []
        privilege: supervisor
        effects: warm reset
        preserves: [BOOTPC, BOOTCFG]
      SYSRET:
        operands: []
        privilege: supervisor
        effects: return from syscall
      IRET:
        operands: []
        privilege: supervisor
        effects: return from interrupt
      CORE_MISC:
        mnemonics: [NOP, SYSCALL, BKPT, WAIT, YIELD, RFENCE, WFENCE, AFENCE]
        operands: []
        flags: unchanged

  integer_alu:
    category: integer
    compact_primary:
      ADD_SUB:
        mnemonics: [ADD, SUB]
        compact_forms:
          - operands: [{name: src, type: DREG}, {name: dst, type: DREG}]
            size: LQ
        extended_forms:
          - operands: [{name: src, type: EA}, {name: dst, type: DREG}]
            size: BWLQ
            compact: false
          - operands: [{name: src, type: DREG}, {name: dst, type: EA}]
            size: BWLQ
            compact: false
          - operands: [{name: imm, type: IMM_EA}, {name: dst, type: EA}]
            size: BWLQ
            compact: false
          - operands: [{name: src, type: EA}, {name: dst, type: AREG}]
            size: Q
            compact: false
            flags: unchanged
        form: destructive two-address form
        result: second operand
        memory_memory: disallowed
        flags:
          ADD: update_ZNCV
          SUB: update_ZNCV
        prefixes:
          legal: [NPX, NOSPEC, SATURATE]

      XOR:
        compact_forms:
          - operands: [{name: src, type: DREG}, {name: dst, type: DREG}]
            size: LQ
          - operands: [{name: imm, type: imm}, {name: dst, type: DREG}]
            size: WL
        extended_forms:
          - operands: [{name: src, type: EA}, {name: dst, type: DREG}]
            size: BWLQ
            compact: false
          - operands: [{name: src, type: DREG}, {name: dst, type: EA}]
            size: BWLQ
            compact: false
          - operands: [{name: imm, type: IMM_EA}, {name: dst, type: EA}]
            size: BWLQ
            compact: false
        form: destructive two-address form
        result: second operand
        memory_memory: disallowed
        flags: update Z/N and clear C/V
        prefixes:
          legal: [NPX, NOSPEC, SATURATE]

      AND_OR:
        mnemonics: [AND, OR]
        compact_forms:
          - operands: [{name: src, type: DREG}, {name: dst, type: DREG}]
            size: LQ
          - operands: [{name: imm, type: imm}, {name: dst, type: DREG}]
            size: WL
        extended_forms:
          - operands: [{name: src, type: EA}, {name: dst, type: DREG}]
            size: BWLQ
            compact: false
          - operands: [{name: src, type: DREG}, {name: dst, type: EA}]
            size: BWLQ
            compact: false
          - operands: [{name: imm, type: IMM_EA}, {name: dst, type: EA}]
            size: BWLQ
            compact: false
        form: destructive two-address form
        result: second operand
        memory_memory: disallowed
        flags:
          AND: update Z/N and clear C/V
          OR: update Z/N and clear C/V
        prefixes:
          legal: [NPX, NOSPEC, SATURATE]

      CMP:
        compact_forms:
          - operands: [{name: src, type: DREG}, {name: dst, type: DREG}]
            size: LQ
        extended_forms:
          - operands: [{name: lhs, type: EA}, {name: rhs, type: DREG}]
            size: BWLQ
            compact: false
          - operands: [{name: lhs, type: DREG}, {name: rhs, type: EA}]
            size: BWLQ
            compact: false
          - operands: [{name: imm, type: IMM_EA}, {name: rhs, type: EA}]
            size: BWLQ
            compact: false
          - operands: [{name: lhs, type: EA}, {name: rhs, type: EA}]
            size: BWLQ
            compact: false
            memory_memory: true
          - operands: [{name: lhs, type: EA}, {name: rhs, type: AREG}]
            size: Q
            compact: false
        result: none
        memory_memory: disallowed
        flags: update Z/N/C/V as subtraction

      TEST:
        compact_forms:
          - operands: [{name: src, type: DREG}, {name: dst, type: DREG}]
            size: LQ
        extended_forms:
          - operands: [{name: lhs, type: EA}, {name: rhs, type: DREG}]
            size: BWLQ
            compact: false
          - operands: [{name: lhs, type: DREG}, {name: rhs, type: EA}]
            size: BWLQ
            compact: false
          - operands: [{name: imm, type: IMM_EA}, {name: rhs, type: EA}]
            size: BWLQ
            compact: false
        result: none
        memory_memory: disallowed
        flags: update Z/N and clear C/V

    integer:
      REV:
        mnemonics: [REVBYTE, REVBIT]
        operands:
          - [{name: src, type: DREG}, {name: dst, type: DREG}]
          - [{name: src, type: EA}, {name: dst, type: DREG}]
          - [{name: src, type: DREG}, {name: dst, type: EA}]
        size: BWLQ
        compact: false
        result: second operand
        memory_memory: disallowed
        flags: unchanged

      ADC_SBB:
        mnemonics: [ADC, SBB]
        operands:
          - [{name: src, type: EA}, {name: dst, type: DREG}]
          - [{name: src, type: DREG}, {name: dst, type: EA}]
          - [{name: imm, type: IMM_EA}, {name: dst, type: EA}]
        size: BWLQ
        compact: false
        reads: C
        flags: update Z/N/C/V

      SUM:
        operands:
          - [{name: regs, type: bitmap16}, {name: dst, type: DREG}]
          - [{name: regs, type: bitmap16}, {name: dst, type: AREG}]
        size: BWLQ
        compact: false
        result: destination register
        flags: unchanged

      MIN_MAX:
        mnemonics: [MINU, MINS, MAXU, MAXS]
        operands:
          - [{name: src, type: EA}, {name: dst, type: DREG}]
          - [{name: src, type: DREG}, {name: dst, type: EA}]
        size: BWLQ
        compact: false
        signedness:
          MINU: unsigned
          MAXU: unsigned
          MINS: signed
          MAXS: signed
        result: second operand
        flags: may update Z/N

  data_movement:
    category: data_movement
    compact_primary:
      MOV:
        compact_forms:
          - operands: [{name: src, type: EA}, {name: dst, type: DREG}]
            size: LQ
          - operands: [{name: src, type: DREG}, {name: dst, type: EA}]
            size: LQ
          - operands: [{name: src, type: imm64}, {name: dst, type: AREG}]
            size: Q
        extended_forms:
          - operands: [{name: src, type: EA}, {name: dst, type: EA}]
            size: BWLQ
            force_size_suffix: true
            constraint: memory_memory
          - operands: [{name: src, type: EA}, {name: dst, type: DREG}]
            size: BWLQ
            force_size_suffix: true
          - operands: [{name: src, type: DREG}, {name: dst, type: EA}]
            size: BWLQ
            force_size_suffix: true
        flags: unchanged

      PUSH_POP:
        mnemonics: [PUSH, POP]
        operands: [{name: reg, type: DREG_OR_AREG}]
        compact: required
        stack_segment: SS
        stack_register: SP
        size: Q
        flags: unchanged

      PUSHM_POPM:
        mnemonics: [PUSHM, POPM]
        operands: [{name: regs, type: bitmap16}]
        bitmap:
          bits_0_7: D0-D7
          bits_8_15: A0-A7
        size_per_register: Q
        flags: unchanged

      MOVSETAD:
        operands: [{name: regs, type: bitmap16}]
        extended_forms:
          - operands: [{name: src_bank, type: DBANK}, {name: regs, type: bitmap16}]
            compact: false
            extension_family: data_register_banking
        effect: A[i] = D[i]
        valid_bits: 0..7
      MOVSETDA:
        operands: [{name: regs, type: bitmap16}]
        extended_forms:
          - operands: [{name: dst_bank, type: DBANK}, {name: regs, type: bitmap16}]
            compact: false
            extension_family: data_register_banking
        effect: D[i] = A[i]
        valid_bits: 0..7
      XCHGSETAD:
        operands: [{name: regs, type: bitmap16}]
        extended_forms:
          - operands: [{name: bank, type: DBANK}, {name: regs, type: bitmap16}]
            compact: false
            extension_family: data_register_banking
        effect: swap A[i], D[i]
        valid_bits: 0..7
      XCHGSETDA:
        operands: [{name: regs, type: bitmap16}]
        extended_forms:
          - operands: [{name: bank, type: DBANK}, {name: regs, type: bitmap16}]
            compact: false
            extension_family: data_register_banking
        effect: swap D[i], A[i]
        valid_bits: 0..7

    integer:
      XCHG:
        operands:
          - [{name: lhs, type: EA}, {name: rhs, type: DREG}]
          - [{name: lhs, type: DREG}, {name: rhs, type: EA}]
        size: BWLQ
        memory_memory:
          allowed: false
        atomic: false

  data_register_banking:
    category: data_movement
    integer:
      DATA_BANK_SELECT:
        mnemonics: [SELDB]
        operands:
          - [{name: bank, type: DBANK}]
          - [{name: src, type: DREG}]
        compact: false
        extension_family: data_register_banking
        privilege: user allowed
        flags: unchanged
      DATA_BANK_READ:
        mnemonics: [GETDB]
        operands: [{name: dst, type: DREG}]
        compact: false
        extension_family: data_register_banking
        privilege: user allowed
        flags: unchanged
      DATA_BANK_SET_COPY:
        mnemonics: [MOVSETDD]
        operands: [{name: dst_bank, type: DBANK}, {name: src_bank, type: DBANK}, {name: regs, type: bitmap16}]
        compact: false
        extension_family: data_register_banking
        effect: D[dst_bank][i] = D[src_bank][i]
        valid_bits: 0..7
      DATA_BANK_SET_EXCHANGE:
        mnemonics: [XCHGSETDD]
        operands: [{name: bank_a, type: DBANK}, {name: bank_b, type: DBANK}, {name: regs, type: bitmap16}]
        compact: false
        extension_family: data_register_banking
        effect: swap D[bank_a][i], D[bank_b][i]
        valid_bits: 0..7

  integer_unary:
    category: integer
    compact_primary:
      INC_DEC:
        mnemonics: [INC, DEC]
        compact_forms:
          - operands: [{name: dst, type: DREG}]
        extended_forms:
          - operands: [{name: dst, type: EA}]
            compact: false
        size: BWLQ
        flags: update_ZNCV
      INCN_DECN:
        mnemonics: [INCN, DECN]
        compact_forms:
          - operands: [{name: dst, type: DREG}]
        extended_forms:
          - operands: [{name: dst, type: EA}]
            compact: false
        size: BWLQ
        flags: unchanged
      NOT:
        compact_forms:
          - operands: [{name: dst, type: DREG}]
        extended_forms:
          - operands: [{name: dst, type: EA}]
            compact: false
        size: BWLQ
        flags: update Z/N and clear C/V
      NEG_ABS:
        mnemonics: [NEG, ABS]
        compact_forms:
          - operands: [{name: dst, type: DREG}]
        extended_forms:
          - operands: [{name: dst, type: EA}]
            compact: false
        size: BWLQ
        flags: update Z/N/C/V
      EXTEND_TO_W_SIGNED:
        mnemonics: [EXTSW]
        compact_forms:
          - operands: [{name: src, type: DREG}, {name: dst, type: DREG}]
        extended_forms:
          - operands: [{name: src, type: EA}, {name: dst, type: DREG}]
            compact: false
          - operands: [{name: src, type: DREG}, {name: dst, type: EA}]
            compact: false
          - operands: [{name: src, type: EA}, {name: dst, type: EA}]
            compact: false
            memory_memory: true
        source_size: [B]
        destination_size: W
        access_width:
          src: source_size
          dst: destination_size
        flags: unchanged
      EXTEND_TO_L:
        mnemonics: [EXTSL, EXTZL]
        compact_forms:
          - operands: [{name: src, type: DREG}, {name: dst, type: DREG}]
        extended_forms:
          - operands: [{name: src, type: EA}, {name: dst, type: DREG}]
            compact: false
          - operands: [{name: src, type: DREG}, {name: dst, type: EA}]
            compact: false
          - operands: [{name: src, type: EA}, {name: dst, type: EA}]
            compact: false
            memory_memory: true
        source_size: [B, W]
        destination_size: L
        access_width:
          src: source_size
          dst: destination_size
        flags: unchanged
      EXTEND_TO_Q:
        mnemonics: [EXTSQ, EXTZQ]
        compact_forms:
          - operands: [{name: src, type: DREG}, {name: dst, type: DREG}]
        extended_forms:
          - operands: [{name: src, type: EA}, {name: dst, type: DREG}]
            compact: false
          - operands: [{name: src, type: DREG}, {name: dst, type: EA}]
            compact: false
          - operands: [{name: src, type: EA}, {name: dst, type: EA}]
            compact: false
            memory_memory: true
        source_size: [B, W, L]
        destination_size: Q
        invalid_sizes: [Q]
        access_width:
          src: source_size
          dst: destination_size
        flags: unchanged
      CLR:
        compact_forms:
          - operands: [{name: dst, type: DREG}]
          - operands: [{name: dst, type: AREG}]
        extended_forms:
          - operands: [{name: dst, type: EA}]
            compact: false
        size: implicit_Q
        result: dst = 0
        flags: unchanged

    integer:
      EXTEND_TO_W_ZERO:
        mnemonics: [EXTZW]
        operands:
          - [{name: src, type: EA}, {name: dst, type: EA}]
        source_size: [B]
        destination_size: W
        compact: false
        memory_memory: true
        access_width:
          src: source_size
          dst: destination_size
        flags: unchanged

  integer_bitfield:
    category: integer
    integer:
      SHIFTS:
        mnemonics: [SHL, SHR, SAR]
        operands:
          - [{name: count, type: selector}, {name: dst, type: DREG}]
          - [{name: count, type: selector}, {name: dst, type: EA}]
        size: BWLQ
        compact: false
        encoding_fields:
          - field: o
            kind: shift_group
            width: 2
            placement: high
            values: [SHL, SHR, SAR, DYN]
            derive: mnemonic
            match: {profile: I6_TO_EA}
        flags:
          mode: per_shift

      ROTATES:
        mnemonics: [RCL, RCR, ROL, ROR]
        extension_family: integer_bitfield
        operands:
          - [{name: count, type: selector}, {name: dst, type: DREG}]
          - [{name: count, type: selector}, {name: dst, type: EA}]
        size: BWLQ
        compact: false
        encoding_fields:
          - field: o
            kind: rotate_group
            width: 2
            placement: high
            values: [RCL, RCR, ROL, ROR]
            derive: mnemonic
            match: {profile: I6_TO_EA}
        flags:
          mode: per_shift

      BIT_OPS:
        mnemonics: [BTEST, BSET, BCLR, BCHG]
        operands:
          - [{name: bit_index, type: selector}, {name: dst, type: DREG}]
          - [{name: bit_index, type: selector}, {name: dst, type: EA}]
        size: BWLQ
        compact: false
        encoding_fields:
          - field: o
            kind: bit_group
            width: 2
            placement: high
            values: [BCHG, BCLR, BSET, BTEST]
            derive: mnemonic
            match: {profile: I6_TO_EA}
        flags: set Z when the old bit was zero; preserve N/C/V

      BIT_COUNTS:
        mnemonics: [CTZ, CTS, CLZ, CLS, POPCNT]
        operands: [{name: src, type: EA}, {name: dst, type: DREG}]
        size: BWLQ
        zero_input:
          CTZ: returns operand width
          CLZ: returns operand width
          POPCNT: returns 0
        flags: unchanged

      PARITY:
        operands: [{name: src, type: EA}]
        size: BWLQ
        compact: false
        extension_family: integer_bitfield
        result: FLAGS.Z = popcount(src) & 1
        flags: set Z to odd parity; preserve N/C/V

  integer_mul_div:
    category: integer
    integer:
      MULTIPLY:
        mnemonics: [MULU, MULS]
        operands:
          - [{name: src, type: EA}, {name: dst, type: DREG}]
          - [{name: src, type: DREG}, {name: dst, type: EA}]
        size: BWLQ
        result: low half
        flags: may update FLAGS
      MULTIPLY_HIGH:
        mnemonics: [MULHU, MULHS, MULHSU]
        operands:
          - [{name: src, type: EA}, {name: dst, type: DREG}]
          - [{name: src, type: DREG}, {name: dst, type: EA}]
        size: BWLQ
        result: high half
      MULTIPLY_ACCUMULATE:
        mnemonics: [MADD, MSUB]
        extension_family: integer_mac
        operands:
          - {name: src, type: EA}
          - {name: multiplier, type: DREG}
          - {name: acc, type: DREG}
        size: BWLQ
        compact: false
        result: accumulator receives the low half of the product
        flags: unchanged
      DIVIDE_MOD:
        mnemonics: [DIVU, DIVS, MODU, MODS]
        operands:
          - [{name: src, type: EA}, {name: dst, type: DREG}]
          - [{name: src, type: DREG}, {name: dst, type: EA}]
        size: BWLQ
        traps:
          - divide_by_zero
          - signed overflow trap when defined
      DIVMOD:
        mnemonics: [DIVMODU, DIVMODS]
        operands:
          - {name: src, type: EA}
          - {name: quotient, type: DREG}
          - {name: remainder, type: DREG}
        size: BWLQ
      CARRYLESS_MULTIPLY:
        mnemonics: [CLMUL, CLMULH]
        operands:
          - [{name: src, type: EA}, {name: dst, type: DREG}]
          - [{name: src, type: DREG}, {name: dst, type: EA}]
        size: BWLQ
        result: carryless low or high half

  bounds:
    category: integer
    integer:
      BOUNDS_UNSIGNED:
        mnemonics: [BNDUII, BNDUIX, BNDUXI, BNDUXX]
        extension_family: integer_bounds_unsigned
        operands:
          - {name: lo, type: DREG}
          - {name: value, type: EA}
          - {name: hi, type: DREG}
        size: BWLQ
        signedness: unsigned
        bounds_mode: inclusive/inclusive, inclusive/exclusive, exclusive/inclusive, or exclusive/exclusive
        flags:
          V: set when the value is out of bounds
          ZNC: unchanged
      BOUNDS_SIGNED:
        mnemonics: [BNDSII, BNDSIX, BNDSXI, BNDSXX]
        extension_family: integer_bounds_signed
        operands:
          - {name: lo, type: DREG}
          - {name: value, type: EA}
          - {name: hi, type: DREG}
        size: BWLQ
        signedness: signed
        bounds_mode: inclusive/inclusive, inclusive/exclusive, exclusive/inclusive, or exclusive/exclusive
        flags:
          V: set when the value is out of bounds
          ZNC: unchanged

  control_flow:
    category: control_flow
    compact_primary:
      JMP:
        alias_of: Jcc.T
        canonical_disassembly: JMP
        aliases:
          - Jcc.T relative_imm
          - Jcc.T EA
        flags: unchanged
      Jcc:
        compact_forms:
          - operands: [{name: cc, type: condition}, {name: target, type: relative_imm}]
            size: WL
        extended_forms:
          - operands: [{name: cc, type: condition}, {name: target, type: EA}]
            size: WL
            compact: false
        reads: FLAGS
        flags: unchanged
      LJMP:
        operands: [{name: new_cs, type: DREG}, {name: target, type: EA}]
        compact: false
        effects: atomically update CS and PC
        disallow_segment_immediate: true
        flags: unchanged
      CALL:
        compact_forms:
          - profile: IMM32
            allocation_cluster: direct_call
            operands: [{name: target, type: imm32}]
          - profile: IMM64
            allocation_cluster: direct_call
            operands: [{name: target, type: imm64}]
        extended_forms:
          - operands: [{name: target, type: EA}]
            compact: false
        size:
          fixed: Q
        effects: push return address
        flags: unchanged
      LCALL:
        operands: [{name: new_cs, type: DREG}, {name: target, type: EA}]
        compact: false
        effects: push far return address and atomically update CS and PC
        disallow_segment_immediate: true
        flags: unchanged
      RET:
        operands: []
        effects: pop return address
        flags: unchanged
      LRET:
        operands: []
        compact: false
        effects: pop far return address and atomically update CS and PC
        flags: unchanged
      SETcc:
        operands: [{name: cc, type: condition}, {name: dst, type: EA}]
        size: BWLQ
        writes: 0 or 1
        flags: unchanged
      DJcc:
        operands:
          - {name: cc, type: condition}
          - {name: counter, type: DREG}
          - {name: target, type: EA}
        size: BWLQ
        reads: FLAGS
        updates: Dcounter
        flags: unchanged
      MOVcc:
        operands:
          - [{name: cc, type: condition}, {name: src, type: DREG}, {name: dst, type: EA}]
          - [{name: cc, type: condition}, {name: src, type: EA}, {name: dst, type: DREG}]
          - [{name: cc, type: condition}, {name: src, type: AREG}, {name: dst, type: EA}]
          - [{name: cc, type: condition}, {name: src, type: EA}, {name: dst, type: AREG}]
        D_size: BWLQ
        A_size: Q_only
        reads: FLAGS
        flags: unchanged
      TRAP:
        alias_of: TRAPcc.T
        canonical_disassembly: TRAP
        aliases:
          - TRAPcc.T
        vector: 0x05
      TRAPcc:
        operands: [{name: cc, type: condition}]
        reads: FLAGS
        vector: 0x05
        flags: unchanged
      TRACE:
        operands: [{name: marker, type: imm16}]
        effect: trace marker
        if_trace_disabled: nop
        flags: unchanged

  ea_utility:
    category: data_movement
    compact_primary:
      TESTCANON:
        operands: [{name: src, type: EA}]
        performs: canonical address check only
        flags:
          V: set when the address is noncanonical
          ZNC: unchanged
      LEA:
        operands: [{name: src, type: EA}, {name: dst, type: AREG}]
        computes: effective_address
        no_memory_access: true
        flags: unchanged
      SEGLEA:
        operands: [{name: src, type: EA}, {name: dst, type: AREG}]
        computes: segment translation only
        canonical_check: false
        page_walk: false
        flags:
          V: set when segment bounds check fails
          ZNC: unchanged

  atomics:
    category: system
    system:
      CMPXCHG:
        operands:
          - {name: order, type: memory_order}
          - {name: expected, type: DREG}
          - {name: desired, type: DREG}
          - {name: memory, type: EA}
        size: BWLQ
        atomic: true
        flags: compare result
      FETCH_OPS:
        mnemonics: [FETCHADD, FETCHSUB, FETCHAND, FETCHOR, FETCHXOR]
        operands: [{name: order, type: memory_order}, {name: src, type: DREG}, {name: memory, type: EA}]
        size: BWLQ
        atomic: true
        returns: old value

  system_registers:
    category: system
    system:
      CONTROL_REGISTER_ACCESS:
        mnemonics: [RDCR, WRCR]
        operands:
          RDCR: [{name: cr, type: CR}, {name: dst, type: DREG}]
          WRCR: [{name: src, type: DREG}, {name: cr, type: CR}]
        privilege: supervisor
        flags: unchanged
      SEGMENT_REGISTER_ACCESS:
        mnemonics: [RDSEG, WRSEG]
        operands:
          RDSEG: [{name: seg, type: SREG}, {name: dst, type: DREG}]
          WRSEG: [{name: src, type: DREG}, {name: seg, type: SREG}]
        size: Q
        privilege: policy_controlled
        flags: unchanged
        note: general writes to CS are illegal; use CS-changing control transfer instructions
      FLAGS_ACCESS:
        mnemonics: [RDFLAGS, WRFLAGS]
        operands:
          RDFLAGS: [{name: dst, type: DREG}]
          WRFLAGS: [{name: src, type: DREG}]
        size: W
        privilege: unprivileged
        flags:
          RDFLAGS: unchanged
          WRFLAGS: writes FLAGS from source low bits
      FSTATUS_ACCESS:
        mnemonics: [RDFSTATUS, WRFSTATUS]
        operands:
          RDFSTATUS: [{name: dst, type: DREG}]
          WRFSTATUS: [{name: src, type: DREG}]
        size: W
        privilege: unprivileged
        extension_requirement: floating_point
        flags:
          RDFSTATUS: unchanged
          WRFSTATUS: writes FSTATUS from source bits
      STATUS_ACCESS:
        mnemonics: [RDSTATUS, WRSTATUS]
        operands:
          RDSTATUS: [{name: dst, type: DREG}]
          WRSTATUS: [{name: src, type: DREG}]
        size: W
        privilege: supervisor
        flags: unchanged
      RDPTC:
        operands: [{name: dst, type: DREG}]
        privilege: configurable
        flags: unchanged
      RDPMC:
        operands: [{name: counter_id, type: imm16}, {name: dst, type: DREG}]
        privilege: configurable
        flags: unchanged
      CPUID:
        operands: [{name: reg, type: DREG}]
        input: reg contains CPUID query selector
        output: selected CPUID result is written back to reg
        privilege: user allowed
        flags: unchanged

  virtualization_acceleration:
    category: system
    system:
      ENCINST:
        operands: [{name: dst, type: EA}]
        compact: false
        extension_requirement: virtualization_acceleration
        extension_family: virtualization_acceleration
        implicit_inputs: [D0, D1, D2, D3]
        implicit_outputs: [D0]
        dst_ea_set: addressable_memory_only
        disallow_update_prefix: true
        privilege: user allowed
        effects: write canonical instruction encoding to dst EA
        flags: unchanged

  tlb_and_context:
    category: system
    system:
      SWPT:
        operands: [{name: new_ptcr, type: DREG}]
        privilege: supervisor
        effects: update PTCR, clear ASCR, clear TLB state, and serialize
      SWPTA:
        operands: [{name: new_ptcr, type: DREG}, {name: asid, type: imm16}]
        privilege: supervisor
        effects: update PTCR, set ASCR.AE, update ASID state, and serialize
      PAGE_QUERY:
        mnemonics: [VTOP, PTATTR, PTQUERY]
        operands: [{name: src, type: linear_or_EA}, {name: outputs, type: outputs}]
        privilege: supervisor
        performs_page_walk: true
        flags: operation-defined status result
      TLB_INVALIDATE:
        mnemonics: [INVTLB, INVPAGE, INVASID]
        operands:
          INVTLB: []
          INVPAGE: [{name: page, type: EA}]
          INVASID: [{name: asid, type: imm16}]
        privilege: supervisor
        serializing: true
      PROCESSOR_STATE_SAVE_RESTORE:
        mnemonics: [SAVE, RESTORE]
        operands: [{name: memory, type: EA}]
        privilege: supervisor
        state: base and extension state
        save_area_layout: CPUID-defined fixed layout
        optimization: modified-state save for base and extension state

  cache:
    category: system
    system:
      PREFETCH:
        operands: [{name: src, type: EA}]
        privilege: user allowed
        flags: unchanged
      CACHE_OPS:
        mnemonics: [INVDCACHE, INVICACHE, FLSHDCACHE, WRBKDCACHE, SYNCCACHE]
        operands: [{name: target, type: EA_or_range}]
        privilege: supervisor or policy-controlled
        flags: unchanged

  fpu:
    category: fpu
    registers:
      F:
        count: 32
        width: 64
        scalar_formats: [S, D]
    fpu:
      FNOP:
        operands: []
        flags: unchanged
        fp_flags: unchanged
      FMOV:
        operands:
          - [{name: src, type: FREG}, {name: dst, type: FREG}]
          - [{name: src, type: EA}, {name: dst, type: FREG}]
          - [{name: src, type: FREG}, {name: dst, type: EA}]
        size: S_D
        flags: unchanged
        fp_flags: unchanged
      FMOVcc:
        operands: [{name: cc, type: condition}, {name: src, type: FREG}, {name: dst, type: FREG}]
        reads: FLAGS
        flags: unchanged
        fp_flags: unchanged
      FMOVCR:
        operands: [{name: constant_id, type: imm16}, {name: dst, type: FREG}]
        flags: unchanged
        fp_flags: unchanged
      FCLR:
        operands:
          - [{name: dst, type: FREG}]
          - [{name: dst, type: EA}]
        result: "+0.0"
        fp_flags: unchanged
      FXCHG:
        operands: [{name: lhs, type: FREG}, {name: rhs, type: FREG}]
        fp_flags: unchanged
      FP_ARITH:
        mnemonics: [FADD, FSUB, FMUL, FDIV, FREM, FMOD]
        operands:
          - [{name: src, type: FREG}, {name: dst, type: FREG}]
          - [{name: src, type: EA}, {name: dst, type: FREG}]
        size: S_D
        result: Fdst
        memory_destination_arithmetic: disallowed
        fp_flags_by_mnemonic:
          FADD:
            update: [NV, OF, UF, NX]
          FSUB:
            update: [NV, OF, UF, NX]
          FMUL:
            update: [NV, OF, UF, NX]
          FDIV:
            update: [NV, DZ, OF, UF, NX]
          FREM:
            update_when_required: [NV]
          FMOD:
            update_when_required: [NV]
      FP_FMA:
        mnemonics: [FMADD, FMSUB, FNMADD, FNMSUB]
        operands:
          - [{name: lhs, type: FREG}, {name: rhs, type: FREG}, {name: dst, type: FREG}]
          - [{name: lhs, type: EA}, {name: rhs, type: FREG}, {name: dst, type: FREG}]
          - [{name: lhs, type: FREG}, {name: rhs, type: EA}, {name: dst, type: FREG}]
        size: S_D
        rounding: single_round
        memory_operands: at_most_one
        fp_flags:
          update: [NV, OF, UF, NX]
      FP_UNARY:
        mnemonics: [FSQRT, FNEG, FABS]
        operands:
          - [{name: src, type: FREG}, {name: dst, type: FREG}]
          - [{name: src, type: EA}, {name: dst, type: FREG}]
          - [{name: src, type: FREG}, {name: dst, type: EA}]
        size: S_D
        fp_flags_by_mnemonic:
          FSQRT:
            update_when_required: [NV, NX]
          FNEG: unchanged
          FABS: unchanged
      FP_COMPARE:
        mnemonics: [FCMP, FTEST]
        operands:
          - [{name: src, type: FREG}, {name: dst, type: FREG}]
          - [{name: src, type: EA}, {name: dst, type: FREG}]
          - [{name: src, type: FREG}]
          - [{name: src, type: EA}]
        size: S_D
        updates: FLAGS
        unordered: FLAGS.V = 1
        fp_flags:
          update_when_required: [NV]
      FP_INTEGRAL_ROUND:
        mnemonics: [FINT, FINTRZ, FROUND, FTRUNC, FCEIL, FFLOOR]
        operands:
          - [{name: src, type: FREG}, {name: dst, type: FREG}]
          - [{name: src, type: EA}, {name: dst, type: FREG}]
          - [{name: src, type: FREG}, {name: dst, type: EA}]
        size: S_D
        result: floating integral value
        fp_flags:
          update_when_required: [NV, NX]
      FCOPYSIGN:
        operands:
          - {name: sign_src, type: FREG}
          - {name: magnitude_src, type: FREG}
          - {name: dst, type: FREG}
        size: S_D
        fp_flags: unchanged
      FP_EXP_MAN_SCALE:
        mnemonics: [FGETEXP, FGETMAN, FSCALE]
        operands:
          - [{name: src, type: FREG}, {name: dst, type: FREG}]
          - [{name: src, type: EA}, {name: dst, type: FREG}]
        size: S_D
        fp_flags_by_mnemonic:
          FGETEXP:
            update_when_required: [NV]
          FGETMAN:
            update_when_required: [NV, NX]
          FSCALE:
            update: [NV, OF, UF, NX]
      FMIN_FMAX:
        mnemonics: [FMIN, FMAX]
        operands:
          - [{name: src, type: FREG}, {name: dst, type: FREG}]
          - [{name: src, type: EA}, {name: dst, type: FREG}]

  SYSCALL:
    title: System Call
    summary: Enter supervisor mode through SPC/SCS/SDS.
    description: 'Enter supervisor mode through the SPC/SCS/SDS supervisor-entry path. SYSCALL does
      not consume an interrupt vector. It saves SS:SP, CS:PC, DS, FLAGS/STATUS state, and the
      interrupted DBANK selector, then sets DBANK to zero before entering the handler. It aligns
      the supervisor-entry address to 16 bytes, uses a 32-byte entry table, and sets STATUS.PM to
      one without automatically masking interrupts. Operand sizes, addressing modes, instruction
      length, and field placement are defined by the generated forms below. Condition-code behavior:
      unchanged.'
  SYSRET:
    title: System Return
    summary: Restore user control state from a syscall return frame.
    description: 'Restore user control state from a syscall return frame. SYSRET is the matching
      return instruction for SYSCALL and reads the syscall frame as written, including the saved
      DBANK selector. Operand sizes, addressing modes, instruction length, and field placement are
      defined by the generated forms below. Condition-code behavior: unchanged.'

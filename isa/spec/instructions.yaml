  IRET:
    title: Interrupt Return
    summary: Restore all saved control state from an interrupt return frame.
    description: 'Restore all saved control state from an interrupt return frame. IRET is the interrupt,
      trap, and exception return instruction. It restores all saved interrupt-frame state, including
      the saved DBANK selector, and does not validate FRAME_INFO.frame_type; malformed return frames
      are software errors and do not raise a separate architectural exception. Operand sizes, addressing
      modes, instruction length, and field placement are defined by the generated forms below.
      Condition-code behavior: unchanged.'

  LCALL:
    title: Long Call
    summary: Pushes a far return frame and atomically transfers control to a new CS:PC pair.
    description: >
      Long call is the CS-changing call instruction. It first constructs the far return frame
      on SS:SP, then commits the new CS and PC together. The two-operand form takes the new
      CS image from Dn and the target offset/address from the target EA. A segment-immediate
      plus offset-immediate form is not encoded because two 64-bit immediates would exceed
      the 8-word instruction limit.

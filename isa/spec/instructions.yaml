  SAVE:
    title: Save Processor State
    summary: Save modified processor state to a CPUID-defined save area.
    description: >
      Save modified processor state to a CPUID-defined save area. SAVE uses an
      XSAVEOPT-like policy for both base architectural state and enabled
      extension state: state components that are architecturally clean may be
      skipped, while modified components are written to their CPUID-defined
      fixed slots. The memory image does not carry per-component size records;
      software allocates the maximum required save area size reported by CPUID.
      The save-area base must be 4 KiB aligned. Operand sizes, addressing modes,
      instruction length, and field placement are defined by the generated forms
      below.
    save_area_format:
      fixed_base_bytes: 0x100
      fixed_slots:
        - {offset: 0x000, field: base save-slot valid bitmap}
        - {offset: 0x008, field: "D0, bank 0"}
        - {offset: 0x010, field: "D1, bank 0"}
        - {offset: 0x018, field: "D2, bank 0"}
        - {offset: 0x020, field: "D3, bank 0"}
        - {offset: 0x028, field: "D4, bank 0"}
        - {offset: 0x030, field: "D5, bank 0"}
        - {offset: 0x038, field: "D6, bank 0"}
        - {offset: 0x040, field: "D7, bank 0"}
        - {offset: 0x048, field: A0}
        - {offset: 0x050, field: A1}
        - {offset: 0x058, field: A2}
        - {offset: 0x060, field: A3}
        - {offset: 0x068, field: A4}
        - {offset: 0x070, field: A5}
        - {offset: 0x078, field: A6}
        - {offset: 0x080, field: A7}
        - {offset: 0x088, field: GS0}
        - {offset: 0x090, field: GS1}
        - {offset: 0x098, field: GS2}
        - {offset: 0x0a0, field: GS3}
        - {offset: 0x0a8, field: GS4}
        - {offset: 0x0b0, field: reserved padding}
        - {offset: 0x100, field: reserved padding to extension area begins}
        - {offset: 0x1000, field: extension component area begins}
      base_bitmap_bits:
        description: >
          Offset 0x000 contains a 64-bit validity mask for the fixed base save
          area. A set bit means that the corresponding base slot has been
          written by SAVE and is present in this save image. A clear bit means
          that the slot was skipped. PC, SP, CS, DS, SS, FLAGS, STATUS, and the
          current DBANK selector are not SAVE-area slots; exception and syscall
          stack frames carry those control-entry fields.
        reserved_bits: Unlisted bits are reserved; SAVE writes them as zero and RESTORE ignores them.
        mappings:
          - {bits: "n", slot: "D[n], bank 0", meaning: "n=0..7; validates Dn at 0x008 + 8*n"}
          - {bits: "8+n", slot: "A[n]", meaning: "n=0..7; validates An at 0x048 + 8*n"}
          - {bits: "16+n", slot: "GS[n]", meaning: "n=0..4; validates GSn at 0x088 + 8*n"}
      extension_component_formats: *save_extension_component_formats
      behavior: SAVE may clear bitmap bits for architecturally clean fixed-base slots.
      extension_components: >
        Extension component offsets begin no earlier than 0x1000 and are
        reported by CPUID. The save-area base address is 4 KiB aligned.
        Page-crossing points are statically derived from the aligned base
        address, CPUID-reported byte offsets, and component formats.
      extension_component_order: *save_extension_component_order
  SBB:
    title: Subtract With Borrow

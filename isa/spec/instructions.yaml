  XCHG:
    title: Exchange
    summary: Performs the exchange operation.
    description: 'Performs the exchange operation. The operation field gives the architectural effect
      as a compact expression or control action. Operand sizes, addressing modes, instruction length,
      and field placement are defined by the generated forms below. Condition-code behavior: unchanged.'
  XCHGSETAD:
    title: Exchange D And A Register Set
    summary: 'For each selected i: swap A[i] and D[i].'
    description: 'For each selected i: swap A[i] and D[i]. The operation field gives the architectural
      effect as a compact expression or control action. Operand sizes, addressing modes, instruction
      length, and field placement are defined by the generated forms below. Condition-code behavior:
      unchanged.'
  XCHGSETDA:
    title: Exchange A And D Register Set
    summary: 'For each selected i: swap D[i] and A[i].'
    description: 'For each selected i: swap D[i] and A[i]. The operation field gives the architectural
      effect as a compact expression or control action. Operand sizes, addressing modes, instruction
      length, and field placement are defined by the generated forms below. Condition-code behavior:
      unchanged.'
  XCHGSETDD:
    title: Exchange D Register Sets Between Banks
    summary: Swaps selected D registers between two data-register banks.
    description: 'Swaps selected D registers between two explicitly named DBANK values according
      to the bitmap operand. The current DBANK selector is not changed. Condition-code behavior:
      unchanged.'
  XOR:
    title: Bitwise Xor
    summary: Computes the bitwise XOR of the source and destination operands.
    description: 'Computes the bitwise XOR of the source and destination operands. The operation field
      gives the architectural effect as a compact expression or control action. Operand sizes, addressing
      modes, instruction length, and field placement are defined by the generated forms below. Condition-code
      behavior: update ZN clear CV.'
  YIELD:
    title: Yield
    summary: Hint scheduler or implementation that the current thread may yield.
    description: 'Hint scheduler or implementation that the current thread may yield. The operation
      field gives the architectural effect as a compact expression or control action. Operand sizes,
      addressing modes, instruction length, and field placement are defined by the generated forms
      below. Condition-code behavior: unchanged.'
  EXTZL:
    title: Zero Extend To Long
    summary: Performs the zero extend to long operation.
    description: 'Performs the zero extend to long operation. The operation field gives the architectural
      effect as a compact expression or control action. Operand sizes, addressing modes, instruction
      length, and field placement are defined by the generated forms below. Condition-code behavior:
      unchanged.'
  EXTZQ:
    title: Zero Extend To Quad
    summary: Performs the zero extend to quad operation.
    description: 'Performs the zero extend to quad operation. The operation field gives the architectural
      effect as a compact expression or control action. Operand sizes, addressing modes, instruction
      length, and field placement are defined by the generated forms below. Condition-code behavior:
      unchanged.'
  EXTZW:
    title: Zero Extend To Word
    summary: Performs the zero extend to word operation.
    description: 'Performs the zero extend to word operation. The operation field gives the architectural
      effect as a compact expression or control action. Operand sizes, addressing modes, instruction
      length, and field placement are defined by the generated forms below. Condition-code behavior:
      unchanged.'

operation_semantics:
  version: 0.1
  status: draft
  syntax_policy:
    condition_code:
      placement: mnemonic_suffix
      spelling: condition suffix is concatenated into the mnemonic
      dot_suffix_reserved_for: instruction_size
      applies_to: [Jcc, SETcc, DJcc, MOVcc, TRAPcc, FMOVcc, REPcc]
  notation:
    operand_read: "read operand value after applying its addressing mode and size"
    operand_write: "write result back to destination using operand size"
    EA_address: "compute effective address without reading memory unless operation says read"
    selector: "selector operands may name a D register or an encoded immediate selector"
    overlong: "extra trailing instruction words are ignored as padding payload"
    flags_ZNCV: "integer flags Z, N, C, V"
    fp_status: "floating-point accrued exception/status bits in FFLAGS"
    fflags:
      NV: invalid operation
      DZ: division by zero
      OF: overflow
      UF: underflow
      NX: inexact
  pcode_schema:
    version: 0.1
    form: list of statements
    statement_style: compact p-code text
    operands:
      src: source operand
      dst: destination operand
      lhs: left operand
      rhs: right operand
      acc: accumulator operand
      size: selected operand size
    primitives:
      read_operand: read the addressed operand using the selected size
      write_operand: write a value to the addressed operand using the selected size
      read_memory: read memory through a segment/address pair
      write_memory: write memory through a segment/address pair
      flags_add: compute ZNCV for addition
      flags_sub: compute ZNCV for subtraction
      flags_logic: compute Z/N and clear C/V for logical results
    manual_rendering: p-code statements are converted to short prose in the generated manual
  defaults:
    overlong_encoding: allowed
    undersized_encoding: trap or illegal decode
    memory_memory: operation opt-in
    unmentioned_flags: unchanged
    operand_evaluation_order: decode order
  operation_attributes:
    repeatable_operation:
      integer:
        - MOV
        - CMP
        - TEST
        - ADD
        - SUB
        - ADC
        - SBB
        - AND
        - OR
        - XOR
        - INC
        - DEC
        - INCN
        - DECN
        - NOT
        - NEG
        - ABS
        - EXTSW
        - EXTZW
        - EXTSL
        - EXTZL
        - EXTSQ
        - EXTZQ
        - MINU
        - MINS
        - MAXU
        - MAXS
        - SHL
        - SHR
        - SAR
        - ROL
        - ROR
        - RCL
        - RCR
        - BTEST
        - BSET
        - BCLR
        - BCHG
        - CTZ
        - CTS
        - CLZ
        - CLS
        - POPCNT
        - PARITY
        - MULU
        - MULS
        - MULHU
        - MULHS
        - MULHSU
        - MADD
        - MSUB
        - DIVU
        - DIVS
        - MODU
        - MODS
        - DIVMODU
        - DIVMODS
        - CLMUL
        - CLMULH
        - BNDUII
        - BNDUIX
        - BNDUXI
        - BNDUXX
        - BNDSII
        - BNDSIX
        - BNDSXI
        - BNDSXX
      fpu:
        - FMOV
        - FCLR
        - FXCHG
        - FCMP
        - FTEST
        - FCLASS
        - FCVT
        - FCVTU
        - FADD
        - FSUB
        - FMUL
        - FDIV
        - FREM
        - FMOD
        - FMADD
        - FMSUB
        - FNMADD
        - FNMSUB
        - FSQRT
        - FNEG
        - FABS
        - FINT
        - FINTRZ
        - FROUND
        - FTRUNC
        - FCEIL
        - FFLOOR
        - FCOPYSIGN
        - FGETEXP
        - FGETMAN
        - FSCALE
        - FMIN
        - FMAX
        - FBNDII
        - FBNDIX
        - FBNDXI
        - FBNDXX
        - FSIN
        - FCOS
        - FSINCOS
        - FTAN
        - FASIN
        - FACOS
        - FATAN
        - FSINH
        - FCOSH
        - FTANH
        - FATANH
        - FLOGN
        - FLOGNP1
        - FLOG2
        - FLOG10
        - FETOX
        - FETOXM1
        - FTWOTOX
        - FTENTOX
      state_query_general_only: [WAIT, CPUID]
      excluded_categories: [control flow, state-mutating system, atomic]
    streaming_candidate:
      integer: [MOV, CMP, TEST, ADD, SUB, AND, OR, XOR, EXTSW, EXTZW, EXTSL, EXTZL, EXTSQ, EXTZQ]
      fpu: [FMOV, FADD, FSUB, FMUL, FDIV, FMADD, FMSUB, FNMADD, FNMSUB, FCVT, FCVTU, FCMP, FTEST, FMIN, FMAX]
  prefix_availability:
    NOSPEC:
      table_code: NS
      scope: all_instructions
    SATURATE:
      table_code: SAT
      mnemonics: [ADD, SUB, ADC, SBB, INC, DEC, INCN, DECN, NEG, ABS, MINU, MINS, MAXU, MAXS]
    NONTEMPORAL:
      table_code: NT
      derived_from: memory_operand
    ADDRESS_UPDATE:
      table_code: UPD
      derived_from: update-eligible EA
    REPcc:
      table_code: REP
      operation_attribute: repeatable_operation
    REPG:
      table_code: REPG
      operation_attribute: repeatable_operation
    REPG_fast:
      table_code: FAST
      operation_attribute: streaming_candidate
  repeat_prefixes:
    REPcc:
      syntax: "REP{condition} Dn, <instruction>"
      alias: "REP = REPT"
      condition_suffix: condition suffix is concatenated into the mnemonic
      condition_set: full condition-code set
      counter: DREG
      counter_direction: signed counter moves toward zero
      counter_encoding:
        interpretation: signed two's-complement
        value_bits: 63..0
        zero_rule: zero counter performs no iteration
        index_value: architectural counter value before iteration update
        update_after_condition_true_iteration: positive counters decrement and negative counters increment toward zero
        condition_false_iteration_counter_rule: counter is not updated
        completion_rule: counter is zero or the REP condition is false
        fault_restart_rule: remaining signed count is preserved
      condition_source: REPFLAGS from the iteration observed value
      eligible_operation_attribute: repeatable_operation
      fpu_condition_domain: FLAGS only
      fpu_conditional_mnemonics: [FCMP, FTEST, FBNDII, FBNDIX, FBNDXI, FBNDXX]
      fpu_fflags_condition_repeat: not supported
      excluded_categories: [control_flow, system, atomic]
      nested_repeat_prefixes: forbidden
      commit_rule: a condition-false terminating iteration commits the body and leaves the counter unchanged
      architectural_flags: body instruction rules apply to the last completed iteration
      fflags_accumulation: OR completed iterations
      indexed_ea_counter_use:
        allowed: true
        counter_value: architectural signed counter value before iteration update
        example: "REP D0, EXTZL.B [A0 + D0 * 1], [A1 + D0 * 4]"
      observed_value_by_mnemonic:
        MOV: source value
        CMP: right operand minus left operand
        TEST: left operand bitwise-and right operand
        EXTSW: result value
        EXTZW: result value
        EXTSL: result value
        EXTZL: result value
        EXTSQ: result value
        EXTZQ: result value
      repflags_by_mnemonic:
        MOV: set Z/N from observed value and clear C/V
        CMP: compute subtract flags from right operand minus left operand
        TEST: set Z/N from observed value and clear C/V
        EXTSW: set Z/N from observed value and clear C/V
        EXTZW: set Z/N from observed value and clear C/V
        EXTSL: set Z/N from observed value and clear C/V
        EXTZL: set Z/N from observed value and clear C/V
        EXTSQ: set Z/N from observed value and clear C/V
        EXTZQ: set Z/N from observed value and clear C/V
        FCMP: floating-point compare flag rules
        FTEST: floating-point compare flag rules
        FBNDII: set V from interval check
        FBNDIX: set V from interval check
        FBNDXI: set V from interval check
        FBNDXX: set V from interval check
    REPG:
      syntax: "REPG Dn, { <instruction>; ... }"
      fast_contract_syntax: "REPGF Dn, { <instruction>; ... }"
      condition_set: none
      counter: DREG
      group_termination: ENDG_prefix
      fast_contract_alias:
        mnemonic: REPGF
        encoding: same as REPG
        assembler_requirement: >
          REPGF is rejected unless the assembler can prove that the group is
          eligible for REPG-fast by source-level checks. The source-level checks
          reject selected-counter writes and PC-relative addressing in addition
          to the base REPG legality rules.
      counter_encoding:
        interpretation: signed two's-complement
        value_bits: 63..0
        zero_rule: zero counter performs no iteration
        update_after_successful_group_iteration: positive counters decrement and negative counters increment toward zero
        completion_rule: final counter is zero
        fault_restart_rule: remaining signed count is preserved
        update_on_faulting_iteration: counter updates only after the whole group iteration completes
      fault_behavior:
        precise_at: faulting grouped instruction
        commit_rule: completed iterations and completed prior group instructions commit
        faulting_instruction_rule: ordinary scalar fault rule
        later_grouped_instructions: later grouped instructions are not executed
        continuation_state:
          saved_pc: faulting grouped instruction
          group_start:
            bits: 5
            range_words: 0..31
          counter_register:
            bits: 3
      eligible_operation_attribute: repeatable_operation
      streaming_candidate_attribute: streaming_candidate
      forbidden_instruction_classes:
        - control flow
        - system
        - atomic
        - stack operation
        - TLB operation
        - cache operation
        - fence operation
        - nested repeat
      alignment:
        grouping_window_bytes: 64
      encoding_scope:
        group_termination: ENDG_prefix
      commit_rule: only successful iterations and completed group instructions commit
      architectural_flags: grouped instruction rules apply to the last completed group instruction
      fflags_accumulation: OR completed iterations
  groups:
    sentinels:
      members: [HALT, ILLEGAL]
      operation_by_mnemonic:
        HALT: "enter halted supervisor state until an enabled event resumes execution"
        ILLEGAL: "raise illegal-instruction exception"
      pcode_by_mnemonic:
        HALT:
          - enter_halt_state_until_event()
        ILLEGAL:
          - raise_exception(illegal_instruction)
      privilege_by_mnemonic:
        HALT: supervisor
        ILLEGAL: any
      flags: unchanged

    core_control:
      members: [RESET, SYSRET, IRET, NOP, SYSCALL, BKPT, WAIT, YIELD, RFENCE, WFENCE, AFENCE]
      operation_by_mnemonic:
        RESET: "perform warm reset; preserve BOOTPC and BOOTCFG"
        SYSRET: "restore user control state and saved DBANK from syscall return frame"
        IRET: "restore all saved control state including DBANK from interrupt return frame; do not validate FRAME_INFO.frame_type"
        NOP: "no architectural state change"
        SYSCALL: "save SS:SP, CS:PC, DS, FLAGS/STATUS, and DBANK; set DBANK=0; use 32-byte entry table with 16-byte entry-address alignment; enter SPC/SCS/SDS with STATUS.PM set"
        BKPT: "raise breakpoint/debug exception"
        WAIT: "wait until event or interrupt according to privilege policy"
        YIELD: "hint scheduler or implementation that the current thread may yield"
        RFENCE: "order prior reads before later reads"
        WFENCE: "order prior writes before later writes"
        AFENCE: "order prior memory operations before later memory operations"
      pcode_by_mnemonic:
        RESET:
          - perform_warm_reset_preserving_boot_state()
        SYSRET:
          - restore_syscall_frame()
        IRET:
          - restore_interrupt_frame()
        NOP:
          - no_state_change()
        SYSCALL:
          - save_syscall_frame_and_enter_supervisor()
          - save interrupted DBANK in syscall frame
          - DBANK = 0
          - STATUS.PM = 1
          - PC = SPC
          - CS = SCS
          - DS = SDS
        BKPT:
          - raise_exception(breakpoint)
        WAIT:
          - wait_for_event_or_interrupt()
        YIELD:
          - yield_hint()
        RFENCE:
          - order_reads_before_later_reads()
        WFENCE:
          - order_writes_before_later_writes()
        AFENCE:
          - order_memory_before_later_memory()
      privilege_by_mnemonic:
        RESET: supervisor
        SYSRET: supervisor
        IRET: supervisor
        NOP: any
        SYSCALL: any
        BKPT: any
        WAIT: policy_controlled
        YIELD: any
        RFENCE: any
        WFENCE: any
        AFENCE: any
      serializing_by_mnemonic:
        RESET: true
        SYSRET: true
        IRET: true
        SYSCALL: true
        BKPT: true
      flags: unchanged

    integer_alu:
      members: [ADD, SUB, AND, OR, XOR, SUM]
      inputs: [src, dst]
      output: dst
      operation_by_mnemonic:
        ADD: "dst = dst + src"
        SUB: "dst = dst - src"
        AND: "dst = dst & src"
        OR: "dst = dst | src"
        XOR: "dst = dst ^ src"
        SUM: "dst = sum(selected D/A registers)"
      pcode_by_mnemonic:
        ADD:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = dst_v + src_v
          - write_operand(dst, result, size)
          - FLAGS = flags_add(dst_v, src_v, result, size)
        SUB:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = dst_v - src_v
          - write_operand(dst, result, size)
          - FLAGS = flags_sub(dst_v, src_v, result, size)
        AND:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = dst_v & src_v
          - write_operand(dst, result, size)
          - FLAGS = flags_logic(result, size)
        OR:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = dst_v | src_v
          - write_operand(dst, result, size)
          - FLAGS = flags_logic(result, size)
        XOR:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = dst_v ^ src_v
          - write_operand(dst, result, size)
          - FLAGS = flags_logic(result, size)
        SUM:
          - source_values = read_selected_registers(bitmap, D0..D7, A0..A7)
          - result = 0
          - for value in source_values
          - result = truncate(result + value, size)
          - write_operand(dst, result, size)
      flags_by_mnemonic:
        ADD: update Z/N/C/V
        SUB: update Z/N/C/V
        AND: update Z/N and clear C/V
        OR: update Z/N and clear C/V
        XOR: update Z/N and clear C/V
        SUM: unchanged
      memory: "at most one operand may be memory"

    integer_compare:
      members: [CMP, TEST]
      inputs: [lhs, rhs]
      operation_by_mnemonic:
        CMP: "tmp = rhs - lhs; update flags from tmp; do not store tmp"
        TEST: "tmp = rhs & lhs; update flags from tmp; do not store tmp"
      pcode_by_mnemonic:
        CMP:
          - lhs_v = read_operand(lhs, size)
          - rhs_v = read_operand(rhs, size)
          - result = rhs_v - lhs_v
          - FLAGS = flags_sub(rhs_v, lhs_v, result, size)
        TEST:
          - lhs_v = read_operand(lhs, size)
          - rhs_v = read_operand(rhs, size)
          - result = rhs_v & lhs_v
          - FLAGS = flags_logic(result, size)
      flags_by_mnemonic:
        CMP: update Z/N/C/V as subtraction
        TEST: update Z/N and clear C/V
      memory: "memory-memory form is allowed only when explicitly allocated"
      repeat_observed_value_by_mnemonic:
        CMP: right operand minus left operand
        TEST: left operand bitwise-and right operand

    integer_carry_alu:
      members: [ADC, SBB]
      inputs: [src, dst, FLAGS.C]
      output: dst
      operation_by_mnemonic:
        ADC: "dst = dst + src + C"
        SBB: "dst = dst - src - C"
      pcode_by_mnemonic:
        ADC:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - carry = FLAGS.C
          - result = dst_v + src_v + carry
          - write_operand(dst, result, size)
          - FLAGS = flags_add_with_carry(dst_v, src_v, carry, result, size)
        SBB:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - borrow = FLAGS.C
          - result = dst_v - src_v - borrow
          - write_operand(dst, result, size)
          - FLAGS = flags_sub_with_borrow(dst_v, src_v, borrow, result, size)
      flags: update Z/N/C/V
      memory: "at most one operand may be memory"

    integer_minmax:
      members: [MINU, MINS, MAXU, MAXS]
      inputs: [src, dst]
      output: dst
      operation_by_mnemonic:
        MINU: "dst = unsigned_min(dst, src)"
        MINS: "dst = signed_min(dst, src)"
        MAXU: "dst = unsigned_max(dst, src)"
        MAXS: "dst = signed_max(dst, src)"
      pcode_by_mnemonic:
        MINU:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = unsigned_min(dst_v, src_v)
          - write_operand(dst, result, size)
        MINS:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = signed_min(dst_v, src_v)
          - write_operand(dst, result, size)
        MAXU:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = unsigned_max(dst_v, src_v)
          - write_operand(dst, result, size)
        MAXS:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = signed_max(dst_v, src_v)
          - write_operand(dst, result, size)
      flags: may update Z/N
      memory: "at most one operand may be memory"

    data_movement:
      members: [MOV, XCHG]
      operation_by_mnemonic:
        MOV: "dst = src"
        XCHG: "tmp = lhs; lhs = rhs; rhs = tmp"
      pcode_by_mnemonic:
        MOV:
          - value = read_operand(src, size)
          - write_operand(dst, value, size)
        XCHG:
          - lhs_v = read_operand(lhs, size)
          - rhs_v = read_operand(rhs, size)
          - write_operand(lhs, rhs_v, size)
          - write_operand(rhs, lhs_v, size)
      flags: unchanged
      memory_by_mnemonic:
        MOV: "memory-memory form is allowed"
        XCHG: "memory-memory is disallowed unless one side is register or special"
      repeat_observed_value_by_mnemonic:
        MOV: source value

    stack:
      members: [PUSH, POP, PUSHM, POPM]
      stack_register: SP
      stack_segment: SS
      operation_by_mnemonic:
        PUSH: "SP = SP - 8; store operand to SS:SP"
        POP: "load operand from SS:SP; SP = SP + 8"
        PUSHM: "push selected D0-D7 then A0-A7 registers according to bitmap order"
        POPM: "pop selected A7-A0 then D7-D0 registers in inverse bitmap order"
      pcode_by_mnemonic:
        PUSH:
          - value = read_operand(src, Q)
          - SP = SP - 8
          - write_memory(SS, SP, value, Q)
        POP:
          - value = read_memory(SS, SP, Q)
          - write_operand(dst, value, Q)
          - SP = SP + 8
        PUSHM:
          - for_each_selected_register_forward(bitmap, D0..D7, A0..A7)
          - SP = SP - 8
          - write_memory(SS, SP, selected_register, Q)
        POPM:
          - for_each_selected_register_reverse(bitmap, A7..A0, D7..D0)
          - selected_register = read_memory(SS, SP, Q)
          - SP = SP + 8
      flags: unchanged

    register_set_transfer:
      members: [MOVSETAD, MOVSETDA, XCHGSETAD, XCHGSETDA]
      bitmap: "bits 0..7 select D/A register pairs; bits outside 0..7 are reserved"
      banked_forms: >
        Current-bank forms and forms that name DBn explicitly are part of the
        base register-set transfer group. Implementations report the number of
        available data-register banks through CPUID implementation properties.
      operation_by_mnemonic:
        MOVSETAD: "for each selected i: A[i] = D[src_bank_or_DBANK][i]"
        MOVSETDA: "for each selected i: D[dst_bank_or_DBANK][i] = A[i]"
        XCHGSETAD: "for each selected i: swap A[i] and D[bank_or_DBANK][i]"
        XCHGSETDA: "for each selected i: swap D[bank_or_DBANK][i] and A[i]"
      pcode_by_mnemonic:
        MOVSETAD:
          - for_each_selected_register_pair(bitmap)
          - bank = explicit_src_bank_or(DBANK)
          - A[i] = D[bank][i]
        MOVSETDA:
          - for_each_selected_register_pair(bitmap)
          - bank = explicit_dst_bank_or(DBANK)
          - D[bank][i] = A[i]
        XCHGSETAD:
          - for_each_selected_register_pair(bitmap)
          - bank = explicit_bank_or(DBANK)
          - require_bank_available(bank)
          - tmp = A[i]
          - A[i] = D[bank][i]
          - D[bank][i] = tmp
        XCHGSETDA:
          - for_each_selected_register_pair(bitmap)
          - bank = explicit_bank_or(DBANK)
          - require_bank_available(bank)
          - tmp = D[bank][i]
          - D[bank][i] = A[i]
          - A[i] = tmp
      flags: unchanged

    data_register_banking:
      members: [SELDB, GETDB, MOVSETDD, XCHGSETDD]
      operation_by_mnemonic:
        SELDB: "DBANK = selected bank"
        GETDB: "dst = zero_extend(DBANK)"
        MOVSETDD: "for each selected i: D[dst_bank][i] = D[src_bank][i]"
        XCHGSETDD: "for each selected i: swap D[bank_a][i] and D[bank_b][i]"
      pcode_by_mnemonic:
        SELDB:
          - bank = operand_bank_or_low_bits(src, 4)
          - require_bank_available(bank)
          - DBANK = bank
        GETDB:
          - dst = zero_extend(DBANK)
        MOVSETDD:
          - for_each_selected_register_pair(bitmap)
          - require_bank_available(dst_bank)
          - require_bank_available(src_bank)
          - D[dst_bank][i] = D[src_bank][i]
        XCHGSETDD:
          - for_each_selected_register_pair(bitmap)
          - require_bank_available(bank_a)
          - require_bank_available(bank_b)
          - tmp = D[bank_a][i]
          - D[bank_a][i] = D[bank_b][i]
          - D[bank_b][i] = tmp
      flags: unchanged

    integer_unary:
      members: [INC, DEC, INCN, DECN, NOT, NEG, ABS, CLR]
      input_output: dst
      operation_by_mnemonic:
        INC: "dst = dst + 1"
        DEC: "dst = dst - 1"
        INCN: "dst = dst + 1"
        DECN: "dst = dst - 1"
        NOT: "dst = bitwise_not(dst)"
        NEG: "dst = 0 - dst"
        ABS: "dst = absolute_value(dst)"
        CLR: "dst = 0"
      pcode_by_mnemonic:
        INC:
          - dst_v = read_operand(dst, size)
          - result = dst_v + 1
          - write_operand(dst, result, size)
          - FLAGS = flags_add(dst_v, 1, result, size)
        DEC:
          - dst_v = read_operand(dst, size)
          - result = dst_v - 1
          - write_operand(dst, result, size)
          - FLAGS = flags_sub(dst_v, 1, result, size)
        INCN:
          - dst_v = read_operand(dst, size)
          - result = dst_v + 1
          - write_operand(dst, result, size)
        DECN:
          - dst_v = read_operand(dst, size)
          - result = dst_v - 1
          - write_operand(dst, result, size)
        NOT:
          - dst_v = read_operand(dst, size)
          - result = bitwise_not(dst_v, size)
          - write_operand(dst, result, size)
          - FLAGS = flags_logic(result, size)
        NEG:
          - dst_v = read_operand(dst, size)
          - result = 0 - dst_v
          - write_operand(dst, result, size)
          - FLAGS = flags_sub(0, dst_v, result, size)
        ABS:
          - dst_v = read_operand(dst, size)
          - result = absolute_value(dst_v, size)
          - write_operand(dst, result, size)
          - FLAGS = flags_abs(dst_v, result, size)
        CLR:
          - write_operand(dst, 0, Q)
      flags_by_mnemonic:
        INC: update Z/N/C/V
        DEC: update Z/N/C/V
        INCN: unchanged
        DECN: unchanged
        NOT: update Z/N and clear C/V
        NEG: update Z/N/C/V
        ABS: update Z/N/C/V
        CLR: unchanged

    integer_extend:
      members: [EXTSW, EXTZW, EXTSL, EXTZL, EXTSQ, EXTZQ]
      inputs: [src]
      output: dst
      source_size_suffix: instruction size suffix
      destination_size_by_mnemonic:
        EXTSW: W
        EXTZW: W
        EXTSL: L
        EXTZL: L
        EXTSQ: Q
        EXTZQ: Q
      source_sizes_by_destination:
        W: [B]
        L: [B, W]
        Q: [B, W, L]
      operation_by_mnemonic:
        EXTSW: "dst.W = sign_extend(src[source_size])"
        EXTZW: "dst.W = zero_extend(src[source_size])"
        EXTSL: "dst.L = sign_extend(src[source_size])"
        EXTZL: "dst.L = zero_extend(src[source_size])"
        EXTSQ: "dst.Q = sign_extend(src[source_size])"
        EXTZQ: "dst.Q = zero_extend(src[source_size])"
      pcode_by_mnemonic:
        EXTSW:
          - src_v = read_operand(src, source_size)
          - result = sign_extend(src_v, W)
          - write_operand(dst, result, W)
        EXTZW:
          - src_v = read_operand(src, source_size)
          - result = zero_extend(src_v, W)
          - write_operand(dst, result, W)
        EXTSL:
          - src_v = read_operand(src, source_size)
          - result = sign_extend(src_v, L)
          - write_operand(dst, result, L)
        EXTZL:
          - src_v = read_operand(src, source_size)
          - result = zero_extend(src_v, L)
          - write_operand(dst, result, L)
        EXTSQ:
          - src_v = read_operand(src, source_size)
          - result = sign_extend(src_v, Q)
          - write_operand(dst, result, Q)
        EXTZQ:
          - src_v = read_operand(src, source_size)
          - result = zero_extend(src_v, Q)
          - write_operand(dst, result, Q)
      memory: "memory-memory form is allowed for bulk extension; source access width follows suffix, destination access width follows mnemonic"
      repeat_observed_value_by_mnemonic:
        EXTSW: result value
        EXTZW: result value
        EXTSL: result value
        EXTZL: result value
        EXTSQ: result value
        EXTZQ: result value
      flags: unchanged

    bit_reverse:
      members: [REVBYTE, REVBIT]
      inputs: [src]
      output: dst
      operation_by_mnemonic:
        REVBYTE: "dst = reverse_byte_order(src)"
        REVBIT: "dst = reverse_bit_order(src)"
      pcode_by_mnemonic:
        REVBYTE:
          - src_v = read_operand(src, size)
          - result = reverse_byte_order(src_v, size)
          - write_operand(dst, result, size)
        REVBIT:
          - src_v = read_operand(src, size)
          - result = reverse_bit_order(src_v, size)
          - write_operand(dst, result, size)
      flags: unchanged

    shifts_rotates:
      members: [SHL, SHR, SAR, ROL, ROR, RCL, RCR]
      inputs: [count, dst]
      output: dst
      operation_by_mnemonic:
        SHL: "count=0 leaves dst and FLAGS unchanged; otherwise dst = logical_shift_left(dst, count)"
        SHR: "count=0 leaves dst and FLAGS unchanged; otherwise dst = logical_shift_right(dst, count)"
        SAR: "count=0 leaves dst and FLAGS unchanged; otherwise dst = arithmetic_shift_right(dst, count)"
        ROL: "effective count=count mod width; zero effective count leaves dst and FLAGS unchanged; otherwise dst = rotate_left(dst, effective count)"
        ROR: "effective count=count mod width; zero effective count leaves dst and FLAGS unchanged; otherwise dst = rotate_right(dst, effective count)"
        RCL: "effective count=count mod (width+1); zero effective count leaves dst and FLAGS unchanged; otherwise dst,C = rotate_left_through_carry(dst, C, effective count)"
        RCR: "effective count=count mod (width+1); zero effective count leaves dst and FLAGS unchanged; otherwise dst,C = rotate_right_through_carry(dst, C, effective count)"
      count_rules:
        shifts:
          zero_count: count=0 leaves the destination and FLAGS unchanged
          over_width:
            SHL: result is zero; C is zero when count is greater than operand width
            SHR: result is zero; C is zero when count is greater than operand width
            SAR: result is sign fill; C is the original sign bit when count is greater than operand width
        rotates:
          effective_count: count modulo operand width
          zero_effective_count: destination and FLAGS unchanged
        carry_rotates:
          effective_count: count modulo operand width plus carry slot
          zero_effective_count: destination and FLAGS unchanged
      flag_rules:
        SHL:
          Z: result == 0
          N: most significant result bit
          C: last bit shifted out, or zero for count greater than operand width
          V: signed source value multiplied by 2^count is not representable in the operand width
        SHR:
          Z: result == 0
          N: most significant result bit
          C: last bit shifted out, or zero for count greater than operand width
          V: 0
        SAR:
          Z: result == 0
          N: most significant result bit
          C: last bit shifted out, or original sign bit for count greater than operand width
          V: 0
        ROL:
          Z: result == 0
          N: most significant result bit
          C: least significant result bit
          V: 0
        ROR:
          Z: result == 0
          N: most significant result bit
          C: most significant result bit
          V: 0
        RCL:
          Z: result == 0
          N: most significant result bit
          C: carry slot after the through-carry rotate
          V: 0
        RCR:
          Z: result == 0
          N: most significant result bit
          C: carry slot after the through-carry rotate
          V: 0
      pcode_by_mnemonic:
        SHL:
          - count_v = read_operand(count, selector)
          - dst_v = read_operand(dst, size)
          - result, carry = logical_shift_left_with_carry_out(dst_v, count_v, size)
          - write_operand(dst, result, size)
          - FLAGS = flags_shift_left(dst_v, count_v, result, carry, size)
        SHR:
          - count_v = read_operand(count, selector)
          - dst_v = read_operand(dst, size)
          - result, carry = logical_shift_right_with_carry_out(dst_v, count_v, size)
          - write_operand(dst, result, size)
          - FLAGS = flags_shift_right(dst_v, count_v, result, carry, size)
        SAR:
          - count_v = read_operand(count, selector)
          - dst_v = read_operand(dst, size)
          - result, carry = arithmetic_shift_right_with_carry_out(dst_v, count_v, size)
          - write_operand(dst, result, size)
          - FLAGS = flags_shift_arithmetic_right(dst_v, count_v, result, carry, size)
        ROL:
          - count_v = read_operand(count, selector)
          - dst_v = read_operand(dst, size)
          - result, carry = rotate_left_with_carry_out(dst_v, count_v, size)
          - write_operand(dst, result, size)
          - FLAGS = flags_rotate_left(dst_v, count_v, result, carry, size)
        ROR:
          - count_v = read_operand(count, selector)
          - dst_v = read_operand(dst, size)
          - result, carry = rotate_right_with_carry_out(dst_v, count_v, size)
          - write_operand(dst, result, size)
          - FLAGS = flags_rotate_right(dst_v, count_v, result, carry, size)
        RCL:
          - count_v = read_operand(count, selector)
          - dst_v = read_operand(dst, size)
          - result, carry = rotate_left_through_carry(dst_v, FLAGS.C, count_v, size)
          - write_operand(dst, result, size)
          - FLAGS = flags_rotate_through_carry_left(dst_v, count_v, result, carry, size)
        RCR:
          - count_v = read_operand(count, selector)
          - dst_v = read_operand(dst, size)
          - result, carry = rotate_right_through_carry(dst_v, FLAGS.C, count_v, size)
          - write_operand(dst, result, size)
          - FLAGS = flags_rotate_through_carry_right(dst_v, count_v, result, carry, size)
      flags:
        mode: per_shift

    bit_ops:
      members: [BTEST, BSET, BCLR, BCHG]
      inputs: [bit_index, dst]
      output_by_mnemonic:
        BTEST: none
        BSET: dst
        BCLR: dst
        BCHG: dst
      operation_by_mnemonic:
        BTEST: "old = bit(dst, bit_index)"
        BSET: "old = bit(dst, bit_index); set_bit(dst, bit_index)"
        BCLR: "old = bit(dst, bit_index); clear_bit(dst, bit_index)"
        BCHG: "old = bit(dst, bit_index); toggle_bit(dst, bit_index)"
      pcode_by_mnemonic:
        BTEST:
          - bit_index_v = read_operand(bit_index, selector)
          - dst_v = read_operand(dst, size)
          - old_bit = bit(dst_v, bit_index_v)
          - FLAGS.Z = not old_bit
          - FLAGS.N = unchanged
          - FLAGS.C = unchanged
          - FLAGS.V = unchanged
        BSET:
          - bit_index_v = read_operand(bit_index, selector)
          - dst_v = read_operand(dst, size)
          - old_bit = bit(dst_v, bit_index_v)
          - FLAGS.Z = not old_bit
          - FLAGS.N = unchanged
          - FLAGS.C = unchanged
          - FLAGS.V = unchanged
          - result = set_bit(dst_v, bit_index_v)
          - write_operand(dst, result, size)
        BCLR:
          - bit_index_v = read_operand(bit_index, selector)
          - dst_v = read_operand(dst, size)
          - old_bit = bit(dst_v, bit_index_v)
          - FLAGS.Z = not old_bit
          - FLAGS.N = unchanged
          - FLAGS.C = unchanged
          - FLAGS.V = unchanged
          - result = clear_bit(dst_v, bit_index_v)
          - write_operand(dst, result, size)
        BCHG:
          - bit_index_v = read_operand(bit_index, selector)
          - dst_v = read_operand(dst, size)
          - old_bit = bit(dst_v, bit_index_v)
          - FLAGS.Z = not old_bit
          - FLAGS.N = unchanged
          - FLAGS.C = unchanged
          - FLAGS.V = unchanged
          - result = toggle_bit(dst_v, bit_index_v)
          - write_operand(dst, result, size)
      flags: set Z when the old bit was zero; preserve N/C/V

    bit_counts:
      members: [CTZ, CTS, CLZ, CLS, POPCNT, PARITY]
      inputs: [src]
      output: dst or FLAGS.Z
      operation_by_mnemonic:
        CTZ: "dst = count_trailing_zero_bits(src); zero input returns operand width"
        CTS: "dst = count_trailing_set_bits(src)"
        CLZ: "dst = count_leading_zero_bits(src); zero input returns operand width"
        CLS: "dst = count_leading_set_bits(src)"
        POPCNT: "dst = population_count(src); zero input returns 0"
        PARITY: "FLAGS.Z = population_count(src) & 1; odd parity sets Z"
      pcode_by_mnemonic:
        CTZ:
          - src_v = read_operand(src, size)
          - result = count_trailing_zero_bits_or_width(src_v, size)
          - write_operand(dst, result, size)
        CTS:
          - src_v = read_operand(src, size)
          - result = count_trailing_set_bits(src_v, size)
          - write_operand(dst, result, size)
        CLZ:
          - src_v = read_operand(src, size)
          - result = count_leading_zero_bits_or_width(src_v, size)
          - write_operand(dst, result, size)
        CLS:
          - src_v = read_operand(src, size)
          - result = count_leading_set_bits(src_v, size)
          - write_operand(dst, result, size)
        POPCNT:
          - src_v = read_operand(src, size)
          - result = population_count(src_v, size)
          - write_operand(dst, result, size)
        PARITY:
          - src_v = read_operand(src, size)
          - FLAGS.Z = population_count(src_v, size) & 1
          - FLAGS.N = unchanged
          - FLAGS.C = unchanged
          - FLAGS.V = unchanged
      flags_by_mnemonic:
        CTZ: unchanged
        CTS: unchanged
        CLZ: unchanged
        CLS: unchanged
        POPCNT: unchanged
        PARITY: set Z to odd parity; preserve N/C/V

    multiply_divide:
      members: [MULU, MULS, MULHU, MULHS, MULHSU, MADD, MSUB, DIVU, DIVS, MODU, MODS, DIVMODU, DIVMODS, CLMUL, CLMULH]
      operation_by_mnemonic:
        MULU: "dst = low_half(unsigned(dst) * unsigned(src))"
        MULS: "dst = low_half(signed(dst) * signed(src))"
        MULHU: "dst = high_half(unsigned(dst) * unsigned(src))"
        MULHS: "dst = high_half(signed(dst) * signed(src))"
        MULHSU: "dst = high_half(signed(dst) * unsigned(src))"
        MADD: "acc = acc + low_half(src * multiplier)"
        MSUB: "acc = acc - low_half(src * multiplier)"
        DIVU: "dst = unsigned(dst) / unsigned(src)"
        DIVS: "dst = signed(dst) / signed(src)"
        MODU: "dst = unsigned(dst) % unsigned(src)"
        MODS: "dst = signed(dst) % signed(src)"
        DIVMODU: "dividend = quotient; quotient = unsigned(dividend) / unsigned(src); remainder = unsigned(dividend) % unsigned(src)"
        DIVMODS: "dividend = quotient; quotient = signed(dividend) / signed(src); remainder = signed(dividend) % signed(src)"
        CLMUL: "dst = low_half(carryless_multiply(dst, src))"
        CLMULH: "dst = high_half(carryless_multiply(dst, src))"
      pcode_by_mnemonic:
        MULU:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = low_half(unsigned(dst_v) * unsigned(src_v), size)
          - write_operand(dst, result, size)
        MULS:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = low_half(signed(dst_v) * signed(src_v), size)
          - write_operand(dst, result, size)
        MULHU:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = high_half(unsigned(dst_v) * unsigned(src_v), size)
          - write_operand(dst, result, size)
        MULHS:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = high_half(signed(dst_v) * signed(src_v), size)
          - write_operand(dst, result, size)
        MULHSU:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = high_half(signed(dst_v) * unsigned(src_v), size)
          - write_operand(dst, result, size)
        MADD:
          - src_v = read_operand(src, size)
          - multiplier_v = read_operand(multiplier, size)
          - acc_v = read_operand(acc, size)
          - product = low_half(src_v * multiplier_v, size)
          - write_operand(acc, acc_v + product, size)
        MSUB:
          - src_v = read_operand(src, size)
          - multiplier_v = read_operand(multiplier, size)
          - acc_v = read_operand(acc, size)
          - product = low_half(src_v * multiplier_v, size)
          - write_operand(acc, acc_v - product, size)
        DIVU:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - {trap: divide_by_zero, when: src_v == 0}
          - result = unsigned(dst_v) / unsigned(src_v)
          - write_operand(dst, result, size)
        DIVS:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - {trap: divide_by_zero, when: src_v == 0}
          - result = signed(dst_v) / signed(src_v)
          - write_operand(dst, result, size)
        MODU:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - {trap: divide_by_zero, when: src_v == 0}
          - result = unsigned(dst_v) % unsigned(src_v)
          - write_operand(dst, result, size)
        MODS:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - {trap: divide_by_zero, when: src_v == 0}
          - result = signed(dst_v) % signed(src_v)
          - write_operand(dst, result, size)
        DIVMODU:
          - src_v = read_operand(src, size)
          - dividend = read_operand(quotient, size)
          - {trap: divide_by_zero, when: src_v == 0}
          - quotient_v = unsigned(dividend) / unsigned(src_v)
          - remainder_v = unsigned(dividend) % unsigned(src_v)
          - write_operand(quotient, quotient_v, size)
          - write_operand(remainder, remainder_v, size)
        DIVMODS:
          - src_v = read_operand(src, size)
          - dividend = read_operand(quotient, size)
          - {trap: divide_by_zero, when: src_v == 0}
          - quotient_v = signed(dividend) / signed(src_v)
          - remainder_v = signed(dividend) % signed(src_v)
          - write_operand(quotient, quotient_v, size)
          - write_operand(remainder, remainder_v, size)
        CLMUL:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = low_half(carryless_multiply(dst_v, src_v), size)
          - write_operand(dst, result, size)
        CLMULH:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = high_half(carryless_multiply(dst_v, src_v), size)
          - write_operand(dst, result, size)
      traps:
        - divide_by_zero
        - signed overflow trap when defined

    bounds:
      members: [BNDUII, BNDUIX, BNDUXI, BNDUXX, BNDSII, BNDSIX, BNDSXI, BNDSXX]
      inputs: [lo, value, hi]
      bounds_mode_names:
        II: inclusive-inclusive
        IX: inclusive-exclusive
        XI: exclusive-inclusive
        XX: exclusive-exclusive
      interval_by_mnemonic:
        BNDUII: "[lo, hi]"
        BNDSII: "[lo, hi]"
        BNDUIX: "[lo, hi)"
        BNDSIX: "[lo, hi)"
        BNDUXI: "(lo, hi]"
        BNDSXI: "(lo, hi]"
        BNDUXX: "(lo, hi)"
        BNDSXX: "(lo, hi)"
      operation_by_mnemonic:
        BNDUII: "V = value not_in [lo, hi]"
        BNDUIX: "V = value not_in [lo, hi)"
        BNDUXI: "V = value not_in (lo, hi]"
        BNDUXX: "V = value not_in (lo, hi)"
        BNDSII: "V = value not_in [lo, hi]"
        BNDSIX: "V = value not_in [lo, hi)"
        BNDSXI: "V = value not_in (lo, hi]"
        BNDSXX: "V = value not_in (lo, hi)"
      pcode_by_mnemonic:
        BNDUII:
          - lo_v = read_operand(lo, size)
          - value_v = read_operand(value, size)
          - hi_v = read_operand(hi, size)
          - FLAGS.V = not_in_interval(unsigned(value_v), unsigned(lo_v), unsigned(hi_v), inclusive, inclusive)
        BNDUIX:
          - lo_v = read_operand(lo, size)
          - value_v = read_operand(value, size)
          - hi_v = read_operand(hi, size)
          - FLAGS.V = not_in_interval(unsigned(value_v), unsigned(lo_v), unsigned(hi_v), inclusive, exclusive)
        BNDUXI:
          - lo_v = read_operand(lo, size)
          - value_v = read_operand(value, size)
          - hi_v = read_operand(hi, size)
          - FLAGS.V = not_in_interval(unsigned(value_v), unsigned(lo_v), unsigned(hi_v), exclusive, inclusive)
        BNDUXX:
          - lo_v = read_operand(lo, size)
          - value_v = read_operand(value, size)
          - hi_v = read_operand(hi, size)
          - FLAGS.V = not_in_interval(unsigned(value_v), unsigned(lo_v), unsigned(hi_v), exclusive, exclusive)
        BNDSII:
          - lo_v = read_operand(lo, size)
          - value_v = read_operand(value, size)
          - hi_v = read_operand(hi, size)
          - FLAGS.V = not_in_interval(signed(value_v), signed(lo_v), signed(hi_v), inclusive, inclusive)
        BNDSIX:
          - lo_v = read_operand(lo, size)
          - value_v = read_operand(value, size)
          - hi_v = read_operand(hi, size)
          - FLAGS.V = not_in_interval(signed(value_v), signed(lo_v), signed(hi_v), inclusive, exclusive)
        BNDSXI:
          - lo_v = read_operand(lo, size)
          - value_v = read_operand(value, size)
          - hi_v = read_operand(hi, size)
          - FLAGS.V = not_in_interval(signed(value_v), signed(lo_v), signed(hi_v), exclusive, inclusive)
        BNDSXX:
          - lo_v = read_operand(lo, size)
          - value_v = read_operand(value, size)
          - hi_v = read_operand(hi, size)
          - FLAGS.V = not_in_interval(signed(value_v), signed(lo_v), signed(hi_v), exclusive, exclusive)
      signedness_by_mnemonic:
        BNDUII: unsigned
        BNDUIX: unsigned
        BNDUXI: unsigned
        BNDUXX: unsigned
        BNDSII: signed
        BNDSIX: signed
        BNDSXI: signed
        BNDSXX: signed
      bounds_mode_by_mnemonic:
        BNDUII: II
        BNDSII: II
        BNDUIX: IX
        BNDSIX: IX
        BNDUXI: XI
        BNDSXI: XI
        BNDUXX: XX
        BNDSXX: XX
      flags:
        V: set when the value is out of bounds
        ZNC: unchanged

    control_flow:
      members: [JMP, Jcc, LJMP, CALL, LCALL, RET, LRET, SETcc, DJcc, MOVcc, TRAP, TRAPcc, TRACE]
      operation_by_mnemonic:
        JMP: "PC = target"
        Jcc: "if condition(cc, FLAGS) then PC = target else fall through"
        LJMP: "atomically commit CS = new_cs and PC = target"
        CALL: "push return address; PC = target"
        LCALL: "push return PC and CS; atomically commit CS = new_cs and PC = target"
        RET: "PC = pop return address"
        LRET: "read return PC and CS from SS:SP; SP = SP + 16; atomically commit CS and PC"
        SETcc: "dst = condition(cc, FLAGS) ? 1 : 0"
        DJcc: "counter = counter - 1; if counter != 0 and condition(cc, FLAGS) then PC = target"
        MOVcc: "if condition(cc, FLAGS) then dst = src else leave dst unchanged"
        TRAP: "raise architectural TRAP vector 0x05"
        TRAPcc: "if condition(cc, FLAGS) then raise architectural TRAP vector 0x05"
        TRACE: "if tracing is enabled, emit trace marker; otherwise nop"
      pcode_by_mnemonic:
        JMP:
          - target_v = read_operand(target, address)
          - PC = target_v
        Jcc:
          - target_v = read_operand(target, address)
          - if condition(cc, FLAGS) then PC = target_v else fall_through
        LJMP:
          - new_cs_v = read_operand(new_cs, Q)
          - target_v = read_operand(target, address)
          - CS = new_cs_v
          - PC = target_v
        CALL:
          - target_v = read_operand(target, address)
          - return_pc = next_pc
          - SP = SP - 8
          - write_memory(SS, SP, return_pc, Q)
          - PC = target_v
        LCALL:
          - new_cs_v = read_operand(new_cs, Q)
          - target_v = read_operand(target, address)
          - return_pc = next_pc
          - return_cs = CS
          - SP = SP - 16
          - write_memory(SS, SP, return_pc, Q)
          - write_memory(SS, SP + 8, return_cs, Q)
          - CS = new_cs_v
          - PC = target_v
        RET:
          - return_pc = read_memory(SS, SP, Q)
          - SP = SP + 8
          - PC = return_pc
        LRET:
          - return_pc = read_memory(SS, SP, Q)
          - return_cs = read_memory(SS, SP + 8, Q)
          - SP = SP + 16
          - CS = return_cs
          - PC = return_pc
        SETcc:
          - result = condition(cc, FLAGS) ? 1 : 0
          - write_operand(dst, result, size)
        DJcc:
          - counter_v = read_operand(counter, size)
          - counter_next = counter_v - 1
          - write_operand(counter, counter_next, size)
          - if counter_next != 0 and condition(cc, FLAGS) then PC = target else fall_through
        MOVcc:
          - src_v = read_operand(src, size)
          - if condition(cc, FLAGS) then write_operand(dst, src_v, size) else leave_dst_unchanged
        TRAP:
          - raise_exception(trap_vector_0x05)
        TRAPcc:
          - if condition(cc, FLAGS) then raise_exception(trap_vector_0x05) else fall_through
        TRACE:
          - emit_trace_marker_if_enabled(marker)
      long_transfer_operands: "LJMP/LCALL take the new CS image from Dn and the target PC value/address from EA"
      atomic_cs_pc_commit: [LJMP, LCALL, LRET, SYSRET, IRET]
      flags: unchanged

    ea_utility:
      members: [TESTCANON, LEA, SEGLEA]
      operation_by_mnemonic:
        TESTCANON: "compute address and set V if noncanonical; do not read memory"
        LEA: "dst = effective_address(src); do not read memory"
        SEGLEA: "dst = segment_translation(src); do not perform canonical check or page walk"
      pcode_by_mnemonic:
        TESTCANON:
          - address = effective_address(src)
          - FLAGS.V = noncanonical(address)
        LEA:
          - address = effective_address(src)
          - write_operand(dst, address, Q)
        SEGLEA:
          - address = segment_translate_only(src)
          - write_operand(dst, address, Q)
      flags_by_mnemonic:
        TESTCANON:
          V: set when the address is noncanonical
          ZNC: unchanged
        LEA: unchanged
        SEGLEA:
          V: set when segment bounds check fails
          ZNC: unchanged

    atomics:
      members: [CMPXCHG, FETCHADD, FETCHSUB, FETCHAND, FETCHOR, FETCHXOR]
      atomic: true
      memory_ordering:
        operand: order
        type: memory_order
        encodings:
          relaxed: 0
          acquire: 1
          release: 2
          acqrel: 3
          seqcst: 4
        reserved_encodings: [5, 6, 7]
        consume: treated as acquire
        description: >
          The memory-order qualifier controls visibility ordering around the
          atomic read-modify-write. Relaxed preserves atomicity only. Acquire
          orders later memory operations after the atomic operation. Release
          orders prior memory operations before it. Acquire-release applies both
          directions. Sequential consistency additionally participates in the
          global sequentially consistent order for atomic operations.
      operation_by_mnemonic:
        CMPXCHG: "old = memory; if old == expected then memory = desired; flags report compare result"
        FETCHADD: "old = memory; memory = old + src; return old"
        FETCHSUB: "old = memory; memory = old - src; return old"
        FETCHAND: "old = memory; memory = old & src; return old"
        FETCHOR: "old = memory; memory = old | src; return old"
        FETCHXOR: "old = memory; memory = old ^ src; return old"
      pcode_by_mnemonic:
        CMPXCHG:
          - order_v = read_operand(order, memory_order)
          - atomic_begin(memory, order_v)
          - old = read_operand(memory, size)
          - expected_v = read_operand(expected, size)
          - desired_v = read_operand(desired, size)
          - if old == expected_v then write_operand(memory, desired_v, size) else leave_memory_unchanged
          - FLAGS = flags_sub(old, expected_v, old - expected_v, size)
          - atomic_end(memory, order_v)
        FETCHADD:
          - order_v = read_operand(order, memory_order)
          - atomic_begin(memory, order_v)
          - old = read_operand(memory, size)
          - src_v = read_operand(src, size)
          - result = old + src_v
          - write_operand(memory, result, size)
          - write_operand(src, old, size)
          - atomic_end(memory, order_v)
        FETCHSUB:
          - order_v = read_operand(order, memory_order)
          - atomic_begin(memory, order_v)
          - old = read_operand(memory, size)
          - src_v = read_operand(src, size)
          - result = old - src_v
          - write_operand(memory, result, size)
          - write_operand(src, old, size)
          - atomic_end(memory, order_v)
        FETCHAND:
          - order_v = read_operand(order, memory_order)
          - atomic_begin(memory, order_v)
          - old = read_operand(memory, size)
          - src_v = read_operand(src, size)
          - result = old & src_v
          - write_operand(memory, result, size)
          - write_operand(src, old, size)
          - atomic_end(memory, order_v)
        FETCHOR:
          - order_v = read_operand(order, memory_order)
          - atomic_begin(memory, order_v)
          - old = read_operand(memory, size)
          - src_v = read_operand(src, size)
          - result = old | src_v
          - write_operand(memory, result, size)
          - write_operand(src, old, size)
          - atomic_end(memory, order_v)
        FETCHXOR:
          - order_v = read_operand(order, memory_order)
          - atomic_begin(memory, order_v)
          - old = read_operand(memory, size)
          - src_v = read_operand(src, size)
          - result = old ^ src_v
          - write_operand(memory, result, size)
          - write_operand(src, old, size)
          - atomic_end(memory, order_v)
      memory: "memory operand is required and must be addressable memory"

    system_registers:
      members: [RDCR, WRCR, RDSEG, WRSEG, RDFLAGS, WRFLAGS, RDFSTATUS, WRFSTATUS, RDSTATUS, WRSTATUS, RDPTC, RDPMC, CPUID]
      operation_by_mnemonic:
        RDCR: "dst = read_cr(cr)"
        WRCR: "write_cr(cr, src)"
        RDSEG: "dst = read_segment_register(seg)"
        WRSEG: "write_segment_register(seg, src)"
        RDFLAGS: "dst = zero_extend(FLAGS[15:0])"
        WRFLAGS: "FLAGS = src[15:0]"
        RDFSTATUS: "dst = zero_extend(FSTATUS[15:0])"
        WRFSTATUS: "FSTATUS = src[15:0]"
        RDSTATUS: "dst = zero_extend(STATUS[15:0])"
        WRSTATUS: "STATUS = src[15:0]"
        RDPTC: "dst = read_page_table_counter()"
        RDPMC: "dst = read_performance_counter(counter_id)"
        CPUID: "query/result register = cpuid(query/result register)"
      pcode_by_mnemonic:
        RDCR:
          - value = read_cr(cr)
          - write_operand(dst, value, Q)
        WRCR:
          - value = read_operand(src, Q)
          - write_cr(cr, value)
        RDSEG:
          - value = read_segment_register(seg)
          - write_operand(dst, value, Q)
        WRSEG:
          - value = read_operand(src, Q)
          - write_segment_register(seg, value)
        RDFLAGS:
          - value = zero_extend(FLAGS[15:0])
          - write_operand(dst, value, Q)
        WRFLAGS:
          - value = read_operand(src, W)
          - FLAGS = value
        RDFSTATUS:
          - value = read_fstatus()
          - value = zero_extend(value[15:0])
          - write_operand(dst, value, Q)
        WRFSTATUS:
          - value = read_operand(src, W)
          - write_fstatus(value)
        RDSTATUS:
          - value = zero_extend(STATUS[15:0])
          - write_operand(dst, value, Q)
        WRSTATUS:
          - value = read_operand(src, W)
          - STATUS = value
        RDPTC:
          - value = read_page_table_counter()
          - write_operand(dst, value, Q)
        RDPMC:
          - value = read_performance_counter(counter_id)
          - write_operand(dst, value, Q)
        CPUID:
          - query = read_operand(reg, Q)
          - result = cpuid(query.class, query.leaf, query.index)
          - write_operand(reg, result, Q)
      privilege_by_mnemonic:
        RDCR: supervisor
        WRCR: supervisor
        RDSEG: policy controlled
        WRSEG: policy controlled
        RDFLAGS: unprivileged
        WRFLAGS: unprivileged
        RDFSTATUS: unprivileged
        WRFSTATUS: unprivileged
        RDSTATUS: supervisor
        WRSTATUS: supervisor
        RDPTC: configurable
        RDPMC: configurable
        CPUID: user allowed
      flags_by_mnemonic:
        RDCR: unchanged
        WRCR: unchanged
        RDSEG: unchanged
        WRSEG: unchanged
        RDFLAGS: unchanged
        WRFLAGS: writes FLAGS from source low bits
        RDFSTATUS: unchanged
        WRFSTATUS: writes FSTATUS from source bits
        RDSTATUS: unchanged
        WRSTATUS: unchanged
        RDPTC: unchanged
        RDPMC: unchanged
        CPUID: unchanged

    virtualization_acceleration:
      members: [ENCINST]
      cpuid_feature: OPTIONAL_EXTENSION_FEATURES.VIRTACCEL
      inputs:
        explicit: dst
        implicit_registers:
          D0[63:32]: form selector before execution
          D0[31:0]: encode control word before execution; carries size, prefix, condition, operand-count, payload-mode, and descriptor-indirection fields
          D0: byte count or encode-status after execution
          D1: operand descriptor 0
          D2: operand descriptor 1
          D3: operand descriptor 2
      operation_by_mnemonic:
        ENCINST: "write canonical encoding described by D0-D3 to dst EA"
      pcode_by_mnemonic:
        ENCINST:
          - form_selector = D0[63:32]
          - control_word = D0[31:0]
          - descriptor = read_encinst_descriptor(form_selector, control_word, D1, D2, D3)
          - encoded = canonical_encode_instruction(descriptor)
          - if encoded.invalid then D0 = encoded.status and memory unchanged
          - if encoded.valid then write_instruction_image(dst, encoded.words)
          - if encoded.valid then D0 = encoded.byte_count
      canonicalization: >
        ENCINST accepts semantic instruction descriptors rather than raw opcode bits.
        It emits only the canonical encoding selected by the ISA specification after
        mnemonic, size, condition, prefix, operand type, operand value, alias, and
        effective-address choices are resolved.
      memory: >
        The explicit operand is only the destination EA. The destination must be
        addressable memory. Register destinations, immediate destinations, and
        PC-relative destinations are not valid. Address-update prefixes are not
        valid for ENCINST; software advances a pointer explicitly using the byte count
        returned in D0.
      descriptor_payloads: >
        D1-D3 hold compact operand descriptors. Small literal payloads and
        payload-width selections are carried directly in the D0 control word when
        they fit. Larger immediates, displacements, or extended effective-address
        descriptors are referenced by an operand descriptor according to the
        control-word payload mode instead of consuming additional implicit D registers.
      privilege: user allowed when ENCINST is present
      flags: unchanged

    tlb_context:
      members: [SWPT, SWPTA, INVTLB, INVPAGE, INVASID, VTOP, PTATTR, PTQUERY, SAVE, RESTORE]
      operation_by_mnemonic:
        SWPT: "PTCR = new_ptcr; ASCR is cleared; TLB is invalidated; serializing"
        SWPTA: "PTCR = new_ptcr; ASCR.ASID = asid; ASCR.AE = 1; TLB context is updated; serializing"
        INVTLB: "invalidate all TLB entries"
        INVPAGE: "invalidate TLB entry for linear page"
        INVASID: "invalidate TLB entries for ASID"
        VTOP: "perform page walk and return translated physical address/status"
        PTATTR: "perform page walk and return page attributes/status"
        PTQUERY: "perform page walk and return query result/status"
        SAVE: "save modified base and extension state to CPUID-defined memory layout"
        RESTORE: "restore base and extension state from CPUID-defined memory layout"
      pcode_by_mnemonic:
        SWPT:
          - new_ptcr_v = read_operand(new_ptcr, Q)
          - PTCR = new_ptcr_v
          - ASCR = 0
          - invalidate_tlb_all()
          - serializing_boundary()
        SWPTA:
          - new_ptcr_v = read_operand(new_ptcr, Q)
          - asid_v = read_operand(asid, imm16)
          - PTCR = new_ptcr_v
          - ASCR.ASID = asid_v
          - ASCR.AE = 1
          - update_tlb_context()
          - serializing_boundary()
        INVTLB:
          - invalidate_tlb_all()
          - serializing_boundary()
        INVPAGE:
          - page_v = read_operand(page, address)
          - invalidate_tlb_page(page_v)
          - serializing_boundary()
        INVASID:
          - invalidate_tlb_asid(asid)
          - serializing_boundary()
        VTOP:
          - walk_result = perform_page_walk(src)
          - write_operand(outputs, walk_result.physical_address, Q)
        PTATTR:
          - walk_result = perform_page_walk(src)
          - write_operand(outputs, walk_result.attributes, Q)
        PTQUERY:
          - walk_result = perform_page_walk(src)
          - write_operand(outputs, walk_result.status, Q)
        SAVE:
          - save_modified_processor_state(memory)
        RESTORE:
          - restore_processor_state(memory)
      privilege: supervisor

    cache:
      members: [PREFETCH, INVDCACHE, INVICACHE, FLSHDCACHE, WRBKDCACHE, SYNCCACHE]
      operation_by_mnemonic:
        PREFETCH: "hint that EA will be read soon; no architectural fault unless policy says otherwise"
        INVDCACHE: "invalidate data cache block or range"
        INVICACHE: "invalidate instruction cache block or range"
        FLSHDCACHE: "flush data cache block or range"
        WRBKDCACHE: "write back data cache block or range"
        SYNCCACHE: "synchronize instruction/data cache visibility"
      pcode_by_mnemonic:
        PREFETCH:
          - prefetch_memory(src)
        INVDCACHE:
          - invalidate_data_cache(target)
        INVICACHE:
          - invalidate_instruction_cache(target)
        FLSHDCACHE:
          - flush_data_cache(target)
        WRBKDCACHE:
          - writeback_data_cache(target)
        SYNCCACHE:
          - synchronize_instruction_data_caches(target)
      privilege_by_mnemonic:
        PREFETCH: user allowed
        INVDCACHE: {default: supervisor, policy_controlled: true}
        INVICACHE: {default: supervisor, policy_controlled: true}
        FLSHDCACHE: {default: supervisor, policy_controlled: true}
        WRBKDCACHE: {default: supervisor, policy_controlled: true}
        SYNCCACHE: {default: supervisor, policy_controlled: true}
      flags: unchanged

    fpu_move_compare:
      members: [FNOP, FMOV, FMOVcc, FMOVCR, FCLR, FXCHG, FCMP, FTEST, FCLASS, FCVT, FCVTU]
      operation_by_mnemonic:
        FNOP: "no FPU state change"
        FMOV: "dst = src"
        FMOVcc: "if condition(cc, FLAGS) then dst = src else leave dst unchanged"
        FMOVCR: "dst = selected floating-point constant"
        FCLR: "dst = +0.0"
        FXCHG: "tmp = lhs; lhs = rhs; rhs = tmp"
        FCMP: "compare src and dst and update FLAGS; unordered sets V"
        FTEST: "compare src or dst against zero and update FLAGS; unordered sets V"
        FCLASS: "dst = floating_classification_bitmap(src)"
        FCVT: "dst = convert_signed_or_float(src)"
        FCVTU: "dst = convert_unsigned_or_float(src)"
      pcode_by_mnemonic:
        FNOP:
          - no_state_change()
        FMOV:
          - value = read_operand(src, size)
          - write_operand(dst, value, size)
        FMOVcc:
          - value = read_operand(src, size)
          - if condition(cc, FLAGS) then write_operand(dst, value, size) else leave_dst_unchanged
        FMOVCR:
          - value = selected_floating_constant(constant_id)
          - write_operand(dst, value, size)
        FCLR:
          - write_operand(dst, +0.0, size)
        FXCHG:
          - lhs_v = read_operand(lhs, size)
          - rhs_v = read_operand(rhs, size)
          - write_operand(lhs, rhs_v, size)
          - write_operand(rhs, lhs_v, size)
        FCMP:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - FLAGS = floating_compare_flags(dst_v, src_v, size)
        FTEST:
          - value = read_operand(src, size)
          - FLAGS = floating_compare_flags(value, +0.0, size)
        FCLASS:
          - src_v = read_operand(src, size)
          - result = floating_classification_bitmap(src_v, size)
          - write_operand(dst, result, Q)
        FCVT:
          - src_v = read_operand(src, source_format)
          - result = convert_signed_or_float(src_v, destination_format)
          - write_operand(dst, result, destination_format)
        FCVTU:
          - src_v = read_operand(src, source_format)
          - result = convert_unsigned_or_float(src_v, destination_format)
          - write_operand(dst, result, destination_format)
      fp_flags_by_mnemonic:
        FNOP: unchanged
        FMOV: unchanged
        FMOVcc: unchanged
        FMOVCR: unchanged
        FCLR: unchanged
        FXCHG: unchanged
        FCMP:
          update_when_required: [NV]
        FTEST:
          update_when_required: [NV]
        FCLASS: unchanged
        FCVT:
          update_when_required: [NV, OF, UF, NX]
        FCVTU:
          update_when_required: [NV, OF, UF, NX]

    fpu_arithmetic:
      members: [FADD, FSUB, FMUL, FDIV, FREM, FMOD, FMADD, FMSUB, FNMADD, FNMSUB, FSQRT, FNEG, FABS, FINT, FINTRZ, FROUND, FTRUNC, FCEIL, FFLOOR, FCOPYSIGN, FGETEXP, FGETMAN, FSCALE, FMIN, FMAX, FBNDII, FBNDIX, FBNDXI, FBNDXX]
      operation_by_mnemonic:
        FADD: "dst = dst + src"
        FSUB: "dst = dst - src"
        FMUL: "dst = dst * src"
        FDIV: "dst = dst / src"
        FREM: "dst = ieee_remainder(dst, src)"
        FMOD: "dst = modulo(dst, src)"
        FMADD: "dst = round_once(lhs * rhs + dst)"
        FMSUB: "dst = round_once(lhs * rhs - dst)"
        FNMADD: "dst = round_once(-(lhs * rhs) + dst)"
        FNMSUB: "dst = round_once(-(lhs * rhs) - dst)"
        FSQRT: "dst = sqrt(src)"
        FNEG: "dst = -src"
        FABS: "dst = abs(src)"
        FINT: "dst = floating_integral_value(src)"
        FINTRZ: "dst = round_toward_zero(src)"
        FROUND: "dst = round_current_mode(src)"
        FTRUNC: "dst = truncate(src)"
        FCEIL: "dst = ceil(src)"
        FFLOOR: "dst = floor(src)"
        FCOPYSIGN: "dst = copy_sign(magnitude_src, sign_src)"
        FGETEXP: "dst = exponent(src)"
        FGETMAN: "dst = mantissa(src)"
        FSCALE: "dst = scale(src, dst)"
        FMIN: "dst = min_num(dst, src) according to nan_policy"
        FMAX: "dst = max_num(dst, src) according to nan_policy"
        FBNDII: "V = unordered(lo, value, hi) or value not_in [lo, hi]"
        FBNDIX: "V = unordered(lo, value, hi) or value not_in [lo, hi)"
        FBNDXI: "V = unordered(lo, value, hi) or value not_in (lo, hi]"
        FBNDXX: "V = unordered(lo, value, hi) or value not_in (lo, hi)"
      pcode_by_mnemonic:
        FADD:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = dst_v + src_v
          - write_operand(dst, result, size)
        FSUB:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = dst_v - src_v
          - write_operand(dst, result, size)
        FMUL:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = dst_v * src_v
          - write_operand(dst, result, size)
        FDIV:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = dst_v / src_v
          - write_operand(dst, result, size)
        FREM:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = ieee_remainder(dst_v, src_v)
          - write_operand(dst, result, size)
        FMOD:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = modulo(dst_v, src_v)
          - write_operand(dst, result, size)
        FMADD:
          - lhs_v = read_operand(lhs, size)
          - rhs_v = read_operand(rhs, size)
          - dst_v = read_operand(dst, size)
          - result = round_once(lhs_v * rhs_v + dst_v, size)
          - write_operand(dst, result, size)
        FMSUB:
          - lhs_v = read_operand(lhs, size)
          - rhs_v = read_operand(rhs, size)
          - dst_v = read_operand(dst, size)
          - result = round_once(lhs_v * rhs_v - dst_v, size)
          - write_operand(dst, result, size)
        FNMADD:
          - lhs_v = read_operand(lhs, size)
          - rhs_v = read_operand(rhs, size)
          - dst_v = read_operand(dst, size)
          - result = round_once(-(lhs_v * rhs_v) + dst_v, size)
          - write_operand(dst, result, size)
        FNMSUB:
          - lhs_v = read_operand(lhs, size)
          - rhs_v = read_operand(rhs, size)
          - dst_v = read_operand(dst, size)
          - result = round_once(-(lhs_v * rhs_v) - dst_v, size)
          - write_operand(dst, result, size)
        FSQRT:
          - src_v = read_operand(src, size)
          - result = sqrt(src_v)
          - write_operand(dst, result, size)
        FNEG:
          - src_v = read_operand(src, size)
          - result = -src_v
          - write_operand(dst, result, size)
        FABS:
          - src_v = read_operand(src, size)
          - result = abs(src_v)
          - write_operand(dst, result, size)
        FINT:
          - src_v = read_operand(src, size)
          - result = floating_integral_value(src_v)
          - write_operand(dst, result, size)
        FINTRZ:
          - src_v = read_operand(src, size)
          - result = round_toward_zero(src_v)
          - write_operand(dst, result, size)
        FROUND:
          - src_v = read_operand(src, size)
          - result = round_current_mode(src_v)
          - write_operand(dst, result, size)
        FTRUNC:
          - src_v = read_operand(src, size)
          - result = truncate(src_v)
          - write_operand(dst, result, size)
        FCEIL:
          - src_v = read_operand(src, size)
          - result = ceil(src_v)
          - write_operand(dst, result, size)
        FFLOOR:
          - src_v = read_operand(src, size)
          - result = floor(src_v)
          - write_operand(dst, result, size)
        FCOPYSIGN:
          - sign_v = read_operand(sign_src, size)
          - magnitude_v = read_operand(magnitude_src, size)
          - result = copy_sign(magnitude_v, sign_v)
          - write_operand(dst, result, size)
        FGETEXP:
          - src_v = read_operand(src, size)
          - result = exponent(src_v)
          - write_operand(dst, result, size)
        FGETMAN:
          - src_v = read_operand(src, size)
          - result = mantissa(src_v)
          - write_operand(dst, result, size)
        FSCALE:
          - src_v = read_operand(src, size)
          - scale_v = read_operand(dst, size)
          - result = scale(src_v, scale_v)
          - write_operand(dst, result, size)
        FMIN:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = min_num(dst_v, src_v, nan_policy)
          - write_operand(dst, result, size)
        FMAX:
          - src_v = read_operand(src, size)
          - dst_v = read_operand(dst, size)
          - result = max_num(dst_v, src_v, nan_policy)
          - write_operand(dst, result, size)
        FBNDII:
          - lo_v = read_operand(lo, size)
          - value_v = read_operand(value, size)
          - hi_v = read_operand(hi, size)
          - FLAGS.V = unordered(lo_v, value_v, hi_v) or not_in_interval(value_v, lo_v, hi_v, inclusive, inclusive)
        FBNDIX:
          - lo_v = read_operand(lo, size)
          - value_v = read_operand(value, size)
          - hi_v = read_operand(hi, size)
          - FLAGS.V = unordered(lo_v, value_v, hi_v) or not_in_interval(value_v, lo_v, hi_v, inclusive, exclusive)
        FBNDXI:
          - lo_v = read_operand(lo, size)
          - value_v = read_operand(value, size)
          - hi_v = read_operand(hi, size)
          - FLAGS.V = unordered(lo_v, value_v, hi_v) or not_in_interval(value_v, lo_v, hi_v, exclusive, inclusive)
        FBNDXX:
          - lo_v = read_operand(lo, size)

  ENCINST:
    title: Encode Instruction
    summary: Writes one canonical instruction encoding to a destination effective address.
    description: 'ENCINST is an optional virtualization-acceleration instruction for software encoders,
      runtime code generators, hypervisors, and binary translation systems. Its only explicit
      operand is the destination effective address. The instruction descriptor is supplied
      through implicit D registers. ENCINST validates the descriptor, selects the
      canonical Bedrock encoding, and writes the resulting 16-bit-word instruction image to
      ordinary memory at the destination EA. Before execution, D0 is split into a high 32-bit
      form selector and a low 32-bit encode control word. D0 receives the number of bytes written
      on success or an implementation-defined negative encode-status value on descriptor failure.
      Memory permissions, segmentation, paging, and cache synchronization follow the ordinary
      store and SYNCCACHE rules. Condition-code behavior: unchanged.'

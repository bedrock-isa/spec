version: draft-v1

# Instruction semantic catalogs. Concrete opcode bit patterns are generated by
# isa/tools/alloc_z3.py from this file, ea.yaml, and opcodes.yaml.
# This file intentionally does not contain hand-authored instruction patterns.
#
# Format:
#   families.<name>.compact_primary: forms that may compete for primary payloads.
#   families.<name>.integer: integer extended-catalog forms.
#   families.<name>.system: atomic/system/cache extended-catalog forms.
#   families.<name>.fpu: FPU extended-catalog forms.
#
# A compact-primary entry may also carry extended_forms so all operand profiles
# of the same mnemonic family stay visually together.
#
# Operand convention:
#   operands: [{name: src, type: EA}, {name: dst, type: DREG}]
#   alternatives use a list of operand lists.
#   selector means a D-register-or-small-immediate selector field.

operand_schema:
  role_name_pattern: "^[a-z][a-z0-9_]*$"
  types:
    - AREG
    - DBANK
    - DREG
    - DREG_OR_AREG
    - EA
    - EA_or_range
    - IMM_EA
    - FREG
    - CR
    - SPREG
    - SREG
    - bitmap16
    - condition
    - imm
    - imm16
    - imm32
    - imm64
    - linear_or_EA
    - memory_order
    - outputs
    - relative_imm
    - selector
    - selector_imm6
  condition_role: cc
  selector_roles: [count, bit_index, offset, width]

canonical_aliases:
  - alias: JMP
    target: Jcc
    condition: T
    canonical_disassembly: JMP
    required_target_forms:
      - [condition, relative_imm]
      - [condition, EA]
  - alias: TRAP
    target: TRAPcc
    condition: T
    canonical_disassembly: TRAP
    required_target_forms:
      - [condition]


  WRSEG:
    title: Write Segment Register
    summary: Write a segment register image from a D register.
    description: >
      WRSEG writes a 64-bit segment register image from the source D register to an S-class segment
      register. The S operand selector maps 000=CS, 001=DS, 010=SS, 011=GS0, 100=GS1,
      101=GS2, 110=GS3, and 111=GS4. General writes to CS are illegal; use LJMP, LCALL,
      LRET, SYSRET, or IRET for CS-changing control transfer. Condition-code behavior:
      unchanged.
  WRSTATUS:
    title: Write Status
    summary: Write the processor STATUS register from a D register.
    description: >

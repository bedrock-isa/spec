  RESTORE:
    title: Restore Processor State
    summary: Restore processor state from a CPUID-defined save area.
    description: >
      Restore processor state from a CPUID-defined save area. The save area uses
      a fixed architectural layout discovered through CPUID; it does not contain
      a per-component size table. The save-area base must be 4 KiB aligned.
      RESTORE is the matching restore operation for SAVE and may restore base
      architectural state as well as enabled extension state from the same save
      image. Operand sizes, addressing modes, instruction length, and field
      placement are defined by the generated forms below.
    save_area_format:
      fixed_base_bytes: 0x100
      fixed_slots:
        - {offset: 0x000, field: base save-slot valid bitmap}
        - {offset: 0x008, field: "D0, bank 0"}
        - {offset: 0x010, field: "D1, bank 0"}
        - {offset: 0x018, field: "D2, bank 0"}
        - {offset: 0x020, field: "D3, bank 0"}
        - {offset: 0x028, field: "D4, bank 0"}
        - {offset: 0x030, field: "D5, bank 0"}
        - {offset: 0x038, field: "D6, bank 0"}
        - {offset: 0x040, field: "D7, bank 0"}
        - {offset: 0x048, field: A0}
        - {offset: 0x050, field: A1}
        - {offset: 0x058, field: A2}
        - {offset: 0x060, field: A3}
        - {offset: 0x068, field: A4}
        - {offset: 0x070, field: A5}
        - {offset: 0x078, field: A6}
        - {offset: 0x080, field: A7}
        - {offset: 0x088, field: GS0}
        - {offset: 0x090, field: GS1}
        - {offset: 0x098, field: GS2}
        - {offset: 0x0a0, field: GS3}
        - {offset: 0x0a8, field: GS4}
        - {offset: 0x0b0, field: reserved padding}
        - {offset: 0x100, field: reserved padding to extension area begins}
        - {offset: 0x1000, field: extension component area begins}
      base_bitmap_bits:
        description: >
          Offset 0x000 contains a 64-bit validity mask for the fixed base save
          area. A set bit means that the corresponding base slot is present in
          this save image. A clear bit means that RESTORE leaves that register or
          slot unchanged. PC, SP, CS, DS, SS, FLAGS, STATUS, and the current
          DBANK selector are not SAVE-area slots; exception and syscall stack
          frames carry those control-entry fields.
        reserved_bits: Unlisted bits are reserved; SAVE writes them as zero and RESTORE ignores them.
        mappings:
          - {bits: "n", slot: "D[n], bank 0", meaning: "n=0..7; validates Dn at 0x008 + 8*n"}
          - {bits: "8+n", slot: "A[n]", meaning: "n=0..7; validates An at 0x048 + 8*n"}
          - {bits: "16+n", slot: "GS[n]", meaning: "n=0..4; validates GSn at 0x088 + 8*n"}
      extension_component_formats: &save_extension_component_formats
        - component_id: 0x0001
          name: DATA_REGISTER_BANKS
          title: Additional Data-Register Banks
          validity: >
            Each extension component begins with a component-local validity
            bitmap. If a register bit is clear, RESTORE leaves that nonzero-bank
            D register unchanged.
          description: >
            This component stores data-register banks other than bank 0. Bank 0 is
            part of the fixed base save area. The 0x40-byte bank record shown below
            begins after the 128-bit component-local validity bitmap and repeats in
            increasing bank-number order for b = 1..DBANK_COUNT-1.
          size: "0x010 + 0x40 * (DBANK_COUNT - 1)"
          component_bitmap_bits:
            description: >
              Offsets +0x000..+0x00f contain a 128-bit validity mask for
              individual D-register slots in the architectural DBANK namespace.
              Bit 8*b+n corresponds to Dn in bank b. Bank 0 bits are reserved
              because bank 0 lives in the fixed base save area.
            reserved_bits: Bits for bank 0 and unimplemented banks are reserved; SAVE writes them as zero and RESTORE ignores them.
            mappings:
              - {bits: "8*b+n", slot: "D[n], bank b", meaning: "b=1..DBANK_COUNT-1 and n=0..7; validates Dn at +0x010 + 0x40*(b-1) + 8*n"}
          slots:
            - {offset: 0x000, field: "component-local valid bitmap[63:0]", meaning: "low 64 bits of the 128-bit nonzero-bank D-register validity mask"}
            - {offset: 0x008, field: "component-local valid bitmap[127:64]", meaning: "high 64 bits of the 128-bit nonzero-bank D-register validity mask"}
            - repeat:
                count: 8
                offset_start: 0x010
                offset_stride: 0x008
                field_template: "D{n}, bank b"
                meaning_template: "data register D{n} in data-register bank b"
        - component_id: 0x0002
          name: FLOATING_POINT
          title: Floating-Point State
          validity: >
            Each extension component begins with a component-local validity
            bitmap. If a state bit is clear, RESTORE leaves that floating-point
            state item unchanged.
          description: >
            This component stores the floating-point accrued exception flags, the
            floating-point status/control-mode word, and the architectural floating-point
            register file. FFLAGS and FSTATUS are separate 16-bit architectural state.
            The F register file remains Q-sized and starts on the next 8-byte boundary.
          size: 0x110
          component_bitmap_bits:
            description: >
              Offset +0x000 contains a 64-bit validity mask for the floating-point
              state slots stored in this component. A set bit means that the
              corresponding state item is present in the save image.
            reserved_bits: Unlisted bits are reserved; SAVE writes them as zero and RESTORE ignores them.
            mappings:
              - {bits: "0", slot: "FFLAGS", meaning: "validates FFLAGS at +0x008"}
              - {bits: "1", slot: "FSTATUS", meaning: "validates FSTATUS at +0x00a"}
              - {bits: "2+n", slot: "F[n]", meaning: "n=0..31; validates Fn at +0x010 + 8*n"}
          slots:
            - {offset: 0x000, field: "component-local valid bitmap", meaning: "validity mask for floating-point state slots"}
            - {offset: 0x008, field: "FFLAGS[15:0]", meaning: "floating-point accrued exception flags"}
            - {offset: 0x00a, field: "FSTATUS[15:0]", meaning: "floating-point control and status-mode register"}
            - {offset: 0x00c, field: "reserved padding", meaning: "reserved padding to align the F register file"}
            - repeat:
                count: 32
                offset_start: 0x010
                offset_stride: 0x008
                field_template: "F{n}"
                meaning_template: "floating-point register F{n}"
      behavior: RESTORE ignores fixed-base slots whose bitmap bit is clear.
      extension_components: >
        Extension component offsets begin no earlier than 0x1000 and are
        reported by CPUID. The save-area base address is 4 KiB aligned.
        Page-crossing points are statically derived from the aligned base
        address, CPUID-reported byte offsets, and component formats.
      extension_component_order: &save_extension_component_order >
        CPUID SAVE_AREA_LAYOUT component descriptors are indexed from 2 upward.
        That descriptor index order is the architectural extension-component
        order. COMPONENT_OFFSET values are numeric byte offsets and must be
        strictly increasing in descriptor order. Base Bedrock components appear
        as DATA_REGISTER_BANKS followed by FLOATING_POINT when both components
        are implemented; later extension components are appended in descriptor
        order. The SAVE area has no
        architectural total-size upper bound beyond the CPUID-reported
        SAVE_AREA_SIZE value for the selected implementation/profile.

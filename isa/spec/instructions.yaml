  WRFSTATUS:
    title: Write Floating-Point Status
    summary: Write the FPU status/control register from a D register.
    description: >
      WRFSTATUS writes the architectural 16-bit FSTATUS register from the low 16 bits of the source D register. Reserved
      FSTATUS bits must be zero. FFLAGS is a separate accrued floating-point exception flag

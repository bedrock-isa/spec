version: draft-v1

segment_registers:
  - name: CS
    selector: code
    width: 64
  - name: DS
    selector: data
    width: 64
  - name: SS
    selector: stack
    width: 64
  - name: GS0
    selector: general
    width: 64
  - name: GS1
    selector: general
    width: 64
  - name: GS2
    selector: general
    width: 64
  - name: GS3
    selector: general
    width: 64
  - name: GS4
    selector: general
    width: 64

layout:
  base_page:
    bits: [63, 12]
    unit_bytes: 4096
    description: page-unit segment base index
  exponent:
    bits: [11, 7]
    field_name: e
    description: segment size exponent
  mantissa:
    bits: [6, 1]
    field_name: m
    description: segment size mantissa
  bounds_only:
    bits: [0, 0]
    field_name: b
    description: bounds-only mode enable; check segment bounds without adding the segment base address

disabled_when:
  mantissa: 0

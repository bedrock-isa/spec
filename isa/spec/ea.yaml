version: draft-v1

fields:
  d:
    width: 3
  a:
    width: 3

manual_text:
  form_descriptions:
    DREG: "Direct data-register operand. The low three EA bits select Dn, and the instruction uses that register value without a memory access."
    AREG: "Direct address-register operand. The low three EA bits select An, and the instruction uses that register value without a memory access."
    SPREG: "Direct stack-pointer operand. The EA code selects SP, and the instruction uses SP without a memory access."
    INDIRECT: "Address-register indirect memory operand. The instruction forms the effective address from An and then accesses memory at that address. Address-update prefixes may use this form."
    A_DISP16: "Address-register relative memory operand with a signed 16-bit displacement payload."
    A_DISP32: "Address-register relative memory operand with a signed 32-bit displacement payload."
    PC_DISP16: "Program-counter relative memory operand with a signed 16-bit displacement payload. The address is interpreted through the fixed CS segment."
    PC_DISP32: "Program-counter relative memory operand with a signed 32-bit displacement payload. The address is interpreted through the fixed CS segment."
    PC_DISP64: "Program-counter relative memory operand with a signed 64-bit displacement payload. The address is interpreted through the fixed CS segment."
    SP_DISP16: "Stack-pointer relative memory operand with a signed 16-bit displacement payload. The address is interpreted through the fixed SS segment."
    SP_DISP32: "Stack-pointer relative memory operand with a signed 32-bit displacement payload. The address is interpreted through the fixed SS segment."
    SP_DISP64: "Stack-pointer relative memory operand with a signed 64-bit displacement payload. The address is interpreted through the fixed SS segment."
    ABS32: "Absolute memory operand using a signed 32-bit address payload."
    ABS64: "Absolute memory operand using an unsigned 64-bit address payload."
    IMM16: "Immediate operand supplied by one following payload word. The value is sign-extended to the instruction operand size."
    IMM32: "Immediate operand supplied by two following payload words. The value is sign-extended to the instruction operand size."
    IMM64: "Immediate operand supplied by four following payload words. The value is not sign-extended."
    EXTENDED: "Compact escape to the extended EA descriptor. The descriptor selects a segment-aware or indexed addressing form."
    S32_INDEXED_EXTENDED: "Compact escape to the signed-32 indexed extended EA descriptor. The descriptor sign-extends the low 32 bits of the D index before scaling."
    SEG_A_INDEX: "Segment-selectable indexed memory operand using An, Dn, and an explicit scale. Omitted segment syntax assembles to DS."
    SEG_A_INDEX_DISP16: "Segment-selectable indexed memory operand using An, Dn, an explicit scale, and a signed 16-bit displacement. Omitted segment syntax assembles to DS."
    SEG_A_INDEX_DISP32: "Segment-selectable indexed memory operand using An, Dn, an explicit scale, and a signed 32-bit displacement. Omitted segment syntax assembles to DS."
    SEG_A_INDEX_DISP64: "Segment-selectable indexed memory operand using An, Dn, an explicit scale, and a signed 64-bit displacement. Omitted segment syntax assembles to DS."
    SEG_A: "Segment-selectable address-register indirect memory operand. Segment pre-translation applies when the selected segment is enabled. Address-update prefixes may use this form."
    SEG_A_DISP16: "Segment-selectable address-register relative memory operand with a signed 16-bit displacement payload."
    SEG_A_DISP32: "Segment-selectable address-register relative memory operand with a signed 32-bit displacement payload."
    SEG_ABS32: "Segment-selectable absolute memory operand using a signed 32-bit address payload."
    SEG_ABS64: "Segment-selectable absolute memory operand using an unsigned 64-bit address payload."
    SP_INDEX_DISP16: "Stack-pointer indexed memory operand using SP, Dn, an explicit scale, and a signed 16-bit displacement. The descriptor segment field is reserved."
    SP_INDEX_DISP32: "Stack-pointer indexed memory operand using SP, Dn, an explicit scale, and a signed 32-bit displacement. The descriptor segment field is reserved."
    SP_INDEX_DISP64: "Stack-pointer indexed memory operand using SP, Dn, an explicit scale, and a signed 64-bit displacement. The descriptor segment field is reserved."
    PC_INDEX_DISP16: "Program-counter indexed memory operand using PC, Dn, an explicit scale, and a signed 16-bit displacement. The descriptor segment field is reserved."
    PC_INDEX_DISP32: "Program-counter indexed memory operand using PC, Dn, an explicit scale, and a signed 32-bit displacement. The descriptor segment field is reserved."
    PC_INDEX_DISP64: "Program-counter indexed memory operand using PC, Dn, an explicit scale, and a signed 64-bit displacement. The descriptor segment field is reserved."
    S32_SEG_A_INDEX: "Segment-selectable signed-32 indexed memory operand using An, Dn.L, and an explicit scale. Omitted segment syntax assembles to DS."
    S32_SEG_A_INDEX_DISP16: "Segment-selectable signed-32 indexed memory operand using An, Dn.L, an explicit scale, and a signed 16-bit displacement. Omitted segment syntax assembles to DS."
    S32_SEG_A_INDEX_DISP32: "Segment-selectable signed-32 indexed memory operand using An, Dn.L, an explicit scale, and a signed 32-bit displacement. Omitted segment syntax assembles to DS."
    S32_SEG_A_INDEX_DISP64: "Segment-selectable signed-32 indexed memory operand using An, Dn.L, an explicit scale, and a signed 64-bit displacement. Omitted segment syntax assembles to DS."
    S32_SP_INDEX_DISP16: "Stack-pointer signed-32 indexed memory operand using SP, Dn.L, an explicit scale, and a signed 16-bit displacement. The descriptor segment field is reserved."
    S32_SP_INDEX_DISP32: "Stack-pointer signed-32 indexed memory operand using SP, Dn.L, an explicit scale, and a signed 32-bit displacement. The descriptor segment field is reserved."
    S32_SP_INDEX_DISP64: "Stack-pointer signed-32 indexed memory operand using SP, Dn.L, an explicit scale, and a signed 64-bit displacement. The descriptor segment field is reserved."
    S32_PC_INDEX_DISP16: "Program-counter signed-32 indexed memory operand using PC, Dn.L, an explicit scale, and a signed 16-bit displacement. The descriptor segment field is reserved."
    S32_PC_INDEX_DISP32: "Program-counter signed-32 indexed memory operand using PC, Dn.L, an explicit scale, and a signed 32-bit displacement. The descriptor segment field is reserved."
    S32_PC_INDEX_DISP64: "Program-counter signed-32 indexed memory operand using PC, Dn.L, an explicit scale, and a signed 64-bit displacement. The descriptor segment field is reserved."
  payload_descriptions:
    DREG: "no payload words"
    AREG: "no payload words"
    SPREG: "no payload words"
    INDIRECT: "no payload words"
    A_DISP16: "one signed 16-bit displacement word"
    A_DISP32: "two signed 32-bit displacement words"
    PC_DISP16: "one signed 16-bit displacement word"
    PC_DISP32: "two signed 32-bit displacement words"
    PC_DISP64: "four signed 64-bit displacement words"
    SP_DISP16: "one signed 16-bit displacement word"
    SP_DISP32: "two signed 32-bit displacement words"
    SP_DISP64: "four signed 64-bit displacement words"
    ABS32: "two-word signed 32-bit absolute address"
    ABS64: "four-word unsigned 64-bit absolute address"
    IMM16: "one immediate payload word"
    IMM32: "two immediate payload words"
    IMM64: "four immediate payload words"
    EXTENDED: "one descriptor word followed by mode-specific payload words"
    S32_INDEXED_EXTENDED: "one descriptor word followed by signed-32 indexed mode payload words"
    SEG_A_INDEX: "descriptor word only"
    SEG_A_INDEX_DISP16: "descriptor word plus one signed 16-bit displacement word"
    SEG_A_INDEX_DISP32: "descriptor word plus two signed 32-bit displacement words"
    SEG_A_INDEX_DISP64: "descriptor word plus four signed 64-bit displacement words"
    SEG_A: "descriptor word only"
    SEG_A_DISP16: "descriptor word plus one signed 16-bit displacement word"
    SEG_A_DISP32: "descriptor word plus two signed 32-bit displacement words"
    SEG_ABS32: "descriptor word plus a two-word signed 32-bit absolute address"
    SEG_ABS64: "descriptor word plus a four-word unsigned 64-bit absolute address"
    SP_INDEX_DISP16: "descriptor word plus one signed 16-bit displacement word"
    SP_INDEX_DISP32: "descriptor word plus two signed 32-bit displacement words"
    SP_INDEX_DISP64: "descriptor word plus four signed 64-bit displacement words"
    PC_INDEX_DISP16: "descriptor word plus one signed 16-bit displacement word"
    PC_INDEX_DISP32: "descriptor word plus two signed 32-bit displacement words"
    PC_INDEX_DISP64: "descriptor word plus four signed 64-bit displacement words"
    S32_SEG_A_INDEX: "descriptor word only"
    S32_SEG_A_INDEX_DISP16: "descriptor word plus one signed 16-bit displacement word"
    S32_SEG_A_INDEX_DISP32: "descriptor word plus two signed 32-bit displacement words"
    S32_SEG_A_INDEX_DISP64: "descriptor word plus four signed 64-bit displacement words"
    S32_SP_INDEX_DISP16: "descriptor word plus one signed 16-bit displacement word"
    S32_SP_INDEX_DISP32: "descriptor word plus two signed 32-bit displacement words"
    S32_SP_INDEX_DISP64: "descriptor word plus four signed 64-bit displacement words"
    S32_PC_INDEX_DISP16: "descriptor word plus one signed 16-bit displacement word"
    S32_PC_INDEX_DISP32: "descriptor word plus two signed 32-bit displacement words"
    S32_PC_INDEX_DISP64: "descriptor word plus four signed 64-bit displacement words"

ea_forms:
  compact:
    - name: DREG
      pattern: "000 ddd"
      class: register
      register_class: D
      ea_capable: true
      memory: false
      operands:
        - type: DREG
          field: d
      update_eligible: false

    - name: AREG
      pattern: "001 aaa"
      class: register
      register_class: A
      ea_capable: true
      memory: false
      operands:
        - type: AREG
          field: a
      update_eligible: false

    - name: INDIRECT
      pattern: "010 aaa"
      syntax: "[A]"
      class: memory
      base: A
      memory: true
      operands:
        - type: AREG
          field: a
      update_eligible: true

    - name: A_DISP16
      pattern: "011 aaa"
      syntax: "[A + disp16]"
      class: memory
      base: A
      displacement: signed16
      memory: true
      operands:
        - type: AREG
          field: a
        - type: DISP
          width: 16
          signed: true
          source: extension_word
      update_eligible: false

    - name: A_DISP32
      pattern: "100 aaa"
      syntax: "[A + disp32]"
      class: memory
      base: A
      displacement: signed32
      memory: true
      operands:
        - type: AREG
          field: a
        - type: DISP
          width: 32
          signed: true
          source: extension_words
          words: 2
      update_eligible: false

    - name: PC_DISP16
      pattern: "101000"
      syntax: "[PC + disp16]"
      class: memory
      base: PC
      fixed_segment: CS
      displacement: signed16
      memory: true
      update_eligible: false

    - name: PC_DISP32
      pattern: "101001"
      syntax: "[PC + disp32]"
      class: memory
      base: PC
      fixed_segment: CS
      displacement: signed32
      memory: true
      update_eligible: false

    - name: PC_DISP64
      pattern: "101010"
      syntax: "[PC + disp64]"
      class: memory
      base: PC
      fixed_segment: CS
      displacement: signed64
      memory: true
      update_eligible: false

    - name: SP_DISP16
      pattern: "101100"
      syntax: "[SP + disp16]"
      class: memory
      base: SP
      fixed_segment: SS
      displacement: signed16
      memory: true
      update_eligible: false

    - name: SP_DISP32
      pattern: "101101"
      syntax: "[SP + disp32]"
      class: memory
      base: SP
      fixed_segment: SS
      displacement: signed32
      memory: true
      update_eligible: false

    - name: SP_DISP64
      pattern: "101110"
      syntax: "[SP + disp64]"
      class: memory
      base: SP
      fixed_segment: SS
      displacement: signed64
      memory: true
      update_eligible: false

    - name: SPREG
      pattern: "101111"
      syntax: "SP"
      class: register
      register_class: SP
      ea_capable: true
      memory: false
      operands:
        - type: SPREG
          field: p
      update_eligible: false

    - name: ABS32
      pattern: "110000"
      syntax: "[imm32]"
      class: memory
      absolute: signed32
      memory: true
      update_eligible: false

    - name: ABS64
      pattern: "110001"
      syntax: "[imm64]"
      class: memory
      absolute: unsigned64
      memory: true
      update_eligible: false

    - name: IMM16
      pattern: "110010"
      syntax: "imm16"
      class: immediate
      memory: false
      signed: true
      sign_extension: operand_size
      extra_words: 1
      update_eligible: false

    - name: IMM32
      pattern: "110011"
      syntax: "imm32"
      class: immediate
      memory: false
      signed: true
      sign_extension: operand_size
      extra_words: 2
      update_eligible: false

    - name: IMM64
      pattern: "110100"
      syntax: "imm64"
      class: immediate
      memory: false
      signed: false
      sign_extension: none
      extra_words: 4
      update_eligible: false

    - name: S32_INDEXED_EXTENDED
      pattern: "111110"
      class: extended_escape
      extension: true
      extension_class: signed32_indexed
      index_extension: signed32_to_64
      update_eligible: false

    - name: EXTENDED
      pattern: "111111"
      class: extended_escape
      extension: true
      update_eligible: false

extended_ea_descriptor:
  fields:
    mode:
      bits: [15, 11]
    segment:
      bits: [10, 8]
    extra:
      bits: [7, 0]
  segment_values:
    0: CS
    1: DS
    2: SS
    3: GS0
    4: GS1
    5: GS2
    6: GS3
    7: GS4
  reserved_modes:
    pattern: "1xxxx"
    exception: ILLEGAL_INSTRUCTION
  reserved_segment_field:
    required_value: 0
    exception: ILLEGAL_INSTRUCTION
  compact_escapes:
    EXTENDED:
      ea_value: 0x3f
      index_extension: native_width
    S32_INDEXED_EXTENDED:
      ea_value: 0x3e
      index_extension: signed32_to_64

extended_ea_forms:
  - name: SEG_A_INDEX
    value: 0x0
    syntax: "[seg:A + D * scale]"
    default_segment_syntax: "[A + D * scale]"
    class: memory
    segment_selectable: true
    default_segment_allowed: true
    default_segment: DS
    base: A
    index: D
    scale: [1, 2, 4, 8]
    displacement: none
    memory: true
    extra_words: 0
    update_eligible: false

  - name: SEG_A_INDEX_DISP16

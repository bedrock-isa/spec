    - SP_DISP32
    - SP_DISP64
    - ABS32
    - ABS64
    - IMM16
    - IMM32
    - IMM64
    - S32_INDEXED_EXTENDED
    - EXTENDED

  required_extended_ea_forms:
    - SEG_A_INDEX
    - SEG_A_INDEX_DISP16
    - SEG_A_INDEX_DISP32
    - SEG_A_INDEX_DISP64
    - SEG_A
    - SEG_A_DISP16
    - SEG_A_DISP32
    - SEG_ABS32
    - SEG_ABS64
    - SP_INDEX_DISP16
    - SP_INDEX_DISP32
    - SP_INDEX_DISP64
    - PC_INDEX_DISP16
    - PC_INDEX_DISP32
    - PC_INDEX_DISP64
    - S32_SEG_A_INDEX
    - S32_SEG_A_INDEX_DISP16
    - S32_SEG_A_INDEX_DISP32
    - S32_SEG_A_INDEX_DISP64
    - S32_SP_INDEX_DISP16
    - S32_SP_INDEX_DISP32
    - S32_SP_INDEX_DISP64
    - S32_PC_INDEX_DISP16
    - S32_PC_INDEX_DISP32
    - S32_PC_INDEX_DISP64

  required_properties:
    DREG:
      class: register
      register_class: D
      ea_capable: true
      memory: false
      update_eligible: false

    AREG:
      class: register
      register_class: A
      ea_capable: true
      memory: false
      update_eligible: false

    SPREG:
      class: register
      register_class: SP
      ea_capable: true
      memory: false
      update_eligible: false

    INDIRECT:
      class: memory
      base: A
      memory: true
      update_eligible: true

    A_DISP16:
      class: memory
      base: A
      displacement: signed16
      memory: true
      update_eligible: false

    A_DISP32:
      class: memory
      base: A
      displacement: signed32
      memory: true
      update_eligible: false

    PC_DISP16:
      class: memory
      base: PC
      fixed_segment: CS
      displacement: signed16
      memory: true
      update_eligible: false

    PC_DISP32:
      class: memory
      base: PC
      fixed_segment: CS
      displacement: signed32
      memory: true
      update_eligible: false

    PC_DISP64:
      class: memory
      base: PC
      fixed_segment: CS
      displacement: signed64
      memory: true
      update_eligible: false

    SP_DISP16:
      class: memory
      base: SP
      fixed_segment: SS
      displacement: signed16
      memory: true
      update_eligible: false

    SP_DISP32:
      class: memory
      base: SP
      fixed_segment: SS
      displacement: signed32
      memory: true
      update_eligible: false

    SP_DISP64:
      class: memory
      base: SP
      fixed_segment: SS
      displacement: signed64
      memory: true
      update_eligible: false

    ABS32:
      class: memory
      absolute: signed32
      memory: true
      update_eligible: false

    ABS64:
      class: memory
      absolute: unsigned64
      memory: true
      update_eligible: false

    EXTENDED:
      class: extended_escape

    S32_INDEXED_EXTENDED:
      class: extended_escape
      extension_class: signed32_indexed
      index_extension: signed32_to_64

    SEG_A:
      class: memory
      segment_selectable: true
      base: A
      update_eligible: true

    SEG_A_INDEX:
      class: memory
      segment_selectable: true
      base: A
      index: D
      scale: [1, 2, 4, 8]

      segment_selectable: true
      base: A
      index: D
      index_extension: signed32_to_64
      scale: [1, 2, 4, 8]
      update_eligible: false

    IMM16:
      class: immediate
      memory: false
      update_eligible: false
      signed: true
      sign_extension: operand_size

    IMM32:
      class: immediate
      memory: false
      update_eligible: false
      signed: true
      sign_extension: operand_size

    IMM64:
      class: immediate
      memory: false
      update_eligible: false
      signed: false
      sign_extension: none

ea_operand_policy:
  default_allowed_ea_set: full

  ea_sets:
    full:
      includes:
        - DREG
        - AREG
        - INDIRECT
        - A_DISP16
        - A_DISP32
        - PC_DISP16
        - PC_DISP32
        - PC_DISP64
        - SP_DISP16
        - SP_DISP32
        - SP_DISP64
        - SPREG
        - ABS32
        - ABS64
        - IMM16
        - IMM32
        - IMM64
        - S32_INDEXED_EXTENDED
        - EXTENDED

    memory_only:
      includes:
        - INDIRECT
        - A_DISP16
        - A_DISP32
        - PC_DISP16
        - PC_DISP32
        - PC_DISP64
        - SP_DISP16
        - SP_DISP32
        - SP_DISP64
        - ABS32
        - ABS64
        - S32_INDEXED_EXTENDED
        - EXTENDED

    addressable_memory_only:
      includes:
        - INDIRECT
        - A_DISP16
        - A_DISP32
        - SP_DISP16
        - SP_DISP32
        - SP_DISP64
        - ABS32
        - ABS64
        - S32_INDEXED_EXTENDED
        - EXTENDED
      excludes:
        - PC_DISP16
        - PC_DISP32
        - PC_DISP64

    no_immediate:
      inherits: full
      excludes:
        - IMM16
        - IMM32
        - IMM64

    register_or_memory_no_imm:
      includes:
        - DREG
        - AREG
        - SPREG
        - INDIRECT
        - A_DISP16
        - A_DISP32
        - PC_DISP16
        - PC_DISP32
        - PC_DISP64
        - SP_DISP16
        - SP_DISP32
        - SP_DISP64
        - ABS32
        - ABS64
        - S32_INDEXED_EXTENDED
        - EXTENDED

    branch_target:
      includes:
        - IMM16
        - IMM32
        - IMM64
        - PC_DISP16
        - PC_DISP32
        - PC_DISP64
        - INDIRECT
        - A_DISP16
        - A_DISP32
        - ABS32
        - ABS64
        - S32_INDEXED_EXTENDED
        - EXTENDED

    call_target:
      includes:
        - DREG
        - AREG
        - SPREG
        - INDIRECT
        - A_DISP16
        - A_DISP32
        - PC_DISP16
        - PC_DISP32
        - PC_DISP64
        - ABS32
        - ABS64
        - S32_INDEXED_EXTENDED
        - EXTENDED
      excludes:
        - IMM16
        - IMM32
        - IMM64

    long_control_target:
      includes:
        - DREG
        - AREG
        - SPREG
        - IMM16
        - IMM32
        - IMM64
        - PC_DISP16
        - PC_DISP32
        - PC_DISP64
        - INDIRECT
        - A_DISP16
        - A_DISP32
        - ABS32
        - ABS64
        - S32_INDEXED_EXTENDED
        - EXTENDED

    store_destination:
      includes:
        - DREG
        - AREG
        - SPREG
        - INDIRECT
        - A_DISP16
        - A_DISP32
        - SP_DISP16
        - SP_DISP32
        - SP_DISP64
        - ABS32
        - ABS64
        - S32_INDEXED_EXTENDED
        - EXTENDED
      excludes:
        - IMM16
        - IMM32
        - IMM64
        - PC_DISP16
        - PC_DISP32
        - PC_DISP64

    pure_address_calculation:
      includes:
        - INDIRECT
        - A_DISP16
        - A_DISP32
        - PC_DISP16
        - PC_DISP32
        - PC_DISP64
        - SP_DISP16
        - SP_DISP32
        - SP_DISP64
        - ABS32
        - ABS64
        - S32_INDEXED_EXTENDED
        - EXTENDED
      excludes:
        - DREG
        - AREG
        - IMM16
        - IMM32
        - IMM64

  extended_form_constraints:
    store_destination:
      includes:
        - SP_INDEX_DISP16
        - SP_INDEX_DISP32
        - SP_INDEX_DISP64
        - S32_SP_INDEX_DISP16
        - S32_SP_INDEX_DISP32
        - S32_SP_INDEX_DISP64
      excludes:
        - PC_INDEX_DISP16
        - PC_INDEX_DISP32
        - PC_INDEX_DISP64
        - S32_PC_INDEX_DISP16
        - S32_PC_INDEX_DISP32
        - S32_PC_INDEX_DISP64
      rationale: >
        SP-indexed forms are stack-segment memory destinations. PC-indexed
        forms are code-segment relative address calculations and are not store
        destinations.

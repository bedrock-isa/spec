    SP_INDEX_DISP16:
      class: memory
      segment_selectable: false
      fixed_segment: SS
      base: SP
      index: D
      scale: [1, 2, 4, 8]
      displacement: signed16
      memory: true
      update_eligible: false

    SP_INDEX_DISP32:
      class: memory
      segment_selectable: false
      fixed_segment: SS
      base: SP
      index: D
      scale: [1, 2, 4, 8]
      displacement: signed32
      memory: true
      update_eligible: false

    SP_INDEX_DISP64:
      class: memory
      segment_selectable: false
      fixed_segment: SS
      base: SP
      index: D
      scale: [1, 2, 4, 8]
      displacement: signed64
      memory: true
      update_eligible: false

    PC_INDEX_DISP16:
      class: memory
      segment_selectable: false
      fixed_segment: CS
      base: PC
      index: D
      scale: [1, 2, 4, 8]
      displacement: signed16
      memory: true
      update_eligible: false

    PC_INDEX_DISP32:
      class: memory
      segment_selectable: false
      fixed_segment: CS
      base: PC
      index: D

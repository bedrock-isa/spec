version: draft-v1

fields:
  d:
    width: 3
  a:
    width: 3

ea_forms:
  compact:
    - name: DREG
      pattern: "000 ddd"
      class: register
      register_class: D
      ea_capable: true
      memory: false
      operands:
        - type: DREG
          field: d
      update_eligible: false

    - name: AREG
      pattern: "001 aaa"
      class: register
      register_class: A
      ea_capable: true
      memory: false
      operands:
        - type: AREG
          field: a
      update_eligible: false

    - name: INDIRECT
      pattern: "010 aaa"
      syntax: "[A]"
      class: memory
      base: A
      memory: true
      operands:
        - type: AREG
          field: a
      update_eligible: true

    - name: A_DISP16
      pattern: "011 aaa"
      syntax: "[A + disp16]"
      class: memory
      base: A
      displacement: signed16
      memory: true
      operands:
        - type: AREG
          field: a
        - type: DISP
          width: 16
          signed: true
          source: extension_word
      update_eligible: false

    - name: A_DISP32
      pattern: "100 aaa"
      syntax: "[A + disp32]"
      class: memory
      base: A
      displacement: signed32
      memory: true
      operands:
        - type: AREG
          field: a
        - type: DISP
          width: 32
          signed: true
          source: extension_words
          words: 2
      update_eligible: false

    - name: PC_DISP16
      pattern: "101000"
      syntax: "[PC + disp16]"
      class: memory
      base: PC
      fixed_segment: CS
      displacement: signed16
      memory: true
      update_eligible: false

    - name: PC_DISP32
      pattern: "101001"
      syntax: "[PC + disp32]"
      class: memory
      base: PC
      fixed_segment: CS
      displacement: signed32
      memory: true
      update_eligible: false

    - name: PC_DISP64
      pattern: "101010"
      syntax: "[PC + disp64]"
      class: memory
      base: PC
      fixed_segment: CS
      displacement: signed64
      memory: true
      update_eligible: false

    - name: SP_DISP16
      pattern: "101100"
      syntax: "[SP + disp16]"
      class: memory
      base: SP
      fixed_segment: SS
      displacement: signed16
      memory: true
      update_eligible: false

    - name: SP_DISP32
      pattern: "101101"
      syntax: "[SP + disp32]"
      class: memory
      base: SP
      fixed_segment: SS
      displacement: signed32
      memory: true
      update_eligible: false

    - name: SP_DISP64
      pattern: "101110"
      syntax: "[SP + disp64]"
      class: memory
      base: SP
      fixed_segment: SS
      displacement: signed64
      memory: true
      update_eligible: false

    - name: SPREG
      pattern: "101111"
      syntax: "SP"
      class: register
      register_class: SP
      ea_capable: true
      memory: false
      operands:
        - type: SPREG
          field: p
      update_eligible: false

    - name: ABS32
      pattern: "110000"
      syntax: "[imm32]"
      class: memory
      absolute: signed32
      memory: true
      update_eligible: false

    - name: ABS64
      pattern: "110001"
      syntax: "[imm64]"
      class: memory
      absolute: unsigned64
      memory: true
      update_eligible: false

    - name: IMM16
      pattern: "110010"
      syntax: "imm16"
      class: immediate
      memory: false
      signed: true
      sign_extension: operand_size
      extra_words: 1
      update_eligible: false

    - name: IMM32
      pattern: "110011"
      syntax: "imm32"
      class: immediate
      memory: false
      signed: true
      sign_extension: operand_size
      extra_words: 2
      update_eligible: false

    - name: IMM64
      pattern: "110100"
      syntax: "imm64"
      class: immediate
      memory: false
      signed: false
      sign_extension: none
      extra_words: 4
      update_eligible: false

    - name: S32_INDEXED_EXTENDED
      pattern: "111110"
      class: extended_escape
      extension: true
      extension_class: signed32_indexed
      index_extension: signed32_to_64
      update_eligible: false

    - name: EXTENDED
      pattern: "111111"
      class: extended_escape
      extension: true
      update_eligible: false

reserved_forms:
  - name: EA_RESERVED_101011
    pattern: "101011"
  - name: EA_RESERVED_110101
    pattern: "110101"
  - name: EA_RESERVED_110110
    pattern: "110110"
  - name: EA_RESERVED_110111
    pattern: "110111"
  - name: EA_RESERVED_111000
    pattern: "111000"
  - name: EA_RESERVED_111001
    pattern: "111001"
  - name: EA_RESERVED_111010
    pattern: "111010"
  - name: EA_RESERVED_111011
    pattern: "111011"
  - name: EA_RESERVED_111100
    pattern: "111100"
  - name: EA_RESERVED_111101
    pattern: "111101"

extended_ea_descriptor:
  fields:
    mode:
      bits: [15, 11]
    segment:
      bits: [10, 8]
    extra:
      bits: [7, 0]
  segment_values:
    0: default
    1: CS
    2: DS
    3: SS
    4: GS0
    5: GS1
    6: reserved
    7: reserved
  reserved_modes:
    pattern: "1xxxx"
  compact_escapes:
    EXTENDED:
      ea_value: 0x3f
      index_extension: native_width
    S32_INDEXED_EXTENDED:
      ea_value: 0x3e
      index_extension: signed32_to_64

extended_ea_forms:
  - name: SEG_A_INDEX
    value: 0x0
    syntax: "[seg:A + D * scale]"
    default_segment_syntax: "[A + D * scale]"
    class: memory
    segment_selectable: true
    default_segment_allowed: true
    base: A
    index: D
    scale: [1, 2, 4, 8]
    displacement: none
    memory: true
    extra_words: 0
    update_eligible: false

  - name: SEG_A_INDEX_DISP16
    value: 0x1
    syntax: "[seg:A + D * scale + disp16]"
    default_segment_syntax: "[A + D * scale + disp16]"
    class: memory
    segment_selectable: true
    default_segment_allowed: true
    base: A
    index: D
    scale: [1, 2, 4, 8]
    displacement: signed16
    memory: true
    extra_words: 1
    update_eligible: false

  - name: SEG_A_INDEX_DISP32
    value: 0x2
    syntax: "[seg:A + D * scale + disp32]"
    default_segment_syntax: "[A + D * scale + disp32]"
    class: memory
    segment_selectable: true
    default_segment_allowed: true
    base: A
    index: D
    scale: [1, 2, 4, 8]
    displacement: signed32
    memory: true
    extra_words: 2
    update_eligible: false

  - name: SEG_A_INDEX_DISP64
    value: 0x3
    syntax: "[seg:A + D * scale + disp64]"
    default_segment_syntax: "[A + D * scale + disp64]"
    class: memory
    segment_selectable: true
    default_segment_allowed: true
    base: A
    index: D
    scale: [1, 2, 4, 8]
    displacement: signed64
    memory: true
    extra_words: 4
    update_eligible: false

  - name: SEG_A
    value: 0x4
    syntax: "[seg:A]"
    class: memory
    segment_selectable: true
    base: A
    memory: true
    extra_words: 0
    update_eligible: true

  - name: SEG_A_DISP16
    value: 0x5
    syntax: "[seg:A + disp16]"
    class: memory
    segment_selectable: true
    base: A
    displacement: signed16
    memory: true
    extra_words: 1
    update_eligible: false

  - name: SEG_A_DISP32
    value: 0x6
    syntax: "[seg:A + disp32]"
    class: memory
    segment_selectable: true
    base: A
    displacement: signed32
    memory: true
    extra_words: 2
    update_eligible: false

  - name: SEG_ABS32
    value: 0x7
    syntax: "[seg:imm32]"
    class: memory
    segment_selectable: true
    absolute: signed32
    memory: true
    extra_words: 2
    update_eligible: false

  - name: SEG_ABS64
    value: 0x8
    syntax: "[seg:imm64]"
    class: memory
    segment_selectable: true
    absolute: unsigned64
    memory: true
    extra_words: 4
    update_eligible: false

  - name: SP_INDEX_DISP16
    value: 0x9
    syntax: "[SP + D * scale + disp16]"
    class: memory
    segment_selectable: false
    fixed_segment: SS
    segment_field: reserved_zero
    base: SP
    index: D
    scale: [1, 2, 4, 8]
    displacement: signed16
    memory: true
    store_allowed: true
    extra_words: 1
    update_eligible: false

  - name: SP_INDEX_DISP32
    value: 0xa
    syntax: "[SP + D * scale + disp32]"
    class: memory
    segment_selectable: false
    fixed_segment: SS
    segment_field: reserved_zero
    base: SP
    index: D
    scale: [1, 2, 4, 8]
    displacement: signed32
    memory: true
    store_allowed: true
    extra_words: 2
    update_eligible: false

  - name: SP_INDEX_DISP64
    value: 0xb
    syntax: "[SP + D * scale + disp64]"
    class: memory
    segment_selectable: false
    fixed_segment: SS
    segment_field: reserved_zero
    base: SP
    index: D
    scale: [1, 2, 4, 8]
    displacement: signed64
    memory: true
    store_allowed: true
    extra_words: 4
    update_eligible: false

  - name: PC_INDEX_DISP16
    value: 0xc
    syntax: "[PC + D * scale + disp16]"
    class: memory
    segment_selectable: false
    fixed_segment: CS
    segment_field: reserved_zero
    base: PC
    index: D
    scale: [1, 2, 4, 8]
    displacement: signed16
    memory: true
    store_allowed: false
    extra_words: 1
    update_eligible: false

  - name: PC_INDEX_DISP32
    value: 0xd
    syntax: "[PC + D * scale + disp32]"
    class: memory
    segment_selectable: false
    fixed_segment: CS
    segment_field: reserved_zero
    base: PC
    index: D
    scale: [1, 2, 4, 8]
    displacement: signed32
    memory: true
    store_allowed: false
    extra_words: 2
    update_eligible: false

  - name: PC_INDEX_DISP64
    value: 0xe
    syntax: "[PC + D * scale + disp64]"
    class: memory
    segment_selectable: false
    fixed_segment: CS
    segment_field: reserved_zero
    base: PC
    index: D
    scale: [1, 2, 4, 8]
    displacement: signed64
    memory: true
    store_allowed: false
    extra_words: 4
    update_eligible: false

  - name: S32_SEG_A_INDEX
    escape: S32_INDEXED_EXTENDED
    value: 0x0
    syntax: "[seg:A + D.L * scale]"
    default_segment_syntax: "[A + D.L * scale]"
    class: memory
    segment_selectable: true
    default_segment_allowed: true
    base: A
    index: D
    index_extension: signed32_to_64
    scale: [1, 2, 4, 8]
    displacement: none
    memory: true
    extra_words: 0
    update_eligible: false

  - name: S32_SEG_A_INDEX_DISP16
    escape: S32_INDEXED_EXTENDED
    value: 0x1
    syntax: "[seg:A + D.L * scale + disp16]"
    default_segment_syntax: "[A + D.L * scale + disp16]"
    class: memory
    segment_selectable: true
    default_segment_allowed: true
    base: A
    index: D
    index_extension: signed32_to_64
    scale: [1, 2, 4, 8]
    displacement: signed16
    memory: true
    extra_words: 1
    update_eligible: false

  - name: S32_SEG_A_INDEX_DISP32
    escape: S32_INDEXED_EXTENDED
    value: 0x2
    syntax: "[seg:A + D.L * scale + disp32]"
    default_segment_syntax: "[A + D.L * scale + disp32]"
    class: memory
    segment_selectable: true
    default_segment_allowed: true
    base: A
    index: D
    index_extension: signed32_to_64
    scale: [1, 2, 4, 8]
    displacement: signed32
    memory: true
    extra_words: 2
    update_eligible: false

  - name: S32_SEG_A_INDEX_DISP64
    escape: S32_INDEXED_EXTENDED
    value: 0x3
    syntax: "[seg:A + D.L * scale + disp64]"
    default_segment_syntax: "[A + D.L * scale + disp64]"
    class: memory
    segment_selectable: true
    default_segment_allowed: true
    base: A
    index: D
    index_extension: signed32_to_64
    scale: [1, 2, 4, 8]
    displacement: signed64
    memory: true
    extra_words: 4
    update_eligible: false

  - name: S32_SP_INDEX_DISP16
    escape: S32_INDEXED_EXTENDED
    value: 0x9
    syntax: "[SP + D.L * scale + disp16]"
    class: memory
    segment_selectable: false
    fixed_segment: SS
    segment_field: reserved_zero
    base: SP
    index: D
    index_extension: signed32_to_64
    scale: [1, 2, 4, 8]
    displacement: signed16
    memory: true
    store_allowed: true
    extra_words: 1
    update_eligible: false

  - name: S32_SP_INDEX_DISP32
    escape: S32_INDEXED_EXTENDED
    value: 0xa
    syntax: "[SP + D.L * scale + disp32]"
    class: memory
    segment_selectable: false
    fixed_segment: SS
    segment_field: reserved_zero
    base: SP
    index: D
    index_extension: signed32_to_64
    scale: [1, 2, 4, 8]
    displacement: signed32
    memory: true
    store_allowed: true
    extra_words: 2
    update_eligible: false

  - name: S32_SP_INDEX_DISP64
    escape: S32_INDEXED_EXTENDED
    value: 0xb
    syntax: "[SP + D.L * scale + disp64]"
    class: memory
    segment_selectable: false
    fixed_segment: SS
    segment_field: reserved_zero
    base: SP
    index: D
    index_extension: signed32_to_64
    scale: [1, 2, 4, 8]
    displacement: signed64
    memory: true
    store_allowed: true
    extra_words: 4
    update_eligible: false

  - name: S32_PC_INDEX_DISP16
    escape: S32_INDEXED_EXTENDED
    value: 0xc
    syntax: "[PC + D.L * scale + disp16]"
    class: memory
    segment_selectable: false
    fixed_segment: CS
    segment_field: reserved_zero
    base: PC
    index: D
    index_extension: signed32_to_64
    scale: [1, 2, 4, 8]
    displacement: signed16
    memory: true
    store_allowed: false
    extra_words: 1
    update_eligible: false

  - name: S32_PC_INDEX_DISP32
    escape: S32_INDEXED_EXTENDED
    value: 0xd
    syntax: "[PC + D.L * scale + disp32]"
    class: memory
    segment_selectable: false
    fixed_segment: CS
    segment_field: reserved_zero
    base: PC
    index: D
    index_extension: signed32_to_64
    scale: [1, 2, 4, 8]
    displacement: signed32
    memory: true
    store_allowed: false
    extra_words: 2
    update_eligible: false

  - name: S32_PC_INDEX_DISP64
    escape: S32_INDEXED_EXTENDED
    value: 0xe
    syntax: "[PC + D.L * scale + disp64]"
    class: memory
    segment_selectable: false
    fixed_segment: CS
    segment_field: reserved_zero
    base: PC
    index: D
    index_extension: signed32_to_64
    scale: [1, 2, 4, 8]
    displacement: signed64
    memory: true
    store_allowed: false
    extra_words: 4
    update_eligible: false

immediate_rules:
  direct_imm:
    forms: [IMM16, IMM32, IMM64]
    canonical_widths: [16, 32, 64]
    excluded_widths: [8]
    sign_extension: operand_size
    memory_access: false

  absolute_memory:
    ea_forms: [ABS32, ABS64, SEG_ABS32, SEG_ABS64]
    memory_access: true

indexed_ea_rules:
  signed_displacements: true
  default_segment_may_omit_prefix: true
  assembler_scale_required: true
  scale_syntax:
    rule: Scale factor must be written explicitly in indexed EA assembly syntax.
    examples:
      - "[A0 + D1 * 1]"
      - "[A0 + D1.L * 4 + disp16]"
    invalid_examples:
      - "[A0 + D1]"
      - "[A0 + D1.L + disp16]"
  rep_counter_index:
    allowed: true
    counter_value: before iteration update
    example: "[A0 - 1 + D0 * 1]"

update_eligible:
  compact: [INDIRECT]
  extended: [SEG_A]

update_ineligible:
  compact:
    - A_DISP16
    - A_DISP32
    - PC_DISP16
    - PC_DISP32
    - PC_DISP64
    - SP_DISP16
    - SP_DISP32
    - SP_DISP64
    - SPREG
    - ABS32
    - ABS64
    - IMM16
    - IMM32
    - IMM64
    - S32_INDEXED_EXTENDED
  extended:
    - SEG_A_DISP16
    - SEG_A_DISP32
    - SEG_A_INDEX
    - SEG_A_INDEX_DISP16
    - SEG_A_INDEX_DISP32
    - SEG_A_INDEX_DISP64
    - SEG_ABS32
    - SEG_ABS64
    - SP_INDEX_DISP16
    - SP_INDEX_DISP32
    - SP_INDEX_DISP64
    - PC_INDEX_DISP16
    - PC_INDEX_DISP32
    - PC_INDEX_DISP64
    - S32_SEG_A_INDEX
    - S32_SEG_A_INDEX_DISP16
    - S32_SEG_A_INDEX_DISP32
    - S32_SEG_A_INDEX_DISP64
    - S32_SP_INDEX_DISP16
    - S32_SP_INDEX_DISP32
    - S32_SP_INDEX_DISP64
    - S32_PC_INDEX_DISP16
    - S32_PC_INDEX_DISP32
    - S32_PC_INDEX_DISP64

ea_coverage_audit:
  required_compact_ea_forms:
    - DREG
    - AREG
    - INDIRECT
    - A_DISP16
    - A_DISP32
    - PC_DISP16
    - PC_DISP32
    - PC_DISP64
    - SP_DISP16
    - SP_DISP32
    - SP_DISP64
    - ABS32
    - ABS64
    - IMM16
    - IMM32
    - IMM64
    - S32_INDEXED_EXTENDED
    - EXTENDED

  required_extended_ea_forms:
    - SEG_A_INDEX
    - SEG_A_INDEX_DISP16
    - SEG_A_INDEX_DISP32
    - SEG_A_INDEX_DISP64
    - SEG_A
    - SEG_A_DISP16
    - SEG_A_DISP32
    - SEG_ABS32
    - SEG_ABS64
    - SP_INDEX_DISP16
    - SP_INDEX_DISP32
    - SP_INDEX_DISP64
    - PC_INDEX_DISP16
    - PC_INDEX_DISP32
    - PC_INDEX_DISP64
    - S32_SEG_A_INDEX
    - S32_SEG_A_INDEX_DISP16
    - S32_SEG_A_INDEX_DISP32
    - S32_SEG_A_INDEX_DISP64
    - S32_SP_INDEX_DISP16
    - S32_SP_INDEX_DISP32
    - S32_SP_INDEX_DISP64
    - S32_PC_INDEX_DISP16
    - S32_PC_INDEX_DISP32
    - S32_PC_INDEX_DISP64

  required_properties:
    DREG:
      class: register
      register_class: D
      ea_capable: true
      memory: false
      update_eligible: false

    AREG:
      class: register
      register_class: A
      ea_capable: true
      memory: false
      update_eligible: false

    SPREG:
      class: register
      register_class: SP
      ea_capable: true
      memory: false
      update_eligible: false

    INDIRECT:
      class: memory
      base: A
      memory: true
      update_eligible: true

    A_DISP16:
      class: memory
      base: A
      displacement: signed16
      memory: true
      update_eligible: false

    A_DISP32:
      class: memory
      base: A
      displacement: signed32
      memory: true
      update_eligible: false

    PC_DISP16:
      class: memory
      base: PC
      fixed_segment: CS
      displacement: signed16
      memory: true
      update_eligible: false

    PC_DISP32:
      class: memory
      base: PC
      fixed_segment: CS
      displacement: signed32
      memory: true
      update_eligible: false

    PC_DISP64:
      class: memory
      base: PC
      fixed_segment: CS
      displacement: signed64
      memory: true
      update_eligible: false

    SP_DISP16:
      class: memory
      base: SP
      fixed_segment: SS
      displacement: signed16
      memory: true
      update_eligible: false

    SP_DISP32:
      class: memory
      base: SP
      fixed_segment: SS
      displacement: signed32
      memory: true
      update_eligible: false

    SP_DISP64:
      class: memory
      base: SP
      fixed_segment: SS
      displacement: signed64
      memory: true
      update_eligible: false

    ABS32:
      class: memory
      absolute: signed32
      memory: true
      update_eligible: false

    ABS64:
      class: memory
      absolute: unsigned64
      memory: true
      update_eligible: false

    EXTENDED:
      class: extended_escape

    S32_INDEXED_EXTENDED:
      class: extended_escape
      extension_class: signed32_indexed
      index_extension: signed32_to_64

    SEG_A:
      class: memory
      segment_selectable: true
      base: A
      update_eligible: true

    SEG_A_INDEX:
      class: memory
      segment_selectable: true
      base: A
      index: D
      scale: [1, 2, 4, 8]
      update_eligible: false

    SP_INDEX_DISP16:
      class: memory
      segment_selectable: false
      fixed_segment: SS
      base: SP
      index: D
      scale: [1, 2, 4, 8]
      displacement: signed16
      memory: true
      update_eligible: false

    SP_INDEX_DISP32:
      class: memory
      segment_selectable: false
      fixed_segment: SS
      base: SP
      index: D
      scale: [1, 2, 4, 8]
      displacement: signed32
      memory: true
      update_eligible: false

    SP_INDEX_DISP64:
      class: memory
      segment_selectable: false
      fixed_segment: SS
      base: SP
      index: D
      scale: [1, 2, 4, 8]
      displacement: signed64
      memory: true
      update_eligible: false

    PC_INDEX_DISP16:
      class: memory
      segment_selectable: false
      fixed_segment: CS
      base: PC
      index: D
      scale: [1, 2, 4, 8]
      displacement: signed16
      memory: true
      update_eligible: false

    PC_INDEX_DISP32:
      class: memory
      segment_selectable: false
      fixed_segment: CS
      base: PC
      index: D
      scale: [1, 2, 4, 8]
      displacement: signed32
      memory: true
      update_eligible: false

    PC_INDEX_DISP64:
      class: memory
      segment_selectable: false
      fixed_segment: CS
      base: PC
      index: D
      scale: [1, 2, 4, 8]
      displacement: signed64
      memory: true
      update_eligible: false

    S32_SEG_A_INDEX:
      class: memory
      segment_selectable: true
      base: A
      index: D
      index_extension: signed32_to_64
      scale: [1, 2, 4, 8]
      update_eligible: false

    IMM16:
      class: immediate
      memory: false
      update_eligible: false
      signed: true
      sign_extension: operand_size

    IMM32:
      class: immediate
      memory: false
      update_eligible: false
      signed: true
      sign_extension: operand_size

    IMM64:
      class: immediate
      memory: false
      update_eligible: false
      signed: false
      sign_extension: none

ea_operand_policy:
  default_allowed_ea_set: full

  ea_sets:
    full:
      includes:
        - DREG
        - AREG
        - INDIRECT
        - A_DISP16
        - A_DISP32
        - PC_DISP16
        - PC_DISP32
        - PC_DISP64
        - SP_DISP16
        - SP_DISP32
        - SP_DISP64
        - SPREG
        - ABS32
        - ABS64
        - IMM16
        - IMM32
        - IMM64
        - S32_INDEXED_EXTENDED
        - EXTENDED

    memory_only:
      includes:
        - INDIRECT
        - A_DISP16
        - A_DISP32
        - PC_DISP16
        - PC_DISP32
        - PC_DISP64
        - SP_DISP16
        - SP_DISP32
        - SP_DISP64
        - ABS32
        - ABS64
        - S32_INDEXED_EXTENDED
        - EXTENDED

    addressable_memory_only:
      includes:
        - INDIRECT
        - A_DISP16
        - A_DISP32
        - SP_DISP16
        - SP_DISP32
        - SP_DISP64
        - ABS32
        - ABS64
        - S32_INDEXED_EXTENDED
        - EXTENDED
      excludes:
        - PC_DISP16
        - PC_DISP32
        - PC_DISP64

    no_immediate:
      inherits: full
      excludes:
        - IMM16
        - IMM32
        - IMM64

    register_or_memory_no_imm:
      includes:
        - DREG
        - AREG
        - SPREG
        - INDIRECT
        - A_DISP16
        - A_DISP32
        - PC_DISP16
        - PC_DISP32
        - PC_DISP64
        - SP_DISP16
        - SP_DISP32
        - SP_DISP64
        - ABS32
        - ABS64
        - S32_INDEXED_EXTENDED
        - EXTENDED

    branch_target:
      includes:
        - IMM16
        - IMM32
        - IMM64
        - PC_DISP16
        - PC_DISP32
        - PC_DISP64
        - INDIRECT
        - A_DISP16
        - A_DISP32
        - ABS32
        - ABS64
        - S32_INDEXED_EXTENDED
        - EXTENDED

    call_target:
      includes:
        - DREG
        - AREG
        - SPREG
        - INDIRECT
        - A_DISP16
        - A_DISP32
        - PC_DISP16
        - PC_DISP32
        - PC_DISP64
        - ABS32
        - ABS64
        - S32_INDEXED_EXTENDED
        - EXTENDED
      excludes:
        - IMM16
        - IMM32
        - IMM64

    long_control_target:
      includes:
        - DREG
        - AREG
        - SPREG
        - IMM16
        - IMM32
        - IMM64
        - PC_DISP16
        - PC_DISP32
        - PC_DISP64
        - INDIRECT
        - A_DISP16
        - A_DISP32
        - ABS32
        - ABS64
        - S32_INDEXED_EXTENDED
        - EXTENDED

    store_destination:
      includes:
        - DREG
        - AREG
        - SPREG
        - INDIRECT
        - A_DISP16
        - A_DISP32
        - SP_DISP16
        - SP_DISP32
        - SP_DISP64
        - ABS32
        - ABS64
        - S32_INDEXED_EXTENDED
        - EXTENDED
      excludes:
        - IMM16
        - IMM32
        - IMM64
        - PC_DISP16
        - PC_DISP32
        - PC_DISP64

    pure_address_calculation:
      includes:
        - INDIRECT
        - A_DISP16
        - A_DISP32
        - PC_DISP16
        - PC_DISP32
        - PC_DISP64
        - SP_DISP16
        - SP_DISP32
        - SP_DISP64
        - ABS32
        - ABS64
        - S32_INDEXED_EXTENDED
        - EXTENDED
      excludes:
        - DREG
        - AREG
        - IMM16
        - IMM32
        - IMM64

  extended_form_constraints:
    store_destination:
      includes:
        - SP_INDEX_DISP16
        - SP_INDEX_DISP32
        - SP_INDEX_DISP64
        - S32_SP_INDEX_DISP16
        - S32_SP_INDEX_DISP32
        - S32_SP_INDEX_DISP64
      excludes:
        - PC_INDEX_DISP16
        - PC_INDEX_DISP32
        - PC_INDEX_DISP64
        - S32_PC_INDEX_DISP16
        - S32_PC_INDEX_DISP32
        - S32_PC_INDEX_DISP64
      rationale: >
        SP-indexed forms are stack-segment memory destinations. PC-indexed
        forms are code-segment relative address calculations and are not store
        destinations.

instruction_ea_constraints:
  MOV:
    src_ea_set: full
    dst_ea_set: store_destination
    allow_memory_memory: true

  CMP:
    lhs_ea_set: full
    rhs_ea_set: full
    allow_memory_memory: true

  ALU_EA_TO_D:
    src_ea_set: full
    dst: DREG

  ALU_D_TO_EA:
    src: DREG
    dst_ea_set: store_destination

  ATOMIC:
    memory_operand_ea_set: addressable_memory_only
    require_memory_operand: true
    disallow:
      - DREG
      - AREG
      - IMM16
      - IMM32
      - IMM64
      - PC_relative

  LEA:
    src_ea_set: pure_address_calculation
    dst: AREG
    no_memory_access: true

  SEGLEA:
    src_ea_set: pure_address_calculation
    dst: AREG
    no_memory_access: true
    segment_translation_only: true

  TESTCANON:
    src_ea_set: pure_address_calculation
    no_memory_access: true

  PREFETCH:
    src_ea_set: memory_only
    require_memory_operand: true

  CACHE_OP:
    src_ea_set: memory_only
    require_memory_operand: true

  VTOP:
    src_ea_set: pure_address_calculation
    require_address_value: true

  CALL:
    target_ea_set: call_target

  LJMP:
    segment_operand: DREG
    target_ea_set: long_control_target
    atomic_cs_pc_update: true
    disallow_immediate_segment_plus_immediate_offset: true

  LCALL:
    segment_operand: DREG
    target_ea_set: long_control_target
    atomic_cs_pc_update: true
    disallow_immediate_segment_plus_immediate_offset: true

  LRET:
    stack_segment: SS
    stack_register: SP
    atomic_cs_pc_update: true

  JMP:
    target_ea_set: branch_target

  Jcc:
    target_ea_set: branch_target

  SETcc:
    dst_ea_set: store_destination

  MOVcc:
    src_ea_set: full
    dst_ea_set: store_destination

  EXTEND:
    src_ea_set: full
    dst_ea_set: store_destination
    allow_memory_memory: true
    source_width: instruction size suffix
    destination_width: mnemonic suffix W/L/Q

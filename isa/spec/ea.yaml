immediate_rules:
  direct_imm:
    forms: [IMM16, IMM32, IMM64]
    canonical_widths: [16, 32, 64]
    excluded_widths: [8]
    sign_extension: operand_size
    memory_access: false

  absolute_memory:
    ea_forms: [ABS32, ABS64, SEG_ABS32, SEG_ABS64]
    memory_access: true

indexed_ea_rules:
  signed_displacements: true
  default_segment_may_omit_prefix: true
  assembler_scale_required: true
  scale_syntax:
    rule: Scale factor must be written explicitly in indexed EA assembly syntax.
    examples:
      - "[A0 + D1 * 1]"
      - "[A0 + D1.L * 4 + disp16]"
    invalid_examples:
      - "[A0 + D1]"
      - "[A0 + D1.L + disp16]"
  rep_counter_index:
    allowed: true
    counter_value: before iteration update
    example: "[A0 - 1 + D0 * 1]"

update_eligible:
  compact: [INDIRECT]
  extended: [SEG_A]


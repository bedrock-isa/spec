mnemonic: FADD
doc:
  title: Floating-Point Add
  summary: Adds the source operand to the destination operand.
  description: Adds the source operand to the destination operand.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs:
  - src
  input_output: dst
  operation:
  - dst_v = dst_v f+ src_v;
attributes:
  repeatable: true
  streaming_candidate: true
  fp_flags:
    update:
    - NV
    - OF
    - UF
    - NX
allocation:
  catalog_section: fpu
  layout_group: FP_ARITH
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  size: S_D
  result: Fdst
  memory_destination_arithmetic: disallowed

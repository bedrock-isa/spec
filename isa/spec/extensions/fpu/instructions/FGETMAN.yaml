    extended_opcode_start: '0x4000'
    extended_opcode_end: '0x47ff'
    extended_opcode_slots: 2048
    extended_opcode_bits: 11
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0], f:FREG[9:6], z:S_D[10]
    fields:
    - name: z
      kind: S_D
      source: size
      storage: descriptor
      width: 1
    - name: e
      kind: EA
      source: src
      storage: descriptor
      width: 6
    - name: f
      kind: FREG
      source: dst
      storage: descriptor
      width: 4
    kind: extended
  - id: FGETMAN.F_TO_F
    extension_root: EXT.fpu_arithmetic
    extension_root_payload: '0xf67'
    extension_family: fpu_arithmetic
    extended_opcode: 0x2600..0x27ff
    extended_opcode_start: '0x2600'
    extended_opcode_end: '0x27ff'

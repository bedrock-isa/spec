mnemonic: FBNDII
doc:
  title: Floating-Point Bounds Check Inclusive-Inclusive
  summary: Checks floating-point value membership in the inclusive-inclusive interval [lo, hi].
  description: FBNDII treats both bounds as inclusive. It sets V when value is unordered or outside [lo, hi]; Z, N, and 
    C are unchanged.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs:
  - hi
  - lo
  - value
  output: none
  operation:
  - ZF = 0;
  - NF = 0;
  - CF = 0;
  - VF = 0;
  - if (value_v < lo_v) goto <fbndii_bad>;
  - if (value_v > hi_v) goto <fbndii_bad>;
  - goto <fbndii_done>;
  - <fbndii_bad>
  - VF = 1;
  - <fbndii_done>
attributes:
  repeatable: true
  fp_flags:
    update_when_required:
    - NV
  flags:
    V: set when the value is out of bounds or unordered
    ZNC: unchanged
allocation:
  catalog_section: fpu
  layout_group: FP_BOUNDS
forms:
  operands:
  - - name: lo
      type: FREG
    - name: value
      type: FREG
    - name: hi
      type: FREG
  - - name: lo
      type: FREG
    - name: value
      type: EA
    - name: hi
      type: FREG
  size: S_D

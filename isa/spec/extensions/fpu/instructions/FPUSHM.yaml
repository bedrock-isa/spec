mnemonic: FPUSHM
doc:
  title: Floating-Point Push Multiple
  summary: Push selected F0-F15 registers according to bitmap order.
  description: Push selected F0-F15 registers according to bitmap order. Bit n names Fn.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_stack
  inputs:
  - regs
  output: none
  operation:
  - arch_fpushm(regs_v);
  operation_text: >
    For each set bit in the bitmap, FPUSHM pushes the corresponding 64-bit F register value onto the stack. F registers
    are processed in increasing order from F0 through F15. Each selected register decrements SP by 8 before storing the
    register value at the new SP.
allocation:
  catalog_section: fpu
  layout_group: FPUSHM_FPOPM
  encoding:
  - id: FPUSHM.BITMAP
    extension_root: EXT.fpu_arithmetic
    extension_root_payload: '0xf67'
    extension_family: fpu_arithmetic
    extended_opcode: '0x0426'
    extended_opcode_start: '0x0426'
    extended_opcode_end: '0x0426'
    extended_opcode_slots: 1
    extended_opcode_bits: 0
    operand_payload_bits: 16
    operand_descriptor_words: 1
    operand_descriptor_spilled: false
    descriptor_layout: b:fbitmap16/16@payload
    fields:
    - name: b
      kind: fbitmap16
      source: regs
      storage: payload
      width: 16
    kind: extended
forms:
  operands:
  - name: regs
    type: fbitmap16
  bitmap:
    bits_0_15: F0-F15
  size_per_register: Q

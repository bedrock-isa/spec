mnemonic: FNEG
doc:
  title: Floating-Point Negate
  summary: Performs the floating-point negate operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs: [src]
  output: dst
  operation:
  - dst_v = f- src_v;
attributes:
  fp_flags: unchanged
allocation:
  catalog_section: fpu
  layout_group: FP_UNARY
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  - - name: src
      type: FREG
    - name: dst
      type: EA
  size: S_D

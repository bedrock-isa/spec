mnemonic: FROUND
doc:
  title: Floating-Point Round
  summary: Performs the floating-point round operation.
  description: Performs the floating-point round operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs: [src]
  output: dst
  operation:
  - dst_v = round(src_v);
attributes:
  fp_flags:
    update_when_required:
    - NV
    - NX
allocation:
  catalog_section: fpu
  layout_group: FP_INTEGRAL_ROUND
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  - - name: src
      type: FREG
    - name: dst
      type: EA
  size: S_D
  result: floating integral value

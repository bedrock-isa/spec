mnemonic: FMOVcc
doc:
  title: Floating-Point Conditional Move
  summary: Performs the floating-point conditional move operation.
  description: Performs the floating-point conditional move operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_move_compare
  inputs:
  - cc
  - src
  output: dst
  operation:
  - if (cc_v == 0) goto <fmovcc_done>;
  - dst_v = src_v;
  - <fmovcc_done>
attributes:
  fp_flags: unchanged
  flags: unchanged
allocation:
  catalog_section: fpu
forms:
  operands:
  - name: cc
    type: condition
  - name: src
    type: FREG
  - name: dst
    type: FREG
  reads: FLAGS

mnemonic: FTEST
doc:
  title: Floating-Point Test
  summary: Performs the floating-point test operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_move_compare
  inputs:
  - src
  output: none
  operation:
  - ZF = src_v f== 0;
  - NF = src_v f< 0;
  - CF = 0;
  - VF = nan(src_v);
  repflags: fpu_compare_flags
attributes:
  streaming_candidate: true
  fp_flags:
    update_when_required:
    - NV
allocation:
  catalog_section: fpu
  layout_group: FP_COMPARE
  encoding:
  - id: FTEST.EA
    extension_root: EXT.fpu_move_compare
    extension_root_payload: '0xf65'
    extension_family: fpu_move_compare
    extended_opcode: 0x1000..0x107f
    extended_opcode_start: '0x1000'
    extended_opcode_end: '0x107f'
    extended_opcode_slots: 128
    extended_opcode_bits: 7
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0], z:S_D[6]
    fields:
    - name: z
      kind: S_D
      source: size
      storage: descriptor
      width: 1
    - name: e
      kind: EA
      source: src
      storage: descriptor
      width: 6
    kind: extended
  - id: FTEST.F
    extension_root: EXT.fpu_move_compare
    extension_root_payload: '0xf65'
    extension_family: fpu_move_compare
    extended_opcode: 0x0200..0x021f
    extended_opcode_start: '0x0200'
    extended_opcode_end: '0x021f'
    extended_opcode_slots: 32
    extended_opcode_bits: 5
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: f:FREG[3:0], z:S_D[4]
    fields:
    - name: z
      kind: S_D
      source: size
      storage: descriptor
      width: 1
    - name: f
      kind: FREG
      source: src
      storage: descriptor
      width: 4
    kind: extended
forms:
  operands:
  - - name: src
      type: FREG
  - - name: src
      type: EA
  size: S_D
  updates: FLAGS
  unordered: FLAGS.V = 1

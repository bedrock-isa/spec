mnemonic: FGETEXP
doc:
  title: Floating-Point Get Exponent
  summary: Performs the floating-point get exponent operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs: [src]
  output: dst
  operation:
  - tmp_v = src_v;
  - if (size_v != 4) goto <fgetexp_double>;
  - result_v = (tmp_v >> 23) & 0xff;
  - if (result_v != 0) goto <fgetexp_single_biased>;
  - result_v = 1;
  - <fgetexp_single_biased>
  - result_v = result_v - 127;
  - dst_v = int2float(result_v);
  - goto <fgetexp_done>;
  - <fgetexp_double>
  - result_v = (tmp_v >> 52) & 0x7ff;
  - if (result_v != 0) goto <fgetexp_double_biased>;
  - result_v = 1;
  - <fgetexp_double_biased>
  - result_v = result_v - 1023;
  - dst_v = int2float(result_v);
  - <fgetexp_done>
attributes:
  privilege: unprivileged
  fp_flags:
    update_when_required:
    - NV
allocation:
  catalog_section: fpu
  layout_group: FP_EXP_MAN_SCALE
  encoding:
  - id: FGETEXP.EA_TO_F
    extension_root: EXT.fpu_arithmetic
    extension_root_payload: '0xf67'
    extension_family: fpu_arithmetic
    extended_opcode: 0x3800..0x3fff
    extended_opcode_start: '0x3800'
    extended_opcode_end: '0x3fff'
    extended_opcode_slots: 2048
    extended_opcode_bits: 11
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0], f:FREG[9:6], z:S_D[10]
    fields:
    - name: z
      kind: S_D
      source: size
      storage: descriptor
      width: 1
    - name: e
      kind: EA
      source: src
      storage: descriptor
      width: 6
    - name: f
      kind: FREG
      source: dst
      storage: descriptor
      width: 4
    kind: extended
  - id: FGETEXP.F_TO_F
    extension_root: EXT.fpu_arithmetic
    extension_root_payload: '0xf67'
    extension_family: fpu_arithmetic
    extended_opcode: 0x2400..0x25ff
    extended_opcode_start: '0x2400'
    extended_opcode_end: '0x25ff'
    extended_opcode_slots: 512
    extended_opcode_bits: 9
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: f:FREG[3:0], F:FREG[7:4], z:S_D[8]
    fields:
    - name: z
      kind: S_D
      source: size
      storage: descriptor
      width: 1
    - name: f
      kind: FREG
      source: src
      storage: descriptor
      width: 4
    - name: f
      kind: FREG
      source: dst
      storage: descriptor
      width: 4
    kind: extended
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  size: S_D

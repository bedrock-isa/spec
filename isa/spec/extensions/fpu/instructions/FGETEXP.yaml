mnemonic: FGETEXP
doc:
  title: Floating-Point Get Exponent
  summary: Performs the floating-point get exponent operation.
  description: Performs the floating-point get exponent operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs: [src]
  output: dst
  operation:
  - tmp_v = src_v;
  - if (size_v != 4) goto <fgetexp_double>;
  - result_v = (tmp_v >> 23) & 0xff;
  - if (result_v != 0) goto <fgetexp_single_biased>;
  - result_v = 1;
  - <fgetexp_single_biased>
  - result_v = result_v - 127;
  - dst_v = int2float(result_v);
  - goto <fgetexp_done>;
  - <fgetexp_double>
  - result_v = (tmp_v >> 52) & 0x7ff;
  - if (result_v != 0) goto <fgetexp_double_biased>;
  - result_v = 1;
  - <fgetexp_double_biased>
  - result_v = result_v - 1023;
  - dst_v = int2float(result_v);
  - <fgetexp_done>
attributes:
  repeatable: true
  fp_flags:
    update_when_required:
    - NV
allocation:
  catalog_section: fpu
  layout_group: FP_EXP_MAN_SCALE
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  size: S_D

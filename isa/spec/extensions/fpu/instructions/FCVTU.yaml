mnemonic: FCVTU
doc:
  title: Floating-Point Convert Unsigned
  summary: Performs the floating-point convert unsigned operation.
  description: Performs the floating-point convert unsigned operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_move_compare
  inputs: [src]
  output: dst
  operation_by_form:
  - operands: [FREG, FREG]
    operation:
    - dst_v = float2float(src_v);
  - operands: [FREG, DREG]
    operation:
    - local integral_v:8 = trunc(src_v);
    - dst_v = integral_v;
  - operands: [DREG, FREG]
    operation:
    - dst_v = int2float(src_v);
    - if ((src_v & 0x8000000000000000) == 0) goto <fcvtu_done>;
    - result_v = src_v >> 1;
    - result_v = result_v | (src_v & 1);
    - dst_v = int2float(result_v) f* int2float(2:8);
    - <fcvtu_done>
attributes:
  repeatable: true
  streaming_candidate: true
  fp_flags:
    update_when_required:
    - NV
    - OF
    - UF
    - NX
allocation:
  catalog_section: fpu
  layout_group: FCVT_FCVTU
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: FREG
    - name: dst
      type: DREG
  - - name: src
      type: DREG
    - name: dst
      type: FREG
  conversions:
  - F32 <-> F64
  - signed int32/int64 <-> F32/F64
  - unsigned int32/int64 <-> F32/F64

mnemonic: FNMADD
doc:
  title: Floating-Point Fused Negative Multiply Add
  summary: Performs the floating-point fused negative multiply add operation.
  description: Performs the floating-point fused negative multiply add operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs:
  - lhs
  - rhs
  input_output: dst
  operation:
  - dst_v = (lhs_v f* rhs_v) f+ dst_v;
  - dst_v = f- dst_v;
attributes:
  repeatable: true
  streaming_candidate: true
  fp_flags:
    update:
    - NV
    - OF
    - UF
    - NX
allocation:
  catalog_section: fpu
  layout_group: FP_FMA
forms:
  operands:
  - - name: lhs
      type: FREG
    - name: rhs
      type: FREG
    - name: dst
      type: FREG
  - - name: lhs
      type: EA
    - name: rhs
      type: FREG
    - name: dst
      type: FREG
  - - name: lhs
      type: FREG
    - name: rhs
      type: EA
    - name: dst
      type: FREG
  size: S_D
  rounding: single_round
  memory_operands: at_most_one

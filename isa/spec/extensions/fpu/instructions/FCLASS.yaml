mnemonic: FCLASS
doc:
  title: Floating-Point Classify
  summary: Performs the floating-point classify operation.
  description: Performs the floating-point classify operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_move_compare
  inputs: [src]
  output: dst
  operation:
  - dst_v = 0;
  - tmp_v = src_v;
  - if (size_v != 4) goto <fclass_double>;
  - result_v = (tmp_v >> 23) & 0xff;
  - borrow_v = tmp_v & 0x7fffff;
  - carry_v = (tmp_v >> 31) & 1;
  - if (result_v != 0xff) goto <fclass_single_finite>;
  - if (borrow_v != 0) goto <fclass_single_nan>;
  - if (carry_v == 0) goto <fclass_single_pos_inf>;
  - dst_v = 0x1;
  - goto <fclass_done>;
  - <fclass_single_pos_inf>
  - dst_v = 0x80;
  - goto <fclass_done>;
  - <fclass_single_nan>
  - if ((borrow_v & 0x400000) != 0) goto <fclass_single_qnan>;
  - dst_v = 0x100;
  - goto <fclass_done>;
  - <fclass_single_qnan>
  - dst_v = 0x200;
  - goto <fclass_done>;
  - <fclass_single_finite>
  - if (result_v != 0) goto <fclass_single_normal>;
  - if (borrow_v != 0) goto <fclass_single_subnormal>;
  - if (carry_v == 0) goto <fclass_single_pos_zero>;
  - dst_v = 0x8;
  - goto <fclass_done>;
  - <fclass_single_pos_zero>
  - dst_v = 0x10;
  - goto <fclass_done>;
  - <fclass_single_subnormal>
  - if (carry_v == 0) goto <fclass_single_pos_subnormal>;
  - dst_v = 0x4;
  - goto <fclass_done>;
  - <fclass_single_pos_subnormal>
  - dst_v = 0x20;
  - goto <fclass_done>;
  - <fclass_single_normal>
  - if (carry_v == 0) goto <fclass_single_pos_normal>;
  - dst_v = 0x2;
  - goto <fclass_done>;
  - <fclass_single_pos_normal>
  - dst_v = 0x40;
  - goto <fclass_done>;
  - <fclass_double>
  - result_v = (tmp_v >> 52) & 0x7ff;
  - borrow_v = tmp_v & 0xfffffffffffff;
  - carry_v = (tmp_v >> 63) & 1;
  - if (result_v != 0x7ff) goto <fclass_double_finite>;
  - if (borrow_v != 0) goto <fclass_double_nan>;
  - if (carry_v == 0) goto <fclass_double_pos_inf>;
  - dst_v = 0x1;
  - goto <fclass_done>;
  - <fclass_double_pos_inf>
  - dst_v = 0x80;
  - goto <fclass_done>;
  - <fclass_double_nan>
  - if ((borrow_v & 0x8000000000000) != 0) goto <fclass_double_qnan>;
  - dst_v = 0x100;
  - goto <fclass_done>;
  - <fclass_double_qnan>
  - dst_v = 0x200;
  - goto <fclass_done>;
  - <fclass_double_finite>
  - if (result_v != 0) goto <fclass_double_normal>;
  - if (borrow_v != 0) goto <fclass_double_subnormal>;
  - if (carry_v == 0) goto <fclass_double_pos_zero>;
  - dst_v = 0x8;
  - goto <fclass_done>;
  - <fclass_double_pos_zero>
  - dst_v = 0x10;
  - goto <fclass_done>;
  - <fclass_double_subnormal>
  - if (carry_v == 0) goto <fclass_double_pos_subnormal>;
  - dst_v = 0x4;
  - goto <fclass_done>;
  - <fclass_double_pos_subnormal>
  - dst_v = 0x20;
  - goto <fclass_done>;
  - <fclass_double_normal>
  - if (carry_v == 0) goto <fclass_double_pos_normal>;
  - dst_v = 0x2;
  - goto <fclass_done>;
  - <fclass_double_pos_normal>
  - dst_v = 0x40;
  - <fclass_done>
attributes:
  repeatable: true
  fp_flags: unchanged
allocation:
  catalog_section: fpu
forms:
  operands:
  - name: src
    type: FREG
  - name: dst
    type: DREG
  size: S_D
  result: classification bitmap

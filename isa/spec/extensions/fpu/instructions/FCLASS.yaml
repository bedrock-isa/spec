mnemonic: FCLASS
doc:
  title: Floating-Point Classify
  summary: Performs the floating-point classify operation.
  description: Performs the floating-point classify operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_move_compare
  inputs: [src]
  output: dst
  operation:
  - dst_v = arch_fclass(src_v, size_v);
  operation_text: >
    FCLASS classifies the source floating-point value according to the selected S or D format and writes a one-hot
    classification bitmap to the destination D register. The bitmap distinguishes negative infinity, negative normal,
    negative subnormal, negative zero, positive zero, positive subnormal, positive normal, positive infinity, signaling NaN,
    and quiet NaN.
attributes:
  fp_flags: unchanged
allocation:
  catalog_section: fpu
forms:
  operands:
  - name: src
    type: FREG
  - name: dst
    type: DREG
  size: S_D
  result: classification bitmap

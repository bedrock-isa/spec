mnemonic: FCLASS
doc:
  title: Floating-Point Classify
  summary: Performs the floating-point classify operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_move_compare
  inputs: [src]
  output: dst
  operation:
  - dst_v = arch_fclass(src_v, size_v);
  operation_text: >
    FCLASS classifies the source floating-point value according to the selected S or D format and writes a one-hot
    classification bitmap to the destination D register. The bitmap distinguishes negative infinity, negative normal,
    negative subnormal, negative zero, positive zero, positive subnormal, positive normal, positive infinity, signaling NaN,
    and quiet NaN.
attributes:
  fp_flags: unchanged
allocation:
  catalog_section: fpu
  encoding:
  - id: FCLASS.F_TO_D
    extension_root: EXT.fpu_move_compare
    extension_root_payload: '0xf65'
    extension_family: fpu_move_compare
    extended_opcode: 0x0300..0x03ff
    extended_opcode_start: '0x0300'
    extended_opcode_end: '0x03ff'
    extended_opcode_slots: 256
    extended_opcode_bits: 8
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: d:DREG[2:0], f:FREG[6:3], z:S_D[7]
    fields:
    - name: z
      kind: S_D
      source: size
      storage: descriptor
      width: 1
    - name: f
      kind: FREG
      source: src
      storage: descriptor
      width: 4
    - name: d
      kind: DREG
      source: dst
      storage: descriptor
      width: 3
    kind: extended
forms:
  operands:
  - name: src
    type: FREG
  - name: dst
    type: DREG
  size: S_D
  result: classification bitmap

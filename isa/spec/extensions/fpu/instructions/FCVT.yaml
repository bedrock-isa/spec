mnemonic: FCVT
doc:
  title: Floating-Point Convert Signed
  summary: Performs the floating-point convert signed operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_move_compare
  inputs: [src]
  output: dst
  operation_by_form:
  - operands: [FREG, FREG]
    operation:
    - dst_v = float2float(src_v);
  - operands: [FREG, DREG]
    operation:
    - local integral_v:8 = trunc(src_v);
    - dst_v = integral_v;
  - operands: [DREG, FREG]
    operation:
    - dst_v = int2float(src_v);
attributes:
  streaming_candidate: true
  fp_flags:
    update_when_required:
    - NV
    - OF
    - UF
    - NX
allocation:
  catalog_section: fpu
  layout_group: FCVT_FCVTU
  encoding:
  - id: FCVT.D_TO_F
    extension_root: EXT.fpu_move_compare
    extension_root_payload: '0xf65'
    extension_family: fpu_move_compare
    extended_opcode: 0x0280..0x02ff
    extended_opcode_start: '0x0280'
    extended_opcode_end: '0x02ff'
    extended_opcode_slots: 128
    extended_opcode_bits: 7
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: d:DREG[2:0], f:FREG[6:3]
    fields:
    - name: d
      kind: DREG
      source: src
      storage: descriptor
      width: 3
    - name: f
      kind: FREG
      source: dst
      storage: descriptor
      width: 4
    kind: extended
  - id: FCVT.F_TO_D
    extension_root: EXT.fpu_move_compare
    extension_root_payload: '0xf65'
    extension_family: fpu_move_compare
    extended_opcode: 0x0600..0x067f
    extended_opcode_start: '0x0600'
    extended_opcode_end: '0x067f'
    extended_opcode_slots: 128
    extended_opcode_bits: 7
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: d:DREG[2:0], f:FREG[6:3]
    fields:
    - name: f
      kind: FREG
      source: src
      storage: descriptor
      width: 4
    - name: d
      kind: DREG
      source: dst
      storage: descriptor
      width: 3
    kind: extended
  - id: FCVT.F_TO_F
    extension_root: EXT.fpu_move_compare
    extension_root_payload: '0xf65'
    extension_family: fpu_move_compare
    extended_opcode: 0x0700..0x07ff
    extended_opcode_start: '0x0700'
    extended_opcode_end: '0x07ff'
    extended_opcode_slots: 256
    extended_opcode_bits: 8
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: f:FREG[3:0], F:FREG[7:4]
    fields:
    - name: f
      kind: FREG
      source: src
      storage: descriptor
      width: 4
    - name: f
      kind: FREG
      source: dst
      storage: descriptor
      width: 4
    kind: extended
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: FREG
    - name: dst
      type: DREG
  - - name: src
      type: DREG
    - name: dst
      type: FREG
  conversions:
  - F32 <-> F64
  - signed int32/int64 <-> F32/F64
  - unsigned int32/int64 <-> F32/F64

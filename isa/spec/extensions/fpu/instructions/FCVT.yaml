mnemonic: FCVT
doc:
  title: Floating-Point Convert Signed
  summary: Performs the floating-point convert signed operation.
  description: Performs the floating-point convert signed operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_move_compare
  inputs: [src]
  output: dst
  operation_by_form:
  - operands: [FREG, FREG]
    operation:
    - dst_v = float2float(src_v);
  - operands: [FREG, DREG]
    operation:
    - local integral_v:8 = trunc(src_v);
    - dst_v = integral_v;
  - operands: [DREG, FREG]
    operation:
    - dst_v = int2float(src_v);
attributes:
  repeatable: true
  streaming_candidate: true
  fp_flags:
    update_when_required:
    - NV
    - OF
    - UF
    - NX
allocation:
  catalog_section: fpu
  layout_group: FCVT_FCVTU
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: FREG
    - name: dst
      type: DREG
  - - name: src
      type: DREG
    - name: dst
      type: FREG
  conversions:
  - F32 <-> F64
  - signed int32/int64 <-> F32/F64
  - unsigned int32/int64 <-> F32/F64

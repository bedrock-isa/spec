mnemonic: FFLOOR
doc:
  title: Floating-Point Floor
  summary: Performs the floating-point floor operation.
  description: Performs the floating-point floor operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs: [src]
  output: dst
  operation:
  - dst_v = floor(src_v);
attributes:
  repeatable: true
  fp_flags:
    update_when_required:
    - NV
    - NX
allocation:
  catalog_section: fpu
  layout_group: FP_INTEGRAL_ROUND
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  - - name: src
      type: FREG
    - name: dst
      type: EA
  size: S_D
  result: floating integral value

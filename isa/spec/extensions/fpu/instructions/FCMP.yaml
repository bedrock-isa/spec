mnemonic: FCMP
doc:
  title: Floating-Point Compare
  summary: Performs the floating-point compare operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_move_compare
  inputs:
  - dst
  - src
  output: none
  operation:
  - ZF = dst_v f== src_v;
  - NF = dst_v f< src_v;
  - CF = 0;
  - VF = nan(dst_v) || nan(src_v);
  repflags: fpu_compare_flags
attributes:
  streaming_candidate: true
  fp_flags:
    update_when_required:
    - NV
allocation:
  catalog_section: fpu
  layout_group: FP_COMPARE
  encoding:
  - id: FCMP.EA_TO_F
    extension_root: EXT.fpu_move_compare
    extension_root_payload: '0xf65'
    extension_family: fpu_move_compare
    extended_opcode: 0x0800..0x0fff
    extended_opcode_start: '0x0800'
    extended_opcode_end: '0x0fff'
    extended_opcode_slots: 2048
    extended_opcode_bits: 11
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0], f:FREG[9:6], z:S_D[10]
    fields:
    - name: z
      kind: S_D
      source: size
      storage: descriptor
      width: 1
    - name: e
      kind: EA
      source: src
      storage: descriptor
      width: 6
    - name: f
      kind: FREG
      source: dst
      storage: descriptor
      width: 4
    kind: extended
  - id: FCMP.F_TO_F
    extension_root: EXT.fpu_move_compare
    extension_root_payload: '0xf65'
    extension_family: fpu_move_compare
    extended_opcode: 0x0000..0x01ff
    extended_opcode_start: '0x0000'
    extended_opcode_end: '0x01ff'
    extended_opcode_slots: 512
    extended_opcode_bits: 9
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: f:FREG[3:0], F:FREG[7:4], z:S_D[8]
    fields:
    - name: z
      kind: S_D
      source: size
      storage: descriptor
      width: 1
    - name: f
      kind: FREG
      source: src
      storage: descriptor
      width: 4
    - name: f
      kind: FREG
      source: dst
      storage: descriptor
      width: 4
    kind: extended
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  size: S_D
  updates: FLAGS
  unordered: FLAGS.V = 1

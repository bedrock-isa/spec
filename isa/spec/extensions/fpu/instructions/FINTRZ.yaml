mnemonic: FINTRZ
doc:
  title: Floating-Point Integral Toward Zero
  summary: Performs the floating-point integral toward zero operation.
  description: Performs the floating-point integral toward zero operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs: [src]
  output: dst
  operation:
  - local integral_v:8 = trunc(src_v);
  - dst_v = int2float(integral_v);
attributes:
  fp_flags:
    update_when_required:
    - NV
    - NX
allocation:
  catalog_section: fpu
  layout_group: FP_INTEGRAL_ROUND
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  - - name: src
      type: FREG
    - name: dst
      type: EA
  size: S_D
  result: floating integral value

save_area_formats:
  processor_state:
    extension_component_formats:
    - component_id: 2
      name: FLOATING_POINT
      title: Floating-Point State
      extension_requirement: floating_point
      validity: Each extension component begins with a component-local validity bitmap. If a state bit is clear, RESTORE leaves
        that floating-point state item unchanged.
      description: This component stores the floating-point accrued exception flags, the floating-point status/control-mode
        word, and the architectural floating-point register file. FFLAGS and FSTATUS are separate 16-bit architectural state.
        The F register file remains Q-sized and starts on the next 8-byte boundary.
      size: 144
      component_bitmap_bits:
        description: Offset +0x000 contains a 64-bit validity mask for the floating-point state slots stored in this component.
          A set bit means that the corresponding state item is present in the save image.
        reserved_bits: Unlisted bits are reserved; SAVE writes them as zero and RESTORE ignores them.
        mappings:
        - bits: '0'
          slot: FFLAGS
          meaning: validates FFLAGS at +0x008
        - bits: '1'
          slot: FSTATUS
          meaning: validates FSTATUS at +0x00a
        - bits: 2+n
          slot: F[n]
          meaning: n=0..15; validates Fn at +0x010 + 8*n
      slots:
      - offset: 0
        field: component-local valid bitmap
        meaning: validity mask for floating-point state slots
      - offset: 8
        field: FFLAGS[15:0]
        meaning: floating-point accrued exception flags
      - offset: 10
        field: FSTATUS[15:0]
        meaning: floating-point control and status-mode register
      - offset: 12
        field: reserved padding
        meaning: reserved padding to align the F register file
      - repeat:
          count: 16
          offset_start: 16
          offset_stride: 8
          field_template: F{n}
          meaning_template: floating-point register F{n}

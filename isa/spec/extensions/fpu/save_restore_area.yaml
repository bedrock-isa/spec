save_area_formats:
  processor_state:
    extension_component_formats:
    - component_id: 2
      name: FLOATING_POINT
      title: Floating-Point State
      extension_requirement: floating_point
      validity: The component header contains the F-register validity bitmap. FFLAGS and FSTATUS are present whenever
        the floating-point state block is present.
      description: This component stores the floating-point accrued exception flags, the floating-point status/control-mode
        word, and the architectural floating-point register file. The first 64-bit word packs the F-register validity bitmap
        together with FFLAGS and FSTATUS. The F register file starts at +0x008 and the component storage size is rounded up
        to a 64-byte boundary.
      size: 0x0c0
      header_fields:
      - offset: 0
        bits: 0..15
        field: F_VALID
        meaning: bit n validates Fn at +0x008 + 8*n
      - offset: 0
        bits: 16..31
        field: reserved
        meaning: SAVE writes zero and RESTORE ignores
      - offset: 0
        bits: 32..47
        field: FFLAGS
        meaning: floating-point accrued exception flags, always present when this state block is present
      - offset: 0
        bits: 48..63
        field: FSTATUS
        meaning: floating-point control and status-mode register, always present when this state block is present
      slots:
      - repeat:
          count: 16
          offset_start: 8
          offset_stride: 8
          field_template: F{n}
          meaning_template: floating-point register F{n}
      - offset: 136
        field: reserved padding to 0x0c0
        meaning: reserved padding to the 64-byte component-size boundary

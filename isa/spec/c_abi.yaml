document:
  title: Bedrock C ABI
  subtitle: C Language Binding
  architecture: Bedrock
  version: 0.1
scope:
  summary: The Bedrock C ABI defines the C data model, register convention, function call contract, aggregate
    passing rules, variadic call rules, return-value assignment, and compiler-runtime obligations for
    C-family toolchains. It builds on the Bedrock language-neutral ELF ABI for object files, relocation,
    loading, dynamic linking, TLS, and code models.
  profiles:
    - name: bedrock-c
      description: C-family language binding layered on the Bedrock language-neutral ELF ABI.
abi_hierarchy:
  current_layer: language ABI
  current_document_scope: >
    This document specifies one language ABI layer: the Bedrock C language
    binding. It relies on the language-neutral ELF ABI for object files,
    relocation, loading, dynamic linking, TLS, and code models, while leaving
    process-entry policy to an OS ABI.
terminology:
  summary: >
    These terms are specific to the C binding. ELF and address-space terms keep
    the meanings defined by the language-neutral ABI and the architecture
    manual.
  terms:
    - term: object pointer
      definition: >
        A 64-bit pre-segment address value that designates an object or one-past
        an object according to the C abstract machine.

    - term: function pointer
      definition: >
        A 64-bit pre-segment code address naming a near-call entry point. It is
        not a CS:PC pair, far descriptor, or runtime-private veneer descriptor.

    - term: caller-saved register
      definition: >
        A register whose value may be overwritten by a call unless the caller
        saves it before the call.

    - term: callee-saved register
      definition: >
        A register whose incoming value must be preserved by the called function
        if the function uses it.

    - term: sret buffer
      definition: >
        Caller-allocated storage used to receive a return value that is too
        large or unsuitable for the normal return registers.

    - term: addressable by-value argument
      definition: >
        A by-value aggregate argument that is passed through caller-owned stack
        storage because the callee may need an address for the object.
data_model:
  name: LP64
  byte_order: little_endian
  instruction_word_bits: 16
  stack_alignment_bytes: 16
  aggregate_alignment_max_bytes: 16
  pointer:
    bits: 64
    alignment: 8
  scalar_types:
    - name: _Bool
      bits: 8
      alignment: 1
    - name: char
      bits: 8
      alignment: 1
    - name: signed char
      bits: 8
      alignment: 1
    - name: unsigned char
      bits: 8
      alignment: 1
    - name: short
      bits: 16
      alignment: 2
    - name: int
      bits: 32
      alignment: 4
    - name: long
      bits: 64
      alignment: 8
    - name: long long
      bits: 64
      alignment: 8
    - name: __int128
      bits: 128
      alignment: 16
    - name: unsigned __int128
      bits: 128
      alignment: 16
    - name: pointer
      bits: 64
      alignment: 8
    - name: size_t
      bits: 64
      alignment: 8
    - name: ptrdiff_t
      bits: 64
      alignment: 8
    - name: wchar_t
      bits: 32
      alignment: 4
    - name: char16_t
      bits: 16
      alignment: 2
    - name: char32_t
      bits: 32
      alignment: 4
    - name: float
      bits: 32
      alignment: 4
    - name: double
      bits: 64
      alignment: 8
    - name: long double
      bits: 64
      alignment: 8
  scalar_type_policies:
    basic_c_types:
      plain_char_signedness: signed
      size_t: unsigned long
      ptrdiff_t: long
      enum_default_type: int
      enum_default_size_bytes: 4
      enum_default_alignment_bytes: 4
      _Bool_values: stored as 0 or 1 in bit 0
      wchar_t: signed 32-bit integer
      char16_t: unsigned 16-bit integer
      char32_t: unsigned 32-bit integer
    int128:
      c_types:
        - __int128
        - unsigned __int128
      size_bytes: 16
      alignment_bytes: 16
      object_representation: little_endian
      low_64_bits: lower_address
      register_pair: D1:D0
      low_register: D0
      high_register: D1
      stack_slot_alignment_bytes: 16
      load_store_atomicity: not atomic; may use two 64-bit memory operations
      atomic_lock_free: false
      atomic_lowering: libatomic or compiler-runtime helper
    long_double:
      c_type: long double
      storage_format: IEEE-754 binary64
      size_bytes: 8
      alignment_bytes: 8
      argument_register_class: floating_point
      return_register: F0
      variadic_slot_size_bytes: 16
      variadic_value_storage: 8-byte binary64 value without widening
      c_type_identity: distinct C type
      calling_convention_compatibility: ABI-compatible with double
    unsupported_extended_scalars:
      _Float16: not part of the baseline bedrock-c ABI
      __bf16: not part of the baseline bedrock-c ABI
      vector_types: not part of the baseline bedrock-c ABI; a target extension must define its own classification
  layout_rules:
    - Integer and pointer objects are stored little-endian.
    - Plain char is signed. signed char, unsigned char, and plain char remain distinct C types.
    - The default enum representation is the 32-bit int representation with 4-byte alignment.
    - _Bool stores canonical values as 0 or 1 in bit 0; upper bits are ignored by consumers.
    - __int128 and unsigned __int128 objects are stored little-endian; the low 64 bits live at
      the lower address.
    - long double uses the same 8-byte IEEE-754 binary64 storage format as double.
    - Pointer values are pre-segment virtual address values. Memory accesses apply segment pre-translation
      when the pointer is used as part of an effective address.
    - C function pointers are ordinary 64-bit pre-segment code addresses naming near-call entry points.
      They are not CS:PC pairs or far-call descriptors.
    - Object pointers and function pointers have the same size and alignment but remain distinct C
      pointer categories.
    - Multiword immediate data and data directives store the least significant 16-bit word first.
    - Struct fields are laid out in declaration order with natural alignment up to the aggregate maximum.
    - Unions have the size and alignment of their most strictly aligned member, rounded up to that alignment.
    - Arrays store elements contiguously with each element using the ABI size of its type.
    - Aggregate object size is rounded up to the aggregate object's alignment.
    - Boolean objects store the truth value in bit 0; upper bits are ignored by consumers.
register_convention:
  data_register_banking:
    summary: >
      The C ABI is DBANK-neutral. C function calls use bank zero as the
      ABI-visible D-register file; nonzero data-register banks are optional
      target resources for compiler-generated temporaries and specialized
      runtime code.
    public_boundary: DBANK must be 0 on C function entry and return
    call_boundary: A caller must issue an ordinary C call with DBANK = 0; a callee must return with DBANK = 0
    source_language_visibility: DBANK is not visible to the C abstract machine
    bank_zero: D0-D7 in bank 0 are the ABI-visible integer registers listed below
    nonzero_banks: caller-managed volatile scratch state when enabled by the target object attributes
    preservation: no nonzero bank is callee-saved by the C ABI
    live_across_call: C code must not keep a live value only in a nonzero DBANK across an ordinary C call
    target_feature_gate: use of DBANK beyond zero requires the language-neutral ELF DBANK object attribute
    recommended_compiler_policy:
      - Do not use DBANK in the baseline C code-generation mode.
      - Enable DBANK use only under an explicit target feature or optimization option.
      - Prefer nonzero banks for leaf hot regions, spill-heavy loops, and REP or REPG lowering.
      - Restore DBANK to zero before calls, returns, tail calls, unwinding edges, and externally visible labels.
  integer_registers:
    caller_saved:
      - D0
      - D1
      - D2
      - D3
      - D4
      - D5
    callee_saved:
      - D6
      - D7
    c_scalar_return: D0
    c_128_bit_scalar_return: D1:D0
    integer_arguments:
      - D0
      - D1
      - D2
      - D3
      - D4
      - D5
  address_registers:
    caller_saved:
      - A0
      - A1
      - A2
      - A3
      - A4
      - A5
    callee_saved:
      - A6
      - A7
    pointer_arguments:
      - A0
      - A1
      - A2
      - A3
      - A4
      - A5
    c_pointer_return: A0
    conditional_sret_buffer_argument: A5
    sret_result_return: A0
  floating_point_registers:
    caller_saved:
      - F0
      - F1
      - F2
      - F3
      - F4
      - F5
      - F6
      - F7
    callee_saved:
      - F8
      - F9
      - F10
      - F11
      - F12
      - F13
      - F14
      - F15
    callee_save_mechanism:
      instruction_pair: FPUSHM/FPOPM
      bitmap_rule: bits 0..15 name F0-F15; C ABI prologues and epilogues normally set only bits for clobbered F8-F15
    floating_point_arguments:
      - F0
      - F1
      - F2
      - F3
      - F4
      - F5
      - F6
      - F7
    c_floating_point_return: F0
  stack_register:
    name: SP
    role: architectural stack pointer
    preserved_by_callee: true
    ordinary_c_use: stack pointer only; not available as a general C temporary
  program_counter:
    name: PC
    role: architectural instruction pointer
    ordinary_c_use: control-flow target only; not available as a general C temporary
  flags:
    caller_saved:
      - FLAGS
    callee_obligation: callees may clobber condition codes
  status_registers:
    STATUS: not part of the C abstract machine; ordinary C code may access it only through target-specific intrinsics or runtime code
    FSTATUS: not part of the C abstract machine; floating-point environment support is a higher-level runtime contract
    FFLAGS: not part of the C abstract machine; floating-point exception flag handling is a higher-level runtime contract
calling_convention:
  stack:
    grows: downward
    entry_alignment: 16
    pre_call_alignment: callee_entry_aligned_after_call_push
    call_return_address_push: true
    red_zone: none
    outgoing_argument_area: none
    dynamic_realignment: callee_realigns_and_restores_incoming_sp
  return_address:
    size_bytes: 8
    location_at_entry: '[SP]'
  argument_passing:
    order: source_order
    integer_registers:
      - D0
      - D1
      - D2
      - D3
      - D4
      - D5
    pointer_registers:
      - A0
      - A1
      - A2
      - A3
      - A4
      - A5
    floating_point_registers:
      - F0
      - F1
      - F2
      - F3
      - F4
      - F5
      - F6
      - F7
    stack_arguments: right_to_left
    stack_argument_alignment: 16
    stack_argument_slot_size: 16
    narrow_integer_extension:
      signed: sign_extend_to_64
      unsigned: zero_extend_to_64
      _Bool: zero_extend_to_64
      plain_char: sign_extend_to_64
    pointer_argument_rule: address_registers_then_stack
    floating_point_argument_rule: fp_registers_then_stack
    scalar_128_bit_integer_register_pair:
      registers: D1:D0
      low_register: D0
      high_register: D1
    scalar_128_bit_stack_slot_alignment: 16
    stack_argument_value_placement: low_address_bytes
    register_overflow: stack_argument_area
    sret_register_use: A5_when_sret_else_ordinary_argument
  return_values:
    c_binding:
      integer_scalar: D0
      pointer_or_address_scalar: A0
      floating_point_scalar: F0
      long_double_scalar: F0
      scalar_128_bit: D1:D0
      small_aggregate_up_to_16_bytes: D1:D0
      small_aggregate_layout: low_address_bytes_D0_then_D1
      mixed_int_float_aggregate_up_to_16_bytes: D1:D0_raw_bytes
      aggregate_larger_than_16_bytes: sret_A5_return_A0
  aggregate_passing:
    rules:
      c_by_value_arguments: caller_owned_stack_copy_address
      argument_copy_alignment: 16
      argument_copy_register_class: A
      argument_copy_registers:
        - A0
        - A1
        - A2
        - A3
        - A4
        - A5
      argument_copy_stack_default: copy_address
      aggregate_register_arguments: none
      mixed_int_float_aggregate_arguments: caller_owned_stack_copy_address
      packed_aggregate_arguments: caller_owned_stack_copy_address
      bitfield_aggregate_arguments: caller_owned_stack_copy_address
      unaligned_aggregate_arguments: caller_owned_stack_copy_address
      c_return: caller_allocated_return_buffer
      conditional_sret_buffer_argument_register: A5
      return_buffer_alignment: 16
      return_register_result: A0
      small_aggregate_register_return:
        max_size_bytes: 16
        registers: D1:D0
      small_aggregate_layout: low_address_bytes_D0_then_D1
      packed_aggregate_return: size_based_raw_bytes
      bitfield_aggregate_return: size_based_raw_bytes
      unaligned_aggregate_return: size_based_raw_bytes
  varargs:
    rules:
      fixed_named_arguments: normal_assignment
      variable_arguments: stack_only
      unprototyped_call_arguments: stack_only
      integer_narrow_variadic_arguments: zero_extend_to_slot
      floating_point_variadic_arguments: source_width_without_widening
      long_double_variadic_arguments: binary64_in_one_16_byte_slot
      aggregate_variadic_arguments: copy_address_in_slot
      register_save_area: none
      variadic_stack_slot_size: 16
      variadic_stack_slot_alignment: 16
      va_arg_alignment: 16
      va_arg_value_placement: low_address_bytes
      va_list: next_variadic_stack_slot_pointer
  frame_pointer:
    default: omitted
    conventional_register: A7
    note: A7 is used as a frame pointer when a function elects to maintain one.
examples:
  c_return_values:
    introduction: The C binding uses a single return value class. Integer scalars return in D0, pointer
      and address scalars return in A0, and 128-bit integer scalars return in D1:D0 with the low 64 bits
      in D0. Aggregates up to 16 bytes return in D1:D0; larger aggregates use a caller-allocated return
      buffer.
    cases:
      - title: Integer scalar return
        source: uint64_t add64(uint64_t a, uint64_t b);
        result:
          - D0 = return value
      - title: Pointer return
        source: void *find_byte(void *base, uint64_t len, int byte);
        result:
          - A0 = return pointer
      - title: Floating-point scalar return
        source: double hypot2(double x, double y);
        result:
          - F0 = return value
      - title: 128-bit scalar return
        source: unsigned __int128 multiply_wide(uint64_t a, uint64_t b);
        result:
          - D0 = low 64 bits
          - D1 = high 64 bits
      - title: Small aggregate return
        source: struct pair make_pair(uint64_t first, uint64_t second);
        result:
          - D0 = low-address 64 bits
          - D1 = high-address 64 bits
      - title: Large aggregate return
        source: struct triple make_triple(uint64_t a, uint64_t b, uint64_t c);
        result:
          - caller allocates the return buffer and passes its pointer in A5
          - callee stores the aggregate into the buffer named by A5 at entry
          - callee returns the same buffer pointer in A0
freestanding_c:
  summary: Freestanding C uses the Bedrock C data and call ABI together with the language-neutral ELF
    ABI. It is sufficient for compiler output, static objects, and runtime-provided helper calls, but
    does not define process startup or hosted library behavior.
  rules:
    entry_point_owner: OS ABI
    bss_zero_fill_owner: language-neutral ELF ABI
    integer_128_simple_operations:
      - add
      - subtract
      - negate
      - bitwise
      - shift
      - compare
      - truncation
      - extension
    integer_128_helper_operations:
      - multiply
      - signed_divide
      - unsigned_divide
      - signed_remainder
      - unsigned_remainder
      - integer_float_conversion
    integer_128_inline_guarantee: none
    compiler_runtime_helper_calls: normal_c_abi
    runtime_helper_symbol_policy: compiler_rt_libgcc_compatible
    floating_point_helpers: allowed_when_target_lacks_operation
    tls_boundary: OS_ABI_or_loader_profile_required
    tls_relocations_owner: language-neutral ELF ABI
    function_pointer_representation: pre_segment_near_call_address_64
    code_data_pointer_relationship: same_size_alignment_distinct_categories
    common_symbol_alignment: declared_type_abi_alignment
    externally_visible_object_alignment: declared_type_abi_alignment_capped_by_aggregate_maximum
    c_call_relocation_default:
      direct: R_BEDROCK_CALL_TARGET
      external_plt: active_code_model_plt_relocation
    instruction_relaxation: assembler_linker_policy
    hosted_interfaces: outside_freestanding_c_abi
  runtime_helpers:
    integer_128:
      multiply: __multi3
      signed_divide: __divti3
      unsigned_divide: __udivti3
      signed_remainder: __modti3
      unsigned_remainder: __umodti3
      shift_left: __ashlti3
      arithmetic_shift_right: __ashrti3
      logical_shift_right: __lshrti3
    helper_call_abi: normal_c_abi
    int128_argument_rule: ordinary_int128_argument_rule
    int128_return_rule: D1:D0
memory_model:
  summary: c_toolchain_memory_contract
  normal_memory:
    aligned_1_byte_load_store: tear-free
    aligned_2_byte_load_store: tear-free
    aligned_4_byte_load_store: tear-free
    aligned_8_byte_load_store: tear-free
    sixteen_byte_or_larger_access: not atomic
    unaligned_access: no tear-free guarantee
  c_atomics:
    lock_free_object_kinds:
      - integer
      - pointer
    lock_free_widths_bytes:
      - 1
      - 2
      - 4
      - 8
    lock_free_alignment: natural
    unaligned_atomic_objects: not lock-free
    integer_128_bit_atomic: helper
    sixteen_byte_atomic_objects: not lock-free
    wider_than_8_byte_atomic_objects: helper
    __atomic_always_lock_free: naturally_aligned_1_2_4_8_only
    memory_order_mapping:
      relaxed: relaxed
      consume: acquire
      acquire: acquire
      release: release
      acq_rel: acqrel
      seq_cst: seqcst
    native_load_store_widths_bytes:
      - 1
      - 2
      - 4
      - 8
    native_load_store_access: ordinary_load_store
    native_load_store_atomicity_source: tear_free_aligned_1_2_4_8
    load_store_ordering:
      relaxed: no fence
      consume_load: load_then_AFENCE
      acquire_load: load_then_AFENCE
      release_store: AFENCE_then_store
      seq_cst_load: AFENCE_load_AFENCE
      seq_cst_store: AFENCE_store_AFENCE
    thread_fence_lowering:
      relaxed: no-op
      consume: AFENCE
      acquire: AFENCE
      release: AFENCE
      acq_rel: AFENCE
      seq_cst: AFENCE
    fetch_add_lowering: FETCHADD
    fetch_sub_lowering: FETCHSUB
    fetch_and_lowering: FETCHAND
    fetch_or_lowering: FETCHOR
    fetch_xor_lowering: FETCHXOR
    exchange_lowering: compare_exchange_loop
    compare_exchange_widths_bytes:
      - 1
      - 2
      - 4
      - 8
    compare_exchange_lowering: CMPXCHG
    compare_exchange_order_selection: satisfy_success_and_failure_after_consume_to_acquire
    atomic_helper_abi: normal_c_abi
    atomic_helper_symbol_policy: compiler_runtime_provider
  volatile:
    access_preservation: preserve_observable_accesses
    ordering: not_an_ordering_primitive
  device_memory:
    mmio_ordering: OS_ABI_loader_or_mapping_attributes
    volatile_mmio: preserves_accesses_not_ordering
  executable_memory:
    dynamic_code_patch: requires_explicit_cache_synchronization
    relocation_patch_visibility: patching_agent_synchronizes_before_transfer

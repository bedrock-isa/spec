version: draft-v1

cpuid:
  calling_convention:
    inputs:
      D0: leaf
      D1: subleaf
    outputs: [D0, D1, D2, D3]
    unsupported_leaf: D0..D3 = 0
    unsupported_subleaf: D0..D3 = 0

  policy:
    base_profile:
      name: Bedrock base ISA
      description: >
        All non-FPU instructions currently defined by this manual are part of
        the base Bedrock ISA profile. Programs do not query REP, REPcc, REPG,
        atomics, fences, cache/TLB management instructions, segmentation,
        paging, or control-register access as independently optional
        instruction-set fragments.
    optional_extensions:
      range: [0x00010000, 0x0001ffff]
      description: >
        Optional extension leaves describe architectural features that may be
        absent while the base ISA remains usable. The initial optional
        extension is floating-point execution.
    implementation_properties:
      range: [0x00020000, 0x0002ffff]
      description: >
        Implementation-property leaves expose only information that software can
        reasonably use when choosing code paths or tuning algorithms. Internal
        structures such as register renaming, reorder buffers, issue queues, or
        physical-register files are not exposed as architectural discovery bits.

  leaf_ranges:
    - range: [0x00000000, 0x0000ffff]
      name: standard
      description: basic identification and base-profile constants
    - range: [0x00010000, 0x0001ffff]
      name: optional ISA extensions
      description: optional architectural extensions outside the base ISA
    - range: [0x00020000, 0x0002ffff]
      name: implementation properties
      description: program-visible implementation properties and tuning hints
    - range: [0x00030000, 0x0003ffff]
      name: memory topology
      description: cache, TLB, and memory-topology discovery
    - range: [0x40000000, 0x4fffffff]
      name: implementation private
      description: implementation-defined leaves
    - range: [0x80000000, 0x8fffffff]
      name: extended identification
      description: extended brand/model strings and long-form identification

  leaves:
    - leaf: 0x00000000
      name: STANDARD_ROOT
      summary: Standard CPUID root.
      outputs:
        D0: maximum supported standard leaf
        D1: vendor or implementation identifier, low word
        D2: vendor or implementation identifier, middle word
        D3: vendor or implementation identifier, high word

    - leaf: 0x00000001
      name: BASE_PROFILE
      summary: Base Bedrock profile constants.
      outputs:
        D0: architecture revision and base profile identifier
        D1:
          bits:
            - {range: [0, 7], name: MAX_INSTRUCTION_WORDS, description: maximum architectural instruction length in 16-bit words}
            - {range: [8, 15], name: WORD_BITS, description: instruction word size in bits}
            - {range: [16, 23], name: MAX_PREFIX_WORDS, description: maximum prefix words per instruction}
            - {range: [24, 31], name: MAX_PREFIX_BYTES, description: maximum prefix bytes per instruction}
        D2: reserved, zero
        D3: reserved, zero

    - leaf: 0x00010000
      name: EXTENSION_ROOT
      summary: Optional ISA extension root.
      outputs:
        D0: maximum supported optional-extension leaf
        D1: reserved, zero
        D2: reserved, zero
        D3: reserved, zero

    - leaf: 0x00010001
      name: FLOATING_POINT_EXTENSION
      summary: Floating-point extension availability.
      outputs:
        D0:
          bits:
            - bit: 0
              name: FP_AVAILABLE
              description: >
                The base floating-point extension is available. When set, the
                implementation supports the Bedrock floating-point register
                model, FFLAGS, S and D scalar formats, floating-point moves,
                compares, arithmetic, fused multiply-add/subtract, conversion,
                classification, bounds, conditional move, and ordinary
                floating-point memory/register forms.
            - bit: 1
              name: FP_TRANSCENDENTAL_AVAILABLE
              description: >
                The floating-point transcendental operation group is available.
                This covers FSIN, FCOS, FSINCOS, FTAN, inverse trigonometric,
                hyperbolic, logarithmic, and exponential floating-point
                operations.
        D1: reserved, zero
        D2: reserved, zero
        D3: reserved, zero

    - leaf: 0x00020000
      name: IMPLEMENTATION_ROOT
      summary: Implementation-property root.
      outputs:
        D0: maximum supported implementation-property leaf
        D1: reserved, zero
        D2: reserved, zero
        D3: reserved, zero

    - leaf: 0x00020001
      name: EXECUTION_PROPERTIES
      summary: Program-visible execution properties.
      outputs:
        D0:
          bits:
            - bit: 0
              name: OUT_OF_ORDER
              description: >
                The implementation may execute independent architectural
                instruction instances out of program order while preserving the
                architectural exception and retirement model. If clear, no
                out-of-order execution property is advertised.
        D1: reserved, zero
        D2: reserved, zero
        D3: reserved, zero

mnemonic: FETCHOR
doc:
  title: Atomic Fetch Or
  summary: Performs the atomic fetch or operation.
  description: Performs the atomic fetch or operation.
  instruction_family: atomics
  instruction_class: system
behavior:
  group: atomics
  input_output:
  - memory
  - src
  operation:
  - tmp_v = memory_v;
  - memory_v = memory_v | src_v;
  - src_v = tmp_v;
attributes:
  memory_ordering:
    operand: order
    type: memory_order
    encodings:
      relaxed: 0
      acquire: 1
      release: 2
      acqrel: 3
      seqcst: 4
    reserved_encodings:
    - 5
    - 6
    - 7
    consume: treated as acquire
    description: The memory-order qualifier controls visibility ordering around the atomic read-modify-write. Relaxed 
      preserves atomicity only. Acquire orders later memory operations after the atomic operation. Release orders prior 
      memory operations before it. Acquire-release applies both directions. Sequential consistency additionally 
      participates in the global sequentially consistent order for atomic operations.
allocation:
  catalog_section: system
  layout_group: FETCH_OPS
forms:
  operands:
  - name: order
    type: memory_order
  - name: src
    type: DREG
  - name: memory
    type: EA
  size: BWLQ

mnemonic: WRFLAGS
doc:
  title: Write Flags
  summary: Write the integer condition-code flags from a D register.
  description: WRFLAGS writes the low 16 bits from the source D register into the architectural FLAGS register. Reserved
    FLAGS bits must be zero. FLAGS is not part of the S segment-register operand class.
  instruction_family: system_registers
  instruction_class: system
behavior:
  group: system_registers
  inputs:
  - src
  output: none
  operation:
  - ZF = (src_v >> 3) & 1;
  - NF = (src_v >> 2) & 1;
  - CF = (src_v >> 1) & 1;
  - VF = src_v & 1;
attributes:
  privilege: unprivileged
  flags: writes FLAGS from source low bits
allocation:
  catalog_section: system
  layout_group: FLAGS_ACCESS
forms:
  operands:
  - name: src
    type: DREG
  size: W

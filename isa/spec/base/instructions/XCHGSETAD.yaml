mnemonic: XCHGSETAD
doc:
  title: Exchange D And A Register Set
  summary: 'For each selected i: swap A[i] and D[i].'
  description: 'For each selected i: swap A[i] and D[i].'
  instruction_family: data_movement
  instruction_class: data_movement
behavior:
  group: register_set_transfer
  inputs:
  - regs
  output: none
  operation_by_form:
  - operands: [BITMAP16]
    operation:
    - arch_xchgsetad(regs_v);
  - operands: [DBANK, BITMAP16]
    operation:
    - arch_xchgsetad_bank(bank_v, regs_v);
  operation_text: >
    XCHGSETAD swaps each selected A register with the matching D register. The one-operand form exchanges A[i] with D[i]
    in the current data-register bank; the banked form exchanges A[i] with D[i] in the explicitly named DBANK. Bits 0
    through 7 select register numbers 0 through 7.
  banked_forms: Current-bank forms and forms that name DBn explicitly are part of the base register-set transfer group. 
    Implementations report the number of available data-register banks through CPUID implementation properties.
allocation:
  catalog_section: compact_primary
forms:
  operands:
  - name: regs
    type: bitmap16
  extended_forms:
  - operands:
    - name: bank
      type: DBANK
    - name: regs
      type: bitmap16
    compact: false
    extension_family: data_register_banking
  valid_bits: 0..7

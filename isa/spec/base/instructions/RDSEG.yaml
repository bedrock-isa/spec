mnemonic: RDSEG
doc:
  title: Read Segment Register
  summary: Read a segment register image into a D register.
  description: RDSEG reads one of the S-class segment registers and writes the 64-bit segment register image to the 
    destination D register. The S operand selector encoding is defined by the SREG selector table.
  instruction_family: system_registers
  instruction_class: system
behavior:
  group: system_registers
  inputs: [seg]
  output: dst
  operation:
  - dst_v = seg_v;
attributes:
  privilege: policy controlled
  flags: unchanged
allocation:
  catalog_section: system
  layout_group: SEGMENT_REGISTER_ACCESS
  encoding:
  - id: RDSEG.S_TO_D
    extension_root: EXT.system_core
    extension_root_payload: '0xf63'
    extension_family: system_core
    extended_opcode: 0x0040..0x007f
    extended_opcode_start: '0x0040'
    extended_opcode_end: '0x007f'
    extended_opcode_slots: 64
    extended_opcode_bits: 6
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: g:SREG[2:0], d:DREG[5:3]
    fields:
    - name: g
      kind: SREG
      source: seg
      storage: descriptor
      width: 3
    - name: d
      kind: DREG
      source: dst
      storage: descriptor
      width: 3
    kind: extended
forms:
  operands:
  - name: seg
    type: SREG
  - name: dst
    type: DREG
  size: Q
  note: general writes to CS are illegal; use CS-changing control transfer instructions

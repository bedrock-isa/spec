mnemonic: INC
doc:
  title: Increment
  summary: Performs the increment operation.
  description: Performs the increment operation.
  instruction_family: integer_unary
  instruction_class: integer
behavior:
  group: integer_unary
  input_output: dst
  operation:
  - result_v = dst_v + 1;
  - dst_v = result_v;
  - ZF = result_v == 0;
  - NF = result_v s< 0;
  - CF = carry(dst_old_v, 1:8);
  - VF = scarry(dst_old_v, 1:8);
attributes:
  prefix_availability:
  - SATURATE
  flags:
    Z: result == 0
    N: most_significant_bit(result)
    C: unsigned carry out
    V: signed overflow
allocation:
  catalog_section: compact_primary
  layout_group: INC_DEC
forms:
  compact_forms:
  - operands:
    - name: dst
      type: DREG
  extended_forms:
  - operands:
    - name: dst
      type: EA
    compact: false
  size: BWLQ

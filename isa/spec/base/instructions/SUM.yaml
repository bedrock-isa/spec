mnemonic: SUM
doc:
  title: Register Set Sum
  summary: Sums selected D/A registers into a register.
  description: Sums the selected D0-D7 and A0-A7 register values into a D- or A-register destination. The bitmap uses 
    the same bit numbering as PUSHM and MOVSET operations. All selected source register values are read before the 
    destination is written, so selecting the destination register includes its original value.
  instruction_family: integer_alu
  instruction_class: integer
behavior:
  group: integer_alu
  inputs:
  - regs
  input_output: dst
  operation:
  - dst_v = arch_register_set_sum(regs_v, size_v);
  operation_text: >
    SUM reads every D/A register selected by the bitmap, adds the selected values using the instruction size, and writes
    the accumulated sum to the destination register. All selected source register values are read before the destination is
    written, so selecting the destination includes its original value.
attributes:
  flags: unchanged
allocation:
  catalog_section: integer
forms:
  operands:
  - - name: regs
      type: bitmap16
    - name: dst
      type: DREG
  - - name: regs
      type: bitmap16
    - name: dst
      type: AREG
  size: BWLQ
  compact: false
  result: destination register

mnemonic: SEGLEA
doc:
  title: Segment Load Effective Address
  summary: Performs the segment load effective address operation.
  instruction_family: ea_utility
  instruction_class: data_movement
behavior:
  group: ea_utility
  inputs: [src]
  output: dst
  operation:
  - dst_v = src_v;
attributes:
  privilege: unprivileged
  flags:
    V: set when segment bounds check fails
    ZNC: unchanged
allocation:
  catalog_section: compact_primary
  encoding:
  - id: SEGLEA.EA_TO_A
    extension_root: EXT.ea_utility
    extension_root_payload: '0xf4c'
    extension_family: ea_utility
    extended_opcode: 0x0200..0x03ff
    extended_opcode_start: '0x0200'
    extended_opcode_end: '0x03ff'
    extended_opcode_slots: 512
    extended_opcode_bits: 9
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0], a:AREG[8:6]
    fields:
    - name: e
      kind: EA
      source: src
      storage: descriptor
      width: 6
    - name: a
      kind: AREG
      source: dst
      storage: descriptor
      width: 3
    kind: extended
forms:
  src_ea_set: pure_address_calculation
  operands:
  - name: src
    type: EA
  - name: dst
    type: AREG
  canonical_check: false
  page_walk: false
  no_memory_access: true
  segment_translation_only: true

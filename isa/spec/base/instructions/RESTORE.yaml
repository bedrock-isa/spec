mnemonic: RESTORE
doc:
  title: Restore Processor State
  summary: Restore processor state from a CPUID-defined save area.
  description: Restore processor state from a CPUID-defined save area. The save area uses a fixed architectural layout
    discovered through CPUID; it does not contain a per-component size table. The save-area base must be 4 KiB aligned.
    RESTORE is the matching restore operation for SAVE and may restore base architectural state as well as enabled
    extension state from the same save image. User-mode RESTORE ignores the saved STATUS image; supervisor RESTORE applies
    the normal STATUS write rules.
  instruction_family: tlb_and_context
  instruction_class: system
behavior:
  group: tlb_context
  inputs:
  - memory
  output: none
  operation:
  - arch_restore_processor_state(memory_v);
  operation_text: >
    RESTORE reads the fixed base block from the selected save-area address. It restores bank-0 D registers, A registers,
    FLAGS, and DBANK from the fixed base block; GS registers are restored only when their GS_VALID bits are set. User-mode
    RESTORE ignores the saved STATUS image, while supervisor RESTORE applies the normal STATUS write rules. Extension
    components whose state-block bitmap bits are set are restored from their CPUID-defined component offsets.
attributes:
  privilege: unprivileged
allocation:
  catalog_section: system
  layout_group: PROCESSOR_STATE_SAVE_RESTORE
  encoding:
  - id: RESTORE.EA
    extension_root: EXT.system_core
    extension_root_payload: '0xf63'
    extension_family: system_core
    extended_opcode: 0x0100..0x013f
    extended_opcode_start: '0x0100'
    extended_opcode_end: '0x013f'
    extended_opcode_slots: 64
    extended_opcode_bits: 6
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0]
    fields:
    - name: e
      kind: EA
      source: memory
      storage: descriptor
      width: 6
    kind: extended
forms:
  operands:
  - name: memory
    type: EA

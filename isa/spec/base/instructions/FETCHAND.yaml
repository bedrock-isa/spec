mnemonic: FETCHAND
doc:
  title: Atomic Fetch And
  summary: Performs the atomic fetch and operation.
  instruction_family: atomics
  instruction_class: system
behavior:
  group: atomics
  input_output:
  - memory
  - src
  operation:
  - tmp_v = memory_v;
  - memory_v = memory_v & src_v;
  - src_v = tmp_v;
attributes:
  memory_ordering:
    operand: order
    type: memory_order
    encodings:
      relaxed: 0
      acquire: 1
      release: 2
      acqrel: 3
      seqcst: 4
    reserved_encodings:
    - 5
    - 6
    - 7
    consume: treated as acquire
    description: The memory-order qualifier controls visibility ordering around the atomic read-modify-write. Relaxed 
      preserves atomicity only. Acquire orders later memory operations after the atomic operation. Release orders prior 
      memory operations before it. Acquire-release applies both directions. Sequential consistency additionally 
      participates in the global sequentially consistent order for atomic operations.
allocation:
  catalog_section: system
  layout_group: FETCH_OPS
  encoding:
  - id: FETCHAND.D_TO_EA
    extension_root: EXT.atomic_memory
    extension_root_payload: '0xf60'
    extension_family: atomic_memory
    extended_opcode: '0x0005'
    extended_opcode_start: '0x0005'
    extended_opcode_end: '0x0005'
    extended_opcode_slots: 1
    extended_opcode_bits: 0
    operand_payload_bits: 14
    operand_descriptor_words: 1
    operand_descriptor_spilled: true
    descriptor_layout: o:memory_order/3@payload, e:EA/6@payload, d:DREG/3@payload, s:BWLQ/2@payload
    fields:
    - name: s
      kind: BWLQ
      source: size
      storage: descriptor
      width: 2
    - name: o
      kind: memory_order
      source: order
      storage: payload
      width: 3
    - name: d
      kind: DREG
      source: src
      storage: descriptor
      width: 3
    - name: e
      kind: EA
      source: memory
      storage: descriptor
      width: 6
    kind: extended
forms:
  memory_operand_ea_set: addressable_memory_only
  require_memory_operand: true
  operands:
  - name: order
    type: memory_order
  - name: src
    type: DREG
  - name: memory
    type: EA
  size: BWLQ

mnemonic: PTATTR
doc:
  title: Page Table Attributes
  summary: Perform page walk and return page attributes/status.
  instruction_family: tlb_and_context
  instruction_class: system
behavior:
  group: tlb_context
  inputs:
  - src
  output: none
  operation:
  - arch_page_attributes(src_v);
attributes:
  privilege: supervisor
  flags: operation-defined status result
allocation:
  catalog_section: system
  layout_group: PAGE_QUERY
  encoding:
  - id: PTATTR.EA
    extension_root: EXT.tlb_cache
    extension_root_payload: '0xf62'
    extension_family: tlb_cache
    extended_opcode: 0x0200..0x023f
    extended_opcode_start: '0x0200'
    extended_opcode_end: '0x023f'
    extended_opcode_slots: 64
    extended_opcode_bits: 6
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0]
    fields:
    - name: e
      kind: EA
      source: src
      storage: descriptor
      width: 6
    kind: extended
forms:
  src_ea_set: pure_address_calculation
  require_address_value: true
  operands:
  - name: src
    type: linear_or_EA
  - name: outputs
    type: outputs
  performs_page_walk: true

mnemonic: RCL
doc:
  title: Rotate Through Carry Left
  summary: Performs the rotate through carry left operation.
  description: Performs the rotate through carry left operation.
  instruction_family: integer_bitfield
  instruction_class: integer
behavior:
  group: shifts_rotates
  inputs:
  - count
  input_output: dst
  operation:
  - tmp_v = count_v & 63;
  - dst_v = (dst_v << tmp_v) | (dst_v >> (64 - tmp_v));
  - ZF = dst_v == 0;
  - NF = dst_v s< 0;
  - CF = 0;
  - VF = 0;
  count_rules:
    shifts:
      zero_count: count=0 leaves the destination and FLAGS unchanged
      over_width: {}
    rotates:
      effective_count: count modulo operand width
      zero_effective_count: destination and FLAGS unchanged
    carry_rotates:
      effective_count: count modulo operand width plus carry slot
      zero_effective_count: destination and FLAGS unchanged
  flag_rules:
    Z: result == 0
    N: most significant result bit
    C: carry slot after the through-carry rotate
    V: 0
allocation:
  catalog_section: integer
  layout_group: ROTATES
forms:
  extension_family: integer_bitfield
  operands:
  - - name: count
      type: selector
    - name: dst
      type: DREG
  - - name: count
      type: selector
    - name: dst
      type: EA
  size: BWLQ
  compact: false
  encoding_fields:
  - field: o
    kind: rotate_group
    width: 2
    placement: high
    values:
    - RCL
    - RCR
    - ROL
    - ROR
    derive: mnemonic
    match:
      profile: I6_TO_EA

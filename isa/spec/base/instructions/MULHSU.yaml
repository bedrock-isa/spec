mnemonic: MULHSU
doc:
  title: Signed By Unsigned Multiply High
  summary: Performs the signed by unsigned multiply high operation.
  description: Performs the signed by unsigned multiply high operation.
  instruction_family: integer_mul_div
  instruction_class: integer
behavior:
  group: multiply_divide
  inputs:
  - src
  input_output: dst
  operation:
  - local width_v:8 = size_v << 3;
  - tmp_v = size_v;
  - carry_v = 0;
  - <mulhsu_mask_loop>
  - if (tmp_v == 0) goto <mulhsu_mask_done>;
  - carry_v = (carry_v << 8) | 0xff;
  - tmp_v = tmp_v - 1;
  - goto <mulhsu_mask_loop>;
  - <mulhsu_mask_done>
  - local lhs_v:8 = dst_v & carry_v;
  - local rhs_v:8 = src_v & carry_v;
  - borrow_v = 0x80;
  - tmp_v = size_v - 1;
  - <mulhsu_signbit_loop>
  - if (tmp_v == 0) goto <mulhsu_sign_extend>;
  - borrow_v = borrow_v << 8;
  - tmp_v = tmp_v - 1;
  - goto <mulhsu_signbit_loop>;
  - <mulhsu_sign_extend>
  - if ((lhs_v & borrow_v) == 0) goto <mulhsu_multiply>;
  - lhs_v = lhs_v | ~carry_v;
  - <mulhsu_multiply>
  - local product_v:16 = sext(lhs_v) * zext(rhs_v);
  - dst_v = product_v >> width_v;
attributes:
  repeatable: true
allocation:
  catalog_section: integer
  layout_group: MULTIPLY_HIGH
forms:
  operands:
  - - name: src
      type: EA
    - name: dst
      type: DREG
  - - name: src
      type: DREG
    - name: dst
      type: EA
  size: BWLQ
  result: high half

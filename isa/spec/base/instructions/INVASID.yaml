mnemonic: INVASID
doc:
  title: Invalidate TLB By ASID
  summary: Invalidate TLB entries for ASID.
  instruction_family: tlb_and_context
  instruction_class: system
behavior:
  group: tlb_context
  inputs:
  - asid
  output: none
  operation:
  - arch_tlb_invalidate_asid(asid_v & 0xffff);
attributes:
  privilege: supervisor
  serializing: true
allocation:
  catalog_section: system
  layout_group: TLB_INVALIDATE
  encoding:
  - id: INVASID.IMM
    extension_root: EXT.tlb_cache
    extension_root_payload: '0xf62'
    extension_family: tlb_cache
    extended_opcode: '0x0001'
    extended_opcode_start: '0x0001'
    extended_opcode_end: '0x0001'
    extended_opcode_slots: 1
    extended_opcode_bits: 0
    operand_payload_bits: 16
    operand_descriptor_words: 1
    operand_descriptor_spilled: false
    descriptor_layout: i:IMM16/16@payload
    fields:
    - name: i
      kind: IMM16
      source: asid
      storage: payload
      width: 16
    kind: extended
forms:
  operands:
  - name: asid
    type: imm16

mnemonic: SAR
doc:
  title: Shift Arithmetic Right
  summary: Performs the shift arithmetic right operation.
  instruction_family: integer_bitfield
  instruction_class: integer
behavior:
  group: shifts_rotates
  inputs:
  - count
  input_output: dst
  operation:
  - dst_v = dst_v >> count_v;
  - ZF = dst_v == 0;
  - NF = dst_v s< 0;
  - CF = 0;
  - VF = 0;
  count_rules:
    shifts:
      zero_count: count=0 leaves the destination and FLAGS unchanged
      over_width: result is sign fill; C is the original sign bit when count is greater than operand width
    rotates:
      effective_count: count modulo operand width
      zero_effective_count: destination and FLAGS unchanged
    carry_rotates:
      effective_count: count modulo operand width plus carry slot
      zero_effective_count: destination and FLAGS unchanged
  flag_rules:
    Z: result == 0
    N: most significant result bit
    C: last bit shifted out, or original sign bit for count greater than operand width
    V: 0
allocation:
  catalog_section: integer
  layout_group: SHIFTS
  encoding:
  - id: SAR.D_TO_D
    extension_root: EXT.integer_bitfield
    extension_root_payload: '0xf46'
    extension_family: integer_bitfield
    extended_opcode: 0x7200..0x72ff
    extended_opcode_start: '0x7200'
    extended_opcode_end: '0x72ff'
    extended_opcode_slots: 256

mnemonic: WRSTATUS
doc:
  title: Write Status
  summary: Write the processor STATUS register from a D register.
  description: WRSTATUS writes the low 16 bits from the source D register into the architectural STATUS register. 
    Reserved STATUS bits must be zero. STATUS is not part of the S segment-register operand class.
  instruction_family: system_registers
  instruction_class: system
behavior:
  group: system_registers
  inputs:
  - src
  output: none
  operation:
  - STATUS = src_v;
attributes:
  privilege: supervisor
  flags: unchanged
allocation:
  catalog_section: system
  layout_group: STATUS_ACCESS
forms:
  operands:
  - name: src
    type: DREG
  size: W

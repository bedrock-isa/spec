mnemonic: WRSTATUS
doc:
  title: Write Status
  summary: Write the processor STATUS register from a D register.
  description: WRSTATUS writes the low 16 bits from the source D register into the architectural STATUS register. 
    Reserved STATUS bits must be zero. STATUS is not part of the S segment-register operand class.
  instruction_family: system_registers
  instruction_class: system
behavior:
  group: system_registers
  inputs:
  - src
  output: none
  operation:
  - STATUS = src_v;
attributes:
  privilege: supervisor
  flags: unchanged
allocation:
  catalog_section: system
  layout_group: STATUS_ACCESS
  encoding:
  - id: WRSTATUS.D
    extension_root: EXT.system_core
    extension_root_payload: '0xf63'
    extension_family: system_core
    extended_opcode: 0x0028..0x002f
    extended_opcode_start: '0x0028'
    extended_opcode_end: '0x002f'
    extended_opcode_slots: 8
    extended_opcode_bits: 3
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: d:DREG[2:0]
    fields:
    - name: d
      kind: DREG
      source: src
      storage: descriptor
      width: 3
    kind: extended
forms:
  operands:
  - name: src
    type: DREG
  size: W

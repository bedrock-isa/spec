mnemonic: PREFETCH
doc:
  title: Prefetch
  summary: Hint that EA will be read soon; no architectural fault unless policy says otherwise.
  instruction_family: cache
  instruction_class: system
behavior:
  group: cache
  inputs:
  - src
  output: none
  operation:
  - arch_prefetch(src_v);
attributes:
  privilege: user allowed
allocation:
  catalog_section: system
  encoding:
  - id: PREFETCH.EA
    extension_root: EXT.cache_hint
    extension_root_payload: '0xf61'
    extension_family: cache_hint
    extended_opcode: 0x0000..0x003f
    extended_opcode_start: '0x0000'
    extended_opcode_end: '0x003f'
    extended_opcode_slots: 64
    extended_opcode_bits: 6
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0]
    fields:
    - name: e
      kind: EA
      source: src
      storage: descriptor
      width: 6
    kind: extended
forms:
  src_ea_set: memory_only
  require_memory_operand: true
  operands:
  - name: src
    type: EA

mnemonic: LRET
doc:
  title: Long Return
  summary: Pops a far return frame and atomically restores CS:PC.
  description: Long return reads the far return frame from SS:SP and commits CS and PC together. The frame contains the 
    return PC Q value at the current SP and the return CS Q value at SP+8; after both values are fetched, SP is advanced
    by 16 bytes and the control state is committed.
  instruction_family: control_flow
  instruction_class: control_flow
behavior:
  group: control_flow
  output: none
  operation:
  - local return_pc_v:8 = *:8 SP;
  - local return_cs_v:8 = *:8 (SP + 8);
  - SP = SP + 16;
  - CS = return_cs_v;
  - return [return_pc_v];
allocation:
  catalog_section: compact_primary
  encoding:
  - id: LRET
    extension_root: EXT.control_flow
    extension_root_payload: '0xf4d'
    extension_family: control_flow
    extended_opcode: '0x0040'
    extended_opcode_start: '0x0040'
    extended_opcode_end: '0x0040'
    extended_opcode_slots: 1
    extended_opcode_bits: 0
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: none
    fields: []
    kind: extended
forms:

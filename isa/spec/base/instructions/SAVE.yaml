mnemonic: SAVE
doc:
  title: Save Processor State
  summary: Save modified processor state to a CPUID-defined save area.
  description: 'Save modified processor state to a CPUID-defined save area. SAVE uses an XSAVEOPT-like policy for both base
    architectural state and enabled extension state: state components that are architecturally clean may be skipped, while
    modified components are written to their CPUID-defined fixed slots. The memory image does not carry per-component size
    records; software allocates the maximum required save area size reported by CPUID. The save-area base must be 4 KiB aligned.'
  instruction_family: tlb_and_context
  instruction_class: system
behavior:

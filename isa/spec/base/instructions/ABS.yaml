mnemonic: ABS
doc:
  title: Absolute Value
  summary: Performs the absolute value operation.
  description: Performs the absolute value operation.
  instruction_family: integer_unary
  instruction_class: integer
behavior:
  group: integer_unary
  input_output: dst
  operation:
  - if (((dst_v >> 63) & 1) == 0) goto <abs_done>;
  - dst_v = 0 - dst_v;
  - <abs_done>
  - ZF = dst_v == 0;
  - NF = dst_v s< 0;
  - CF = 0;
  - VF = 0;
attributes:
  repeatable: true
  prefix_availability:
  - SATURATE
  flags:
    Z: result == 0
    N: most_significant_bit(result)
    C: source operand is negative
    V: source operand is the most negative signed value
allocation:
  catalog_section: compact_primary
  layout_group: NEG_ABS
forms:
  compact_forms:
  - operands:
    - name: dst
      type: DREG
  extended_forms:
  - operands:
    - name: dst
      type: EA
    compact: false
  size: BWLQ

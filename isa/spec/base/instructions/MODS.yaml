mnemonic: MODS
doc:
  title: Signed Modulo
  summary: Performs the signed modulo operation.
  description: Performs the signed modulo operation.
  instruction_family: integer_mul_div
  instruction_class: integer
behavior:
  group: multiply_divide
  inputs:
  - src
  input_output: dst
  operation:
  - tmp_v = size_v;
  - carry_v = 0;
  - <mods_mask_loop>
  - if (tmp_v == 0) goto <mods_mask_done>;
  - carry_v = (carry_v << 8) | 0xff;
  - tmp_v = tmp_v - 1;
  - goto <mods_mask_loop>;
  - <mods_mask_done>
  - local lhs_v:8 = dst_v & carry_v;
  - local rhs_v:8 = src_v & carry_v;
  - borrow_v = 0x80;
  - tmp_v = size_v - 1;
  - <mods_signbit_loop>
  - if (tmp_v == 0) goto <mods_sign_extend>;
  - borrow_v = borrow_v << 8;
  - tmp_v = tmp_v - 1;
  - goto <mods_signbit_loop>;
  - <mods_sign_extend>
  - if ((lhs_v & borrow_v) == 0) goto <mods_rhs_sign>;
  - lhs_v = lhs_v | ~carry_v;
  - <mods_rhs_sign>
  - if ((rhs_v & borrow_v) == 0) goto <mods_check>;
  - rhs_v = rhs_v | ~carry_v;
  - <mods_check>
  - if (rhs_v != 0) goto <mods_execute>;
  - arch_raise_divide_by_zero();
  - goto <mod_done>;
  - <mods_execute>
  - dst_v = lhs_v s% rhs_v;
  - <mod_done>
attributes:
  repeatable: true
allocation:
  catalog_section: integer
  layout_group: DIVIDE_MOD
forms:
  operands:
  - - name: src
      type: EA
    - name: dst
      type: DREG
  - - name: src
      type: DREG
    - name: dst
      type: EA
  size: BWLQ

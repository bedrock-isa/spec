mnemonic: POPM
doc:
  title: Pop Multiple
  summary: Pop selected A7-A0 then D7-D0 registers in inverse bitmap order.
  instruction_family: data_movement
  instruction_class: data_movement
behavior:
  group: stack
  inputs:
  - regs
  output: none
  operation:
  - arch_popm(regs_v);
  operation_text: >
    For each set bit in the bitmap, POPM pops one 64-bit stack slot into the corresponding register. Registers are processed
    in inverse bitmap order, A7 through A0 followed by D7 through D0. Each selected register is loaded from SP before SP is
    incremented by 8.
allocation:
  catalog_section: compact_primary
  layout_group: PUSHM_POPM
  encoding:
  - id: POPM.BITMAP
    kind: compact
    start_payload: '0xf33'
    end_payload: '0xf33'
    slots: 1
    primary_bits: 0
    field_layout: none
    fields: []
forms:
  operands:
  - name: regs
    type: bitmap16
  bitmap:
    bits_0_7: D0-D7
    bits_8_15: A0-A7
  size_per_register: Q

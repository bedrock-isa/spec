mnemonic: POPM
doc:
  title: Pop Multiple
  summary: Pop selected A7-A0 then D7-D0 registers in inverse bitmap order.
  description: Pop selected A7-A0 then D7-D0 registers in inverse bitmap order.
  instruction_family: data_movement
  instruction_class: data_movement
behavior:
  group: stack
  inputs:
  - regs
  output: none
  operation:
  - if ((regs_v & 0x8000) == 0) goto <popm_a7_done>;
  - A7 = *:8 SP;
  - SP = SP + 8;
  - <popm_a7_done>
  - if ((regs_v & 0x4000) == 0) goto <popm_a6_done>;
  - A6 = *:8 SP;
  - SP = SP + 8;
  - <popm_a6_done>
  - if ((regs_v & 0x2000) == 0) goto <popm_a5_done>;
  - A5 = *:8 SP;
  - SP = SP + 8;
  - <popm_a5_done>
  - if ((regs_v & 0x1000) == 0) goto <popm_a4_done>;
  - A4 = *:8 SP;
  - SP = SP + 8;
  - <popm_a4_done>
  - if ((regs_v & 0x0800) == 0) goto <popm_a3_done>;
  - A3 = *:8 SP;
  - SP = SP + 8;
  - <popm_a3_done>
  - if ((regs_v & 0x0400) == 0) goto <popm_a2_done>;
  - A2 = *:8 SP;
  - SP = SP + 8;
  - <popm_a2_done>
  - if ((regs_v & 0x0200) == 0) goto <popm_a1_done>;
  - A1 = *:8 SP;
  - SP = SP + 8;
  - <popm_a1_done>
  - if ((regs_v & 0x0100) == 0) goto <popm_a0_done>;
  - A0 = *:8 SP;
  - SP = SP + 8;
  - <popm_a0_done>
  - if ((regs_v & 0x0080) == 0) goto <popm_d7_done>;
  - D7 = *:8 SP;
  - SP = SP + 8;
  - <popm_d7_done>
  - if ((regs_v & 0x0040) == 0) goto <popm_d6_done>;
  - D6 = *:8 SP;
  - SP = SP + 8;
  - <popm_d6_done>
  - if ((regs_v & 0x0020) == 0) goto <popm_d5_done>;
  - D5 = *:8 SP;
  - SP = SP + 8;
  - <popm_d5_done>
  - if ((regs_v & 0x0010) == 0) goto <popm_d4_done>;
  - D4 = *:8 SP;
  - SP = SP + 8;
  - <popm_d4_done>
  - if ((regs_v & 0x0008) == 0) goto <popm_d3_done>;
  - D3 = *:8 SP;
  - SP = SP + 8;
  - <popm_d3_done>
  - if ((regs_v & 0x0004) == 0) goto <popm_d2_done>;
  - D2 = *:8 SP;
  - SP = SP + 8;
  - <popm_d2_done>
  - if ((regs_v & 0x0002) == 0) goto <popm_d1_done>;
  - D1 = *:8 SP;
  - SP = SP + 8;
  - <popm_d1_done>
  - if ((regs_v & 0x0001) == 0) goto <popm_d0_done>;
  - D0 = *:8 SP;
  - SP = SP + 8;
  - <popm_d0_done>
allocation:
  catalog_section: compact_primary
  layout_group: PUSHM_POPM
forms:
  operands:
  - name: regs
    type: bitmap16
  bitmap:
    bits_0_7: D0-D7
    bits_8_15: A0-A7
  size_per_register: Q

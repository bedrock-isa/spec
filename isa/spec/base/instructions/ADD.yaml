mnemonic: ADD
doc:
  title: Add
  summary: Adds the source operand to the destination operand.
  instruction_family: integer_alu
  instruction_class: integer
behavior:
  group: integer_alu
  inputs:
  - src
  input_output: dst
  operation:
  - result_v = dst_v + src_v;
  - dst_v = result_v;
  - ZF = result_v == 0;
  - NF = result_v s< 0;
  - CF = carry(dst_old_v, src_v);
  - VF = scarry(dst_old_v, src_v);
attributes:
  privilege: unprivileged
  streaming_candidate: true
  prefix_availability:
  - SATURATE
  flags:
    Z: result == 0
    N: most_significant_bit(result)
    C: unsigned carry out
    V: signed overflow

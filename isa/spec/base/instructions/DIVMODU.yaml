mnemonic: DIVMODU
doc:
  title: Unsigned Divide With Remainder
  summary: Performs the unsigned divide with remainder operation.
  description: Performs the unsigned divide with remainder operation. The quotient register Dn(q) supplies the dividend 
    before the operation, then receives the quotient. The remainder register Dn(r) receives the remainder.
  instruction_family: integer_mul_div
  instruction_class: integer
behavior:
  group: multiply_divide
  inputs:
  - src
  input_output: quotient
  output: remainder
  operation:
  - tmp_v = arch_unsigned_modulo(quotient_v, src_v, size_v);
  - quotient_v = arch_unsigned_divide(quotient_v, src_v, size_v);
  - remainder_v = tmp_v;
allocation:
  catalog_section: integer
  layout_group: DIVMOD
forms:
  operands:
  - name: src
    type: EA
  - name: quotient
    type: DREG
  - name: remainder
    type: DREG
  size: BWLQ

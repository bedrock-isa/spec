mnemonic: DIVMODU
doc:
  title: Unsigned Divide With Remainder
  summary: Performs the unsigned divide with remainder operation.
  description: Performs the unsigned divide with remainder operation. The quotient register Dn(q) supplies the dividend 
    before the operation, then receives the quotient. The remainder register Dn(r) receives the remainder.
  instruction_family: integer_mul_div
  instruction_class: integer
behavior:
  group: multiply_divide
  inputs:
  - src
  input_output: quotient
  output: remainder
  operation:
  - tmp_v = arch_unsigned_modulo(quotient_v, src_v, size_v);
  - quotient_v = arch_unsigned_divide(quotient_v, src_v, size_v);
  - remainder_v = tmp_v;
allocation:
  catalog_section: integer
  layout_group: DIVMOD
  encoding:
  - id: DIVMODU.EA_TO_D_TO_D
    extension_root: EXT.integer_mul_div
    extension_root_payload: '0xf44'
    extension_family: integer_mul_div
    extended_opcode: 0x4000..0x7fff
    extended_opcode_start: '0x4000'
    extended_opcode_end: '0x7fff'
    extended_opcode_slots: 16384
    extended_opcode_bits: 14
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0], d:DREG[8:6], D:DREG[11:9], s:BWLQ[13:12]
    fields:
    - name: s
      kind: BWLQ
      source: size
      storage: descriptor
      width: 2
    - name: e
      kind: EA
      source: src
      storage: descriptor
      width: 6
    - name: d
      kind: DREG
      source: quotient
      storage: descriptor
      width: 3
    - name: d
      kind: DREG
      source: remainder
      storage: descriptor
      width: 3
    kind: extended
forms:
  operands:
  - name: src
    type: EA
  - name: quotient
    type: DREG
  - name: remainder
    type: DREG
  size: BWLQ

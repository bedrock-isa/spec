mnemonic: XCHGSETDA
doc:
  title: Exchange A And D Register Set
  summary: 'For each selected i: swap D[i] and A[i].'
  description: 'For each selected i: swap D[i] and A[i].'
  instruction_family: data_movement
  instruction_class: data_movement
behavior:
  group: register_set_transfer
  inputs:
  - regs
  output: none
  operation_by_form:
  - operands: [BITMAP16]
    operation:
    - if ((regs_v & 0x01) == 0) goto <xchgsetda_d0_done>;
    - tmp_v = D0;
    - D0 = A0;
    - A0 = tmp_v;
    - <xchgsetda_d0_done>
    - if ((regs_v & 0x02) == 0) goto <xchgsetda_d1_done>;
    - tmp_v = D1;
    - D1 = A1;
    - A1 = tmp_v;
    - <xchgsetda_d1_done>
    - if ((regs_v & 0x04) == 0) goto <xchgsetda_d2_done>;
    - tmp_v = D2;
    - D2 = A2;
    - A2 = tmp_v;
    - <xchgsetda_d2_done>
    - if ((regs_v & 0x08) == 0) goto <xchgsetda_d3_done>;
    - tmp_v = D3;
    - D3 = A3;
    - A3 = tmp_v;
    - <xchgsetda_d3_done>
    - if ((regs_v & 0x10) == 0) goto <xchgsetda_d4_done>;
    - tmp_v = D4;
    - D4 = A4;
    - A4 = tmp_v;
    - <xchgsetda_d4_done>
    - if ((regs_v & 0x20) == 0) goto <xchgsetda_d5_done>;
    - tmp_v = D5;
    - D5 = A5;
    - A5 = tmp_v;
    - <xchgsetda_d5_done>
    - if ((regs_v & 0x40) == 0) goto <xchgsetda_d6_done>;
    - tmp_v = D6;
    - D6 = A6;
    - A6 = tmp_v;
    - <xchgsetda_d6_done>
    - if ((regs_v & 0x80) == 0) goto <xchgsetda_d7_done>;
    - tmp_v = D7;
    - D7 = A7;
    - A7 = tmp_v;
    - <xchgsetda_d7_done>
  - operands: [DBANK, BITMAP16]
    operation:
    - if ((regs_v & 0x01) == 0) goto <xchgsetda_b0_done>;
    - tmp_v = arch_dbank_read(bank_v & 0xf, 0:8);
    - arch_dbank_write(bank_v & 0xf, 0:8, A0);
    - A0 = tmp_v;
    - <xchgsetda_b0_done>
    - if ((regs_v & 0x02) == 0) goto <xchgsetda_b1_done>;
    - tmp_v = arch_dbank_read(bank_v & 0xf, 1:8);
    - arch_dbank_write(bank_v & 0xf, 1:8, A1);
    - A1 = tmp_v;
    - <xchgsetda_b1_done>
    - if ((regs_v & 0x04) == 0) goto <xchgsetda_b2_done>;
    - tmp_v = arch_dbank_read(bank_v & 0xf, 2:8);
    - arch_dbank_write(bank_v & 0xf, 2:8, A2);
    - A2 = tmp_v;
    - <xchgsetda_b2_done>
    - if ((regs_v & 0x08) == 0) goto <xchgsetda_b3_done>;
    - tmp_v = arch_dbank_read(bank_v & 0xf, 3:8);
    - arch_dbank_write(bank_v & 0xf, 3:8, A3);
    - A3 = tmp_v;
    - <xchgsetda_b3_done>
    - if ((regs_v & 0x10) == 0) goto <xchgsetda_b4_done>;
    - tmp_v = arch_dbank_read(bank_v & 0xf, 4:8);
    - arch_dbank_write(bank_v & 0xf, 4:8, A4);
    - A4 = tmp_v;
    - <xchgsetda_b4_done>
    - if ((regs_v & 0x20) == 0) goto <xchgsetda_b5_done>;
    - tmp_v = arch_dbank_read(bank_v & 0xf, 5:8);
    - arch_dbank_write(bank_v & 0xf, 5:8, A5);
    - A5 = tmp_v;
    - <xchgsetda_b5_done>
    - if ((regs_v & 0x40) == 0) goto <xchgsetda_b6_done>;
    - tmp_v = arch_dbank_read(bank_v & 0xf, 6:8);
    - arch_dbank_write(bank_v & 0xf, 6:8, A6);
    - A6 = tmp_v;
    - <xchgsetda_b6_done>
    - if ((regs_v & 0x80) == 0) goto <xchgsetda_b7_done>;
    - tmp_v = arch_dbank_read(bank_v & 0xf, 7:8);
    - arch_dbank_write(bank_v & 0xf, 7:8, A7);
    - A7 = tmp_v;
    - <xchgsetda_b7_done>
  banked_forms: Current-bank forms and forms that name DBn explicitly are part of the base register-set transfer group. 
    Implementations report the number of available data-register banks through CPUID implementation properties.
allocation:
  catalog_section: compact_primary
forms:
  operands:
  - name: regs
    type: bitmap16
  extended_forms:
  - operands:
    - name: bank
      type: DBANK
    - name: regs
      type: bitmap16
    compact: false
    extension_family: data_register_banking
  valid_bits: 0..7

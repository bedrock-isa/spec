mnemonic: TESTCANON
doc:
  title: Test Canonical Address
  summary: Compute address and set V if noncanonical; do not read memory.
  instruction_family: ea_utility
  instruction_class: data_movement
behavior:
  group: ea_utility
  inputs: [src]
  output: none
  operation:
  - ZF = src_v == 0;
  - NF = src_v s< 0;
  - CF = 0;
  - VF = 0;
attributes:
  privilege: unprivileged
  flags:
    V: set when the address is noncanonical
    ZNC: unchanged
allocation:
  catalog_section: compact_primary
  encoding:
  - id: TESTCANON.EA
    extension_root: EXT.ea_utility
    extension_root_payload: '0xf4c'
    extension_family: ea_utility
    extended_opcode: 0x0400..0x043f
    extended_opcode_start: '0x0400'
    extended_opcode_end: '0x043f'
    extended_opcode_slots: 64
    extended_opcode_bits: 6
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0]
    fields:
    - name: e
      kind: EA
      source: src
      storage: descriptor
      width: 6
    kind: extended
forms:
  src_ea_set: pure_address_calculation
  operands:
  - name: src
    type: EA
  no_memory_access: true

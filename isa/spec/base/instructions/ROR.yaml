mnemonic: ROR
doc:
  title: Rotate Right
  summary: Performs the rotate right operation.
  instruction_family: integer_bitfield
  instruction_class: integer
behavior:
  group: shifts_rotates
  inputs:
  - count
  input_output: dst
  operation:
  - tmp_v = count_v & 63;
  - dst_v = (dst_v >> tmp_v) | (dst_v << (64 - tmp_v));
  - ZF = dst_v == 0;
  - NF = dst_v s< 0;
  - CF = 0;
  - VF = 0;
  count_rules:
    shifts:
      zero_count: count=0 leaves the destination and FLAGS unchanged
      over_width: {}
    rotates:
      effective_count: count modulo operand width
      zero_effective_count: destination and FLAGS unchanged
    carry_rotates:
      effective_count: count modulo operand width plus carry slot
      zero_effective_count: destination and FLAGS unchanged
  flag_rules:
    Z: result == 0
    N: most significant result bit
    C: most significant result bit
    V: 0
attributes:
  privilege: unprivileged
allocation:
  catalog_section: integer
  layout_group: ROTATES
  encoding:
  - id: ROR.D_TO_D
    extension_root: EXT.integer_bitfield
    extension_root_payload: '0xf46'
    extension_family: integer_bitfield
    extended_opcode: 0x7100..0x71ff
    extended_opcode_start: '0x7100'
    extended_opcode_end: '0x71ff'
    extended_opcode_slots: 256
    extended_opcode_bits: 8
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: n:DREG[2:0], d:DREG[5:3], s:BWLQ[7:6]
    fields:
    - name: s
      kind: BWLQ
      source: size
      storage: descriptor
      width: 2
    - name: n
      kind: DREG
      source: count
      storage: descriptor
      width: 3
    - name: d
      kind: DREG
      source: dst
      storage: descriptor
      width: 3
    kind: extended
  - id: ROR.D_TO_EA
    extension_root: EXT.integer_bitfield
    extension_root_payload: '0xf46'
    extension_family: integer_bitfield
    extended_opcode: 0x8000..0x87ff
    extended_opcode_start: '0x8000'
    extended_opcode_end: '0x87ff'
    extended_opcode_slots: 2048
    extended_opcode_bits: 11
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0], n:DREG[8:6], s:BWLQ[10:9]
    fields:
    - name: s
      kind: BWLQ
      source: size
      storage: descriptor
      width: 2
    - name: n
      kind: DREG
      source: count
      storage: descriptor
      width: 3
    - name: e
      kind: EA
      source: dst
      storage: descriptor
      width: 6
    kind: extended
  - id: ROR.I6_TO_EA
    extension_root: EXT.integer_bitfield_rotate_imm
    extension_root_payload: '0xf48'
    extension_family: integer_bitfield_rotate_imm
    extended_opcode: 0xc000..0xffff
    extended_opcode_start: '0xc000'
    extended_opcode_end: '0xffff'
    extended_opcode_slots: 16384
    extended_opcode_bits: 14
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0], n:selector6[11:6], s:BWLQ[13:12], o:rotate_group=ROR[15:14]
    fields:
    - name: s
      kind: BWLQ
      source: size
      storage: descriptor
      width: 2
    - name: o
      kind: rotate_group
      source: semantic
      storage: descriptor
      width: 2
      value: 3
      value_label: ROR
      placement: high
    - name: n

      source: count
      storage: descriptor
      width: 6
    - name: e
      kind: EA
      source: dst
      storage: descriptor
      width: 6
    kind: extended
forms:
  extension_family: integer_bitfield
  operands:
  - - name: count
      type: selector
    - name: dst
      type: DREG
  - - name: count
      type: selector
    - name: dst
      type: EA
  size: BWLQ
  compact: false
  encoding_fields:

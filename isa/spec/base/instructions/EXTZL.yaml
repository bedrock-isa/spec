mnemonic: EXTZL
doc:
  title: Zero Extend To Long
  summary: Performs the zero extend to long operation.
  description: Zero-extends the source operand from the instruction size to long size. The low source-size bytes of the
    source are copied into the destination, and the remaining high destination bits are filled with zero.
  instruction_family: integer_unary
  instruction_class: integer
behavior:
  group: integer_extend
  inputs: [src]
  output: dst
  operation:
  - dst_v = arch_zero_extend(src_v, size_v, 4);
  destination_size: L
  repeat_observed_value: result_value
  repflags: flags_logic_observed_value
attributes:
  streaming_candidate: true
allocation:
  catalog_section: compact_primary
  layout_group: EXTEND_TO_L
forms:
  dst_ea_set: store_destination
  compact_forms:
  - operands:
    - name: src
      type: DREG
    - name: dst
      type: DREG
  extended_forms:
  - operands:
    - name: src
      type: EA
    - name: dst
      type: DREG
    compact: false
  - operands:
    - name: src
      type: DREG
    - name: dst
      type: EA
    compact: false
  - operands:
    - name: src
      type: EA
    - name: dst
      type: EA
    compact: false
    memory_memory: true
  source_size:
  - B
  - W
  access_width:
    src: source_size
    dst: destination_size

mnemonic: POPCNT
doc:
  title: Population Count
  summary: Performs the population count operation.
  instruction_family: integer_bitfield
  instruction_class: integer
behavior:
  group: bit_counts
  inputs:
  - src
  input_output: dst
  operation:
  - tmp_v = src_v;
  - if (size_v == 8) goto <popcnt_mask_done>;
  - if (size_v != 4) goto <popcnt_not_l>;
  - tmp_v = tmp_v & 0xffffffff;
  - goto <popcnt_mask_done>;
  - <popcnt_not_l>
  - if (size_v != 2) goto <popcnt_b>;
  - tmp_v = tmp_v & 0xffff;
  - goto <popcnt_mask_done>;
  - <popcnt_b>
  - tmp_v = tmp_v & 0xff;
  - <popcnt_mask_done>
  - dst_v = popcount(tmp_v);
attributes:
  flags: unchanged
allocation:
  catalog_section: integer
  layout_group: BIT_COUNTS
  encoding:
  - id: POPCNT.EA_TO_D
    extension_root: EXT.integer_bitfield
    extension_root_payload: '0xf46'
    extension_family: integer_bitfield
    extended_opcode: 0x4800..0x4fff
    extended_opcode_start: '0x4800'
    extended_opcode_end: '0x4fff'
    extended_opcode_slots: 2048
    extended_opcode_bits: 11
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0], d:DREG[8:6], s:BWLQ[10:9]
    fields:
    - name: s
      kind: BWLQ
      source: size
      storage: descriptor
      width: 2
    - name: e
      kind: EA
      source: src
      storage: descriptor
      width: 6
    - name: d
      kind: DREG
      source: dst
      storage: descriptor
      width: 3
    kind: extended
forms:
  operands:
  - name: src
    type: EA
  - name: dst
    type: DREG
  size: BWLQ
  zero_input: returns 0

mnemonic: TRAPcc
doc:
  title: Trap Conditional
  summary: Raises architectural TRAP vector 0x05 when the encoded condition is true.
  instruction_family: control_flow
  instruction_class: control_flow
behavior:
  group: control_flow
  inputs:
  - cc
  output: none
  operation:
  - if (cc_v == 0) goto <trapcc_done>;
  - arch_raise_trap(5:8);
  - <trapcc_done>
allocation:
  catalog_section: compact_primary
  encoding:
  - id: TRAPcc
    extension_root: EXT.conditional_control.cc
    extension_root_payload: 0xf50..0xf5f
    extension_family: conditional_control
    extended_opcode: '0x0900'
    extended_opcode_start: '0x0900'
    extended_opcode_end: '0x0900'
    extended_opcode_slots: 1
    extended_opcode_bits: 0
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: c:condition/4@root
    fields:
    - name: c
      kind: condition
      source: cc
      storage: descriptor
      width: 4
    kind: extended
forms:
  operands:
  - name: cc
    type: condition
  reads: FLAGS
  vector: 5

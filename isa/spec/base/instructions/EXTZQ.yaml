mnemonic: EXTZQ
doc:
  title: Zero Extend To Quad
  summary: Performs the zero extend to quad operation.
  description: Zero-extends the source operand from the instruction size to quad size. The low source-size bytes of the
    source are copied into the destination, and the remaining high destination bits are filled with zero.
  instruction_family: integer_unary
  instruction_class: integer
behavior:
  group: integer_extend
  inputs: [src]
  output: dst
  operation:
  - dst_v = arch_zero_extend(src_v, size_v, 8);
  destination_size: Q
  repeat_observed_value: result_value
  repflags: flags_logic_observed_value

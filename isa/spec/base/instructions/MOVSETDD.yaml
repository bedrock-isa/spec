mnemonic: MOVSETDD
doc:
  title: Move D Register Set Between Banks
  summary: Copies selected D registers from one data-register bank to another.
  description: Copies selected D registers from the source DBANK to the destination DBANK according to the bitmap 
    operand. The current DBANK selector is not changed.
  instruction_family: data_register_banking
  instruction_class: data_movement
behavior:
  group: data_register_banking
  inputs:
  - dst_bank
  - src_bank
  - regs
  output: none
  operation:
  - if ((regs_v & 0x01) == 0) goto <movsetdd_d0_done>;
  - tmp_v = arch_dbank_read(src_bank_v & 0xf, 0:8);
  - arch_dbank_write(dst_bank_v & 0xf, 0:8, tmp_v);
  - <movsetdd_d0_done>
  - if ((regs_v & 0x02) == 0) goto <movsetdd_d1_done>;
  - tmp_v = arch_dbank_read(src_bank_v & 0xf, 1:8);
  - arch_dbank_write(dst_bank_v & 0xf, 1:8, tmp_v);
  - <movsetdd_d1_done>
  - if ((regs_v & 0x04) == 0) goto <movsetdd_d2_done>;
  - tmp_v = arch_dbank_read(src_bank_v & 0xf, 2:8);
  - arch_dbank_write(dst_bank_v & 0xf, 2:8, tmp_v);
  - <movsetdd_d2_done>
  - if ((regs_v & 0x08) == 0) goto <movsetdd_d3_done>;
  - tmp_v = arch_dbank_read(src_bank_v & 0xf, 3:8);
  - arch_dbank_write(dst_bank_v & 0xf, 3:8, tmp_v);
  - <movsetdd_d3_done>
  - if ((regs_v & 0x10) == 0) goto <movsetdd_d4_done>;
  - tmp_v = arch_dbank_read(src_bank_v & 0xf, 4:8);
  - arch_dbank_write(dst_bank_v & 0xf, 4:8, tmp_v);
  - <movsetdd_d4_done>
  - if ((regs_v & 0x20) == 0) goto <movsetdd_d5_done>;
  - tmp_v = arch_dbank_read(src_bank_v & 0xf, 5:8);
  - arch_dbank_write(dst_bank_v & 0xf, 5:8, tmp_v);
  - <movsetdd_d5_done>
  - if ((regs_v & 0x40) == 0) goto <movsetdd_d6_done>;
  - tmp_v = arch_dbank_read(src_bank_v & 0xf, 6:8);
  - arch_dbank_write(dst_bank_v & 0xf, 6:8, tmp_v);
  - <movsetdd_d6_done>
  - if ((regs_v & 0x80) == 0) goto <movsetdd_d7_done>;
  - tmp_v = arch_dbank_read(src_bank_v & 0xf, 7:8);
  - arch_dbank_write(dst_bank_v & 0xf, 7:8, tmp_v);
  - <movsetdd_d7_done>
allocation:
  catalog_section: integer
  layout_group: DATA_BANK_SET_COPY
forms:
  operands:
  - name: dst_bank
    type: DBANK
  - name: src_bank
    type: DBANK
  - name: regs
    type: bitmap16
  compact: false
  extension_family: data_register_banking
  valid_bits: 0..7

mnemonic: PARITY
doc:
  title: Parity Test
  summary: Computes operand parity and writes the predicate to FLAGS.Z.
  description: Computes the parity of the selected operand size and writes the parity bit directly to FLAGS.Z. Z is set 
    to popcount(src) & 1, so Z=1 indicates odd parity and Z=0 indicates even parity. No integer destination register is 
    written. N, C, and V are unchanged.
  instruction_family: integer_bitfield
  instruction_class: integer
behavior:
  group: bit_counts
  inputs:
  - src
  output: none
  operation:
  - tmp_v = src_v;
  - if (size_v == 8) goto <parity_mask_done>;
  - if (size_v != 4) goto <parity_not_l>;
  - tmp_v = tmp_v & 0xffffffff;
  - goto <parity_mask_done>;
  - <parity_not_l>
  - if (size_v != 2) goto <parity_b>;
  - tmp_v = tmp_v & 0xffff;
  - goto <parity_mask_done>;
  - <parity_b>
  - tmp_v = tmp_v & 0xff;
  - <parity_mask_done>
  - result_v = popcount(tmp_v);
  - ZF = result_v & 1;
attributes:
  flags:
    Z: population_count(src) & 1
    N: unchanged
    C: unchanged
    V: unchanged
allocation:
  catalog_section: integer
  encoding:
  - id: PARITY.EA
    extension_root: EXT.integer_bitfield
    extension_root_payload: '0xf46'
    extension_family: integer_bitfield
    extended_opcode: 0x0400..0x04ff
    extended_opcode_start: '0x0400'
    extended_opcode_end: '0x04ff'
    extended_opcode_slots: 256
    extended_opcode_bits: 8
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0], s:BWLQ[7:6]
    fields:
    - name: s
      kind: BWLQ
      source: size
      storage: descriptor
      width: 2
    - name: e
      kind: EA
      source: src
      storage: descriptor
      width: 6
    kind: extended
forms:
  operands:
  - name: src
    type: EA
  size: BWLQ
  compact: false
  extension_family: integer_bitfield
  result: FLAGS.Z = popcount(src) & 1

mnemonic: BSET
doc:
  title: Bit Set
  summary: Performs the bit set operation.
  instruction_family: integer_bitfield
  instruction_class: integer
behavior:
  group: bit_ops
  inputs:
  - bit_index
  input_output: dst
  operation:
  - tmp_v = 1 << (bit_index_v & 63);
  - dst_v = dst_v | tmp_v;
  - ZF = dst_v == 0;
  - NF = dst_v s< 0;
  - CF = 0;
  - VF = 0;

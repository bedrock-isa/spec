mnemonic: WRCR
doc:
  title: Write Control Register
  summary: Write a privileged control register from a D register.
  description: Write a privileged control register from a D register. WRCR is always a supervisor-only instruction; 
    user-visible control state must use dedicated instructions gated by control-register policy bits.
  instruction_family: system_registers
  instruction_class: system
behavior:
  group: system_registers
  inputs:
  - src
  - cr
  output: none
  control_register_access:
    selector: cr
    write: src
attributes:
  privilege: supervisor
  flags: unchanged
allocation:
  catalog_section: system
  layout_group: CONTROL_REGISTER_ACCESS
  encoding:
  - id: WRCR.D
    extension_root: EXT.system_core
    extension_root_payload: '0xf63'
    extension_family: system_core
    extended_opcode: 0x0008..0x000f
    extended_opcode_start: '0x0008'
    extended_opcode_end: '0x000f'
    extended_opcode_slots: 8
    extended_opcode_bits: 3
    operand_payload_bits: 16
    operand_descriptor_words: 1
    operand_descriptor_spilled: false
    descriptor_layout: d:DREG[2:0], i:CR/16@payload
    fields:
    - name: d
      kind: DREG
      source: src
      storage: descriptor
      width: 3
    - name: i
      kind: CR
      source: cr
      storage: payload
      width: 16
    kind: extended
forms:
  operands:
  - name: src
    type: DREG
  - name: cr
    type: CR

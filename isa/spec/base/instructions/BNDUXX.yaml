mnemonic: BNDUXX
doc:
  title: Unsigned Bounds Check Exclusive-Exclusive
  summary: Checks unsigned value membership in the exclusive-exclusive interval (lo, hi).
  description: BNDUXX treats both bounds as exclusive. It sets V when unsigned(value) is outside (unsigned(lo), 
    unsigned(hi)); Z, N, and C are unchanged.
  instruction_family: bounds
  instruction_class: integer
behavior:
  group: bounds
  inputs:
  - hi
  - lo
  - value
  output: none
  operation:
  - ZF = 0;
  - NF = 0;
  - CF = 0;
  - VF = 0;
  - if (value_v <= lo_v) goto <bnduxx_bad>;
  - if (value_v >= hi_v) goto <bnduxx_bad>;
  - goto <bnduxx_done>;
  - <bnduxx_bad>
  - VF = 1;
  - <bnduxx_done>
  interval: (lo, hi)
  signedness: unsigned
  bounds_mode: XX
attributes:
  repeatable: true
allocation:
  catalog_section: integer
  layout_group: BOUNDS_UNSIGNED
forms:
  extension_family: integer_bounds_unsigned
  operands:
  - name: lo
    type: DREG
  - name: value
    type: EA
  - name: hi
    type: DREG
  size: BWLQ

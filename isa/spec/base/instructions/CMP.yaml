mnemonic: CMP
doc:
  title: Compare
  summary: Computes a comparison result and updates condition codes without storing the temporary value.
  instruction_family: integer_alu
  instruction_class: integer
behavior:
  group: integer_compare
  inputs:
  - dst
  - src
  output: none
  operation:
  - result_v = dst_v - src_v;
  - ZF = result_v == 0;
  - NF = result_v s< 0;
  - CF = dst_v < src_v;
  - VF = sborrow(dst_v, src_v);
  repeat_observed_value: rhs_minus_lhs
  repflags: flags_sub_rhs_lhs
attributes:
  privilege: unprivileged
  streaming_candidate: true
  flags:
    Z: result == 0
    N: most_significant_bit(result)
    C: unsigned borrow
    V: signed overflow

mnemonic: NOT
doc:
  title: Bitwise Not
  summary: Performs the bitwise not operation.
  instruction_family: integer_unary
  instruction_class: integer
behavior:
  group: integer_unary
  input_output: dst
  operation:
  - dst_v = ~dst_v;
  - ZF = dst_v == 0;
  - NF = dst_v s< 0;
  - CF = 0;
  - VF = 0;

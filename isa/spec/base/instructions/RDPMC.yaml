mnemonic: RDPMC
doc:
  title: Read Performance Counter
  summary: Performs the read performance counter operation.
  instruction_family: system_registers
  instruction_class: system
behavior:
  group: system_registers
  output: dst
  operation:
  - dst_v = PMC;
attributes:
  privilege: configurable
  flags: unchanged
allocation:
  catalog_section: system
  encoding:
  - id: RDPMC.IMM_TO_D
    extension_root: EXT.system_core
    extension_root_payload: '0xf63'
    extension_family: system_core
    extended_opcode: 0x0140..0x0147
    extended_opcode_start: '0x0140'
    extended_opcode_end: '0x0147'
    extended_opcode_slots: 8
    extended_opcode_bits: 3
    operand_payload_bits: 16
    operand_descriptor_words: 1
    operand_descriptor_spilled: false
    descriptor_layout: d:DREG[2:0], i:IMM16/16@payload
    fields:
    - name: i
      kind: IMM16
      source: counter_id
      storage: payload
      width: 16
    - name: d
      kind: DREG
      source: dst
      storage: descriptor
      width: 3
    kind: extended
forms:
  operands:
  - name: counter_id
    type: imm16
  - name: dst
    type: DREG

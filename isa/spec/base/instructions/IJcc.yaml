    extended_opcode_slots: 8192
    extended_opcode_bits: 13
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0], d:DREG[8:6], D:DREG[11:9], z:LQ[12], c:condition/4@root

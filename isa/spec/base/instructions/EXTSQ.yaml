mnemonic: EXTSQ
doc:
  title: Sign Extend To Quad
  summary: Performs the sign extend to quad operation.
  description: Sign-extends the source operand from the instruction size to quad size. The low source-size bytes of
    the source are copied into the destination, and the remaining high destination bits are filled with the source sign
    bit.
  instruction_family: integer_unary
  instruction_class: integer
behavior:
  group: integer_extend
  inputs: [src]
  output: dst
  operation:
  - dst_v = arch_sign_extend(src_v, size_v, 8);
  destination_size: Q
  repeat_observed_value: result_value
  repflags: flags_logic_observed_value

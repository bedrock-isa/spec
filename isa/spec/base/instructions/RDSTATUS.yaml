mnemonic: RDSTATUS
doc:
  title: Read Status
  summary: Read the processor STATUS register into a D register.
  description: RDSTATUS reads the architectural 16-bit STATUS register, zero-extends it to 64 bits, and writes the
    result to the destination D register. Reading STATUS is unprivileged; writing STATUS remains supervisor-only. STATUS
    is not part of the S segment-register operand class.
  instruction_family: system_registers
  instruction_class: system
behavior:
  group: system_registers
  output: dst
  operation:
  - dst_v = STATUS;
attributes:
  privilege: unprivileged
  flags: unchanged
allocation:
  catalog_section: system
  layout_group: STATUS_ACCESS
  encoding:
  - id: RDSTATUS.D
    extension_root: EXT.system_core
    extension_root_payload: '0xf63'
    extension_family: system_core
    extended_opcode: 0x0020..0x0027
    extended_opcode_start: '0x0020'
    extended_opcode_end: '0x0027'
    extended_opcode_slots: 8
    extended_opcode_bits: 3
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: d:DREG[2:0]
    fields:
    - name: d
      kind: DREG
      source: dst
      storage: descriptor
      width: 3
    kind: extended
forms:
  operands:
  - name: dst
    type: DREG
  size: W

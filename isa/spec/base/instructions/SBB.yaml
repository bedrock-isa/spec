mnemonic: SBB
doc:
  title: Subtract With Borrow
  summary: Performs the subtract with borrow operation.
  instruction_family: integer_alu
  instruction_class: integer
behavior:
  group: integer_carry_alu
  inputs:
  - src
  input_output: dst
  operation:
  - borrow_v = CF;
  - tmp_v = dst_v - src_v;
  - result_v = tmp_v - borrow_v;
  - dst_v = result_v;
  - ZF = result_v == 0;
  - NF = result_v s< 0;
  - CF = (dst_old_v < src_v) || (tmp_v < borrow_v);
  - VF = sborrow(dst_old_v, src_v) || sborrow(tmp_v, borrow_v);
attributes:
  prefix_availability:
  - SATURATE
  flags:
    Z: result == 0
    N: most_significant_bit(result)
    C: unsigned borrow
    V: signed overflow
allocation:
  catalog_section: integer
  layout_group: ADC_SBB
forms:
  dst_ea_set: store_destination
  operands:
  - - name: src
      type: EA
    - name: dst
      type: DREG
  - - name: src
      type: DREG
    - name: dst
      type: EA
  - - name: imm
      type: IMM_EA
    - name: dst
      type: EA
  size: BWLQ
  compact: false
  reads: C

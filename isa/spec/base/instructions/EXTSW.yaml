mnemonic: EXTSW
doc:
  title: Sign Extend To Word
  summary: Performs the sign extend to word operation.
  description: Sign-extends the source operand from byte size to word size. The low byte of the source is copied into
    the destination, and the remaining high destination bits are filled with the source sign bit.
  instruction_family: integer_unary
  instruction_class: integer
behavior:
  group: integer_extend
  inputs: [src]
  output: dst
  operation:
  - dst_v = arch_sign_extend(src_v, size_v, 2);
  destination_size: W
  repeat_observed_value: result_value
  repflags: flags_logic_observed_value
attributes:
  streaming_candidate: true
allocation:
  catalog_section: compact_primary
  layout_group: EXTEND_TO_W_SIGNED
forms:
  dst_ea_set: store_destination
  compact_forms:
  - operands:
    - name: src
      type: DREG
    - name: dst
      type: DREG
  extended_forms:
  - operands:
    - name: src
      type: EA
    - name: dst
      type: DREG
    compact: false
  - operands:
    - name: src
      type: DREG
    - name: dst
      type: EA
    compact: false
  - operands:
    - name: src
      type: EA
    - name: dst
      type: EA
    compact: false
    memory_memory: true
  source_size:
  - B
  access_width:
    src: source_size
    dst: destination_size

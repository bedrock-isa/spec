mnemonic: BNDSII
doc:
  title: Signed Bounds Check Inclusive-Inclusive
  summary: Checks signed value membership in the inclusive-inclusive interval [lo, hi].
  description: BNDSII treats both bounds as inclusive. It sets V when signed(value) is outside [signed(lo), signed(hi)];
    Z, N, and C are unchanged.
  instruction_family: bounds
  instruction_class: integer
behavior:
  group: bounds
  inputs:
  - hi
  - lo
  - value
  output: none
  operation:
  - ZF = 0;
  - NF = 0;
  - CF = 0;
  - VF = 0;
  - if (value_v < lo_v) goto <bnduii_bad>;
  - if (value_v > hi_v) goto <bnduii_bad>;
  - goto <bnduii_done>;
  - <bnduii_bad>
  - VF = 1;
  - <bnduii_done>
  interval: '[lo, hi]'
  signedness: signed
  bounds_mode: II
allocation:
  catalog_section: integer
  layout_group: BOUNDS_SIGNED
  encoding:
  - id: BNDSII.D_TO_EA_TO_D
    extension_root: EXT.integer_bounds_signed
    extension_root_payload: '0xf42'
    extension_family: integer_bounds_signed
    extended_opcode: 0x0000..0x3fff
    extended_opcode_start: '0x0000'
    extended_opcode_end: '0x3fff'
    extended_opcode_slots: 16384
    extended_opcode_bits: 14
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0], d:DREG[8:6], D:DREG[11:9], s:BWLQ[13:12]
    fields:
    - name: s
      kind: BWLQ
      source: size
      storage: descriptor
      width: 2
    - name: d
      kind: DREG
      source: lo
      storage: descriptor
      width: 3
    - name: e
      kind: EA
      source: value
      storage: descriptor
      width: 6
    - name: d
      kind: DREG
      source: hi
      storage: descriptor
      width: 3
    kind: extended
forms:
  extension_family: integer_bounds_signed
  operands:
  - name: lo
    type: DREG
  - name: value
    type: EA
  - name: hi
    type: DREG
  size: BWLQ

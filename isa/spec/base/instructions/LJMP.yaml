mnemonic: LJMP
doc:
  title: Long Jump
  summary: Atomically transfers control to a new CS:PC pair.
  description: Long jump is the CS-changing jump instruction. It commits the new CS and PC as a single architectural 
    control-transfer step, so software does not need to write CS directly while execution is still using the old PC. The
    two-operand form takes the new CS image from Dn and the target offset/address from the target EA. A 
    segment-immediate plus offset-immediate form is not encoded because two 64-bit immediates would exceed the 8-word 
    instruction limit.
  instruction_family: control_flow
  instruction_class: control_flow
behavior:
  group: control_flow
  inputs:
  - new_cs
  - target
  output: none
  operation:
  - CS = new_cs_v;
  - goto [target_v];
allocation:
  catalog_section: compact_primary
forms:
  segment_operand: DREG
  target_ea_set: long_control_target
  atomic_cs_pc_update: true
  disallow_immediate_segment_plus_immediate_offset: true
  operands:
  - name: new_cs
    type: DREG
  - name: target
    type: EA
  compact: false
  disallow_segment_immediate: true

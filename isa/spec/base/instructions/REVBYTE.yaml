mnemonic: REVBYTE
doc:
  title: Reverse Bytes
  summary: Performs the reverse bytes operation.
  description: Performs the reverse bytes operation.
  instruction_family: integer_alu
  instruction_class: integer
behavior:
  group: bit_reverse
  inputs: [src]
  output: dst
  operation:
  - dst_v = 0;
  - tmp_v = src_v;
  - result_v = size_v;
  - <revbyte_loop>
  - if (result_v == 0) goto <revbyte_done>;
  - dst_v = dst_v << 8;
  - carry_v = 0xff;
  - borrow_v = tmp_v & carry_v;
  - dst_v = dst_v | borrow_v;
  - tmp_v = tmp_v >> 8;
  - result_v = result_v - 1;
  - goto <revbyte_loop>;
  - <revbyte_done>
allocation:
  catalog_section: integer
  layout_group: REV
forms:
  operands:
  - - name: src
      type: DREG
    - name: dst
      type: DREG
  - - name: src
      type: EA
    - name: dst
      type: DREG
  - - name: src
      type: DREG
    - name: dst
      type: EA
  size: BWLQ
  compact: false
  result: second operand
  memory_memory: disallowed

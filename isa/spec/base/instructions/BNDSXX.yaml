mnemonic: BNDSXX
doc:
  title: Signed Bounds Check Exclusive-Exclusive
  summary: Checks signed value membership in the exclusive-exclusive interval (lo, hi).
  description: BNDSXX treats both bounds as exclusive. It sets V when signed(value) is outside (signed(lo), signed(hi));
    Z, N, and C are unchanged.
  instruction_family: bounds
  instruction_class: integer
behavior:
  group: bounds
  inputs:
  - hi
  - lo
  - value
  output: none
  operation:
  - ZF = 0;
  - NF = 0;
  - CF = 0;
  - VF = 0;
  - if (value_v <= lo_v) goto <bnduxx_bad>;
  - if (value_v >= hi_v) goto <bnduxx_bad>;
  - goto <bnduxx_done>;
  - <bnduxx_bad>
  - VF = 1;
  - <bnduxx_done>
  interval: (lo, hi)
  signedness: signed
  bounds_mode: XX
attributes:
  privilege: unprivileged
allocation:
  catalog_section: integer
  layout_group: BOUNDS_SIGNED
  encoding:
  - id: BNDSXX.D_TO_EA_TO_D
    extension_root: EXT.integer_bounds_signed
    extension_root_payload: '0xf42'
    extension_family: integer_bounds_signed
    extended_opcode: 0xc000..0xffff
    extended_opcode_start: '0xc000'
    extended_opcode_end: '0xffff'
    extended_opcode_slots: 16384
    extended_opcode_bits: 14
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0], d:DREG[8:6], D:DREG[11:9], s:BWLQ[13:12]
    fields:
    - name: s
      kind: BWLQ
      source: size
      storage: descriptor
      width: 2
    - name: d
      kind: DREG
      source: lo
      storage: descriptor
      width: 3
    - name: e
      kind: EA
      source: value
      storage: descriptor
      width: 6
    - name: d
      kind: DREG
      source: hi
      storage: descriptor
      width: 3
    kind: extended
forms:
  extension_family: integer_bounds_signed
  operands:
  - name: lo
    type: DREG
  - name: value
    type: EA
  - name: hi
    type: DREG
  size: BWLQ

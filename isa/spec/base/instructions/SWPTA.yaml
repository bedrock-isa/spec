mnemonic: SWPTA
doc:
  title: Switch Page Table With Context
  summary: Switches the page table and enables address-space context matching.
  description: Updates PTCR from the first data register, writes the low 16 bits of the second data register into ASCR[31:16], and sets ASCR.AE.
  instruction_family: tlb_and_context
  instruction_class: system
behavior:
  group: tlb_context
  inputs:
  - new_ptcr
  - asid
  output: none
  operation:
  - PTCR = new_ptcr_v;
  - ASCR = ((asid_v & 0xffff) << 16) | 1;
allocation:
  catalog_section: system
  encoding:
  - id: SWPTA.D_TO_D
    extension_root: EXT.tlb_cache
    extension_root_payload: '0xf62'
    extension_family: tlb_cache
    extended_opcode: 0x0080..0x00bf
    extended_opcode_start: '0x0080'
    extended_opcode_end: '0x00bf'
    extended_opcode_slots: 64
    extended_opcode_bits: 6
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: d:DREG[2:0], D:DREG[5:3]
    fields:
    - name: d
      kind: DREG
      source: new_ptcr
      storage: descriptor
      width: 3
    - name: d
      kind: DREG
      source: asid
      storage: descriptor
      width: 3
    kind: extended
forms:
  operands:
  - name: new_ptcr
    type: DREG
  - name: asid
    type: DREG

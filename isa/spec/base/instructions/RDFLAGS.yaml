mnemonic: RDFLAGS
doc:
  title: Read Flags
  summary: Read the integer condition-code flags into a D register.
  description: RDFLAGS reads the architectural 16-bit FLAGS register, zero-extends it to 64 bits, and writes the result 
    to the destination D register. FLAGS is not part of the S segment-register operand class.
  instruction_family: system_registers
  instruction_class: system
behavior:
  group: system_registers
  output: dst
  operation:
  - dst_v = zext(ZF) << 3;
  - tmp_v = zext(NF) << 2;
  - dst_v = dst_v | tmp_v;
  - tmp_v = zext(CF) << 1;
  - dst_v = dst_v | tmp_v;
  - dst_v = dst_v | zext(VF);
attributes:
  privilege: unprivileged
  flags: unchanged
allocation:
  catalog_section: system
  layout_group: FLAGS_ACCESS
  encoding:
  - id: RDFLAGS.D
    extension_root: EXT.system_core
    extension_root_payload: '0xf63'
    extension_family: system_core
    extended_opcode: 0x0010..0x0017
    extended_opcode_start: '0x0010'
    extended_opcode_end: '0x0017'
    extended_opcode_slots: 8
    extended_opcode_bits: 3
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: d:DREG[2:0]
    fields:
    - name: d
      kind: DREG
      source: dst
      storage: descriptor
      width: 3
    kind: extended
forms:
  operands:
  - name: dst
    type: DREG
  size: W

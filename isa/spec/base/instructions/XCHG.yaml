mnemonic: XCHG
doc:
  title: Exchange
  summary: Performs the exchange operation.
  description: Performs the exchange operation.
  instruction_family: data_movement
  instruction_class: data_movement
behavior:
  group: data_movement
  input_output:
  - lhs
  - rhs
  operation:
  - tmp_v = lhs_v;
  - lhs_v = rhs_v;
  - rhs_v = tmp_v;
attributes:
  memory: at_most_one_memory_operand
  atomic: false
allocation:
  catalog_section: integer
forms:
  operands:
  - - name: lhs
      type: EA
    - name: rhs
      type: DREG
  - - name: lhs
      type: DREG
    - name: rhs
      type: EA
  size: BWLQ
  memory_memory:
    allowed: false

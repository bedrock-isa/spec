mnemonic: BTEST
doc:
  title: Bit Test
  summary: Performs the bit test operation.
  instruction_family: integer_bitfield
  instruction_class: integer
behavior:
  group: bit_ops
  inputs:
  - bit_index
  - dst
  output: none
  operation:
  - tmp_v = (dst_v >> (bit_index_v & 63)) & 1;
  - ZF = tmp_v == 0;

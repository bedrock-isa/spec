mnemonic: MOVSETAD
doc:
  title: Move D Registers To A Registers
  summary: Copies selected D registers from a data-register bank to matching A registers.
  description: Copies selected D registers to matching A registers. The one-operand form uses the current DBANK 
    selector. The banked form names an explicit source DBANK and does not change the current selector.
  instruction_family: data_movement
  instruction_class: data_movement
behavior:
  group: register_set_transfer
  inputs:
  - regs
  output: none
  operation_by_form:
  - operands: [BITMAP16]
    operation:
    - if ((regs_v & 0x01) == 0) goto <movsetad_d0_done>;
    - A0 = D0;
    - <movsetad_d0_done>
    - if ((regs_v & 0x02) == 0) goto <movsetad_d1_done>;
    - A1 = D1;
    - <movsetad_d1_done>
    - if ((regs_v & 0x04) == 0) goto <movsetad_d2_done>;
    - A2 = D2;
    - <movsetad_d2_done>
    - if ((regs_v & 0x08) == 0) goto <movsetad_d3_done>;
    - A3 = D3;
    - <movsetad_d3_done>
    - if ((regs_v & 0x10) == 0) goto <movsetad_d4_done>;
    - A4 = D4;
    - <movsetad_d4_done>
    - if ((regs_v & 0x20) == 0) goto <movsetad_d5_done>;
    - A5 = D5;
    - <movsetad_d5_done>
    - if ((regs_v & 0x40) == 0) goto <movsetad_d6_done>;
    - A6 = D6;
    - <movsetad_d6_done>
    - if ((regs_v & 0x80) == 0) goto <movsetad_d7_done>;
    - A7 = D7;
    - <movsetad_d7_done>
  - operands: [DBANK, BITMAP16]
    operation:
    - if ((regs_v & 0x01) == 0) goto <movsetad_b0_done>;
    - A0 = arch_dbank_read(src_bank_v & 0xf, 0:8);
    - <movsetad_b0_done>
    - if ((regs_v & 0x02) == 0) goto <movsetad_b1_done>;
    - A1 = arch_dbank_read(src_bank_v & 0xf, 1:8);
    - <movsetad_b1_done>
    - if ((regs_v & 0x04) == 0) goto <movsetad_b2_done>;
    - A2 = arch_dbank_read(src_bank_v & 0xf, 2:8);
    - <movsetad_b2_done>
    - if ((regs_v & 0x08) == 0) goto <movsetad_b3_done>;
    - A3 = arch_dbank_read(src_bank_v & 0xf, 3:8);
    - <movsetad_b3_done>
    - if ((regs_v & 0x10) == 0) goto <movsetad_b4_done>;
    - A4 = arch_dbank_read(src_bank_v & 0xf, 4:8);
    - <movsetad_b4_done>
    - if ((regs_v & 0x20) == 0) goto <movsetad_b5_done>;
    - A5 = arch_dbank_read(src_bank_v & 0xf, 5:8);
    - <movsetad_b5_done>
    - if ((regs_v & 0x40) == 0) goto <movsetad_b6_done>;
    - A6 = arch_dbank_read(src_bank_v & 0xf, 6:8);
    - <movsetad_b6_done>
    - if ((regs_v & 0x80) == 0) goto <movsetad_b7_done>;
    - A7 = arch_dbank_read(src_bank_v & 0xf, 7:8);
    - <movsetad_b7_done>
  banked_forms: Current-bank forms and forms that name DBn explicitly are part of the base register-set transfer group. 
    Implementations report the number of available data-register banks through CPUID implementation properties.
allocation:
  catalog_section: compact_primary
forms:
  operands:
  - name: regs
    type: bitmap16
  extended_forms:
  - operands:
    - name: src_bank
      type: DBANK
    - name: regs
      type: bitmap16
    compact: false
    extension_family: data_register_banking
  valid_bits: 0..7

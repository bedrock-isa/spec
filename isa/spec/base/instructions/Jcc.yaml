mnemonic: Jcc
doc:
  title: Jump Conditional
  summary: Transfers control when the encoded condition is true.
  instruction_family: control_flow
  instruction_class: control_flow
behavior:
  group: control_flow
  inputs:
  - cc
  - target
  output: none
  operation:
  - if (cc_v == 0) goto <jcc_done>;
  - goto [target_v];
  - <jcc_done>
allocation:
  catalog_section: compact_primary
forms:
  target_ea_set: branch_target
  compact_forms:
  - operands:
    - name: cc
      type: condition
    - name: target
      type: relative_imm
    size: WL
  extended_forms:
  - operands:
    - name: cc
      type: condition
    - name: target
      type: EA
    size: WL
    compact: false
  reads: FLAGS

mnemonic: SHL
doc:
  title: Shift Left
  summary: Performs the shift left operation.
  instruction_family: integer_bitfield
  instruction_class: integer
behavior:
  group: shifts_rotates
  inputs:
  - count
  input_output: dst
  operation:
  - dst_v = dst_v << count_v;
  - ZF = dst_v == 0;
  - NF = dst_v s< 0;
  - CF = 0;
  - VF = 0;
  count_rules:
    shifts:
      zero_count: count=0 leaves the destination and FLAGS unchanged
      over_width: result is zero; C is zero when count is greater than operand width
    rotates:
      effective_count: count modulo operand width
      zero_effective_count: destination and FLAGS unchanged
    carry_rotates:
      effective_count: count modulo operand width plus carry slot
      zero_effective_count: destination and FLAGS unchanged
  flag_rules:
    Z: result == 0
    N: most significant result bit
    C: last bit shifted out, or zero for count greater than operand width
    V: signed source value multiplied by 2^count is not representable in the operand width
attributes:
  privilege: unprivileged
allocation:
  catalog_section: integer
  layout_group: SHIFTS
  encoding:
  - id: SHL.D_TO_D
    extension_root: EXT.integer_bitfield
    extension_root_payload: '0xf46'
    extension_family: integer_bitfield
    extended_opcode: 0x7300..0x73ff
    extended_opcode_start: '0x7300'
    extended_opcode_end: '0x73ff'
    extended_opcode_slots: 256
    extended_opcode_bits: 8
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: n:DREG[2:0], d:DREG[5:3], s:BWLQ[7:6]
    fields:
    - name: s
      kind: BWLQ
      source: size
      storage: descriptor
      width: 2
    - name: n
      kind: DREG
      source: count
      storage: descriptor
      width: 3
    - name: d
      kind: DREG
      source: dst
      storage: descriptor
      width: 3
    kind: extended
  - id: SHL.D_TO_EA
    extension_root: EXT.integer_bitfield
    extension_root_payload: '0xf46'
    extension_family: integer_bitfield
    extended_opcode: 0x9000..0x97ff
    extended_opcode_start: '0x9000'
    extended_opcode_end: '0x97ff'
    extended_opcode_slots: 2048
    extended_opcode_bits: 11
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0], n:DREG[8:6], s:BWLQ[10:9]
    fields:
    - name: s
      kind: BWLQ
      source: size
      storage: descriptor
      width: 2
    - name: n
      kind: DREG
      source: count
      storage: descriptor
      width: 3
    - name: e
      kind: EA
      source: dst
      storage: descriptor
      width: 6
    kind: extended
  - id: SHL.I6_TO_EA
    extension_root: EXT.integer_bitfield_shift_imm
    extension_root_payload: '0xf49'
    extension_family: integer_bitfield_shift_imm
    extended_opcode: 0x0000..0x3fff
    extended_opcode_start: '0x0000'
    extended_opcode_end: '0x3fff'
    extended_opcode_slots: 16384
    extended_opcode_bits: 14
    operand_payload_bits: 0
    operand_descriptor_words: 0
    operand_descriptor_spilled: false
    descriptor_layout: e:EA[5:0], n:selector6[11:6], s:BWLQ[13:12], o:shift_group=SHL[15:14]
    fields:
    - name: s
      kind: BWLQ
      source: size
      storage: descriptor
      width: 2
    - name: o
      kind: shift_group
      source: semantic
      storage: descriptor
      width: 2
      value: 0
      value_label: SHL
      placement: high
    - name: n
      kind: selector6
      source: count
      storage: descriptor
      width: 6
    - name: e
      kind: EA
      source: dst
      storage: descriptor
      width: 6
    kind: extended
forms:
  operands:
  - - name: count
      type: selector
    - name: dst
      type: DREG
  - - name: count
      type: selector
    - name: dst
      type: EA
  size: BWLQ
  compact: false
  encoding_fields:
  - field: o
    kind: shift_group
    width: 2
    placement: high
    values:
    - SHL
    - SHR
    - SAR
    - DYN
    derive: mnemonic
    match:
      profile: I6_TO_EA

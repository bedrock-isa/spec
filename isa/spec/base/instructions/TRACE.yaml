mnemonic: TRACE
doc:
  title: Trace Marker
  summary: Performs the trace marker operation.
  instruction_family: control_flow
  instruction_class: control_flow
behavior:
  group: control_flow
  inputs:
  - marker
  output: none
  operation:
  - arch_trace_marker(marker_v & 0xffff);
attributes:
  privilege: unprivileged
allocation:
  catalog_section: compact_primary
  encoding:
  - id: TRACE.IMM
    kind: compact
    start_payload: '0xf3b'
    end_payload: '0xf3b'
    slots: 1
    primary_bits: 0
    field_layout: none
    fields: []
forms:
  operands:
  - name: marker
    type: imm16
  if_trace_disabled: nop

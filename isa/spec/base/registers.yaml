register_classes:
  D:
    count: 8
    width: 64
    allocatable: true
    role: data
  A:
    count: 8
    width: 64
    allocatable: true
    role: address
  SP:
    count: 1
    width: 64
    allocatable: false
    role: stack pointer
  PC:
    count: 1
    width: 64
    allocatable: false
    role: program counter


data_register_banking:
  selector:
    name: DBANK
    width: 4
    architectural_namespace: 16
    required_base_count: 1
    discovery:
      cpuid_class: implementation properties
      cpuid_leaf: DATA_REGISTER_BANKS
  model:
    visible_register_rule: Dn names D[DBANK][n]
    ordinary_instruction_rule: ordinary DREG operands use the current DBANK selector
    bank_zero_role: ABI-visible data-register bank
    public_boundary_rule: DBANK must be 0 at public ABI boundaries
    handler_entry_rule: exception, interrupt, trap, and syscall handlers save the interrupted DBANK selector and execute with DBANK set to 0
    saved_state_rule: supervisor-entry and syscall frames save the interrupted DBANK selector; IRET and SYSRET restore it from the saved frame image
  tiers:
    - name: DBANK1
      required_banks: 1
      description: only bank 0 is implemented; bank-switching instructions exist but nonzero bank selectors fault
    - name: DBANK4
      required_banks: 4
      description: banks 0 through 3 are available for backend and runtime scratch allocation
    - name: DBANK16
      required_banks: 16
      description: the full 4-bit architectural bank namespace is available
  object_attribute: BEDROCK_ATTR_REQUIRED_DBANK_COUNT


special_register_classes:
  S:
    width: 64
    encoding_bits: 3
    role: segment
    registers: [CS, DS, SS, GS0, GS1, GS2, GS3, GS4]
    reserved_values: []
    encoding:
      - value: 0
        bits: "000"
        register: CS
      - value: 1
        bits: "001"
        register: DS
      - value: 2
        bits: "010"
        register: SS
      - value: 3
        bits: "011"
        register: GS0
      - value: 4
        bits: "100"
        register: GS1
      - value: 5
        bits: "101"
        register: GS2
      - value: 6
        bits: "110"
        register: GS3
      - value: 7
        bits: "111"
        register: GS4


control_register_classes:
  CR:
    width: 64
    encoding_bits: 16
    role: control
    registers:
      - PTCR
      - ASCR
      - ICR
      - SPC
      - SCS
      - SDS
      - BOOTPC
      - BOOTCFG
      - PTC
      - PMC
      - SSS0
      - SSP0
      - SSS1
      - SSP1
      - SSS2
      - SSP2
      - SSS3
      - SSP3
    selector_groups:
      - name: translation
        range: [0x0000, 0x00ff]
        selectors:
          - value: 0x0000
            register: PTCR
          - value: 0x0001
            register: ASCR
          - value: 0x0002
            register: ICR
      - name: supervisor_entry
        range: [0x0100, 0x01ff]
        selectors:
          - value: 0x0100
            register: SPC
          - value: 0x0101
            register: SCS
          - value: 0x0102
            register: SDS
      - name: interrupt stack banks
        range: [0x0200, 0x02ff]
        selectors:
          - value: 0x0200
            register: SSS0
          - value: 0x0201
            register: SSP0
          - value: 0x0210
            register: SSS1
          - value: 0x0211
            register: SSP1
          - value: 0x0220
            register: SSS2
          - value: 0x0221
            register: SSP2
          - value: 0x0230
            register: SSS3
          - value: 0x0231
            register: SSP3
      - name: boot
        range: [0x1000, 0x10ff]
        selectors:
          - value: 0x1000
            register: BOOTPC
          - value: 0x1001
            register: BOOTCFG
      - name: counters
        range: [0x1100, 0x11ff]
        selectors:
          - value: 0x1100
            register: PTC
          - value: 0x1101
            register: PMC
    reserved_selector_fault: INVALID_CONTROL_STATE


special_registers:
  - name: PC
    width: 64
    class: PC
    implicit: true
  - name: SP
    width: 64
    class: SP
    implicit: true
  - name: FLAGS
    width: 16
    class: FLAGS
    access_width: 16
    access_size: W
    role: condition flags
    nonzero_bits: 4
    valid_bits: [Z, N, C, V]
    layout:
      Z:
        bit: 3
        description: zero
      N:
        bit: 2
        description: negative
      C:
        bit: 1
        description: carry or borrow
      V:
        bit: 0
        description: overflow
    implicit: true
  - name: STATUS
    width: 16
    class: STATUS
    access_width: 16
    access_size: W
    role: state
    nonzero_bits: 6
    valid_bits: [IE, PM, RF, TF, NI, IN]
    layout:
      IE:
        bit: 5
        description: interrupt enable
      PM:
        bit: 4
        description: privileged mode; 0 = user, 1 = supervisor
      RF:
        bit: 3
        description: resume flag
      TF:
        bit: 2
        description: trap flag
      NI:
        bit: 1
        description: NMI in-progress
      IN:
        bit: 0
        description: interrupt nesting enable
    privilege: supervisor

  - name: CS
    width: 64
    class: S
    access_width: 64
    access_size: Q
    role: segment
    write_policy: control transfer only
    note: use LJMP, LCALL, LRET, SYSRET, or IRET for CS-changing control transfer
  - name: DS
    width: 64
    class: S
    access_width: 64
    access_size: Q
    role: segment
  - name: SS
    width: 64
    class: S
    access_width: 64
    access_size: Q
    role: segment
  - name: GS0
    width: 64
    class: S
    access_width: 64
    access_size: Q
    role: segment
  - name: GS1
    width: 64
    class: S
    access_width: 64
    access_size: Q
    role: segment
  - name: GS2
    width: 64
    class: S
    access_width: 64
    access_size: Q
    role: segment
  - name: GS3
    width: 64
    class: S
    access_width: 64
    access_size: Q
    role: segment
  - name: GS4
    width: 64
    class: S
    access_width: 64
    access_size: Q
    role: segment

  - name: SPC
    width: 64
    class: CR
    role: control
    description: supervisor entry program counter
    privilege: supervisor
  - name: SCS
    width: 64
    class: CR
    role: control
    description: supervisor entry code segment selector
    privilege: supervisor
  - name: SDS
    width: 64
    class: CR
    role: control
    description: supervisor entry data segment selector
    privilege: supervisor
  - name: SSS0
    width: 64
    class: CR
    role: interrupt stack segment bank
    description: interrupt stack segment selector bank 0
    privilege: supervisor
  - name: SSP0
    width: 64
    class: CR
    role: interrupt stack pointer bank
    description: interrupt stack pointer bank 0
    privilege: supervisor
  - name: SSS1
    width: 64
    class: CR
    role: interrupt stack segment bank
    description: interrupt stack segment selector bank 1
    privilege: supervisor
  - name: SSP1
    width: 64
    class: CR
    role: interrupt stack pointer bank
    description: interrupt stack pointer bank 1
    privilege: supervisor
  - name: SSS2
    width: 64
    class: CR
    role: interrupt stack segment bank
    description: interrupt stack segment selector bank 2
    privilege: supervisor
  - name: SSP2
    width: 64
    class: CR
    role: interrupt stack pointer bank
    description: interrupt stack pointer bank 2
    privilege: supervisor
  - name: SSS3
    width: 64
    class: CR
    role: interrupt stack segment bank
    description: interrupt stack segment selector bank 3
    privilege: supervisor
  - name: SSP3
    width: 64
    class: CR
    role: interrupt stack pointer bank
    description: interrupt stack pointer bank 3
    privilege: supervisor
  - name: PTCR
    width: 64
    class: CR
    role: control
    privilege: supervisor
    layout:
      root_page:
        bits: [63, 12]
        description: page-table root physical frame number
      PABITS_SEL:
        bits: [11, 8]
        description: physical address width selector
      LA57:
        bit: 7
        description: 5-level paging enable
      reserved:
        bits: [6, 1]
        description: reserved, must be zero
      PE:
        bit: 0
        description: page-table translation enable
  - name: ASCR
    width: 64
    class: CR
    role: control
    privilege: supervisor
    layout:
      reserved_high:
        bits: [63, 32]
        description: reserved, must be zero
      ASID:
        bits: [31, 16]
        description: current address-space identifier
      reserved_low:
        bits: [15, 1]
        description: reserved, must be zero
      AE:
        bit: 0
        description: ASID enable
  - name: ICR
    width: 64
    class: CR
    role: control
    privilege: supervisor
    layout:
      ivt_page:
        bits: [63, 12]
        description: interrupt vector table frame number / page number
      MAX_IDEPTH:
        bits: [11, 8]
        description: maximum maskable interrupt nesting depth
      NMI_PENDING:
        bit: 7
        description: hardware-managed NMI pending bit
      NMI_LATCH:
        bit: 6
        description: latch NMI while STATUS.NI is set
      DF_ENABLE:
        bit: 5
        description: double-fault handling enable
      reserved:
        bits: [4, 1]
        description: reserved, must be zero
      IVT_VALID:
        bit: 0
        description: interrupt vector table valid
  - name: BOOTPC
    width: 64
    class: CR
    role: control
    privilege: supervisor
  - name: BOOTCFG
    width: 64
    class: CR
    role: control
    privilege: supervisor
  - name: PTC
    width: 64
    class: CR
    role: control
    privilege: supervisor
  - name: PMC
    width: 64
    class: CR
    role: control
    privilege: supervisor

translation_control:
  PTCR:
    PABITS_SEL:
      - selector: 0
        physical_address_bits: 48
      - selector: 1
        physical_address_bits: 56
      - selector: 2..15
        physical_address_bits: reserved
        access_fault: INVALID_CONTROL_STATE
    paging_modes:
      LA57_0: 4-level paging, 48-bit canonical linear address
      LA57_1: 5-level paging, 57-bit canonical linear address
    PE_0: page-table translation disabled; use the segment pre-translation result as the linear address directly
    PE_1: page-table translation enabled; root_page points to the page table root
    address_flow:
      - EA
      - segment pre-translation
      - linear address
      - if PTCR.PE = 1: page table translation
      - if PTCR.PE = 0: linear address directly
  ASCR:
    AE: ASID enable
    ASID: current address-space identifier
  page_table_entry:
    low_attribute_bits:
      P:
        bit: 0
        description: Present
      W:
        bit: 1
        description: Writable
      X:
        bit: 2
        description: Executable
      U:
        bit: 3
        description: User accessible
      G:
        bit: 4
        description: Global TLB entry
      A:
        bit: 5
        description: Accessed
      D:
        bit: 6
        description: Dirty
      AT:
        bit: 7
        description: Addressing type
      CP:
        bits: [9, 8]
        description: Cache policy
      SW0:
        bit: 10
        description: Software-defined
      T:
        bit: 11
        description: Table / non-leaf entry
    ranges:
      architectural_low_attributes: PTE[0..11]
      physical_frame_number: PTE[12..PABITS-1]
      software_defined: PTE[PABITS..63]
    addressing_type:
      0: byte-addressed memory
      1: externally acknowledged / bus-sized addressing
    cache_policy:
      0b00: cacheable
      0b01: uncacheable
      0b10: write-through
      0b11: write-combining
    table_bit:
      0: leaf PTE
      1: next-level table entry
    walk_level_rules:
      large_pages: unsupported
      non_leaf_levels: for every level above L1, P must be 1 and T must be 1; any other value causes PAGE_FAULT
      leaf_level: at L1, P must be 1 and T must be 0; any other value causes PAGE_FAULT
    non_leaf_attributes:
      PFN: physical frame number of the next-level table
      W_X_U: constrain descendant leaf permissions; access is allowed only if every traversed entry and the leaf permit the requested access
      A: set when the entry is successfully traversed
      D: leaf-only, must be zero in non-leaf entries
      G: leaf-only, must be zero in non-leaf entries
      CP: cache policy used for hardware table-walk memory accesses to the next-level table
      AT: must be 0 for non-leaf entries; page tables are byte-addressed memory
      SW0: software-defined and ignored by hardware
    leaf_attributes:
      PFN: physical frame number of the mapped page
      W_X_U: access permissions for stores, instruction fetches, and user-mode access
      A: set when the leaf mapping is successfully used
      D: set on a successful store through the leaf mapping
      G: marks the resulting translation as global
      CP: cache policy for the mapped access
      AT: addressing type for the mapped access; does not change PFN plus offset address formation
      SW0: software-defined and ignored by hardware
    permission_rules:
      - mode: user
        condition: effective U permission is 0
        result: PRIVILEGE_FAULT
      - mode: user
        condition: effective U permission is 1
        result: allowed subject to present, W/X, and access-type checks
      - mode: supervisor
        condition: effective U permission is 0
        result: allowed for C-domain accesses subject to present, W/X, and access-type checks
      - mode: supervisor
        condition: effective U permission is 1 and access domain is C
        result: PAGE_FAULT
      - mode: supervisor
        condition: effective U permission is 1 and access domain is U
        result: allowed subject to present, W/X, and access-type checks
      - mode: supervisor
        condition: effective U permission is 0 and access domain is U
        result: PAGE_FAULT
  ICR:
    MAX_IDEPTH_0: maskable interrupt nesting disabled
    MAX_IDEPTH_n: maximum hidden_current_idepth is n; when hidden_current_idepth equals MAX_IDEPTH, maskable interrupts are implicitly masked

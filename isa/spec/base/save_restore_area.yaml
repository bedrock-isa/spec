save_area_formats:
  processor_state:
    title: SAVE/RESTORE Processor-State Save Area
    applies_to:
    - SAVE
    - RESTORE
    fixed_base_bytes: 192
    save_area_alignment_bytes: 4096
    state_block_alignment_bytes: 64
    state_block_bitmap_words: 1
    fixed_slots:
    - offset: 0
      field: base header fields
      cells:
      - span: 2
        field: resv, DBANK
      - span: 2
        field: STATUS
      - span: 2
        field: FLAGS
      - span: 2
        field: GS valid, resv
    - offset: 8
      field: state block bitmap
    - offset: 16
      field: D0, bank 0
    - offset: 24
      field: D1, bank 0
    - offset: 32
      field: D2, bank 0
    - offset: 40
      field: D3, bank 0
    - offset: 48
      field: D4, bank 0
    - offset: 56
      field: D5, bank 0
    - offset: 64
      field: D6, bank 0
    - offset: 72
      field: D7, bank 0
    - offset: 80
      field: A0
    - offset: 88
      field: A1
    - offset: 96
      field: A2
    - offset: 104
      field: A3
    - offset: 112
      field: A4
    - offset: 120
      field: A5
    - offset: 128
      field: A6
    - offset: 136
      field: A7
    - offset: 144
      field: GS0
    - offset: 152
      field: GS1
    - offset: 160
      field: GS2
    - offset: 168
      field: GS3
    - offset: 176
      field: GS4
    - offset: 184
      field: reserved padding to end of fixed base block
    - offset: 192
      field: extension state block area may begin
    header_fields:
    - offset: 0
      bits: 0..4
      field: GS_VALID
      meaning: bit n validates GSn at 0x090 + 8*n; RESTORE updates only GS slots whose bits are set
    - offset: 0
      bits: 5..15
      field: reserved
      meaning: SAVE writes zero and RESTORE ignores
    - offset: 0
      bits: 16..31
      field: FLAGS
      meaning: always-saved integer condition-code FLAGS image
    - offset: 0
      bits: 32..47
      field: STATUS
      meaning: always-saved STATUS image; user-mode RESTORE ignores this field, supervisor RESTORE applies STATUS write rules
    - offset: 0
      bits: 48..51
      field: DBANK
      meaning: current data-register bank selector; RESTORE applies the SELDB validity rules and updates the selector after bank payloads
    - offset: 0
      bits: 52..63
      field: reserved
      meaning: SAVE writes zero and RESTORE ignores
    - offset: 8
      bits: i
      field: component descriptor 2+i present
      meaning: i=0..SAVE_COMPONENT_COUNT-1 and SAVE_COMPONENT_COUNT must be no larger than 64
    - offset: 8
      bits: all other bits
      field: reserved
      meaning: SAVE writes zero and RESTORE ignores
    instruction_behavior:
      SAVE: SAVE always writes the base header fields, state block bitmap, bank-0 D registers, A registers, FLAGS, STATUS,
        and DBANK selector. SAVE may clear GS validity bits for architecturally clean GS slots and may clear state-block
        bitmap bits for architecturally clean extension blocks.
      RESTORE: RESTORE always restores bank-0 D registers, A registers, FLAGS, and DBANK from the fixed base block. RESTORE
        updates only GS slots whose GS validity bit is set. User-mode RESTORE ignores the STATUS field and does not validate
        STATUS reserved bits; supervisor RESTORE restores STATUS under the normal STATUS write rules. RESTORE processes
        extension blocks whose state-block bitmap bit is set and ignores blocks whose bit is clear.
    extension_components: Extension component offsets begin no earlier than SAVE_HEADER_SIZE, 0x0c0 for the base profile,
      and are reported by CPUID. The save-area base address is 4 KiB aligned. Every component offset and component storage
      size is a multiple of 64 bytes so state blocks are cache-line aligned.
    extension_component_order: CPUID SAVE_AREA_LAYOUT component descriptors are indexed from 2 upward. That descriptor index
      order is the architectural extension-component order and is the bit order used by the fixed state block bitmap at
      offset 0x008. COMPONENT_OFFSET values are numeric byte offsets and must be strictly increasing in descriptor order.
      Base-defined component formats appear first; extension-owned component formats are appended by descriptor order from
      their owning extension specs. The SAVE area has no architectural total-size upper bound beyond the CPUID-reported
      SAVE_AREA_SIZE value for the selected implementation/profile, but SAVE_COMPONENT_COUNT is limited to 64 by the fixed
      state block bitmap.
    extension_component_formats:
    - component_id: 1
      name: DATA_REGISTER_BANKS
      title: Additional Data-Register Banks
      validity: The component header fields contain a bank-level validity bitmap. If a bank bit is clear, RESTORE leaves
        that nonzero D-register bank unchanged.
      description: This component stores data-register banks other than bank 0. Bank 0 is part of the fixed base block.
        The first 64 bytes are the component header. Each following 0x40-byte bank record stores D0-D7 for the matching
        bank number and begins on a 64-byte boundary.
      size: 0x40 * DBANK_COUNT
      header_fields:
      - offset: 0
        bits: '0'
        field: reserved
        meaning: bank 0 lives in the fixed base block
      - offset: 0
        bits: 1..15
        field: D_BANK_VALID
        meaning: bit b validates D bank b at +0x040*b for b=1..DBANK_COUNT-1
      - offset: 0
        bits: 16..63
        field: reserved
        meaning: bits for unimplemented banks and future state are reserved
      slots:
      - offset: 8
        field: reserved padding to first bank record
        meaning: reserved padding to keep each bank record 64-byte aligned
      - offset: 64
        field: D bank records
        meaning: 0x40-byte records repeat at +0x040*b for b=1..DBANK_COUNT-1; each record stores D0-D7 for bank b

version: draft-v1

prefix_word:
  bytes_per_instruction: 2
  fill_order:
    - low
    - high
  decode_order:
    - low
    - high
  unused_slot_encoding: NPX
  conflict_resolution: last prefix wins
  conflict_note: >
    Prefix effects are applied in byte order. If two prefixes in the same
    semantic group or otherwise conflicting prefixes appear in the prefix word,
    the later decoded prefix overrides the earlier one.

prefixes:
  - name: NPX
    value: 0x00
    group: neutral
  - name: NOSPEC
    value: 0x01
    group: speculation
  - name: SATURATE
    value: 0x02
    group: arithmetic_mode
    applies_to:
      - arithmetic
  - name: NONTEMPORAL
    value: 0x03
    group: memory_hint
    applies_to:
      - memory
  - name: POSTINC
    value: 0x04
    group: ea_update
    requires:
      update_eligible_ea: true
  - name: PREINC
    value: 0x05
    group: ea_update
    requires:
      update_eligible_ea: true
  - name: POSTDEC
    value: 0x06
    group: ea_update
    requires:
      update_eligible_ea: true
  - name: PREDEC
    value: 0x07
    group: ea_update
    requires:
      update_eligible_ea: true
  - name: U2C
    value: 0x08
    group: access_domain
    applies_to:
      - memory
    syntax:
      operand_annotation: "U:[src], C:[dst]"
      default_domain: C
      examples:
        - "MOV.Q U:[A0], D0"
        - "MOV.B U:[A0++], C:[A1++]"
  - name: C2U
    value: 0x09
    group: access_domain
    applies_to:
      - memory
    syntax:
      operand_annotation: "C:[src], U:[dst]"
      default_domain: C
      examples:
        - "MOV.Q D0, U:[A1]"
        - "MOV.B C:[A0++], U:[A1++]"
  - name: U2U
    value: 0x0a
    group: access_domain
    applies_to:
      - memory
    syntax:
      operand_annotation: "U:[src], U:[dst]"
      default_domain: C
      examples:
        - "MOV.B U:[A0++], U:[A1++]"
        - "INC.L U:[A0]"
  - name: REPcc
    pattern: "1ccc cddd"
    group: repeat
    syntax:
      mnemonic_template: "REPcc"
      condition_suffix: concatenated
      dot_suffix_reserved_for_instruction_size: true
      applies_to_following_instruction: true
      separator: comma
      examples:
        - "REP D0, EXTZL.B [A0++], [A1++]"
      aliases:
        REP: REPT
    condition:
      type: condition_code
      field: c
      values_from: conditions.yaml
      full_set: true
    operand:
      type: DREG
      field: d
      range: D0-D7
      role: counter
    fpu_conditional_mnemonics: [FCMP, FTEST, FBNDII, FBNDIX, FBNDXI, FBNDXX]
    indexed_ea_counter_use:
      allowed: true
      counter_value: architectural signed counter value before iteration update
      note: >
        the counter D register may also appear as an indexed-EA index operand;
        EA evaluation uses the same architectural signed D-register value that
        REP tests before any condition-true counter update
    counter_encoding:
      interpretation: signed two's-complement
      value_bits: 63..0
      zero_rule: zero counter performs no iteration
      index_value: architectural counter value before iteration update
      update_after_condition_true_iteration: positive counters decrement and negative counters increment toward zero
      condition_false_iteration_counter_rule: counter is not updated
      completion_rule: counter is zero or the REP condition is false
      fault_restart_rule: remaining signed count is preserved
    counter_direction: signed counter moves toward zero
    commit_rule: a condition-false terminating iteration commits the body and leaves the counter unchanged

mutually_exclusive_groups:
  - ea_update
  - arithmetic_mode
  - speculation
  - memory_hint
  - access_domain
  - repeat

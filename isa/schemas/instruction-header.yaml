$schema: https://json-schema.org/draft/2020-12/schema
$id: bedrock://schemas/instruction-header
title: Bedrock extended-instruction header
type: object
additionalProperties: false
required: [id, bits, fields]
properties:
  id:
    const: EXTENDED_HEADER
  bits:
    const: 16
  fields:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, lsb, bits]
      properties:
        id:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        lsb:
          type: integer
          minimum: 0
        bits:
          type: integer
          minimum: 1

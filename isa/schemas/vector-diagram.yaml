$schema: https://json-schema.org/draft/2020-12/schema
$id: https://bedrock-isa.org/schemas/vector-diagram.yaml
title: VECTOR instruction diagram
description: >-
  Closed finite 16-byte VECTOR instruction examples. This schema validates the
  member-level structure; renderer validation owns cross-row references,
  coverage, and operation-specific invariants.
oneOf:
  - $ref: '#/$defs/vector-lane-transfer'
  - $ref: '#/$defs/predicate-lane-transfer'
  - $ref: '#/$defs/integer-width-conversion'
  - $ref: '#/$defs/predicate-width-conversion'
  - $ref: '#/$defs/predicate-range-generation'
  - $ref: '#/$defs/scalar-vector-transfer'
  - $ref: '#/$defs/predicated-vector-load'
  - $ref: '#/$defs/predicated-vector-reduction'
  - $ref: '#/$defs/floating-point-width-conversion'

$defs:
  nonempty-string:
    type: string
    minLength: 1

  nonnegative-integer:
    type: integer
    minimum: 0

  identifier:
    type: string
    pattern: '^[a-z][a-z0-9-]*$'

  view:
    type: object
    required: [visible_bytes, lane_order, scalable]
    additionalProperties: false
    properties:
      visible_bytes: {const: 16}
      lane_order: {const: right-to-left}
      scalable: {type: boolean}

  common:
    type: object
    required: [caption, alt_text, kind, view]
    properties:
      caption: {$ref: '#/$defs/nonempty-string'}
      alt_text: {$ref: '#/$defs/nonempty-string'}
      kind: {$ref: '#/$defs/nonempty-string'}
      view: {$ref: '#/$defs/view'}

  cell:
    type: object
    required: [value, effect]
    additionalProperties: false
    properties:
      value: {$ref: '#/$defs/nonempty-string'}
      effect:
        enum: [copy, preserve, zero, set, clear, sign-fill, ignored]
      appearance:
        enum:
          - old
          - source
          - zero
          - discarded
          - predicate-on
          - predicate-off
          - dont-care
          - selected-source
          - predicate-result
          - no-access

  bit-cell:
    type: object
    required: [value, effect, appearance, bits]
    additionalProperties: false
    properties:
      value: {$ref: '#/$defs/nonempty-string'}
      effect:
        enum: [copy, preserve, zero, set, clear, sign-fill, ignored]
      appearance:
        enum:
          - old
          - source
          - zero
          - discarded
          - predicate-on
          - predicate-off
          - dont-care
          - selected-source
          - predicate-result
          - no-access
      bits: {type: integer, minimum: 1}

  cell-row:
    type: object
    required: [id, label, role, element_bits, cells]
    additionalProperties: false
    properties:
      id: {$ref: '#/$defs/identifier'}
      label: {$ref: '#/$defs/nonempty-string'}
      role: {enum: [source, destination-before, destination-after, predicate]}
      element_bits: {type: integer, minimum: 1}
      cells:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/cell'}

  grouped-row:
    type: object
    required: [id, label, role, storage, element_bits, groups]
    additionalProperties: false
    properties:
      id: {$ref: '#/$defs/identifier'}
      label: {$ref: '#/$defs/nonempty-string'}
      role: {enum: [source, destination-before, destination-after]}
      storage: {enum: [predicate, vector]}
      element_bits: {type: integer, minimum: 1}
      groups:
        type: array
        minItems: 1
        items:
          type: object
          required: [cells]
          additionalProperties: false
          properties:
            cells:
              type: array
              minItems: 1
              items: {$ref: '#/$defs/bit-cell'}

  lane-edge:
    type: object
    required: [from_row, from_cell, to_row, to_cell, effect]
    additionalProperties: false
    properties:
      from_row: {$ref: '#/$defs/identifier'}
      from_cell: {$ref: '#/$defs/nonnegative-integer'}
      to_row: {$ref: '#/$defs/identifier'}
      to_cell: {$ref: '#/$defs/nonnegative-integer'}
      effect: {enum: [copy, preserve, sign-fill]}

  predicate-lane-edge:
    type: object
    required: [from_row, from_group, from_cell, to_row, to_group, to_cell, display]
    additionalProperties: false
    properties:
      from_row: {$ref: '#/$defs/identifier'}
      from_group: {$ref: '#/$defs/nonnegative-integer'}
      from_cell: {$ref: '#/$defs/nonnegative-integer'}
      to_row: {$ref: '#/$defs/identifier'}
      to_group: {$ref: '#/$defs/nonnegative-integer'}
      to_cell: {$ref: '#/$defs/nonnegative-integer'}
      display: {enum: [transfer, control]}

  container:
    type: object
    required: [cells]
    additionalProperties: false
    properties:
      cells:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/bit-cell'}

  container-row:
    type: object
    required: [id, label, role, containers]
    additionalProperties: false
    properties:
      id: {$ref: '#/$defs/identifier'}
      label: {$ref: '#/$defs/nonempty-string'}
      role: {enum: [source, destination-after]}
      containers:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/container'}

  predicate-cell-row:
    type: object
    required: [id, label, role, element_bits, cells]
    additionalProperties: false
    properties:
      id: {$ref: '#/$defs/identifier'}
      label: {$ref: '#/$defs/nonempty-string'}
      role: {const: predicate}
      element_bits: {const: 8}
      cells:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/cell'}

  container-edge:
    type: object
    required:
      [from_row, from_container, from_cell, to_row, to_container, to_cell, effect, display]
    additionalProperties: false
    properties:
      from_row: {$ref: '#/$defs/identifier'}
      from_container: {$ref: '#/$defs/nonnegative-integer'}
      from_cell: {$ref: '#/$defs/nonnegative-integer'}
      to_row: {$ref: '#/$defs/identifier'}
      to_container: {$ref: '#/$defs/nonnegative-integer'}
      to_cell: {$ref: '#/$defs/nonnegative-integer'}
      effect: {enum: [copy, sign-fill, zero]}
      display: {enum: [transfer, expansion-guide]}

  vector-lane-transfer:
    allOf:
      - $ref: '#/$defs/common'
      - type: object
        required: [rows, edges]
        additionalProperties: false
        properties:
          id: {$ref: '#/$defs/identifier'}
          caption: {$ref: '#/$defs/nonempty-string'}
          alt_text: {$ref: '#/$defs/nonempty-string'}
          kind: {const: vector-lane-transfer}
          view: {$ref: '#/$defs/view'}
          rows:
            type: array
            minItems: 1
            items: {$ref: '#/$defs/cell-row'}
          edges:
            type: array
            minItems: 1
            items: {$ref: '#/$defs/lane-edge'}

  predicate-lane-transfer:
    allOf:
      - $ref: '#/$defs/common'
      - type: object
        required: [rows, edges]
        additionalProperties: false
        properties:
          id: {$ref: '#/$defs/identifier'}
          caption: {$ref: '#/$defs/nonempty-string'}
          alt_text: {$ref: '#/$defs/nonempty-string'}
          kind: {const: predicate-lane-transfer}
          view: {$ref: '#/$defs/view'}
          rows:
            type: array
            minItems: 1
            items: {$ref: '#/$defs/grouped-row'}
          edges:
            type: array
            minItems: 1
            items: {$ref: '#/$defs/predicate-lane-edge'}

  integer-width-conversion:
    allOf:
      - $ref: '#/$defs/common'
      - type: object
        required: [container_bits, rows, edges]
        additionalProperties: false
        properties:
          id: {$ref: '#/$defs/identifier'}
          caption: {$ref: '#/$defs/nonempty-string'}
          alt_text: {$ref: '#/$defs/nonempty-string'}
          kind: {const: integer-width-conversion}
          view: {$ref: '#/$defs/view'}
          container_bits: {enum: [16, 32, 64]}
          rows:
            type: array
            minItems: 3
            items:
              oneOf:
                - $ref: '#/$defs/container-row'
                - $ref: '#/$defs/predicate-cell-row'
          edges:
            type: array
            minItems: 1
            items: {$ref: '#/$defs/container-edge'}

  predicate-width-conversion:
    allOf:
      - $ref: '#/$defs/common'
      - type: object
        required: [source_element_bits, source, result]
        additionalProperties: false
        properties:
          id: {$ref: '#/$defs/identifier'}
          caption: {$ref: '#/$defs/nonempty-string'}
          alt_text: {$ref: '#/$defs/nonempty-string'}
          kind: {const: predicate-width-conversion}
          view: {$ref: '#/$defs/view'}
          source_element_bits: {enum: [8, 16]}
          source:
            type: object
            required: [label]
            additionalProperties: false
            properties:
              label: {$ref: '#/$defs/nonempty-string'}
          result:
            type: object
            required: [label, write, element_bits, mapping]
            additionalProperties: false
            properties:
              label: {$ref: '#/$defs/nonempty-string'}
              write: {const: complete}
              element_bits: {enum: [8, 16]}
              mapping:
                type: object
                required: [source_start, destination_start, count]
                additionalProperties: false
                properties:
                  source_start:
                    oneOf:
                      - {$ref: '#/$defs/nonnegative-integer'}
                      - {enum: [source-lanes, destination-lanes]}
                  destination_start:
                    oneOf:
                      - {$ref: '#/$defs/nonnegative-integer'}
                      - {enum: [source-lanes, destination-lanes]}
                  count:
                    oneOf:
                      - {$ref: '#/$defs/nonnegative-integer'}
                      - {enum: [source-lanes, destination-lanes]}

  predicate-range-result-groups:
    type: object
    required: [label, element_bits, groups]
    additionalProperties: false
    properties:
      label: {$ref: '#/$defs/nonempty-string'}
      element_bits: {const: 16}
      groups:
        type: array
        minItems: 1
        items:
          type: object
          required: [cells]
          additionalProperties: false
          properties:
            cells:
              type: array
              minItems: 1
              items: {$ref: '#/$defs/bit-cell'}

  predicate-range-generation:
    allOf:
      - $ref: '#/$defs/common'
      - type: object
        additionalProperties: false
        required: [result]
        properties:
          id: {$ref: '#/$defs/identifier'}
          caption: {$ref: '#/$defs/nonempty-string'}
          alt_text: {$ref: '#/$defs/nonempty-string'}
          kind: {const: predicate-range-generation}
          view: {$ref: '#/$defs/view'}
          count:
            type: object
            required: [label, value]
            additionalProperties: false
            properties:
              label: {$ref: '#/$defs/nonempty-string'}
              value: {$ref: '#/$defs/nonnegative-integer'}
          states:
            type: array
            minItems: 1
            items:
              type: object
              required: [id, label, before, after, anchor, after_side]
              additionalProperties: false
              properties:
                id: {$ref: '#/$defs/identifier'}
                label: {$ref: '#/$defs/nonempty-string'}
                before: {$ref: '#/$defs/nonempty-string'}
                after: {$ref: '#/$defs/nonempty-string'}
                anchor: {enum: [start, end]}
                after_side: {enum: [left, right]}
          range:
            type: object
            required: [start, end]
            additionalProperties: false
            properties:
              start:
                oneOf:
                  - {$ref: '#/$defs/nonnegative-integer'}
                  - {$ref: '#/$defs/nonempty-string'}
              end:
                oneOf:
                  - {$ref: '#/$defs/nonnegative-integer'}
                  - {$ref: '#/$defs/nonempty-string'}
          result: {$ref: '#/$defs/predicate-range-result-groups'}
        oneOf:
          - required: [count, range]
            not: {required: [states]}
            properties:
              range:
                properties:
                  start: {const: count}
                  end: {const: lane-count}
          - required: [states, range]
            not: {required: [count]}

  scalar-row:
    type: object
    required: [id, label, role, element_bits, cells]
    additionalProperties: false
    properties:
      id: {$ref: '#/$defs/identifier'}
      label: {$ref: '#/$defs/nonempty-string'}
      role: {enum: [source, destination-after]}
      element_bits: {type: integer, minimum: 1}
      cells:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/cell'}

  scalar:
    type: object
    required: [id, label, role, value]
    additionalProperties: false
    properties:
      id: {$ref: '#/$defs/identifier'}
      label: {$ref: '#/$defs/nonempty-string'}
      role: {enum: [source, destination, index]}
      value: {$ref: '#/$defs/nonempty-string'}

  scalar-connection:
    type: object
    required: [from_kind, from_id, to_kind, to_id, display]
    additionalProperties: false
    properties:
      from_kind: {enum: [row, scalar]}
      from_id: {$ref: '#/$defs/identifier'}
      from_cell: {$ref: '#/$defs/nonnegative-integer'}
      to_kind: {enum: [row, scalar]}
      to_id: {$ref: '#/$defs/identifier'}
      to_cell: {$ref: '#/$defs/nonnegative-integer'}
      display: {enum: [transfer, control]}

  scalar-vector-transfer:
    allOf:
      - $ref: '#/$defs/common'
      - type: object
        required: [rows, scalars, connections]
        additionalProperties: false
        properties:
          id: {$ref: '#/$defs/identifier'}
          caption: {$ref: '#/$defs/nonempty-string'}
          alt_text: {$ref: '#/$defs/nonempty-string'}
          kind: {const: scalar-vector-transfer}
          view: {$ref: '#/$defs/view'}
          rows:
            type: array
            minItems: 1
            items: {$ref: '#/$defs/scalar-row'}
          scalars:
            type: array
            minItems: 1
            items: {$ref: '#/$defs/scalar'}
          connections:
            type: array
            minItems: 1
            items: {$ref: '#/$defs/scalar-connection'}

  labeled-cells:
    type: object
    required: [label, cells]
    additionalProperties: false
    properties:
      label: {$ref: '#/$defs/nonempty-string'}
      cells:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/cell'}

  predicate-section:
    type: object
    required: [label, element_bits, cells]
    additionalProperties: false
    properties:
      label: {$ref: '#/$defs/nonempty-string'}
      element_bits: {const: 8}
      cells:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/cell'}

  simple-connection:
    type: object
    required: [from_row, from_cell, to_row, to_cell, display]
    additionalProperties: false
    properties:
      from_row: {$ref: '#/$defs/identifier'}
      from_cell: {$ref: '#/$defs/nonnegative-integer'}
      to_row: {$ref: '#/$defs/identifier'}
      to_cell: {$ref: '#/$defs/nonnegative-integer'}
      display: {enum: [transfer, control]}

  predicated-vector-load:
    allOf:
      - $ref: '#/$defs/common'
      - type: object
        required: [element_bits, base, address, memory, result, predicate, connections]
        additionalProperties: false
        properties:
          id: {$ref: '#/$defs/identifier'}
          caption: {$ref: '#/$defs/nonempty-string'}
          alt_text: {$ref: '#/$defs/nonempty-string'}
          kind: {const: predicated-vector-load}
          view: {$ref: '#/$defs/view'}
          element_bits: {enum: [8, 16, 32, 64]}
          base:
            type: object
            required: [label, value]
            additionalProperties: false
            properties:
              label: {$ref: '#/$defs/nonempty-string'}
              value: {$ref: '#/$defs/nonempty-string'}
          address: {$ref: '#/$defs/labeled-cells'}
          memory: {$ref: '#/$defs/labeled-cells'}
          result: {$ref: '#/$defs/labeled-cells'}
          predicate: {$ref: '#/$defs/predicate-section'}
          connections:
            type: array
            minItems: 1
            items: {$ref: '#/$defs/simple-connection'}

  predicated-vector-reduction:
    allOf:
      - $ref: '#/$defs/common'
      - type: object
        required: [element_bits, predicate, source, selected, fold, result]
        additionalProperties: false
        properties:
          id: {$ref: '#/$defs/identifier'}
          caption: {$ref: '#/$defs/nonempty-string'}
          alt_text: {$ref: '#/$defs/nonempty-string'}
          kind: {const: predicated-vector-reduction}
          view: {$ref: '#/$defs/view'}
          element_bits: {enum: [8, 16, 32, 64]}
          predicate: {$ref: '#/$defs/predicate-section'}
          source: {$ref: '#/$defs/labeled-cells'}
          selected:
            type: array
            minItems: 1
            items: {$ref: '#/$defs/nonnegative-integer'}
          fold:
            type: object
            required: [label, terms, continuation]
            additionalProperties: false
            properties:
              label: {$ref: '#/$defs/nonempty-string'}
              terms:
                type: array
                minItems: 1
                items: {$ref: '#/$defs/nonempty-string'}
              continuation: {type: boolean}
          result:
            type: object
            required: [label, value]
            additionalProperties: false
            properties:
              label: {$ref: '#/$defs/nonempty-string'}
              value: {$ref: '#/$defs/nonempty-string'}

  conversion-section:
    type: object
    required: [label, element_bits, containers]
    additionalProperties: false
    properties:
      label: {$ref: '#/$defs/nonempty-string'}
      element_bits: {enum: [16, 32, 64]}
      containers:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/container'}

  floating-point-width-conversion:
    allOf:
      - $ref: '#/$defs/common'
      - type: object
        required: [container_bits, source, result, predicate, connections]
        additionalProperties: false
        properties:
          id: {$ref: '#/$defs/identifier'}
          caption: {$ref: '#/$defs/nonempty-string'}
          alt_text: {$ref: '#/$defs/nonempty-string'}
          kind: {const: floating-point-width-conversion}
          view: {$ref: '#/$defs/view'}
          container_bits: {enum: [32, 64]}
          source: {$ref: '#/$defs/conversion-section'}
          result: {$ref: '#/$defs/conversion-section'}
          predicate: {$ref: '#/$defs/predicate-section'}
          connections:
            type: array
            minItems: 1
            items: {$ref: '#/$defs/container-edge'}

$schema: https://json-schema.org/draft/2020-12/schema
$id: bedrock://schemas/page-table-entry
title: Bedrock page-table-entry layout
type: object
additionalProperties: false
required: [id, bits, common_fields, layouts]
properties:
  id:
    const: PTE
  bits:
    const: 64
  common_fields:
    $ref: '#/$defs/fields'
  layouts:
    type: object
    additionalProperties: false
    required: [leaf, table_pointer]
    properties:
      leaf:
        $ref: '#/$defs/layout'
      table_pointer:
        $ref: '#/$defs/layout'
$defs:
  layout:
    type: object
    additionalProperties: false
    required: [fields]
    properties:
      fields:
        $ref: '#/$defs/fields'
  fields:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, lsb, bits]
      properties:
        id:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        lsb:
          type: integer
          minimum: 0
        bits:
          type: integer
          minimum: 1

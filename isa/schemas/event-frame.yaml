$schema: https://json-schema.org/draft/2020-12/schema
$id: bedrock://schemas/event-frame
title: Bedrock architectural event frame
type: object
additionalProperties: false
required: [id, slot_bits, slots]
properties:
  id:
    const: EVENT_FRAME
  slot_bits:
    const: 64
  slots:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, offset]
      properties:
        id:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        offset:
          type: integer
          minimum: 0
        fields:
          type: array
          items:
            $ref: '#/$defs/field'
$defs:
  field:
    type: object
    additionalProperties: false
    required: [id, lsb, bits]
    properties:
      id:
        type: string
        pattern: ^[A-Z][A-Z0-9_]*$
      lsb:
        type: integer
        minimum: 0
      bits:
        type: integer
        minimum: 1

$schema: https://json-schema.org/draft/2020-12/schema
$id: bedrock://schemas/cpuid-leaf
title: Bedrock CPUID leaf fragment
type: object
additionalProperties: false
required: [id, name, queries]
properties:
  id:
    type: string
    pattern: ^[A-Z][A-Z0-9_]*$
  name:
    type: string
    minLength: 1
  value:
    type: integer
    minimum: 0
    maximum: 65535
  extends:
    type: string
    pattern: ^(?:base|[A-Z][A-Z0-9_]*)\.cpuid\.[A-Z][A-Z0-9_]*\.[A-Z][A-Z0-9_]*$
  layouts:
    type: object
    propertyNames:
      pattern: ^[A-Z][A-Z0-9_]*$
    additionalProperties:
      $ref: '#/$defs/layout'
  queries:
    type: array
    items:
      $ref: '#/$defs/query'
not:
  required: [value, extends]
$defs:
  layout:
    type: object
    additionalProperties: false
    required: [fields]
    properties:
      fields:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/field'
  query:
    type: object
    additionalProperties: false
    required: [id, index]
    properties:
      id:
        type: string
        pattern: ^[A-Z][A-Z0-9_]*$
      index:
        oneOf:
          - type: integer
            minimum: 0
            maximum: 65535
          - $ref: '#/$defs/index_range'
      layout:
        type: string
        pattern: ^[A-Z][A-Z0-9_]*$
      fields:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/field'
  index_range:
    type: object
    additionalProperties: false
    required: [first, last]
    properties:
      first:
        type: integer
        minimum: 0
        maximum: 65535
      last:
        type: integer
        minimum: 0
        maximum: 65535
      stride:
        type: integer
        minimum: 1
        maximum: 65536
  field:
    type: object
    additionalProperties: false
    required: [id, lsb, bits]
    properties:
      id:
        type: string
        pattern: ^[A-Z][A-Z0-9_]*$
      lsb:
        type: integer
        minimum: 0
        maximum: 63
      bits:
        type: integer
        minimum: 1
        maximum: 64
x-interpretation-rules:
  - The containing directory name equals id.
  - value allocates a new 16-bit leaf value in the containing class.
  - extends reopens an existing leaf without repeating its numeric value.
  - A root leaf contributed by an extension to numeric class 1 omits both value and extends; its value is derived from that extension's sole class-1 leaf-0 directory bit.
  - Query index ranges are inclusive; omitted stride is one.
  - A query may use one local layout and may add fields of its own.
  - Unallocated result bits are reserved and return zero.
  - Query and field references use <owner>.cpuid.<class>.<leaf>.<query>[.<field>].

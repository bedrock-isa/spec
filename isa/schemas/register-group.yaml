$schema: https://json-schema.org/draft/2020-12/schema
$id: bedrock://schemas/register-group
title: Bedrock architectural register group
type: object
additionalProperties: false
required: [width]
properties:
  width:
    oneOf:
    - type: integer
      minimum: 1
    - type: object
      minProperties: 1
      maxProperties: 1
      propertyNames:
        enum: [MAX_VLEN, MAX_VLEN / 8]
      additionalProperties:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: integer
          minimum: 1
  summary:
    type: string
    minLength: 1
  reset:
    $ref: '#/$defs/reset'
  series:
    type: object
    additionalProperties: false
    required: [prefix, count]
    properties:
      prefix:
        type: string
        pattern: ^[A-Z][A-Z0-9_]*$
      count:
        type: integer
        minimum: 1
$defs:
  reset:
    oneOf:
    - type: integer
      minimum: 0
    - type: object
      additionalProperties: false
      required: [from]
      properties:
        from:
          type: string
          pattern: ^(?:base|[A-Z][A-Z0-9_]*)\.(?:registers\.[A-Z][A-Z0-9_]*|control_registers)\.[A-Z][A-Z0-9_]*$
    - type: object
      additionalProperties: false
      required: [cold, warm]
      properties:
        cold: {enum: [platform]}
        warm: {enum: [preserve]}

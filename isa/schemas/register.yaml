$schema: https://json-schema.org/draft/2020-12/schema
$id: bedrock://schemas/register
title: Bedrock architectural register
type: object
additionalProperties: false
properties:
  encoding:
    type: integer
    minimum: 0
  summary:
    type: string
    minLength: 1
  reset:
    oneOf:
    - type: integer
      minimum: 0
    - type: object
      additionalProperties: false
      required: [from]
      properties:
        from:
          type: string
          pattern: ^(?:base|[A-Z][A-Z0-9_]*)\.(?:registers\.[A-Z][A-Z0-9_]*|control_registers)\.[A-Z][A-Z0-9_]*$
    - type: object
      additionalProperties: false
      required: [cold, warm]
      properties:
        cold: {enum: [platform]}
        warm: {enum: [preserve]}

$schema: https://json-schema.org/draft/2020-12/schema
$id: bedrock://schemas/register-layout
title: Bedrock architectural register layout
type: object
additionalProperties: false
required: [bits, fields]
properties:
  bits:
    type: integer
    minimum: 1
  fields:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, lsb, bits]
      properties:
        id:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        lsb:
          type: integer
          minimum: 0
        bits:
          type: integer
          minimum: 1
        summary:
          type: string
          minLength: 1

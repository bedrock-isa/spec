$schema: https://json-schema.org/draft/2020-12/schema
$id: https://bedrock-isa.org/schemas/memory-record.yaml
title: Bedrock byte-addressed memory record
type: object
additionalProperties: false
required: [id, name, alignment_bytes, components]
properties:
  id:
    $ref: '#/$defs/identifier'
  name:
    $ref: '#/$defs/nonempty-string'
  alignment_bytes:
    type: integer
    minimum: 1
  parameter:
    type: object
    additionalProperties: false
    required: [id, description, values]
    properties:
      id:
        $ref: '#/$defs/identifier'
      description:
        $ref: '#/$defs/nonempty-string'
      values:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: integer
          minimum: 1
  components:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, label, element_bytes]
      properties:
        id:
          $ref: '#/$defs/identifier'
        label:
          $ref: '#/$defs/nonempty-string'
        count:
          type: integer
          minimum: 1
        element_bytes:
          oneOf:
            - type: integer
              minimum: 1
            - type: object
              additionalProperties: false
              required: [parameter]
              properties:
                parameter:
                  $ref: '#/$defs/identifier'
                divisor:
                  type: integer
                  minimum: 1
        fixed_value:
          const: zero
        bit_format:
          type: object
          additionalProperties: false
          required: [bits, unassigned, fields]
          properties:
            bits:
              type: integer
              minimum: 1
            unassigned:
              const: zero
            fields:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [id, label, lsb, bits]
                properties:
                  id:
                    $ref: '#/$defs/identifier'
                  label:
                    $ref: '#/$defs/nonempty-string'
                  diagram_label:
                    $ref: '#/$defs/nonempty-string'
                  lsb:
                    type: integer
                    minimum: 0
                  bits:
                    type: integer
                    minimum: 1

$defs:
  identifier:
    type: string
    pattern: '^[A-Z][A-Z0-9_]*$'
  nonempty-string:
    type: string
    minLength: 1

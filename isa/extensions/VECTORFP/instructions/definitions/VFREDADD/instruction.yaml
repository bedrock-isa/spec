mnemonic: VFREDADD
name: Vector Floating-Point Add Reduction
summary: Reduces active floating-point elements to one scalar sum.
route: vector
sail_entries:
- execute_VFREDADD
privileged: false
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: write
    value_type: floating

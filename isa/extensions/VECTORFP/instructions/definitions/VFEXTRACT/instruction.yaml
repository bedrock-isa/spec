name: Vector Floating-Point Lane Extract
summary: Copies one indexed floating-point vector lane to a floating-point scalar register.
route: vector
privileged: false
operands:
  src:
    role: source
    access: read
    value_type: vector
  index:
    role: count
    access: read
    value_type: integer
  dst:
    role: destination
    access: write
    value_type: floating

encodings:
  h_s_d_z_vn_v_rn_r_fn_s:
    pattern: 11111101111110000zz10rrrrssssvvvvv
    syntax: VFEXTRACT.{H|S|D}(z) Vn(v), Rn(r), Fn(s)
    fields:
      z:
        role: size
        type: VECTOR.field_types.SIZE_HSD
      r:
        role: index
        type: base.field_types.Rn
      s:
        role: dst
        type: FP.field_types.Fn
      v:
        role: src
        type: VECTOR.field_types.Vn
    constraints:
    - role: size
      allow:
      - 0x1..0x3
      reason: reserved_vector_element_type

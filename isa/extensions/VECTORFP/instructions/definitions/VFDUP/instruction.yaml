mnemonic: VFDUP
name: Vector Floating-Point Duplicate
summary: Broadcasts a floating-point scalar register to every vector lane.
route: vector
sail_entries:
- execute_VFDUP
privileged: false
operands:
  src:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: write
    value_type: vector

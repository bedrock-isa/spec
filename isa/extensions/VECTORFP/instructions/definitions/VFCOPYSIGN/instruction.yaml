mnemonic: VFCOPYSIGN
name: Vector Floating-Point Copy Sign
summary: Combines each active destination magnitude with the corresponding source sign bit.
route: vector
privileged: false
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

mnemonic: VFROUND
name: Vector Floating-Point Round to Integral
summary: Rounds each active floating-point element to an integral value in the same format using the current
  rounding mode.
route: vector
sail_entries:
- execute_VFROUND
privileged: false
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

mnemonic: VFTRUNC
name: Vector Floating-Point Truncate to Integral
summary: Rounds each active floating-point element toward zero to an integral value in the same format.
route: vector
privileged: false
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

mnemonic: VFINSERT
name: Vector Floating-Point Lane Insert
summary: Replaces one indexed vector lane with a floating-point scalar value.
route: vector
privileged: false
operands:
  src:
    role: source
    access: read
    value_type: floating
  index:
    role: count
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: vector

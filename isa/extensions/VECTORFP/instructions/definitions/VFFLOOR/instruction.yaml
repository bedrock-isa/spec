mnemonic: VFFLOOR
name: Vector Floating-Point Floor
summary: Rounds each active floating-point element downward to an integral value in the same format.
route: vector
sail_entries:
- execute_VFFLOOR
privileged: false
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

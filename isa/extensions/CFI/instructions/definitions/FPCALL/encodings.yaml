encodings:
  imm16s:
    pattern: '100000011110010000'
    syntax: FPCALL <imm16s>
    payloads:
    - {role: target, type: base.payload_types.DISP16S}
  imm32s:
    pattern: '100000011110010001'
    syntax: FPCALL <imm32s>
    payloads:
    - {role: target, type: base.payload_types.DISP32S}
  ea_e:
    pattern: 10000001110eeeeeee
    syntax: FPCALL <ea>(e)
    fields:
      e: {role: target, type: base.field_types.EA}
    constraints:
    - role: target
      exclude: [immediate]
      reason: canonical_form_reclaim
  rn_r:
    pattern: 10000001111000rrrr
    syntax: FPCALL Rn(r)
    fields:
      r: {role: target, type: base.field_types.Rn}

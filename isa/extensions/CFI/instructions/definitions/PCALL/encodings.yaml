encodings:
  imm16s:
    pattern: '100000011010010000'
    syntax: PCALL <imm16s>
    payloads:
    - {role: target, type: base.payload_types.DISP16S}
  imm32s:
    pattern: '100000011010010001'
    syntax: PCALL <imm32s>
    payloads:
    - {role: target, type: base.payload_types.DISP32S}
  ea_e:
    pattern: 10000001100eeeeeee
    syntax: PCALL <ea>(e)
    fields:
      e: {role: target, type: base.field_types.EA}
    constraints:
    - role: target
      exclude: [immediate]
      reason: canonical_form_reclaim
  rn_r:
    pattern: 10000001101000rrrr
    syntax: PCALL Rn(r)
    fields:
      r: {role: target, type: base.field_types.Rn}

mnemonic: FNMADD
name: Floating-Point Fused Negative Multiply Add
summary: Performs the floating-point fused negative multiply add operation.
route: fpu
sail_entries:
- execute_FNMADD
privileged: false
repeat:
  type: rep
operands:
  lhs:
    role: source
    access: read
    value_type: floating
  rhs:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: read_write
    value_type: floating

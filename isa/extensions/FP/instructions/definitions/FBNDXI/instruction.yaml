name: Floating-Point Bounds Check Exclusive-Inclusive
summary: Checks floating-point value membership in the exclusive-inclusive interval (lo, hi].
route: fpu
privileged: false
repeat:
  type: rep
operands:
  lo:
    role: source
    access: read
    value_type: floating
  value:
    role: source
    access: read
    value_type: floating
  hi:
    role: source
    access: read
    value_type: floating

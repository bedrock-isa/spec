mnemonic: FSQRT
name: Floating-Point Square Root
summary: Computes the selected-format square root of a floating-point source.
route: fpu
privileged: false
repeat:
  type: rep
operands:
  src:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: write
    value_type: floating

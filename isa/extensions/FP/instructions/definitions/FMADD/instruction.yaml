mnemonic: FMADD
name: Floating-Point Fused Multiply Add
summary: Computes the source product plus the old destination as one fused operation and rounds once.
route: fpu
privileged: false
repeat:
  type: rep
operands:
  lhs:
    role: source
    access: read
    value_type: floating
  rhs:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: read_write
    value_type: floating

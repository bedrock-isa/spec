mnemonic: FFLOOR
name: Floating-Point Floor
summary: Rounds a floating-point source toward negative infinity in the selected format.
route: fpu
sail_entries:
- execute_FFLOOR
privileged: false
repeat:
  type: rep
operands:
  src:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: write
    value_type: floating

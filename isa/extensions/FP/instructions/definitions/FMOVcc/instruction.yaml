mnemonic: FMOVcc
name: Floating-Point Conditional Move
summary: Copies a floating-point source only when the encoded integer condition is true.
route: fpu
privileged: false
repeat:
  type: rep
operands:
  cc:
    role: source
    access: read
    value_type: integer
  src:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: write
    value_type: floating

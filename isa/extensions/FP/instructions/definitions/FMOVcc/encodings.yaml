encodings:
  fn_s_fn_d:
    pattern: 11111000101000ccccssssdddd
    syntax: FMOVcc Fn(s), Fn(d)
    fields:
      c:
        role: cc
        type: base.field_types.CC
      s:
        role: src
        type: FP.field_types.Fn
      d:
        role: dst
        type: FP.field_types.Fn
  s_d_z_ea_e_fn_d:
    pattern: 1111100000zccccddddeeeeeee
    syntax: FMOVcc.{S|D}(z) <ea>(e), Fn(d)
    fields:
      z:
        role: size
        type: FP.field_types.SIZE_SD
      c:
        role: cc
        type: base.field_types.CC
      d:
        role: dst
        type: FP.field_types.Fn
      e:
        role: src
        type: FP.field_types.FEA
  s_d_z_fn_s_ea_e:
    pattern: 1111100001zccccsssseeeeeee
    syntax: FMOVcc.{S|D}(z) Fn(s), <ea>(e)
    fields:
      z:
        role: size
        type: FP.field_types.SIZE_SD
      c:
        role: cc
        type: base.field_types.CC
      s:
        role: src
        type: FP.field_types.Fn
      e:
        role: dst
        type: FP.field_types.FEA
    constraints:
    - role: dst
      exclude:
      - immediate
      reason: invalid_destination

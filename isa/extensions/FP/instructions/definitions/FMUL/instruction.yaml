mnemonic: FMUL
name: Floating-Point Multiply
summary: Multiplies the source and destination values under the floating-point environment.
route: fpu
sail_entries:
- execute_FMUL
privileged: false
repeat:
  type: rep
operands:
  src:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: read_write
    value_type: floating

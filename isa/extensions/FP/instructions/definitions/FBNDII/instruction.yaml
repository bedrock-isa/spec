mnemonic: FBNDII
name: Floating-Point Bounds Check Inclusive-Inclusive
summary: Checks floating-point value membership in the inclusive-inclusive interval [lo, hi].
route: fpu
privileged: false
repeat:
  type: rep
operands:
  lo:
    role: source
    access: read
    value_type: floating
  value:
    role: source
    access: read
    value_type: floating
  hi:
    role: source
    access: read
    value_type: floating

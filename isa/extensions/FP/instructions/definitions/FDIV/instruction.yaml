mnemonic: FDIV
name: Floating-Point Divide
summary: Divides the destination value by the source under the floating-point environment.
route: fpu
sail_entries:
- execute_FDIV
privileged: false
repeat:
  type: rep
operands:
  src:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: read_write
    value_type: floating

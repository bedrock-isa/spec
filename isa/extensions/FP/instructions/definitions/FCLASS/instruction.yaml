mnemonic: FCLASS
name: Floating-Point Classify
summary: Classifies an S- or D-format source into a one-hot integer bitmap without changing FFLAGS.
route: fpu
sail_entries:
- execute_FCLASS
privileged: false
repeat:
  type: rep
operands:
  src:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: write
    value_type: integer

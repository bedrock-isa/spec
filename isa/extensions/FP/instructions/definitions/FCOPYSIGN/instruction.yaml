mnemonic: FCOPYSIGN
name: Floating-Point Copy Sign
summary: Combines a magnitude source with the sign bit of a separate floating-point source.
route: fpu
sail_entries:
- execute_FCOPYSIGN
privileged: false
repeat:
  type: rep
operands:
  sign_src:
    role: source
    access: read
    value_type: floating
  magnitude_src:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: write
    value_type: floating

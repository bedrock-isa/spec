mnemonic: FINT
name: Floating-Point Integral Value
summary: Rounds a floating-point source to an integral value using FSTATUS.RM.
route: fpu
sail_entries:
- execute_FINT
privileged: false
repeat:
  type: rep
operands:
  src:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: write
    value_type: floating

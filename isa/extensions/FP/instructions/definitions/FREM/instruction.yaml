mnemonic: FREM
name: Floating-Point Remainder
summary: Computes the destination remainder using a nearest-even integral quotient.
route: fpu
privileged: false
repeat:
  type: rep
operands:
  src:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: read_write
    value_type: floating

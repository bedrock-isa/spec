mnemonic: FCVT
name: Floating-Point Convert Signed
summary: Converts signed 64-bit integers and S/D floating-point values between supported forms.
route: fpu
sail_entries:
- execute_FCVT
privileged: false
repeat:
  type: rep
operands:
  src:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: write
    value_type: floating

mnemonic: FROUND
name: Floating-Point Round
summary: Rounds a floating-point source to a nearest-even integral value independently of FSTATUS.RM.
route: fpu
sail_entries:
- execute_FROUND
privileged: false
repeat:
  type: rep
operands:
  src:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: write
    value_type: floating

mnemonic: FCVTU
name: Floating-Point Convert Unsigned
summary: Converts unsigned 64-bit integers and S/D floating-point values between supported forms.
route: fpu
sail_entries:
- execute_FCVTU
privileged: false
repeat:
  type: rep
operands:
  src:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: write
    value_type: floating

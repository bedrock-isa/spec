mnemonic: FCEIL
name: Floating-Point Ceiling
summary: Rounds a floating-point source toward positive infinity in the selected format.
route: fpu
privileged: false
repeat:
  type: rep
operands:
  src:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: write
    value_type: floating

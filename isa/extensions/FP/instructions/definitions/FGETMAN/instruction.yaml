mnemonic: FGETMAN
name: Floating-Point Get Mantissa
summary: Produces the normalized significand view of a floating-point source.
route: fpu
privileged: false
repeat:
  type: rep
operands:
  src:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: write
    value_type: floating

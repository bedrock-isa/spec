mnemonic: FABS
name: Floating-Point Absolute Value
summary: Clears the selected floating-point source sign and writes its magnitude.
route: fpu
sail_entries:
- execute_FABS
privileged: false
repeat:
  type: rep
operands:
  src:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: write
    value_type: floating

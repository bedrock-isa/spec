mnemonic: FMSUB
name: Floating-Point Fused Multiply Subtract
summary: Performs the floating-point fused multiply subtract operation.
route: fpu
sail_entries:
- execute_FMSUB
privileged: false
repeat:
  type: rep
operands:
  lhs:
    role: source
    access: read
    value_type: floating
  rhs:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: read_write
    value_type: floating

mnemonic: FSCALE
name: Floating-Point Scale
summary: Scales the destination by a power of two derived from the rounded source.
route: fpu
sail_entries:
- execute_FSCALE
privileged: false
repeat:
  type: rep
operands:
  src:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: read_write
    value_type: floating

mnemonic: FBNDXX
name: Floating-Point Bounds Check Exclusive-Exclusive
summary: Checks floating-point value membership in the exclusive-exclusive interval (lo, hi).
route: fpu
sail_entries:
- execute_FBNDXX
privileged: false
repeat:
  type: rep
operands:
  lo:
    role: source
    access: read
    value_type: floating
  value:
    role: source
    access: read
    value_type: floating
  hi:
    role: source
    access: read
    value_type: floating

name: Floating-Point Fused Negative Multiply Subtract
summary: Computes the old destination minus the source product as one fused operation and rounds once.
route: fpu
privileged: false
repeat:
  type: rep
operands:
  lhs:
    role: source
    access: read
    value_type: floating
  rhs:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: read_write
    value_type: floating

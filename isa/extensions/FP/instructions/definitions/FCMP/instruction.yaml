mnemonic: FCMP
name: Floating-Point Compare
summary: Compares two floating-point operands and writes their relation to integer condition flags.
route: fpu
sail_entries:
- execute_FCMP
privileged: false
repeat:
  type: rep
operands:
  src:
    role: source
    access: read
    value_type: floating
  dst:
    role: source
    access: read
    value_type: floating

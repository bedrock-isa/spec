field_types:
  Fn:
    type: register_selector
    register_group: FP.registers.FPR
    bits: 4
  FEA:
    type: effective_address
    profile: fea
    bits: 7
  FPAIRn:
    type: register_pair_selector
    register_group: FP.registers.FPR
    bits: 3
  SIZE_SD:
    type: size_selector
    bits: 1
    values:
      - {value: 0, code: S}
      - {value: 1, code: D}
  SIZE_HD:
    type: size_selector
    bits: 1
    values:
      - {value: 0, code: H}
      - {value: 1, code: D}
  SIZE_HS:
    type: size_selector
    bits: 1
    values:
      - {value: 0, code: H}
      - {value: 1, code: S}
  SIZE_BWLQ:
    type: size_selector
    bits: 2
    values:
      - {value: 0, code: B}
      - {value: 1, code: W}
      - {value: 2, code: L}
      - {value: 3, code: Q}

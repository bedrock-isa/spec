name: Approximate Floating-Point Tangent
summary: Approximates tangent in radians over the reduced interval from minus pi/4 to pi/4.
route: fpu_transcendental_approx
privileged: false
repeat:
  type: rep
operands:
  src:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: write
    value_type: floating

name: Approximate Floating-Point e To x Minus One
summary: Approximates e raised to the source minus one without an intermediate rounded exponential.
route: fpu_transcendental_approx
privileged: false
repeat:
  type: rep
operands:
  src:
    role: source
    access: read
    value_type: floating
  dst:
    role: destination
    access: write
    value_type: floating

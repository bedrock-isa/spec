name: Vector Duplicate
summary: Broadcasts an integer scalar register or immediate value to every vector lane.
route: vector
privileged: false
operands:
  src:
    role: source
    access: read
    value_type: integer
  immediate:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: write
    value_type: vector

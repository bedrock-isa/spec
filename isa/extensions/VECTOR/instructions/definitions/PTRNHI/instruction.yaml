mnemonic: PTRNHI
name: Predicate Odd-Lane Transpose
summary: Interleave odd-position predicate lanes from two sources.
route: vector
privileged: false
operands:
  lhs:
    role: source
    access: read
    value_type: predicate
  rhs:
    role: source
    access: read
    value_type: predicate
  dst:
    role: destination
    access: read_write
    value_type: predicate

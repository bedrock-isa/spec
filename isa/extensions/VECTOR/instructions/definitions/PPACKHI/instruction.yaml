mnemonic: PPACKHI
name: Predicate Pack to Upper Half
summary: Packs source predicate positions into the upper half of narrower destination positions.
route: vector
sail_entries:
- execute_PPACKHI
privileged: false
assembly:
  width_suffix_aliases: true
operands:
  src:
    role: source
    access: read
    value_type: predicate
  dst:
    role: destination
    access: read_write
    value_type: predicate

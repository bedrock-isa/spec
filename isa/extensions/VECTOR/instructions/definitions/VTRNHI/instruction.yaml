mnemonic: VTRNHI
name: Vector Odd-Lane Transpose
summary: Interleave odd lanes from the old destination and source by adjacent result pairs.
route: vector
sail_entries:
- execute_VTRNHI
privileged: false
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

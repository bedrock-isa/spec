mnemonic: PLOOP
name: Predicate Loop Chunk
summary: Builds the next predicate chunk from a remaining count and lane offset.
route: vector
privileged: false
operands:
  remaining:
    role: counter
    access: read_write
    value_type: integer
  offset:
    role: counter
    access: read_write
    value_type: integer
  predicate:
    role: destination
    access: read_write
    value_type: predicate
  target:
    role: control_target
    access: read
    value_type: integer

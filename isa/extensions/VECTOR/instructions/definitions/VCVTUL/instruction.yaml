mnemonic: VCVTUL
name: Vector Convert to Unsigned Longword
summary: Converts active floating-point elements to unsigned longwords.
route: vector
sail_entries:
- execute_VCVTUL
privileged: false
additional_cpuid_flags:
- FP.cpuid.EXTENSIONS.DIRECTORY.FEATURES.FP
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

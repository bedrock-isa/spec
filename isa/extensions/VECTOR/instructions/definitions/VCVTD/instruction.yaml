mnemonic: VCVTD
name: Vector Convert to Double Precision
summary: Converts active half-precision, single-precision, or signed integer elements to double precision.
route: vector
sail_entries:
- execute_VCVTD
privileged: false
additional_cpuid_flags:
- FP.cpuid.EXTENSIONS.DIRECTORY.FEATURES.FP
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

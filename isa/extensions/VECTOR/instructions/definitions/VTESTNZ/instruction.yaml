mnemonic: VTESTNZ
name: Vector Bitwise Test Nonzero
summary: Sets significant result bits where the governed element-wise AND is nonzero and clears all other
  bits.
route: vector
privileged: false
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  lhs:
    role: source
    access: read
    value_type: vector
  rhs:
    role: source
    access: read
    value_type: vector
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: write
    value_type: predicate

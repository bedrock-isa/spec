mnemonic: VADD
name: Vector Add
summary: Adds corresponding active vector elements using integer or floating-point arithmetic.
route: vector
sail_entries:
- execute_VADD_integer
- execute_VADD_floating
privileged: false
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

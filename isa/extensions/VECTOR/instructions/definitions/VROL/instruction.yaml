mnemonic: VROL
name: Vector Rotate Left
summary: Rotates each active integer element left by its selected-width count.
route: vector
sail_entries:
- execute_VROL
privileged: false
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  count:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: vector

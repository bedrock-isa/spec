mnemonic: VSCATTER
name: Resumable Vector Scatter
summary: Scatter governed vector lanes while journaling completed lanes in a predicate.
route: vector
sail_entries:
- execute_VSCATTER
privileged: false
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  completion:
    role: destination
    access: read_write
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  base:
    role: source
    access: read
    value_type: integer
  stride:
    role: source
    access: read
    value_type: integer
  address:
    role: source
    access: read
    value_type: vector
  disp8s:
    role: source
    access: read
    value_type: integer
  disp16s:
    role: source
    access: read
    value_type: integer
  disp32s:
    role: source
    access: read
    value_type: integer
  disp64:
    role: source
    access: read
    value_type: integer

mnemonic: VMUL
name: Vector Multiply
summary: Multiplies corresponding active integer or floating-point elements.
route: vector
sail_entries:
- execute_VMUL_integer
- execute_VMUL_floating
privileged: false
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

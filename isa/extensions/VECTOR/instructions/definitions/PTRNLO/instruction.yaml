mnemonic: PTRNLO
name: Predicate Even-Lane Transpose
summary: Interleave even-position predicate lanes from two sources.
route: vector
sail_entries:
- execute_PTRNLO
privileged: false
assembly:
  width_suffix_aliases: true
operands:

mnemonic: VUZIPHI
name: Vector Odd-Lane Deinterleave
summary: Gather odd lanes from the old destination and source into separate result halves.
route: vector
sail_entries:
- execute_VUZIPHI
privileged: false
assembly:
  width_suffix_aliases: true

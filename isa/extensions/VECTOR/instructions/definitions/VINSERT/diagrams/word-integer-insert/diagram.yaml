caption: "VINSERT.W indexed lane replacement"
alt_text: "The scalar value x replaces Vd lane i, and every other lane retains its old destination value."
kind: scalar-vector-transfer
view: {visible_bytes: 16, lane_order: right-to-left, scalable: true}
rows:
- id: result
  label: Vd
  role: destination-after
  element_bits: 16
  cells:
  - {value: d0, effect: preserve, appearance: old}
  - {value: d1, effect: preserve, appearance: old}
  - {value: d2, effect: preserve, appearance: old}
  - {value: x, effect: copy, appearance: selected-source}
  - {value: d4, effect: preserve, appearance: old}
  - {value: d5, effect: preserve, appearance: old}
  - {value: d6, effect: preserve, appearance: old}
  - {value: d7, effect: preserve, appearance: old}
scalars:
- {id: scalar, label: source Rn, role: source, value: x}
- {id: index, label: index Rn, role: index, value: i}
connections:
- {from_kind: scalar, from_id: scalar, to_kind: row, to_id: result, to_cell: 3, display: transfer}
- {from_kind: scalar, from_id: index, to_kind: row, to_id: result, to_cell: 3, display: control}

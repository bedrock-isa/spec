mnemonic: VINSERT
name: Vector Lane Insert
summary: Replaces one indexed vector lane with an integer scalar value.
route: vector
privileged: false
operands:
  src:
    role: source
    access: read
    value_type: integer
  index:
    role: count
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: vector

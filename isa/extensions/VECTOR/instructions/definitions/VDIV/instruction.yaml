mnemonic: VDIV
name: Vector Floating-Point Divide
summary: Divides corresponding active floating-point elements.
route: vector
sail_entries:
- execute_VDIV
privileged: false
additional_cpuid_flags:
- FP.cpuid.EXTENSIONS.DIRECTORY.FEATURES.FP
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

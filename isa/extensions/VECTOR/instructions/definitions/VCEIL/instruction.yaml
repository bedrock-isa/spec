mnemonic: VCEIL
name: Vector Ceiling
summary: Rounds each active floating-point element upward to an integral value in the same format.
route: vector
sail_entries:
- execute_VCEIL
privileged: false
additional_cpuid_flags:
- FP.cpuid.EXTENSIONS.DIRECTORY.FEATURES.FP
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

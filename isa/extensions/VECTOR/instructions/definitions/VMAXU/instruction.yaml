mnemonic: VMAXU
name: Vector Unsigned Maximum
summary: Selects the greater unsigned value from each active destination/source element pair.
route: vector
privileged: false
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

mnemonic: VREDMAX
name: Vector Floating-Point Maximum Reduction
summary: Reduces active floating-point elements to one maximum value.
route: vector
sail_entries:
- execute_VREDMAX
privileged: false
additional_cpuid_flags:
- FP.cpuid.EXTENSIONS.DIRECTORY.FEATURES.FP
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: write
    value_type: floating

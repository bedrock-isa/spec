mnemonic: PUNPKHI
name: Predicate Unpack from Upper Half
summary: Unpacks the upper half of source predicate positions into wider destination positions.
route: vector
privileged: false
operands:
  src:
    role: source
    access: read
    value_type: predicate
  dst:
    role: destination
    access: read_write
    value_type: predicate

id: "upper-half"
caption: "PZIPHI.W upper-half predicate interleave"
alt_text: "In this fixed 16-byte example, new Pd alternates typed predicate lanes from the upper halves of Pa and Pb. Larger VLEN begins at half its architectural typed lane count."

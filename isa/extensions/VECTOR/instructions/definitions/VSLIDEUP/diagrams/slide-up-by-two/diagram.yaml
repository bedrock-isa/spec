id: "slide-up-by-two"
caption: "VSLIDEUP.W slide up by two lanes"
alt_text: "At W width and count 2, each active result lane copies old Vd at an index two lower or becomes zero when its index is below the count; inactive lanes preserve their old destination values."
kind: vector-lane-transfer
view: {visible_bytes: 16, lane_order: right-to-left, scalable: true}
rows:
- id: old-destination
  label: old Vd
  role: destination-before
  element_bits: 16
  cells:
  - {value: 'd[0]', effect: copy, appearance: old}
  - {value: 'd[1]', effect: copy, appearance: old}
  - {value: 'd[2]', effect: copy, appearance: old}
  - {value: 'd[3]', effect: copy, appearance: old}
  - {value: 'd[4]', effect: copy, appearance: old}
  - {value: 'd[5]', effect: copy, appearance: old}
  - {value: 'd[6]', effect: copy, appearance: old}
  - {value: 'd[7]', effect: copy, appearance: old}
- id: new-destination
  label: new Vd
  role: destination-after
  element_bits: 16
  cells:
  - {value: '0', effect: zero, appearance: zero}
  - {value: 'd[1]', effect: preserve, appearance: old}
  - {value: 'd[0]', effect: copy, appearance: old}
  - {value: 'd[3]', effect: preserve, appearance: old}
  - {value: 'd[2]', effect: copy, appearance: old}
  - {value: 'd[5]', effect: preserve, appearance: old}
  - {value: 'd[4]', effect: copy, appearance: old}
  - {value: 'd[7]', effect: preserve, appearance: old}
- id: predicate
  label: predicate Pp
  role: predicate
  element_bits: 8
  cells:
  - {value: '1', effect: set, appearance: predicate-on}
  - {value: 'x', effect: ignored, appearance: dont-care}
  - {value: '0', effect: clear, appearance: predicate-off}
  - {value: 'x', effect: ignored, appearance: dont-care}
  - {value: '1', effect: set, appearance: predicate-on}
  - {value: 'x', effect: ignored, appearance: dont-care}
  - {value: '0', effect: clear, appearance: predicate-off}
  - {value: 'x', effect: ignored, appearance: dont-care}
  - {value: '1', effect: set, appearance: predicate-on}
  - {value: 'x', effect: ignored, appearance: dont-care}
  - {value: '0', effect: clear, appearance: predicate-off}
  - {value: 'x', effect: ignored, appearance: dont-care}
  - {value: '1', effect: set, appearance: predicate-on}
  - {value: 'x', effect: ignored, appearance: dont-care}
  - {value: '0', effect: clear, appearance: predicate-off}
  - {value: 'x', effect: ignored, appearance: dont-care}
edges:
- {from_row: old-destination, from_cell: 0, to_row: new-destination, to_cell: 2, effect: copy}
- {from_row: old-destination, from_cell: 2, to_row: new-destination, to_cell: 4, effect: copy}
- {from_row: old-destination, from_cell: 4, to_row: new-destination, to_cell: 6, effect: copy}

mnemonic: VSLIDEUP
name: Vector Slide Up
summary: Move old destination lanes toward higher indices and zero vacated lanes.
route: vector
privileged: false
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  count:
    role: count
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: vector

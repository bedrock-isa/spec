id: "word-integer-reduction"
caption: "VREDADD.W integer reduction"
alt_text: "The active word values v0, v2, v5, and v7 are folded from the zero identity modulo 65,536 (2^16); the sum is zero-extended into Rn."
kind: predicated-vector-reduction
view: {visible_bytes: 16, lane_order: right-to-left, scalable: true}
element_bits: 16
predicate:
  label: predicate Pp
  element_bits: 8
  cells:
  - {value: '1', effect: set, appearance: predicate-on}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: '0', effect: clear, appearance: predicate-off}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: '1', effect: set, appearance: predicate-on}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: '0', effect: clear, appearance: predicate-off}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: '0', effect: clear, appearance: predicate-off}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: '1', effect: set, appearance: predicate-on}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: '0', effect: clear, appearance: predicate-off}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: '1', effect: set, appearance: predicate-on}
  - {value: x, effect: ignored, appearance: dont-care}
source:
  label: source Vn
  cells:
  - {value: v0, effect: copy, appearance: source}
  - {value: v1, effect: ignored, appearance: discarded}
  - {value: v2, effect: copy, appearance: source}
  - {value: v3, effect: ignored, appearance: discarded}
  - {value: v4, effect: ignored, appearance: discarded}
  - {value: v5, effect: copy, appearance: source}
  - {value: v6, effect: ignored, appearance: discarded}
  - {value: v7, effect: copy, appearance: source}
selected: [0, 2, 5, 7]
fold:
  label: fold
  terms: ['0', v0, v2, v5, v7]
  continuation: true
result: {label: new Rn, value: 'zext(sum)'}

id: "quad-low-long"
caption: "VTRUNCL.Q low-longword truncation"
alt_text: "An illustrative Q-container VTRUNCL view: each active container copies the low source longword into the low destination longword and preserves the old destination high longword; inactive containers preserve the complete old destination value."
kind: integer-width-conversion
view: {visible_bytes: 16, lane_order: right-to-left, scalable: true}
container_bits: 64
rows:
- id: source
  label: source Vn
  role: source
  containers:
  - cells:
    - {value: nH0, effect: ignored, appearance: discarded, bits: 32}
    - {value: nL0, effect: copy, appearance: source, bits: 32}
  - cells:
    - {value: nH1, effect: ignored, appearance: discarded, bits: 32}
    - {value: nL1, effect: copy, appearance: source, bits: 32}
- id: result
  label: Vd
  role: destination-after
  containers:
  - cells:
    - {value: dH0, effect: preserve, appearance: old, bits: 32}
    - {value: nL0, effect: copy, appearance: source, bits: 32}
  - cells:
    - {value: 'dH1:dL1', effect: preserve, appearance: old, bits: 64}
- id: predicate
  label: predicate Pp
  role: predicate
  element_bits: 8
  cells:
  - {value: '1', effect: set, appearance: predicate-on}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: '0', effect: clear, appearance: predicate-off}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: x, effect: ignored, appearance: dont-care}
edges:
- {from_row: source, from_container: 0, from_cell: 1, to_row: result, to_container: 0, to_cell: 1, effect: copy, display: transfer}

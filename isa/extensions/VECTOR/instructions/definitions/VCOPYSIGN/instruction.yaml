mnemonic: VCOPYSIGN
name: Vector Copy Sign
summary: Combines each active destination magnitude with the corresponding source sign bit.
route: vector
sail_entries:
- execute_VCOPYSIGN
privileged: false
additional_cpuid_flags:
- FP.cpuid.EXTENSIONS.DIRECTORY.FEATURES.FP
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

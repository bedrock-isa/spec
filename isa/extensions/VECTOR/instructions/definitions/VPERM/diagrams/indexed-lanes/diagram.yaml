id: "indexed-lanes"
caption: "VPERM.W indexed lane selection"
alt_text: "At W width, each active result lane selects the old Vd lane named by its index; inactive lanes preserve their old destination values."
kind: vector-lane-transfer
view: {visible_bytes: 16, lane_order: right-to-left, scalable: true}
rows:
- id: old-destination
  label: old Vd
  role: destination-before
  element_bits: 16
  cells:
  - {value: 'd[0]', effect: copy}
  - {value: 'd[1]', effect: copy}
  - {value: 'd[2]', effect: copy}
  - {value: 'd[3]', effect: copy}
  - {value: 'd[4]', effect: copy}
  - {value: 'd[5]', effect: copy}
  - {value: 'd[6]', effect: copy}
  - {value: 'd[7]', effect: copy}
- id: indices
  label: indices Vn
  role: source
  element_bits: 16
  cells:
  - {value: '3', effect: copy}
  - {value: '0', effect: preserve}
  - {value: '6', effect: copy}
  - {value: '1', effect: preserve}
  - {value: '7', effect: copy}
  - {value: '2', effect: preserve}
  - {value: '4', effect: copy}
  - {value: '5', effect: preserve}
- id: new-destination
  label: new Vd
  role: destination-after
  element_bits: 16
  cells:
  - {value: 'd[3]', effect: copy}
  - {value: 'd[1]', effect: preserve}
  - {value: 'd[6]', effect: copy}
  - {value: 'd[3]', effect: preserve}
  - {value: 'd[7]', effect: copy}
  - {value: 'd[5]', effect: preserve}
  - {value: 'd[4]', effect: copy}
  - {value: 'd[7]', effect: preserve}
edges:
- {from_row: old-destination, from_cell: 3, to_row: new-destination, to_cell: 0, effect: copy}
- {from_row: old-destination, from_cell: 1, to_row: new-destination, to_cell: 1, effect: preserve}
- {from_row: old-destination, from_cell: 6, to_row: new-destination, to_cell: 2, effect: copy}
- {from_row: old-destination, from_cell: 3, to_row: new-destination, to_cell: 3, effect: preserve}
- {from_row: old-destination, from_cell: 7, to_row: new-destination, to_cell: 4, effect: copy}
- {from_row: old-destination, from_cell: 5, to_row: new-destination, to_cell: 5, effect: preserve}
- {from_row: old-destination, from_cell: 4, to_row: new-destination, to_cell: 6, effect: copy}
- {from_row: old-destination, from_cell: 7, to_row: new-destination, to_cell: 7, effect: preserve}

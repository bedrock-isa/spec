mnemonic: VPERM
name: Vector Permute
summary: Select source lanes with vector indices; out-of-range indices produce zero.
route: vector
sail_entries:
- execute_VPERM
privileged: false
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

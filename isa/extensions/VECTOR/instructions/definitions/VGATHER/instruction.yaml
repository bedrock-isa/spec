name: Resumable Vector Gather
summary: Gather governed vector lanes while journaling completed lanes in a predicate.
route: vector
privileged: false
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  completion:
    role: destination
    access: read_write
    value_type: predicate
  base:
    role: source
    access: read
    value_type: integer
  stride:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: vector
  address:
    role: source
    access: read
    value_type: vector
  disp8s:
    role: source
    access: read
    value_type: integer
  disp16s:
    role: source
    access: read
    value_type: integer
  disp32s:
    role: source
    access: read
    value_type: integer
  disp64:
    role: source
    access: read
    value_type: integer

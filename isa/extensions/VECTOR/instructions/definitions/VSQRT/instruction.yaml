mnemonic: VSQRT
name: Vector Floating-Point Square Root
summary: Computes the square root of each active floating-point element.
route: vector
sail_entries:
- execute_VSQRT
privileged: false
additional_cpuid_flags:
- FP.cpuid.EXTENSIONS.DIRECTORY.FEATURES.FP
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

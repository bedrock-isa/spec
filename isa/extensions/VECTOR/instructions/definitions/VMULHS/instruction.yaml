mnemonic: VMULHS
name: Vector Signed Multiply High
summary: Writes the high half of each active signed destination/source product.
route: vector
privileged: false
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

mnemonic: VMAXS
name: Vector Signed Maximum
summary: Selects the greater signed value from each active destination/source element pair.
route: vector
privileged: false
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

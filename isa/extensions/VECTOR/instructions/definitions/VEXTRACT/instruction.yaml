mnemonic: VEXTRACT
name: Vector Lane Extract
summary: Copies one indexed integer vector lane to an integer scalar register.
route: vector
sail_entries:
- execute_VEXTRACT
privileged: false
operands:
  src:
    role: source
    access: read
    value_type: vector
  index:
    role: count
    access: read
    value_type: integer
  dst:
    role: destination
    access: write
    value_type: integer

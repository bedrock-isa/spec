mnemonic: VMULHU
name: Vector Unsigned Multiply High
summary: Writes the high half of each active unsigned destination/source product.
route: vector
sail_entries:
- execute_VMULHU
privileged: false
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

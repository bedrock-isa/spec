mnemonic: VMOV
name: Vector Move
summary: Copies or merges vector elements between registers and contiguous memory.
route: vector
sail_entries:
- execute_VMOV
privileged: false
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

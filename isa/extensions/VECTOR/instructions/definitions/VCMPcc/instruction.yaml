mnemonic: VCMPcc
name: Vector Conditional Compare
summary: Compares active integer or floating-point lanes and writes a complete predicate image.
route: vector
sail_entries:
- execute_VCMPcc_integer
- execute_VCMPcc_floating
privileged: false
operands:
  cc:
    role: source
    access: read
    value_type: integer
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  lhs:
    role: source
    access: read
    value_type: vector
  rhs:
    role: source
    access: read
    value_type: vector
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: write
    value_type: predicate

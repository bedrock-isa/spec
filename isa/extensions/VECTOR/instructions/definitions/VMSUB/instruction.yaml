mnemonic: VMSUB
name: Vector Fused Multiply-Subtract
summary: Performs fused multiply-subtract on corresponding active floating-point elements.
route: vector
sail_entries:
- execute_VMSUB
privileged: false
additional_cpuid_flags:
- FP.cpuid.EXTENSIONS.DIRECTORY.FEATURES.FP
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  lhs:
    role: source
    access: read
    value_type: vector
  rhs:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

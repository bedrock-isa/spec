mnemonic: VCVTH
name: Vector Convert to Half Precision
summary: Converts active single-precision, double-precision, or signed integer elements to half precision.
route: vector
sail_entries:
- execute_VCVTH
privileged: false
additional_cpuid_flags:
- FP.cpuid.EXTENSIONS.DIRECTORY.FEATURES.FP
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

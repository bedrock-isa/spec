id: "word-low-byte"
caption: "VTRUNCB.W low-byte truncation"
alt_text: "An illustrative W-container VTRUNCB view: each active container copies the low source byte into the low destination byte and preserves the old destination high byte; inactive containers preserve the complete old destination value."
kind: integer-width-conversion
view: {visible_bytes: 16, lane_order: right-to-left, scalable: true}
container_bits: 16
rows:
- id: source
  label: source Vn
  role: source
  containers:
  - {cells: [{value: nH0, effect: ignored, appearance: discarded, bits: 8}, {value: nL0, effect: copy, appearance: source, bits: 8}]}
  - {cells: [{value: nH1, effect: ignored, appearance: discarded, bits: 8}, {value: nL1, effect: copy, appearance: source, bits: 8}]}
  - {cells: [{value: nH2, effect: ignored, appearance: discarded, bits: 8}, {value: nL2, effect: copy, appearance: source, bits: 8}]}
  - {cells: [{value: nH3, effect: ignored, appearance: discarded, bits: 8}, {value: nL3, effect: copy, appearance: source, bits: 8}]}
  - {cells: [{value: nH4, effect: ignored, appearance: discarded, bits: 8}, {value: nL4, effect: copy, appearance: source, bits: 8}]}
  - {cells: [{value: nH5, effect: ignored, appearance: discarded, bits: 8}, {value: nL5, effect: copy, appearance: source, bits: 8}]}
  - {cells: [{value: nH6, effect: ignored, appearance: discarded, bits: 8}, {value: nL6, effect: copy, appearance: source, bits: 8}]}
  - {cells: [{value: nH7, effect: ignored, appearance: discarded, bits: 8}, {value: nL7, effect: copy, appearance: source, bits: 8}]}
- id: result
  label: Vd
  role: destination-after
  containers:
  - {cells: [{value: dH0, effect: preserve, appearance: old, bits: 8}, {value: nL0, effect: copy, appearance: source, bits: 8}]}
  - {cells: [{value: 'dH1:dL1', effect: preserve, appearance: old, bits: 16}]}
  - {cells: [{value: dH2, effect: preserve, appearance: old, bits: 8}, {value: nL2, effect: copy, appearance: source, bits: 8}]}
  - {cells: [{value: 'dH3:dL3', effect: preserve, appearance: old, bits: 16}]}
  - {cells: [{value: 'dH4:dL4', effect: preserve, appearance: old, bits: 16}]}
  - {cells: [{value: dH5, effect: preserve, appearance: old, bits: 8}, {value: nL5, effect: copy, appearance: source, bits: 8}]}
  - {cells: [{value: 'dH6:dL6', effect: preserve, appearance: old, bits: 16}]}
  - {cells: [{value: dH7, effect: preserve, appearance: old, bits: 8}, {value: nL7, effect: copy, appearance: source, bits: 8}]}
- id: predicate
  label: predicate Pp
  role: predicate
  element_bits: 8
  cells:
  - {value: '1', effect: set, appearance: predicate-on}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: '0', effect: clear, appearance: predicate-off}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: '1', effect: set, appearance: predicate-on}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: '0', effect: clear, appearance: predicate-off}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: '0', effect: clear, appearance: predicate-off}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: '1', effect: set, appearance: predicate-on}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: '0', effect: clear, appearance: predicate-off}
  - {value: x, effect: ignored, appearance: dont-care}
  - {value: '1', effect: set, appearance: predicate-on}
  - {value: x, effect: ignored, appearance: dont-care}
edges:
- {from_row: source, from_container: 0, from_cell: 1, to_row: result, to_container: 0, to_cell: 1, effect: copy, display: transfer}
- {from_row: source, from_container: 2, from_cell: 1, to_row: result, to_container: 2, to_cell: 1, effect: copy, display: transfer}
- {from_row: source, from_container: 5, from_cell: 1, to_row: result, to_container: 5, to_cell: 1, effect: copy, display: transfer}
- {from_row: source, from_container: 7, from_cell: 1, to_row: result, to_container: 7, to_cell: 1, effect: copy, display: transfer}

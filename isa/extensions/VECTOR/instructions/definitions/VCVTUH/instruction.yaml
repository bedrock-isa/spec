mnemonic: VCVTUH
name: Vector Convert Unsigned to Half Precision
summary: Converts active unsigned integer elements to half-precision floating point.
route: vector
sail_entries:
- execute_VCVTUH
privileged: false
additional_cpuid_flags:
- FP.cpuid.EXTENSIONS.DIRECTORY.FEATURES.FP
operands:
  govern:
    role: governing_predicate
    access: read
    value_type: predicate
  src:
    role: source
    access: read
    value_type: vector
  dst:
    role: destination
    access: read_write
    value_type: vector

mnemonic: BPANY
name: Branch on Any Predicate Bit
summary: Branch if any bit is set.
route: vector
sail_entries:
- execute_BPANY
privileged: false
operands:
  predicate:
    role: source
    access: read
    value_type: predicate
  target:
    role: control_target
    access: read
    value_type: integer

mnemonic: PMOV
name: Predicate Memory Move
summary: Transfers a complete packed predicate image between a predicate register and memory.
route: vector
sail_entries:
- execute_PMOV
privileged: false
operands:
  src:
    role: source
    access: read
    value_type: predicate
  dst:
    role: destination
    access: write
    value_type: predicate

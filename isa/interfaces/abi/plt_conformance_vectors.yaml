    offset: 0
    opcode_space_bytes: [0xe7, 0xc9, 0x80, 0x67]
    total_bytes: 12
    displacement:
      offset: 4
      width_bits: 64
      byte_order: little
  relocation:
    type: R_BEDROCK_GOTPCREL64
    place: entry + 4

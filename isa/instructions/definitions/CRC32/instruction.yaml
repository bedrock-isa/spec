mnemonic: CRC32
name: CRC-32 Update
summary: Updates a 32-bit CRC accumulator with selected source bytes.
route: integer_alu
privileged: false
additional_cpuid_flags:
- base.cpuid.BASE.BASE_INSTRUCTIONS.FEATURES.CRC32
repeat: {type: repcc, observed_value: dst}
operands:
  src: {role: source, access: read, value_type: integer}
  dst: {role: destination, access: read_write, value_type: integer}

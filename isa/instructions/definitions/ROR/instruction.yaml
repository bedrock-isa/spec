mnemonic: ROR
name: Rotate Right
summary: Rotates the destination right by the count modulo the selected width without changing FLAGS.
route: integer_bitfield
sail_entries:
- execute_ROR
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  count:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: integer

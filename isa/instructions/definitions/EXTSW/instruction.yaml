mnemonic: EXTSW
name: Sign Extend To Word
summary: Sign-extends a byte source to a word EA destination.
route: integer_unary
sail_entries:
- execute_EXTSW
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  src:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: write
    value_type: integer

mnemonic: MOVcc
name: Move Conditional
summary: Copies source to destination only when the encoded condition is true.
route: control_flow
sail_entries:
- execute_MOVcc
privileged: false
repeat:
  type: rep
operands:
  cc:
    role: source
    access: read
    value_type: integer
  src:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: write
    value_type: integer

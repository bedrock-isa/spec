mnemonic: SETcc
name: Set Conditional
summary: Writes one or zero to the destination according to the encoded condition.
route: control_flow
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  cc:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: write
    value_type: integer

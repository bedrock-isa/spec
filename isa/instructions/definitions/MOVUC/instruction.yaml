mnemonic: MOVUC
name: Move User To Current
summary: Copies from user-domain memory to a current-domain destination.
route: data_movement
privileged: true
repeat:
  type: repcc
  observed_value: dst
operands:
  src:
    role: source
    access: read
    value_type: integer
    domain: user
  dst:
    role: destination
    access: write
    value_type: integer

mnemonic: EXTZQ
name: Zero Extend To Quad
summary: Zero-extends the selected source width to a quadword destination.
route: integer_unary
sail_entries:
- execute_EXTZQ
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  src:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: write
    value_type: integer

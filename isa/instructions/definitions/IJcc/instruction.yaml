name: Increment And Jump Conditional
summary: Increments the index and branches only when it differs from the bound and the condition is true.
route: control_flow
privileged: false
operands:
  cc:
    role: source
    access: read
    value_type: integer
  index:
    role: counter
    access: read_write
    value_type: integer
  bound:
    role: source
    access: read
    value_type: integer
  target:
    role: control_target
    access: read
    value_type: integer

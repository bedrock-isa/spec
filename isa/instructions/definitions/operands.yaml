operand_types:
  Rn:
    kind: register
    register_group: general
    bit_width: 4
  SP:
    kind: fixed_register
    register: SP
    bit_width: 0
  CS:
    kind: fixed_register
    register: CS
    bit_width: 0
  EA:
    kind: effective_address
    encoding_ref: isa/addressing/effective_address/definition.yaml#compact/profiles/ea
    profile: ea
    bit_width: 7
  FEA:
    kind: effective_address
    encoding_ref: isa/addressing/effective_address/definition.yaml#compact/profiles/fea
    profile: fea
    bit_width: 7
  VEA:
    kind: effective_address
    encoding_ref: isa/addressing/effective_address/definition.yaml#compact/profiles/vea
    profile: vea
    bit_width: 7
  SREG:
    kind: register
    register_group: segment
    bit_width: 3
  condition:
    kind: enum
    values_ref: conditions.yaml#conditions
    bit_width: 4
  imm:
    kind: ea_immediate
    encoding_ref: isa/addressing/effective_address/definition.yaml#compact/forms
    bit_width: 7
  PAIRn:
    kind: enum
    bit_width: 3
    values:
    - value: 0
      name: R0_R1
      registers:
      - R0
      - R1
    - value: 1
      name: R2_R3
      registers:
      - R2
      - R3
    - value: 2
      name: R4_R5
      registers:
      - R4
      - R5
    - value: 3
      name: R6_R7
      registers:
      - R6
      - R7
    - value: 4
      name: R8_R9
      registers:
      - R8
      - R9
    - value: 5
      name: R10_R11
      registers:
      - R10
      - R11
    - value: 6
      name: R12_R13
      registers:
      - R12
      - R13
    - value: 7
      name: R14_R15
      registers:
      - R14
      - R15
  pt_level:
    kind: enum
    bit_width: 3
    values:
    - {value: 1, name: L1}
    - {value: 2, name: L2}
    - {value: 3, name: L3}
    - {value: 4, name: L4}
    - {value: 5, name: L5}
    reserved_values:
    - {value: 0, name: RESERVED0}
    - {value: 6, name: RESERVED6}
    - {value: 7, name: RESERVED7}
  flags_bitmap:
    kind: bitmap
    bit_width: 4
    bits:
    - {bit: 3, name: Z}
    - {bit: 2, name: N}
    - {bit: 1, name: C}
    - {bit: 0, name: V}
  imm6:
    kind: immediate
    bit_width: 6
    signed: false
    operation_size_extension: zero_extend
  imm7:
    kind: immediate
    bit_width: 7
    signed: false
    operation_size_extension: zero_extend
  imm8:
    kind: immediate
    bit_width: 8
    signed: false
    operation_size_extension: zero_extend
  imm16:
    kind: immediate
    bit_width: 16
    signed: false
  imm64:
    kind: immediate
    bit_width: 64
    signed: false
  imm8s:
    kind: relative_immediate
    bit_width: 8
    signed: true
  imm16s:
    kind: relative_immediate
    bit_width: 16
    signed: true
  imm32s:
    kind: relative_immediate
    bit_width: 32
    signed: true
  memory_order:
    kind: enum
    bit_width: 3
    values:
    - {value: 0, name: RELAXED}
    - {value: 1, name: ACQUIRE}
    - {value: 2, name: RELEASE}
    - {value: 3, name: ACQREL}
    - {value: 4, name: SEQCST}

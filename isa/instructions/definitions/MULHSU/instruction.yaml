mnemonic: MULHSU
name: Signed By Unsigned Multiply High
summary: Writes the high half of the signed-destination by unsigned-source 64-bit product.
route: integer_mul_div
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  src:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: integer

conditions:
- id: enabled_floating_point_exception
  reader_text: when a generated floating-point exception is enabled
- id: instruction_executes
  reader_text: when the instruction executes
- id: signed_division_invalid
  reader_text: when the divisor is zero or the most-negative value is divided by minus one
- id: unsigned_divisor_zero
  reader_text: when the divisor is zero
- id: destination_overlap
  reader_text: when the declared destination-overlap constraint is violated
- id: event_return_state_invalid
  reader_text: when the live return-source state, selected U bank, event frame, or return image fails validation
- id: system_call_state_invalid
  reader_text: when executed outside user mode or while architectural event state is active
- id: vector_lane_cursor_out_of_range
  reader_text: when the unsigned lane cursor is greater than or equal to the selected lane count
- id: vector_lane_index_out_of_range
  reader_text: when the unsigned scalar lane index is greater than or equal to the selected vector element count
- id: ploop_offset_out_of_range
  reader_text: when the remaining count is nonzero and the unsigned offset is greater than or equal to the selected vector element count
- id: wrcr_selector_rule_failure
  reader_text: when the selector, reserved bits, image, or requested transition fails the WRCR selector rule
- id: wrstatus_image_invalid
  reader_text: when reserved bits are nonzero or a supplied hardware-managed PM, EA, EDEPTH, or UO field differs from the current value
- id: performance_counter_selector_unavailable
  reader_text: when counter ID zero or another unavailable counter ID is selected

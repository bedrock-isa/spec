mnemonic: MAXU
name: Unsigned Maximum
summary: Writes the unsigned greater of source and destination to the destination.
route: integer_alu
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  src:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: integer

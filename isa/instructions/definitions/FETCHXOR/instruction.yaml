mnemonic: FETCHXOR
name: Atomic Fetch Xor
summary: Atomically XORs source with memory and returns the old memory value in the source register.
route: atomics
sail_entries:
- execute_FETCHXOR
privileged: false
operands:
  order:
    role: source
    access: read
    value_type: integer
  src:
    role: destination
    access: read_write
    value_type: integer
  memory:
    role: destination
    access: read_write
    value_type: integer

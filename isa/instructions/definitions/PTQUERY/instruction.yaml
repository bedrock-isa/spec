name: Page Table Query
summary: Reads the selected raw page-table descriptor without changing translation state.
route: tlb_and_context
privileged: true
operands:
  level:
    role: source
    access: read
    value_type: integer
  src:
    role: address
    access: address
    value_type: integer
  dst:
    role: destination
    access: write
    value_type: integer

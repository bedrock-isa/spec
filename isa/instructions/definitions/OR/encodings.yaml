encodings:
  l_q_z_rn_s_rn_d:
    pattern: 00101zssssdddd
    syntax: OR.{L|Q}(z) Rn(s), Rn(d)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_LQ
      s:
        role: src
        type: base.field_types.Rn
      d:
        role: dst
        type: base.field_types.Rn
  b_w_l_q_z_rn_s_ea_e:
    pattern: 00101zzsssseeeeeee
    syntax: OR.{B|W|L|Q}(z) Rn(s), <ea>(e)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_BWLQ
      s:
        role: src
        type: base.field_types.Rn
      e:
        role: dst
        type: base.field_types.EA
    constraints:
    - role: dst
      exclude:
      - immediate
      reason: invalid_destination
  b_w_l_q_z_ea_e_rn_d:
    pattern: 01101zzddddeeeeeee
    syntax: OR.{B|W|L|Q}(z) <ea>(e), Rn(d)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_BWLQ
      d:
        role: dst
        type: base.field_types.Rn
      e:
        role: src
        type: base.field_types.EA
  b_w_l_q_z_imm8s_ea_e:
    pattern: 11100zz1101eeeeeee
    syntax: OR.{B|W|L|Q}(z) <imm8s>, <ea>(e)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_BWLQ
      e:
        role: dst
        type: base.field_types.EA
    payloads:
    - role: src
      type: base.payload_types.IMM8S
    constraints:
    - role: dst
      exclude:
      - immediate
      reason: invalid_destination
  w_l_q_z_imm16s_ea_e:
    pattern: 11100zz1110eeeeeee
    syntax: OR.{W|L|Q}(z) <imm16s>, <ea>(e)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_WLQ
      e:
        role: dst
        type: base.field_types.EA
    payloads:
    - role: src
      type: base.payload_types.IMM16S
    constraints:
    - role: size
      allow:
      - 0x1..0x3
      reason: immediate_wider_than_operation_size
    - role: dst
      exclude:
      - immediate
      reason: invalid_destination
  l_q_z_imm32s_ea_e:
    pattern: 111001z1111eeeeeee
    syntax: OR.{L|Q}(z) <imm32s>, <ea>(e)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_LQ
      e:
        role: dst
        type: base.field_types.EA
    payloads:
    - role: src
      type: base.payload_types.IMM32S
    constraints:
    - role: dst
      exclude:
      - immediate
      reason: invalid_destination
  q_imm64_ea_e:
    pattern: 11101000111eeeeeee
    syntax: OR.Q <imm64>, <ea>(e)
    fields:
      e:
        role: dst
        type: base.field_types.EA
    payloads:
    - role: src
      type: base.payload_types.IMM64
    constraints:
    - role: dst
      exclude:
      - immediate
      reason: invalid_destination

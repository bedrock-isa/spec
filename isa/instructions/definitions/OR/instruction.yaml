mnemonic: OR
name: Bitwise Or
summary: Computes the bitwise OR of the source and destination operands.
route: integer_alu
sail_entries:
- execute_OR
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  src:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: integer

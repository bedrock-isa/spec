mnemonic: POPCNT
name: Population Count
summary: Counts set bits in the selected-width source and writes the count.
route: integer_bitfield
sail_entries:
- execute_POPCNT
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  src:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: integer

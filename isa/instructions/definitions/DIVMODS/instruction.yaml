name: Signed Divide With Remainder
summary: Divides a signed quotient-register dividend by source and writes quotient and remainder registers.
route: integer_mul_div
privileged: false
repeat:
  type: repcc
  observed_value: quotient
operands:
  src:
    role: source
    access: read
    value_type: integer
  quotient:
    role: destination
    access: read_write
    value_type: integer
  remainder:
    role: destination
    access: write
    value_type: integer

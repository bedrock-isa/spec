mnemonic: ADD
name: Add
summary: Adds the source operand to the destination operand.
route: integer_alu
sail_entries:
- execute_ADD
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  imm:
    role: source
    access: read
    value_type: integer
  src:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: integer

mnemonic: BNDSXX
name: Signed Bounds Check Exclusive-Exclusive
summary: Checks signed value membership in the exclusive-exclusive interval (lo, hi).
route: bounds
sail_entries:
- execute_BNDSXX
privileged: false
repeat:
  type: repcc
  observed_value: computed
operands:
  lo:
    role: source
    access: read
    value_type: integer
  value:
    role: source
    access: read
    value_type: integer
  hi:
    role: source
    access: read
    value_type: integer

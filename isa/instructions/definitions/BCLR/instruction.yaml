name: Bit Clear
summary: Clears the indexed destination bit, sets Z when it was clear, and clears NCV.
route: integer_bitfield
privileged: false
repeat:
  type: repcc
  observed_value: computed
operands:
  bit_index:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: integer

name: Decrement And Jump Conditional
summary: Decrements the counter and branches only when its new value is nonzero and the condition is true.
route: control_flow
privileged: false
operands:
  cc:
    role: source
    access: read
    value_type: integer
  counter:
    role: counter
    access: read_write
    value_type: integer
  target:
    role: control_target
    access: read
    value_type: integer

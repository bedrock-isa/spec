name: Move Current To User
summary: Copies from a current-domain source to user-domain memory.
route: data_movement
privileged: true
repeat:
  type: repcc
  observed_value: dst
operands:
  src:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: write
    value_type: integer
    domain: user

mnemonic: LEA
name: Load Effective Address
summary: Computes the source effective address without reading memory and writes it to the destination.
route: ea_utility
sail_entries:
- execute_LEA
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  src:
    role: address
    access: address
    value_type: integer
  dst:
    role: destination
    access: write
    value_type: integer

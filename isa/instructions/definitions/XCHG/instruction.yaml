mnemonic: XCHG
name: Exchange
summary: Exchanges selected-width operand values, committing both destinations together.
route: data_movement
privileged: false
repeat:
  type: rep
operands:
  lhs:
    role: destination
    access: read_write
    value_type: integer
  rhs:
    role: destination
    access: read_write
    value_type: integer

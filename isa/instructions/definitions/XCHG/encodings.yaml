encodings:
  l_q_z_rn_s_rn_d:
    pattern: 01000zssssdddd
    syntax: XCHG.{L|Q}(z) Rn(s), Rn(d)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_LQ
      s:
        role: lhs
        type: base.field_types.Rn
      d:
        role: rhs
        type: base.field_types.Rn
    overlaps:
    - operands:
      - lhs
      - rhs
      type: same_value
  b_w_l_q_z_rn_s_ea_e:
    pattern: 1111001111zz011sssseeeeeee
    syntax: XCHG.{B|W|L|Q}(z) Rn(s), <ea>(e)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_BWLQ
      s:
        role: lhs
        type: base.field_types.Rn
      e:
        role: rhs
        type: base.field_types.EA
    constraints:
    - role: rhs
      exclude:
      - immediate
      reason: invalid_destination
  b_w_l_q_z_ea_e_rn_d:
    pattern: 1111001000zz001ddddeeeeeee
    syntax: XCHG.{B|W|L|Q}(z) <ea>(e), Rn(d)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_BWLQ
      d:
        role: rhs
        type: base.field_types.Rn
      e:
        role: lhs
        type: base.field_types.EA
    constraints:
    - role: lhs
      exclude:
      - immediate
      reason: invalid_destination

mnemonic: ABS
name: Absolute Value
summary: Replaces the destination with its selected-width two's-complement absolute value.
route: integer_unary
sail_entries:
- execute_ABS
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  dst:
    role: destination
    access: read_write
    value_type: integer

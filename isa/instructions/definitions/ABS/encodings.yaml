      z:
        role: size
        type: base.field_types.SIZE_LQ
      r:
        role: dst
        type: base.field_types.Rn
  b_w_l_q_z_ea_e:
    pattern: 11100zz0000eeeeeee
    syntax: ABS.{B|W|L|Q}(z) <ea>(e)

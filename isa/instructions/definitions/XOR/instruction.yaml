name: Bitwise Xor
summary: Computes the bitwise XOR of the source and destination operands.
route: integer_alu
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  src:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: integer

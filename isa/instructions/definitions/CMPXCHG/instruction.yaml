mnemonic: CMPXCHG
name: Compare And Exchange
summary: Atomically compares memory with the expected register, conditionally stores, and returns the observed value.
route: atomics
sail_entries:
- execute_CMPXCHG
privileged: false
operands:
  order:
    role: source
    access: read
    value_type: integer
  expected:
    role: destination
    access: read_write
    value_type: integer
  desired:
    role: source
    access: read
    value_type: integer
  memory:
    role: destination
    access: read_write
    value_type: integer

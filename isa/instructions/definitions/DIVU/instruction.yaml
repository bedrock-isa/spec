mnemonic: DIVU
name: Unsigned Divide
summary: Divides the unsigned destination by source and writes the quotient.
route: integer_mul_div
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  src:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: integer

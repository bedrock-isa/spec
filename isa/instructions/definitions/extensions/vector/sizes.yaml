size_codes:
  H: {suffix: .H, bytes: 2}

size_kinds:
  VTYPE:
    values:
    - {value: 0, code: B}
    - {value: 1, code: W}
    - {value: 2, code: L}
    - {value: 3, code: Q}
    - {value: 5, code: H}
    - {value: 6, code: S}
    - {value: 7, code: D}
    reserved_values:
    - {value: 4, name: invalid}
  HSD:
    values:
    - {value: 1, code: H}
    - {value: 2, code: S}
    - {value: 3, code: D}
    reserved_values:
    - {value: 0, name: invalid}
  BWL:
    values:
    - {value: 0, code: B}
    - {value: 1, code: W}
    - {value: 2, code: L}
    reserved_values:
    - {value: 3, name: invalid}
  V_BW:
    values:
    - {value: 0, code: B}
    - {value: 1, code: W}
    reserved_values:
    - {value: 2, name: invalid}
    - {value: 3, name: invalid}
  V_LQ:
    values:
    - {value: 2, code: L}
    - {value: 3, code: Q}
    reserved_values:
    - {value: 0, name: invalid}
    - {value: 1, name: invalid}
  HD:
    values:
    - {value: 1, code: H}
    - {value: 3, code: D}
    reserved_values:
    - {value: 0, name: invalid}
    - {value: 2, name: invalid}
  HS:
    values:
    - {value: 1, code: H}
    - {value: 2, code: S}
    reserved_values:
    - {value: 0, name: invalid}
    - {value: 3, name: invalid}
  V_SD:
    values:
    - {value: 2, code: S}
    - {value: 3, code: D}
    reserved_values:
    - {value: 0, name: invalid}
    - {value: 1, name: invalid}
  B_ONLY:
    values:
    - {value: 0, code: B}
    reserved_values:
    - {value: 1, name: invalid}
    - {value: 2, name: invalid}
    - {value: 3, name: invalid}
  Q_ONLY:
    values:
    - {value: 3, code: Q}
    reserved_values:
    - {value: 0, name: invalid}
    - {value: 1, name: invalid}
    - {value: 2, name: invalid}

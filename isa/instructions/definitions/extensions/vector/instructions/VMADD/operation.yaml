operation: VMADD
title: Vector Fused Multiply-Add
summary: Performs fused multiply-add on corresponding active floating-point elements.
public_instruction:
  mnemonic: VMADD
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- {id: govern, role: governing_predicate, access: read, value_domain: predicate, profiles: [Pn]}
- {id: lhs, role: source, access: read, value_domain: vector, profiles: [Vn]}
- {id: rhs, role: source, access: read, value_domain: vector, profiles: [Vn]}
- {id: dst, role: destination, access: read_write, value_domain: vector, profiles: [Vn]}
cases:
- id: all_forms
  applies_to:
    forms: [extralong.vmadd.v102]
    selectors:
    - {domain: HSD, values: [H, S, D]}
  additional_requirements: [FP]
  predicate: {kind: none}
  flags:
  - bank: FFLAGS
    completion: accrued_causes
    effects:
    - {flag: NV, effect: accrue_source, reference: operation_cause}
    - {flag: OF, effect: accrue_source, reference: operation_cause}
    - {flag: UF, effect: accrue_source, reference: operation_cause}
    - {flag: NX, effect: accrue_source, reference: operation_cause}
  events:
  - event: FLOATING_POINT_FAULT
    condition: enabled_floating_point_exception
  sail_entry: execute_VMADD
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}

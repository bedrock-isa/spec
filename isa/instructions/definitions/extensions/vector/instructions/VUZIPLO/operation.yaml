operation: VUZIPLO
title: Vector Even-Lane Deinterleave
summary: Gather even lanes from the old destination and source into separate result halves.
public_instruction:
  mnemonic: VUZIPLO
  width_suffix_aliases: true
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- {id: govern, role: governing_predicate, access: read, value_domain: predicate, profiles: [Pn]}
- {id: src, role: source, access: read, value_domain: vector, profiles: [Vn]}
- {id: dst, role: destination, access: read_write, value_domain: vector, profiles: [Vn]}
cases:
- id: all_forms
  applies_to:
    forms: [extralong.vuziplo.v95]
    selectors:
    - {domain: BWLQ, values: [B, W, L, Q]}
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_VUZIPLO
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}
  diagrams:
  - id: even-lane-extraction
    path: diagrams/even-lane-extraction.yaml
    kind: vector-example
    case: all_forms
    caption: VUZIPLO even-lane extraction
    alt_text: "A complete right-to-left 128-bit W-lane VUZIPLO view: even old-Vd lanes fill the lower result half, even Vn lanes fill the upper half, and inactive result lanes preserve old Vd."

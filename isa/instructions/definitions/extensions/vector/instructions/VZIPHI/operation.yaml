operation: VZIPHI
title: Vector Upper-Half Interleave
summary: Interleave the upper halves of the old destination and source.
public_instruction:
  mnemonic: VZIPHI
  width_suffix_aliases: true
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- {id: govern, role: governing_predicate, access: read, value_domain: predicate, profiles: [Pn]}
- {id: src, role: source, access: read, value_domain: vector, profiles: [Vn]}
- {id: dst, role: destination, access: read_write, value_domain: vector, profiles: [Vn]}
cases:
- id: all_forms
  applies_to:
    forms: [extralong.vziphi.v94]
    selectors:
    - {domain: BWLQ, values: [B, W, L, Q]}
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_VZIPHI
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}
  diagrams:
  - id: upper-half-interleave
    path: diagrams/upper-half-interleave.yaml
    kind: vector-example
    case: all_forms
    caption: VZIPHI high-half interleave
    alt_text: "A complete right-to-left 128-bit W-lane VZIPHI view: result pairs alternate matching lanes from the upper halves of old Vd and Vn, while inactive result lanes preserve old Vd."

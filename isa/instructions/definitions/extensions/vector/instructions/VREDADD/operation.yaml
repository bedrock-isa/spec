operation: VREDADD
title: Vector Add Reduction
summary: Reduces active integer or floating-point elements to one scalar sum.
public_instruction:
  mnemonic: VREDADD
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- {id: govern, role: governing_predicate, access: read, value_domain: predicate, profiles: [Pn]}
- {id: src, role: source, access: read, value_domain: vector, profiles: [Vn, VEA]}
- {id: dst, role: destination, access: write, value_domain: integer, profiles: [Rn, Fn]}
cases:
- id: integer
  applies_to:
    forms: [extralong.vredadd.v118, xxlong.vredadd.v219]
    selectors:
    - {domain: BWLQ, values: [B, W, L, Q]}
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_VREDADD
- id: floating
  applies_to:
    forms: [extralong.vredadd.v126, xxlong.vredadd.v227]
    selectors:
    - {domain: HSD, values: [H, S, D]}
  additional_requirements: [FP]
  predicate: {kind: none}
  flags:
  - bank: FFLAGS
    completion: accrued_causes
    effects:
    - {flag: NV, effect: accrue_source, reference: operation_cause}
    - {flag: OF, effect: accrue_source, reference: operation_cause}
    - {flag: UF, effect: accrue_source, reference: operation_cause}
    - {flag: NX, effect: accrue_source, reference: operation_cause}
  events:
  - {event: FLOATING_POINT_FAULT, condition: enabled_floating_point_exception}
  sail_entry: execute_VREDADD
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}
  diagrams:
  - id: word-integer-reduction
    path: diagrams/word-integer-reduction.yaml
    kind: vector-example
    case: integer
    caption: VREDADD.W integer reduction
    alt_text: "The active word values v0, v2, v5, and v7 are folded with the zero identity modulo 2 to the 16, then the sum is zero-extended into Rn."
  - id: single-precision-reduction
    path: diagrams/single-precision-reduction.yaml
    kind: vector-example
    case: floating
    caption: VREDADD.S ordered floating-point reduction
    alt_text: "The active single-precision values f0, f2, and f3 are added after positive zero in increasing logical-lane order, and the fold result is written to Fn."

operation: VEXTSL
title: Vector Signed Extension to Long
summary: Sign-extends B or W source elements to L destination elements.
public_instruction:
  mnemonic: VEXTSL
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- id: govern
  role: governing_predicate
  access: read
  value_domain: predicate
  profiles: [Pn]
- id: src
  role: source
  access: read
  value_domain: vector
  profiles: [Vn]
- id: dst
  role: destination
  access: read_write
  value_domain: vector
  profiles: [Vn]
cases:
- id: all_forms
  applies_to:
    forms: [extralong.vextsl.v75]
    selectors:
    - domain: V_BW
      values: [B, W]
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_VEXTSL
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}
  diagrams:
  - id: signed-word-to-long
    path: diagrams/signed-word-to-long.yaml
    kind: vector-example
    case: all_forms
    caption: Example W-to-L signed extension in four visible containers.
    alt_text: "An illustrative W-to-L VEXTSL view: each active result copies its source word with sign bits filling the upper long field, while inactive containers preserve the old destination value."

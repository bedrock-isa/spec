kind: width-map
view: {visible_bytes: 16, lane_order: right-to-left, scalable: true}
rows:
- id: old-destination
  label: old Vd containers
  role: destination-before
  element_bits: 32
  cells:
  - {value: d0, effect: copy}
  - {value: d1, effect: preserve}
  - {value: d2, effect: copy}
  - {value: d3, effect: preserve}
- id: source
  label: source W values
  role: source
  element_bits: 32
  cells:
  - {value: '0x8000', effect: sign-fill}
  - {value: '0x0001', effect: preserve}
  - {value: '0x7fff', effect: sign-fill}
  - {value: '0xffff', effect: preserve}
- id: new-destination
  label: new L containers
  role: destination-after
  element_bits: 32
  cells:
  - {value: '0xffff8000', effect: sign-fill}
  - {value: d1, effect: preserve}
  - {value: '0x00007fff', effect: sign-fill}
  - {value: d3, effect: preserve}
edges:
- {from_row: source, from_cell: 0, to_row: new-destination, to_cell: 0, effect: sign-fill}
- {from_row: old-destination, from_cell: 1, to_row: new-destination, to_cell: 1, effect: preserve}
- {from_row: source, from_cell: 2, to_row: new-destination, to_cell: 2, effect: sign-fill}
- {from_row: old-destination, from_cell: 3, to_row: new-destination, to_cell: 3, effect: preserve}

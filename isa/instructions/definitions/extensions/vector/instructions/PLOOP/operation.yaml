operation: PLOOP
title: Predicate Loop Chunk
summary: Builds the next predicate chunk from a remaining count and lane offset.
public_instruction:
  mnemonic: PLOOP
  width_suffix_aliases: true
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- {id: remaining, role: counter, access: read_write, value_domain: integer, profiles: [Rn]}
- {id: offset, role: counter, access: read_write, value_domain: integer, profiles: [Rn]}
- {id: predicate, role: destination, access: read_write, value_domain: predicate, profiles: [Pn]}
- {id: target, role: control_target, access: read, value_domain: integer, profiles: [EA]}
cases:
- id: all_forms
  applies_to:
    forms: [xxlong.ploop.v233]
    selectors:
    - {domain: BWLQ, values: [B, W, L, Q]}
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events:
  - {event: VECTOR_RANGE_ERROR, condition: ploop_offset_out_of_range, cause: LOOP_OFFSET}
  sail_entry: execute_PLOOP
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}
  diagrams:
  - id: word-head
    path: diagrams/word-head.yaml
    kind: vector-example
    case: all_forms
    caption: PLOOP.W head iteration
    alt_text: "With offset 2 and enough work for the rest of the scalable W-lane image, PLOOP activates lanes 2 through N minus 1, subtracts N minus 2 from the remaining count, and clears the offset."
  - id: word-body
    path: diagrams/word-body.yaml
    kind: vector-example
    case: all_forms
    caption: PLOOP.W body iteration
    alt_text: "With offset zero and at least N W lanes remaining, PLOOP activates the complete predicate image, subtracts N from the remaining count, and keeps the offset at zero."
  - id: word-tail
    path: diagrams/word-tail.yaml
    kind: vector-example
    case: all_forms
    caption: PLOOP.W tail iteration
    alt_text: "With four W lanes remaining and offset zero, PLOOP activates lanes zero through three and writes zero to both scalar state registers."
  - id: word-head-tail
    path: diagrams/word-head-tail.yaml
    kind: vector-example
    case: all_forms
    caption: PLOOP.W head-tail iteration
    alt_text: "With four W lanes remaining and offset two, PLOOP activates lanes two through five and writes zero to both scalar state registers."

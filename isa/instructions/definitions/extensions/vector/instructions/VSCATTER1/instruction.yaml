mnemonic: VSCATTER1
title: One-Lane Vector Scatter Step
summary: Conditionally scatter one vector lane and advance its lane cursor.
description: Range-check the lane cursor, then conditionally store one selected element through the default data segment and advance the cursor.
attributes:
  class: vector
  family: vector
  privilege: unprivileged
repeat:
  contexts:
  - REP
exceptions:
- event: VECTOR_RANGE_ERROR
  when: the unsigned lane cursor is greater than or equal to the selected lane count

operation: VSLICE
title: Vector Slice
summary: Extract a lane window from the old destination followed by a source vector.
public_instruction:
  mnemonic: VSLICE
  width_suffix_aliases: true
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- {id: govern, role: governing_predicate, access: read, value_domain: predicate, profiles: [Pn]}
- {id: src, role: source, access: read, value_domain: vector, profiles: [Vn]}
- {id: count, role: count, access: read, value_domain: integer, profiles: [imm6]}
- {id: dst, role: destination, access: read_write, value_domain: vector, profiles: [Vn]}
cases:
- id: all_forms
  applies_to:
    forms: [extralong.vslice.v106]
    selectors:
    - {domain: BWLQ, values: [B, W, L, Q]}
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_VSLICE
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}
  diagrams:
  - id: slice-by-three
    path: diagrams/slice-by-three.yaml
    kind: vector-example
    case: all_forms
    caption: VSLICE by three lanes
    alt_text: "An illustrative right-to-left W-lane VSLICE view with count 3: active result lanes select from the old destination followed by Vn, while inactive lanes preserve their old destination values."

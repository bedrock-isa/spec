operation: VCMPcc
title: Vector Conditional Compare
summary: Compares active integer or floating-point lanes and writes a complete predicate image.
public_instruction:
  mnemonic: VCMPcc
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- {id: cc, role: source, access: read, value_domain: integer, profiles: [condition]}
- {id: govern, role: governing_predicate, access: read, value_domain: predicate, profiles: [Pn]}
- {id: lhs, role: source, access: read, value_domain: vector, profiles: [Vn]}
- {id: rhs, role: source, access: read, value_domain: vector, profiles: [Vn]}
- {id: src, role: source, access: read, value_domain: vector, profiles: [VEA]}
- {id: dst, role: destination, access: write, value_domain: predicate, profiles: [Pn]}
cases:
- id: integer
  applies_to:
    forms: [extralong.vcmpcc.v47.integer, xxlong.vcmpcc.v230.integer]
    selectors:
    - {domain: VTYPE, values: [B, W, L, Q]}
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_VCMPcc_integer
- id: floating
  applies_to:
    forms: [extralong.vcmpcc.v47.fp, xxlong.vcmpcc.v230.fp]
    selectors:
    - {domain: VTYPE, values: [H, S, D]}
  additional_requirements: [FP]
  predicate: {kind: none}
  flags:
  - bank: FFLAGS
    completion: accrued_causes
    effects:
    - {flag: NV, effect: accrue_source, reference: operation_cause}
  events:
  - event: FLOATING_POINT_FAULT
    condition: enabled_floating_point_exception
  sail_entry: execute_VCMPcc_floating
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}

operation: PSLICE
title: Predicate Slice
summary: Extract a predicate-lane window from the old destination followed by a source predicate.
public_instruction:
  mnemonic: PSLICE
  width_suffix_aliases: true
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- {id: src, role: source, access: read, value_domain: predicate, profiles: [Pn]}
- {id: count, role: count, access: read, value_domain: integer, profiles: [imm6]}
- {id: dst, role: destination, access: read_write, value_domain: predicate, profiles: [Pn]}
cases:
- id: all_forms
  applies_to:
    forms: [extralong.pslice.v136]
    selectors:
    - {domain: BWLQ, values: [B, W, L, Q]}
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_PSLICE
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}
  diagrams:
  - id: slice-by-three
    path: diagrams/slice-by-three.yaml
    kind: vector-example
    case: all_forms
    caption: PSLICE.W by three predicate lanes
    alt_text: "In this fixed 16-byte example, new Pd is the eight-lane window beginning three typed lanes into old Pd followed by source Ps. Larger VLEN uses its complete typed predicate lane count before crossing into Ps."

operation: VPERM
title: Vector Permute
summary: Select source lanes with vector indices; out-of-range indices produce zero.
public_instruction:
  mnemonic: VPERM
  width_suffix_aliases: true
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- id: govern
  role: governing_predicate
  access: read
  value_domain: predicate
  profiles: [Pn]
- id: src
  role: source
  access: read
  value_domain: vector
  profiles: [Vn]
- id: dst
  role: destination
  access: read_write
  value_domain: vector
  profiles: [Vn]
cases:
- id: all_forms
  applies_to:
    forms: [extralong.vperm.v92]
    selectors:
    - domain: BWLQ
      values: [B, W, L, Q]
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_VPERM
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}
  diagrams:
  - id: indexed-lanes
    path: diagrams/indexed-lanes.yaml
    kind: vector-example
    case: all_forms
    caption: Example W-lane indexed selection with alternating active lanes.
    alt_text: "An illustrative right-to-left W-lane view of VPERM: active lanes copy the old destination lane named by their index; inactive lanes preserve the old destination value."

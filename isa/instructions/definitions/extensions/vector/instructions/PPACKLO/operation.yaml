operation: PPACKLO
title: Predicate Pack to Lower Half
summary: Packs source predicate positions into the lower half of narrower destination positions.
public_instruction:
  mnemonic: PPACKLO
  width_suffix_aliases: true
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- {id: src, role: source, access: read, value_domain: predicate, profiles: [Pn]}
- {id: dst, role: destination, access: read_write, value_domain: predicate, profiles: [Pn]}
cases:
- id: all_forms
  applies_to:
    forms: [long.ppacklo.v14]
    selectors:
    - {domain: WLQ, values: [W, L, Q]}
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_PPACKLO
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}
  diagrams:
  - id: word-lower-half
    path: diagrams/word-lower-half.yaml
    kind: vector-example
    case: all_forms
    caption: PPACKLO.W lower-half predicate packing
    alt_text: "In the illustrated 16-byte instance, the significant word-predicate positions of source Pn are copied in lane order to the lower half of the byte-predicate positions of new Pq. Every other bit is cleared, and the same lower-half rule scales with VLEN."

operation: PUNPKHI
title: Predicate Unpack from Upper Half
summary: Unpacks the upper half of source predicate positions into wider destination positions.
public_instruction:
  mnemonic: PUNPKHI
  width_suffix_aliases: true
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- {id: src, role: source, access: read, value_domain: predicate, profiles: [Pn]}
- {id: dst, role: destination, access: read_write, value_domain: predicate, profiles: [Pn]}
cases:
- id: all_forms
  applies_to:
    forms: [long.punpkhi.v13]
    selectors:
    - {domain: BWL, values: [B, W, L]}
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_PUNPKHI
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}
  diagrams:
  - id: byte-upper-half
    path: diagrams/byte-upper-half.yaml
    kind: vector-example
    case: all_forms
    caption: PUNPKHI.B upper-half predicate unpacking
    alt_text: "In the illustrated 16-byte instance, the upper half of the significant byte-predicate positions of source Pn is copied in lane order to the significant word-predicate positions of new Pq. Every nonsignificant result bit is cleared, and the same upper-half rule scales with VLEN."

operation: VADD
title: Vector Add
summary: Adds corresponding active vector elements using integer or floating-point arithmetic.
public_instruction:
  mnemonic: VADD
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- id: govern
  role: governing_predicate
  access: read
  value_domain: predicate
  profiles: [Pn]
- id: src
  role: source
  access: read
  value_domain: vector
  profiles: [Vn, VEA]
- id: dst
  role: destination
  access: read_write
  value_domain: vector
  profiles: [Vn, VEA]
cases:
- id: integer
  applies_to:
    forms: [extralong.vadd.v50, xxlong.vadd.v140, xxlong.vadd.v141]
    selectors:
    - domain: VTYPE
      values: [B, W, L, Q]
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_VADD_integer
- id: floating
  applies_to:
    forms: [extralong.vadd.v50, xxlong.vadd.v140, xxlong.vadd.v141]
    selectors:
    - domain: VTYPE
      values: [H, S, D]
  additional_requirements: [FP]
  predicate: {kind: none}
  flags:
  - bank: FFLAGS
    completion: accrued_causes
    effects:
    - {flag: NV, effect: accrue_source, reference: operation_cause}
    - {flag: OF, effect: accrue_source, reference: operation_cause}
    - {flag: UF, effect: accrue_source, reference: operation_cause}
    - {flag: NX, effect: accrue_source, reference: operation_cause}
  events:
  - event: FLOATING_POINT_FAULT
    condition: enabled_floating_point_exception
  sail_entry: execute_VADD_floating
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}

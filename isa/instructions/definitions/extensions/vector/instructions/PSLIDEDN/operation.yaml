operation: PSLIDEDN
title: Predicate Slide Down
summary: Move predicate lanes toward lower indices and insert zero at the high end.
public_instruction:
  mnemonic: PSLIDEDN
  width_suffix_aliases: true
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- {id: count, role: count, access: read, value_domain: integer, profiles: [imm6]}
- {id: dst, role: destination, access: read_write, value_domain: predicate, profiles: [Pn]}
cases:
- id: all_forms
  applies_to:
    forms: [long.pslidedn.v46]
    selectors:
    - {domain: BWLQ, values: [B, W, L, Q]}
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_PSLIDEDN
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}
  diagrams:
  - id: slide-down-by-two
    path: diagrams/slide-down-by-two.yaml
    kind: vector-example
    case: all_forms
    caption: PSLIDEDN.W by two predicate lanes
    alt_text: "In this fixed 16-byte example, typed predicate lanes move two positions toward lower indices and the two highest result positions become zero. A larger VLEN applies the same rule at its architectural high end."

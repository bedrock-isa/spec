operation: PUZIPHI
title: Predicate Odd-Lane Extraction
summary: Concatenate odd-position predicate lanes from two sources.
public_instruction:
  mnemonic: PUZIPHI
  width_suffix_aliases: true
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- {id: lhs, role: source, access: read, value_domain: predicate, profiles: [Pn]}
- {id: rhs, role: source, access: read, value_domain: predicate, profiles: [Pn]}
- {id: dst, role: destination, access: read_write, value_domain: predicate, profiles: [Pn]}
cases:
- id: all_forms
  applies_to:
    forms: [extralong.puziphi.v133]
    selectors:
    - {domain: BWLQ, values: [B, W, L, Q]}
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_PUZIPHI
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}
  diagrams:
  - id: odd-lanes
    path: diagrams/odd-lanes.yaml
    kind: vector-example
    case: all_forms
    caption: PUZIPHI.W odd predicate-lane extraction
    alt_text: "In this fixed 16-byte example, odd Pa lanes form the low result half and odd Pb lanes form the high result half. Larger VLEN applies the same rule over all architectural typed lanes."

operation: VINSERT
title: Vector Lane Insert
summary: Replaces one indexed vector lane with an integer or floating-point scalar value.
public_instruction:
  mnemonic: VINSERT
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- {id: src, role: source, access: read, value_domain: integer, profiles: [Rn, Fn]}
- {id: index, role: count, access: read, value_domain: integer, profiles: [Rn]}
- {id: dst, role: destination, access: read_write, value_domain: vector, profiles: [Vn]}
cases:
- id: integer
  applies_to:
    forms: [extralong.vinsert.v115]
    selectors:
    - {domain: BWLQ, values: [B, W, L, Q]}
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events:
  - {event: VECTOR_RANGE_ERROR, condition: vector_lane_index_out_of_range, cause: LANE_INDEX}
  sail_entry: execute_VINSERT
- id: floating
  applies_to:
    forms: [extralong.vinsert.v117]
    selectors:
    - {domain: HSD, values: [H, S, D]}
  additional_requirements: [FP]
  predicate: {kind: none}
  flags: []
  events:
  - {event: VECTOR_RANGE_ERROR, condition: vector_lane_index_out_of_range, cause: LANE_INDEX}
  sail_entry: execute_VINSERT
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}
  diagrams:
  - id: word-integer-insert
    path: diagrams/word-integer-insert.yaml
    kind: vector-example
    case: integer
    caption: VINSERT.W indexed lane replacement
    alt_text: "The scalar value x replaces Vd lane i, and every other lane stays at its existing position without a movement arrow."

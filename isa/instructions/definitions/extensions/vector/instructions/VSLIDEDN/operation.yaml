operation: VSLIDEDN
title: Vector Slide Down
summary: Move old destination lanes toward lower indices and zero vacated lanes.
public_instruction:
  mnemonic: VSLIDEDN
  width_suffix_aliases: true
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- {id: govern, role: governing_predicate, access: read, value_domain: predicate, profiles: [Pn]}
- {id: count, role: count, access: read, value_domain: integer, profiles: [imm6]}
- {id: dst, role: destination, access: read_write, value_domain: vector, profiles: [Vn]}
cases:
- id: all_forms
  applies_to:
    forms: [extralong.vslidedn.v113]
    selectors:
    - {domain: BWLQ, values: [B, W, L, Q]}
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_VSLIDEDN
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}
  diagrams:
  - id: slide-down-by-two
    path: diagrams/slide-down-by-two.yaml
    kind: vector-example
    case: all_forms
    caption: VSLIDEDN by two lanes
    alt_text: "An illustrative right-to-left W-lane VSLIDEDN view with count 2: active lanes copy the old destination lane at an index two greater or become zero when that index is out of range, while inactive lanes preserve their old values."

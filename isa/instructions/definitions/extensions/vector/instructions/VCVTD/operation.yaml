operation: VCVTD
title: Vector Convert to Double Precision
summary: Converts active half-precision, single-precision, or signed integer elements to double precision.
public_instruction:
  mnemonic: VCVTD
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- {id: govern, role: governing_predicate, access: read, value_domain: predicate, profiles: [Pn]}
- {id: src, role: source, access: read, value_domain: vector, profiles: [Vn]}
- {id: dst, role: destination, access: read_write, value_domain: vector, profiles: [Vn]}
cases:
- id: floating_source
  applies_to:
    forms: [extralong.vcvtd.v82]
    selectors:
    - {domain: HS, values: [H, S]}
  additional_requirements: [FP]
  conversion:
    source_domain: floating
    source_formats: [H, S]
    destination_domain: floating
    destination_formats: [D]
    behavior: convert
  predicate: {kind: none}
  flags: &conversion_flags
  - bank: FFLAGS
    completion: accrued_causes
    effects:
    - {flag: NV, effect: accrue_source, reference: operation_cause}
    - {flag: OF, effect: accrue_source, reference: operation_cause}
    - {flag: UF, effect: accrue_source, reference: operation_cause}
    - {flag: NX, effect: accrue_source, reference: operation_cause}
  events: &conversion_events
  - {event: FLOATING_POINT_FAULT, condition: enabled_floating_point_exception}
  sail_entry: execute_VCVTD
- id: signed_integer_source
  applies_to:
    forms: [extralong.vcvtd.v85]
    selectors:
    - {domain: V_LQ, values: [L, Q]}
  additional_requirements: [FP]
  conversion:
    source_domain: integer
    integer_signedness: signed
    source_formats: [L, Q]
    destination_domain: floating
    destination_formats: [D]
    behavior: convert
  predicate: {kind: none}
  flags: *conversion_flags
  events: *conversion_events
  sail_entry: execute_VCVTD
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}
  diagrams:
  - id: half-to-double
    path: diagrams/half-to-double.yaml
    kind: vector-example
    case: floating_source
    caption: VCVTD.H half-to-double conversion containers
    alt_text: "Each 64-bit operation container reads its low half-precision source field. The active container writes a double-precision result, while the inactive container retains its old destination value."

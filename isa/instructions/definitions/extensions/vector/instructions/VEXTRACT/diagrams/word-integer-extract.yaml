kind: scalar-bridge
view: {visible_bytes: 16, lane_order: right-to-left, scalable: true}
rows:
- id: source
  label: source Vn
  role: source
  element_bits: 16
  cells:
  - {value: v0, effect: copy, appearance: source}
  - {value: v1, effect: copy, appearance: source}
  - {value: v2, effect: copy, appearance: source}
  - {value: 'v[i]', effect: copy, appearance: selected-source}
  - {value: v4, effect: copy, appearance: source}
  - {value: v5, effect: copy, appearance: source}
  - {value: v6, effect: copy, appearance: source}
  - {value: v7, effect: copy, appearance: source}
scalars:
- {id: index, label: index Rn, role: index, value: i}
- {id: result, label: new Rn, role: destination, value: 'zext(v[i])'}
connections:
- {from_kind: row, from_id: source, from_cell: 3, to_kind: scalar, to_id: result, display: transfer}
- {from_kind: scalar, from_id: index, to_kind: row, to_id: source, to_cell: 3, display: control}

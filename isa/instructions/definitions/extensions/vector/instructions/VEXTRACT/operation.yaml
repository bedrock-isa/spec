operation: VEXTRACT
title: Vector Lane Extract
summary: Copies one indexed vector lane to an integer or floating-point scalar register.
public_instruction:
  mnemonic: VEXTRACT
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- {id: src, role: source, access: read, value_domain: vector, profiles: [Vn]}
- {id: index, role: count, access: read, value_domain: integer, profiles: [Rn]}
- {id: dst, role: destination, access: write, value_domain: integer, profiles: [Rn, Fn]}
cases:
- id: integer
  applies_to:
    forms: [extralong.vextract.v114]
    selectors:
    - {domain: BWLQ, values: [B, W, L, Q]}
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events:
  - {event: VECTOR_RANGE_ERROR, condition: vector_lane_index_out_of_range, cause: LANE_INDEX}
  sail_entry: execute_VEXTRACT
- id: floating
  applies_to:
    forms: [extralong.vextract.v116]
    selectors:
    - {domain: HSD, values: [H, S, D]}
  additional_requirements: [FP]
  predicate: {kind: none}
  flags: []
  events:
  - {event: VECTOR_RANGE_ERROR, condition: vector_lane_index_out_of_range, cause: LANE_INDEX}
  sail_entry: execute_VEXTRACT
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}
  diagrams:
  - id: word-integer-extract
    path: diagrams/word-integer-extract.yaml
    kind: vector-example
    case: integer
    caption: VEXTRACT.W indexed scalar result
    alt_text: "The lane selected by scalar index i is copied from Vn and zero-extended into Rn."

operation: VCVTS
title: Vector Convert to Single Precision
summary: Converts active half-precision, double-precision, or signed integer elements to single precision.
public_instruction:
  mnemonic: VCVTS
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- {id: govern, role: governing_predicate, access: read, value_domain: predicate, profiles: [Pn]}
- {id: src, role: source, access: read, value_domain: vector, profiles: [Vn]}
- {id: dst, role: destination, access: read_write, value_domain: vector, profiles: [Vn]}
cases:
- id: floating_source
  applies_to:
    forms: [extralong.vcvts.v81]
    selectors:
    - {domain: HD, values: [H, D]}
  additional_requirements: [FP]
  conversion:
    source_domain: floating
    source_formats: [H, D]
    destination_domain: floating
    destination_formats: [S]
    behavior: convert
  predicate: {kind: none}
  flags: &conversion_flags
  - bank: FFLAGS
    completion: accrued_causes
    effects:
    - {flag: NV, effect: accrue_source, reference: operation_cause}
    - {flag: OF, effect: accrue_source, reference: operation_cause}
    - {flag: UF, effect: accrue_source, reference: operation_cause}
    - {flag: NX, effect: accrue_source, reference: operation_cause}
  events: &conversion_events
  - {event: FLOATING_POINT_FAULT, condition: enabled_floating_point_exception}
  sail_entry: execute_VCVTS
- id: signed_integer_source
  applies_to:
    forms: [extralong.vcvts.v83]
    selectors:
    - {domain: V_LQ, values: [L, Q]}
  additional_requirements: [FP]
  conversion:
    source_domain: integer
    integer_signedness: signed
    source_formats: [L, Q]
    destination_domain: floating
    destination_formats: [S]
    behavior: convert
  predicate: {kind: none}
  flags: *conversion_flags
  events: *conversion_events
  sail_entry: execute_VCVTS
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}
  diagrams:
  - id: double-to-single
    path: diagrams/double-to-single.yaml
    kind: vector-example
    case: floating_source
    caption: VCVTS.D double-to-single conversion containers
    alt_text: "Each 64-bit operation container reads one double-precision source. The active container writes a single-precision result into its low field and retains the upper destination field; the inactive container remains unchanged."

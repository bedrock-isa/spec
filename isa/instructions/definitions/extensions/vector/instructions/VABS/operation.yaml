operation: VABS
title: Vector Absolute Value
summary: Computes the absolute value of active integer elements or clears the sign of active floating-point elements.
public_instruction:
  mnemonic: VABS
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- {id: govern, role: governing_predicate, access: read, value_domain: predicate, profiles: [Pn]}
- {id: src, role: source, access: read, value_domain: vector, profiles: [Vn, VEA]}
- {id: dst, role: destination, access: read_write, value_domain: vector, profiles: [Vn, VEA]}
cases:
- id: integer
  applies_to:
    forms: [long.vabs.v30, xxlong.vabs.v186, xxlong.vabs.v187]
    selectors:
    - {domain: VTYPE, values: [B, W, L, Q]}
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_VABS_integer
- id: floating
  applies_to:
    forms: [long.vabs.v30, xxlong.vabs.v186, xxlong.vabs.v187]
    selectors:
    - {domain: VTYPE, values: [H, S, D]}
  additional_requirements: [FP]
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_VABS_floating
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}

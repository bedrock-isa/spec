operation: VDUP
title: Vector Duplicate
summary: Broadcasts a scalar register, floating-point register, or immediate value to every vector lane.
public_instruction:
  mnemonic: VDUP
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- {id: src, role: source, access: read, value_domain: integer, profiles: [Rn, Fn]}
- {id: immediate, role: source, access: read, value_domain: integer, profiles: [imm8, imm16, imm32, imm64]}
- {id: dst, role: destination, access: write, value_domain: vector, profiles: [Vn]}
cases:
- id: integer_register
  applies_to:
    forms: [long.vdup.v1]
    selectors:
    - {domain: BWLQ, values: [B, W, L, Q]}
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_VDUP
- id: floating_register
  applies_to:
    forms: [long.vdup.v2]
    selectors:
    - {domain: HSD, values: [H, S, D]}
  additional_requirements: [FP]
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_VDUP
- id: immediate
  applies_to:
    forms: [long.vdup.v18.b, long.vdup.v18.w, long.vdup.v18.l, long.vdup.v18.q]
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_VDUP
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}
  diagrams:
  - id: word-register-broadcast
    path: diagrams/word-register-broadcast.yaml
    kind: vector-example
    case: integer_register
    caption: VDUP.W scalar broadcast
    alt_text: "The scalar value x from Rn is copied to every word lane of the scalable destination vector."

operation: PHEAD
title: Predicate Head
summary: Sets predicate positions from the count remainder through the final lane.
public_instruction:
  mnemonic: PHEAD
  width_suffix_aliases: true
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- id: count
  role: count
  access: read
  value_domain: integer
  profiles: [Rn]
- id: dst
  role: destination
  access: write
  value_domain: predicate
  profiles: [Pn]
cases:
- id: all_forms
  applies_to:
    forms: [long.phead.v4]
    selectors:
    - domain: BWLQ
      values: [B, W, L, Q]
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_PHEAD
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}
  diagrams:
  - id: word-range
    path: diagrams/word-range.yaml
    kind: vector-example
    case: all_forms
    caption: Example W-position fill beginning at count remainder 3.
    alt_text: "An illustrative right-to-left W-position PHEAD result with count remainder 3: positions zero through two are clear and positions three through the scalable endpoint are set."

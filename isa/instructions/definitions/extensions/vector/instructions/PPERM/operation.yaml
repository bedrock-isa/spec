operation: PPERM
title: Predicate Permute
summary: Select predicate lanes using unsigned vector indices.
public_instruction:
  mnemonic: PPERM
  width_suffix_aliases: true
execution_route: vector
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- {id: index, role: source, access: read, value_domain: vector, profiles: [Vn]}
- {id: dst, role: destination, access: read_write, value_domain: predicate, profiles: [Pn]}
cases:
- id: all_forms
  applies_to:
    forms: [long.pperm.v44]
    selectors:
    - {domain: BWLQ, values: [B, W, L, Q]}
  additional_requirements: []
  predicate: {kind: none}
  flags: []
  events: []
  sail_entry: execute_PPERM
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}
  diagrams:
  - id: indexed-selection
    path: diagrams/indexed-selection.yaml
    kind: vector-example
    case: all_forms
    caption: PPERM.W indexed predicate selection
    alt_text: "Each new Pd word-significant position selects one old Pd position using the unsigned index in the corresponding Vn word lane. The concrete indices are in range; an out-of-range index instead produces zero."

mnemonic: FSINCOSA
title: Approximate Floating-Point Sine And Cosine
summary: Performs the approximate floating-point sine and cosine operations.
description: Computes the paired sin(x) and cos(x) references in radians over finite x with abs(x) <= pi / 4 after DAZ and writes implementation-bounded S- or D-format approximations under the selected FPTRANSA accuracy contract.
attributes:
  class: fpu
  family: fpu_transcendental_approx
  privilege: unprivileged
repeat:
  contexts:
  - REP
flag_effects:
  FFLAGS:
    NV: "may accrue"
    UF: "may accrue"
exceptions:
- event: ILLEGAL_INSTRUCTION
  when: sin_dst and cos_dst designate the same register; cause is INVALID_OPERAND_RELATION
- event: FLOATING_POINT_FAULT
  when: a generated floating-point exception condition is enabled
additional_description: details.tex

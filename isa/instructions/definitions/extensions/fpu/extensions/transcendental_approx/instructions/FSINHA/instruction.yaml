mnemonic: FSINHA
title: Approximate Floating-Point Hyperbolic Sine
summary: Performs the approximate floating-point hyperbolic sine operation.
description: Computes the sinh(x) reference over all finite values and signed infinity after DAZ and writes an implementation-bounded S- or D-format approximation under the selected FPTRANSA accuracy contract.
attributes:
  class: fpu
  family: fpu_transcendental_approx
  privilege: unprivileged
repeat:
  contexts:
  - REP
flag_effects:
  FFLAGS:
    NV: "may accrue"
    OF: "may accrue"
    UF: "may accrue"
additional_description: details.tex

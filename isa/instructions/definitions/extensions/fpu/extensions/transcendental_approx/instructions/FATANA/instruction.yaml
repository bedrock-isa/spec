mnemonic: FATANA
title: Approximate Floating-Point Arc Tangent
summary: Performs the approximate floating-point arc tangent operation.
description: Computes the atan(x) reference in radians over all finite values and signed infinity after DAZ and writes an implementation-bounded S- or D-format approximation under the selected FPTRANSA accuracy contract.
attributes:
  class: fpu
  family: fpu_transcendental_approx
  privilege: unprivileged
repeat:
  contexts:
  - REP
flag_effects:
  FFLAGS:
    NV: "may accrue"
    UF: "may accrue"
additional_description: details.tex

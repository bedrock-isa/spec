mnemonic: FETOXA
title: Approximate Floating-Point e To x
summary: Performs the approximate floating-point e to x operation.
description: Computes the e ** x reference over all finite values and signed infinity after DAZ and writes an implementation-bounded S- or D-format approximation under the selected FPTRANSA accuracy contract.
attributes:
  class: fpu
  family: fpu_transcendental_approx
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPG
flag_effects:
  FFLAGS:
    NV: "may accrue"
    OF: "may accrue"
    UF: "may accrue"
additional_description: details.tex

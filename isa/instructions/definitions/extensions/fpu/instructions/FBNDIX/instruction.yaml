mnemonic: FBNDIX
title: Floating-Point Bounds Check Inclusive-Exclusive
summary: Checks floating-point value membership in the inclusive-exclusive interval [lo, hi).
description: FBNDIX treats the low bound as inclusive and the high bound as exclusive. It sets V when the value is unordered or outside [lo, hi) and clears Z, N, and C. IEEE-754 FFLAGS causes continue to accrue independently.
attributes:
  class: fpu
  family: fpu
  privilege: unprivileged
repeat:
  contexts:
  - REP
flag_effects:
  FLAGS:
    Z: "0"
    N: "0"
    C: "0"
    V: "set when the value is out of bounds or unordered"
  FFLAGS:
    NV: "may accrue"
    OF: "may accrue from FEA source conversion"
    UF: "may accrue from FEA source conversion"
    NX: "may accrue from FEA source conversion"

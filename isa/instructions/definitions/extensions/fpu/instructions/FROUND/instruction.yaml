mnemonic: FROUND
title: Floating-Point Round
summary: Performs the floating-point round operation.
description: Rounds the selected floating-point source to the nearest integral value in the same format using nearest-even, independently of FSTATUS.RM.
attributes:
  class: fpu
  family: fpu
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPG
flag_effects:
  FFLAGS:
    NV: "may accrue"
    OF: "may accrue from FEA source conversion"
    UF: "may accrue from FEA source conversion"
    NX: "may accrue"

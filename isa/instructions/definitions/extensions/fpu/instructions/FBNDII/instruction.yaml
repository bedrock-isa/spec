mnemonic: FBNDII
title: Floating-Point Bounds Check Inclusive-Inclusive
summary: Checks floating-point value membership in the inclusive-inclusive interval [lo, hi].
description: FBNDII treats both bounds as inclusive. It sets V when the value is unordered or outside [lo, hi] and clears Z, N, and C. IEEE-754 FFLAGS causes continue to accrue independently.
attributes:
  class: fpu
  family: fpu
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPG
flag_effects:
  FLAGS:
    Z: "0"
    N: "0"
    C: "0"
    V: "set when the value is out of bounds or unordered"
  FFLAGS:
    NV: "may accrue"

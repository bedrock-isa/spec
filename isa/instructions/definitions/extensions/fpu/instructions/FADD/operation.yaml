operation: FADD
title: Floating-Point Add
summary: Adds the source operand to the destination operand.
public_instruction:
  mnemonic: FADD
execution_route: fpu
privilege: unprivileged
repeat:
  kind: rep
operands:
- id: src
  role: source
  access: read
  value_domain: floating
  profiles: [Fn, FEA]
- id: dst
  role: destination
  access: read_write
  value_domain: floating
  profiles: [Fn]
cases:
- id: all_forms
  applies_to:
    forms: [medium.fadd_x_fn_s_fn_d, long.fadd_x_ea_s_fn_d]
  additional_requirements: []
  predicate: {kind: none}
  flags:
  - bank: FFLAGS
    completion: accrued_causes
    effects:
    - {flag: NV, effect: accrue_source, reference: operation_cause}
    - {flag: OF, effect: accrue_source, reference: operation_cause}
    - {flag: UF, effect: accrue_source, reference: operation_cause}
    - {flag: NX, effect: accrue_source, reference: operation_cause}
  events:
  - event: FLOATING_POINT_FAULT
    condition: enabled_floating_point_exception
  sail_entry: execute_FADD
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}

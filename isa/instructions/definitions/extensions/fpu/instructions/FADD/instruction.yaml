mnemonic: FADD
title: Floating-Point Add
summary: Adds the source operand to the destination operand.
description: Adds the selected-format floating-point source and destination values and writes the rounded result under the architectural floating-point environment.
attributes:
  class: fpu
  family: fpu
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPG
flag_effects:
  FFLAGS:
    NV: "may accrue"
    OF: "may accrue"
    UF: "may accrue"
    NX: "may accrue"

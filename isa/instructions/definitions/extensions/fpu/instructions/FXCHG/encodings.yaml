forms:
- id: medium.fxchg_fn_l_fn_r
  class: medium
  bits: 1010100000llllrrrr
  syntax: FXCHG Fn(l), Fn(r)
  operands:
  - name: lhs
    type: Fn
    access: read_write
    field: l
  - name: rhs
    type: Fn
    access: read_write
    field: r
  destination_overlap:
  - operands: [lhs, rhs]
    rule: same_value

mnemonic: FMAX
title: Floating-Point Maximum
summary: Performs the floating-point maximum operation.
description: Selects the greater numeric operand; one NaN selects the numeric operand, two NaNs use the common NaN-selection rule, and a positive-zero/negative-zero pair selects positive zero. A signaling NaN generates NV.
attributes:
  class: fpu
  family: fpu
  privilege: unprivileged
repeat:
  contexts:
  - REP
flag_effects:
  FFLAGS:
    NV: "may accrue"
    OF: "may accrue from FEA source conversion"
    UF: "may accrue from FEA source conversion"
    NX: "may accrue from FEA source conversion"

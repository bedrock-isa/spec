operation: FBNDXI
title: Floating-Point Bounds Check Exclusive-Inclusive
summary: Checks floating-point value membership in the exclusive-inclusive interval (lo, hi].
public_instruction:
  mnemonic: FBNDXI
execution_route: fpu
privilege: unprivileged
repeat:
  kind: rep
operands:
- id: lo
  role: source
  access: read
  value_domain: floating
  profiles:
  - Fn
  - FEA
- id: value
  role: source
  access: read
  value_domain: floating
  profiles:
  - Fn
  - FEA
- id: hi
  role: source
  access: read
  value_domain: floating
  profiles:
  - Fn
  - FEA
cases:
- id: all_forms
  applies_to:
    forms:
    - extralong.fbndxi_x_fn_l_fn_v_fn_h
    - extralong.fbndxi_x_fn_l_ea_v_fn_h
    - extralong.fbndxi_x_ea_l_fn_v_ea_h
  additional_requirements: []
  predicate:
    kind: none
  flags:
  - bank: FLAGS
    completion: complete_image
    effects:
    - flag: Z
      effect: clear
    - flag: N
      effect: clear
    - flag: C
      effect: clear
    - flag: V
      effect: write_condition
      reference: value_out_of_bounds_or_unordered
  - bank: FFLAGS
    completion: accrued_causes
    effects:
    - flag: NV
      effect: accrue_source
      reference: operation_cause
    - flag: OF
      effect: accrue_source
      reference: fea_source_conversion
    - flag: UF
      effect: accrue_source
      reference: fea_source_conversion
    - flag: NX
      effect: accrue_source
      reference: fea_source_conversion
  events: []
  sail_entry: execute_FBNDXI
artifacts:
  semantics:
    path: semantics.sail
    kind: sail
  description:
    path: description.tex
    kind: tex

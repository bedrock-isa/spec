mnemonic: SAR
name: Shift Arithmetic Right
summary: Arithmetic-right-shifts the destination by the count modulo its selected width without changing FLAGS.
route: integer_bitfield
sail_entries:
- execute_SAR
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  count:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: integer

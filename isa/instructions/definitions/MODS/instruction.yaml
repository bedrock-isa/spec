mnemonic: MODS
name: Signed Modulo
summary: Writes the signed remainder of destination-by-source truncation-toward-zero division.
route: integer_mul_div
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  src:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: integer

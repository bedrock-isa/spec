mnemonic: FETCHSUB
name: Atomic Fetch Subtract
summary: Atomically subtracts source from memory and returns the old memory value in the source register.
route: atomics
privileged: false
operands:
  order:
    role: source
    access: read
    value_type: integer
  src:
    role: destination
    access: read_write
    value_type: integer
  memory:
    role: destination
    access: read_write
    value_type: integer

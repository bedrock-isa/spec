mnemonic: MOVNT
title: Move Non-Temporal
summary: Stores an Rn register value to memory with a non-temporal access hint.
description: MOVNT is a store-only non-temporal move. The source is an Rn register and the destination must be a memory operand.
attributes:
  class: data_movement
  family: cache
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  - REPG
  observed:
    kind: source
    operand: src

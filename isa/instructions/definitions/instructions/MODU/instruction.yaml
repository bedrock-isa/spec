mnemonic: MODU
title: Unsigned Modulo
summary: Performs the unsigned modulo operation.
description: Writes the remainder of selected-width unsigned destination-by-source division. A zero divisor raises DIVIDE_ERROR.
attributes:
  class: integer
  family: integer_mul_div
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  observed:
    kind: result
    operand: dst
exceptions:
- event: DIVIDE_ERROR
  when: the divisor is zero
additional_description: details.tex

forms:
- id: extralong.cmpxchg_x_order_o_rn_x_rn_d_ea_e
  class: extralong
  bits: 1111110110zz0000oooxxxxddddeeeeeee
  syntax: CMPXCHG.BWLQ(z)/order(o) Rn(x), Rn(d), <ea>(e)
  operands:
  - name: order
    type: memory_order
    access: read
    field: o
  - name: expected
    type: Rn
    access: read_write
    field: x
  - name: desired
    type: Rn
    access: read
    field: d
  - name: memory
    type: EA
    access: read_write
    ea_role: value
    ea_width: operation_size
    field: e
  fields:
    z:
      type: size.BWLQ
  constraints:
  - field: o
    allow:
    - 0x0..0x4
    reason: memory_order_reserved_reclaimed
  - field: e
    exclude: immediate
    reason: memory_operand_required

mnemonic: SAR
title: Shift Arithmetic Right
summary: Performs the shift arithmetic right operation.
description: 'Shifts the selected-width destination value right by the effective count, sign-fills the vacated high bits, and writes the result to the destination. The effective count is the count operand modulo the selected operand width: B uses mod 8, W uses mod 16, L uses mod 32, and Q uses mod 64. If the effective count is zero, the selected-width result equals the original selected-width value; an Rn destination is still written and a sub-Q result is sign-extended to 64 bits, while a memory destination rewrites the same selected bytes. FLAGS are unchanged for all counts.'
attributes:
  class: integer
  family: integer_bitfield
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  observed:
    kind: result
    operand: dst

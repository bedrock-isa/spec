forms:
- id: extrashort.sub_q_8_sp
  class: extrashort
  bits: '0001111'
  syntax: SUB.Q 8, SP
  operands:
  - name: imm
    type: imm
    access: read
  - name: dst
    type: SP
    access: read_write
  sizes:
  - Q
- id: short.sub_x_rn_s_rn_d
  class: short
  bits: 00010zssssdddd
  syntax: SUB.{L|Q}(z) Rn(s), Rn(d)
  operands:
  - name: src
    type: Rn
    access: read
    field: s
  - name: dst
    type: Rn
    access: read_write
    field: d
  fields:
    z:
      type: size.LQ
- id: short.sub_q_imm8_i_sp
  class: short
  bits: 100101iiiiiiii
  syntax: SUB.Q imm8(i), SP
  operands:
  - name: imm
    type: imm8
    access: read
    field: i
  - name: dst
    type: SP
    access: read_write
  sizes:
  - Q
  constraints:
  - field: i
    allow:
    - 0x1..0xff
    reason: zero_immediate_reclaimed

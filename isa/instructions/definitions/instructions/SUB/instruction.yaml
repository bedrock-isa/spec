mnemonic: SUB
title: Subtract
summary: Subtracts the source operand from the destination operand.
description: Performs selected-width modular subtraction of the source from the destination and writes the low result bits back to the destination.
attributes:
  class: integer
  family: integer_alu
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  observed:
    kind: result
    operand: dst

mnemonic: TEST
title: Test
summary: Computes a bitwise conjunction and updates condition codes without storing the temporary value.
description: Computes the selected-width bitwise conjunction only to set Z and N, clears C and V, and does not write the temporary result. REPcc observes that temporary conjunction rather than architectural FLAGS.
attributes:
  class: integer
  family: integer_alu
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  observed:
    kind: computed
flag_effects:
  FLAGS:
    Z: "result == 0"
    N: "most_significant_bit(result)"
    C: "0"
    V: "0"

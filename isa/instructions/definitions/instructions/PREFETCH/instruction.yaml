mnemonic: PREFETCH
title: Prefetch
summary: Hints that EA will be read soon; faults only under the configured prefetch-fault policy.
description: Computes the byte-addressed source without an architectural read and issues an optional temporal read-prefetch hint. Ignoring the hint has no architectural effect except under an explicitly configured prefetch-fault policy.
attributes:
  class: system
  family: cache
  privilege: unprivileged
repeat:
  contexts:
  - REP

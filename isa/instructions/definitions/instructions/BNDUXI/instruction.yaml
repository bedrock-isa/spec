mnemonic: BNDUXI
title: Unsigned Bounds Check Exclusive-Inclusive
summary: Checks unsigned value membership in the exclusive-inclusive interval (lo, hi].
description: BNDUXI treats the low bound as exclusive and the high bound as inclusive. It sets V when unsigned(value) is outside (unsigned(lo), unsigned(hi)]; Z, N, and C are unchanged.
attributes:
  class: integer
  family: bounds
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  - REPG
  observed:
    kind: flags
flag_effects:
  FLAGS:
    V: "unsigned(value) is outside the selected interval"

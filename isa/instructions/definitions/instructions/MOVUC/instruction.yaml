mnemonic: MOVUC
title: Move User To Current
summary: Copies from user-domain memory to a current-domain destination.
description: MOVUC is a supervisor-only checked user-access move. If the source operand is memory, that access uses the user domain. The destination is a current-domain memory operand or an Rn register.
attributes:
  class: system
  family: data_movement
  privilege: supervisor
repeat:
  contexts:
  - REP
  - REPcc
  - REPG
  observed:
    kind: result
    operand: dst

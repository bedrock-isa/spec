mnemonic: INVASID
title: Invalidate TLB By ASID
summary: Invalidate TLB entries for ASID.
description: Invalidates every non-global cached translation for the selected 16-bit ASID on the current logical processor, discards matching in-progress results, and prevents later use of stale entries.
attributes:
  class: system
  family: tlb_and_context
  privilege: supervisor

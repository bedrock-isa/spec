mnemonic: LCALL
title: Long Call
summary: Pushes a long return frame and atomically transfers control to a new CS:PC pair.
description: 'Long Call is a segment-changing control transfer. It first constructs the long return frame on SS:SP, then commits the new CS and PC together. The two-operand encoding takes the new CS image from an Rn register. Its target EA has Q interpretation width: a memory operand reads a 64-bit offset and a register or immediate operand supplies its value directly.'

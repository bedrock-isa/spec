mnemonic: LCALL
title: Long Call
summary: Pushes a far return frame and atomically transfers control to a new CS:PC pair.
description: 'Long call is the CS-changing call instruction. It first constructs the far return frame on SS:SP, then commits the new CS and PC together. The two-operand form takes the new CS image from Rn. Its target EA has Q interpretation width: a memory form reads a 64-bit offset and a register or immediate form supplies its value directly.'

operation: SETF
title: Set Flags Image
summary: Replaces integer FLAGS from an immediate bitmap.
public_instruction:
  mnemonic: SETF
execution_route: system_registers
privilege: unprivileged
repeat:
  kind: not_eligible
operands:
- id: mask
  role: source
  access: read
  value_domain: integer
  profiles:
  - flags_bitmap
cases:
- id: all_forms
  applies_to:
    forms:
    - medium.setf_flags_bitmap_m
  additional_requirements: []
  predicate:
    kind: none
  flags:
  - bank: FLAGS
    completion: complete_image
    effects:
    - flag: Z
      effect: write_expression
      reference: mask_bit_3
    - flag: N
      effect: write_expression
      reference: mask_bit_2
    - flag: C
      effect: write_expression
      reference: mask_bit_1
    - flag: V
      effect: write_expression
      reference: mask_bit_0
  events: []
  sail_entry: execute_SETF
artifacts:
  semantics:
    path: semantics.sail
    kind: sail
  description:
    path: description.tex
    kind: tex

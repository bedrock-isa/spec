mnemonic: SETF
title: Set Flags
summary: Sets selected integer FLAGS bits.
description: 'SETF writes the FLAGS bits selected by flags_bitmap to one and leaves unselected FLAGS bits unchanged. The assembler may provide symbolic mask aliases such as Z, N, C, V, and combinations using |. STC is an assembler alias for SETF C.'
attributes:
  class: system
  family: system_registers
  privilege: unprivileged
flag_effects:
  FLAGS:
    Z: "set when mask bit 3 is one; otherwise unchanged"
    N: "set when mask bit 2 is one; otherwise unchanged"
    C: "set when mask bit 1 is one; otherwise unchanged"
    V: "set when mask bit 0 is one; otherwise unchanged"

mnemonic: SETF
title: Set Flags Image
summary: Replaces integer FLAGS from an immediate bitmap.
description: 'SETF replaces the complete architectural integer FLAGS image from flags_bitmap. Bit 3 writes Z, bit 2 writes N, bit 1 writes C, and bit 0 writes V; a one writes the corresponding flag to one and a zero writes it to zero. The assembler may provide symbolic bitmap names such as Z, N, C, V, and combinations using |.'
attributes:
  class: system
  family: system_registers
  privilege: unprivileged
flag_effects:
  FLAGS:
    Z: "mask bit 3"
    N: "mask bit 2"
    C: "mask bit 1"
    V: "mask bit 0"

mnemonic: BNDUXX
title: Unsigned Bounds Check Exclusive-Exclusive
summary: Checks unsigned value membership in the exclusive-exclusive interval (lo, hi).
description: BNDUXX treats both bounds as exclusive. It sets V when unsigned(value) is outside (unsigned(lo), unsigned(hi)) and clears Z, N, and C. REPcc observes the violation result as a B-sized 0 or 1 rather than architectural FLAGS.
attributes:
  class: integer
  family: bounds
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  observed:
    kind: computed
flag_effects:
  FLAGS:
    Z: "0"
    N: "0"
    C: "0"
    V: "unsigned(value) is outside the selected interval"

mnemonic: ABS
title: Absolute Value
summary: Performs the absolute value operation.
description: Replaces the selected-width destination value with its two's-complement absolute value. The most-negative value wraps to itself and does not trap. A sub-Q Rn result is sign-extended to 64 bits.
attributes:
  class: integer
  family: integer_unary
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  observed:
    kind: result
    operand: dst

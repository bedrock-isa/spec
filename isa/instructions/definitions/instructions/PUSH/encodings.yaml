forms:
- id: extrashort.push_cs
  class: extrashort
  bits: '0001101'
  syntax: PUSH CS
  operands:
  - name: reg
    type: CS
    access: read
  sizes:
  - Q
- id: extrashort.push_rn_r
  class: extrashort
  bits: 011rrrr
  syntax: PUSH Rn(r)
  operands:
  - name: reg
    type: Rn
    access: read
    field: r
  sizes:
  - Q
- id: short.push_sreg_s
  class: short
  bits: 10111000001sss
  syntax: PUSH SREG(s)
  operands:
  - name: reg
    type: SREG
    access: read
    field: s
  sizes:
  - Q

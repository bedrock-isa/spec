forms:
- id: short.xchg_x_rn_s_rn_d
  class: short
  bits: 01000zssssdddd
  syntax: XCHG.LQ(z) Rn(s), Rn(d)
  operands:
  - name: lhs
    type: Rn
    access: read_write
    field: s
  - name: rhs
    type: Rn
    access: read_write
    field: d
  fields:
    z:
      type: size.LQ
  destination_overlap:
  - operands: [lhs, rhs]
    rule: same_value
- id: long.xchg_x_rn_s_ea_e
  class: long
  bits: 1111001111zz011sssseeeeeee
  syntax: XCHG.BWLQ(z) Rn(s), <ea>(e)
  operands:
  - name: lhs
    type: Rn
    access: read_write
    field: s
  - name: rhs
    type: EA
    access: read_write
    ea_role: value
    ea_width: operation_size
    field: e
  fields:
    z:
      type: size.BWLQ
  constraints:
  - field: e
    exclude: immediate
    reason: invalid_destination
- id: long.xchg_x_ea_e_rn_d
  class: long
  bits: 1111001000zz001ddddeeeeeee
  syntax: XCHG.BWLQ(z) <ea>(e), Rn(d)
  operands:
  - name: lhs
    type: EA
    access: read_write
    ea_role: value
    ea_width: operation_size
    field: e
  - name: rhs
    type: Rn
    access: read_write
    field: d
  fields:
    z:
      type: size.BWLQ
  constraints:
  - field: e
    exclude: immediate
    reason: invalid_destination

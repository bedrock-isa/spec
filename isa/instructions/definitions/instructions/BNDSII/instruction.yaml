mnemonic: BNDSII
title: Signed Bounds Check Inclusive-Inclusive
summary: Checks signed value membership in the inclusive-inclusive interval [lo, hi].
description: BNDSII treats both bounds as inclusive. It sets V when signed(value) is outside [signed(lo), signed(hi)] and clears Z, N, and C. REPcc observes the violation result as a B-sized 0 or 1 rather than architectural FLAGS.
attributes:
  class: integer
  family: bounds
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  - REPG
  observed:
    kind: computed
flag_effects:
  FLAGS:
    Z: "0"
    N: "0"
    C: "0"
    V: "signed(value) is outside the selected interval"

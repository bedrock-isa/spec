mnemonic: BNDSXI
title: Signed Bounds Check Exclusive-Inclusive
summary: Checks signed value membership in the exclusive-inclusive interval (lo, hi].
description: BNDSXI treats the low bound as exclusive and the high bound as inclusive. It sets V when signed(value) is outside (signed(lo), signed(hi)] and clears Z, N, and C. REPcc observes the violation result as a B-sized 0 or 1 rather than architectural FLAGS.
attributes:
  class: integer
  family: bounds
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  - REPG
  observed:
    kind: computed
flag_effects:
  FLAGS:
    Z: "0"
    N: "0"
    C: "0"
    V: "signed(value) is outside the selected interval"

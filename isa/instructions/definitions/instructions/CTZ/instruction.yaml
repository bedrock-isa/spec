mnemonic: CTZ
title: Count Trailing Zeros
summary: Performs the count trailing zeros operation.
description: Counts the trailing zero bits within the selected operand size and writes the count to the destination register. A zero operand returns the operand width in bits.
attributes:
  class: integer
  family: integer_bitfield
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  observed:
    kind: result
    operand: dst

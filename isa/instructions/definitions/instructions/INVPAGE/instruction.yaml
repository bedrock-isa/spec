mnemonic: INVPAGE
title: Invalidate TLB Page
summary: Invalidate TLB mapping containing a linear address.
description: Computes the source linear address without reading memory and invalidates every matching global or current-ASID cached leaf-aligned mapping range that contains it, plus matching in-progress results, before retirement.
attributes:
  class: system
  family: tlb_and_context
  privilege: supervisor

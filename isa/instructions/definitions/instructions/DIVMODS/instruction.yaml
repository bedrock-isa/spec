mnemonic: DIVMODS
title: Signed Divide With Remainder
summary: Performs the signed divide with remainder operation.
description: The source operand supplies the signed divisor, and the quotient register Rn(q) supplies the signed dividend before the operation. On success, Rn(q) receives their quotient truncated toward zero and the remainder register Rn(r) receives the signed remainder satisfying dividend = quotient * divisor + remainder. Sub-Q quotient and remainder results are each sign-extended to 64 bits.
attributes:
  class: integer
  family: integer_mul_div
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  observed:
    kind: result
    operand: quotient
exceptions:
- event: DIVIDE_ERROR
  when: the divisor is zero or the most-negative value is divided by minus one
- event: ILLEGAL_INSTRUCTION
  when: quotient and remainder designate the same register; cause is INVALID_OPERAND_RELATION
additional_description: details.tex

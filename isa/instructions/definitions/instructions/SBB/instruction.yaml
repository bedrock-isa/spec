mnemonic: SBB
title: Subtract With Borrow
summary: Performs the subtract with borrow operation.
description: Subtracts the selected-width source value and incoming C borrow from the destination, writes the truncated difference, and updates Z, N, C, and V. REPcc observes the written destination result rather than architectural FLAGS.
attributes:
  class: integer
  family: integer_alu
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  - REPG
  observed:
    kind: result
    operand: dst
flag_effects:
  FLAGS:
    Z: "result == 0"
    N: "most_significant_bit(result)"
    C: "unsigned borrow"
    V: "signed overflow"
additional_description: details.tex

mnemonic: EXTSL
title: Sign Extend To Long
summary: Performs the sign extend to long operation.
description: Sign-extends the source operand from the instruction size to long size and stores the four-byte result to an EA destination. The low source-size bytes are copied into the result, and the remaining high result bits are filled with the source sign bit. EXTSL has no Rn destination form; use EXTSQ.B or EXTSQ.W for a sign-extended Rn result.
attributes:
  class: integer
  family: integer_unary
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  - REPG
  observed:
    kind: result
    operand: dst

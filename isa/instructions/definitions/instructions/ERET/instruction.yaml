mnemonic: ERET
title: Event Return
summary: Return through a staged user context or from an architectural event.
description: Classify the return source before stack access, then atomically return through a valid staged or outer-event U bank, or restore a valid active supervisor event frame.
attributes:
  class: system
  family: core_control
  privilege: supervisor
exceptions:
- event: INVALID_CONTROL_STATE
  when: the live return-source state, selected U bank, event frame, or return image fails validation
additional_description: details.tex

mnemonic: ERET
title: Event Return
summary: Return from an architectural event frame.
description: Return from the active architectural event after validating the saved event frame and return state. ERET is valid only while event-active state is set.
attributes:
  class: system
  family: core_control
  privilege: supervisor
exceptions:
- event: INVALID_CONTROL_STATE
  when: event-active state is clear or the event frame or return image fails validation
additional_description: details.tex

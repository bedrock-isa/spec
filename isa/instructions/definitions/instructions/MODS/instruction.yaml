mnemonic: MODS
title: Signed Modulo
summary: Performs the signed modulo operation.
description: Interprets both selected-width operands as signed integers and writes the remainder associated with truncation-toward-zero division. Invalid signed division cases raise DIVIDE_ERROR.
attributes:
  class: integer
  family: integer_mul_div
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  - REPG
  observed:
    kind: result
    operand: dst
exceptions:
- event: DIVIDE_ERROR
  when: the divisor is zero or the most-negative value is divided by minus one
additional_description: details.tex

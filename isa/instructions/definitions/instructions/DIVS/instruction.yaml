mnemonic: DIVS
title: Signed Divide
summary: Performs the signed divide operation.
description: Interprets both selected-width operands as signed integers, divides the destination by the source with truncation toward zero, and writes the quotient. A sub-Q quotient is sign-extended to 64 bits. Division by zero and the most-negative value divided by minus one raise DIVIDE_ERROR.
attributes:
  class: integer
  family: integer_mul_div
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  - REPG
  observed:
    kind: result
    operand: dst
exceptions:
- event: DIVIDE_ERROR
  when: the divisor is zero or the most-negative value is divided by minus one
additional_description: details.tex

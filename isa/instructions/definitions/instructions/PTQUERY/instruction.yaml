mnemonic: PTQUERY
title: Page Table Query
summary: Non-destructively reads the selected raw page-table descriptor.
description: PTQUERY reads the raw descriptor selected by a linear address and requested page-table level, or returns zero when the requested entry cannot be read. Z reports structural validity under the layout selected by T; N, C, and V are zero.
attributes:
  class: system
  family: tlb_and_context
  privilege: supervisor
flag_effects:
  FLAGS:
    Z: "requested PTE was read and is structurally valid for its level"
    N: "zero"
    C: "zero"
    V: "zero"
additional_description: details.tex

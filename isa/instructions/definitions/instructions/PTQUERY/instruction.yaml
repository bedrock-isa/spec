mnemonic: PTQUERY
title: Page Table Query
summary: Non-destructively reads the selected PTE with ignored bit 7 cleared.
description: PTQUERY reads the PTE selected by a linear address and requested page-table level with ignored bit 7 cleared, or returns zero when the requested entry cannot be read. Z reports structural validity; N, C, and V report the accumulated U, W, and X permissions when Z is set.
attributes:
  class: system
  family: tlb_and_context
  privilege: supervisor
flag_effects:
  FLAGS:
    Z: "requested PTE was read and is structurally valid for its level"
    N: "valid queried path is user-domain accessible; cleared on failure"
    C: "valid queried path is writable; cleared on failure"
    V: "valid queried path is executable; cleared on failure"
additional_description: details.tex

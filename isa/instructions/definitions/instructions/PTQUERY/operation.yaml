operation: PTQUERY
title: Page Table Query
summary: Non-destructively reads the selected raw page-table descriptor.
public_instruction:
  mnemonic: PTQUERY
execution_route: tlb_and_context
privilege: supervisor
repeat: {kind: not_eligible}
operands:
- id: level
  role: source
  access: read
  value_domain: integer
  profiles: [pt_level]
- id: src
  role: address
  access: address
  value_domain: integer
  profiles: [EA, Rn]
- id: dst
  role: destination
  access: write
  value_domain: integer
  profiles: [Rn]
cases:
- id: all_forms
  applies_to:
    forms:
    - long.ptquery_pt_level_i_ea_e_rn_d
    - long.ptquery_pt_level_i_rn_s_rn_d
  additional_requirements: []
  predicate: {kind: none}
  flags:
  - bank: FLAGS
    completion: complete_image
    effects:
    - {flag: Z, effect: write_condition, reference: requested_pte_valid}
    - {flag: N, effect: clear}
    - {flag: C, effect: clear}
    - {flag: V, effect: clear}
  events: []
  sail_entry: execute_PTQUERY
artifacts:
  semantics: {path: semantics.sail, kind: sail}
  description: {path: description.tex, kind: tex}

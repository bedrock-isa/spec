mnemonic: SYSCALL
title: System Call
summary: Raise the SYSTEM_CALL architectural event.
description: Raise the explicit synchronous SYSTEM_CALL event (EXC:0x20), saving the following instruction as UPC and entering the common EPC/ECS/EDS event handler on SSS:SSP without a memory frame.
attributes:
  class: system
  family: core_control
  privilege: any
exceptions:
- event: INVALID_CONTROL_STATE
  when: executed outside user mode or while architectural event state is active
additional_description: details.tex

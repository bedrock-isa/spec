mnemonic: WRSTATUS
title: Write Status
summary: Write the processor STATUS register from an Rn register.
description: WRSTATUS validates the low 16 bits from the source Rn register and atomically updates IE, NI, TF, and RF. Reserved bits must be zero, and the supplied PM, EA, EDEPTH, and UO values must equal the current values. Clearing NI with a pending NMI admits that NMI at the next instruction boundary.
attributes:
  class: system
  family: system_registers
  privilege: supervisor
exceptions:
- event: INVALID_CONTROL_STATE
  when: reserved bits are nonzero or a supplied hardware-managed PM, EA, EDEPTH, or UO field differs from the current value

mnemonic: EXTZL
title: Zero Extend To Long
summary: Performs the zero extend to long operation.
description: Zero-extends the source operand from the instruction size to long size and stores the four-byte result to an EA destination. The low source-size bytes are copied into the result, and the remaining high result bits are filled with zero. EXTZL has no Rn destination form; use MOV.B or MOV.W for a zero-extended Rn result.
attributes:
  class: integer
  family: integer_unary
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  - REPG
  observed:
    kind: result
    operand: dst

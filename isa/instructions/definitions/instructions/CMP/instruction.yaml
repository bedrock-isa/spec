mnemonic: CMP
title: Compare
summary: Computes a comparison result and updates condition codes without storing the temporary value.
description: Subtracts the source from the destination only to derive Z, N, C, and V; the temporary selected-width difference is not written to either operand. REPcc observes that temporary difference rather than architectural FLAGS.
attributes:
  class: integer
  family: integer_alu
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  - REPG
  observed:
    kind: computed
flag_effects:
  FLAGS:
    Z: "result == 0"
    N: "most_significant_bit(result)"
    C: "unsigned borrow"
    V: "signed overflow"

mnemonic: LRET
title: Long Return
summary: Pops a long return frame and atomically restores CS:PC.
description: Long Return is a segment-changing control transfer that reads the long return frame from SS:SP and commits CS and PC together. The frame contains the continuation PC Q value at the current SP and the return CS Q value at SP+8; after both values are fetched, SP is advanced by 16 bytes and the control state is committed.
attributes:
  class: control_flow
  family: control_flow
  privilege: unprivileged

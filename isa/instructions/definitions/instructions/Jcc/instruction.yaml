mnemonic: Jcc
title: Jump Conditional
summary: Transfers control when the encoded condition is true.
description: Transfers execution to the target when the encoded condition is true and otherwise continues at the next instruction. Compact direct-relative encodings select a W- or L-width displacement. Extended EA encodings use L/Q. Jcc.L reads the low 32-bit target from its register or memory EA and zero-extends it to the 64-bit near target; Jcc.Q uses the complete 64-bit target.
attributes:
  class: control_flow
  family: control_flow
  privilege: unprivileged

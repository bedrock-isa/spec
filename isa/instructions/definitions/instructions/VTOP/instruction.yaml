mnemonic: VTOP
title: Virtual To Physical Query
summary: Non-destructively queries the current translation of a linear address.
description: With paging disabled, VTOP returns the supplied linear address unchanged. With paging enabled, it returns the current byte-address translation and reports query success and accumulated U, W, and X permissions in FLAGS without accessing the translated target. PTE bit 7 is ignored.
attributes:
  class: system
  family: tlb_and_context
  privilege: supervisor
flag_effects:
  FLAGS:
    Z: "translation query succeeded"
    N: "successful translation is user-domain accessible; cleared on failure"
    C: "successful translation is writable; cleared on failure"
    V: "successful translation is executable; cleared on failure"
additional_description: details.tex

mnemonic: VTOP
title: Virtual To Physical Query
summary: Non-destructively queries the current translation of a linear address.
description: With paging disabled, VTOP returns the supplied address when it fits implementation PABITS. With paging enabled, it returns the current physical byte-address translation without accessing the translated target. Z reports success; N, C, and V are zero. The query does not modify A or D.
attributes:
  class: system
  family: tlb_and_context
  privilege: supervisor
flag_effects:
  FLAGS:
    Z: "translation query succeeded"
    N: "zero"
    C: "zero"
    V: "zero"
additional_description: details.tex

mnemonic: REPcc
title: Repeat Conditional
summary: Repeats the next instruction while the counter and condition remain active.
description: REPcc installs repeat state for the following single instruction. The selected counter register is interpreted as an unsigned remaining count. REP is the unconditional spelling and uses condition T. Condition F is reserved and is not a valid encoding. A faulting iteration does not decrement the count. A successful iteration decrements it before an event may be admitted. An event between iterations saves the repeat-prefix address and clears hidden repeat state; ERET returns to the prefix and restores no repeat continuation.
attributes:
  class: control_flow
  family: control_flow
  privilege: unprivileged
additional_assembler_syntax:
- REP Rn(r), (<instruction>)
additional_description: details.tex

forms:
- id: medium.repcc_rn_r
  class: medium
  bits: 1110111110ccccrrrr
  syntax: REPcc Rn(r), (<instruction>)
  operands:
  - name: cc
    type: condition
    access: read
    field: c
  - name: counter
    type: Rn
    access: read_write
    field: r
  constraints:
  - field: c
    allow:
    - 0
    - 0x2..0xf
    reason: condition_false_reclaimed

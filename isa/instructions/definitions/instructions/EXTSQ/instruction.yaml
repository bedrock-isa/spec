mnemonic: EXTSQ
title: Sign Extend To Quad
summary: Performs the sign extend to quad operation.
description: Sign-extends the source operand from the instruction size to quad size. The low source-size bytes are copied into the result, and the remaining high result bits are filled with the source sign bit. An Rn destination receives the complete 64-bit result; an EA destination stores all eight result bytes.
attributes:
  class: integer
  family: integer_unary
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  observed:
    kind: result
    operand: dst

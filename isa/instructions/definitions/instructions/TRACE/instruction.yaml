mnemonic: TRACE
title: Trace Stream Marker
summary: Records a marker and instruction boundary in the implementation trace stream.
description: When the implementation trace stream is enabled, appends the low 16-bit marker and current instruction boundary to that stream; otherwise it completes without changing architectural state. The tracing terminology distinguishes this marker instruction from a TF-selected trace unit and the DEBUG_TRACE architectural event.
attributes:
  class: control_flow
  family: control_flow
  privilege: unprivileged

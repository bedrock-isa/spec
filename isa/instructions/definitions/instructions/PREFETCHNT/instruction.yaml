mnemonic: PREFETCHNT
title: Prefetch Non-Temporal
summary: Hint that EA will be read with non-temporal locality.
description: Computes the byte-addressed source without an architectural read and issues an optional non-temporal read-prefetch hint. Ignoring the hint has no architectural effect except under an explicitly configured prefetch-fault policy.
attributes:
  class: system
  family: cache
  privilege: unprivileged
repeat:
  contexts:
  - REP

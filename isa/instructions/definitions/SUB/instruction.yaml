name: Subtract
summary: Subtracts the source operand from the destination operand.
route: integer_alu
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  imm:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: integer
  src:
    role: source
    access: read
    value_type: integer

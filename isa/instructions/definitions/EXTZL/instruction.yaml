name: Zero Extend To Long
summary: Zero-extends the selected source width to a longword EA destination.
route: integer_unary
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  src:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: write
    value_type: integer

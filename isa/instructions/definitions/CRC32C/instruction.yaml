name: CRC-32C Update
summary: Updates a 32-bit CRC-32C accumulator with selected source bytes.
route: integer_alu
privileged: false
additional_cpuid_flags:
- base.cpuid.BASE.BASE_INSTRUCTIONS.FEATURES.CRC32C
repeat: {type: repcc, observed_value: dst}
operands:
  src: {role: source, access: read, value_type: integer}
  dst: {role: destination, access: read_write, value_type: integer}

name: Count Trailing Zeros
summary: Counts trailing zero bits in the selected-width source and writes the count.
route: integer_bitfield
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  src:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: integer

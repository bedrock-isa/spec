mnemonic: MAXS
name: Signed Maximum
summary: Writes the signed greater of source and destination to the destination.
route: integer_alu
sail_entries:
- execute_MAXS
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  src:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: integer

mnemonic: BNDSXI
name: Signed Bounds Check Exclusive-Inclusive
summary: Checks signed value membership in the exclusive-inclusive interval (lo, hi].
route: bounds
privileged: false
repeat:
  type: repcc
  observed_value: computed
operands:
  lo:
    role: source
    access: read
    value_type: integer
  value:
    role: source
    access: read
    value_type: integer
  hi:
    role: source
    access: read
    value_type: integer

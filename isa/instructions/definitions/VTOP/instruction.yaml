mnemonic: VTOP
name: Virtual To Physical Query
summary: Non-destructively queries the current translation of a linear address.
route: tlb_and_context
sail_entries:
- execute_VTOP
privileged: true
operands:
  virt:
    role: source
    access: read
    value_type: integer
  phys:
    role: destination
    access: write
    value_type: integer

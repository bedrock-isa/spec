mnemonic: MULHS
name: Signed Multiply High
summary: Writes the high half of the signed 64-bit source-by-destination product.
route: integer_mul_div
sail_entries:
- execute_MULHS
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  src:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: integer

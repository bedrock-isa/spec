mnemonic: SBB
name: Subtract With Borrow
summary: Subtracts source and C borrow from destination, writes the modular difference, and updates ZNCV.
route: integer_alu
privileged: false
repeat:
  type: repcc
  observed_value: dst
operands:
  src:
    role: source
    access: read
    value_type: integer
  dst:
    role: destination
    access: read_write
    value_type: integer

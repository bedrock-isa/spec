encodings:
  l_q_z_rn_s_rn_d:
    pattern: 00111zssssdddd
    syntax: TEST.{L|Q}(z) Rn(s), Rn(d)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_LQ
      s:
        role: src
        type: base.field_types.Rn
      d:
        role: dst
        type: base.field_types.Rn
  b_w_l_q_z_rn_s_ea_e:
    pattern: 1111001111zz010sssseeeeeee
    syntax: TEST.{B|W|L|Q}(z) Rn(s), <ea>(e)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_BWLQ
      s:
        role: lhs
        type: base.field_types.Rn
      e:
        role: rhs
        type: base.field_types.EA
  b_w_l_q_z_ea_e_rn_d:
    pattern: 01111zzddddeeeeeee
    syntax: TEST.{B|W|L|Q}(z) <ea>(e), Rn(d)
    fields:
      z:
        role: size
        type: base.field_types.SIZE_BWLQ
      d:
        role: rhs
        type: base.field_types.Rn
      e:
        role: lhs
        type: base.field_types.EA

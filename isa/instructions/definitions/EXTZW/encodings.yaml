encodings:
  b_rn_s_ea_e:
    pattern: 111100110100001sssseeeeeee
    syntax: EXTZW.B Rn(s), <ea>(e)
    fields:
      s:
        role: src
        type: base.field_types.Rn
      e:
        role: dst
        type: base.field_types.EA
    constraints:
    - role: dst
      exclude:
      - immediate
      reason: invalid_destination
  b_ea_s_ea_d:
    pattern: 111100001111sssssssddddddd
    syntax: EXTZW.B <ea>(s), <ea>(d)
    fields:
      s:
        role: src
        type: base.field_types.EA
      d:
        role: dst
        type: base.field_types.EA
    constraints:
    - role: dst
      exclude:
      - immediate
      reason: invalid_destination

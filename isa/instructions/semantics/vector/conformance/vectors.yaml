schema_version: 0

discovery_and_state:
  - id: vlen_minimum
    vlen_bits: 128
    cpuid_vlen_log2_bits: 7
    reset_images: {V0_V31: zero, P0_P15: zero}
  - id: vlen_maximum
    vlen_bits: 2048
    cpuid_vlen_log2_bits: 11
    reset_images: {V0_V31: zero, P0_P15: zero}
  - id: vector_fp_dynamic_gate
    vector: present
    fp: absent
    integer_form: executes
    fp_form: EXTENSION_UNAVAILABLE

predicate_and_loop:
  - id: predicate_element_positions
    vlen_bits: 128
    element_bytes: 4
    significant_bits: [0, 4, 8, 12]
    nonsignificant_result_bits: zero
  - id: ploop_zero_branches
    lane_count: 16
    remaining: 0
    action: branch
    writes: none
  - id: ploop_chunk
    lane_count: 16
    remaining: 20
    offset: 2
    active_lanes: 2..15
    remaining_after: 6
    offset_after: 0
  - id: ploop_range_fault
    lane_count: 16
    remaining: 1
    offset: 16
    fault: VECTOR_RANGE_ERROR
    error_code: 0
    committed_state: none

integer_and_mapping:
  - id: inactive_lane_merge
    operation: VADD.B
    predicate_bits: [0, 2]
    destination_rule: active_result_inactive_original
  - id: lower_part_width_change
    operation: VEXTZQ.B
    container_bytes: 8
    source_part: low_1_byte
    destination_part: low_8_bytes
  - id: extract_range_fault
    operation: VEXTRACT.L
    lane_index: lane_count
    fault: VECTOR_RANGE_ERROR
    error_code: 1
    committed_state: none

memory:
  - id: contiguous_active_addresses
    element_bytes: 4
    active_lanes: [0, 2, 3]
    addresses: [anchor, anchor_plus_8, anchor_plus_12]
    inactive_accesses: none
  - id: signed_stride_addresses
    element_bytes: 2
    stride: -3
    active_lanes: [0, 2]
    addresses: [base_plus_displacement, base_minus_6_plus_displacement]
  - id: later_lane_fault_rolls_back
    active_lanes: [0, 1, 2]
    lane_2: access_fault
    register_writes: none
    predicate_writes: none
    memory_writes: none
    auto_update: none
    pc: faulting_instruction

floating_point:
  - id: inactive_snan_suppressed
    operation: VADD.S
    inactive_lane_input: signaling_nan
    inactive_lane_causes: []
    inactive_destination: unchanged
  - id: enabled_fp_cause_rolls_back
    operation: VDIV.S
    generated: [DZ]
    enabled: [DZ]
    fault: FLOATING_POINT_FAULT
    destination: unchanged
    fflags: unchanged
    memory_writes: none
  - id: lower_part_fp_conversion
    operation: VCVTD.H
    container_bytes: 8
    source_part: low_2_bytes
    destination_part: low_8_bytes

reductions:
  - id: integer_empty_identities
    ADD_OR_XOR_MAXU: 0
    AND_MINU: selected_width_all_ones
    MINS: selected_width_signed_maximum
    MAXS: selected_width_signed_minimum
  - id: fp_empty_identities
    ADD: positive_zero
    MIN: positive_infinity
    MAX: negative_infinity
  - id: fp_add_lane_order
    operation: VREDADD.S
    order: increasing_logical_lane
    reassociation: forbidden

size_codes:
  B:
    suffix: .B
    bytes: 1
  W:
    suffix: .W
    bytes: 2
  L:
    suffix: .L
    bytes: 4
  Q:
    suffix: .Q
    bytes: 8

size_kinds:
  BWLQ:
    values:
    - {value: 0, code: B}
    - {value: 1, code: W}
    - {value: 2, code: L}
    - {value: 3, code: Q}
  LQ:
    values:
    - {value: 0, code: L}
    - {value: 1, code: Q}
  BW:
    values:
    - {value: 0, code: B}
    - {value: 1, code: W}
  WLQ:
    values:
    - {value: 1, code: W}
    - {value: 2, code: L}
    - {value: 3, code: Q}
    reserved_values:
    - {value: 0, name: invalid}

version: draft-v1
prefix_word:
  bytes_per_instruction: 2
  fill_order:
  - low
  - high
  decode_order:
  - low
  - high
  unused_slot_encoding: NPX
  conflict_resolution: last prefix wins
  conflict_note: 'Prefix effects are applied in byte order. If two prefixes in the same semantic group
    or otherwise conflicting prefixes appear in the prefix word, the later decoded prefix overrides the
    earlier one.

    '
prefixes:
- name: NPX
  value: 0
  group: neutral
- name: NOSPEC
  value: 1
  group: speculation
- name: SATURATE
  value: 2
  group: arithmetic_mode
  applies_to:
  - arithmetic
- name: NONTEMPORAL
  value: 3
  group: memory_hint
  applies_to:
  - memory
- name: RESERVED04
  value: 4
  group: reserved
- name: RESERVED05
  value: 5
  group: reserved
- name: RESERVED06
  value: 6
  group: reserved
- name: RESERVED07
  value: 7
  group: reserved
- name: U2C
  value: 8
  group: access_domain
  applies_to:
  - memory
  syntax:
    operand_annotation: U:[src], C:[dst]
    default_domain: C
    examples:
    - MOV.Q U:[R0], R1
    - MOV.B U:[R0++], C:[R1++]
- name: C2U
  value: 9
  group: access_domain
  applies_to:
  - memory
  syntax:
    operand_annotation: C:[src], U:[dst]
    default_domain: C
    examples:
    - MOV.Q R0, U:[R1]
    - MOV.B C:[R0++], U:[R1++]
- name: U2U
  value: 10
  group: access_domain
  applies_to:
  - memory
  syntax:
    operand_annotation: U:[src], U:[dst]
    default_domain: C
    examples:
    - MOV.B U:[R0++], U:[R1++]
    - INC.L U:[R0]
- name: REPcc
  pattern: 1ccc cddd
  group: repeat
  syntax:
    mnemonic_template: REPcc
    condition_suffix: concatenated
    dot_suffix_reserved_for_instruction_size: true
    applies_to_following_instruction: true
    separator: comma
    examples:
    - REP R0, EXTZL.B [R1++], [R2++]
    aliases:
      REP: REPT
  condition:
    type: condition_code
    field: c
    values_from: conditions.yaml
    full_set: true
  operand:
    type: Rn
    field: d
    range: R0-R7
    role: counter
  fpu_conditional_mnemonics:
  - FCMP
  - FTEST
  - FBNDII
  - FBNDIX
  - FBNDXI
  - FBNDXX
  indexed_ea_counter_use:
    allowed: true
    counter_value: architectural signed counter value before iteration update
    note: 'the counter register may also appear as an indexed-EA index operand; EA evaluation uses the
      same architectural signed Rn value that REP tests before any condition-true counter update

      '
  counter_encoding:
    interpretation: signed two's-complement
    value_bits: 63..0
    zero_rule: zero counter performs no iteration
    index_value: architectural counter value before iteration update
    update_after_condition_true_iteration: positive counters decrement and negative counters increment
      toward zero
    condition_false_iteration_counter_rule: counter is not updated
    completion_rule: counter is zero or the REP condition is false
    fault_restart_rule: remaining signed count is preserved
  counter_direction: signed counter moves toward zero
  commit_rule: a condition-false terminating iteration commits the body and leaves the counter unchanged
mutually_exclusive_groups:
- arithmetic_mode
- speculation
- memory_hint
- access_domain
- repeat

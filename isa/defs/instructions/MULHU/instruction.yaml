mnemonic: MULHU
doc:
  title: Unsigned Multiply High
  summary: Performs the unsigned multiply high operation.
  instruction_family: integer_mul_div
  instruction_class: integer
  description: Multiplies the selected-width operands as unsigned integers and writes the high half of the double-width product.
behavior:
  group: multiply_divide
  inputs:
  - src
  input_output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  operands:
  - name: src
    type: Rn
  - name: dst
    type: Rn
  size: Q
  result: high half

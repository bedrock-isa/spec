mnemonic: MULHSU
title: Signed By Unsigned Multiply High
summary: Performs the signed by unsigned multiply high operation.
description: Multiplies a signed destination by an unsigned source at the selected width and writes the high half of the double-width product.
attributes:
  class: integer
  family: integer_mul_div
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  - REPG
  observed:
    kind: result
    operand: dst

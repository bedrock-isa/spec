mnemonic: RDSEG
doc:
  title: Read Segment Register
  summary: Read an SREG or the current CS image into an Rn register.
  description: RDSEG reads the 64-bit image of an SREG-class segment register into the destination Rn register. The dedicated RDSEG CS form reads the current CS image without assigning CS an SREG selector. CS remains unavailable to WRSEG and explicit EA selection.
  instruction_family: system_registers
  instruction_class: system
behavior:
  group: system_registers
  inputs:
  - seg
  output: dst
attributes:
  privilege: policy controlled
  flags: unchanged
forms:
  operands:
  - - name: seg
      type: SREG
    - name: dst
      type: Rn
  - - name: seg
      type: CS
    - name: dst
      type: Rn
  size: Q
  cs_form:
    allocation: long.rdseg_cs_rn_d
    source_only: true
    sreg_encoding: none
    privilege: unprivileged
  segment_image_validation: not_applicable_to_read

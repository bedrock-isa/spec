mnemonic: LJMP
title: Long Jump
summary: Atomically transfers control to a new CS:PC pair.
description: 'Long jump is the CS-changing jump instruction. It commits the new CS and PC as a single architectural control-transfer step. The two-operand form takes the new CS image from Rn. Its target EA has Q interpretation width: a memory form reads a 64-bit offset and a register or immediate form supplies its value directly.'

mnemonic: ADC
doc:
  title: Add With Carry
  summary: Performs the add with carry operation.
  instruction_family: integer_alu
  instruction_class: integer
  description: Adds the selected-width source value and the incoming C flag to the destination, writes the truncated sum, and updates Z, N, C, and V from the complete addition.
behavior:
  group: integer_carry_alu
  inputs:
  - src
  input_output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
  flags:
    Z: result == 0
    N: most_significant_bit(result)
    C: unsigned carry out
    V: signed overflow
forms:
  dst_ea_set: store_destination
  operands:
  - - name: src
      type: EA
    - name: dst
      type: Rn
  - - name: src
      type: Rn
    - name: dst
      type: EA
  - - name: imm
      type: imm6
    - name: dst
      type: EA
  size: BWLQ
  compact: false
  reads: C

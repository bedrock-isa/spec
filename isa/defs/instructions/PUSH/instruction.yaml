mnemonic: PUSH
doc:
  title: Push
  summary: Pushes one Rn value, SREG image, or the current CS image onto the stack.
  description: PUSH stores one 64-bit general-register value or SREG segment image on the stack. The SREG form accepts DS, SS, and GS0-GS5 and does not assign CS an SREG selector. A separate source-only PUSH CS form stores the current CS image. PUSH SS captures the old SS image and uses that same old SS as the stack context for the store.
  instruction_family: data_movement
  instruction_class: data_movement
behavior:
  group: stack
  inputs:
  - reg
  output: none
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  operands:
  - - name: reg
      type: Rn
  - - name: reg
      type: SREG
  - - name: reg
      type: CS
  compact: required
  size: Q
  sreg_form:
    selectors:
    - DS
    - SS
    - GS0
    - GS1
    - GS2
    - GS3
    - GS4
    - GS5
    cs_allowed: false
    privilege: unprivileged
  cs_form:
    allocation: extrashort.push_cs
    source_only: true
    sreg_encoding: none
    privilege: unprivileged

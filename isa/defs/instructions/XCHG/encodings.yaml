  - name: lhs
    type: Rn
    access: read_write
    field: s
  - name: rhs
    type: EA
    access: read_write
    ea_role: value
    ea_width: operation_size
    field: e
  fields:
    z:
      type: size.BW
  constraints:
  - field: e
    exclude: immediate
    reason: invalid_destination
  destination_overlap:
  - operands: [lhs, rhs]
    rule: same_value

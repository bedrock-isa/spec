forms:
- id: short.xchg_x_rn_s_rn_d
  class: short
  bits: 01000zssssdddd
  syntax: XCHG.LQ(z) Rn(s), Rn(d)
  operands:
  - name: lhs
    type: Rn
    access: read_write
    field: s
  - name: rhs
    type: Rn
    access: read_write
    field: d
  fields:
    z:
      type: size.LQ
  destination_overlap:
  - operands: [lhs, rhs]
    rule: same_value
- id: medium.xchg_x_rn_s_ea_e

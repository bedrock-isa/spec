mnemonic: BNDUXI
doc:
  title: Unsigned Bounds Check Exclusive-Inclusive
  summary: Checks unsigned value membership in the exclusive-inclusive interval (lo, hi].
  description: BNDUXI treats the low bound as exclusive and the high bound as inclusive. It sets V when unsigned(value) is outside (unsigned(lo), unsigned(hi)]; Z, N, and C are unchanged.
  instruction_family: bounds
  instruction_class: integer
behavior:
  group: bounds
  inputs:
  - hi
  - lo
  - value
  output: none
  interval: "(lo, hi]"
  signedness: unsigned
  bounds_mode: XI
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  extension_family: integer_bounds_unsigned
  operands:
  - name: lo
    type: Rn
  - name: value
    type: EA
  - name: hi
    type: Rn
  size: BWLQ

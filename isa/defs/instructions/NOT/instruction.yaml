mnemonic: NOT
doc:
  title: Bitwise Not
  summary: Performs the bitwise not operation.
  instruction_family: integer_unary
  instruction_class: integer
  description: Writes the selected-width bitwise complement of the destination value.
behavior:
  group: integer_unary
  input_output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
  repgf_candidate: true
  flags: unchanged
forms:
  compact_forms:
  - operands:
    - name: dst
      type: Rn
    size: LQ
  extended_forms:
  - operands:
    - name: dst
      type: EA
    size: BWLQ
    compact: false

mnemonic: FETCHSUB
doc:
  title: Atomic Fetch Subtract
  summary: Performs the atomic fetch subtract operation.
  instruction_family: atomics
  instruction_class: system
  description: Atomically replaces the memory operand with its selected-width difference from the source and returns the previous memory value in the source register.
attributes:
  privilege: unprivileged
forms:
- operands:
  - name: order
    type: memory_order
    access: read
  - name: src
    type: Rn
    access: read_write
  - name: memory
    type: EA
    access: read_write
  sizes:
  - B
  - W
  - L
  - Q

mnemonic: BNDUXX
doc:
  title: Unsigned Bounds Check Exclusive-Exclusive
  summary: Checks unsigned value membership in the exclusive-exclusive interval (lo, hi).
  description: BNDUXX treats both bounds as exclusive. It sets V when unsigned(value) is outside (unsigned(lo), unsigned(hi)); Z, N, and C are unchanged.
  instruction_family: bounds
  instruction_class: integer
behavior:
  group: bounds
  inputs:
  - hi
  - lo
  - value
  output: none
  interval: "(lo, hi)"
  signedness: unsigned
  bounds_mode: XX
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  extension_family: integer_bounds_unsigned
  operands:
  - name: lo
    type: Rn
  - name: value
    type: EA
  - name: hi
    type: Rn
  size: BWLQ

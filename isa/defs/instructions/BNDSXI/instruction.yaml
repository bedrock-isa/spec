mnemonic: BNDSXI
doc:
  title: Signed Bounds Check Exclusive-Inclusive
  summary: Checks signed value membership in the exclusive-inclusive interval (lo, hi].
  description: BNDSXI treats the low bound as exclusive and the high bound as inclusive. It sets V when signed(value) is outside (signed(lo), signed(hi)]; Z, N, and C are unchanged.
  instruction_family: bounds
  instruction_class: integer
attributes:
  privilege: unprivileged
  repeat:
  - REP
  - REPcc
  - REPG
forms:
- operands:
  - name: lo
    type: Rn
    access: read
  - name: value
    type: EA
    access: read
  - name: hi
    type: Rn
    access: read
  sizes:
  - B
  - W
  - L
  - Q

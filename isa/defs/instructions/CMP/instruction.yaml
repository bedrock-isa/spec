mnemonic: CMP
doc:
  title: Compare
  summary: Computes a comparison result and updates condition codes without storing the temporary value.
  instruction_family: integer_alu
  instruction_class: integer
  description: Subtracts the source from the destination only to derive Z, N, C, and V; the temporary difference is not written to either operand.
flags:
  Z: result == 0
  N: most_significant_bit(result)
  C: unsigned borrow
  V: signed overflow
attributes:
  privilege: unprivileged
  repeat:
  - REP
  - REPcc
  - REPG
  - REPGF

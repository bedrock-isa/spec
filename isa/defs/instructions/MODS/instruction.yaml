mnemonic: MODS
doc:
  title: Signed Modulo
  summary: Performs the signed modulo operation.
  instruction_family: integer_mul_div
  instruction_class: integer
  description: Interprets both selected-width operands as signed integers and writes the remainder associated with truncation-toward-zero division. Invalid signed division cases raise DIVIDE_ERROR.
behavior:
  group: multiply_divide
  inputs:
  - src
  input_output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  operands:
  - - name: src
      type: EA
    - name: dst
      type: Rn
  size: BWLQ

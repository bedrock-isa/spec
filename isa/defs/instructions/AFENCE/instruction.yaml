mnemonic: AFENCE
doc:
  title: Address Fence
  summary: Order prior memory operations before later memory operations.
  instruction_family: core_control
  instruction_class: system
  description: Acts as a full cumulative fence. Every earlier memory read and write is ordered before every later memory read and write on the same hardware thread, and memory effects observed before the fence are propagated before effects ordered after it. It also requires completion of earlier slot-addressed transactions before later slot-addressed transactions. Every AFENCE participates in the single global sequentially consistent order. It performs no memory access and changes no register or flag.
behavior:
  group: core_control
  output: none
attributes:
  privilege: any
forms:
  operands: []

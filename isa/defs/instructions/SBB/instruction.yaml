mnemonic: SBB
doc:
  title: Subtract With Borrow
  summary: Performs the subtract with borrow operation.
  instruction_family: integer_alu
  instruction_class: integer
  description: Subtracts the selected-width source value and incoming C borrow from the destination, writes the truncated difference, and updates Z, N, C, and V.
flags:
  Z: result == 0
  N: most_significant_bit(result)
  C: unsigned borrow
  V: signed overflow
attributes:
  privilege: unprivileged
  repeat:
  - REP
  - REPcc
  - REPG
forms:
- operands:
  - name: src
    type: EA
    access: read
  - name: dst
    type: Rn
    access: read_write
  sizes:
  - B
  - W
  - L
  - Q
- operands:
  - name: src
    type: Rn
    access: read
  - name: dst
    type: EA
    access: read_write
  sizes:
  - B
  - W
  - L
  - Q
- operands:
  - name: imm
    type: imm6
    access: read
  - name: dst
    type: EA
    access: read_write
  sizes:
  - B
  - W
  - L
  - Q

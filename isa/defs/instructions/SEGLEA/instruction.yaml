mnemonic: SEGLEA
title: Segment Load Effective Address
summary: Performs the segment load effective address operation.
description: SEGLEA computes the source effective address and applies only the selected segment's pre-translation. The size suffix selects the index scale used during effective-address calculation; it does not widen the segment check to an access-sized byte range. The check tests only the computed effective-address point. On success, SEGLEA writes the segment result to the destination and clears V. On a failed segment-bound check, it sets V, suppresses the destination-operand write, and does not raise PAGE_FAULT. Because bounds failure is a completed non-faulting operation, effective-address auto-update effects commit normally.
attributes:
  class: data_movement
  family: ea_utility
  privilege: unprivileged
  repeat:
  - REP
  - REPcc
  - REPG
  - REPGF

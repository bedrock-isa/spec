mnemonic: CLRF
doc:
  title: Clear Flags
  summary: Clears selected integer FLAGS bits.
  description: 'CLRF clears the selected architectural integer FLAGS bits. The immediate operand is a 4-bit mask: bit 3 selects Z, bit 2 selects N, bit 1 selects C, and bit 0 selects V. Selected bits are written to zero; unselected FLAGS bits are unchanged. The assembler may provide symbolic mask aliases such as Z, N, C, V, and combinations using |. CLC is an assembler alias for CLRF C.'
  instruction_family: system_registers
  instruction_class: system
flags:
  Z: cleared when mask bit 3 is one; otherwise unchanged
  N: cleared when mask bit 2 is one; otherwise unchanged
  C: cleared when mask bit 1 is one; otherwise unchanged
  V: cleared when mask bit 0 is one; otherwise unchanged
attributes:
  privilege: unprivileged
forms:
- operands:
  - name: mask
    type: flags_bitmap
    access: read

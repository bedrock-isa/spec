mnemonic: BNDSIX
title: Signed Bounds Check Inclusive-Exclusive
summary: Checks signed value membership in the inclusive-exclusive interval [lo, hi).
description: BNDSIX treats the low bound as inclusive and the high bound as exclusive. It sets V when signed(value) is outside [signed(lo), signed(hi)); Z, N, and C are unchanged.
attributes:
  class: integer
  family: bounds
  privilege: unprivileged
  repeat:
  - REP
  - REPcc
  - REPG

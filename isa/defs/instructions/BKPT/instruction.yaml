mnemonic: BKPT
doc:
  title: Breakpoint
  summary: Raise the breakpoint exception.
  instruction_family: core_control
  instruction_class: system
  description: Raises BREAKPOINT and saves the next instruction address without executing that instruction before event entry commits. DEBUG_TRACE remains reserved for the architectural trace mechanism.

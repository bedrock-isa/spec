mnemonic: BCHG
title: Bit Change
summary: Performs the bit change operation.
description: Complements the destination bit selected by the low six bits of the bit index and sets Z when that bit was previously clear.
attributes:
  class: integer
  family: integer_bitfield
  privilege: unprivileged
  repeat:
  - REP
  - REPcc
  - REPG
flag_effects:
  FLAGS:
    Z: "old_bit == 0"
    N: "unchanged"
    C: "unchanged"
    V: "unchanged"

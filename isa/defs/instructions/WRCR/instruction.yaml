mnemonic: WRCR
title: Write Control Register
summary: Write a privileged control register from an Rn register.
description: WRCR validates and atomically writes the selected control register in supervisor mode. The WRCR Selector Rules table defines each writable image, validation condition, and translation or event-state side effect.
attributes:
  class: system
  family: system_registers
  privilege: supervisor
exceptions:
- event: INVALID_CONTROL_STATE
  when: the selector, reserved bits, image, or requested transition fails the WRCR selector rule

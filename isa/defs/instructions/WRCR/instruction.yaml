mnemonic: WRCR
doc:
  title: Write Control Register
  summary: Write a privileged control register from an Rn register.
  description: WRCR is always a supervisor-only instruction; user-visible control state must use dedicated instructions gated by control-register policy bits.
  instruction_family: system_registers
  instruction_class: system
attributes:
  privilege: supervisor
forms:
- operands:
  - name: src
    type: Rn
    access: read
  - name: cr
    type: imm16
    access: read

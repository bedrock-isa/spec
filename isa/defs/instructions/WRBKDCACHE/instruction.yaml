mnemonic: WRBKDCACHE
title: Write Back Data Cache
summary: Write back one data-cache maintenance block.
description: Computes and translates the address-role EA without reading an operand value, selects its CPUID-sized maintenance block, writes dirty bytes from every data or unified cache copy in the coherence domain into normal-memory coherence, retains clean copies, and retires after the block is complete.
attributes:
  class: system
  family: cache
  privilege: supervisor

- id: medium.sub_x_rn_s_ea_e
  class: medium
  bits: 001000zsssseeeeeee
  syntax: SUB.X(z:B/W) Rn(s), <ea>(e)
  operands:
  - name: src
    type: Rn
    access: read
    field: s
  - name: dst
    type: EA
    access: read_write
    field: e
  sizes:
  - B
  - W
  fields:
    z:
      type: size
  constraints:
  - field: e
    exclude: immediate
    reason: invalid_destination
- id: medium.sub_x_rn_s_ea_e.2
  class: medium
  bits: 001001zsssseeeeeee
  syntax: SUB.X(z:L/Q) Rn(s), <ea>(e)

mnemonic: TESTJcc
doc:
  title: Test And Jump Conditional
  summary: Tests two Rn registers and branches on the selected condition without writing FLAGS.
  description: TESTJcc computes the same temporary logical-test result as TEST for the selected operand size, evaluates the encoded condition from that temporary result, and branches to the relative target when the condition is true. The computed condition is consumed only by the branch decision; architectural FLAGS are not read or written. Conditions T and F are reserved and are not valid encodings.
  instruction_family: control_flow
  instruction_class: control_flow
attributes:
  privilege: unprivileged
forms:
- operands:
  - name: cc
    type: condition
    access: read
  - name: src
    type: Rn
    access: read
  - name: dst
    type: Rn
    access: read
  - name: target
    type: imm8s
    access: read
  sizes:
  - B
  - W
  - L
  - Q

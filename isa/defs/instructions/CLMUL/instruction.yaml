mnemonic: CLMUL
doc:
  title: Carryless Multiply
  summary: Performs the carryless multiply operation.
  instruction_family: integer_mul_div
  instruction_class: integer
  description: Forms the carryless polynomial product of the selected-width source and destination values and writes its low half to the destination.
attributes:
  privilege: unprivileged
  repeat:
  - REP
  - REPcc
  - REPG
forms:
- operands:
  - name: src
    type: EA
    access: read
  - name: dst
    type: Rn
    access: read_write
  sizes:
  - B
  - W
  - L
  - Q

mnemonic: CPUID
doc:
  title: CPU Identification
  summary: Queries architectural discovery information through a selected Rn register.
  description: Queries architectural discovery information. The selected Rn register contains the CPUID query selector before execution and receives the selected 64-bit result after execution.
  instruction_family: system_registers
  instruction_class: system
attributes:
  privilege: unprivileged
forms:
- operands:
  - name: reg
    type: Rn
    access: read_write

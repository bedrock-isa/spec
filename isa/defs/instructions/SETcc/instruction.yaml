mnemonic: SETcc
doc:
  title: Set Conditional
  summary: Performs the set conditional operation.
  instruction_family: control_flow
  instruction_class: control_flow
  description: Writes one when the encoded condition is true and zero when it is false.
attributes:
  privilege: unprivileged
  repeat:
  - REP
  - REPcc
  - REPG
forms:
- operands:
  - name: cc
    type: condition
    access: read
  - name: dst
    type: Rn
    access: write
  sizes:
  - Q

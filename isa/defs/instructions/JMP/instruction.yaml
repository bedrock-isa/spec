mnemonic: JMP
doc:
  title: Jump
  summary: Transfers control to the target address.
  instruction_family: control_flow
  instruction_class: control_flow
  description: Validates the target under the current control context and transfers execution to it. For the extended EA form, JMP.L reads the low 32-bit target from its register or memory EA and zero-extends it to the 64-bit near target; JMP.Q uses the complete 64-bit target.
attributes:
  privilege: unprivileged
forms:
- operands:
  - name: target
    type: imm8s
    access: read
- operands:
  - name: target
    type: imm16s
    access: read
- operands:
  - name: target
    type: imm32s
    access: read
- operands:
  - name: target
    type: EA
    access: read
  sizes:
  - L
  - Q

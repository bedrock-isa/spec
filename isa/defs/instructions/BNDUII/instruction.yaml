mnemonic: BNDUII
doc:
  title: Unsigned Bounds Check Inclusive-Inclusive
  summary: Checks unsigned value membership in the inclusive-inclusive interval [lo, hi].
  description: BNDUII treats both bounds as inclusive. It sets V when unsigned(value) is outside [unsigned(lo), unsigned(hi)]; Z, N, and C are unchanged.
  instruction_family: bounds
  instruction_class: integer
attributes:
  privilege: unprivileged
  repeat:
  - REP
  - REPcc
  - REPG
forms:
- operands:
  - name: lo
    type: Rn
    access: read
  - name: value
    type: EA
    access: read
  - name: hi
    type: Rn
    access: read
  sizes:
  - B
  - W
  - L
  - Q

forms:
- id: extralong.divmods_x_ea_e_rn_q_rn_r
  class: extralong
  bits: 111111000010zz00qqqq001rrrreeeeeee
  syntax: DIVMODS.X(z:B/W/L/Q) <ea>(e), Rn(q), Rn(r)
  operands:
  - name: src
    type: EA
    access: read
    ea_role: value
    ea_width: operation_size
    field: e
  - name: quotient
    type: Rn
    access: read_write
    field: q
  - name: remainder
    type: Rn
    access: write
    field: r
  fields:
    z:
      type: size.BWLQ
  destination_overlap:
  - operands: [quotient, remainder]
    rule: illegal_instruction

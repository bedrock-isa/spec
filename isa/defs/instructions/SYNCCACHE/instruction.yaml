mnemonic: SYNCCACHE
doc:
  title: Synchronize Caches
  summary: Synchronize instruction/data cache visibility.
  instruction_family: cache
  instruction_class: system
  description: Writes dirty data for the addressed range to the point of instruction coherency, invalidates corresponding instruction and decoded state, and retires only when later fetches observe the synchronized bytes.
behavior:
  group: cache
  inputs:
  - target
  output: none
attributes:
  privilege:
    default: supervisor
    policy_controlled: true
forms:
  require_memory_operand: true
  operands:
  - name: target
    type: EA

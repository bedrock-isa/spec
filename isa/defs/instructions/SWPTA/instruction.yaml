mnemonic: SWPTA
doc:
  title: Switch Page Table With Context
  summary: Switches the page table and enables address-space context matching.
  description: Updates PTCR from the first Rn register, writes the low 16 bits of the second Rn register into ASCR[31:16], and sets ASCR.AE.
  instruction_family: tlb_and_context
  instruction_class: system
behavior:
  group: tlb_context
  inputs:
  - new_ptcr
  - asid
  output: none
attributes:
  privilege: supervisor
forms:
  operands:
  - name: new_ptcr
    type: Rn
  - name: asid
    type: Rn

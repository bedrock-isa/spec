mnemonic: FLSHDCACHE
doc:
  title: Flush Data Cache
  summary: Performs the flush data cache operation.
  instruction_family: cache
  instruction_class: system
  description: Resolves the addressed range without reading it, writes every dirty byte in intersecting data-cache lines to the point of coherency, invalidates those lines, and retires after completion.
attributes:
  privilege: supervisor
forms:
- operands:
  - name: target
    type: EA
    access: address

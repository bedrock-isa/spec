mnemonic: CMPJcc
doc:
  title: Compare And Jump Conditional
  summary: Compares two Rn registers and branches on the selected condition without writing FLAGS.
  description: CMPJcc computes the same temporary compare result as CMP for the selected operand size, evaluates the encoded condition from that temporary result, and branches to the relative target when the condition is true. The computed condition is consumed only by the branch decision; architectural FLAGS are not read or written. Conditions T and F are reserved and are not valid encodings.
  instruction_family: control_flow
  instruction_class: control_flow
behavior:
  group: control_flow
  inputs:
  - cc
  - src
  - dst
  - target
  output: none
attributes:
  privilege: unprivileged
  flags: unchanged
forms:
  operands:
  - - name: cc
      type: condition
    - name: src
      type: Rn
    - name: dst
      type: Rn
    - name: target
      type: imm8s
  - - name: cc
      type: condition
    - name: src
      type: Rn
    - name: dst
      type: Rn
    - name: target
      type: imm16s
  size: BWLQ
  reads: none
  result: branch only

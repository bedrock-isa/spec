mnemonic: RESET
title: Reset
summary: Perform warm reset; preserve BOOTPC and BOOTCFG.
description: RESET serializes earlier memory effects, applies the complete architectural warm-reset state to the executing logical processor, and resumes execution at BOOTPC. BOOTPC and BOOTCFG are preserved.

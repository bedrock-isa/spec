mnemonic: EXTZQ
title: Zero Extend To Quad
summary: Performs the zero extend to quad operation.
description: Zero-extends the source operand from the instruction size to quad size. The low source-size bytes of the source are copied into the destination, and the remaining high destination bits are filled with zero.
attributes:
  class: integer
  family: integer_unary
  privilege: unprivileged
  repeat:
  - REP
  - REPcc
  - REPG
  - REPGF

mnemonic: MAXS
doc:
  title: Signed Maximum
  summary: Performs the signed maximum operation.
  instruction_family: integer_alu
  instruction_class: integer
  description: Compares the selected-width operands as signed integers and writes the greater value to the destination.
behavior:
  group: integer_minmax
  inputs:
  - src
  input_output: dst
  signedness: signed
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  operands:
  - - name: src
      type: EA
    - name: dst
      type: Rn
  - - name: src
      type: Rn
    - name: dst
      type: EA
  size: BWLQ
  compact: false
  result: second operand

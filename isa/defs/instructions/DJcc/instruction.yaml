mnemonic: DJcc
doc:
  title: Decrement And Jump Conditional
  summary: Performs the decrement and jump conditional operation.
  instruction_family: control_flow
  instruction_class: control_flow
  description: Decrements the selected counter and transfers control only when the new count is nonzero and the encoded condition is true.
behavior:
  group: control_flow
  inputs:
  - cc
  - target
  input_output: counter
attributes:
  privilege: unprivileged
forms:
  operands:
  - name: cc
    type: condition
  - name: counter
    type: Rn
  - name: target
    type: EA
  reads: FLAGS

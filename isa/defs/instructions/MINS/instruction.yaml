mnemonic: MINS
doc:
  title: Signed Minimum
  summary: Performs the signed minimum operation.
  instruction_family: integer_alu
  instruction_class: integer
  description: Compares the selected-width operands as signed integers and writes the lesser value to the destination.
behavior:
  group: integer_minmax
  inputs:
  - src
  input_output: dst
  signedness: signed
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  operands:
  - - name: src
      type: EA
    - name: dst
      type: Rn
  - - name: src
      type: Rn
    - name: dst
      type: EA
  size: BWLQ
  compact: false
  result: second operand

mnemonic: MOVCU
title: Move Current To User
summary: Copies from a current-domain source to user-domain memory.
description: MOVCU is a supervisor-only checked user-access move. The source is a current-domain memory operand, register, or immediate, and the destination is always user-domain memory.
attributes:
  class: system
  family: data_movement
  privilege: supervisor
repeat:
  contexts:
  - REP
  - REPcc
  - REPG
  observed:
    kind: result
    operand: dst

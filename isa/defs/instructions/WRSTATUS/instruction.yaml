mnemonic: WRSTATUS
doc:
  title: Write Status
  summary: Write the processor STATUS register from an Rn register.
  description: WRSTATUS writes the low 16 bits from the source Rn register into the architectural STATUS register. Reserved STATUS bits must be zero. STATUS is not part of the S segment-register operand class.
  instruction_family: system_registers
  instruction_class: system
attributes:
  privilege: supervisor
forms:
- operands:
  - name: src
    type: Rn
    access: read
  sizes:
  - W

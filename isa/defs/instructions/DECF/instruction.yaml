mnemonic: DECF
title: Decrement And Set Flags
summary: Decrements the destination operand and updates integer FLAGS.
description: Subtracts one from the selected-width destination, writes the modular result, and updates Z, N, C, and V.
attributes:
  class: integer
  family: integer_unary
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  - REPG
  observed:
    kind: flags
flag_effects:
  FLAGS:
    Z: "result == 0"
    N: "most_significant_bit(result)"
    C: "unsigned borrow"
    V: "signed overflow"

mnemonic: EXTZW
doc:
  title: Zero Extend To Word
  summary: Performs the zero extend to word operation.
  description: Zero-extends the source operand from byte size to word size. The low byte of the source is copied into the destination, and the remaining high destination bits are filled with zero.
  instruction_family: integer_unary
  instruction_class: integer
attributes:
  privilege: unprivileged
  repeat:
  - REP
  - REPcc
  - REPG
  - REPGF
forms:
- operands:
  - name: src
    type: EA
    access: read
  - name: dst
    type: Rn
    access: write
  sizes:
  - B
- operands:
  - name: src
    type: Rn
    access: read
  - name: dst
    type: EA
    access: write
  sizes:
  - B

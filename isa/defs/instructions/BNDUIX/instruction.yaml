mnemonic: BNDUIX
doc:
  title: Unsigned Bounds Check Inclusive-Exclusive
  summary: Checks unsigned value membership in the inclusive-exclusive interval [lo, hi).
  description: BNDUIX treats the low bound as inclusive and the high bound as exclusive. It sets V when unsigned(value) is outside [unsigned(lo), unsigned(hi)); Z, N, and C are unchanged.
  instruction_family: bounds
  instruction_class: integer
behavior:
  group: bounds
  inputs:
  - hi
  - lo
  - value
  output: none
  interval: "[lo, hi)"
  signedness: unsigned
  bounds_mode: IX
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  extension_family: integer_bounds_unsigned
  operands:
  - name: lo
    type: Rn
  - name: value
    type: EA
  - name: hi
    type: Rn
  size: BWLQ

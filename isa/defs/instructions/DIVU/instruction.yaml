mnemonic: DIVU
doc:
  title: Unsigned Divide
  summary: Performs the unsigned divide operation.
  instruction_family: integer_mul_div
  instruction_class: integer
  description: Divides the selected-width unsigned destination value by the unsigned source value and writes the quotient. A zero divisor raises DIVIDE_ERROR.
behavior:
  group: multiply_divide
  inputs:
  - src
  input_output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  operands:
  - - name: src
      type: EA
    - name: dst
      type: Rn
  size: BWLQ

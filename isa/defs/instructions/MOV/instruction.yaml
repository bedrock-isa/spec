mnemonic: MOV
title: Move
summary: Copies the source operand to the destination operand.
description: Reads the source using its addressing mode and selected size and writes that value to the destination.
attributes:
  class: data_movement
  family: data_movement
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  - REPG
  observed:
    kind: result
    operand: dst

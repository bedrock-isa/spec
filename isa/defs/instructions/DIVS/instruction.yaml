mnemonic: DIVS
title: Signed Divide
summary: Performs the signed divide operation.
description: Interprets both selected-width operands as signed integers, divides the destination by the source with truncation toward zero, and writes the quotient. Division by zero and the most-negative value divided by minus one raise DIVIDE_ERROR.
attributes:
  class: integer
  family: integer_mul_div
  privilege: unprivileged
  repeat:
  - REP
  - REPcc
  - REPG

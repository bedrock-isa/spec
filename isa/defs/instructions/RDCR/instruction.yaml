mnemonic: RDCR
doc:
  title: Read Control Register
  summary: Read a privileged control register.
  description: RDCR is always a supervisor-only instruction; user-visible control state must use dedicated instructions gated by control-register policy bits.
  instruction_family: system_registers
  instruction_class: system
attributes:
  privilege: supervisor
forms:
- operands:
  - name: cr
    type: imm16
    access: read
  - name: dst
    type: Rn
    access: write

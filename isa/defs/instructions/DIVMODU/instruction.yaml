mnemonic: DIVMODU
title: Unsigned Divide With Remainder
summary: Performs the unsigned divide with remainder operation.
description: The source operand supplies the unsigned divisor, and the quotient register Rn(q) supplies the unsigned dividend before the operation. On success, Rn(q) receives their unsigned quotient and the remainder register Rn(r) receives the unsigned remainder satisfying dividend = quotient * divisor + remainder.
attributes:
  class: integer
  family: integer_mul_div
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  - REPG
  observed:
    kind: result
    operand: quotient
exceptions:
- event: DIVIDE_ERROR
  when: the divisor is zero
- event: ILLEGAL_INSTRUCTION
  when: quotient and remainder designate the same register; cause is INVALID_OPERAND_RELATION
additional_description: details.tex

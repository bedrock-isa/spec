mnemonic: PTQUERY
title: Page Table Query
summary: Non-destructively reads the raw PTE selected at one page-table level.
description: PTQUERY treats the computed source effective address as a linear address and walks the page tables configured by PTCR down to the requested level. Levels 1 through 5 name L1 through L5; level 5 is unavailable in LA48 mode. If every preceding table pointer is valid, the destination receives the complete raw 64-bit PTE at the requested level, including software-defined bits. Z reports whether that returned entry is structurally valid for its level, and N, C, and V report accumulated U, W, and X permissions only when Z is set. A malformed requested entry is therefore observable in the destination even though Z is clear. Failure before the requested entry is read returns zero and clears all four flags. The query is independent of PTCR.PE and never sets PTE A or D, fills or modifies a TLB entry, or raises PAGE_FAULT for walk failure.
attributes:
  class: system
  family: tlb_and_context
  privilege: supervisor
flag_effects:
  FLAGS:
    Z: "requested PTE was read and is structurally valid for its level"
    N: "valid queried path is user-domain accessible; cleared on failure"
    C: "valid queried path is writable; cleared on failure"
    V: "valid queried path is executable; cleared on failure"

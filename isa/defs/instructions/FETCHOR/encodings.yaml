forms:
- id: extralong.fetchor_x_order_o_rn_s_ea_e
  class: extralong
  bits: 111111000101zz000010ooosssseeeeeee
  syntax: FETCHOR.X(z:B/W/L/Q)/order(o) Rn(s), <ea>(e)
  operands:
  - name: order
    type: memory_order
    access: read
    field: o
  - name: src
    type: Rn
    access: read_write
    field: s
  - name: memory
    type: EA
    access: read_write
    field: e
  sizes:
  - B
  - W
  - L
  - Q
  fields:
    z:
      type: size
  constraints:
  - field: o
    allow:
    - 0x0..0x4
    reason: memory_order_reserved_reclaimed
  - field: e
    exclude: reg_direct
    reason: memory_operand_required
  - field: e
    exclude: immediate
    reason: memory_operand_required

mnemonic: YIELD
title: Yield
summary: Hints to the scheduler or implementation that the current thread may yield.
description: Notifies the implementation that the current hardware thread may be deprioritized or descheduled. YIELD affects scheduling only; memory accesses retain the ordinary instruction-ordering rules, and execution resumes at the next instruction.
attributes:
  class: system
  family: core_control
  privilege: any

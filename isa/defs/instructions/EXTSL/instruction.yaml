mnemonic: EXTSL
title: Sign Extend To Long
summary: Performs the sign extend to long operation.
description: Sign-extends the source operand from the instruction size to long size. The low source-size bytes of the source are copied into the destination, and the remaining high destination bits are filled with the source sign bit.
attributes:
  class: integer
  family: integer_unary
  privilege: unprivileged
  repeat:
  - REP
  - REPcc
  - REPG
  - REPGF

mnemonic: INCF
doc:
  title: Increment And Set Flags
  summary: Increments the destination operand and updates integer FLAGS.
  instruction_family: integer_unary
  instruction_class: integer
  description: Adds one to the selected-width destination, writes the modular result, and updates Z, N, C, and V.
flags:
  Z: result == 0
  N: most_significant_bit(result)
  C: unsigned carry out
  V: signed overflow
attributes:
  privilege: unprivileged
  repeat:
  - REP
  - REPcc
  - REPG
forms:
- operands:
  - name: dst
    type: Rn
    access: read_write
  sizes:
  - B
  - W
  - L
  - Q

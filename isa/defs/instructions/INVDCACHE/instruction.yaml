mnemonic: INVDCACHE
doc:
  title: Invalidate Data Cache
  summary: Invalidate data cache block or range.
  instruction_family: cache
  instruction_class: system
  description: Resolves the addressed range without reading it and invalidates every intersecting data-cache line without writing back dirty data before retirement.
attributes:
  privilege: supervisor
forms:
- operands:
  - name: target
    type: EA
    access: address

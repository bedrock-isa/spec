mnemonic: BNDSII
doc:
  title: Signed Bounds Check Inclusive-Inclusive
  summary: Checks signed value membership in the inclusive-inclusive interval [lo, hi].
  description: BNDSII treats both bounds as inclusive. It sets V when signed(value) is outside [signed(lo), signed(hi)]; Z, N, and C are unchanged.
  instruction_family: bounds
  instruction_class: integer
attributes:
  privilege: unprivileged
  repeat:
  - REP
  - REPcc
  - REPG
forms:
- operands:
  - name: lo
    type: Rn
    access: read
  - name: value
    type: EA
    access: read
  - name: hi
    type: Rn
    access: read
  sizes:
  - B
  - W
  - L
  - Q

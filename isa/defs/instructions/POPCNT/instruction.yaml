mnemonic: POPCNT
title: Population Count
summary: Performs the population count operation.
description: Counts set bits within the selected B, W, L, or Q source width and writes that count to the destination.
attributes:
  class: integer
  family: integer_bitfield
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPcc
  - REPG
  observed:
    kind: result
    operand: dst

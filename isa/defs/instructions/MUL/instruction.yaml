mnemonic: MUL
doc:
  title: Multiply Low
  summary: Multiplies the destination by the source and keeps the low half.
  description: MUL is the shared low-half integer multiply form. Signed and unsigned low-half multiplication produce the same low N result, so the scalar core uses one low-half multiply mnemonic.
  instruction_family: integer_mul_div
  instruction_class: integer
attributes:
  privilege: unprivileged
  repeat:
  - REP
  - REPcc
  - REPG
forms:
- operands:
  - name: src
    type: EA
    access: read
  - name: dst
    type: Rn
    access: read_write
  sizes:
  - B
  - W
  - L
  - Q

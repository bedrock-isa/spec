mnemonic: AND
doc:
  title: Bitwise And
  summary: Computes the bitwise AND of the source and destination operands.
  instruction_family: integer_alu
  instruction_class: integer
  description: Writes the selected-width bitwise conjunction of the source and destination values to the destination.
behavior:
  group: integer_alu
  inputs:
  - src
  input_output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
  repgf_candidate: true
  streaming_candidate: true
  flags: unchanged
forms:
  dst_ea_set: store_destination
  compact_forms:
  - operands:
    - name: src
      type: Rn
    - name: dst
      type: Rn
    size: LQ
  - operands:
    - name: imm
      type: imm
    - name: dst
      type: Rn
    size: WL
  extended_forms:
  - operands:
    - name: src
      type: EA
    - name: dst
      type: Rn
    size: BWLQ
    compact: false
  - operands:
    - name: src
      type: Rn
    - name: dst
      type: EA
    size: BWLQ
    compact: false
  - operands:
    - name: imm
      type: imm6
    - name: dst
      type: EA
    size: BWLQ
    compact: false
  form: destructive two-address form
  result: second operand
  memory_memory: disallowed

mnemonic: SAVE
doc:
  title: Save Processor State
  summary: Save modified processor state to a CPUID-defined save area.
  description: 'SAVE uses an XSAVEOPT-like policy for enabled extension state: state blocks that are architecturally clean may be skipped, while modified blocks are written to their CPUID-defined 64-byte-aligned slots. The fixed base block always records R0-R15, FLAGS, and STATUS. SAVE writes a recognized format and sets bitmap bits only for CPUID-described components. The memory image does not carry per-component size records; software allocates the maximum required save area size reported by CPUID. The save-area base must be 4 KiB aligned.'
  instruction_family: tlb_and_context
  instruction_class: system
behavior:
  group: tlb_context
  inputs:
  - memory
  output: none
attributes:
  privilege: unprivileged
forms:
  operands:
  - name: memory
    type: EA

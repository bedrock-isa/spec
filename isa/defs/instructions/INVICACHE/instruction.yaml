mnemonic: INVICACHE
doc:
  title: Invalidate Instruction Cache
  summary: Invalidate instruction cache block or range.
  instruction_family: cache
  instruction_class: system
  description: Resolves the addressed range without fetching from it, invalidates intersecting instruction-cache and decoded state, discards matching prefetched bytes, and forces later execution to refetch coherent bytes.
behavior:
  group: cache
  inputs:
  - target
  output: none
attributes:
  privilege:
    default: supervisor
    policy_controlled: true
forms:
  require_memory_operand: true
  operands:
  - name: target
    type: EA

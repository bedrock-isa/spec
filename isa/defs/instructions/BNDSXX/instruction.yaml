mnemonic: BNDSXX
title: Signed Bounds Check Exclusive-Exclusive
summary: Checks signed value membership in the exclusive-exclusive interval (lo, hi).
description: BNDSXX treats both bounds as exclusive. It sets V when signed(value) is outside (signed(lo), signed(hi)); Z, N, and C are unchanged.
attributes:
  class: integer
  family: bounds
  privilege: unprivileged
  repeat:
  - REP
  - REPcc
  - REPG

version: rewrite-draft-v1
source: old/isa/spec/instructions.yaml:operand_schema
operand_schema:
  role_name_pattern: ^[a-z][a-z0-9_]*$
  types:
  - Rn
  - SP
  - CS
  - EA
  - EA_or_range
  - FREG
  - fbitmap16
  - CR
  - SPREG
  - SREG
  - bitmap16
  - condition
  - imm
  - imm3
  - imm4
  - imm6
  - imm7
  - imm16
  - imm32
  - imm64
  - linear_or_EA
  - memory_order
  - outputs
  - relative_imm
  - selector
  - selector_imm6
  immediate_operands:
    imm3:
      width: 3
      signed: false
      range:
      - 0
      - 7
      operation_size_extension: zero_extend
    imm4:
      width: 4
      signed: false
      range:
      - 0
      - 15
      operation_size_extension: zero_extend
    imm6:
      width: 6
      signed: false
      range:
      - 0
      - 63
      operation_size_extension: zero_extend
    imm7:
      width: 7
      signed: false
      range:
      - 0
      - 127
      operation_size_extension: zero_extend
  condition_role: cc
  selector_roles:
  - count
  - bit_index
  - offset
  - width
  size_codes:
    B:
      suffix: .B
      bytes: 1
    W:
      suffix: .W
      bytes: 2
    L:
      suffix: .L
      bytes: 4
    Q:
      suffix: .Q
      bytes: 8
    S:
      suffix: .S
      bytes: 4
    D:
      suffix: .D
      bytes: 8
  size_kinds:
    BWLQ:
      field: s
      values:
      - value: 0
        code: B
      - value: 1
        code: W
      - value: 2
        code: L
      - value: 3
        code: Q
    LQ:
      field: z
      values:
      - value: 0
        code: L
      - value: 1
        code: Q
    WL:
      field: z
      values:
      - value: 0
        code: W
      - value: 1
        code: L
    BW:
      field: s
      values:
      - value: 0
        code: B
      - value: 1
        code: W
    BWL:
      field: s
      values:
      - value: 0
        code: B
      - value: 1
        code: W
      - value: 2
        code: L
      reserved_values:
      - value: 3
        name: invalid
    BWLX:
      field: s
      values:
      - value: 0
        code: B
      - value: 1
        code: W
      - value: 2
        code: L
      reserved_values:
      - value: 3
        name: invalid
    S_D:
      field: z
      values:
      - value: 0
        code: S
      - value: 1
        code: D
  named_values:
    memory_order:
      width: 3
      values:
      - value: 0
        name: RELAXED
      - value: 1
        name: ACQUIRE
      - value: 2
        name: RELEASE
      - value: 3
        name: ACQREL
      - value: 4
        name: SEQCST
      reserved_values:
      - value: 5
        name: RESERVED5
      - value: 6
        name: RESERVED6
      - value: 7
        name: RESERVED7
  bitmap_operands:
    bitmap16:
      width: 16
      ranges:
      - bits:
        - 0
        - 15
        register_class: Rn
    fbitmap16:
      width: 16
      ranges:
      - bits:
        - 0
        - 15
        register_class: F

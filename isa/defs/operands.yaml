operand_types:
  Rn:
    kind: register
    register_group: general
    field_width: 4
  SP:
    kind: fixed_register
    register: SP
    field_width: 0
  CS:
    kind: fixed_register
    register: CS
    field_width: 0
  EA:
    kind: effective_address
    encoding_ref: ea.yaml#compact
    field_width: 7
  SREG:
    kind: register
    register_group: segment
    field_width: 3
  condition:
    kind: enum
    values_ref: conditions.yaml#conditions
    field_width: 4
  imm:
    kind: ea_immediate
    encoding_ref: ea.yaml#compact/forms
    field_width: 7
  pair_id:
    kind: identifier
    field_width: 3
    signed: false
  pt_level:
    kind: enum
    field_width: 3
    values:
    - {value: 1, name: L1}
    - {value: 2, name: L2}
    - {value: 3, name: L3}
    - {value: 4, name: L4}
    - {value: 5, name: L5}
    reserved_values:
    - {value: 0, name: RESERVED0}
    - {value: 6, name: RESERVED6}
    - {value: 7, name: RESERVED7}
  flags_bitmap:
    kind: bitmap
    field_width: 4
    bits:
    - {bit: 3, name: Z}
    - {bit: 2, name: N}
    - {bit: 1, name: C}
    - {bit: 0, name: V}
  imm6:
    kind: immediate
    field_width: 6
    signed: false
    operation_size_extension: zero_extend
  imm7:
    kind: immediate
    field_width: 7
    signed: false
    operation_size_extension: zero_extend
  imm16:
    kind: immediate
    field_width: 16
    signed: false
  imm32:
    kind: immediate
    field_width: 32
    signed: false
  imm64:
    kind: immediate
    field_width: 64
    signed: false
  imm8s:
    kind: relative_immediate
    field_width: 8
    signed: true
  imm16s:
    kind: relative_immediate
    field_width: 16
    signed: true
  imm32s:
    kind: relative_immediate
    field_width: 32
    signed: true
  memory_order:
    kind: enum
    field_width: 3
    values:
    - {value: 0, name: RELAXED}
    - {value: 1, name: ACQUIRE}
    - {value: 2, name: RELEASE}
    - {value: 3, name: ACQREL}
    - {value: 4, name: SEQCST}
    reserved_values:
    - {value: 5, name: RESERVED5}
    - {value: 6, name: RESERVED6}
    - {value: 7, name: RESERVED7}

registers:
  general:
    entries:
    - {name: R0, width: 64, encoding: 0}
    - {name: R1, width: 64, encoding: 1}
    - {name: R2, width: 64, encoding: 2}
    - {name: R3, width: 64, encoding: 3}
    - {name: R4, width: 64, encoding: 4}
    - {name: R5, width: 64, encoding: 5}
    - {name: R6, width: 64, encoding: 6}
    - {name: R7, width: 64, encoding: 7}
    - {name: R8, width: 64, encoding: 8}
    - {name: R9, width: 64, encoding: 9}
    - {name: R10, width: 64, encoding: 10}
    - {name: R11, width: 64, encoding: 11}
    - {name: R12, width: 64, encoding: 12}
    - {name: R13, width: 64, encoding: 13}
    - {name: R14, width: 64, encoding: 14}
    - {name: R15, width: 64, encoding: 15}
  special:
    entries:
    - {name: SP, width: 64}
    - {name: PC, width: 64}
  segment:
    entries:
    - {name: CS, width: 64, role: code}
    - name: DS
      width: 64
      encoding: 0
      role: data
      description: default data segment
    - name: SS
      width: 64
      encoding: 1
      role: stack
      description: stack segment; fixed for SP-relative forms
    - name: GS0
      width: 64
      encoding: 2
      role: general
      description: general segment register 0
    - name: GS1
      width: 64
      encoding: 3
      role: general
      description: general segment register 1
    - name: GS2
      width: 64
      encoding: 4
      role: general
      description: general segment register 2
    - name: GS3
      width: 64
      encoding: 5
      role: general
      description: general segment register 3
    - name: GS4
      width: 64
      encoding: 6
      role: general
      description: general segment register 4
    - name: GS5
      width: 64
      encoding: 7
      role: general
      description: general segment register 5

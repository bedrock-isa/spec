mnemonic: AFENCE
doc:
  title: Address Fence
  summary: Order prior memory operations before later memory operations.
  instruction_family: core_control
  instruction_class: system
  description: Prevents retirement until every earlier memory read and write is ordered before every later memory read and write on the same hardware thread. It performs no memory access and changes no register or flag.
behavior:
  group: core_control
  output: none
attributes:
  privilege: any
forms:
  operands: []
definition_status:
  allocation: 'external: isa/alloc'

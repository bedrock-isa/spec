mnemonic: INCF
doc:
  title: Increment And Set Flags
  summary: Increments the destination operand and updates integer FLAGS.
  instruction_family: integer_unary
  instruction_class: integer
behavior:
  group: integer_unary
  input_output: dst
  operation:
  - result_v = dst_v + 1;
  - dst_v = result_v;
  - ZF = result_v == 0;
  - NF = result_v s< 0;
  - CF = carry(dst_old_v, 1:8);
  - VF = scarry(dst_old_v, 1:8);
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
  flags:
    Z: result == 0
    N: most_significant_bit(result)
    C: unsigned carry out
    V: signed overflow
forms:
  operands:
  - name: dst
    type: Rn
  size: BWLQ
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: VTOP
doc:
  title: Virtual To Physical Query
  summary: Non-destructively queries the current translation of a linear address.
  description: >
    VTOP translates the supplied linear address with the current PTCR configuration without
    performing an architectural memory access. With paging disabled, the address is returned
    unchanged. With paging enabled, the instruction performs the configured LA48 or LA57 walk.
    Translation failures are reported through the integer flags instead of raising PAGE_FAULT.
    A successful query returns the physical address and reports the accumulated U, W, and X
    permissions. The query never sets PTE A or D, fills or modifies a TLB entry, or otherwise
    changes translation state.
  instruction_family: tlb_and_context
  instruction_class: system
behavior:
  group: tlb_context
  inputs:
  - virt
  output: phys
  operation:
  - local linear_v = virt_v & 0xffffffffffffffff;
  - local success_v = true;
  - local effective_u_v = true, effective_w_v = true, effective_x_v = true;
  - if PTCR.PE == 0, set phys_v = linear_v and goto <vtop_complete>;
  - local top_level_v = (PTCR.LA57 != 0) ? 5 : 4;
  - if top_level_v == 4 and linear_v[63:48] is not the sign extension of linear_v[47], set success_v = false and goto <vtop_complete>;
  - if top_level_v == 5 and linear_v[63:57] is not the sign extension of linear_v[56], set success_v = false and goto <vtop_complete>;
  - local table_base_v = PTCR.root_page << 12;
  - local level_v = top_level_v;
  - <vtop_next_level>
  - local index_v = linear_v[(12 + 9 * level_v - 1):(12 + 9 * (level_v - 1))];
  - local pte_v = read one 64-bit PTE from physical address table_base_v + 8 * index_v;
  - if level_v > 1 and (pte_v.P == 0 or pte_v.T == 0 or pte_v.D != 0 or pte_v.G != 0 or pte_v.AT != 0), set success_v = false and goto <vtop_complete>;
  - if level_v == 1 and (pte_v.P == 0 or pte_v.T != 0), set success_v = false and goto <vtop_complete>;
  - effective_u_v = effective_u_v && (pte_v.U != 0);
  - effective_w_v = effective_w_v && (pte_v.W != 0);
  - effective_x_v = effective_x_v && (pte_v.X != 0);
  - if level_v == 1, set phys_v = (pte_v.PFN << 12) | linear_v[11:0] and goto <vtop_complete>;
  - table_base_v = pte_v.PFN << 12;
  - level_v = level_v - 1;
  - goto <vtop_next_level>;
  - <vtop_complete>
  - if !success_v, phys_v = 0;
  - ZF = success_v;
  - NF = success_v && effective_u_v;
  - CF = success_v && effective_w_v;
  - VF = success_v && effective_x_v;
attributes:
  privilege: supervisor
  flags:
    Z: translation query succeeded
    N: successful translation is user-domain accessible; cleared on failure
    C: successful translation is writable; cleared on failure
    V: successful translation is executable; cleared on failure
forms:
  operands:
  - name: virt
    type: Rn
  - name: phys
    type: Rn
  performs_page_walk: true
  input_address_stage: linear address; segment pre-translation is not applied
  paging_disabled_result: input linear address unchanged
  failure_result: zero
  page_fault_on_translation_failure: false
  mutates_pte_accessed_or_dirty: false
  mutates_tlb: false
definition_status:
  allocation: 'external: isa/alloc'

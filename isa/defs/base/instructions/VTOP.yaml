mnemonic: VTOP
doc:
  title: Virtual To Physical Query
  summary: Perform page walk and return translated physical address/status.
  instruction_family: tlb_and_context
  instruction_class: system
behavior:
  group: tlb_context
  inputs:
  - virt
  output: phys
  operation:
  - phys_v = arch_page_translate(virt_v);
attributes:
  privilege: supervisor
  flags: operation-defined status result
forms:
  operands:
  - name: virt
    type: Rn
  - name: phys
    type: Rn
  performs_page_walk: true
definition_status:
  allocation: 'external: isa/alloc'

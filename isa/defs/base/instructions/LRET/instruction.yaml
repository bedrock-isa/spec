mnemonic: LRET
doc:
  title: Long Return
  summary: Pops a far return frame and atomically restores CS:PC.
  description: Long return reads the far return frame from SS:SP and commits CS and PC together. The frame contains the return PC Q value at the current SP and the return CS Q value at SP+8; after both values are fetched, SP is advanced by 16 bytes and the control state is committed.
  instruction_family: control_flow
  instruction_class: control_flow
behavior:
  group: control_flow
  output: none
  exceptions:
    frame_translation: PAGE_FAULT
    invalid_return_cs_image: INVALID_CONTROL_STATE
    return_target_bounds_or_execute_translation: PAGE_FAULT
attributes:
  privilege: unprivileged
  privilege_transition: none
forms:
  operands: []
  compact: false
  return_frame:
    size_bytes: 16
    return_pc_offset: 0
    return_cs_offset: 8
    stack_segment: old_SS
definition_status:
  allocation: 'external: isa/alloc'

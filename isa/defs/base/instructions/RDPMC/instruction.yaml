mnemonic: RDPMC
doc:
  title: Read Performance Counter
  summary: Read the 64-bit performance counter selected by a constant counter ID.
  description: RDPMC reads a mandatory or implementation-discovered performance counter. Supervisor mode may read every implemented counter. User-mode access requires PMC.USER to be set; otherwise RDPMC raises PRIVILEGE_FAULT. Counter ID zero and every other unimplemented counter ID raise INVALID_CONTROL_STATE with the INVALID_SELECTOR cause.
  instruction_family: system_registers
  instruction_class: system
behavior:
  group: system_registers
  inputs:
  - counter_id
  output: dst
attributes:
  privilege: configurable
  flags: unchanged
forms:
  operands:
  - name: counter_id
    type: imm16
  - name: dst
    type: Rn
definition_status:
  allocation: 'external: isa/alloc'

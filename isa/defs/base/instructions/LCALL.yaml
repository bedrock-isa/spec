mnemonic: LCALL
doc:
  title: Long Call
  summary: Pushes a far return frame and atomically transfers control to a new CS:PC pair.
  description: Long call is the CS-changing call instruction. It first constructs the far return frame
    on SS:SP, then commits the new CS and PC together. The two-operand form takes the new CS image from
    Rn and the target offset/address from the target EA. A segment-immediate plus offset-immediate form
    is not encoded because two 64-bit immediates would exceed the instruction-length budget for this form.
  instruction_family: control_flow
  instruction_class: control_flow
behavior:
  group: control_flow
  inputs:
  - new_cs
  - target
  output: none
  operation:
  - local return_pc_v:8 = inst_next;
  - SP = SP - 16;
  - '*:8 SP = return_pc_v;'
  - '*:8 (SP + 8) = CS;'
  - CS = new_cs_v;
  - call [target_v];
  fault_order:
    - Evaluate the target operand completely in the old architectural context.
    - Validate the complete new CS image.
    - Validate the target offset against the new CS and probe executable translation at the resulting linear address.
    - Probe both 8-byte far-return-frame stores through the old SS context.
    - Commit the two frame stores, decremented SP, new CS, and new PC as one successful control-transfer operation.
  fault_atomicity: no frame word, SP, CS, or PC update is visible when any prior step faults
  exceptions:
    invalid_cs_image: INVALID_CONTROL_STATE
    target_bounds_or_execute_translation: PAGE_FAULT
    stack_frame_translation: PAGE_FAULT
attributes:
  privilege: unprivileged
  privilege_transition: none
forms:
  segment_operand: Rn
  target_ea_set: long_control_target
  atomic_cs_pc_update: true
  disallow_immediate_segment_plus_immediate_offset: true
  operands:
  - name: new_cs
    type: Rn
  - name: target
    type: EA
  compact: false
  disallow_segment_immediate: true
  call_frame:
    size_bytes: 16
    return_pc_offset: 0
    return_cs_offset: 8
    stack_segment: old_SS
definition_status:
  allocation: 'external: isa/alloc'

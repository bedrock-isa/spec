mnemonic: TRACE
doc:
  title: Trace Marker
  summary: Performs the trace marker operation.
  instruction_family: control_flow
  instruction_class: control_flow
behavior:
  group: control_flow
  inputs:
  - marker
  output: none
  operation:
  - local marker_id_v = marker_v & 0xffff;
  - if architectural tracing is disabled, goto <trace_done>;
  - append marker_id_v and the current instruction boundary to the implementation trace stream;
  - <trace_done>
attributes:
  privilege: unprivileged
forms:
  operands:
  - name: marker
    type: imm16
  if_trace_disabled: nop
definition_status:
  allocation: 'external: isa/alloc'

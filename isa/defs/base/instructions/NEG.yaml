mnemonic: NEG
doc:
  title: Negate
  summary: Performs the negate operation.
  instruction_family: integer_unary
  instruction_class: integer
behavior:
  group: integer_unary
  input_output: dst
  operation:
  - result_v = 0 - dst_v;
  - dst_v = result_v;
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
  repgf_candidate: true
  flags: unchanged
forms:
  compact_forms:
  - operands:
    - name: dst
      type: Rn
    size: LQ
  extended_forms:
  - operands:
    - name: dst
      type: EA
    size: BWLQ
    compact: false
definition_status:
  allocation: 'external: isa/alloc'

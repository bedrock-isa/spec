mnemonic: TRAPcc
doc:
  title: Trap Conditional
  summary: Raises architectural TRAP vector 0x05 when the encoded condition is true.
  instruction_family: control_flow
  instruction_class: control_flow
behavior:
  group: control_flow
  inputs:
  - cc
  output: none
  operation:
  - if (cc_v == 0) goto <trapcc_done>;
  - arch_raise_trap(5:8);
  - <trapcc_done>
attributes:
  privilege: unprivileged
forms:
  operands:
  - name: cc
    type: condition
  reads: FLAGS
  vector: 5
definition_status:
  allocation: 'external: isa/alloc'

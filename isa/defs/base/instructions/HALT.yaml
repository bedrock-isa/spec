mnemonic: HALT
doc:
  title: Halt
  summary: Enter halted supervisor state until an enabled event resumes execution.
  instruction_family: core_control
  instruction_class: system
behavior:
  group: core_control
  output: none
  operation:
  - retire HALT with continuation PC = inst_next and set execution_state = HALTED;
  - while execution_state == HALTED, fetch and retire no instructions;
  - when an enabled architectural event is admitted, clear execution_state = HALTED and deliver that event using inst_next as the interrupted continuation;
attributes:
  privilege: supervisor
forms:
  operands: []
definition_status:
  allocation: 'external: isa/alloc'

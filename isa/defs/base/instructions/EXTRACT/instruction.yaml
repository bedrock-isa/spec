mnemonic: EXTRACT
doc:
  title: Extract From Register Pair
  summary: Extracts a selected-width value from a concatenated pair of Rn registers.
  description: Concatenates Rn(high) as the upper half and the original Rn(low/dest) value as the lower half, shifts the concatenated value right by an unsigned 7-bit immediate offset, and writes the low selected-size result back to Rn(low/dest). The operation is similar to ARM EXTR, but uses the Bedrock B/W/L/Q operation size and a 7-bit immediate offset.
  instruction_family: integer_bitfield
  instruction_class: integer
behavior:
  group: bitfield_extract
  inputs:
  - offset
  - high
  input_output: low_dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
  flags: unchanged
forms:
  operands:
  - name: offset
    type: imm7
  - name: high
    type: Rn
  - name: low_dst
    type: Rn
  size: BWLQ
  compact: false
  result: low/destination register
definition_status:
  allocation: 'external: isa/alloc'

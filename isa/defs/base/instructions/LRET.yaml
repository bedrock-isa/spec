mnemonic: LRET
doc:
  title: Long Return
  summary: Pops a far return frame and atomically restores CS:PC.
  description: Long return reads the far return frame from SS:SP and commits CS and PC together. The frame
    contains the return PC Q value at the current SP and the return CS Q value at SP+8; after both values
    are fetched, SP is advanced by 16 bytes and the control state is committed.
  instruction_family: control_flow
  instruction_class: control_flow
behavior:
  group: control_flow
  output: none
  operation:
  - local return_pc_v:8 = *:8 SP;
  - local return_cs_v:8 = *:8 (SP + 8);
  - SP = SP + 16;
  - CS = return_cs_v;
  - return [return_pc_v];
  fault_order:
    - Read both 8-byte far-return-frame words through the old SS context without changing SP.
    - Validate the complete return CS image.
    - Validate the return PC offset against the return CS and probe executable translation at the resulting linear address.
    - Commit advanced SP, return CS, and return PC as one successful control-transfer operation.
  fault_atomicity: SP, CS, and PC remain unchanged when a frame read or return-target validation faults
  exceptions:
    frame_translation: PAGE_FAULT
    invalid_return_cs_image: INVALID_CONTROL_STATE
    return_target_bounds_or_execute_translation: PAGE_FAULT
attributes:
  privilege: unprivileged
  privilege_transition: none
forms:
  operands: []
  compact: false
  return_frame:
    size_bytes: 16
    return_pc_offset: 0
    return_cs_offset: 8
    stack_segment: old_SS
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: RDCR
doc:
  title: Read Control Register
  summary: Read a privileged control register.
  description: Read a privileged control register. RDCR is always a supervisor-only instruction; user-visible
    control state must use dedicated instructions gated by control-register policy bits.
  instruction_family: system_registers
  instruction_class: system
behavior:
  group: system_registers
  inputs:
  - cr
  output: dst
  operation:
  - local selector_v = cr_v & 0xffff;
  - if selector_v is not assigned by the Control-Register Selectors table, raise INVALID_CONTROL_STATE;
  - dst_v = the 64-bit image of the control register assigned to selector_v with reserved bits read as zero;
  control_register_access:
    selector: cr
    read: dst
attributes:
  privilege: supervisor
  flags: unchanged
forms:
  operands:
  - name: cr
    type: imm16
  - name: dst
    type: Rn
definition_status:
  allocation: 'external: isa/alloc'

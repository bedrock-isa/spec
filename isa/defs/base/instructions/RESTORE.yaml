mnemonic: RESTORE
doc:
  title: Restore Processor State
  summary: Restore processor state from a CPUID-defined save area.
  description: Restore processor state from a CPUID-defined save area. The save area uses a fixed architectural
    layout discovered through CPUID; it does not contain a per-component size table. The save-area base
    must be 4 KiB aligned. RESTORE is the matching restore operation for SAVE and may restore base architectural
    state as well as enabled extension state from the same save image. User-mode RESTORE ignores the saved
    STATUS image; supervisor RESTORE applies the normal STATUS write rules.
  instruction_family: tlb_and_context
  instruction_class: system
behavior:
  group: tlb_context
  inputs:
  - memory
  output: none
  operation:
  - local base_v = effective address of memory without reading memory;
  - if (base_v & 0xfff) != 0, raise INVALID_CONTROL_STATE;
  - read the complete fixed base block at base_v without changing architectural state;
  - decode SAVE format, GS_VALID, FLAGS, STATUS, and state_bitmap_v from offsets 0x000 and 0x008;
  - if the format is unsupported or any reserved header or bitmap bit is nonzero, raise INVALID_CONTROL_STATE;
  - for each set state_bitmap_v bit in CPUID descriptor order, read the complete CPUID-defined extension component without changing architectural state;
  - validate every loaded FLAGS, STATUS, GS, and extension-state image before changing architectural state;
  - if STATUS.PM == 0, discard the saved STATUS image; otherwise apply the ordinary privileged STATUS-write validation rules;
  - restore R0-R15 from 8-byte slots at base_v + 0x010 + 8 * reg_v;
  - for reg_v = 0 to 4 with GS_VALID[reg_v] set, restore GS[reg_v] from base_v + 0x090 + 8 * reg_v;
  - restore FLAGS and every extension component selected by state_bitmap_v;
  - in supervisor mode restore the validated STATUS image;
  - commit all selected register, flag, status, and extension-state changes atomically; on any prior fault leave architectural state unchanged;
  operation_text: 'RESTORE reads the fixed base block from the selected save-area address. It restores
    R0-R15 and FLAGS from the fixed base block; GS registers are restored only when their GS_VALID bits
    are set. User-mode RESTORE ignores the saved STATUS image, while supervisor RESTORE applies the normal
    STATUS write rules. Extension components whose state-block bitmap bits are set are restored from their
    CPUID-defined component offsets.

    '
attributes:
  privilege: unprivileged
forms:
  operands:
  - name: memory
    type: EA
definition_status:
  allocation: 'external: isa/alloc'

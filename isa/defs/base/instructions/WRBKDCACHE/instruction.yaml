mnemonic: WRBKDCACHE
doc:
  title: Write Back Data Cache
  summary: Write back data cache block or range.
  instruction_family: cache
  instruction_class: system
  description: Resolves the addressed range without reading it, writes every dirty byte in intersecting data-cache lines to the point of coherency, retains the lines as clean, and retires after completion.
behavior:
  group: cache
  inputs:
  - target
  output: none
attributes:
  privilege:
    default: supervisor
    policy_controlled: true
forms:
  require_memory_operand: true
  operands:
  - name: target
    type: EA_or_range
definition_status:
  allocation: 'external: isa/alloc'

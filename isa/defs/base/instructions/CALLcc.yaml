mnemonic: CALLcc
doc:
  title: Call Conditional
  summary: Performs a call when the condition is true.
  instruction_family: control_flow
  instruction_class: control_flow
behavior:
  group: control_flow
  inputs:
  - cc
  - target
  output: none
  operation:
  - if (cc_v == 0) goto <callcc_done>;
  - local return_pc_v:8 = inst_next;
  - SP = SP - 8;
  - '*:8 SP = return_pc_v;'
  - call [target_v];
  - <callcc_done>
attributes:
  privilege: unprivileged
forms:
  operands:
  - name: cc
    type: condition
  - name: target
    type: relative_imm
  size:
    fixed: Q
definition_status:
  allocation: 'external: isa/alloc'

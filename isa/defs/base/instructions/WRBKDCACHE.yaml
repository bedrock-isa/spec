mnemonic: WRBKDCACHE
doc:
  title: Write Back Data Cache
  summary: Write back data cache block or range.
  instruction_family: cache
  instruction_class: system
behavior:
  group: cache
  inputs:
  - target
  output: none
  operation:
  - resolve target_v to the addressed byte range without reading the target bytes;
  - for each dirty data-cache line intersecting the range, write every dirty byte to the point of coherency;
  - retain the selected data-cache lines in a clean state;
  - retire only after all selected writebacks are complete and visible to this hardware thread;
attributes:
  privilege:
    default: supervisor
    policy_controlled: true
forms:
  require_memory_operand: true
  operands:
  - name: target
    type: EA_or_range
definition_status:
  allocation: 'external: isa/alloc'

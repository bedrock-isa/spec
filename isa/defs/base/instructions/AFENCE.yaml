mnemonic: AFENCE
doc:
  title: Address Fence
  summary: Order prior memory operations before later memory operations.
  instruction_family: core_control
  instruction_class: system
behavior:
  group: core_control
  output: none
  operation:
  - block retirement until every memory read and write issued before AFENCE is ordered before every memory read and write issued after AFENCE by this hardware thread;
  - AFENCE performs no memory access and changes no architectural register or flag;
attributes:
  privilege: any
forms:
  operands: []
definition_status:
  allocation: 'external: isa/alloc'

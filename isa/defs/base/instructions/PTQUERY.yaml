mnemonic: PTQUERY
doc:
  title: Page Table Query
  summary: Perform page walk and return query result/status.
  instruction_family: tlb_and_context
  instruction_class: system
behavior:
  group: tlb_context
  inputs:
  - level
  - src
  output: dst
  operation:
  - dst_v = arch_page_query(level_v, src_v);
attributes:
  privilege: supervisor
  flags: operation-defined status result
forms:
  src_ea_set: pure_address_calculation
  require_address_value: true
  operands:
  - name: level
    type: imm3
  - name: src
    type: EA
  - name: dst
    type: Rn
  performs_page_walk: true
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: PTQUERY
doc:
  title: Page Table Query
  summary: Non-destructively reads the raw PTE selected at one page-table level.
  description: >
    PTQUERY treats the computed source effective address as a linear address and walks the page
    tables configured by PTCR down to the requested level. Levels 1 through 5 name L1 through L5;
    level 5 is unavailable in LA48 mode. If every preceding table pointer is valid, the destination
    receives the complete raw 64-bit PTE at the requested level, including software-defined bits.
    Z reports whether that returned entry is structurally valid for its level, and N, C, and V
    report accumulated U, W, and X permissions only when Z is set. A malformed requested entry is
    therefore observable in the destination even though Z is clear. Failure before the requested
    entry is read returns zero and clears all four flags. The query is independent of PTCR.PE and
    never sets PTE A or D, fills or modifies a TLB entry, or raises PAGE_FAULT for walk failure.
  instruction_family: tlb_and_context
  instruction_class: system
behavior:
  group: tlb_context
  inputs:
  - level
  - src
  output: dst
  operation:
  - local requested_level_v = level_v & 0x7;
  - if requested_level_v == 0 or requested_level_v > 5, raise ILLEGAL_INSTRUCTION;
  - local linear_v = effective address of src without reading memory or applying segment pre-translation;
  - dst_v = 0;
  - local top_level_v = (PTCR.LA57 != 0) ? 5 : 4;
  - local success_v = true;
  - local effective_u_v = true, effective_w_v = true, effective_x_v = true;
  - if requested_level_v > top_level_v, set success_v = false and goto <ptquery_complete>;
  - if top_level_v == 4 and linear_v[63:48] is not the sign extension of linear_v[47], set success_v = false and goto <ptquery_complete>;
  - if top_level_v == 5 and linear_v[63:57] is not the sign extension of linear_v[56], set success_v = false and goto <ptquery_complete>;
  - local table_base_v = PTCR.root_page << 12;
  - local current_level_v = top_level_v;
  - <ptquery_next_level>
  - local index_v = linear_v[(12 + 9 * current_level_v - 1):(12 + 9 * (current_level_v - 1))];
  - local pte_v = read one 64-bit PTE from physical address table_base_v + 8 * index_v;
  - if current_level_v == requested_level_v, set dst_v = pte_v and goto <ptquery_validate_result>;
  - if pte_v.P == 0 or pte_v.T == 0 or pte_v.D != 0 or pte_v.G != 0 or pte_v.AT != 0, set success_v = false and goto <ptquery_complete>;
  - effective_u_v = effective_u_v && (pte_v.U != 0);
  - effective_w_v = effective_w_v && (pte_v.W != 0);
  - effective_x_v = effective_x_v && (pte_v.X != 0);
  - table_base_v = pte_v.PFN << 12;
  - current_level_v = current_level_v - 1;
  - goto <ptquery_next_level>;
  - <ptquery_validate_result>
  - if requested_level_v > 1 and (pte_v.P == 0 or pte_v.T == 0 or pte_v.D != 0 or pte_v.G != 0 or pte_v.AT != 0), set success_v = false and goto <ptquery_complete>;
  - if requested_level_v == 1 and (pte_v.P == 0 or pte_v.T != 0), set success_v = false and goto <ptquery_complete>;
  - effective_u_v = effective_u_v && (pte_v.U != 0);
  - effective_w_v = effective_w_v && (pte_v.W != 0);
  - effective_x_v = effective_x_v && (pte_v.X != 0);
  - <ptquery_complete>
  - ZF = success_v;
  - NF = success_v && effective_u_v;
  - CF = success_v && effective_w_v;
  - VF = success_v && effective_x_v;
attributes:
  privilege: supervisor
  flags:
    Z: requested PTE was read and is structurally valid for its level
    N: valid queried path is user-domain accessible; cleared on failure
    C: valid queried path is writable; cleared on failure
    V: valid queried path is executable; cleared on failure
forms:
  src_ea_set: pure_address_calculation
  require_address_value: true
  operands:
  - name: level
    type: imm3
  - name: src
    type: EA
  - name: dst
    type: Rn
  performs_page_walk: true
  valid_levels:
  - 1
  - 2
  - 3
  - 4
  - 5
  unavailable_level_result: zero with all status flags clear
  requested_entry_result: complete raw 64-bit PTE, including software-defined bits
  prior_walk_failure_result: zero with all status flags clear
  honors_paging_enable: false
  page_fault_on_walk_failure: false
  mutates_pte_accessed_or_dirty: false
  mutates_tlb: false
definition_status:
  allocation: 'external: isa/alloc'

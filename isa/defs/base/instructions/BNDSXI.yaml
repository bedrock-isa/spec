mnemonic: BNDSXI
doc:
  title: Signed Bounds Check Exclusive-Inclusive
  summary: Checks signed value membership in the exclusive-inclusive interval (lo, hi].
  description: BNDSXI treats the low bound as exclusive and the high bound as inclusive. It sets V when
    signed(value) is outside (signed(lo), signed(hi)]; Z, N, and C are unchanged.
  instruction_family: bounds
  instruction_class: integer
behavior:
  group: bounds
  inputs:
  - hi
  - lo
  - value
  output: none
  operation:
  - ZF = 0;
  - NF = 0;
  - CF = 0;
  - VF = 0;
  - if (value_v s<= lo_v) goto <bndsxi_bad>;
  - if (value_v s> hi_v) goto <bndsxi_bad>;
  - goto <bndsxi_done>;
  - <bndsxi_bad>
  - VF = 1;
  - <bndsxi_done>
  interval: (lo, hi]
  signedness: signed
  bounds_mode: XI
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  extension_family: integer_bounds_signed
  operands:
  - name: lo
    type: Rn
  - name: value
    type: EA
  - name: hi
    type: Rn
  size: BWLQ
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: FLSHDCACHE
doc:
  title: Flush Data Cache
  summary: Performs the flush data cache operation.
  instruction_family: cache
  instruction_class: system
behavior:
  group: cache
  inputs:
  - target
  output: none
  operation:
  - arch_cache_flush_data(target_v);
attributes:
  privilege:
    default: supervisor
    policy_controlled: true
forms:
  require_memory_operand: true
  operands:
  - name: target
    type: EA_or_range
definition_status:
  allocation: 'external: isa/alloc'

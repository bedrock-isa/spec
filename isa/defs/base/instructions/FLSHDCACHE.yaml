mnemonic: FLSHDCACHE
doc:
  title: Flush Data Cache
  summary: Performs the flush data cache operation.
  instruction_family: cache
  instruction_class: system
behavior:
  group: cache
  inputs:
  - target
  output: none
  operation:
  - resolve target_v to the addressed byte range without reading the target bytes;
  - for each data-cache line intersecting the range, write every dirty byte to the point of coherency;
  - after its writeback completes, invalidate the intersecting data-cache line;
  - retire only after all selected writebacks and invalidations are complete and visible to this hardware thread;
attributes:
  privilege:
    default: supervisor
    policy_controlled: true
forms:
  require_memory_operand: true
  operands:
  - name: target
    type: EA_or_range
definition_status:
  allocation: 'external: isa/alloc'

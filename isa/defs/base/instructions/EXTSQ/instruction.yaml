mnemonic: EXTSQ
doc:
  title: Sign Extend To Quad
  summary: Performs the sign extend to quad operation.
  description: Sign-extends the source operand from the instruction size to quad size. The low source-size bytes of the source are copied into the destination, and the remaining high destination bits are filled with the source sign bit.
  instruction_family: integer_unary
  instruction_class: integer
behavior:
  group: integer_extend
  inputs:
  - src
  output: dst
  destination_size: Q
  repeat_observed_value: result_value
  repeat_flags: flags_logic_observed_value
attributes:
  privilege: unprivileged
  streaming_candidate: true
  repeatable:
    rep: true
    repcc: true
    repg: true
  repgf_candidate: true
forms:
  dst_ea_set: store_destination
  compact_forms:
  - operands:
    - name: src
      type: Rn
    - name: dst
      type: Rn
    size: L
  extended_forms:
  - operands:
    - name: src
      type: EA
    - name: dst
      type: Rn
    size: BWL
    compact: false
  - operands:
    - name: src
      type: Rn
    - name: dst
      type: EA
    size: BWL
    compact: false
  - operands:
    - name: src
      type: EA
    - name: dst
      type: EA
    size: BWL
    compact: false
    memory_memory: true
  source_size:
  - B
  - W
  - L
  invalid_sizes:
  - Q
  access_width:
    src: source_size
    dst: destination_size
definition_status:
  allocation: 'external: isa/alloc'

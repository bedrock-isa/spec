mnemonic: SBB
doc:
  title: Subtract With Borrow
  summary: Performs the subtract with borrow operation.
  instruction_family: integer_alu
  instruction_class: integer
  description: Subtracts the selected-width source value and incoming C borrow from the destination, writes the truncated difference, and updates Z, N, C, and V.
behavior:
  group: integer_carry_alu
  inputs:
  - src
  input_output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
  flags:
    Z: result == 0
    N: most_significant_bit(result)
    C: unsigned borrow
    V: signed overflow
forms:
  dst_ea_set: store_destination
  operands:
  - - name: src
      type: EA
    - name: dst
      type: Rn
  - - name: src
      type: Rn
    - name: dst
      type: EA
  - - name: imm
      type: imm6
    - name: dst
      type: EA
  size: BWLQ
  compact: false
  reads: C
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: MULHS
doc:
  title: Signed Multiply High
  summary: Performs the signed multiply high operation.
  instruction_family: integer_mul_div
  instruction_class: integer
behavior:
  group: multiply_divide
  inputs:
  - src
  input_output: dst
  operation:
  - local width_v = size_v * 8;
  - local modulus_v = 1 << width_v;
  - local mask_v = modulus_v - 1;
  - local lhs_v = dst_v & mask_v;
  - local rhs_v = src_v & mask_v;
  - if (lhs_v & (1 << (width_v - 1))) != 0, lhs_v = lhs_v - modulus_v;
  - if (rhs_v & (1 << (width_v - 1))) != 0, rhs_v = rhs_v - modulus_v;
  - local product_v = lhs_v * rhs_v;
  - dst_v = (product_v >> width_v) & mask_v;
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  operands:
  - name: src
    type: Rn
  - name: dst
    type: Rn
  size: Q
  result: high half
definition_status:
  allocation: 'external: isa/alloc'

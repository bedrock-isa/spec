mnemonic: RDPMC
doc:
  title: Read Performance Counter
  summary: Read the 64-bit performance counter selected by a constant counter ID.
  description: RDPMC reads a mandatory or implementation-discovered performance counter. Supervisor mode may
    read every implemented counter. User-mode access requires PMC.USER to be set; otherwise RDPMC raises
    PRIVILEGE_FAULT. An unimplemented counter ID raises INVALID_CONTROL_STATE.
  description_tex: fragments/performance_counter_reference.tex
  instruction_family: system_registers
  instruction_class: system
behavior:
  group: system_registers
  inputs:
  - counter_id
  output: dst
  operation:
  - local selected_id_v = counter_id_v & 0xffff;
  - if STATUS.PM == 0 and PMC.USER == 0, raise PRIVILEGE_FAULT;
  - if selected_id_v is not present in the CPUID performance-counter leaf, raise INVALID_CONTROL_STATE;
  - dst_v = the current 64-bit value of performance_counter[selected_id_v];
attributes:
  privilege: configurable
  flags: unchanged
forms:
  operands:
  - name: counter_id
    type: imm16
  - name: dst
    type: Rn
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: CLZ
doc:
  title: Count Leading Zeros
  summary: Performs the count leading zeros operation.
  description: Counts the leading zero bits within the selected operand size and writes the count to the
    destination register. A zero operand returns the operand width in bits.
  instruction_family: integer_bitfield
  instruction_class: integer
behavior:
  group: bit_counts
  inputs:
  - src
  input_output: dst
  operation:
  - local width_v = size_v * 8;
  - local value_v = src_v & ((1 << width_v) - 1);
  - local count_v = 0;
  - for bit_v = width_v - 1 down to 0 while ((value_v >> bit_v) & 1) == 0, count_v = count_v + 1;
  - dst_v = count_v;
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
  repgf_candidate: true
  flags: unchanged
forms:
  operands:
  - name: src
    type: EA
  - name: dst
    type: Rn
  size: BWLQ
  zero_input: returns operand width
definition_status:
  allocation: 'external: isa/alloc'

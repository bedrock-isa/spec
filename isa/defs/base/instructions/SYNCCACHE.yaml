mnemonic: SYNCCACHE
doc:
  title: Synchronize Caches
  summary: Synchronize instruction/data cache visibility.
  instruction_family: cache
  instruction_class: system
behavior:
  group: cache
  inputs:
  - target
  output: none
  operation:
  - resolve target_v to the addressed byte range without reading the target bytes;
  - write every dirty byte in intersecting data-cache lines to the point of instruction coherency;
  - invalidate every intersecting instruction-cache line, decoded instruction, and prefetched instruction byte;
  - retire only after later instruction fetches by this hardware thread are guaranteed to observe the synchronized bytes;
attributes:
  privilege:
    default: supervisor
    policy_controlled: true
forms:
  require_memory_operand: true
  operands:
  - name: target
    type: EA_or_range
definition_status:
  allocation: 'external: isa/alloc'

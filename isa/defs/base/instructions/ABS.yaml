mnemonic: ABS
doc:
  title: Absolute Value
  summary: Performs the absolute value operation.
  instruction_family: integer_unary
  instruction_class: integer
behavior:
  group: integer_unary
  input_output: dst
  operation:
  - if (((dst_v >> 63) & 1) == 0) goto <abs_done>;
  - dst_v = 0 - dst_v;
  - <abs_done>
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
  flags: unchanged
forms:
  compact_forms:
  - operands:
    - name: dst
      type: Rn
    size: LQ
  extended_forms:
  - operands:
    - name: dst
      type: EA
    size: BWLQ
    compact: false
definition_status:
  allocation: 'external: isa/alloc'

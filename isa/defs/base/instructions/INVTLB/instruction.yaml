mnemonic: INVTLB
doc:
  title: Invalidate TLB
  summary: Invalidate all TLB entries.
  instruction_family: tlb_and_context
  instruction_class: system
  description: Invalidates all cached instruction and data translations and discards in-progress results on the current hardware thread before later accesses may proceed.
behavior:
  group: tlb_context
  output: none
attributes:
  privilege: supervisor
  serializing: true
forms:
  operands: []
definition_status:
  allocation: 'external: isa/alloc'

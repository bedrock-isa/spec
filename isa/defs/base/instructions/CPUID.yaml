mnemonic: CPUID
doc:
  title: CPU Identification
  summary: Queries architectural discovery information through a selected Rn register.
  description: Queries architectural discovery information. The selected Rn register contains the CPUID
    query selector before execution and receives the selected 64-bit result after execution.
  instruction_family: system_registers
  instruction_class: system
behavior:
  group: system_registers
  input_output: reg
  operation:
  - local query_class_v = (reg_v >> 32) & 0xffffffff;
  - local query_leaf_v = (reg_v >> 16) & 0xffff;
  - local query_index_v = reg_v & 0xffff;
  - if the CPUID discovery table defines (query_class_v, query_leaf_v, query_index_v), reg_v = the corresponding 64-bit result with every reserved result bit zero;
  - if the tuple is not defined, reg_v = 0;
attributes:
  privilege: user allowed
  flags: unchanged
forms:
  operands:
  - name: reg
    type: Rn
  input: reg contains CPUID query selector
  output: selected CPUID result is written back to reg
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: PREFETCHNT
doc:
  title: Prefetch Non-Temporal
  summary: Hint that EA will be read with non-temporal locality.
  instruction_family: cache
  instruction_class: system
behavior:
  group: cache
  inputs:
  - src
  output: none
  operation:
  - compute the effective address of src_ref without performing an architectural data read;
  - issue an optional non-temporal read-prefetch hint for the cache line containing that address;
  - if the hint is ignored or cannot be completed, leave all architectural state unchanged unless the configured prefetch-fault policy requires the corresponding access fault;
attributes:
  privilege: user allowed
  repeatable:
    rep: true
    repcc: false
    repg: true
  memory_hint: non_temporal
forms:
  src_ea_set: memory_only
  require_memory_operand: true
  operands:
  - name: src
    type: EA
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: INVTLB
doc:
  title: Invalidate TLB
  summary: Invalidate all TLB entries.
  instruction_family: tlb_and_context
  instruction_class: system
behavior:
  group: tlb_context
  output: none
  operation:
  - for each cached instruction or data translation on this hardware thread, clear its valid state;
  - discard any in-progress translation result that was obtained from the invalidated state;
  - retire only after no later memory access or instruction fetch can use a translation cached before INVTLB;
attributes:
  privilege: supervisor
  serializing: true
forms:
  operands: []
definition_status:
  allocation: 'external: isa/alloc'

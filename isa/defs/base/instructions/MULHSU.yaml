mnemonic: MULHSU
doc:
  title: Signed By Unsigned Multiply High
  summary: Performs the signed by unsigned multiply high operation.
  instruction_family: integer_mul_div
  instruction_class: integer
behavior:
  group: multiply_divide
  inputs:
  - src
  input_output: dst
  operation:
  - dst_v = arch_signed_unsigned_multiply_high(dst_v, src_v, size_v);
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  operands:
  - name: src
    type: Rn
  - name: dst
    type: Rn
  size: Q
  result: high half
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: BNDSII
doc:
  title: Signed Bounds Check Inclusive-Inclusive
  summary: Checks signed value membership in the inclusive-inclusive interval [lo, hi].
  description: BNDSII treats both bounds as inclusive. It sets V when signed(value) is outside [signed(lo),
    signed(hi)]; Z, N, and C are unchanged.
  instruction_family: bounds
  instruction_class: integer
behavior:
  group: bounds
  inputs:
  - hi
  - lo
  - value
  output: none
  operation:
  - ZF = 0;
  - NF = 0;
  - CF = 0;
  - VF = 0;
  - if (value_v < lo_v) goto <bnduii_bad>;
  - if (value_v > hi_v) goto <bnduii_bad>;
  - goto <bnduii_done>;
  - <bnduii_bad>
  - VF = 1;
  - <bnduii_done>
  interval: '[lo, hi]'
  signedness: signed
  bounds_mode: II
attributes:
  privilege: unprivileged
forms:
  extension_family: integer_bounds_signed
  operands:
  - name: lo
    type: Rn
  - name: value
    type: EA
  - name: hi
    type: Rn
  size: BWLQ
definition_status:
  allocation: 'external: isa/alloc'

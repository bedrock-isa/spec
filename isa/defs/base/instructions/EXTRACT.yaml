mnemonic: EXTRACT
doc:
  title: Extract From Register Pair
  summary: Extracts a selected-width value from a concatenated pair of Rn registers.
  description: >
    Concatenates Rn(high) as the upper half and the original Rn(low/dest) value as the lower half,
    shifts the concatenated value right by an unsigned 7-bit immediate offset, and writes the low
    selected-size result back to Rn(low/dest). The operation is similar to ARM EXTR, but uses the
    Bedrock B/W/L/Q operation size and a 7-bit immediate offset.
  instruction_family: integer_bitfield
  instruction_class: integer
behavior:
  group: bitfield_extract
  inputs:
  - offset
  - high
  input_output: low_dst
  operation:
  - local width_v = size_v * 8;
  - local mask_v = (1 << width_v) - 1;
  - local pair_v = ((high_v & mask_v) << width_v) | (low_dst_v & mask_v);
  - if offset_v >= 2 * width_v, low_dst_v = 0;
  - if offset_v < 2 * width_v, low_dst_v = (pair_v >> offset_v) & mask_v;
  operation_text: >
    The operation forms a 2*width temporary value `(Rn(high)[width-1:0] : Rn(low/dest)[width-1:0])`.
    The immediate offset is interpreted as an unsigned 7-bit value. The result is the low `width`
    bits of the temporary value after a logical right shift by the offset. If the offset is greater
    than or equal to `2*width`, the extracted result is zero.
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
  flags: unchanged
forms:
  operands:
  - name: offset
    type: imm7
  - name: high
    type: Rn
  - name: low_dst
    type: Rn
  size: BWLQ
  compact: false
  result: low/destination register
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: MODU
doc:
  title: Unsigned Modulo
  summary: Performs the unsigned modulo operation.
  instruction_family: integer_mul_div
  instruction_class: integer
  description: Writes the remainder of selected-width unsigned destination-by-source division. A zero divisor raises DIVIDE_ERROR.
behavior:
  group: multiply_divide
  inputs:
  - src
  input_output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  operands:
  - - name: src
      type: EA
    - name: dst
      type: Rn
  size: BWLQ
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: WAIT
doc:
  title: Wait
  summary: Wait until event or interrupt according to privilege policy.
  instruction_family: core_control
  instruction_class: system
behavior:
  group: core_control
  output: none
  operation:
  - retire WAIT with continuation PC = inst_next and set execution_state = WAITING;
  - while execution_state == WAITING, fetch and retire no instructions;
  - when a policy-permitted event or interrupt becomes pending, clear execution_state = WAITING;
  - if the wake source is architecturally admitted, deliver it using inst_next as the interrupted continuation; otherwise resume at inst_next;
attributes:
  privilege: policy_controlled
forms:
  operands: []
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: BCHG
doc:
  title: Bit Change
  summary: Performs the bit change operation.
  instruction_family: integer_bitfield
  instruction_class: integer
behavior:
  group: bit_ops
  inputs:
  - bit_index
  input_output: dst
  operation:
  - bit_mask_v = 1 << (bit_index_v & 63);
  - old_bit_v = (dst_v & bit_mask_v) != 0;
  - dst_v = dst_v ^ bit_mask_v;
  - ZF = old_bit_v == 0;
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
  flags:
    Z: old_bit == 0
    N: unchanged
    C: unchanged
    V: unchanged
forms:
  operands:
  - - name: bit_index
      type: selector
    - name: dst
      type: Rn
  - - name: bit_index
      type: selector
    - name: dst
      type: EA
  size: BWLQ
  compact: false
  encoding_fields:
  - field: o
    kind: bit_group
    width: 2
    placement: high
    values:
    - BCHG
    - BCLR
    - BSET
    - BTEST
    derive: mnemonic
    match:
      profile: I6_TO_EA
definition_status:
  allocation: 'external: isa/alloc'

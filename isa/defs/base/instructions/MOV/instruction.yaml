mnemonic: MOV
doc:
  title: Move
  summary: Copies the source operand to the destination operand.
  instruction_family: data_movement
  instruction_class: data_movement
  description: Reads the source using its addressing mode and selected size and writes that value to the destination.
behavior:
  group: data_movement
  inputs:
  - src
  output: dst
  repeat_observed_value: src_value
  repeat_flags: flags_logic_observed_value
attributes:
  privilege: unprivileged
  streaming_candidate: true
  repeatable:
    rep: true
    repcc: true
    repg: true
  repgf_candidate: true
forms:
  dst_ea_set: store_destination
  compact_forms:
  - operands:
    - name: src
      type: Rn
    - name: dst
      type: Rn
    size: LQ
  - operands:
    - name: src
      type: Rn
    - name: dst
      type: SP
    size: Q
  - operands:
    - name: src
      type: SP
    - name: dst
      type: Rn
    size: Q
  extended_forms:
  - operands:
    - name: src
      type: EA
    - name: dst
      type: EA
    size: BWLQ
    compact: false
    constraint: memory_memory
  - operands:
    - name: src
      type: EA
    - name: dst
      type: Rn
    profile: EA_TO_D_WIDE
    size: BWLQ
    compact: false
  - operands:
    - name: src
      type: Rn
    - name: dst
      type: EA
    profile: D_TO_EA_WIDE
    size: BWLQ
    compact: false
definition_status:
  allocation: 'external: isa/alloc'

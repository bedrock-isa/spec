mnemonic: MULHU
doc:
  title: Unsigned Multiply High
  summary: Performs the unsigned multiply high operation.
  instruction_family: integer_mul_div
  instruction_class: integer
behavior:
  group: multiply_divide
  inputs:
  - src
  input_output: dst
  operation:
  - dst_v = arch_unsigned_multiply_high(dst_v, src_v, size_v);
attributes:
  privilege: unprivileged
forms:
  operands:
  - - name: src
      type: EA
    - name: dst
      type: Rn
  - - name: src
      type: Rn
    - name: dst
      type: EA
  size: BWLQ
  result: high half
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: MULHU
doc:
  title: Unsigned Multiply High
  summary: Performs the unsigned multiply high operation.
  instruction_family: integer_mul_div
  instruction_class: integer
behavior:
  group: multiply_divide
  inputs:
  - src
  input_output: dst
  operation:
  - local width_v = size_v * 8;
  - local mask_v = (1 << width_v) - 1;
  - local product_v = (dst_v & mask_v) * (src_v & mask_v);
  - dst_v = (product_v >> width_v) & mask_v;
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  operands:
  - name: src
    type: Rn
  - name: dst
    type: Rn
  size: Q
  result: high half
definition_status:
  allocation: 'external: isa/alloc'

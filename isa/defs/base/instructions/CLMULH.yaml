mnemonic: CLMULH
doc:
  title: Carryless Multiply High
  summary: Performs the carryless multiply high operation.
  instruction_family: integer_mul_div
  instruction_class: integer
behavior:
  group: multiply_divide
  inputs:
  - src
  input_output: dst
  operation:
  - dst_v = arch_carryless_multiply_high(dst_v, src_v, size_v);
attributes:
  privilege: unprivileged
forms:
  operands:
  - - name: src
      type: EA
    - name: dst
      type: Rn
  - - name: src
      type: Rn
    - name: dst
      type: EA
  size: BWLQ
  result: carryless low or high half
definition_status:
  allocation: 'external: isa/alloc'

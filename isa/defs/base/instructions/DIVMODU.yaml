mnemonic: DIVMODU
doc:
  title: Unsigned Divide With Remainder
  summary: Performs the unsigned divide with remainder operation.
  description: Performs the unsigned divide with remainder operation. The quotient register Rn(q) supplies
    the dividend before the operation, then receives the quotient. The remainder register Rn(r) receives
    the remainder.
  instruction_family: integer_mul_div
  instruction_class: integer
behavior:
  group: multiply_divide
  inputs:
  - src
  input_output: quotient
  output: remainder
  operation:
  - local width_v = size_v * 8;
  - local mask_v = (1 << width_v) - 1;
  - local dividend_v = quotient_v & mask_v;
  - local divisor_v = src_v & mask_v;
  - if divisor_v == 0, raise DIVIDE_ERROR;
  - local result_quotient_v = dividend_v / divisor_v;
  - local result_remainder_v = dividend_v - result_quotient_v * divisor_v;
  - quotient_v = result_quotient_v & mask_v;
  - remainder_v = result_remainder_v & mask_v;
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  operands:
  - name: src
    type: EA
  - name: quotient
    type: Rn
  - name: remainder
    type: Rn
  size: BWLQ
definition_status:
  allocation: 'external: isa/alloc'

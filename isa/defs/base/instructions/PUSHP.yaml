mnemonic: PUSHP
doc:
  title: Push Register Pairs
  summary: Pushes one canonical Rn register pair selected by an inline pair index.
  description: >
    Pushes the canonical register pair selected by `imm3`. The canonical pair sequence is
    pair 0 `(R14, R15)`, pair 1 `(R12, R13)`, pair 2 `(R10, R11)`, pair 3 `(R8, R9)`,
    pair 4 `(R6, R7)`, pair 5 `(R4, R5)`, pair 6 `(R2, R3)`, and pair 7 `(R0, R1)`.
    All eight immediate encodings are valid and each selects one pair.
  instruction_family: data_movement
  instruction_class: data_movement
behavior:
  group: stack
  inputs:
  - pair_index
  output: none
  operation:
  - local first_reg_v = 14 - 2 * (pair_index_v & 7);
  - local second_reg_v = first_reg_v + 1;
  - local first_value_v = R[first_reg_v];
  - local second_value_v = R[second_reg_v];
  - validate writable 8-byte stack slots at SS:(SP - 8) and SS:(SP - 16);
  - SP = SP - 8;
  - '*:8 SP = first_value_v;'
  - SP = SP - 8;
  - '*:8 SP = second_value_v;'
  operation_text: >
    PUSHP selects one canonical pair using the unsigned 3-bit pair index and processes
    that pair's registers in the listed order. Each register push decrements SP by 8,
    then stores the 64-bit register value at the new SP. Multiple PUSHP instructions
    can be used in canonical prologue order to save multiple pairs.
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  operands:
  - name: pair_index
    type: imm3
  canonical_pairs:
  - {index: 0, registers: [R14, R15]}
  - {index: 1, registers: [R12, R13]}
  - {index: 2, registers: [R10, R11]}
  - {index: 3, registers: [R8, R9]}
  - {index: 4, registers: [R6, R7]}
  - {index: 5, registers: [R4, R5]}
  - {index: 6, registers: [R2, R3]}
  - {index: 7, registers: [R0, R1]}
  size_per_register: Q
  compact: required
definition_status:
  allocation: 'external: isa/alloc'

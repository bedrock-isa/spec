mnemonic: RET
doc:
  title: Return
  summary: Performs the return operation.
  instruction_family: control_flow
  instruction_class: control_flow
behavior:
  group: control_flow
  output: none
  operation:
  - local return_pc_v:8 = *:8 SP;
  - SP = SP + 8;
  - return [return_pc_v];
attributes:
  privilege: unprivileged
forms:
  operands: []
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: POP
doc:
  title: Pop
  summary: Pops one 64-bit stack value into an Rn or SREG destination.
  description: POP loads one 64-bit stack value into a general register or SREG destination. The SREG form accepts DS, SS, and GS0-GS5, is unprivileged, and does not accept CS. A candidate segment image is validated before either the destination SREG or SP is changed. POP SS reads through the old SS and makes the new SS visible only when the destination and updated SP commit together.
  instruction_family: data_movement
  instruction_class: data_movement
behavior:
  group: stack
  output: reg
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  operands:
  - - name: reg
      type: Rn
  - - name: reg
      type: SREG
  compact: required
  size: Q
  sreg_form:
    selectors:
    - DS
    - SS
    - GS0
    - GS1
    - GS2
    - GS3
    - GS4
    - GS5
    cs_allowed: false
    privilege: unprivileged
    segment_image_validation:
      before_commit: true
      invalid_image_exception: INVALID_CONTROL_STATE
      atomic_destination_and_sp_update: true
definition_status:
  allocation: 'external: isa/alloc'

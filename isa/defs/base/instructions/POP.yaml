mnemonic: POP
doc:
  title: Pop
  summary: Pops one 64-bit stack value into an Rn or SREG destination.
  description: >
    POP loads one 64-bit stack value into a general register or SREG destination. The SREG form accepts
    DS, SS, and GS0-GS5, is unprivileged, and does not accept CS. A candidate segment image is validated
    before either the destination SREG or SP is changed. POP SS reads through the old SS and makes the
    new SS visible only when the destination and updated SP commit together.
  instruction_family: data_movement
  instruction_class: data_movement
behavior:
  group: stack
  output: reg
  operation:
  - local stack_segment_v = SS;
  - local stack_pointer_v = SP;
  - validate a readable 8-byte stack slot at stack_segment_v:stack_pointer_v;
  - local value_v = *:8 stack_segment_v:stack_pointer_v;
  - if reg is an SREG destination, validate value_v as that segment register's image and raise INVALID_CONTROL_STATE on failure;
  - atomically set reg_v = value_v and SP = stack_pointer_v + 8;
  operation_text: >
    POP reads and validates the stack value without changing architectural state. For an SREG destination,
    segment-image validation completes before commit. It then updates the destination and SP together; any
    preceding access or validation fault leaves both unchanged. POP SS performs the read using the old SS
    and exposes the new SS only at the final commit.
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  operands:
  - - name: reg
      type: Rn
  - - name: reg
      type: SREG
  compact: required
  size: Q
  sreg_form:
    selectors: [DS, SS, GS0, GS1, GS2, GS3, GS4, GS5]
    cs_allowed: false
    privilege: unprivileged
    segment_image_validation:
      before_commit: true
      invalid_image_exception: INVALID_CONTROL_STATE
      atomic_destination_and_sp_update: true
definition_status:
  allocation: 'external: isa/alloc'

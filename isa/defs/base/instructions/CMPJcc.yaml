mnemonic: CMPJcc
doc:
  title: Compare And Jump Conditional
  summary: Compares two Rn registers and branches on the selected condition without writing FLAGS.
  description: >
    CMPJcc computes the same temporary compare result as CMP for the selected operand size, evaluates
    the encoded condition from that temporary result, and branches to the relative target when the
    condition is true. The computed condition is consumed only by the branch decision; architectural
    FLAGS are not read or written. Conditions T and F are reserved and are not valid encodings.
  instruction_family: control_flow
  instruction_class: control_flow
behavior:
  group: control_flow
  inputs:
  - cc
  - src
  - dst
  - target
  output: none
  operation:
  - result_v = dst_v - src_v;
  - branch_flags_v = flags_sub(dst_v, src_v, result_v, size_v);
  - if (condition(cc_v, branch_flags_v) == 0) goto <cmpjcc_done>;
  - goto [target_v];
  - <cmpjcc_done>
attributes:
  privilege: unprivileged
  flags: unchanged
forms:
  operands:
  - name: cc
    type: condition
  - name: src
    type: Rn
  - name: dst
    type: Rn
  - name: target
    type: relative_imm
  size: BWLQ
  target_widths:
  - imm8s
  - imm16s
  reads: none
  result: branch only
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: DIVU
doc:
  title: Unsigned Divide
  summary: Performs the unsigned divide operation.
  instruction_family: integer_mul_div
  instruction_class: integer
behavior:
  group: multiply_divide
  inputs:
  - src
  input_output: dst
  operation:
  - local width_v = size_v * 8;
  - local mask_v = (1 << width_v) - 1;
  - local dividend_v = dst_v & mask_v;
  - local divisor_v = src_v & mask_v;
  - if divisor_v == 0, raise DIVIDE_ERROR;
  - dst_v = (dividend_v / divisor_v) & mask_v;
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  operands:
  - - name: src
      type: EA
    - name: dst
      type: Rn
  size: BWLQ
definition_status:
  allocation: 'external: isa/alloc'

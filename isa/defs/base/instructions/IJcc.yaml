mnemonic: IJcc
doc:
  title: Increment And Jump Conditional
  summary: Performs the increment and jump conditional operation.
  instruction_family: control_flow
  instruction_class: control_flow
behavior:
  group: control_flow
  inputs:
  - cc
  - bound
  - target
  input_output: index
  operation:
  - index_v = index_v + 1;
  - if (index_v == bound_v) goto <ijcc_done>;
  - if (cc_v == 0) goto <ijcc_done>;
  - goto [target_v];
  - <ijcc_done>
attributes:
  privilege: unprivileged
forms:
  operands:
  - name: cc
    type: condition
  - name: index
    type: Rn
  - name: bound
    type: Rn
  - name: target
    type: EA
  size: LQ
  reads: FLAGS
  updates: Dindex
definition_status:
  allocation: 'external: isa/alloc'

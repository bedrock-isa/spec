mnemonic: RFENCE
doc:
  title: Read Fence
  summary: Order prior reads before later reads.
  instruction_family: core_control
  instruction_class: system
behavior:
  group: core_control
  output: none
  operation:
  - block retirement until every memory read issued before RFENCE is ordered before every memory read issued after RFENCE by this hardware thread;
  - RFENCE performs no memory access and changes no architectural register or flag;
attributes:
  privilege: any
forms:
  operands: []
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: POPCNT
doc:
  title: Population Count
  summary: Performs the population count operation.
  instruction_family: integer_bitfield
  instruction_class: integer
  description: Counts set bits within the selected B, W, L, or Q source width and writes that count to the destination.
behavior:
  group: bit_counts
  inputs:
  - src
  input_output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
  repgf_candidate: true
  flags: unchanged
forms:
  operands:
  - name: src
    type: EA
  - name: dst
    type: Rn
  size: BWLQ
  zero_input: returns 0
definition_status:
  allocation: 'external: isa/alloc'

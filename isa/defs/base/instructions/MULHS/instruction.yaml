mnemonic: MULHS
doc:
  title: Signed Multiply High
  summary: Performs the signed multiply high operation.
  instruction_family: integer_mul_div
  instruction_class: integer
  description: Multiplies the selected-width operands as signed integers and writes the high half of the double-width product.
behavior:
  group: multiply_divide
  inputs:
  - src
  input_output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  operands:
  - name: src
    type: Rn
  - name: dst
    type: Rn
  size: Q
  result: high half
definition_status:
  allocation: 'external: isa/alloc'

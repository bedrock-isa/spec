mnemonic: SETcc
doc:
  title: Set Conditional
  summary: Performs the set conditional operation.
  instruction_family: control_flow
  instruction_class: control_flow
behavior:
  group: control_flow
  inputs:
  - cc
  output: dst
  operation:
  - dst_v = cc_v;
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  operands:
  - name: cc
    type: condition
  - name: dst
    type: Rn
  size: Q
  writes: 0 or 1
definition_status:
  allocation: 'external: isa/alloc'

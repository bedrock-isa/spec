mnemonic: CLMUL
doc:
  title: Carryless Multiply
  summary: Performs the carryless multiply operation.
  instruction_family: integer_mul_div
  instruction_class: integer
behavior:
  group: multiply_divide
  inputs:
  - src
  input_output: dst
  operation:
  - local width_v = size_v * 8;
  - local mask_v = (1 << width_v) - 1;
  - local multiplicand_v = dst_v & mask_v;
  - local multiplier_v = src_v & mask_v;
  - local product_v = 0;
  - for bit_v = 0 to width_v - 1, if ((multiplier_v >> bit_v) & 1) != 0, product_v = product_v ^ (multiplicand_v << bit_v);
  - dst_v = product_v & mask_v;
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  operands:
  - - name: src
      type: EA
    - name: dst
      type: Rn
  size: BWLQ
  result: carryless low half
definition_status:
  allocation: 'external: isa/alloc'

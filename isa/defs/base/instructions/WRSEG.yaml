mnemonic: WRSEG
doc:
  title: Write Segment Register
  summary: Write an SREG segment image from an Rn register.
  description: WRSEG validates a 64-bit segment register image from the source Rn register and writes it to
    an SREG-class data, stack, TLS, or general segment register. CS is not an SREG operand and changes only
    through architectural control-transfer paths that update CS and PC together.
  instruction_family: system_registers
  instruction_class: system
behavior:
  group: system_registers
  inputs:
  - src
  output: seg
  operation:
  - seg_v = src_v;
attributes:
  privilege: policy controlled
  flags: unchanged
  profile_access:
    bedrock_c_far:
      user_writable: [GS1, GS2, GS3, GS4, GS5]
      other_segment_writes: policy_controlled
forms:
  operands:
  - name: src
    type: Rn
  - name: seg
    type: SREG
  size: Q
  segment_image_validation:
    before_commit: true
    invalid_image_exception: INVALID_CONTROL_STATE
    atomic_destination_update: true
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: INVASID
doc:
  title: Invalidate TLB By ASID
  summary: Invalidate TLB entries for ASID.
  instruction_family: tlb_and_context
  instruction_class: system
behavior:
  group: tlb_context
  inputs:
  - asid
  output: none
  operation:
  - local selected_asid_v = asid_v & 0xffff;
  - for each non-global cached instruction or data translation on this hardware thread, if its ASID is selected_asid_v, clear its valid state;
  - discard any in-progress translation result tagged with selected_asid_v;
  - retire only after no later memory access or instruction fetch can use a non-global translation for selected_asid_v cached before INVASID;
attributes:
  privilege: supervisor
  serializing: true
forms:
  operands:
  - name: asid
    type: imm16
definition_status:
  allocation: 'external: isa/alloc'

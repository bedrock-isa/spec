mnemonic: YIELD
doc:
  title: Yield
  summary: Hints to the scheduler or implementation that the current thread may yield.
  instruction_family: core_control
  instruction_class: system
behavior:
  group: core_control
  output: none
  operation:
  - notify the implementation that the current hardware thread may be deprioritized or descheduled;
  - YIELD is not a memory barrier and changes no architectural state;
  - resume execution at inst_next whenever the implementation next schedules the thread;
attributes:
  privilege: any
forms:
  operands: []
definition_status:
  allocation: 'external: isa/alloc'

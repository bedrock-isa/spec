mnemonic: SYSCALL
doc:
  title: System Call
  summary: Enter the supervisor-call path through SPC/SCS/SDS and the configured call stack.
  description: Enter supervisor mode through the explicit SPC/SCS/SDS supervisor-call path. SYSCALL
    saves the user continuation in the UR control-register bank, switches to SSS:SSP, and does not
    create an event frame or set event-active state.
  instruction_family: core_control
  instruction_class: system
behavior:
  group: core_control
  output: none
  operation:
  - if STATUS.PM != 0 or STATUS.EA != 0, raise INVALID_CONTROL_STATE;
  - if URCTL.V != 0, raise INVALID_CONTROL_STATE;
  - validate SCS, SDS, and SSS as supervisor segment images;
  - require SPC to be an exact 16-byte-aligned canonical executable address under SCS;
  - require SSP to be an exact 64-byte-aligned stack top valid under SSS;
  - local saved_urctl_v = (1 << 32) | ((STATUS & 0xffff) << 16) | (FLAGS & 0xffff);
  - atomically set URPC = inst_next, URSP = SP, URCS = CS, URDS = DS, URSS = SS, and URCTL = saved_urctl_v;
  - in the same commit set CS = SCS, DS = SDS, SS = SSS, SP = SSP, PC = SPC, and STATUS.PM = 1;
  - preserve STATUS.IE, STATUS.TF, STATUS.RF, STATUS.NI, and STATUS.EA;
  - perform no memory access and create no stack frame;
  operation_text: 'SYSCALL saves the user continuation in the UR control-register bank, sets STATUS.PM,
    loads CS from SCS, DS from SDS, SS from SSS, SP from SSP, and transfers control to the exact SPC
    address.

    '
attributes:
  privilege: any
  serializing: true
forms:
  operands: []
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: WRCR
doc:
  title: Write Control Register
  summary: Write a privileged control register from an Rn register.
  description: Write a privileged control register from an Rn register. WRCR is always a supervisor-only
    instruction; user-visible control state must use dedicated instructions gated by control-register
    policy bits.
  instruction_family: system_registers
  instruction_class: system
behavior:
  group: system_registers
  inputs:
  - src
  - cr
  output: none
  operation:
  - local selector_v = cr_v & 0xffff;
  - if selector_v is not assigned by the Control-Register Selectors table, raise INVALID_CONTROL_STATE;
  - if any reserved bit for the selected register is nonzero in src_v, raise INVALID_CONTROL_STATE;
  - validate every selected-register-specific invariant before changing architectural state;
  - write src_v to the writable fields of the selected control register, except that hardware-managed fields retain their instruction-defined value;
  - if validation fails, leave the selected register and all dependent architectural state unchanged;
  control_register_access:
    selector: cr
    write: src
attributes:
  privilege: supervisor
  flags: unchanged
forms:
  operands:
  - name: src
    type: Rn
  - name: cr
    type: imm16
definition_status:
  allocation: 'external: isa/alloc'

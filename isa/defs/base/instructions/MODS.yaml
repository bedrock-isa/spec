mnemonic: MODS
doc:
  title: Signed Modulo
  summary: Performs the signed modulo operation.
  instruction_family: integer_mul_div
  instruction_class: integer
behavior:
  group: multiply_divide
  inputs:
  - src
  input_output: dst
  operation:
  - local width_v = size_v * 8;
  - local modulus_v = 1 << width_v;
  - local mask_v = modulus_v - 1;
  - local dividend_v = dst_v & mask_v;
  - local divisor_v = src_v & mask_v;
  - if (dividend_v & (1 << (width_v - 1))) != 0, dividend_v = dividend_v - modulus_v;
  - if (divisor_v & (1 << (width_v - 1))) != 0, divisor_v = divisor_v - modulus_v;
  - if divisor_v == 0, raise DIVIDE_ERROR;
  - if dividend_v == -(1 << (width_v - 1)) and divisor_v == -1, raise DIVIDE_ERROR;
  - local quotient_v = abs(dividend_v) / abs(divisor_v);
  - if (dividend_v < 0) != (divisor_v < 0), quotient_v = -quotient_v;
  - dst_v = (dividend_v - quotient_v * divisor_v) & mask_v;
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  operands:
  - - name: src
      type: EA
    - name: dst
      type: Rn
  size: BWLQ
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: WFENCE
doc:
  title: Write Fence
  summary: Order prior writes before later writes.
  instruction_family: core_control
  instruction_class: system
behavior:
  group: core_control
  output: none
  operation:
  - block retirement until every memory write issued before WFENCE is ordered before every memory write issued after WFENCE by this hardware thread;
  - WFENCE performs no memory access and changes no architectural register or flag;
attributes:
  privilege: any
forms:
  operands: []
definition_status:
  allocation: 'external: isa/alloc'

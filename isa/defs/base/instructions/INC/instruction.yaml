mnemonic: INC
doc:
  title: Increment
  summary: Performs the increment operation.
  instruction_family: integer_unary
  instruction_class: integer
  description: Adds one to the selected-width destination and writes the modular result without changing FLAGS.
behavior:
  group: integer_unary
  input_output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
  repgf_candidate: true
  flags: unchanged
forms:
  compact_forms:
  - operands:
    - name: dst
      type: Rn
    size: LQ
  extended_forms:
  - operands:
    - name: dst
      type: EA
    size: BWLQ
    compact: false
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: PREFETCH
doc:
  title: Prefetch
  summary: Hint that EA will be read soon; no architectural fault unless policy says otherwise.
  instruction_family: cache
  instruction_class: system
behavior:
  group: cache
  inputs:
  - src
  output: none
  operation:
  - compute the effective address of src_ref without performing an architectural data read;
  - issue an optional temporal read-prefetch hint for the cache line containing that address;
  - if the hint is ignored or cannot be completed, leave all architectural state unchanged unless the configured prefetch-fault policy requires the corresponding access fault;
attributes:
  privilege: user allowed
  repeatable:
    rep: true
    repcc: false
    repg: true
forms:
  src_ea_set: memory_only
  require_memory_operand: true
  operands:
  - name: src
    type: EA
definition_status:
  allocation: 'external: isa/alloc'

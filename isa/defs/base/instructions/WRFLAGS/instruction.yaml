mnemonic: WRFLAGS
doc:
  title: Write Flags
  summary: Write the integer condition-code flags from an Rn register.
  description: WRFLAGS writes the low 16 bits from the source Rn register into the architectural FLAGS register. Reserved FLAGS bits must be zero. FLAGS is not part of the S segment-register operand class.
  instruction_family: system_registers
  instruction_class: system
behavior:
  group: system_registers
  inputs:
  - src
  output: none
attributes:
  privilege: unprivileged
  flags: writes FLAGS from source low bits
forms:
  operands:
  - name: src
    type: Rn
  size: W
definition_status:
  allocation: 'external: isa/alloc'

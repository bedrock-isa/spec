mnemonic: BNDSIX
doc:
  title: Signed Bounds Check Inclusive-Exclusive
  summary: Checks signed value membership in the inclusive-exclusive interval [lo, hi).
  description: BNDSIX treats the low bound as inclusive and the high bound as exclusive. It sets V when signed(value) is outside [signed(lo), signed(hi)); Z, N, and C are unchanged.
  instruction_family: bounds
  instruction_class: integer
behavior:
  group: bounds
  inputs:
  - hi
  - lo
  - value
  output: none
  interval: "[lo, hi)"
  signedness: signed
  bounds_mode: IX
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
forms:
  extension_family: integer_bounds_signed
  operands:
  - name: lo
    type: Rn
  - name: value
    type: EA
  - name: hi
    type: Rn
  size: BWLQ
definition_status:
  allocation: 'external: isa/alloc'

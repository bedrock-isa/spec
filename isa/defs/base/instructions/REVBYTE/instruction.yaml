mnemonic: REVBYTE
doc:
  title: Reverse Bytes
  summary: Performs the reverse bytes operation.
  instruction_family: integer_alu
  instruction_class: integer
  description: Reverses the byte order within the selected operand width and writes the result to the destination.
behavior:
  group: bit_reverse
  input_output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
  repgf_candidate: true
forms:
  compact_forms:
  - operands:
    - name: dst
      type: Rn
    size: WLQ
  extended_forms:
  - operands:
    - name: dst
      type: EA
    size: WLQ
    compact: false
  result: dst = reverse_bytes(dst)
definition_status:
  allocation: 'external: isa/alloc'

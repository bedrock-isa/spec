mnemonic: INVICACHE
doc:
  title: Invalidate Instruction Cache
  summary: Invalidate instruction cache block or range.
  instruction_family: cache
  instruction_class: system
behavior:
  group: cache
  inputs:
  - target
  output: none
  operation:
  - resolve target_v to the addressed byte range without fetching instructions from the range;
  - for each instruction-cache line intersecting the range, invalidate the line and any decoded instruction derived from it;
  - discard prefetched instruction bytes from the range and refetch a later execution from coherent memory;
  - retire only after the selected instruction-stream invalidations are complete;
attributes:
  privilege:
    default: supervisor
    policy_controlled: true
forms:
  require_memory_operand: true
  operands:
  - name: target
    type: EA_or_range
definition_status:
  allocation: 'external: isa/alloc'

operation_semantics:
  syntax_policy:
    condition_code:
      placement: mnemonic_suffix
      spelling: condition suffix is concatenated into the mnemonic
      dot_suffix_reserved_for: instruction_size
  notation:
    operand_read: read operand value after applying its addressing mode and size
    operand_write: write selected-size result to destination; sub-Q Rn writes preserve upper bits unless overridden
    EA_address: compute effective address without reading memory unless operation says read
    selector: selector operands may name an Rn register or an encoded immediate selector
    overlong: extra trailing instruction payload bytes are ignored as padding payload
    flags_ZNCV: integer flags Z, N, C, V
    flags_mask4: 4-bit FLAGS mask with bit 3 selecting Z, bit 2 selecting N, bit 1 selecting C, and bit 0 selecting V
  defaults:
    overlong_encoding: allowed
    undersized_encoding: length/decode fault
    memory_memory: operation_opt_in
    unmentioned_flags: unchanged
    integer_flags: unchanged unless an instruction explicitly defines a FLAGS write
    operand_evaluation_order: decode order
  group_order:
  - core_control
  - integer_alu
  - integer_compare
  - integer_carry_alu
  - integer_minmax
  - data_movement
  - stack
  - register_set_transfer
  - integer_unary
  - integer_extend
  - bit_reverse
  - shifts_rotates
  - bit_ops
  - bit_counts
  - multiply_divide
  - bounds
  - control_flow
  - ea_utility
  - atomics
  - system_registers
  - tlb_context
  - cache
  groups:
    core_control:
      flags: unchanged
    integer_alu:
      flags: unchanged
      memory: at_most_one_memory_operand
    integer_compare:
      memory: memory_memory_explicit_form
    integer_carry_alu:
      flags: update Z/N/C/V
      memory: at_most_one_memory_operand
    integer_minmax:
      flags: unchanged
      memory: at_most_one_memory_operand
    data_movement:
      flags: unchanged
    stack:
      stack_register: SP
      stack_segment: SS
      flags: unchanged
    register_set_transfer:
      bitmap: bits 0..15 select R0..R15
      flags: unchanged
    integer_unary:
      flags: unchanged
    integer_extend:
      source_size_suffix: instruction size suffix
      source_sizes_by_destination:
        W:
        - B
        L:
        - B
        - W
        Q:
        - B
        - W
        - L
      memory: bulk_extend_memory_memory
      flags: unchanged
    bit_reverse:
      flags: unchanged
    shifts_rotates:
      flags: unchanged
    bit_ops:
      flags: set Z when the old bit was zero; preserve N/C/V
    bit_counts: {}
    multiply_divide:
      flags: unchanged
      traps:
      - divide_by_zero
      - signed overflow trap when defined
    bounds:
      bounds_mode_names:
        II: inclusive-inclusive
        IX: inclusive-exclusive
        XI: exclusive-inclusive
        XX: exclusive-exclusive
      flags:
        V: set when the value is out of bounds
        ZNC: unchanged
    control_flow:
      flags: unchanged
    ea_utility: {}
    atomics:
      atomic: true
      memory: addressable_memory_operand_required
    system_registers: {}
    tlb_context:
      privilege: supervisor
    cache:
      flags: unchanged

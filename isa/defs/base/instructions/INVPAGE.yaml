mnemonic: INVPAGE
doc:
  title: Invalidate TLB Page
  summary: Invalidate TLB entry for linear page.
  instruction_family: tlb_and_context
  instruction_class: system
behavior:
  group: tlb_context
  inputs:
  - page
  output: none
  operation:
  - compute the linear address of page_ref without reading memory and set linear_page_v = address bits 63..12;
  - for each cached instruction or data translation on this hardware thread, if its linear page is linear_page_v and it is global or matches the current ASID context, clear its valid state;
  - discard any in-progress matching translation result;
  - retire only after no later memory access or instruction fetch can use a matching translation cached before INVPAGE;
attributes:
  privilege: supervisor
  serializing: true
forms:
  operands:
  - name: page
    type: EA
definition_status:
  allocation: 'external: isa/alloc'

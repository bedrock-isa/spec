mnemonic: BTEST
doc:
  title: Bit Test
  summary: Performs the bit test operation.
  instruction_family: integer_bitfield
  instruction_class: integer
behavior:
  group: bit_ops
  inputs:
  - bit_index
  - dst
  output: none
  operation:
  - tmp_v = (dst_v >> (bit_index_v & 63)) & 1;
  - ZF = tmp_v == 0;
attributes:
  privilege: unprivileged
  flags:
    Z: old_bit == 0
    N: unchanged
    C: unchanged
    V: unchanged
forms:
  operands:
  - - name: bit_index
      type: selector
    - name: dst
      type: Rn
  - - name: bit_index
      type: selector
    - name: dst
      type: EA
  size: BWLQ
  compact: false
  encoding_fields:
  - field: o
    kind: bit_group
    width: 2
    placement: high
    values:
    - BCHG
    - BCLR
    - BSET
    - BTEST
    derive: mnemonic
    match:
      profile: I6_TO_EA
definition_status:
  allocation: 'external: isa/alloc'

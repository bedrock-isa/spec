mnemonic: SAR
doc:
  title: Shift Arithmetic Right
  summary: Performs the shift arithmetic right operation.
  description: >
    The effective count is the count operand modulo the selected operand width:
    B uses mod 8, W uses mod 16, L uses mod 32, and Q uses mod 64. If the effective
    count is zero, the destination is unchanged. FLAGS are unchanged for all counts.
  instruction_family: integer_bitfield
  instruction_class: integer
behavior:
  group: shifts_rotates
  inputs:
  - count
  input_output: dst
  operation:
  - width_v = arch_operand_width(size_v);
  - shift_v = count_v mod width_v;
  - if shift_v != 0, result_v = arch_arithmetic_shift_right(dst_old_v, shift_v, width_v);
  - if shift_v != 0, dst_v = result_v;
  count_rules:
    effective_count: count modulo selected operand width; B uses mod 8, W uses mod 16, L uses mod 32, Q uses mod 64
    zero_effective_count: destination unchanged
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
  repgf_candidate: true
  flags: unchanged
forms:
  compact_forms:
  - operands:
    - name: count
      type: Rn
    - name: dst
      type: Rn
    size: LQ
    profile: short register count
  extended_forms:
  - operands:
    - name: count
      type: Rn
    - name: dst
      type: EA
    size: BWLQ
    profile: medium register count
  - operands:
    - name: count
      type: imm6
    - name: dst
      type: EA
    size: BWLQ
    profile: long immediate count
definition_status:
  allocation: 'external: isa/alloc'

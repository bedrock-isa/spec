mnemonic: INVDCACHE
doc:
  title: Invalidate Data Cache
  summary: Invalidate data cache block or range.
  instruction_family: cache
  instruction_class: system
behavior:
  group: cache
  inputs:
  - target
  output: none
  operation:
  - resolve target_v to the addressed byte range without reading the target bytes;
  - for each data-cache line intersecting the range, invalidate the line without writing back dirty data;
  - retire only after all selected data-cache invalidations are complete for this hardware thread;
attributes:
  privilege:
    default: supervisor
    policy_controlled: true
forms:
  require_memory_operand: true
  operands:
  - name: target
    type: EA_or_range
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: REPcc
doc:
  title: Repeat Conditional
  summary: Repeats the next instruction while the counter and condition remain active.
  description: >
    REPcc installs repeat state for the following single instruction. The selected counter
    register is interpreted as an unsigned remaining count. The body instruction is decoded before
    zero-count annulment, and body repeatability is checked before annulment. REP is the unconditional
    spelling and uses condition T. Condition F is reserved and is not a valid encoding. While repeat
    state is active, architectural PC points at the body instruction boundary. Exceptions and
    architectural events save repeat state in EVENT_AUX and clear architectural repeat state before
    entering the handler; ERET restores the saved repeat state with the saved PC and status state.
  instruction_family: control_flow
  instruction_class: control_flow
behavior:
  group: control_flow
  inputs:
  - cc
  input_output: counter
  operation:
  - fetch and completely decode the instruction at inst_next before testing counter_v;
  - if the decoded body does not permit REPcc or cc_v is F, raise ILLEGAL_INSTRUCTION;
  - local body_pc_v = inst_next;
  - local after_body_pc_v = the instruction boundary following the decoded body;
  - local remaining_v = counter_v;
  - if remaining_v == 0, set PC = after_body_pc_v and annul the decoded body;
  - while remaining_v != 0, execute one body iteration with architectural PC = body_pc_v and capture its repeat-observed value;
  - after each successful body commit, set remaining_v = remaining_v - 1 and write remaining_v to the selected counter register with priority over any body write to that register;
  - after each successful body commit, if remaining_v == 0 or condition cc_v is false for the captured repeat-observed value, clear repeat state and set PC = after_body_pc_v;
  - otherwise retain the decoded body and repeat state and set PC = body_pc_v for the next iteration;
  - if an event interrupts an active iteration, save the selected counter, cc_v, repeat kind, and body_pc_v continuation in EVENT_AUX and clear active repeat state before event entry;
  operation_text: >
    The body instruction is fetched, decoded, and checked for repeatability before the zero-count
    rule is applied. If the counter is zero, the decoded body is annulled and has no architectural
    side effects. If the counter is nonzero, the first body iteration executes before any
    condition check. The repeat condition is the body instruction's repeat-observed value, observed
    during body execution rather than sampled by REP outside the body. Body commit, condition
    observation, counter decrement, and continuation PC selection are one precise architectural commit
    step. Every completed body iteration decrements the counter by one, including the terminating
    condition-false iteration. Writes by the body to the selected counter register have no
    architectural effect while repeat state is active.
attributes:
  privilege: unprivileged
  repeat_control: true
  flags: body instruction rules apply
forms:
  syntax: "REPcc Rn, (instruction)"
  body: next_instruction
  repeatable_required:
    REP: rep
    REPcc: repcc
  repeat_state_saved_in: EVENT_AUX
  operands:
  - name: cc
    type: condition
  - name: counter
    type: Rn
  alias:
    REP: "REP.T"
  invalid_conditions:
  - F
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: MOVNT
doc:
  title: Move Non-Temporal
  summary: Stores an Rn value to memory with a non-temporal access hint.
  description: >
    MOVNT is a store-only non-temporal move. The source is an Rn register and the destination
    must be a memory operand. Register destinations and immediate destinations are invalid.
  instruction_family: cache
  instruction_class: data_movement
behavior:
  group: cache
  inputs:
  - src
  output: dst
  operation:
  - compute the destination effective address and validate a writable current-domain access of size_v bytes;
  - store the low size_v bytes of src_v to dst_ref as one ordinary architectural store;
  - mark the store non-temporal so the implementation may minimize cache allocation or retention;
  - the non-temporal hint adds no ordering beyond an ordinary store and is not a fence;
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
  memory_hint: non_temporal
forms:
  dst_ea_set: memory_only
  require_memory_operand: true
  operands:
  - name: src
    type: Rn
  - name: dst
    type: EA
  size: BWLQ
definition_status:
  allocation: 'external: isa/alloc'

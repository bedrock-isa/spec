mnemonic: PARITY
doc:
  title: Parity Test
  summary: Computes operand parity and writes the predicate to an Rn register.
  description: Computes the parity of the selected operand size and writes popcount(src) & 1 to the
    destination register. The written value is 1 for odd parity and 0 for even parity. FLAGS are unchanged.
  instruction_family: integer_bitfield
  instruction_class: integer
behavior:
  group: bit_counts
  inputs:
  - src
  output: dst
  operation:
  - tmp_v = src_v;
  - if (size_v == 8) goto <parity_mask_done>;
  - if (size_v != 4) goto <parity_not_l>;
  - tmp_v = tmp_v & 0xffffffff;
  - goto <parity_mask_done>;
  - <parity_not_l>
  - if (size_v != 2) goto <parity_b>;
  - tmp_v = tmp_v & 0xffff;
  - goto <parity_mask_done>;
  - <parity_b>
  - tmp_v = tmp_v & 0xff;
  - <parity_mask_done>
  - result_v = popcount(tmp_v);
  - dst_v = result_v & 1;
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
  repgf_candidate: true
  flags: unchanged
forms:
  operands:
  - - name: src
      type: EA
    - name: dst
      type: Rn
  size: BWLQ
  compact: false
  extension_family: integer_bitfield
  result: dst = popcount(src) & 1
definition_status:
  allocation: 'external: isa/alloc'

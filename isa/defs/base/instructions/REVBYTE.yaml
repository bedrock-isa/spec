mnemonic: REVBYTE
doc:
  title: Reverse Bytes
  summary: Performs the reverse bytes operation.
  instruction_family: integer_alu
  instruction_class: integer
behavior:
  group: bit_reverse
  input_output: dst
  operation:
  - dst_v = 0;
  - tmp_v = dst_old_v;
  - result_v = size_v;
  - <revbyte_loop>
  - if (result_v == 0) goto <revbyte_done>;
  - dst_v = dst_v << 8;
  - carry_v = 0xff;
  - borrow_v = tmp_v & carry_v;
  - dst_v = dst_v | borrow_v;
  - tmp_v = tmp_v >> 8;
  - result_v = result_v - 1;
  - goto <revbyte_loop>;
  - <revbyte_done>
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
  repgf_candidate: true
forms:
  compact_forms:
  - operands:
    - name: dst
      type: Rn
    size: WLQ
  extended_forms:
  - operands:
    - name: dst
      type: EA
    size: WLQ
    compact: false
  result: dst = reverse_bytes(dst)
definition_status:
  allocation: 'external: isa/alloc'

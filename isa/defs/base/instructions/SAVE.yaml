mnemonic: SAVE
doc:
  title: Save Processor State
  summary: Save modified processor state to a CPUID-defined save area.
  description: 'Save modified processor state to a CPUID-defined save area. SAVE uses an XSAVEOPT-like
    policy for enabled extension state: state blocks that are architecturally clean may be skipped, while
    modified blocks are written to their CPUID-defined 64-byte-aligned slots. The fixed base block always
    records R0-R15, FLAGS, and STATUS. The memory image does not carry per-component size records; software
    allocates the maximum required save area size reported by CPUID. The save-area base must be 4 KiB
    aligned.'
  instruction_family: tlb_and_context
  instruction_class: system
behavior:
  group: tlb_context
  inputs:
  - memory
  output: none
  operation:
  - local base_v = effective address of memory without reading memory;
  - if (base_v & 0xfff) != 0, raise INVALID_CONTROL_STATE;
  - snapshot R0-R15, GS0-GS5, GS_VALID, FLAGS, STATUS, and every enabled extension-state component;
  - local state_bitmap_v = 0;
  - for each enabled extension component in CPUID descriptor order, if the component is architecturally dirty, set its state_bitmap_v bit and select its CPUID-defined component range for writing;
  - validate writable access to the complete fixed base block and every selected extension-component range before storing any byte;
  - '*:8 (base_v + 0x000) = SAVE format, GS_VALID, FLAGS, and STATUS with every reserved header bit zero;'
  - '*:8 (base_v + 0x008) = state_bitmap_v with every unassigned component bit zero;'
  - for reg_v = 0 to 15, *:8 (base_v + 0x010 + 8 * reg_v) = R[reg_v];
  - for reg_v = 0 to 5 with GS_VALID[reg_v] set, *:8 (base_v + 0x090 + 8 * reg_v) = GS[reg_v];
  - write each selected extension snapshot to its CPUID-defined 64-byte-aligned component offset in descriptor order;
  - commit the fixed block, selected extension blocks, and their state bitmap as one architectural memory update;
  operation_text: 'SAVE writes the fixed base block at the selected save-area address. It records the
    base header fields, the state-block bitmap, R0-R15, GS registers whose validity bits are set, FLAGS,
    and STATUS according to the SAVE/RESTORE Processor-State Save Area layout. Enabled extension state
    blocks are written to their CPUID-defined component offsets; architecturally clean extension blocks
    may be skipped and reported clear in the state-block bitmap.

    '
attributes:
  privilege: unprivileged
forms:
  operands:
  - name: memory
    type: EA
definition_status:
  allocation: 'external: isa/alloc'

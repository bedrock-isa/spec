mnemonic: REPG
doc:
  title: Grouped Repeat
  summary: Repeats the following straight-line instruction body using an Rn counter.
  description: >
    REPG takes an Rn counter and an unsigned 16-bit body byte count. The body starts at the next
    instruction after REPG and extends for exactly body_bytes bytes. body_bytes is an unsigned byte
    count. A zero body byte count is invalid. A nonzero body byte count is valid only when the selected
    byte range decodes as a whole number of complete instructions and ends exactly at an instruction
    boundary. The grouped body is decoded when repeat state is entered and remains the repeated body
    until the repeat context exits.
  instruction_family: control_flow
  instruction_class: control_flow
behavior:
  group: control_flow
  inputs:
  - body_bytes
  input_output: counter
  operation:
  - if body_bytes_v == 0, raise ILLEGAL_INSTRUCTION;
  - decode exactly body_bytes_v bytes beginning at inst_next and require the range to end on a complete instruction boundary;
  - if any decoded instruction does not permit REPG, raise ILLEGAL_INSTRUCTION;
  - local group_start_v = inst_next;
  - local group_end_v = inst_next + body_bytes_v;
  - local remaining_v = counter_v;
  - if remaining_v == 0, set PC = group_end_v and annul every decoded body instruction;
  - while remaining_v != 0, execute the decoded instructions in order from group_start_v through group_end_v;
  - if a body instruction faults, retain effects of earlier completed body instructions, execute no later body instruction, and do not decrement remaining_v;
  - after a complete successful group iteration, set remaining_v = remaining_v - 1 and write remaining_v to the selected counter register with priority over body writes at the group boundary;
  - if remaining_v == 0, clear repeat state and set PC = group_end_v; otherwise set PC = group_start_v for the next group iteration;
  - if an event interrupts active grouped repetition, save the selected counter, repeat kind, group-start delta, body_bytes_v, and continuation PC in EVENT_AUX and clear active repeat state before event entry;
  operation_text: >
    The grouped body is decoded and each body instruction is checked for REPG repeatability before
    the zero-count rule is applied. If the counter is zero, the decoded group is annulled and has no
    architectural side effects. If the counter is nonzero, one successful whole-group iteration
    decrements it by one. The update occurs only after the whole grouped body iteration succeeds.
    A normal REPG body may write the selected counter register; such writes are ordinary
    architectural writes in the grouped instruction stream and do not modify the captured repeat
    remaining-count value. At a successful group-iteration boundary, the repeat counter update has
    final priority for the selected counter register. The REPGF assembler-checked alias rejects
    bodies that write the selected counter register.
    Completed prior body instructions in a faulting iteration remain committed, later body
    instructions do not execute, and the saved repeat continuation records the selected counter,
    condition T, repeat kind, group_start_delta, and body_bytes in EVENT_AUX. FLAGS and FFLAGS follow
    the rules of the last completed grouped instruction; FFLAGS from completed floating-point
    operations are accumulated by bitwise inclusive-or.
attributes:
  privilege: unprivileged
  flags: grouped instruction rules apply
forms:
  syntax: |-
    REPG Rn, {
        (instructions...)
    }
  body: byte_counted_instruction_group
  repeatable_required:
    REPG: repg
  assembler_checked_aliases:
    REPGF:
      emits: REPG
      syntax: |-
        REPGF Rn, {
            (instructions...)
        }
      body_candidate_required: repgf_candidate
      body_constraints:
      - body must not write the selected counter register
      architectural_effect: identical to REPG; the machine encoding and repeat-continuation
        state do not distinguish the alias
  repeat_state_saved_in: EVENT_AUX
  compact_forms:
  - operands:
    - name: counter
      type: Rn
    - name: body_bytes
      type: imm16
    compact: required
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: DJcc
doc:
  title: Decrement And Jump Conditional
  summary: Performs the decrement and jump conditional operation.
  instruction_family: control_flow
  instruction_class: control_flow
behavior:
  group: control_flow
  inputs:
  - cc
  - target
  input_output: counter
  operation:
  - counter_v = counter_v - 1;
  - if (counter_v == 0) goto <djcc_done>;
  - if (cc_v == 0) goto <djcc_done>;
  - goto [target_v];
  - <djcc_done>
attributes:
  privilege: unprivileged
forms:
  operands:
  - name: cc
    type: condition
  - name: counter
    type: Rn
  - name: target
    type: EA
  size: BWLQ
  reads: FLAGS
  updates: Dcounter
definition_status:
  allocation: 'external: isa/alloc'

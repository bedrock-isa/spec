version: rewrite-draft-v1
instruction_sets:
- name: base
  root: base
  include: base/instructions.yaml
- name: fpu
  root: extensions/fpu
  include: extensions/fpu/instructions.yaml
- name: fpu_transcendental
  root: extensions/fpu_transcendental
  include: extensions/fpu_transcendental/instructions.yaml
- name: virtualization_acceleration
  root: extensions/virtualization_acceleration
  include: extensions/virtualization_acceleration/instructions.yaml
extension_grouping:
  family_order:
  - integer_alu
  - integer_alu_reg_ea_wide
  - integer_alu_imm_ea_arith_wide
  - integer_alu_imm_ea_logic_wide
  - integer_alu_cmp_ea_wide
  - integer_extend_ea_wide
  - integer_bounds
  - integer_bounds_signed
  - integer_bounds_unsigned
  - integer_mul_div
  - integer_bitfield
  - integer_bitfield_bit_imm
  - integer_bitfield_rotate_imm
  - integer_bitfield_shift_imm
  - data_movement
  - ea_utility
  - control_flow
  - conditional_control
  - atomic_memory
  - cache_hint
  - tlb_cache
  - system_core
  - virtualization_acceleration
  - fpu_move_compare
  - fpu_arithmetic_ea_wide
  - fpu_arithmetic
  - fpu_transcendental
  - misc
  profile_order:
    integer_alu:
    - EA_TO_D
    - EA_TO_A
    - D_TO_EA
  member_order:
    conditional_control:
    - DJcc.D_TO_EA
    - FMOVcc.F_TO_F
    - CALLcc.EA
    - Jcc.EA.WL
    - SETcc.EA
    - MOVcc.A_TO_EA
    - MOVcc.D_TO_EA
    - IJcc.D_TO_D_TO_EA
    - MOVcc.EA_TO_A
    - MOVcc.EA_TO_D
    - FMOVcc.EA_TO_F
    - FMOVcc.F_TO_EA
  family_locality:
    integer_alu:
      prefer_contiguous_roots: true
      roots:
      - EA_TO_D
      - EA_TO_A
      - D_TO_EA
  roots:
    group_by: semantic_family
    condition_field_in_primary: true
    preferred_region: high_primary_payload
    allow_low_payload_roots: false
  family_rules:
  - match:
      mnemonic:
      - ADC
      - ADD
      profile:
      - D_TO_EA
      - EA_TO_D
    extension_family: integer_alu_reg_ea_wide
  - match:
      mnemonic: AND
      profile: D_TO_EA
    extension_family: integer_alu_reg_ea_wide
  - match:
      mnemonic:
      - ADC
      - ADD
      - SBB
      - SUB
      profile: IMM_TO_EA
    extension_family: integer_alu_imm_ea_arith_wide
  - match:
      mnemonic:
      - AND
      - OR
      - TEST
      - XOR
      profile: IMM_TO_EA
    extension_family: integer_alu_imm_ea_logic_wide
  - match:
      mnemonic: CMP
      profile:
      - EA_TO_EA
      - IMM_TO_EA
    extension_family: integer_alu_cmp_ea_wide
  - match:
      mnemonic:
      - EXTSL
      - EXTSQ
      - EXTSW
      - EXTZL
      - EXTZQ
      - EXTZW
      profile: EA_TO_EA
    extension_family: integer_extend_ea_wide
  - match:
      group: BIT_OPS
      profile: I6_TO_EA
    extension_family: integer_bitfield_bit_imm
  - match:
      group: ROTATES
      profile: I6_TO_EA
    extension_family: integer_bitfield_rotate_imm
  - match:
      group: SHIFTS
      profile: I6_TO_EA
    extension_family: integer_bitfield_shift_imm
  - match:
      mnemonic:
      - FABS
      - FADD
      profile:
      - EA_TO_F
      - F_TO_EA
    extension_family: fpu_arithmetic_ea_wide

mnemonic: FTANH
doc:
  title: Floating-Point Hyperbolic Tangent
  summary: Performs the floating-point hyperbolic tangent operation.
  instruction_family: fpu_transcendental
  instruction_class: fpu
behavior:
  group: fpu_transcendental
  inputs:
  - src
  output: dst
  operation:
  - dst_v = fp_tanh(src_v);
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update:
    - NV
    - OF
    - UF
    - NX
forms:
  operands:
  - name: src
    type: FREG
  - name: dst
    type: FREG
  size: S_D
  extension_family: fpu_transcendental
definition_status:
  allocation: 'external: isa/alloc'

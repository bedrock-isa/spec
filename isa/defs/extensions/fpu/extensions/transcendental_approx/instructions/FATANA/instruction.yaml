mnemonic: FATANA
doc:
  title: Approximate Floating-Point Arc Tangent
  summary: Performs the bounded approximate floating-point arc tangent operation.
  instruction_family: fpu_transcendental_approx
  instruction_class: fpu
  description: Computes the atan(x) in radians reference over all finite values and signed infinity after DAZ and writes an implementation-bounded S- or D-format approximation under the selected FPTRANSA accuracy contract.
behavior:
  group: fpu_transcendental_approx
  inputs:
  - src
  output: dst
  approximation:
    contract_id: '0x0013'
    reference_function: atan(x) in radians
    domain: all finite values and signed infinity after DAZ
    max_ulp:
      S: 4
      D: 4
    exact_anchors:
    - atan(+0) = +0
    - atan(-0) = -0
    properties:
    - odd
    - monotonically increasing
    - finite results are in [-pi/2, pi/2]
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update:
    - NV
    - UF
forms:
  operands:
  - name: src
    type: Fn
  - name: dst
    type: Fn
  size: SD
  extension_family: fpu_transcendental_approx

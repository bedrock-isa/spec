mnemonic: FETOXM1A
doc:
  title: Approximate Floating-Point e To x Minus One
  summary: Performs the bounded approximate floating-point e to x minus one operation.
  instruction_family: fpu_transcendental_approx
  instruction_class: fpu
  description: Computes the (e ** x) - 1 without an intermediate rounded exponential reference over all finite values and signed infinity after DAZ and writes an implementation-bounded S- or D-format approximation under the selected FPTRANSA accuracy contract.
behavior:
  group: fpu_transcendental_approx
  inputs:
  - src
  output: dst
  approximation:
    contract_id: '0x0032'
    reference_function: "(e ** x) - 1 without an intermediate rounded exponential"
    domain: all finite values and signed infinity after DAZ
    max_ulp:
      S: 4
      D: 4
    exact_anchors:
    - expm1(+0) = +0
    - expm1(-0) = -0
    - expm1(-infinity) = -1
    properties:
    - strictly increasing for finite inputs
    - result is at least -1
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update:
    - NV
    - OF
    - UF
forms:
  operands:
  - name: src
    type: Fn
  - name: dst
    type: Fn
  size: SD
  extension_family: fpu_transcendental_approx

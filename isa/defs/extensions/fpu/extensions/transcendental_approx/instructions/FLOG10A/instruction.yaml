mnemonic: FLOG10A
title: Approximate Floating-Point Log Base 10
summary: Performs the approximate floating-point log base 10 operation.
description: After DAZ, computes an implementation-bounded S- or D-format approximation of the log10(x) reference under the selected FPTRANSA accuracy contract. The reference domain includes positive finite values and positive infinity; signed zero is the DZ boundary.
attributes:
  class: fpu
  family: fpu_transcendental_approx
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPG
flag_effects:
  FFLAGS:
    NV: "may accrue"
    DZ: "may accrue"
    UF: "may accrue"
additional_description: details.tex

mnemonic: FATANHA
title: Approximate Floating-Point Hyperbolic Arc Tangent
summary: Performs the bounded approximate floating-point hyperbolic arc tangent operation.
description: Computes the atanh(x) reference over finite x with abs(x) <= 1 after DAZ and writes an implementation-bounded S- or D-format approximation under the selected FPTRANSA accuracy contract.
attributes:
  class: fpu
  family: fpu_transcendental_approx
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPG
flag_effects:
  FFLAGS:
    NV: "may accrue"
    DZ: "may accrue"
    UF: "may accrue"
additional_description: details.tex

mnemonic: FTANA
title: Approximate Floating-Point Tangent
summary: Performs the bounded approximate floating-point tangent operation.
description: Computes the tan(x) in radians reference over finite x with abs(x) <= pi / 4 after DAZ and writes an implementation-bounded S- or D-format approximation under the selected FPTRANSA accuracy contract.
attributes:
  class: fpu
  family: fpu_transcendental_approx
  privilege: unprivileged
  repeat:
  - REP
  - REPG
additional_description: details.tex

mnemonic: FLOGNP1A
title: Approximate Floating-Point Natural Log Plus One
summary: Performs the approximate floating-point natural log plus one operation.
description: After DAZ, computes an implementation-bounded S- or D-format approximation of the ln(1 + x) reference without an intermediate rounded addition under the selected FPTRANSA accuracy contract. The reference domain includes finite x >= -1 and positive infinity; -1 is the DZ boundary.
attributes:
  class: fpu
  family: fpu_transcendental_approx
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPG
flag_effects:
  FFLAGS:
    NV: "may accrue"
    DZ: "may accrue"
    UF: "may accrue"
additional_description: details.tex

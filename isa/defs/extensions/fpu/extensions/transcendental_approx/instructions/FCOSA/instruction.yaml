mnemonic: FCOSA
title: Approximate Floating-Point Cosine
summary: Performs the approximate floating-point cosine operation.
description: Computes the cos(x) reference in radians over finite x with abs(x) <= pi / 4 after DAZ and writes an implementation-bounded S- or D-format approximation under the selected FPTRANSA accuracy contract.
attributes:
  class: fpu
  family: fpu_transcendental_approx
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPG
flag_effects:
  FFLAGS:
    NV: "may accrue"
additional_description: details.tex

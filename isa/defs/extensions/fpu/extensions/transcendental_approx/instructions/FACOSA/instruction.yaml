mnemonic: FACOSA
title: Approximate Floating-Point Arc Cosine
summary: Performs the bounded approximate floating-point arc cosine operation.
description: Computes the acos(x) reference in radians over finite x with abs(x) <= 1 after DAZ and writes an implementation-bounded S- or D-format approximation under the selected FPTRANSA accuracy contract.
attributes:
  class: fpu
  family: fpu_transcendental_approx
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPG
flag_effects:
  FFLAGS:
    NV: "may accrue"
    UF: "may accrue"
additional_description: details.tex

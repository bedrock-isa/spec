mnemonic: FLOGNA
title: Approximate Floating-Point Natural Log
summary: Performs the bounded approximate floating-point natural log operation.
description: Computes the ln(x) reference over positive finite values and positive infinity after DAZ; signed zero is the DZ boundary and writes an implementation-bounded S- or D-format approximation under the selected FPTRANSA accuracy contract.
attributes:
  class: fpu
  family: fpu_transcendental_approx
  privilege: unprivileged
  repeat:
  - REP
  - REPG
flag_effects:
  FFLAGS:
    NV: "may accrue"
    DZ: "may accrue"
    UF: "may accrue"
additional_description: details.tex

forms:
- id: extralong.fsincosa_x_fn_s_fn_d_fn_c
  class: extralong
  bits: 1111110000001z01ssss000dddd000cccc
  syntax: FSINCOSA.SD(z) Fn(s), Fn(d), Fn(c)
  operands:
  - name: src
    type: Fn
    access: read
    field: s
  - name: sin_dst
    type: Fn
    access: write
    field: d
  - name: cos_dst
    type: Fn
    access: write
    field: c
  fields:
    z:
      type: size.SD
  destination_overlap:
  - operands: [sin_dst, cos_dst]
    rule: illegal_instruction

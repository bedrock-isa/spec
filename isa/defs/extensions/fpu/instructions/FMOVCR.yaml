mnemonic: FMOVCR
doc:
  title: Floating-Point Move Constant
  summary: Loads a named architectural binary64 constant selected by an unsigned 16-bit ID.
  description: >
    FMOVCR maps an unsigned 16-bit constant ID to a fixed IEEE-754 binary64 bit pattern and
    writes that pattern to the destination F register. The mapping includes common numeric,
    transcendental, infinity, NaN, and format-boundary constants. It is independent of FSTATUS
    rounding, DAZ, FTZ, and default-NaN modes. Loading a signaling NaN is a bitwise move and does
    not itself raise NV; a later consuming floating-point operation applies its normal NaN rules.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_move_compare
  inputs:
  - constant_id
  output: dst
  operation:
  - local selected_id_v = constant_id_v & 0xffff;
  - if selected_id_v is not assigned by the FMOVCR Constant IDs table, raise ILLEGAL_INSTRUCTION;
  - dst_v = the exact 64-bit binary64 encoding assigned to selected_id_v;
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags: unchanged
  flags: unchanged
forms:
  operands:
  - name: constant_id
    type: imm16
  - name: dst
    type: FREG
  size: S_D
  result_format: IEEE-754 binary64
  constant_ids:
  - {id: '0x0000', name: positive_zero, value_bits: '0x0000000000000000'}
  - {id: '0x0001', name: negative_zero, value_bits: '0x8000000000000000'}

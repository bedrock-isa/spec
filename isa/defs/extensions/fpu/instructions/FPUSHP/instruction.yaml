mnemonic: FPUSHP
title: Floating-Point Push Register Pair
summary: Pushes one canonical floating-point register pair selected by an inline pair index.
description: Pushes the canonical floating-point register pair selected by the pair ID. The canonical pair sequence is pair 0 (F14, F15), pair 1 (F12, F13), pair 2 (F10, F11), pair 3 (F8, F9), pair 4 (F6, F7), pair 5 (F4, F5), pair 6 (F2, F3), and pair 7 (F0, F1). All eight pair IDs are valid and each selects one pair.
attributes:
  class: fpu
  family: fpu
  privilege: unprivileged
  repeat:
  - REP
  - REPcc
  - REPG
additional_description: details.tex

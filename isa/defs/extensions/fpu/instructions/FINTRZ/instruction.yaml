mnemonic: FINTRZ
doc:
  title: Floating-Point Integral Toward Zero
  summary: Performs the floating-point integral toward zero operation.
  instruction_family: fpu
  instruction_class: fpu
  description: Rounds the selected floating-point source toward zero to an integral floating-point value.

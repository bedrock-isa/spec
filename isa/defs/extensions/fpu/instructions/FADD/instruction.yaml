mnemonic: FADD
doc:
  title: Floating-Point Add
  summary: Adds the source operand to the destination operand.
  instruction_family: fpu
  instruction_class: fpu
  description: Adds the selected-format floating-point source and destination values and writes the rounded result under the architectural floating-point environment.
may_accrue_fp_flags:
- NV
- OF
- UF
- NX
attributes:
  privilege: unprivileged
  repeat:
  - REP
  - REPG
forms:
- operands:
  - name: src
    type: Fn
    access: read
  - name: dst
    type: Fn
    access: read_write
  sizes:
  - S
  - D
- operands:
  - name: src
    type: EA
    access: read
  - name: dst
    type: Fn
    access: read_write
  sizes:
  - S
  - D

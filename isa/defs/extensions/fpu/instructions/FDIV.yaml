mnemonic: FDIV
doc:
  title: Floating-Point Divide
  summary: Performs the floating-point divide operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs:
  - src
  input_output: dst
  operation:
  - dst_v = dst_v f/ src_v;
attributes:
  privilege: unprivileged
  streaming_candidate: true
  fp_flags:
    update:
    - NV
    - DZ
    - OF
    - UF
    - NX
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  size: S_D
  result: Fdst
  memory_destination_arithmetic: disallowed
definition_status:
  allocation: 'external: isa/alloc'

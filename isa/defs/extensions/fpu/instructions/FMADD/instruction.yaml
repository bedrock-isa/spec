mnemonic: FMADD
doc:
  title: Floating-Point Fused Multiply Add
  summary: Performs the floating-point fused multiply add operation.
  instruction_family: fpu
  instruction_class: fpu
  description: Computes the selected-format fused multiply-add with one final rounding and writes the result to the destination.
may_accrue_fp_flags:
- NV
- OF
- UF
- NX
attributes:
  privilege: unprivileged
  repeat:
  - REP
  - REPG
forms:
- operands:
  - name: lhs
    type: Fn
    access: read
  - name: rhs
    type: Fn
    access: read
  - name: dst
    type: Fn
    access: read_write
  sizes:
  - S
  - D

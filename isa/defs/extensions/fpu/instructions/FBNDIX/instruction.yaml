mnemonic: FBNDIX
title: Floating-Point Bounds Check Inclusive-Exclusive
summary: Checks floating-point value membership in the inclusive-exclusive interval [lo, hi).
description: FBNDIX treats the low bound as inclusive and the high bound as exclusive. It sets V when value is unordered or outside [lo, hi); Z, N, and C are unchanged.
attributes:
  class: fpu
  family: fpu
  privilege: unprivileged
  repeat:
  - REP
  - REPG
additional_description: details.tex

mnemonic: FMAX
doc:
  title: Floating-Point Maximum
  summary: Performs the floating-point maximum operation.
  instruction_family: fpu
  instruction_class: fpu
  description: Selects the greater floating-point operand according to the architectural NaN and signed-zero rules and writes it to the destination.
may_accrue_fp_flags:
- NV
attributes:
  privilege: unprivileged
  repeat:
  - REP
  - REPG
forms:
- operands:
  - name: src
    type: Fn
    access: read
  - name: dst
    type: Fn
    access: read_write
  sizes:
  - S
  - D
- operands:
  - name: src
    type: EA
    access: read
  - name: dst
    type: Fn
    access: read_write
  sizes:
  - S
  - D

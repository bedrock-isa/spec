mnemonic: FMAX
doc:
  title: Floating-Point Maximum
  summary: Performs the floating-point maximum operation.
  instruction_family: fpu
  instruction_class: fpu
  description: Selects the greater floating-point operand according to the architectural NaN and signed-zero rules and writes it to the destination.
behavior:
  group: fpu_arithmetic
  inputs:
  - src
  input_output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  streaming_candidate: true
  fp_flags:
    update_when_required:
    - NV
forms:
  operands:
  - - name: src
      type: Fn
    - name: dst
      type: Fn
  - - name: src
      type: EA
    - name: dst
      type: Fn
  size: SD
  nan_policy: defined by the floating-point model

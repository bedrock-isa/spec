families:
  fpu:
    registers:
      F:
        count: 16
        width: 64
        scalar_formats:
        - S
        - D
operation_semantics:
  syntax_policy:
    condition_code: {}
  notation:
    fp_status: floating-point accrued exception/status bits in FFLAGS
    fflags:
      NV: invalid operation
      DZ: division by zero
      OF: overflow
      UF: underflow
      NX: inexact
  group_order:
  - fpu_move_compare
  - fpu_arithmetic
  groups:
    fpu_move_compare: {}
    fpu_arithmetic: {}

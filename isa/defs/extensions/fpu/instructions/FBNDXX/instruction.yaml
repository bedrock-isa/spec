mnemonic: FBNDXX
doc:
  title: Floating-Point Bounds Check Exclusive-Exclusive
  summary: Checks floating-point value membership in the exclusive-exclusive interval (lo, hi).
  description: FBNDXX treats both bounds as exclusive. It sets V when value is unordered or outside (lo, hi); Z, N, and C are unchanged.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs:
  - hi
  - lo
  - value
  output: none
  repeat_flags: fpu_interval_v_flag
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update_when_required:
    - NV
  flags:
    V: set when the value is out of bounds or unordered
    ZNC: unchanged
forms:
  operands:
  - - name: lo
      type: Fn
    - name: value
      type: Fn
    - name: hi
      type: Fn
  - - name: lo
      type: Fn
    - name: value
      type: EA
    - name: hi
      type: Fn
  - - name: lo
      type: EA
    - name: value
      type: Fn
    - name: hi
      type: EA
  size: SD

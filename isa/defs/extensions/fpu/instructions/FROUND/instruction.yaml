mnemonic: FROUND
title: Floating-Point Round
summary: Performs the floating-point round operation.
description: Rounds the selected floating-point source to the nearest integral value in the same format according to the instruction-defined rounding rule.
attributes:
  class: fpu
  family: fpu
  privilege: unprivileged
  repeat:
  - REP
  - REPG
flag_effects:
  FFLAGS:
    NV: "may accrue"
    NX: "may accrue"

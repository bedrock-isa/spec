mnemonic: FPOPP
title: Floating-Point Pop Register Pair
summary: Pops one canonical floating-point register pair selected by an inline pair index.
description: Pops the canonical floating-point register pair selected by the pair ID. The canonical pair sequence is pair 0 (F0, F1), pair 1 (F2, F3), pair 2 (F4, F5), pair 3 (F6, F7), pair 4 (F8, F9), pair 5 (F10, F11), pair 6 (F12, F13), and pair 7 (F14, F15). All eight pair IDs are valid and each selects one pair.
attributes:
  class: fpu
  family: fpu
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPG
additional_description: details.tex

mnemonic: FPOPP
doc:
  title: Floating-Point Pop Register Pair
  summary: Pops one canonical floating-point register pair selected by an inline pair index.
  description: Pops the canonical floating-point register pair selected by the pair ID. The canonical pair sequence is pair 0 (F14, F15), pair 1 (F12, F13), pair 2 (F10, F11), pair 3 (F8, F9), pair 4 (F6, F7), pair 5 (F4, F5), pair 6 (F2, F3), and pair 7 (F0, F1). All eight pair IDs are valid and each selects one pair.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_stack
  inputs:
  - pair_id
  output: none
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: true
    repg: true
  flags: unchanged
  fp_flags: unchanged
forms:
  operands:
  - name: pair_id
    type: pair_id
  canonical_pairs:
  - index: 0
    registers:
    - F14
    - F15
  - index: 1
    registers:
    - F12
    - F13
  - index: 2
    registers:
    - F10
    - F11
  - index: 3
    registers:
    - F8
    - F9
  - index: 4
    registers:
    - F6
    - F7
  - index: 5
    registers:
    - F4
    - F5
  - index: 6
    registers:
    - F2
    - F3
  - index: 7
    registers:
    - F0
    - F1
  size_per_register: Q
  compact: required

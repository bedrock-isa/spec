mnemonic: FMOVcc
doc:
  title: Floating-Point Conditional Move
  summary: Performs the floating-point conditional move operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_move_compare
  inputs:
  - cc
  - src
  output: dst
  operation:
  - if (cc_v == 0) goto <fmovcc_done>;
  - dst_v = src_v;
  - <fmovcc_done>
attributes:
  privilege: unprivileged
  fp_flags: unchanged
  flags: unchanged
forms:
  extended_forms:
  - operands:
    - name: cc
      type: condition
    - name: src
      type: FREG
    - name: dst
      type: FREG
    compact: false
  - operands:
    - name: cc
      type: condition
    - name: src
      type: EA
    - name: dst
      type: FREG
    size: S_D
    compact: false
  - operands:
    - name: cc
      type: condition
    - name: src
      type: FREG
    - name: dst
      type: EA
    size: S_D
    compact: false
  reads: FLAGS
definition_status:
  allocation: 'external: isa/alloc'

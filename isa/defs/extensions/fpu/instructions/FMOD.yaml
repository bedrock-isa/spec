mnemonic: FMOD
doc:
  title: Floating-Point Modulo
  summary: Performs the floating-point modulo operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs:
  - src
  input_output: dst
  operation:
  - local pending_exceptions_v = {};
  - apply FSTATUS.DAZ to subnormal src_v and dst_v inputs, preserving their signs;
  - if either input is a signaling NaN, add NV to pending_exceptions_v;
  - if either input is NaN, set result_v to the selected quiet NaN and goto <fmod_finalize>;
  - if dst_v is infinite or src_v is zero, add NV to pending_exceptions_v and set result_v to the architectural default quiet NaN;
  - if src_v is infinite and dst_v is finite, set result_v = dst_v;
  - otherwise set quotient_v = truncate_toward_zero(dst_v / src_v) and result_v = dst_v - quotient_v * src_v with exact arithmetic;
  - if result_v is zero, give it the sign of dst_v;
  - <fmod_finalize>
  - apply FSTATUS.DN to a NaN result and accrue pending_exceptions_v into FFLAGS;
  - if pending_exceptions_v intersects the enabled FSTATUS traps, raise FLOATING_POINT_FAULT without writing dst_v; otherwise write result_v to dst_v;
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update_when_required:
    - NV
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  size: S_D
  result: Fdst
  memory_destination_arithmetic: disallowed
definition_status:
  allocation: 'external: isa/alloc'

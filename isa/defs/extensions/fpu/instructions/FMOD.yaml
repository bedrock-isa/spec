mnemonic: FMOD
doc:
  title: Floating-Point Modulo
  summary: Performs the floating-point modulo operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs:
  - src
  input_output: dst
  operation:
  - dst_v = fp_mod(dst_v, src_v);
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update_when_required:
    - NV
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  size: S_D
  result: Fdst
  memory_destination_arithmetic: disallowed
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: FSCALE
doc:
  title: Floating-Point Scale
  summary: Performs the floating-point scale operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs:
  - src
  input_output: dst
  operation:
  - local pending_exceptions_v = {};
  - apply FSTATUS.DAZ to subnormal src_v and dst_v inputs, preserving their signs;
  - if either input is a signaling NaN, add NV to pending_exceptions_v;
  - if either input is NaN, set result_v to the selected quiet NaN and goto <fscale_finalize>;
  - if src_v is infinite, add NV to pending_exceptions_v and set result_v to the architectural default quiet NaN;
  - local scale_v = truncate_toward_zero(src_v);
  - local exact_v = dst_v * (2 ** scale_v) computed with unbounded exponent range;
  - set result_v to exact_v rounded once to the selected S or D format using FSTATUS.RM and add OF, UF, and NX to pending_exceptions_v as required;
  - if FSTATUS.FTZ is set and the rounded result is subnormal, replace it with signed zero and add UF and NX to pending_exceptions_v;
  - <fscale_finalize>
  - apply FSTATUS.DN to a NaN result and accrue pending_exceptions_v into FFLAGS;
  - if pending_exceptions_v intersects the enabled FSTATUS traps, raise FLOATING_POINT_FAULT without writing dst_v; otherwise write result_v to dst_v;
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update:
    - NV
    - OF
    - UF
    - NX
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  size: S_D
definition_status:
  allocation: 'external: isa/alloc'

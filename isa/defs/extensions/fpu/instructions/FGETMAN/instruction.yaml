mnemonic: FGETMAN
title: Floating-Point Get Mantissa
summary: Performs the floating-point get mantissa operation.
description: Extracts the normalized significand of the selected floating-point source and writes the specified floating-point result for finite and special values.
attributes:
  class: fpu
  family: fpu
  privilege: unprivileged
  repeat:
  - REP
  - REPG
flag_effects:
  FFLAGS:
    NV: "may accrue"
    NX: "may accrue"
additional_description: details.tex

mnemonic: FDIV
doc:
  title: Floating-Point Divide
  summary: Performs the floating-point divide operation.
  instruction_family: fpu
  instruction_class: fpu
  description: Divides the selected-format floating-point destination value by the source and writes the rounded result under the architectural floating-point environment.
may_accrue_fp_flags:
- NV
- DZ
- OF
- UF
- NX
attributes:
  privilege: unprivileged
  repeat:
  - REP
  - REPG
forms:
- operands:
  - name: src
    type: Fn
    access: read
  - name: dst
    type: Fn
    access: read_write
  sizes:
  - S
  - D
- operands:
  - name: src
    type: EA
    access: read
  - name: dst
    type: Fn
    access: read_write
  sizes:
  - S
  - D

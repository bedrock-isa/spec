mnemonic: FCEIL
doc:
  title: Floating-Point Ceiling
  summary: Performs the floating-point ceiling operation.
  instruction_family: fpu
  instruction_class: fpu
  description: Rounds the selected floating-point source toward positive infinity to an integral floating-point value.
behavior:
  group: fpu_arithmetic
  inputs:
  - src
  output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update_when_required:
    - NV
    - NX
forms:
  operands:
  - - name: src
      type: Fn
    - name: dst
      type: Fn
  - - name: src
      type: EA
    - name: dst
      type: Fn
  - - name: src
      type: Fn
    - name: dst
      type: EA
  size: SD
  result: floating integral value

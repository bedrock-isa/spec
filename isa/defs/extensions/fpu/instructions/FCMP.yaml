mnemonic: FCMP
doc:
  title: Floating-Point Compare
  summary: Performs the floating-point compare operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_move_compare
  inputs:
  - dst
  - src
  output: none
  operation:
  - ZF = dst_v f== src_v;
  - NF = dst_v f< src_v;
  - CF = 0;
  - VF = nan(dst_v) || nan(src_v);
  repeat_flags: fpu_compare_flags
attributes:
  privilege: unprivileged
  streaming_candidate: true
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update_when_required:
    - NV
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  size: S_D
  updates: FLAGS
  unordered: FLAGS.V = 1
definition_status:
  allocation: 'external: isa/alloc'

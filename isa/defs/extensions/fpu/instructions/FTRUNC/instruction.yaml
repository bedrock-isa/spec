mnemonic: FTRUNC
title: Floating-Point Truncate
summary: Performs the floating-point truncate operation.
description: Rounds the selected floating-point source toward zero to an integral value in the same floating-point format.
attributes:
  class: fpu
  family: fpu
  privilege: unprivileged
repeat:
  contexts:
  - REP
  - REPG
flag_effects:
  FFLAGS:
    NV: "may accrue"
    NX: "may accrue"

mnemonic: FREM
doc:
  title: Floating-Point Remainder
  summary: Performs the floating-point remainder operation.
  instruction_family: fpu
  instruction_class: fpu
  description: Computes the IEEE-style floating-point remainder using a quotient rounded to the nearest integer with ties to even.
behavior:
  group: fpu_arithmetic
  inputs:
  - src
  input_output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update_when_required:
    - NV
forms:
  operands:
  - - name: src
      type: Fn
    - name: dst
      type: Fn
  - - name: src
      type: EA
    - name: dst
      type: Fn
  size: SD
  result: Fdst
  memory_destination_arithmetic: disallowed

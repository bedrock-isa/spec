mnemonic: FCVTU
doc:
  title: Floating-Point Convert Unsigned
  summary: Performs the floating-point convert unsigned operation.
  instruction_family: fpu
  instruction_class: fpu
  description: Converts between supported unsigned integer and floating-point forms, or between the supported floating-point widths, according to the operand classes.
may_accrue_fp_flags:
- NV
- OF
- UF
- NX
attributes:
  privilege: unprivileged
  repeat:
  - REP
  - REPG
forms:
- operands:
  - name: src
    type: Fn
    access: read
  - name: dst
    type: Fn
    access: write
- operands:
  - name: src
    type: Fn
    access: read
  - name: dst
    type: Rn
    access: write
- operands:
  - name: src
    type: Rn
    access: read
  - name: dst
    type: Fn
    access: write

mnemonic: FXCHG
doc:
  title: Floating-Point Exchange
  summary: Performs the floating-point exchange operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_move_compare
  input_output:
  - lhs
  - rhs
  operation:
  - tmp_v = lhs_v;
  - lhs_v = rhs_v;
  - rhs_v = tmp_v;
attributes:
  privilege: unprivileged
  fp_flags: unchanged
forms:
  operands:
  - name: lhs
    type: FREG
  - name: rhs
    type: FREG
definition_status:
  allocation: 'external: isa/alloc'

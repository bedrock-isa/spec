mnemonic: FCVT
doc:
  title: Floating-Point Convert Signed
  summary: Performs the floating-point convert signed operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_move_compare
  inputs:
  - src
  output: dst
  operation_by_form:
  - operands:
    - FREG
    - FREG
    operation:
    - dst_v = float2float(src_v);
  - operands:
    - FREG
    - Rn
    operation:
    - local integral_v:8 = trunc(src_v);
    - dst_v = integral_v;
  - operands:
    - Rn
    - FREG
    operation:
    - dst_v = int2float(src_v);
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  streaming_candidate: true
  fp_flags:
    update_when_required:
    - NV
    - OF
    - UF
    - NX
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: FREG
    - name: dst
      type: Rn
  - - name: src
      type: Rn
    - name: dst
      type: FREG
  conversions:
  - F32 <-> F64
  - signed int32/int64 <-> F32/F64
  - unsigned int32/int64 <-> F32/F64
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: FMOV
doc:
  title: Floating-Point Move
  summary: Copies the source operand to the destination operand.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_move_compare
  inputs:
  - src
  output: dst
  operation:
  - dst_v = src_v;
attributes:
  privilege: unprivileged
  streaming_candidate: true
  fp_flags: unchanged
  flags: unchanged
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  - - name: src
      type: FREG
    - name: dst
      type: EA
  size: S_D
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: FCLR
doc:
  title: Floating-Point Clear
  summary: Performs the floating-point clear operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_move_compare
  output: dst
  operation:
  - dst_v = 0;
attributes:
  privilege: unprivileged
  fp_flags: unchanged
forms:
  operands:
  - - name: dst
      type: FREG
  - - name: dst
      type: EA
  result: '+0.0'
definition_status:
  allocation: 'external: isa/alloc'

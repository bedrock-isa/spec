mnemonic: FTRUNC
doc:
  title: Floating-Point Truncate
  summary: Performs the floating-point truncate operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs:
  - src
  output: dst
  operation:
  - local integral_v:8 = trunc(src_v);
  - dst_v = int2float(integral_v);
attributes:
  privilege: unprivileged
  fp_flags:
    update_when_required:
    - NV
    - NX
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  - - name: src
      type: FREG
    - name: dst
      type: EA
  size: S_D
  result: floating integral value
definition_status:
  allocation: 'external: isa/alloc'

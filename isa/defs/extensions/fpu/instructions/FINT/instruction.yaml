mnemonic: FINT
doc:
  title: Floating-Point Integral Value
  summary: Performs the floating-point integral value operation.
  instruction_family: fpu
  instruction_class: fpu
  description: Rounds the selected floating-point source to an integral floating-point value using the active FSTATUS rounding mode.
behavior:
  group: fpu_arithmetic
  inputs:
  - src
  output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update_when_required:
    - NV
    - NX
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  - - name: src
      type: FREG
    - name: dst
      type: EA
  size: S_D
  result: floating integral value
definition_status:
  allocation: 'external: isa/alloc'

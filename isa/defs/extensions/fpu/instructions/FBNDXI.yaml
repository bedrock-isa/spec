mnemonic: FBNDXI
doc:
  title: Floating-Point Bounds Check Exclusive-Inclusive
  summary: Checks floating-point value membership in the exclusive-inclusive interval (lo, hi].
  description: FBNDXI treats the low bound as exclusive and the high bound as inclusive. It sets V when
    value is unordered or outside (lo, hi]; Z, N, and C are unchanged.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs:
  - hi
  - lo
  - value
  output: none
  operation:
  - ZF = 0;
  - NF = 0;
  - CF = 0;
  - VF = 0;
  - if (nan(value_v) || nan(lo_v) || nan(hi_v)) goto <fbndxi_bad>;
  - if (value_v <= lo_v) goto <fbndxi_bad>;
  - if (value_v > hi_v) goto <fbndxi_bad>;
  - goto <fbndxi_done>;
  - <fbndxi_bad>
  - VF = 1;
  - <fbndxi_done>
  repeat_flags: fpu_interval_v_flag
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update_when_required:
    - NV
  flags:
    V: set when the value is out of bounds or unordered
    ZNC: unchanged
forms:
  operands:
  - - name: lo
      type: FREG
    - name: value
      type: FREG
    - name: hi
      type: FREG
  - - name: lo
      type: FREG
    - name: value
      type: EA
    - name: hi
      type: FREG
  - - name: lo
      type: EA
    - name: value
      type: FREG
    - name: hi
      type: EA
  size: S_D
definition_status:
  allocation: 'external: isa/alloc'

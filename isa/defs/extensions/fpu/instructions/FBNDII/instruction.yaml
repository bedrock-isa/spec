mnemonic: FBNDII
title: Floating-Point Bounds Check Inclusive-Inclusive
summary: Checks floating-point value membership in the inclusive-inclusive interval [lo, hi].
description: FBNDII treats both bounds as inclusive. It sets V when value is unordered or outside [lo, hi]; Z, N, and C are unchanged.
attributes:
  class: fpu
  family: fpu
  privilege: unprivileged
  repeat:
  - REP
  - REPG
flag_effects:
  FLAGS:
    V: "set when the value is out of bounds or unordered"
  FFLAGS:
    NV: "may accrue"

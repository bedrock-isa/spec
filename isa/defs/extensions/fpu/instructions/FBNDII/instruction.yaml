mnemonic: FBNDII
doc:
  title: Floating-Point Bounds Check Inclusive-Inclusive
  summary: Checks floating-point value membership in the inclusive-inclusive interval [lo, hi].
  description: FBNDII treats both bounds as inclusive. It sets V when value is unordered or outside [lo, hi]; Z, N, and C are unchanged.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs:
  - hi
  - lo
  - value
  output: none
  repeat_flags: fpu_interval_v_flag
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update_when_required:
    - NV
  flags:
    V: set when the value is out of bounds or unordered
    ZNC: unchanged
forms:
  operands:
  - - name: lo
      type: FREG
    - name: value
      type: FREG
    - name: hi
      type: FREG
  - - name: lo
      type: FREG
    - name: value
      type: EA
    - name: hi
      type: FREG
  - - name: lo
      type: EA
    - name: value
      type: FREG
    - name: hi
      type: EA
  size: S_D
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: FNMSUB
doc:
  title: Floating-Point Fused Negative Multiply Subtract
  summary: Performs the floating-point fused negative multiply subtract operation.
  instruction_family: fpu
  instruction_class: fpu
  description: Computes the negated selected-format fused multiply-subtract with one final rounding and writes the result.
behavior:
  group: fpu_arithmetic
  inputs:
  - lhs
  - rhs
  input_output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  streaming_candidate: true
  fp_flags:
    update:
    - NV
    - OF
    - UF
    - NX
forms:
  operands:
  - - name: lhs
      type: Fn
    - name: rhs
      type: Fn
    - name: dst
      type: Fn
  - - name: lhs
      type: EA
    - name: rhs
      type: Fn
    - name: dst
      type: Fn
  - - name: lhs
      type: Fn
    - name: rhs
      type: EA
    - name: dst
      type: Fn
  size: SD
  rounding: single_round
  memory_operands: at_most_one

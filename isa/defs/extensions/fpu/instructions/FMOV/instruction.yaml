mnemonic: FMOV
doc:
  title: Floating-Point Move
  summary: Copies the source operand to the destination operand.
  instruction_family: fpu
  instruction_class: fpu
  description: Copies the selected-format floating-point source value to the destination.
behavior:
  group: fpu_move_compare
  inputs:
  - src
  output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  streaming_candidate: true
  fp_flags: unchanged
  flags: unchanged
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  - - name: src
      type: FREG
    - name: dst
      type: EA
  size: S_D
definition_status:
  allocation: 'external: isa/alloc'

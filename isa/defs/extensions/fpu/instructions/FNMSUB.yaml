mnemonic: FNMSUB
doc:
  title: Floating-Point Fused Negative Multiply Subtract
  summary: Performs the floating-point fused negative multiply subtract operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs:
  - lhs
  - rhs
  input_output: dst
  operation:
  - dst_v = dst_v f- (lhs_v f* rhs_v);
  - dst_v = f- dst_v;
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  streaming_candidate: true
  fp_flags:
    update:
    - NV
    - OF
    - UF
    - NX
forms:
  operands:
  - - name: lhs
      type: FREG
    - name: rhs
      type: FREG
    - name: dst
      type: FREG
  - - name: lhs
      type: EA
    - name: rhs
      type: FREG
    - name: dst
      type: FREG
  - - name: lhs
      type: FREG
    - name: rhs
      type: EA
    - name: dst
      type: FREG
  size: S_D
  rounding: single_round
  memory_operands: at_most_one
definition_status:
  allocation: 'external: isa/alloc'

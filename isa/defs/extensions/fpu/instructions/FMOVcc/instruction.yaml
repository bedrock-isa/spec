mnemonic: FMOVcc
doc:
  title: Floating-Point Conditional Move
  summary: Performs the floating-point conditional move operation.
  instruction_family: fpu
  instruction_class: fpu
  description: Copies the selected-format floating-point source value to the destination only when the encoded integer condition is true.

mnemonic: FMUL
doc:
  title: Floating-Point Multiply
  summary: Performs the floating-point multiply operation.
  instruction_family: fpu
  instruction_class: fpu
  description: Multiplies the selected-format floating-point source and destination values and writes the rounded result.
behavior:
  group: fpu_arithmetic
  inputs:
  - src
  input_output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  streaming_candidate: true
  fp_flags:
    update:
    - NV
    - OF
    - UF
    - NX
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  size: S_D
  result: Fdst
  memory_destination_arithmetic: disallowed
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: FPUSHM
doc:
  title: Floating-Point Push Multiple
  summary: Push selected F0-F15 registers according to bitmap order.
  description: Push selected F0-F15 registers according to bitmap order. Bit n names Fn.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_stack
  inputs:
  - regs
  output: none
  operation:
  - local selected_count_v = population_count(regs_v & 0xffff);
  - validate the complete writable stack range SS:(SP - 8 * selected_count_v) through SS:(SP - 1);
  - for reg_v = 0 to 15 with bit reg_v set in regs_v, decrement SP by 8 and then store F[reg_v] to *:8 SP;
  operation_text: 'For each set bit in the bitmap, FPUSHM pushes the corresponding 64-bit F register value
    onto the stack. F registers are processed in increasing order from F0 through F15. Each selected register
    decrements SP by 8 before storing the register value at the new SP.

    '
attributes:
  privilege: unprivileged
forms:
  operands:
  - name: regs
    type: fbitmap16
  bitmap:
    bits_0_15: F0-F15
  size_per_register: Q
definition_status:
  allocation: 'external: isa/alloc'

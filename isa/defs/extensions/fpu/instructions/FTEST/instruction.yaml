mnemonic: FTEST
doc:
  title: Floating-Point Test
  summary: Performs the floating-point test operation.
  instruction_family: fpu
  instruction_class: fpu
  description: Classifies the selected floating-point value for comparison with zero and updates the integer condition flags without writing a result.
behavior:
  group: fpu_move_compare
  inputs:
  - src
  output: none
  repeat_flags: fpu_compare_flags
attributes:
  privilege: unprivileged
  streaming_candidate: true
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update_when_required:
    - NV
forms:
  operands:
  - - name: src
      type: FREG
  - - name: src
      type: EA
  size: S_D
  updates: FLAGS
  unordered: FLAGS.V = 1
definition_status:
  allocation: 'external: isa/alloc'

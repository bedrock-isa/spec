mnemonic: FCMP
doc:
  title: Floating-Point Compare
  summary: Performs the floating-point compare operation.
  instruction_family: fpu
  instruction_class: fpu
  description: Compares the selected-format floating-point operands and updates the integer condition flags without writing a floating-point result.
behavior:
  group: fpu_move_compare
  inputs:
  - dst
  - src
  output: none
  repeat_flags: fpu_compare_flags
attributes:
  privilege: unprivileged
  streaming_candidate: true
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update_when_required:
    - NV
forms:
  operands:
  - - name: src
      type: Fn
    - name: dst
      type: Fn
  - - name: src
      type: EA
    - name: dst
      type: Fn
  size: SD
  updates: FLAGS
  unordered: FLAGS.V = 1

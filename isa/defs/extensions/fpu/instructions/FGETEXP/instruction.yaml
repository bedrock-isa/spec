mnemonic: FGETEXP
doc:
  title: Floating-Point Get Exponent
  summary: Performs the floating-point get exponent operation.
  instruction_family: fpu
  instruction_class: fpu
  description: Extracts the unbiased exponent classification of the selected floating-point source and writes the specified floating-point result for finite and special values.
may_accrue_fp_flags:
- NV
attributes:
  privilege: unprivileged
  repeat:
  - REP
  - REPG
forms:
- operands:
  - name: src
    type: Fn
    access: read
  - name: dst
    type: Fn
    access: write
  sizes:
  - S
  - D
- operands:
  - name: src
    type: EA
    access: read
  - name: dst
    type: Fn
    access: write
  sizes:
  - S
  - D

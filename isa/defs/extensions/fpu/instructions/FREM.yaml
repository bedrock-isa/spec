mnemonic: FREM
doc:
  title: Floating-Point Remainder
  summary: Performs the floating-point remainder operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs:
  - src
  input_output: dst
  operation:
  - dst_v = fp_rem(dst_v, src_v);
attributes:
  privilege: unprivileged
  fp_flags:
    update_when_required:
    - NV
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  size: S_D
  result: Fdst
  memory_destination_arithmetic: disallowed
definition_status:
  allocation: 'external: isa/alloc'

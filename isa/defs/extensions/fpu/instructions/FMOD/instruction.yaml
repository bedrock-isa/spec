mnemonic: FMOD
doc:
  title: Floating-Point Modulo
  summary: Performs the floating-point modulo operation.
  instruction_family: fpu
  instruction_class: fpu
  description: Computes the IEEE-style floating-point modulus defined by a quotient rounded toward zero and writes the selected-format remainder.
may_accrue_fp_flags:
- NV
attributes:
  privilege: unprivileged
  repeat:
  - REP
  - REPG
forms:
- operands:
  - name: src
    type: Fn
    access: read
  - name: dst
    type: Fn
    access: read_write
  sizes:
  - S
  - D
- operands:
  - name: src
    type: EA
    access: read
  - name: dst
    type: Fn
    access: read_write
  sizes:
  - S
  - D

mnemonic: FGETMAN
doc:
  title: Floating-Point Get Mantissa
  summary: Performs the floating-point get mantissa operation.
  instruction_family: fpu
  instruction_class: fpu
behavior:
  group: fpu_arithmetic
  inputs:
  - src
  output: dst
  operation:
  - tmp_v = src_v;
  - if (size_v != 4) goto <fgetman_double>;
  - result_v = (tmp_v >> 23) & 0xff;
  - borrow_v = tmp_v & 0x7fffff;
  - if (result_v == 0) goto <fgetman_done>;
  - if (result_v == 0xff) goto <fgetman_done>;
  - carry_v = (tmp_v >> 31) << 31;
  - dst_v = carry_v | 0x3f800000;
  - dst_v = dst_v | borrow_v;
  - goto <fgetman_done>;
  - <fgetman_double>
  - result_v = (tmp_v >> 52) & 0x7ff;
  - borrow_v = tmp_v & 0xfffffffffffff;
  - if (result_v == 0) goto <fgetman_done>;
  - if (result_v == 0x7ff) goto <fgetman_done>;
  - carry_v = (tmp_v >> 63) << 63;
  - dst_v = carry_v | 0x3ff0000000000000;
  - dst_v = dst_v | borrow_v;
  - <fgetman_done>
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update_when_required:
    - NV
    - NX
forms:
  operands:
  - - name: src
      type: FREG
    - name: dst
      type: FREG
  - - name: src
      type: EA
    - name: dst
      type: FREG
  size: S_D
definition_status:
  allocation: 'external: isa/alloc'

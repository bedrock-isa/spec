mnemonic: FABS
doc:
  title: Floating-Point Absolute Value
  summary: Performs the floating-point absolute value operation.
  instruction_family: fpu
  instruction_class: fpu
  description: Clears the sign of the selected floating-point source value and writes the resulting magnitude to the destination.
behavior:
  group: fpu_arithmetic
  inputs:
  - src
  output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags: unchanged
forms:
  operands:
  - - name: src
      type: Fn
    - name: dst
      type: Fn
  - - name: src
      type: EA
    - name: dst
      type: Fn
  - - name: src
      type: Fn
    - name: dst
      type: EA
  size: SD

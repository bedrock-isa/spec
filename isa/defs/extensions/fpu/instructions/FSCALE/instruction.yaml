mnemonic: FSCALE
doc:
  title: Floating-Point Scale
  summary: Performs the floating-point scale operation.
  instruction_family: fpu
  instruction_class: fpu
  description: Scales the selected floating-point destination by an integral power of two derived from the source and writes the rounded result.
behavior:
  group: fpu_arithmetic
  inputs:
  - src
  input_output: dst
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update:
    - NV
    - OF
    - UF
    - NX
forms:
  operands:
  - - name: src
      type: Fn
    - name: dst
      type: Fn
  - - name: src
      type: EA
    - name: dst
      type: Fn
  size: SD

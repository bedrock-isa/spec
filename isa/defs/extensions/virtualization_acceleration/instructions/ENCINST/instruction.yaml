mnemonic: ENCINST
doc:
  title: Encode Instruction
  summary: Writes one canonical instruction encoding to a destination effective address.
  description: ENCINST is an optional virtualization-acceleration instruction for software encoders, runtime code generators, hypervisors, and binary translation systems. Its only explicit operand is the destination effective address. The instruction descriptor is supplied through implicit Rn registers. ENCINST validates the descriptor, selects the canonical Bedrock encoding, and writes the resulting instruction bytes to ordinary memory at the destination EA. Before execution, R0 is split into a high 32-bit form selector and a low 32-bit encode control word. R0 receives the number of bytes written on success or an implementation-defined negative encode-status value on descriptor failure. Memory permissions, segmentation, paging, and cache synchronization use the ordinary store path and SYNCCACHE rules.
  instruction_family: virtualization_acceleration
  instruction_class: system
behavior:
  group: virtualization_acceleration
  inputs:
  - dst
  output: none
attributes:
  cpuid_feature: OPTIONAL_EXTENSION_FEATURES.VIRTACCEL
  memory: encinst_destination_memory_operand
  privilege: user allowed when ENCINST is present
  flags: unchanged
forms:
  require_memory_operand: true
  operands:
  - name: dst
    type: EA
  compact: false
  extension_family: virtualization_acceleration
  implicit_inputs:
  - R0
  - R1
  - R2
  - R3
  implicit_outputs:
  - R0
  dst_ea_set: addressable_memory_only
definition_status:
  allocation: 'external: isa/alloc'

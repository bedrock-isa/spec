mnemonic: FLOG10A
doc:
  title: Approximate Floating-Point Log Base 10
  summary: Performs the bounded approximate floating-point log base 10 operation.
  instruction_family: fpu_transcendental_approx
  instruction_class: fpu
behavior:
  group: fpu_transcendental_approx
  inputs:
  - src
  output: dst
  operation:
  - if CPUID FPTRANSA_ACCURACY contract 0x0043 is not PRESENT, raise ILLEGAL_INSTRUCTION before reading operands or floating-point state;
  - local pending_exceptions_v = {};
  - apply FSTATUS.DAZ to a subnormal src_v, preserving its sign;
  - if src_v is a signaling NaN, add NV to pending_exceptions_v;
  - if src_v is NaN, set result_v to its quiet NaN result and goto <flog10a_finalize>;
  - if src_v is zero, add DZ to pending_exceptions_v and set result_v = negative infinity;
  - if src_v < 0, add NV to pending_exceptions_v, set result_v to the architectural default quiet NaN, and goto <flog10a_finalize>;
  - if src_v is positive infinity, set result_v = positive infinity;
  - if src_v == 1, set result_v = positive zero;
  - if src_v is finite, positive, and not equal to 1, set exact_v = log10(src_v) as the exact real reference value;
  - if src_v is finite, positive, and not equal to 1, set result_v = fptransa_approximate(0x0043, exact_v, selected S or D format) and add OF or UF to
    pending_exceptions_v as classified by the common FPTRANSA model;
  - if FSTATUS.FTZ is set and result_v is subnormal, replace it with signed zero and add UF to pending_exceptions_v;
  - <flog10a_finalize>
  - apply FSTATUS.DN to a NaN result and accrue pending_exceptions_v into FFLAGS without changing NX;
  - if pending_exceptions_v intersects enabled FSTATUS traps, raise FLOATING_POINT_FAULT without writing dst_v; otherwise write result_v to dst_v;
  approximation:
    contract_id: '0x0043'
    reference_function: log10(x)
    domain: positive finite values and positive infinity after DAZ; signed zero is the DZ boundary
    max_ulp:
      S: 4
      D: 4
    exact_anchors:
    - log10(+1) = +0
    - log10(signed 0) = -infinity
    - log10(+infinity) = +infinity
    properties:
    - strictly increasing on the positive domain
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update:
    - NV
    - DZ
    - UF
forms:
  operands:
  - name: src
    type: FREG
  - name: dst
    type: FREG
  size: S_D
  extension_family: fpu_transcendental_approx
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: FSINCOSA
doc:
  title: Approximate Floating-Point Sine And Cosine
  summary: Performs the bounded approximate floating-point sine and cosine operation.
  instruction_family: fpu_transcendental_approx
  instruction_class: fpu
behavior:
  group: fpu_transcendental_approx
  inputs:
  - src
  output:
  - sin_dst
  - cos_dst
  operation:
  - if CPUID FPTRANSA_ACCURACY contract 0x0003 is not PRESENT, raise ILLEGAL_INSTRUCTION before reading operands or floating-point state;
  - if sin_dst and cos_dst name the same F register, raise ILLEGAL_INSTRUCTION before reading operands or floating-point state;
  - local pending_exceptions_v = {};
  - apply FSTATUS.DAZ to a subnormal src_v, preserving its sign;
  - if src_v is a signaling NaN, add NV to pending_exceptions_v;
  - if src_v is NaN, set sin_result_v and cos_result_v to its quiet NaN result and goto <fsincosa_finalize>;
  - if src_v is infinite or abs(src_v) > pi / 4, add NV to pending_exceptions_v, set sin_result_v and cos_result_v to the architectural default
    quiet NaN, and goto <fsincosa_finalize>;
  - if src_v is zero, set sin_result_v = src_v and cos_result_v = positive one;
  - if src_v is nonzero, set sin_exact_v = sin(src_v) and cos_exact_v = cos(src_v) in radians as exact real reference values;
  - if src_v is nonzero, set sin_result_v = fptransa_approximate(0x0003, sin_exact_v, selected S or D format) and cos_result_v = fptransa_approximate(0x0003,
    cos_exact_v, selected S or D format), adding UF if either exact nonzero result is tiny;
  - if FSTATUS.FTZ is set and sin_result_v is subnormal, replace it with signed zero and add UF to pending_exceptions_v;
  - if FSTATUS.FTZ is set and cos_result_v is subnormal, replace it with positive zero and add UF to pending_exceptions_v;
  - <fsincosa_finalize>
  - apply FSTATUS.DN independently to both NaN results and accrue pending_exceptions_v into FFLAGS without changing NX;
  - if pending_exceptions_v intersects enabled FSTATUS traps, raise FLOATING_POINT_FAULT without writing either destination; otherwise atomically
    write sin_result_v to sin_dst_v and cos_result_v to cos_dst_v;
  approximation:
    contract_id: '0x0003'
    reference_function: paired sin(x) and cos(x) in radians
    domain: finite x with abs(x) <= pi / 4 after DAZ
    max_ulp:
      S: 4
      D: 4
    exact_anchors:
    - sin(+0) = +0 and cos(+0) = +1
    - sin(-0) = -0 and cos(-0) = +1
    properties:
    - the ULP bound applies independently to both results
    - results need not match separate FSINA and FCOSA executions
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update:
    - NV
    - UF
forms:
  operands:
  - name: src
    type: FREG
  - name: sin_dst
    type: FREG
  - name: cos_dst
    type: FREG
  size: S_D
  extension_family: fpu_transcendental_approx
definition_status:
  allocation: 'external: isa/alloc'

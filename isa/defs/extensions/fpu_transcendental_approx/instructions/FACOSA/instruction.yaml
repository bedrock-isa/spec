mnemonic: FACOSA
doc:
  title: Approximate Floating-Point Arc Cosine
  summary: Performs the bounded approximate floating-point arc cosine operation.
  instruction_family: fpu_transcendental_approx
  instruction_class: fpu
  description: Computes the acos(x) in radians reference over finite x with abs(x) <= 1 after DAZ and writes an implementation-bounded S- or D-format approximation under the selected FPTRANSA accuracy contract.
behavior:
  group: fpu_transcendental_approx
  inputs:
  - src
  output: dst
  approximation:
    contract_id: '0x0011'
    reference_function: acos(x) in radians
    domain: finite x with abs(x) <= 1 after DAZ
    max_ulp:
      S: 4
      D: 4
    exact_anchors:
    - acos(+1) = +0
    properties:
    - monotonically decreasing on [-1, 1]
    - result is in [0, pi]
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update:
    - NV
    - UF
forms:
  operands:
  - name: src
    type: FREG
  - name: dst
    type: FREG
  size: S_D
  extension_family: fpu_transcendental_approx
definition_status:
  allocation: 'external: isa/alloc'

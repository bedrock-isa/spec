mnemonic: FLOGNP1A
doc:
  title: Approximate Floating-Point Natural Log Plus One
  summary: Performs the bounded approximate floating-point natural log plus one operation.
  instruction_family: fpu_transcendental_approx
  instruction_class: fpu
  description: Computes the ln(1 + x) without an intermediate rounded addition reference over finite x >= -1 and positive infinity after DAZ; -1 is the DZ boundary and writes an implementation-bounded S- or D-format approximation under the selected FPTRANSA accuracy contract.
behavior:
  group: fpu_transcendental_approx
  inputs:
  - src
  output: dst
  approximation:
    contract_id: '0x0041'
    reference_function: ln(1 + x) without an intermediate rounded addition
    domain: finite x >= -1 and positive infinity after DAZ; -1 is the DZ boundary
    max_ulp:
      S: 4
      D: 4
    exact_anchors:
    - log1p(+0) = +0
    - log1p(-0) = -0
    - log1p(-1) = -infinity
    properties:
    - strictly increasing on (-1, +infinity)
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update:
    - NV
    - DZ
    - UF
forms:
  operands:
  - name: src
    type: FREG
  - name: dst
    type: FREG
  size: S_D
  extension_family: fpu_transcendental_approx
definition_status:
  allocation: 'external: isa/alloc'

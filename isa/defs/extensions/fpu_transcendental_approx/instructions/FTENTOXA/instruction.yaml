mnemonic: FTENTOXA
doc:
  title: Approximate Floating-Point 10 To x
  summary: Performs the bounded approximate floating-point 10 to x operation.
  instruction_family: fpu_transcendental_approx
  instruction_class: fpu
  description: Computes the 10 ** x reference over all finite values and signed infinity after DAZ and writes an implementation-bounded S- or D-format approximation under the selected FPTRANSA accuracy contract.
behavior:
  group: fpu_transcendental_approx
  inputs:
  - src
  output: dst
  approximation:
    contract_id: '0x0034'
    reference_function: 10 ** x
    domain: all finite values and signed infinity after DAZ
    max_ulp:
      S: 4
      D: 4
    exact_anchors:
    - 10 ** signed 0 = +1
    - 10 ** +infinity = +infinity
    - 10 ** -infinity = +0
    properties:
    - strictly increasing for finite inputs
    - result is nonnegative
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update:
    - NV
    - OF
    - UF
forms:
  operands:
  - name: src
    type: FREG
  - name: dst
    type: FREG
  size: S_D
  extension_family: fpu_transcendental_approx
definition_status:
  allocation: 'external: isa/alloc'

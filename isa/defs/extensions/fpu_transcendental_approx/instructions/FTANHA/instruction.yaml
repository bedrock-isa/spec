mnemonic: FTANHA
doc:
  title: Approximate Floating-Point Hyperbolic Tangent
  summary: Performs the bounded approximate floating-point hyperbolic tangent operation.
  instruction_family: fpu_transcendental_approx
  instruction_class: fpu
  description: Computes the tanh(x) reference over all finite values and signed infinity after DAZ and writes an implementation-bounded S- or D-format approximation under the selected FPTRANSA accuracy contract.
behavior:
  group: fpu_transcendental_approx
  inputs:
  - src
  output: dst
  approximation:
    contract_id: '0x0023'
    reference_function: tanh(x)
    domain: all finite values and signed infinity after DAZ
    max_ulp:
      S: 4
      D: 4
    exact_anchors:
    - tanh(+0) = +0
    - tanh(-0) = -0
    - tanh(signed infinity) = signed 1
    properties:
    - odd
    - monotonically increasing
    - result is in [-1, 1]
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update:
    - NV
    - UF
forms:
  operands:
  - name: src
    type: FREG
  - name: dst
    type: FREG
  size: S_D
  extension_family: fpu_transcendental_approx
definition_status:
  allocation: 'external: isa/alloc'

mnemonic: FCOSHA
doc:
  title: Approximate Floating-Point Hyperbolic Cosine
  summary: Performs the bounded approximate floating-point hyperbolic cosine operation.
  instruction_family: fpu_transcendental_approx
  instruction_class: fpu
  description: Computes the cosh(x) reference over all finite values and signed infinity after DAZ and writes an implementation-bounded S- or D-format approximation under the selected FPTRANSA accuracy contract.
behavior:
  group: fpu_transcendental_approx
  inputs:
  - src
  output: dst
  approximation:
    contract_id: '0x0022'
    reference_function: cosh(x)
    domain: all finite values and signed infinity after DAZ
    max_ulp:
      S: 4
      D: 4
    exact_anchors:
    - cosh(+0) = +1
    - cosh(-0) = +1
    - cosh(infinity) = +infinity
    properties:
    - even
    - nonincreasing below zero and nondecreasing above zero
    - result is at least 1
attributes:
  privilege: unprivileged
  repeatable:
    rep: true
    repcc: false
    repg: true
  fp_flags:
    update:
    - NV
    - OF
forms:
  operands:
  - name: src
    type: FREG
  - name: dst
    type: FREG
  size: S_D
  extension_family: fpu_transcendental_approx
definition_status:
  allocation: 'external: isa/alloc'

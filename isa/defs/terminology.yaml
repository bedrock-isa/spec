groups:
- name: Address Values
  terms:
  - term: effective address (EA)
    definition: 'The address value or operand designator produced by an addressing mode before segment
      pre-translation. Memory EA forms produce an address value; register and immediate EA forms name
      non-memory operands.

      '
  - term: pre-segment virtual address
    definition: 'The ABI-visible address value before segment pre-translation. Ordinary pointers, ELF
      symbol values, near CALL targets, and near JMP targets use this address space unless a rule explicitly
      says otherwise.

      '
  - term: linear address
    definition: 'The address produced by segment pre-translation. If paging is enabled, the page-table
      walker consumes the linear address. If paging is disabled, the linear address is used directly by
      the memory system.

      '
  - term: physical address
    definition: 'A byte-addressed memory address derived by page-table translation for ordinary byte-addressed
      memory. When paging is disabled, the linear address is not called a physical address by this specification;
      it is used directly as the memory-system address.

      '
  - term: memory-system address
    definition: 'The address value presented to the memory subsystem after all active architectural translation
      stages. With paging enabled this value is produced from the PTE frame number and page offset. With
      paging disabled, the linear address is used directly as the memory-system address. The memory-system
      address may be interpreted as an ordinary byte address or as an externally acknowledged bus-sized
      access according to the final access attributes.

      '
  - term: address generation
    definition: 'The instruction-local calculation that combines registers, displacement, index, scale,
      and immediate fields to produce an effective-address value. Address generation does not by itself
      read memory.

      '
- name: Segmentation And Paging
  terms:
  - term: segment pre-translation
    definition: 'The stage between effective-address calculation and paging. Disabled segments perform
      no segment-window check and no base addition. Translated-window segments check an offset within
      the segment span and add the segment base. Bounds-only segments check an already-linear address
      without adding the segment base.

      '
  - term: segment register image
    definition: 'The 64-bit architectural value stored in a segment register. It contains the segment
      base page, size exponent, size mantissa, and bounds-only enable bit.

      '
  - term: disabled segment
    definition: 'A segment whose size mantissa is zero. A disabled segment performs no segment-window
      check and passes the effective-address value through as the linear address.

      '
  - term: translated segment
    definition: 'An enabled segment with bounds-only mode clear. The effective-address value is checked
      as an offset within the segment span, then the segment base is added.

      '
  - term: bounds-only segment
    definition: 'An enabled segment with bounds-only mode set. The effective-address value is already
      treated as a linear address; the segment only checks that it lies inside the segment window.

      '
  - term: page-table translation
    definition: 'The optional translation stage controlled by PTCR.PE. It maps a canonical linear address
      to a physical frame and applies PTE permissions, cache policy, and addressing type.

      '
  - term: PFN
    definition: 'Physical frame number. A leaf PTE supplies the PFN used with the page offset to form
      the physical address.

      '
- name: Control Flow And Linkage
  terms:
  - term: near control transfer
    definition: 'A CALL, RET, JMP, or conditional branch that changes only PC within the current code-segment
      context.

      '
  - term: segment-changing control transfer
    definition: 'A control transfer that updates CS and PC as one architectural commit. Long calls and
      long returns belong to this category.

      '
  - term: linkage domain
    definition: 'An ABI-visible region in which ordinary code addresses name near-call entry points and
      function pointers do not carry an explicit CS value.

      '
  - term: veneer
    definition: 'A small runtime-generated or linker-generated near-call entry point that hides a more
      complex transfer sequence from ordinary callers.

      '
- name: Architectural State
  terms:
  - term: general-purpose register
    definition: 'One of the sixteen 64-bit Rn integer registers, R0 through R15. Ordinary integer
      register fields name this unified register class.

      '
  - term: Rn register
    definition: 'A general-purpose integer register encoded by a four-bit Rn field. Rn registers may
      hold integer values, address values, counters, selectors, or temporary data according to the
      instruction form.

      '
  - term: stack pointer register
    definition: 'The SP register. SP is a special architectural register outside the four-bit Rn
      namespace and uses SS as its fixed memory segment for SP-relative addressing.

      '
  - term: segment register operand
    definition: 'A 64-bit segment register exposed through the S operand class. The S operand class names
      the segment registers defined by the SREG selector table; it does not name FLAGS, STATUS, PC, or
      SP.

      '
  - term: state register
    definition: 'A named architectural state register such as FLAGS or STATUS. State registers are accessed
      through their dedicated load/write instructions rather than through the S operand class.

      '
  - term: control register
    definition: 'A privileged architectural register exposed through the CR operand class, such as PTCR,
      ASCR, ICR, SPC, SCS, and SDS.

      '
  - term: prefix
    definition: 'An 8-bit modifier stored in the optional prefix word. Prefix bytes are interpreted from
      low byte to high byte; when two prefixes conflict, the later prefix overrides the earlier one.

      '
- name: Compatibility
  terms:
  - term: reserved
    definition: 'Architecturally held for a future definition. Software must not depend on the current
      value or behavior of a reserved field, encoding, selector, vector, or result bit.

      '
  - term: must be zero
    definition: 'Software must write zero. A nonzero value is invalid unless a later architectural revision
      assigns the field or value.

      '
  - term: read-as-zero
    definition: 'Hardware returns zero for the field on this implementation. Software must still treat
      the field as reserved unless it is explicitly software-defined.

      '
  - term: ignored
    definition: 'Hardware accepts the field but does not use it for the current operation. Ignored fields
      are not automatically available for software-defined state.

      '
  - term: preserved
    definition: 'Software must retain the previous value when rewriting the containing architectural object.

      '
  - term: software-defined
    definition: 'Hardware does not interpret the field and reserves it for software use. Future architectural
      extensions do not consume the field without redefining the containing structure.

      '
  - term: implementation-defined
    definition: 'The implementation chooses the value or behavior and exposes the relevant contract through
      CPUID, fixed platform documentation, or firmware.

      '
  - term: illegal
    definition: 'Use of a disallowed instruction opcode encoding, effective-address form, selector, or
      operation raises the exception named by the defining rule. Prefix bytes use the prefix model''s
      own unassigned value rule.

      '

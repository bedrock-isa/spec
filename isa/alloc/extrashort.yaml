# One-byte instruction allocation namespace.
# The instruction byte is 0ppppppp, where ppppppp is this 7-bit payload.
class: extrashort
payload_bits: 7
entries:
  - id: extrashort.illegal
    bits: "0000000"
    text: "ILLEGAL"
  - id: extrashort.nop
    bits: "0000001"
    text: "NOP"
  - id: extrashort.ret
    bits: "0000010"
    text: "RET"
  - id: extrashort.lret
    bits: "0000011"
    text: "LRET"
  - id: extrashort.iret
    bits: "0000100"
    text: "IRET"
  - id: extrashort.syscall
    bits: "0000101"
    text: "SYSCALL"
  - id: extrashort.sysret
    bits: "0000110"
    text: "SYSRET"
  - id: extrashort.bkpt
    bits: "0000111"
    text: "BKPT"
  - id: extrashort.wait
    bits: "0001000"
    text: "WAIT"
  - id: extrashort.yield
    bits: "0001001"
    text: "YIELD"
  - id: extrashort.rfence
    bits: "0001010"
    text: "RFENCE"
  - id: extrashort.wfence
    bits: "0001011"
    text: "WFENCE"
  - id: extrashort.afence
    bits: "0001100"
    text: "AFENCE"
  - id: extrashort.add_q_8_sp
    bits: "0001110"
    text: "ADD.Q 8, SP"
  - id: extrashort.sub_q_8_sp
    bits: "0001111"
    text: "SUB.Q 8, SP"
  - id: extrashort.pushp_imm3_i
    bits: "0010iii"
    text: "PUSHP imm3(i)"
    fields:
      i: {kind: immediate, width: 3}
  - id: extrashort.popp_imm3_i
    bits: "0011iii"
    text: "POPP imm3(i)"
    fields:
      i: {kind: immediate, width: 3}
  - id: extrashort.push_rn_r
    bits: "010rrrr"
    text: "PUSH Rn(r)"
    fields:
      r: {kind: rn, width: 4}
  - id: extrashort.pop_rn_r
    bits: "011rrrr"
    text: "POP Rn(r)"
    fields:
      r: {kind: rn, width: 4}
  - id: extrashort.mov_q_rn_r_sp
    bits: "100rrrr"
    text: "MOV.Q Rn(r), SP"
    fields:
      r: {kind: rn, width: 4}
  - id: extrashort.mov_q_sp_rn_r
    bits: "101rrrr"
    text: "MOV.Q SP, Rn(r)"
    fields:
      r: {kind: rn, width: 4}
  - id: extrashort.clr_q_rn_r
    bits: "110rrrr"
    text: "CLR.Q Rn(r)"
    fields:
      r: {kind: rn, width: 4}

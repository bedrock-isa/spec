schema_version: 0

performance_counters:
  - id: 1
    name: CYCLE
    increment_event: implementation_cycle_while_enabled
  - id: 2
    name: INSTRET
    increment_event: committed_architectural_instruction
  - id: 3
    name: PTWALK
    increment_event: hardware_page_walk_start_after_tlb_miss

reserved_field_defaults:
  - field_class: architected_register_reserved_bits
    read_rule: zero
    use_rule: must_be_zero
  - field_class: control_register_reserved_bits
    read_rule: zero
    use_rule: must_be_zero
    fault: INVALID_CONTROL_STATE
  - field_class: reserved_selector_values
    read_rule: unavailable
    use_rule: invalid_selector
    fault: INVALID_CONTROL_STATE
  - field_class: consumed_reserved_pte_bits
    read_rule: unavailable
    use_rule: invalid_translation_input
    fault: PAGE_FAULT
  - field_class: reserved_event_code_classes_or_ids
    read_rule: unavailable
    use_rule: base_profile_must_not_generate
  - field_class: reserved_architectural_event_frame_bits
    read_rule: unavailable
    use_rule: must_be_zero
    fault: INVALID_CONTROL_STATE_ON_ERET

cpuid:
  classes:
    - id: 0x00000000
      name: Bedrock base ISA
      summary: base identity, architecture and implementation revisions, vendor name, and processor name
      leaves:
        - id: 0x0000
          name: BASE_IDENTITY
          max_index: 18
          summary: common header, identity, revisions, vendor name, and processor name
    - id: 0x00000001
      name: Optional extensions
      summary: optional floating-point and transcendental groups
      leaves:
        - id: 0x0000
          name: EXTENSION_DIRECTORY
          max_index: 1
          summary: common header and optional architectural-group bits
        - id: 0x0001
          name: FPTRANSA_ACCURACY
          max_index: 0x0044
          summary: common header and sparse per-function accuracy contracts
    - id: 0x00000002
      name: Implementation properties
      summary: cache topology, performance counters, and SAVE/RESTORE area layout
      leaves:
        - id: 0x0000
          name: IMPLEMENTATION_DIRECTORY
          max_index: 0
          summary: common implementation-class header
        - id: 0x0001
          name: CACHE_TOPOLOGY
          max_index: n
          summary: common header, maintenance granule, and cache-sharing descriptors
        - id: 0x0002
          name: PERFORMANCE_COUNTERS
          max_index: 3
          summary: common header and standard RDPMC-counter presence
        - id: 0x0004
          name: SAVE_AREA_LAYOUT
          max_index: n
          summary: common header, SAVE/RESTORE sizes, bitmap, and component descriptors
  cache_topology:
    class: 0x00000002
    leaf: 0x0001
    granule:
      index: 1
      min_bytes: 1
      max_bytes: 4096
      power_of_two: true
    descriptor_first_index: 2
    descriptor_order: [cache_level, cache_type, sharing_level, sharing_id]
    cache_types:
      - {value: 1, name: DATA}
      - {value: 2, name: INSTRUCTION}
      - {value: 3, name: UNIFIED}
    fields:
      - {name: TYPE, bits: 1..0}
      - {name: LEVEL, bits: 5..2}
      - {name: LINE_LOG2, bits: 11..6}
      - {name: SHARING_LEVEL, bits: 15..12}
      - {name: SHARING_LP_COUNT_MINUS1, bits: 31..16}
      - {name: SHARING_ID, bits: 63..32}
  save_area_layout:
    class: 0x00000002
    leaf: 0x0004
    format: 0
    fixed_size_bytes: 0x00c0
    bitmap_words: 1
    descriptor_first_index: 3
    descriptor_stride: 2
    components:
      - id: 1
        name: FP
        bitmap_bit: 0
        offset_bytes: 0x00c0
        max_size_bytes: 0x00c0
        alignment_bytes: 64
        init_policy: 1
        layout:
          - {name: F0_F15, offset: 0x000, size: 0x080}
          - {name: FFLAGS, offset: 0x080, size: 0x008}
          - {name: FSTATUS, offset: 0x088, size: 0x008}

control_registers:
  - {selector: 0x0000, name: PTCR, use: page-table root and translation control}
  - {selector: 0x0001, name: ASCR, use: address-space identifier control}
  - {selector: 0x0002, name: ECR, use: architectural event-delivery control}
  - {selector: 0x0100, name: SPC, use: SYSCALL entry program counter}
  - {selector: 0x0101, name: SCS, use: SYSCALL entry code-segment image}
  - {selector: 0x0102, name: SDS, use: SYSCALL entry data-segment image}
  - {selector: 0x0108, name: URPC, use: user-return program counter}
  - {selector: 0x0109, name: URSP, use: user-return stack pointer}
  - {selector: 0x010A, name: URCS, use: user-return code-segment image}
  - {selector: 0x010B, name: URDS, use: user-return data-segment image}
  - {selector: 0x010C, name: URSS, use: user-return stack-segment image}
  - {selector: 0x010D, name: URCTL, use: "user-return FLAGS, STATUS, and valid state"}
  - {selector: 0x0110, name: EPC, use: common architectural event-entry PC}
  - {selector: 0x0111, name: ECS, use: architectural event-entry code-segment image}
  - {selector: 0x0112, name: EDS, use: architectural event-entry data-segment image}
  - {selector: 0x0200, name: SSS, use: supervisor-call working-stack segment image}
  - {selector: 0x0201, name: SSP, use: supervisor-call working-stack top}
  - {selector: 0x0210, name: ISS, use: maskable-interrupt stack-segment image}
  - {selector: 0x0211, name: ISP, use: maskable-interrupt stack top}
  - {selector: 0x0220, name: FSS, use: fault/exception stack-segment image}
  - {selector: 0x0221, name: FSP, use: fault/exception stack top}
  - {selector: 0x0230, name: DSS, use: double-fault stack-segment image}
  - {selector: 0x0231, name: DSP, use: double-fault stack top}
  - {selector: 0x1000, name: BOOTPC, use: warm-reset target supplied by the platform at cold reset}
  - {selector: 0x1001, name: BOOTCFG, use: opaque platform boot configuration preserved by warm reset}
  - {selector: 0x1100, name: PMC, use: performance-monitor enable}

cache_policies:
  - cp: 0
    name: CACHEABLE_WRITE_BACK
    reads_fetches: may allocate a coherent cache copy
    stores: may retire into a coherent dirty cache copy
    retained_state: clean or dirty coherent cache copies
  - cp: 1
    name: COHERENT_UNCACHEABLE
    reads_fetches: enter coherence without retaining a cache copy
    stores: enter coherence before retirement without retaining a dirty copy
    retained_state: no retained cache copy
  - cp: 2
    name: COHERENT_WRITE_THROUGH
    reads_fetches: may allocate a coherent clean cache copy
    stores: enter coherence before retirement without retaining a dirty copy
    retained_state: clean coherent cache copies only
  - cp: 3
    name: COHERENT_WRITE_COMBINING
    reads_fetches: enter coherence without retaining a cache copy
    stores: may combine adjacent byte writes before entering coherence
    retained_state: pending combined stores, but no retained cache copy

translation_cache:
  identity:
    - {component: leaf-aligned linear mapping range, applies: every entry}
    - {component: LA57 and PABITS_SEL, applies: every entry}
    - {component: ASID, applies: non-global entry while ASCR.AE is one}
  transitions:
    - operation: WRCR PTCR with changed root_page
      non_global: invalidate all current untagged entries when AE is zero; when AE is one software must invalidate the ASID before rebinding it
      global: preserve only mappings whose complete leaf attributes are identical in every context
    - operation: WRCR PTCR with changed LA57 or PABITS_SEL
      non_global: invalidate entries using the old translation geometry
      global: invalidate entries using the old translation geometry
    - operation: WRCR ASCR changing ASID while AE remains one
      non_global: select the new ASID-tagged entries
      global: preserve
    - operation: WRCR ASCR changing AE
      non_global: invalidate the old untagged context or select the new tagged context as applicable
      global: preserve
    - operation: SWPT
      non_global: install PTCR and invalidate the current untagged context
      global: preserve only identical global mappings
    - operation: SWPTA
      non_global: install PTCR and ASCR and select the new ASID-tagged context
      global: preserve only identical global mappings
    - operation: INVPAGE
      non_global: invalidate every mapping containing the addressed linear value for the current ASID, or the current untagged context when AE is zero
      global: invalidate every addressed global mapping containing that linear value
    - operation: INVASID
      non_global: invalidate every entry tagged with the selected ASID
      global: preserve
    - operation: INVTLB
      non_global: invalidate every local entry
      global: invalidate every local entry
  shootdown:
    - PTE store
    - AFENCE
    - local invalidate
    - release shootdown request
    - target acquire and local invalidate
    - target release acknowledgement
    - updater acquire of every acknowledgement
    - AFENCE
    - reclaim or reuse

control_write_rules:
  - registers: [PTCR]
    writable: root_page, PABITS_SEL, LA57, and PE; reserved bits must be zero
    validation: PABITS_SEL is 0 or 1 and the selected root frame fits the selected physical-address width
    commit: apply the translation-cache transition selected by the changed fields
  - registers: [ASCR]
    writable: ASID and AE; reserved bits must be zero
    validation: the complete ASCR image is validated before commit
    commit: apply the translation-cache transition selected by the changed fields
  - registers: [ECR]
    writable: MAX_EDEPTH and V; NMI_P is hardware managed and the supplied value is ignored
    validation: setting V validates EPC, ECS, EDS, and all configured event stack pairs
    commit: replace the complete writable image atomically
  - registers: [SPC, EPC]
    writable: complete 64-bit entry address
    validation: 16-byte aligned, canonical, and executable under the matching code-segment image
    commit: replace the selected register atomically
  - registers: [SCS, SDS, ECS, EDS, SSS, ISS, FSS, DSS]
    writable: complete 64-bit segment image
    validation: apply the architectural segment-image validity rule
    commit: replace the selected register atomically
  - registers: [SSP, ISP, FSP, DSP]
    writable: complete 64-bit configured stack top
    validation: 64-byte aligned
    commit: replace the selected register atomically
  - registers: [URPC, URSP, URCS, URDS, URSS]
    writable: complete 64-bit saved user-return value
    validation: defer complete-bank validation until URCTL.V is set or SYSRET executes
    commit: replace the selected register atomically
  - registers: [URCTL]
    writable: V, STATUS, and FLAGS; reserved bits must be zero
    validation: setting V validates the complete user-return bank and requires saved PM and EA to be zero
    commit: replace URCTL atomically after complete-bank validation
  - registers: [BOOTPC]
    writable: complete 64-bit warm-reset target
    validation: the value is used as the exact PC after warm RESET
    commit: replace BOOTPC atomically
  - registers: [BOOTCFG]
    writable: complete opaque 64-bit platform boot configuration
    validation: no image transformation
    commit: replace BOOTCFG atomically
  - registers: [PMC]
    writable: EN; reserved bits must be zero
    validation: EN is Boolean
    commit: replace PMC atomically

exception_causes:
  PAGE_FAULT:
    - {value: 0, name: NOT_PRESENT, meaning: required PTE is not present}
    - {value: 1, name: PERMISSION, meaning: accumulated permission excludes the access}
    - {value: 2, name: MALFORMED_PTE, meaning: structurally invalid PTE}
    - {value: 3, name: NONCANONICAL, meaning: noncanonical address}
    - {value: 4, name: SEGMENT_BOUNDS, meaning: segment bounds failure}
    - {value: 5, name: ATOMIC_ALIGNMENT, meaning: misaligned byte-addressed atomic operand, address_type: 0}
    - {value: 6, name: ADDRESS_TYPE, meaning: address or memory type rejects the access}
  ILLEGAL_INSTRUCTION:
    - {value: 0, name: INVALID_OPCODE, meaning: opcode is not assigned}
    - {value: 1, name: INVALID_EA_FORM, meaning: effective-address form is not legal for the instruction}
    - {value: 2, name: RESERVED_ENCODING, meaning: assigned instruction uses a reserved field value}
    - {value: 3, name: UNAVAILABLE_EXTENSION, meaning: required extension is unavailable}
    - {value: 4, name: EXPLICIT_ILLEGAL, meaning: architected ILLEGAL instruction}
    - {value: 5, name: INSUFFICIENT_LENGTH, meaning: encoded record is shorter than the selected concrete form requires}
    - {value: 6, name: INVALID_OPERAND_RELATION, meaning: writable operands use a prohibited overlap relation}
  INVALID_CONTROL_STATE:
    - {value: 0, name: INVALID_SELECTOR, meaning: selector names no available resource}
    - {value: 1, name: RESERVED_BITS, meaning: reserved bits are nonzero or changed illegally}
    - {value: 2, name: INVALID_IMAGE, meaning: supplied architectural image is invalid}
    - {value: 3, name: INVALID_TRANSITION, meaning: requested state transition is illegal}

fptransa_accuracy_contracts:
  - {id: 0x0001, mnemonic: FSINA, function: sin, reference_qualifier: radians, domain: finite_abs_le_pi_over_4, max_ulp: {S: 4, D: 4}}
  - {id: 0x0002, mnemonic: FCOSA, function: cos, reference_qualifier: radians, domain: finite_abs_le_pi_over_4, max_ulp: {S: 4, D: 4}}
  - {id: 0x0003, mnemonic: FTANA, function: tan, reference_qualifier: radians, domain: finite_abs_le_pi_over_4, max_ulp: {S: 4, D: 4}}
  - {id: 0x0004, mnemonic: FSINCOSA, function: sincos, reference_qualifier: radians, domain: finite_abs_le_pi_over_4, max_ulp: {S: 4, D: 4}}
  - {id: 0x0011, mnemonic: FASINA, function: asin, reference_qualifier: radians, domain: finite_abs_le_one, max_ulp: {S: 4, D: 4}}
  - {id: 0x0012, mnemonic: FACOSA, function: acos, reference_qualifier: radians, domain: finite_abs_le_one, max_ulp: {S: 4, D: 4}}
  - {id: 0x0013, mnemonic: FATANA, function: atan, reference_qualifier: radians, domain: finite_or_signed_infinity, max_ulp: {S: 4, D: 4}}
  - {id: 0x0021, mnemonic: FSINHA, function: sinh, domain: finite_or_signed_infinity, max_ulp: {S: 4, D: 4}}
  - {id: 0x0022, mnemonic: FCOSHA, function: cosh, domain: finite_or_signed_infinity, max_ulp: {S: 4, D: 4}}
  - {id: 0x0023, mnemonic: FTANHA, function: tanh, domain: finite_or_signed_infinity, max_ulp: {S: 4, D: 4}}
  - {id: 0x0024, mnemonic: FATANHA, function: atanh, domain: finite_abs_le_one, max_ulp: {S: 4, D: 4}}
  - {id: 0x0031, mnemonic: FETOXA, function: exp, domain: finite_or_signed_infinity, max_ulp: {S: 4, D: 4}}
  - {id: 0x0032, mnemonic: FETOXM1A, function: expm1, domain: finite_or_signed_infinity, max_ulp: {S: 4, D: 4}}
  - {id: 0x0033, mnemonic: FTWOTOXA, function: exp2, domain: finite_or_signed_infinity, max_ulp: {S: 4, D: 4}}

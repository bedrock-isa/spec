  - {id: 0x0043, mnemonic: FLOG2A, function: log2, domain: positive_or_positive_infinity_zero_dz, max_ulp: {S: 4, D: 4}}
  - {id: 0x0044, mnemonic: FLOG10A, function: log10, domain: positive_or_positive_infinity_zero_dz, max_ulp: {S: 4, D: 4}}

event_frames:
  types:
    - {code: 0x0, name: BASIC, payload_bytes: 0, allocated_payload_bytes: 0, total_bytes: 64, last_slot: none}
    - {code: 0x1, name: ERROR, payload_bytes: 8, allocated_payload_bytes: 16, total_bytes: 80, last_slot: ERROR_CODE}
    - {code: 0x2, name: PAGE_FAULT, payload_bytes: 24, allocated_payload_bytes: 32, total_bytes: 96, last_slot: FAULT_LINEAR}
    - {code: 0x3, name: AUXILIARY, payload_bytes: 32, allocated_payload_bytes: 32, total_bytes: 96, last_slot: EVENT_AUX}
  assignments:
    - events: [DEBUG_TRACE, BREAKPOINT, PRIVILEGE_FAULT]
      frame_type: BASIC
    - events: [ILLEGAL_INSTRUCTION, DIVIDE_ERROR, INVALID_CONTROL_STATE, FLOATING_POINT_FAULT]
      frame_type: ERROR
    - events: [PAGE_FAULT]
      frame_type: PAGE_FAULT
    - events: [DOUBLE_FAULT, MACHINE_CHECK, BUS_ERROR]
      frame_type: AUXILIARY
    - event_class: interrupt_and_nmi
      frame_type: BASIC

architectural_events:
  - {event_class: EXCEPTION, id: 0x00, name: DEBUG_TRACE, producer: completion of a TF-selected trace unit, kind: trap, saved_pc: next trace unit, committed_state: completed trace unit, frame: BASIC, payload: none, priority: 5}
  - {event_class: EXCEPTION, id: 0x02, name: BREAKPOINT, producer: BKPT, kind: explicit trap, saved_pc: following instruction, committed_state: BKPT completed, frame: BASIC, payload: none, priority: 4}
  - {event_class: EXCEPTION, id: 0x03, name: ILLEGAL_INSTRUCTION, producer: decode or instruction-validity check, kind: fault, saved_pc: faulting instruction, committed_state: no effects of the faulting instruction, frame: ERROR, payload: error code, priority: 3}
  - {event_class: EXCEPTION, id: 0x08, name: PRIVILEGE_FAULT, producer: privilege check, kind: fault, saved_pc: faulting instruction, committed_state: no effects of the faulting instruction, frame: BASIC, payload: none, priority: 3}
  - {event_class: EXCEPTION, id: 0x09, name: PAGE_FAULT, producer: "segment, translation, access, or atomic-alignment check", kind: fault, saved_pc: faulting instruction, committed_state: no effects of the faulting instruction, frame: PAGE_FAULT, payload: "error code, fault EA, and linear address", priority: 3}
  - {event_class: EXCEPTION, id: 0x0A, name: DIVIDE_ERROR, producer: integer divide operation, kind: fault, saved_pc: faulting instruction, committed_state: no effects of the faulting instruction, frame: ERROR, payload: error code, priority: 3}
  - {event_class: EXCEPTION, id: 0x0D, name: INVALID_CONTROL_STATE, producer: control-state validation, kind: fault, saved_pc: faulting instruction, committed_state: no effects of the faulting instruction, frame: ERROR, payload: error code, priority: 3}
  - {event_class: EXCEPTION, id: 0x0E, name: FLOATING_POINT_FAULT, producer: enabled floating-point exception, kind: fault, saved_pc: faulting instruction, committed_state: no destination or accrued-flag effects of the faulting instruction, frame: ERROR, payload: error code, priority: 3}
  - {event_class: EXCEPTION, id: 0x18, name: DOUBLE_FAULT, producer: architectural event-delivery failure, kind: delivery failure, saved_pc: interrupted event boundary, committed_state: no partial first delivery state, frame: AUXILIARY, payload: delivery-failure auxiliary state, priority: 1}
  - {event_class: EXCEPTION, id: 0x19, name: MACHINE_CHECK, producer: processor or memory-system machine-check source, kind: machine check, saved_pc: selected by PRECISE and corrected status, committed_state: selected by PRECISE and RETRY_SAFE, frame: AUXILIARY, payload: machine-check auxiliary state, priority: 2}
  - {event_class: EXCEPTION, id: 0x1A, name: BUS_ERROR, producer: synchronous acknowledged bus failure, kind: fault, saved_pc: faulting instruction, committed_state: no CPU state effects of the faulting instruction, frame: AUXILIARY, payload: bus-error auxiliary state, priority: 3}
  - {event_class: NMI, id: source, name: NMI, producer: admitted non-maskable interrupt source, kind: asynchronous, saved_pc: next instruction or repeat continuation, committed_state: all earlier committed state, frame: BASIC, payload: none, priority: 6}
  - {event_class: INTERRUPT, id: platform, name: INTERRUPT, producer: admitted maskable interrupt source, kind: asynchronous, saved_pc: next instruction or repeat continuation, committed_state: all earlier committed state, frame: BASIC, payload: none, priority: 7}

immediate_operand_interpretation:
  - operand_type: PAIRn
    value_kind: identifier
    range_from: declared_values
    extension: none
    applies_when: PUSHP/POPP canonical register-pair selector
  - operand_type: pt_level
    value_kind: enumeration
    range_from: declared_values
    extension: none
    applies_when: PTQUERY page-table level selector
  - operand_type: flags_bitmap
    value_kind: bitmap
    range_from: field_width
    extension: none
    applies_when: SETF/CLRF integer FLAGS masks
  - operand_type: imm6
    value_kind: unsigned
    range_from: field_width
    extension: zero-extend
    applies_when: integer forms with an explicit B/W/L/Q operation size
  - operand_type: imm7
    value_kind: unsigned
    range_from: field_width
    extension: zero-extend
    applies_when: EXTRACT register-pair forms

reset_contract:
  scope: executing logical processor
  privilege: supervisor
  serialization: complete prior memory effects and pending write-combining stores before reset state commits
  restart: running at BOOTPC after instruction-fetch synchronization
  other_logical_processors: unchanged

reset_state:
  - {state: [R0, R1, R2, R3, R4, R5, R6, R7, R8, R9, R10, R11, R12, R13, R14, R15, SP], value: zero}
  - {state: [FLAGS], value: zero}
  - {state: [STATUS], value: supervisor_only}
  - {state: [CS, DS, SS, GS0, GS1, GS2, GS3, GS4, GS5], value: zero}
  - {state: [PC], value: bootpc}
  - {state: [PTCR, ASCR, ECR], value: zero}
  - {state: [EPC, ECS, EDS, SPC, SCS, SDS], value: zero}
  - {state: [URPC, URSP, URCS, URDS, URSS, URCTL], value: zero}
  - {state: [SSS, SSP, ISS, ISP, FSS, FSP, DSS, DSP], value: zero}
  - {state: [PMC, CYCLE, INSTRET, PTWALK], value: zero}
  - {state: [F0_F15, FSTATUS, FFLAGS, extension_state], value: zero}
  - {state: [hidden_repeat_state, hidden_load_reservation], value: invalid}
  - {state: [hidden_current_edepth], value: zero}
  - {state: [hidden_current_event_stack_level], value: invalid}
  - {state: [ECR.NMI_P], value: zero}
  - {state: [local_translation_cache, local_page_walk_cache, local_prefetch_state], value: invalid}
  - {state: [coherent_data_and_instruction_cache_contents], value: retained_coherent}
  - {state: [execution_state], value: running_at_bootpc}
  - {state: [BOOTPC, BOOTCFG], value: platform_supplied_cold_preserved_warm}

atomic_memory_orders:
  - {selector: RELAXED, code: 0, effect: atomicity_only}
  - {selector: ACQUIRE, code: 1, effect: acquire}
  - {selector: RELEASE, code: 2, effect: release}
  - {selector: ACQREL, code: 3, effect: acquire_release}
  - {selector: SEQCST, code: 4, effect: sequentially_consistent}

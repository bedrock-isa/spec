schema_version: 0
families:
- id: assembler
  source: isa/reference/assembler_golden_vectors.yaml
  required_cases:
  - extrashort_add_sp
  - short_mov_register
  - medium_mov_indirect
  - medium_mov_register_displacement
  - medium_mov_pc_displacement
  - medium_mov_absolute
  - medium_mov_immediate
  - medium_mov_ext0
  - long_mov_memory_memory
  - extralong_fsincosa
  - long_jne_condition_size
  - alias_clc
  - len_padding
- id: atomic_order
  source: isa/memory_model/atomic_order_litmus.yaml
  required_cases:
  - failed_cmpxchg_acquire
  - failed_cmpxchg_release_event
  - afence_store_buffering
  - transitive_release_acquire
  - seqcst_iriw
  - failed_cmpxchg_seqcst_classification
- id: paging
  source: isa/reference/address_translation_test_vectors.yaml
  required_cases:
  - paging_disabled_full_width
  - cross_page_qword_second_not_present
  - cross_page_first_fault_has_priority
  - cross_page_qword_second_permission
  - cross_page_second_address_type
  - cross_page_second_bus_error
  - cross_page_instruction_fetch_permission
- id: stack_event
  source: isa/reference/stack_event_test_vectors.yaml
  required_cases:
  - push_or_call
  - pop_or_ret
  - pair_push
  - pair_pop
  - far_call
  - far_return
  - zero_delay
  - finite_delay
  - pending_admissible_event
  - later_admissible_event
  - logical_processor_scope
- id: memory_order
  source: isa/memory_model/validation.yaml
  required_cases:
  - MP
  - SB
  - LB
  - IRIW
  - RWC
  - release-sequence
  - sc-fence
  - failed-compare-exchange
- id: cache_sync
  source: isa/memory_model/cache_sync_litmus.yaml
  required_cases:
  - last_byte
  - next_block
  - zero_length
  - two_blocks
- id: fp
  source: isa/reference/fp_common_test_vectors.yaml
  required_cases:
  - s_snan
  - d_snan
  - s_qnan_order
  - d_qnan_order
  - s_default_nan
  - d_default_nan
  - s_min_signed_zero
  - d_min_signed_zero
  - s_max_signed_zero
  - d_max_signed_zero
  - s_daz
  - d_daz
  - s_exact
  - d_exact
  - s_ftz
  - d_ftz
  - s_rn
  - s_rz
  - s_rp
  - s_rm
  - d_rn
  - d_rz
  - d_rp
  - d_rm
  - greater
  - equal
  - less
  - unordered_qnan
  - unordered_snan
  - s_negative_overflow
  - d_negative_overflow
  - s_negative_infinity
  - d_negative_infinity
  - s_positive_overflow
  - d_positive_overflow
  - s_positive_infinity
  - d_positive_infinity
  - s_nan
  - d_nan
  - s_valid_inexact
  - d_valid_inexact
  - s_negative
  - d_negative
  - s_nv_enabled
  - d_dz_enabled
  - s_nx_disabled
  - d_nx_disabled
implementation_defined:
- id: cpuid_higher_classes
  definition: CPUID Feature Discovery, Base Identity and Leaf Directory
  publication: CPUID class and leaf directories plus implementation documentation for the class payload
- id: performance_counter_ids
  definition: CPUID Performance-Counter Discovery and RDPMC
  publication: CPUID PERFORMANCE_COUNTERS presence results plus implementation documentation naming each counter event
- id: event_aux_syndrome
  definition: Machine-check EVENT_AUX payload
  publication: platform documentation or firmware interface documentation for the event source
- id: fptransa_approximation
  definition: FPTRANSA ULP Error Model and CPUID accuracy contracts
  publication: CPUID accuracy-contract discovery plus implementation documentation for the deterministic approximation

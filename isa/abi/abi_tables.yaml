schema_version: 0

c_abi:
  return_registers:
    - result_class: general_scalar
      convention:
        kind: single_register
        register: R0
    - result_class: floating_point_scalar
      convention:
        kind: single_register
        register: F0
    - result_class: long_double_scalar
      convention:
        kind: single_register
        register: F0
    - result_class: complex_scalar
      convention:
        kind: complex_registers
        real: F0
        imaginary: F1
    - result_class: int128_scalar
      convention:
        kind: register_pair
        high: R1
        low: R0
    - result_class: far_pointer
      convention:
        kind: far_pointer_registers
        address: R0
        segment_image: GS1
    - result_class: small_aggregate
      convention:
        kind: register_pair
        high: R1
        low: R0
    - result_class: large_aggregate
      convention:
        kind: sret_pointer
        argument: R0
        result: R0

  call_relocations:
    - call_form: direct_c_call
      relocation: R_BEDROCK_CALL32S
    - call_form: external_plt_call
      relocation: R_BEDROCK_PLT32S
    - call_form: far_symbol_address_word
      relocation: R_BEDROCK_FAR_ADDR64
    - call_form: far_symbol_segment_word
      relocation: R_BEDROCK_FAR_SEGMENT64
    - call_form: external_far_call_slot
      relocation: R_BEDROCK_FAR_JUMP_SLOT

  ordinary_access_guarantees:
    - access:
        alignment: aligned
        widths_bytes: [1, 2, 4, 8]
        operations: [load, store]
      guarantee: tear_free
    - access:
        minimum_width_bytes: 16
      guarantee: not_atomic
    - access:
        alignment: unaligned
      guarantee: no_tear_free_guarantee

  native_atomic_primitives:
    - c_operations: [load, store]
      lowering:
        kind: aligned_access_with_ordering
    - c_operations: [compare_exchange]
      lowering:
        kind: width_matched_instruction
        instruction: CMPXCHG
    - c_operations: [exchange]
      lowering:
        kind: instruction_loop
        instruction: CMPXCHG

elf_abi:
  relocations:
    - {id: 0, name: R_BEDROCK_NONE, size: "0", calculation: none}
    - {id: 1, name: R_BEDROCK_ABS8, size: 8-bit unsigned, calculation: S + A}
    - {id: 2, name: R_BEDROCK_ABS16, size: 16-bit unsigned, calculation: S + A}
    - {id: 3, name: R_BEDROCK_ABS32S, size: 32-bit signed, calculation: S + A}
    - {id: 4, name: R_BEDROCK_ABS64, size: 64-bit unsigned, calculation: S + A}
    - {id: 5, name: R_BEDROCK_IMM8S, size: 8-bit signed, calculation: S + A}
    - {id: 6, name: R_BEDROCK_IMM16S, size: 16-bit signed, calculation: S + A}
    - {id: 7, name: R_BEDROCK_IMM32S, size: 32-bit signed, calculation: S + A}
    - {id: 8, name: R_BEDROCK_IMM64, size: 64-bit unsigned, calculation: S + A}
    - {id: 9, name: R_BEDROCK_DISP8S, size: 8-bit signed, calculation: S + A}
    - {id: 10, name: R_BEDROCK_DISP16S, size: 16-bit signed, calculation: S + A}
    - {id: 11, name: R_BEDROCK_DISP32S, size: 32-bit signed, calculation: S + A}
    - {id: 12, name: R_BEDROCK_DISP64, size: 64-bit unsigned, calculation: S + A}
    - {id: 13, name: R_BEDROCK_PCREL8S, size: 8-bit signed, calculation: S + A - P}
    - {id: 14, name: R_BEDROCK_PCREL16S, size: 16-bit signed, calculation: S + A - P}
    - {id: 15, name: R_BEDROCK_PCREL32S, size: 32-bit signed, calculation: S + A - P}
    - {id: 16, name: R_BEDROCK_PCREL64, size: 64-bit signed, calculation: S + A - P}
    - {id: 17, name: R_BEDROCK_BRDISP8S, size: 8-bit signed, calculation: S + A - N}
    - {id: 18, name: R_BEDROCK_BRDISP16S, size: 16-bit signed, calculation: S + A - N}
    - {id: 19, name: R_BEDROCK_BRDISP32S, size: 32-bit signed, calculation: S + A - N}
    - {id: 20, name: R_BEDROCK_CALL16S, size: 16-bit signed, calculation: S + A - N}
    - {id: 21, name: R_BEDROCK_CALL32S, size: 32-bit signed, calculation: S + A - N}
    - {id: 22, name: R_BEDROCK_SECTION_REL32, size: 32-bit unsigned, calculation: S + A - SB}
    - {id: 23, name: R_BEDROCK_SECTION_REL64, size: 64-bit unsigned, calculation: S + A - SB}
    - {id: 24, name: R_BEDROCK_GOT64, size: 64-bit unsigned, calculation: GOT(S) + A}
    - {id: 25, name: R_BEDROCK_GOTPCREL32S, size: 32-bit signed, calculation: GOT(S) + A - P}
    - {id: 26, name: R_BEDROCK_GOTPCREL64, size: 64-bit signed, calculation: GOT(S) + A - P}
    - {id: 27, name: R_BEDROCK_GOTOFF32S, size: 32-bit signed, calculation: S + A - GB}
    - {id: 28, name: R_BEDROCK_GOTOFF64, size: 64-bit signed, calculation: S + A - GB}
    - {id: 29, name: R_BEDROCK_GOT_BASE_PCREL32S, size: 32-bit signed, calculation: GB + A - P}
    - {id: 30, name: R_BEDROCK_GOT_BASE_PCREL64, size: 64-bit signed, calculation: GB + A - P}
    - {id: 31, name: R_BEDROCK_PLT16S, size: 16-bit signed, calculation: PLT(S) + A - N}
    - {id: 32, name: R_BEDROCK_PLT32S, size: 32-bit signed, calculation: PLT(S) + A - N}
    - {id: 33, name: R_BEDROCK_PLT64, size: 64-bit unsigned, calculation: PLT(S) + A}
    - {id: 34, name: R_BEDROCK_RELATIVE, size: 64-bit unsigned, calculation: B + A}
    - {id: 35, name: R_BEDROCK_GLOB_DAT, size: 64-bit unsigned, calculation: S + A}
    - {id: 36, name: R_BEDROCK_JUMP_SLOT, size: 64-bit unsigned, calculation: S + A}
    - {id: 37, name: R_BEDROCK_COPY, size: variable-size, calculation: copy symbol size bytes}
    - {id: 38, name: R_BEDROCK_IRELATIVE, size: 64-bit unsigned, calculation: Resolver(B + A)}
    - {id: 39, name: R_BEDROCK_TLS_OFFSET32S, size: 32-bit signed, calculation: TLS(S) + A}
    - {id: 40, name: R_BEDROCK_TLS_OFFSET64, size: 64-bit signed, calculation: TLS(S) + A}
    - {id: 41, name: R_BEDROCK_TLSDESC_GOTPCREL32S, size: 32-bit signed, calculation: TLSDESC(S) + A - P}
    - {id: 42, name: R_BEDROCK_TLSDESC_GOTPCREL64, size: 64-bit signed, calculation: TLSDESC(S) + A - P}
    - {id: 43, name: R_BEDROCK_TLSDESC_CALL, size: "0", calculation: none}
    - {id: 44, name: R_BEDROCK_TLSDESC, size: 128-bit unsigned, calculation: tlsdesc_init}
    - {id: 45, name: R_BEDROCK_FAR_ADDR64, size: 64-bit unsigned, calculation: FARADDR(S) + A}
    - {id: 46, name: R_BEDROCK_FAR_SEGMENT64, size: 64-bit unsigned, calculation: SEG(S)}
    - {id: 47, name: R_BEDROCK_FAR_DOMAIN64, size: 64-bit unsigned, calculation: SEGDOM(A)}
    - {id: 48, name: R_BEDROCK_FAR_GLOB_DAT, size: 128-bit unsigned, calculation: "{FARADDR(S) + A, SEG(S)}"}
    - {id: 49, name: R_BEDROCK_FAR_JUMP_SLOT, size: 128-bit unsigned, calculation: FAR(S)}
    - {id: 50, name: R_BEDROCK_FAR_IRELATIVE, size: 128-bit unsigned, calculation: FarResolver(B + A)}

  bedrock_specific_sections:
    - name: .got.far
      attributes: [alloc, read, write]
      contents: far_pointer_entries
    - name: .note.bedrock
      classification: note
    - name: .bedrock.segdomains
      classification: linker_metadata

  tls_relocation_families:
    - model: local_exec
      relocations:
        - R_BEDROCK_TLS_OFFSET32S
        - R_BEDROCK_TLS_OFFSET64
    - model: tlsdesc
      relocations:
        - R_BEDROCK_TLSDESC_GOTPCREL32S
        - R_BEDROCK_TLSDESC_GOTPCREL64
        - R_BEDROCK_TLSDESC_CALL
        - R_BEDROCK_TLSDESC

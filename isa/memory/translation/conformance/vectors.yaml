schema_version: 0

vectors:
  - id: paging_disabled_full_width
    control: {PE: 0}
    implementation: {PABITS: 56}
    linear_address: 0x1234000000001000
    expected:
      event: ACCESS_FAULT
      cause: PHYSICAL_ADDRESS
    purpose: A paging-disabled direct address must fit implementation PABITS.

  - id: aligned_upper_byte_leaf
    control: {PE: 1, LA57: 1}
    linear_address: 0x0000123456789abc
    walk:
      - {level: 5, result: valid_table}
      - {level: 4, result: valid_table}
      - {level: 3, result: valid_leaf, physical_base: 0x0000000040000000}
    expected:
      memory_system_address: 0x0000000056789abc
      leaf_level: 3
      lower_pte_reads: 0
    purpose: A naturally aligned T=0 entry terminates an upper-level walk and uses every lower linear-address bit as its byte offset.

  - id: misaligned_upper_byte_leaf
    control: {PE: 1, LA57: 0}
    linear_address: 0x0000000000000000
    walk:
      - {level: 4, result: valid_table}
      - {level: 3, result: leaf, physical_base: 0x0000000040001000}
    expected:
      event: PAGE_FAULT
      cause: MALFORMED_PTE
      walk_level: 3
    purpose: A consumed upper byte leaf whose physical base is not aligned to its level-sized mapping is malformed.

  - id: upper_leaf_bit7_equivalent
    control: {PE: 1, LA57: 0}
    linear_address: 0x0000000000000000
    walk:
      - {level: 4, result: valid_table}
      - {level: 3, result: valid_leaf_a_one, physical_base: 0x0000000040000000}
    expected:
      memory_system_address: 0x0000000040000000
      accessed: true
      PTQUERY_result_contains_a: true
    purpose: Bit 7 is the A field, does not enter address formation, and is returned raw by PTQUERY.

  - id: query_stops_at_upper_leaf
    control: {PE: 1, LA57: 0}
    linear_address: 0x0000000012345123
    walk:
      - {level: 4, result: valid_table}
      - {level: 3, result: valid_leaf, physical_base: 0x0000000040000000}
    expected:
      VTOP: {success: true, value: 0x0000000052345123, leaf_level: 3}
      PTQUERY_L3: {success: true, result: raw_leaf}
      PTQUERY_L2: {success: false, result: 0, lower_pte_reads: 0}
    purpose: VTOP reports an early leaf, PTQUERY reports it at its level, and neither query traverses below it.

  - id: cross_page_qword_second_not_present
    control: {PE: 1}
    access: {kind: store, linear_address: 0x0000000000000ffc, width_bytes: 8}
    pages:
      - {linear_page: 0x0000000000000000, result: valid_writable}
      - {linear_page: 0x0000000000001000, result: not_present, walk_level: 1}
    expected:
      event: PAGE_FAULT
      cause: NOT_PRESENT
      walk_level: 1
      visible_store_bytes: 0
      changed_leaf_d_bits: 0
      earlier_consumed_a_update: permitted

  - id: cross_page_first_fault_has_priority
    control: {PE: 1}
    access: {kind: load, linear_address: 0x0000000000000ffc, width_bytes: 8}
    pages:
      - {linear_page: 0x0000000000000000, result: permission_fault, walk_level: 2}
      - {linear_page: 0x0000000000001000, result: not_present, walk_level: 1}
    expected:
      event: PAGE_FAULT
      cause: PERMISSION
      walk_level: 2

  - id: cross_page_qword_second_permission
    control: {PE: 1}
    access: {kind: store, linear_address: 0x0000000000000ffc, width_bytes: 8}
    pages:
      - {linear_page: 0x0000000000000000, result: valid_writable}
      - {linear_page: 0x0000000000001000, result: permission_fault, walk_level: 1}
    expected:
      event: PAGE_FAULT
      cause: PERMISSION
      walk_level: 1
      visible_store_bytes: 0
      changed_leaf_d_bits: 0
      earlier_consumed_a_update: permitted

  - id: cross_page_second_bus_error
    control: {PE: 1}
    access: {kind: store, linear_address: 0x0000000000000ffc, width_bytes: 8}
    pages:
      - {linear_page: 0x0000000000000000, result: valid_writable}
      - {linear_page: 0x0000000000001000, result: valid_writable}
    data_access:
      - {linear_page: 0x0000000000000000, result: acknowledged}
      - {linear_page: 0x0000000000001000, result: bus_error}
    expected:
      event: BUS_ERROR
      visible_store_bytes: 0
      changed_leaf_d_bits: 0

  - id: cross_page_instruction_fetch_permission
    control: {PE: 1}
    access: {kind: instruction_fetch, linear_address: 0x0000000000000ff8, record_bytes: 18}
    pages:
      - {linear_page: 0x0000000000000000, result: valid_executable}
      - {linear_page: 0x0000000000001000, result: execute_permission_fault, walk_level: 1}
    expected:
      event: PAGE_FAULT
      cause: PERMISSION
      walk_level: 1
      decode_started: false
      operand_evaluation_started: false
      earlier_consumed_a_update: permitted

  - id: table_rwx_leaf_am_composition
    control: {PE: 1}
    walk:
      - {level: 4, result: valid_table, permissions: RWX, U: 1}
      - {level: 3, result: valid_table, permissions: RX, U: 1}
      - {level: 2, result: valid_table, permissions: RWX, U: 1}
      - {level: 1, result: valid_leaf, AM: RW, U: 1}
    expected: {effective_permissions: R, access_class: Normal}
    purpose: Table bitmaps intersect the leaf AM permission while the leaf alone selects access class.

  - id: device_mapped_normal_fault
    control: {PE: 1}
    access: {kind: load, linear_address: 0x0000000000004000, width_bytes: 4}
    leaf: {AM: R, CP: 0, physical_class: Device}
    expected: {event: PAGE_FAULT, cause: MEMORY_TYPE}
    purpose: A Normal AM cannot weaken the platform-owned Device physical class.

  - id: mmio_operation_precedes_alignment
    control: {PE: 1}
    access: {kind: atomic, linear_address: 0x0000000000004002, width_bytes: 8}
    leaf: {AM: MMIO_RW, CP: 0, physical_class: Device}
    expected: {event: ACCESS_FAULT, cause: MMIO_OPERATION, target_events: 0, changed_leaf_d_bits: 0}
    purpose: A prohibited MMIO operation faults before MMIO or atomic alignment.

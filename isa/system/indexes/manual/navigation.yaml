schema_version: 0

state_groups:
  - id: integer_registers
    members: [R0, R1, R2, R3, R4, R5, R6, R7, R8, R9, R10, R11, R12, R13, R14, R15]
    fields: []
    definition: section:register-model
    readers: Rn source operands and effective-address base or index terms
    writers: writable Rn destinations and effective-address auto-update
  - id: stack_pointer
    members: [SP]
    fields: []
    definition: section:register-model
    readers: stack operations and SP-relative effective addresses
    writers: stack operations and writable SP destinations
  - id: program_counter
    members: [PC]
    fields: []
    definition: section:register-model
    readers: instruction fetch and PC-relative effective addresses
    writers: control transfers, event return, and RESET
  - id: segment_registers
    members: [CS, DS, SS, GS0, GS1, GS2, GS3, GS4, GS5]
    fields: [base_page, e, m, b]
    definition: section:segment-registers
    readers: segment pre-translation, RDSEG, fixed CS reads, and SAVE
    writers: WRSEG, segment-changing control transfers, event return, and RESTORE
  - id: integer_state
    members: [FLAGS, STATUS]
    fields: [Z, N, C, V, IE, PM, RF, TF, NI, EA]
    definition: section:state-register-formats
    readers: condition evaluation, RDFLAGS, RDSTATUS, event entry, and SAVE
    writers: instruction flag results, WRFLAGS, WRSTATUS, event transitions, and RESTORE
  - id: floating_point_registers
    members: [F0, F1, F2, F3, F4, F5, F6, F7, F8, F9, F10, F11, F12, F13, F14, F15]
    fields: []
    definition: section:floating-point-register-model
    readers: floating-point source operands and SAVE
    writers: floating-point destinations and RESTORE
  - id: floating_point_state
    members: [FFLAGS, FSTATUS]
    fields: [NV, DZ, OF, UF, NX, NV_EN, DZ_EN, OF_EN, UF_EN, NX_EN, RM, FTZ, DAZ, DN]
    definition: section:state-register-formats
    readers: floating-point execution, dedicated reads, and SAVE
    writers: floating-point results, dedicated writes, RESET, and RESTORE
  - id: performance_counters
    members: [CYCLE, INSTRET, PTWALK]
    fields: []
    definition: section:performance-counter-discovery
    readers: RDPMC
    writers: architecturally defined counter increment events and RESET

canonical_field_groups:
  - owner: FLAGS
    fields: [Z, N, C, V]
    definition: section:state-register-formats
  - owner: STATUS
    fields: [IE, PM, RF, TF, NI, EA]
    definition: section:state-register-formats
  - owner: PTCR
    fields: [root_page, PABITS_SEL, LA57, PE]
    definition: section:control-registers
  - owner: ASCR
    fields: [ASID, AE]
    definition: section:control-registers
  - owner: ECR
    fields: [MAX_EDEPTH, NMI_P, V]
    definition: section:control-registers
  - owner: URCTL
    fields: [V, STATUS, FLAGS]
    definition: section:control-registers
  - owner: PMC
    fields: [EN]
    definition: section:control-registers
  - owner: PTE
    fields: [P, W, X, U, G, A, D, AT, CP, SW0, T, PFN]
    definition: section:page-table-entry-format
  - owner: instruction_header
    fields: [L]
    definition: section:instruction-header-formats

revision_history:
  unreleased:
    status: Unreleased
    architecture_revision: null
    changes:
      - Closed the CPUID, SAVE/RESTORE, floating-point, cache-maintenance, and effective-address contracts.
      - Defined reset, memory policy, translation, event, repeat, and instruction-encoding boundaries.
      - Defined atomic ordering, paging boundaries, compatibility identity, stack, WAIT/HALT, and conformance contracts.
      - Unified complete-image integer FLAGS writes, retained accrued IEEE-754 FFLAGS, and made REPcc test temporary value-derived conditions.
      - Unified terminology, canonical field names, reference indexes, and revision-history navigation.
  released: []

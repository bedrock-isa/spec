schema_version: 0

events:
  - {class: EXCEPTION, id: 0x00, name: DEBUG_TRACE}
  - {class: EXCEPTION, id: 0x02, name: BREAKPOINT}
  - class: EXCEPTION
    id: 0x03
    name: ILLEGAL_INSTRUCTION
    causes:
      - {id: 0, name: INVALID_OPCODE}
      - {id: 1, name: INVALID_EA_FORM}
      - {id: 2, name: RESERVED_ENCODING}
      - {id: 3, name: UNAVAILABLE_EXTENSION}
      - {id: 4, name: EXPLICIT_ILLEGAL}
      - {id: 5, name: INSUFFICIENT_LENGTH}
      - {id: 6, name: INVALID_OPERAND_RELATION}
  - {class: EXCEPTION, id: 0x08, name: PRIVILEGE_FAULT}
  - class: EXCEPTION
    id: 0x09
    name: PAGE_FAULT
    causes:
      - {id: 0, name: NOT_PRESENT}
      - {id: 1, name: PERMISSION}
      - {id: 2, name: MALFORMED_PTE}
      - {id: 3, name: NONCANONICAL}
      - {id: 4, name: SEGMENT_BOUNDS}
      - {id: 5, name: ATOMIC_ALIGNMENT}
      - {id: 6, name: MEMORY_TYPE}
  - {class: EXCEPTION, id: 0x0A, name: DIVIDE_ERROR}
  - class: EXCEPTION
    id: 0x0B
    name: VECTOR_RANGE_ERROR
    causes:
      - {id: 0, name: LOOP_OFFSET}
      - {id: 1, name: LANE_INDEX}
  - class: EXCEPTION
    id: 0x0C
    name: ACCESS_FAULT
    causes:
      - {id: 0, name: PHYSICAL_ADDRESS}
      - {id: 1, name: MMIO_ALIGNMENT}
      - {id: 2, name: MMIO_OPERATION}
  - class: EXCEPTION
    id: 0x0D
    name: INVALID_CONTROL_STATE
    causes:
      - {id: 0, name: INVALID_SELECTOR}
      - {id: 1, name: RESERVED_BITS}
      - {id: 2, name: INVALID_IMAGE}
      - {id: 3, name: INVALID_TRANSITION}
  - {class: EXCEPTION, id: 0x0E, name: FLOATING_POINT_FAULT}
  - {class: EXCEPTION, id: 0x18, name: DOUBLE_FAULT}
  - {class: EXCEPTION, id: 0x19, name: MACHINE_CHECK}
  - {class: EXCEPTION, id: 0x1A, name: BUS_ERROR}
  - {class: EXCEPTION, id: 0x20, name: SYSTEM_CALL}
  - {class: NMI, id: source, name: NMI}
  - {class: INTERRUPT, id: platform, name: INTERRUPT}
